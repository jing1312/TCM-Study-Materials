": "了解｜doubao习题汇总", "priority": "了解", "isRecall": true, "sourceId": 1, "addedAt": 1780168175413, "suspect": false, "examProb": "常考"}, {"id": "tr-461", "course": "天然药物化学", "type": "简答记忆", "chapter": "1. 总论", "number": "", "title": "答:1水提取液的浓度最好在相对密度", "answerText": "答:1水提取液的浓度最好在相对密度", "options": {}, "answer": "", "mnemonic": "了解｜doubao习题汇总｜(答案待补,以教材为准)", "priority": "了解", "isRecall": true, "sourceId": 1, "addedAt": 1780168175414, "suspect": false, "examProb": "常考"}, {"id": "tr-462", "course": "天然药物化学", "type": "简答记忆", "chapter": "1. 总论", "number": "", "title": "2之间。2溶剂与水提取液应保持一定量比例。第一次用量为水提取液1/2~1/3,以后用量为水提取液1/4~1/6", "answerText": "2之间。2溶剂与水提取液应保持一定量比例。第一次用量为水提取液1/2~1/3,以后用量为水提取液1/4~1/6。3一般萃取3~4次即可。4用氯仿萃取,应避免乳化。可采用旋转混合,改用氯仿:乙醚混合溶剂等。若已形成乳化,应采取破乳措施", "options": {}, "answer": "", "mnemonic": "了解｜doubao习题汇总", "priority": "了解", "isRecall": true, "sourceId": 1, "addedAt": 1780168175416, "suspect": false, "examProb": "常考"}, {"id": "tr-463", "course": "天然药物化学", "type": "简答记忆", "chapter": "1. 总论", "number": "", "title": "答: 轻度乳化可用一金属丝在乳层中搅动。 将乳化层抽滤。 将乳化层加热或冷冻。 分出乳化层更换新的溶剂。 加入", "answerText": "答: 轻度乳化可用一金属丝在乳层中搅动。 将乳化层抽滤。 将乳化层加热或冷冻。 分出乳化层更换新的溶剂。 加入食盐以饱和水溶液或滴入数滴戊醇增加其表面张力,使乳化层破坏", "options": {}, "answer": "", "mnemonic": "了解｜doubao习题汇总", "priority": "了解", "isRecall": true, "sourceId": 1, "addedAt": 1780168175417, "suspect": false, "examProb": "常考"}, {"id": "tr-464", "course": "天然药物化学", "type": "简答记忆", "chapter": "1. 总论", "number": "", "title": "答:利用混合物中各成分在不同的两相中吸附、分配及其亲和力的差异而达到相互分离的方法", "answerText": "答:利用混合物中各成分在不同的两相中吸附、分配及其亲和力的差异而达到相互分离的方法", "options": {}, "answer": "", "mnemonic": "了解｜doubao习题汇总｜(答案待补,以教材为准)", "priority": "了解", "isRecall": true, "sourceId": 1, "addedAt": 1780168175418, "suspect": false, "examProb": "常考"}, {"id": "tr-465", "course": "天然药物化学", "type": "简答记忆", "chapter": "1. 总论", "number": "", "title": "答:凝胶色谱相当于分子筛的作用。凝胶颗粒中有许多网眼,色谱过程中,小分子化合物可进入网眼;大分子化合物被阻滞在", "answerText": "答:凝胶色谱相当于分子筛的作用。凝胶颗粒中有许多网眼,色谱过程中,小分子化合物可进入网眼;大分子化合物被阻滞在颗粒外,不能进入网孔,所受阻力小,移动速度快,随洗脱液先流出柱外;小分子进入凝胶颗粒内部,受阻力大,移动速度慢,后流出柱外", "options": {}, "answer": "", "mnemonic": "了解｜doubao习题汇总", "priority": "了解", "isRecall": true, "sourceId": 1, "addedAt": 1780168175419, "suspect": false, "examProb": "常考"}, {"id": "tr-466", "course": "天然药物化学", "type": "简答记忆", "chapter": "1. 总论", "number": "", "title": "答:判断天然药物化学成分的纯度可通过样品的外观如晶形以及熔点、溶程、比旋度、色泽等物理常数进行判断。纯的化合物", "answerText": "答:判断天然药物化学成分的纯度可通过样品的外观如晶形以及熔点、溶程、比旋度、色泽等物理常数进行判断。纯的化合物外观和形态较为均一,通常有明确的熔点,熔程一般应小于2°C;更多的是采用薄层色谱或纸色谱方法,一般要求至少选择在三种溶剂系统中展开时样品均呈单一斑点,方可判断其为纯化合物", "options": {}, "answer": "", "mnemonic": "了解｜doubao习题汇总", "priority": "了解", "isRecall": true, "sourceId": 1, "addedAt": 1780168175420, "suspect": false, "examProb": "常考"}, {"id": "tr-467", "course": "天然药物化学", "type": "简答记忆", "chapter": "1. 总论", "number": "", "title": "答:IR光谱在天然药物化学成分结构研究中具有如下作用:测定分子中的基团;已知化合物的确证;未知成分化学结构的推", "answerText": "答:IR光谱在天然药物化学成分结构研究中具有如下作用:测定分子中的基团;已知化合物的确证;未知成分化学结构的推测与确定;提供化合物分子的几何构型与立体构象的研究信息", "options": {}, "answer": "", "mnemonic": "了解｜doubao习题汇总", "priority": "了解", "isRecall": true, "sourceId": 1, "addedAt": 1780168175421, "suspect": false, "examProb": "常考"}, {"course": "天然药物化学", "sourceId": 6, "addedAt": "2026-05-31", "suspect": false, "type": "选择", "title": "纸层析属于分配层析, 固定相为:()", "options": {"A": "纤维素", "B": "展开剂中极性较小的溶液", "C": "展开剂中极性较大的溶液", "D": "水"}, "answer": "D", "chapter": "1. 总论", "isRecall": false, "answerText": "", "mnemonic": "汇集各章习题(sId6)", "id": "tr-996", "number": "", "priority": "重要", "examProb": "了解"}, {"course": "天然药物化学", "sourceId": 6, "addedAt": "2026-05-31", "suspect": false, "type": "选择", "title": "比水重的亲脂性有机溶剂有:", "options": {"A": "CHCl3", "B": "苯", "C": "Et2 O", "D": "石油醚"}, "answer": "A", "chapter": "1. 总论", "isRecall": false, "answerText": "", "mnemonic": "汇集各章习题(sId6)", "id": "tr-998", "number": "", "priority": "重要", "examProb": "了解"}, {"course": "天然药物化学", "sourceId": 6, "addedAt": "2026-05-31", "suspect": false, "type": "选择", "title": "利用溶剂较少提取有效成分较完全的方法是 :", "options": {"A": "连续回流法", "B": "加热回流法", hapter": "4. 醌类化合物", "number": 2, "title": "蒽醌类化合物分哪几类,举例说明。\n蒽醌类、蒽酚类、蒽酮类、二蒽酮类。", "answerText": "蒽醌类分为\n(1)羟基蒽醌类,又分为大黄素型,如大黄素,茜素型如茜草素。\n(2)蒽酚.蒽酮类:为蒽醌的还原产物,如柯亚素。\n(3)二蒽酮和二蒽醌类:如番泻苷类。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0875", "course": "天然药物化学", "type": "简答记忆", "chapter": "4. 醌类化合物", "number": 3, "title": "为什么β-OH 蒽醌比“-OH 蒽醌的酸性大。\n答: 因为β-OH 与羰基处于同一个共轭体系中,受羰基吸电子作用的影响,使羟基上氧的电子云密度降低,质子容易解离,酸性较强。而“-OH 处在羰基的邻位,因产生分子内氢键,质子不易解离,故酸性较弱。", "answerText": "因为β-OH 与羰基处于同一个共轭体系中,受羰基吸电子作用的影响,使羟基上氧的电子云密度降低,质子容易解离,酸性较强。而“-OH 处在羰基的邻位,因产生分子内氢键,质子不易解离,故酸性较弱。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0876", "course": "天然药物化学", "type": "简答记忆", "chapter": "4. 醌类化合物", "number": 4, "title": "比较下列蒽醌的酸性强弱,并利用酸性的差异分离他们,写出流程。\nA. 1, 4, 7-三羟基蒽醌\nB. 1, 5-二 OH-3-COOH 蒽醌\nC. 1, 8-二 OH 蒽醌\nD. 1-CH3 蒽醌", "answerText": "酸性强弱顺序: B>A>C>D\n混 合 物 碱水液(含有 A)\n乙醚液 5%Na2CO3\n乙醚层 5%NaOH", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0877", "course": "天然药物化学", "type": "简答记忆", "chapter": "4. 醌类化合物", "number": 5, "title": "用显色反应区别下列各组成分:\n(1)大黄素与大黄素-8-葡萄糖苷\n(2)番泻苷 A 与大黄素苷\n(3)蒽醌与苯醌\n答:\n醌类化合物分为四种类型: 有苯醌,如 2, 6-二甲氧基对苯醌; 萘醌,如紫草素; 菲醌,如丹参醌Ⅰ; 蒽醌,如大黄酸。\n萘醌\n±%Ő《\n·圧Ő《\nŸìŐ《", "answerText": "(1)将二成分分别用乙醇溶解,分别加 Molish 试剂,产生紫色环的为大黄素-8-葡萄糖苷,不反应的为大黄素。\n(2) 将二成分分别加 5%的氢氧化钠溶液,溶解后溶液显红色的是大黄素苷,溶解后溶液不变红色的为番泻苷 A。\n(3)将二成分分别用乙醇溶解,分别滴于硅胶板上加无色亚甲蓝试剂,在白色背景上与呈现蓝色斑点为苯醌,另一个无反应的是蒽醌。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "必考"}, {"id": "tr-0952", "course": "天然药物化学", "type": "填空记忆", "chapter": "4. 醌类化合物", "number": "9", "title": "醌类化合物的主要类型", , "addedAt": 1780168175481, "suspect": false, "examProb": "常考"}, {"id": "tr-518", "course": "天然药物化学", "type": "填空记忆", "chapter": "4. 醌类化合物", "number": "", "title": "羟基醌类化合物的酸性强弱顺序排列是含COOH>含β-OH>含a-OH", "answerText": "羟基醌类化合物的酸性强弱顺序排列是含COOH>含β-OH>含a-OH", "options": {}, "answer": "", "mnemonic": "重要｜doubao习题汇总", "priority": "重要", "isRecall": true, "sourceId": 1, "addedAt": 1780168175482, "suspect": false, "examProb": "常考"}, {"id": "tr-519", "course": "天然药物化学", "type": "填空记忆", "chapter": "4. 醌类化合物", "number": "", "title": "上述成分分别用乙醇溶解后,分别在滤纸上进行无色亚甲蓝反应,样品在白色背景上与无色亚甲蓝乙醇溶液呈现蓝", "answerText": "上述成分分别用乙醇溶解后,分别在滤纸上进行无色亚甲蓝反应,样品在白色背景上与无色亚甲蓝乙醇溶液呈现蓝色斑点是B和C,无正反应的为A;再分别取B、C样品液,分别加Molish试剂,产生紫色环的为C", "options": {}, "answer": "", "mnemonic": "了解｜doubao习题汇总", "priority": "了解", "isRecall": true, "sourceId": 1, "addedAt": 1780168175483, "suspect": false, "examProb": "常考"}, {"id": "tr-520", "course": "天然药物化学", "type": "填空记忆", "chapter": "4. 醌类化合物", "number": "", "title": "答:将A、B分别加5%的氢氧化钠溶液,溶解后溶液显红色的是B,溶解后溶液不变红色的为A", "answerText": "答:将A、B分别加5%的氢氧化钠溶液,溶解后溶液显红色的是B,溶解后溶液不变红色的为A", "options": {}, "answer": "", "mnemonic": "了解｜doubao习题汇总", "priority": "了解", "isRecall": true, "sourceId": 1, "addedAt": 1780168175484, "suspect": false, "examProb": "常考"}, {"id": "tr-521", "course": "天然药物化学", "type": "填空记忆", "chapter": "4. 醌类化合物", "number": "", "title": "答:上述成分分别用乙醇溶解,分别做: 1无色亚甲蓝反应,产生正反应的是C和E,无正反应的为A、B、D", "answerText": "答:上述成分分别用乙醇溶解,分别做: 1无色亚甲蓝反应,产生正反应的是C和E,无正反应的为A、B、D 2将C和E分别做Molish反应,产生紫色环的是E,不反应的是C 3将A、B、D分别加碱液,溶液变红色的是B、D,不反应的是A 4将B、D分别做Molish反应,产生紫色环的是D,不反应的是B", "options": {}, "answer": "", "mnemonic": "了解｜doubao习题汇总", "priority": "了解", "isRecall": true, "sourceId": 1, "addedAt": 1780168175485, "suspect": false, "examProb": "常考"}, {"id": "tr-523", "course": "天然药物化学", "type": "简答记忆", "chapter": "4. 醌类化合物", "number": "", "title": "蒽醌类化合物分哪几类,举例说明", "answerText": "蒽醌类化合物分哪几类,举例说明", "options": {}, "answer": "", "mnemonic": "了解｜doubao习题汇总｜(答案待补,以教材为准)", "priority": "了解", "isRecall": true, "sourceId": 1, "addedAt": 1780168175487, "suspect": false, "examProb": "常考"}, {"id": "tr-524", "course": "天然药物化学", "type": "简答记忆", "chapter": "4. 醌类化合物", "number": "", "title": "为什么β-OH醌比a-OH醌的酸性大", "answerText": "为什么β-OH醌比a-OH醌的酸性大", "options": {}, "answer": "", "mnemonic": "了解｜doubao习题汇总｜(答案待补,以教材为准)", "priority": "了解", "isRecall": true, "sourceId": 1, "addedAt": 1780168175488, "suspect": false, "examProb": "常考"}, {"id": "tr-525", "course": "天然药物化学", "type": "简答记忆", "chapter": "4. 醌类化合物", "number": "", "title": "比较下列醌的酸性强弱,并利用酸性的差异分离他们,写出流程。 A.1,4,7-三羟基蒽醌 B.1,5-二OH-3", "answerText": "比较下列醌的酸性强弱,并利用酸性的差异分离他们,写出流程。 A.1,4,7-三羟基蒽醌 B.1,5-二OH-3-COOH蒽醌 C.1,8-二OH蒽醌 D.1-CH3蒽醌", "options": {}, "answer": "", "mnemonic": "重要｜doubao习题汇总", "priority": "重要", "isRecall": true, "sourceId": 1, "addedAt": 1780168175489, "suspect": false, "examProb": "常考"}, {"id": "tr-526", "course": "天然药物化学", "type": "简答记忆", "chapter": "4. 醌类化合物", "number": "", "title": "用显色反应区别下列各组成分: (1)大黄素与大黄素-8-葡萄糖苷 (2)番泻苷A与大黄素苷 (3)蒽配与苯醌", "answerText": "(1)大黄素 vs 大黄素-8-O-葡萄糖苷：醋酸镁反应均阳性(橙红);但游离大黄素能溶于乙醚并被5%碳酸氢钠萃取(显红),其葡萄糖苷因极性大、酸性弱不被碳酸氢钠萃取——可用碱梯度萃取/纸色谱Rf区别。(2)番泻苷A 属二蒽酮苷,加酸水解再氧化可显蒽醌反应;Bornträger(碱液显红)用于区别蒽醌类。关键:游离羟基蒽醌遇碱显红(Bornträger反应),苷与苷元用碳酸氢钠/碳酸钠/氢氧化钠pH梯度区别酸性强弱。", "options": {}, "answer": "", "mnemonic": "必背｜doubao习题汇总", "priority": "必背", "isRecall": true, "sourceId": 1, "addedAt": 1780168175490, "suspect": false, "examProb": "必考"}, {"id": "tr-527", "course": "天然药物化学", "type": "简答记忆", "chapter": "4. 醌类化合物", "number": "", "title": "醌类化合物分为四种类型:有苯醌,如2,6-二甲氧基对苯醌;萘醌,如紫草素;菲醌,如丹参醌I;蒽醌,如大黄酸", "answerText": "醌类化合物分为四种类型:有苯醌,如2,6-二甲氧基对苯醌;萘醌,如紫草素;菲醌,如丹参醌I;蒽醌,如大黄酸", "options": {}, "answer": "", "mnemonic": "了解｜doubao习题汇总｜(答案待补,以教材为准)", "priority": "了解", "isRecall": true, "sourceId": 1, "addedAt": 1780168175491, "suspect": false, "examProb": "必考"}, {"id": "tr-528", "course": "天然药物化学", "type": "简答记忆", "chapter": "4. 醌类化合物", "number": "", "title": "蒽醌类分为 (1)羟基醌类,又分为大黄素型,如大黄素,茜素型如茜草素。 (2)蒽酚.蒽酮类:为蒽醌的还原产物,", "answerText": "蒽醌类分为 (1)羟基醌类,又分为大黄素型,如大黄素,茜素型如茜草素。 (2)蒽酚.蒽酮类:为蒽醌的还原产物,如柯亚素。 (3)二蒽酮和二蒽类:如番泻苷类", "options": {}, "answer": "", "mnemonic": "必背｜doubao习题汇总", "priority": "必背", "isRecall": true, "sourceId": 1, "addedAt": 1780168175492, "suspect": false, "examProb": "必考"}, {"id": "tr-529", "course": "天然药物化学", "type": "简答记忆", "chapter": "4. 醌类化合物", "number": "", "title": "答因为β-OH与羰基处于同一个共轭体系中,受羰基吸电子作用的影响,使羟基上氧的电子云密度降低,质子容易解离,酸", "answerText": "答因为β-OH与羰基处于同一个共轭体系中,受羰基吸电子作用的影响,使羟基上氧的电子云密度降低,质子容易解离,酸性较强。而a-OH处在羰基的邻位,因产生分子内氢键,质子不易解离,故酸性较弱", "options": {}, "answer": "", "mnemonic": "了解｜doubao习题汇总", "priority": "了解", "isRecall": true, "sourceId": 1, "addedAt": 1780168175493, "suspect": false, "examProb": "常考"}, {"id": "tr-530", "course": "天然药物化学", "type": "简答记忆", "chapter": "4. 醌类化合物", "number": "", "title": "答:酸性强弱顺序:B>A>C>D 乙醚液 5%NaHCO3→乙醚层 5%NaOH", "answerText": "答:酸性强弱顺序:B>A>C>D 乙醚液 5%NaHCO3→乙醚层 5%NaOH", "options": {}, "answer": "", "mnemonic": "重要｜doubao习题汇总｜(答案待补,以教材为准)", "priority": "重要", "isRecall": true, "sourceId": 1, "addedAt": 1780168175494, "suspect": false, "examProb": "常考"}, {"id": "tr-531", "course": "天然药物化学", "type": "简答记忆", "chapter": "4. 醌类化合物", "number": "", "title": "答: (1)将二成分分别用乙醇溶解,分别加Molish试剂,产生紫色环的为大黄素-8-葡萄糖苷,不反应的为大黄", "answerText": "答: (1)将二成分分别用乙醇溶解,分别加Molish试剂,产生紫色环的为大黄素-8-葡萄糖苷,不反应的为大黄素。 (2)将二成分分别加5%的氢氧化钠溶液,溶解后溶液显红色的是大黄素苷,溶解后溶液不变红色的是潘泻苷A。 (3)将二成分分别用乙醇溶解,分别滴于硅胶板上加无色亚甲蓝试剂,在白色背景上与呈现蓝色斑点为苯醒,另一个无反应的是蒽醌", "options": {}, "answer": "", "mnemonic": "必背｜doubao习题汇总", "priority": "必背", "isRecall": true, "sourceId": 1, "addedAt": 1780168175495, "suspect": false, "examProb": "必考"}, {"id": "tr-532", "course": "天然药物化学", "type": "简答记忆", "chapter": "4. 醌类化合物", "number": "", "title": "某中药主要含有大黄酸、大黄素、大黄素甲醚,三种成分的氧苷试完成下列问题。 (1)如何鉴定药材中含有该类成分?", "answerText": "某中药主要含有大黄酸、大黄素、大黄素甲醚,三种成分的氧苷试完成下列问题。 (1)如何鉴定药材中含有该类成分? (2)试设计从该中药中提取、分离三种苷元的流程", "options": {}, "answer": "", "mnemonic": "必背｜doubao习题汇总", "priority": "必背", "isRecall": true, "sourceId": 1, "addedAt": 1780168175496, "suspect": false, "examProb": "必考"}, {"id": "tr-533", "course": "天然药物化学", "type": "简答记忆", "chapter": "4. 醌类化合物", "number": "", "title": "某中药中含有下列成分,试提取并分离出其中的蒽醌类成分 (4)树胶 (5)蛋白质 (6)淀粉 (7)氨基酸", "answerText": "某中药中含有下列成分,试提取并分离出其中的蒽醌类成分 (4)树胶 (5)蛋白质 (6)淀粉 (7)氨基酸", "options": {}, "answer": "", "mnemonic": "了解｜doubao习题汇总｜(答案待补,以教材为准)", "priority": "了解", "isRecall": true, "sourceId": 1, "addedAt": 1780168175497, "suspect": false, "examProb": "常考"}, {"id": "tr-534", "course": "天然药物化学", "type": "简答记忆", "chapter": "4. 醌类化合物", "number": "", "title": "中药虎杖中含有大黄素、大黄酚、大黄素甲醚、大黄素-8-D-葡萄糖苷、大黄素甲醚-8-D-葡萄糖苷、白蒙芦醇、白", "answerText": "中药虎杖中含有大黄素、大黄酚、大黄素甲醚、大黄素-8-D-葡萄糖苷、大黄素甲醚-8-D-葡萄糖苷、白蒙芦醇、白藜芦醇葡萄糖苷等成分,试设计从虎杖中提取分离游离醒的流程", "options": {}, "answer": "", "mnemonic": "必背｜doubao习题汇总", "priority": "必背", "isRecall": true, "sourceId": 1, "addedAt": 1780168175498, "suspect": false, "examProb": "必考"}, {"id": "tr-535", "course": "天然药物化学", "type": "简答记忆", "chapter": "4. 醌类化合物", "number": "", "title": "中药萱草根中含有大黄酸、大黄酚、决明意、决明意型甲醛、β谷笛醇等成分,试设计提取分离流程", "answerText": "系统溶剂法+pH梯度萃取:①药材乙醇(或乙醚)提取得总蒽醌;②乙醚液依次用5%NaHCO₃→5%Na₂CO₃→1%NaOH→5%NaOH梯度萃取,按酸性强弱分离:大黄酸(含-COOH,酸性最强)入NaHCO₃层;含β-酚OH(如大黄素)入Na₂CO₃层;仅含α-酚OH者需NaOH;③β-谷甾醇为亲脂性甾醇,留乙醚层,经硅胶柱色谱分离。利用游离蒽醌酸性差异(COOH>2个β-OH>1个β-OH>α-OH)实现分离。", "options": {}, "answer": "", "mnemonic": "必背｜doubao习题汇总", "priority": "必背", "isRecall": true, "sourceId": 1, "addedAt": 1780168175499, "suspect": false, "examProb": "必考"}, {"id": "tr-540", "course": "天然药物化学", "type": "简答记忆", "chapter": "4. 醌类化合物", "number": "", "title": "5%氢氧化钠水溶液呈深红色:示有羟基蒽醌类", "answerText": "5%氢氧化钠水溶液呈深红色:示有羟基蒽醌类", "options": {}, "answer": "", "mnemonic": "了解｜doubao习题汇总｜(答案待补,以教材为准)", "priority": "了解", "isRecall": true, "sourceId": 1, "addedAt": 1780168175506, "suspect": false, "examProb": "常考"}, {"id": "tr-541", "course": "天然药物化学", "type": "简答记忆", "chapter": "4. 醌类化合物", "number": "", "title": "a-萘酚-浓硫酸阴性:示有不是苷类物质", "answerText": "a-萘酚-浓硫酸阴性:示有不是苷类物质", "options": {}, "answer": "", "mnemonic": "了解｜doubao习题汇总｜(答案待补,以教材为准)", "priority": "了解", "isRecall" >8.5。", "answerText": "黄酮类化合物所显颜色与分子中是否存在 及 的数目和位置有关。如果在 7 或 4/位上引入 能促使电子转移和重排, 使颜色 。花色素及其苷的颜色随 pH 值不同而改变, pH 显红色, pH 显紫色, pH 显蓝色。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0882", "course": "天然药物化学", "type": "填空记忆", "chapter": "5. 黄酮类化合物", "number": 6, "title": "橙红色至紫红;异黄酮;查耳酮;四氢硼钠(钾);紫色至紫红色。", "answerText": "盐酸-镁粉反应是鉴定黄酮类化合物最常用的方法,黄酮(醇)、二氢黄酮(醇)还原后显 色; 和 不呈色。 试剂反应是二氢黄酮 (醇)类专属性较高的一种试剂,反应后呈 色,可用于与其它黄酮类区别。", "options": {}, "answer": null, "mnemonic": " [合并自tr-567(sId1)]", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "必考"}, {"id": "tr-0883", "course": "天然药物化学", "type": "填空记忆", "chapter": "5. 黄酮类化合物", "number": 12, "title": "酰胺基;游离酚羟基;氢键缔合;羟基数目和位置;水和醇;异黄酮;二氢黄酮;黄酮;黄酮醇。", "answerText": "聚酰胺色谱法是通过聚酰胺分子上的 与黄酮类化合物分子上的 形成 而产生吸附。吸附强度取决于黄酮类化合物 , 以及溶剂与黄酮类化合物或与聚酰胺之间形成氢键缔合能力大小。常用 混合溶剂作为洗脱剂,不同类型黄酮类化合物在聚酰胺柱上先后流出顺序为: > > > 。", "options": {}, "answer": null, "mnemonic": " [合并自tr-573(sId1)]", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "必考"}, {"id": "tr-0884", "course": "天然药物化学", "type": "填空记忆", "chapter": "5. 黄酮类化合物", "number": 13, "title": "黄芩苷;抗菌消炎;邻三酚羟基;醌类;酶解;氧化。", "answerText": "黄芩根中分离出黄酮类的主要有效成分是 具有 作用。黄芩素分子中具有 的结构,性质不稳定,易被氧化成 化合物而变绿色。因此在保存、炮制、提取时应注意防止 和 。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0885", "course": "天然药物化学", "type": "简答记忆", "chapter": "5. 黄酮类化合物", "number": 4, "title": "试述二氢黄酮.异黄酮.花色素水溶液性比黄酮大的原因。", "answerText": "二氢黄酮(醇)由于 C 环被氢化成近似半椅式结构,破坏了分子的平面性,受\n吡喃环羰基立体结构的阻碍,平面性降低,水溶性增大;花色素虽为平面结构,但以离子形式存在,具有盐的通性,所以水溶性较大。", "options": {}, "answer": null, "mnemonic": " [合并自tr-589(sId1)]", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0886", "course": "天然药物化学", "type": "简答记忆", "chapter": "5. 黄酮类化合物", "number": 7, "title": "根据下列流程,指出划线部分的作用,并回答相关问题\n槐花粗粉\n芸香苷结晶\n(1)流程中采用的提取方法与依据是什么?\n(2)提取液中加入 0.4%硼砂水的目的?\n(3)以石灰乳调 pH8~9 的目的?如果 pH>12 以上会造成什么结果?\n(4)酸化时加盐酸为什么控制 pH 在 4-5?如果 pH<2 以上会造成什么结果?\n(5)以热水或乙醇重结晶的依据?提取芸香苷还可以采用什么方法?", "answerText": "(1)流程中采用的提取方法是:碱提取酸沉淀法依据:芸香苷显酸性可溶于碱水。\n(2)提取液中加入 0.4%硼砂水的目的:硼砂可以与邻二羟基络合,保护邻二羟基不被氧化。\n(3)以石灰乳调pH8~9 的目的: 芸香苷含有 7-OH, 4, -OH,碱性较强可以溶于pH8~9 的碱水中。如果 pH>12 以上,碱性太强,钙离子容易与羟基、羰基形成难溶于水的鳌合物,降低收率。\n(4)酸化时加盐酸为什么控制 pH 在4-5 足以是芸香苷析出沉淀,如果 pH<2 以上容易使芸香苷的醚键形成金羊盐,不易析出沉淀。\n(5) 以热水或乙醇重结晶的依据是:芸香苷在热水和热乙醇中溶解度较大,在冷水及冷乙醇中溶解度较小的原因。提取芸香苷还可以采用乙醇回流提取法。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0949", "course": "天然药物化学", "type": "简答记忆", "chapter": "5. 黄酮类化合物", "number": "6", "title": "黄酮类化合物与金属盐试剂的显色反应", "answerText": "①铝盐:常用1%三氯化铝或硝酸铝溶液,生成黄色络合物并有荧光,可用于定性及定量。②铅盐:常用1%中性醋酸铅及碱式醋酸铅水溶液,生成黄~红色沉淀,一般酚羟基化合物均可沉淀,用于鉴定、提取分离。③锆盐(ZrOCl₂):黄酮分子中有游离3-或5-羟基时生成黄色络合物,但加入枸橼酸后5-羟基黄酮酮颜色褪去、3-羟基黄酮酮颜色不变(锆-枸橼酸反应,可区分3-OH与5-OH)。④镁盐:常用醋酸镁甲醇溶液,二氢黄酮、二氢黄酮醇显天蓝色荧光,黄酮、黄酮醇及异黄酮显黄~橙黄~褐色。⑤锶盐:常用氯化锶的碱性甲醇溶液,用于鉴别具邻二酚羟基的化合物。", "options": {}, "answer": "", "mnemonic": "必背｜星空历年真题", "priority": "必背", "isRecall": true, "sourceId": 4, "addedAt": 1780232235676, "suspect": false, "examProb": "必考"}, {"id": "tr-0961", "course": "天然药物化学", "type": "简答记忆", "chapter": "5. 黄酮类化合物", "number": "103", "title": "黄酮类化合物的化学检识(Mg-HCl等)与UV解析思路", "answerText": "化学检识:Mg-HCl反应(盐酸-镁粉)阳性、FeCl₃反应阳性→含酚羟基的黄酮类;Molish反应阴性→不含糖;ZrOCl₂-枸橼酸呈黄色后褪色→有游离5-OH、无游离3-OH;SrCl₂阴性→不具邻位酚羟基。UV(加诊断试剂):带Ⅰ~328nm证实黄酮;NaOMe带Ⅰ红移~51nm示4'-OH;NaOAc带Ⅱ红移~12nm示游离7-OH;NaOAc/H₃BO₃带Ⅰ、Ⅱ无变化示无邻二酚羟基。综合可推得如5,7-二羟基-4'-OMe-黄酮。", "options": {}, "answer": "", "mnemonic": "必背｜星空历年真题", "priority": "必背", "isRecall": true, "sourceId": 4, "addedAt": 1780232269784, "suspect": false, "examProb": "必考"}, {"id": "tr-0962", "course": "天然药物化学", "type": "简答记忆", "chapter": "5. 黄酮类化合物", "number": "104", "title": "黄酮¹H-NMR解析(活泼氢与芳环质子)", "answerText": "¹H-NMR:δ12.91(1H,s,OH)、10.85(1H,s,OH)示两个游离酚羟基;δ8.03(2H,d,J=8.8Hz)、7.10(2H,d,J=8.8Hz)为B环质子,B环为1,4-二取代;δ6.86(1H,s)、6.47(1H,d,J=1.8Hz)、6.19(1H,d,J=1.8Hz)为A环质子,J=1.8Hz示间位偶合。结合UV可定结构。", "options": {}, "answer": "", "mnemonic": "必背｜星空历年真题", "priority": "必背", "isRecall": true, "sourceId": 4, "addedAt": 1780232269785, "suspect": false, "examProb": "必考"}, {"course": "天然药物化学", "sourceId": 6, "addedAt": "2026-05-31", "suspect": false, "type": "选择", "title": "黄酮类化合物的紫外光谱中,峰带 I 很强,而带酮很弱的化合物是", "options": {"A": "查耳酮", "B": "异黄酮", "C": "黄酮醇", "D": "黄酮"}, "answer": "A", "chapter": "5. 黄酮类化合物", "isRecall": false, "answerText": "", "mnemonic": "汇集各章习题(sId6)", "id": "tr-1018", "number": "", "priority": "重要", "examProb": "了解"}, {"course": "天然药物化学", "sourceId": 6, "addedAt": "2026-05-31", "suspect": false, "type": "选择", "title": "在黄酮、黄酮醇的UV光谱中, 若“样品+AlCl3/HCl”的光谱等于“样品+MeOH”的光谱,则表明结构中:", "options": {"A": "无3-OH或5-OH (或均被取代)", "B": "有3-OH,无5-OH", "C": "有3-OH或5-OH", "D": "有5-OH,无3-OH"}, "answer": "A", "chapter": "5. 黄酮类化合物", "isRecall": false, "answerText": "", "mnemonic": "汇集各章习题(sId6);(原卷答案疑误,已据教材订正:原对→正A)", "id": "tr-1019", "number": "", "priority": "重要", "examProb": "了解"}, {"course": "天然药物化学", "sourceId": 6, "addedAt": "2026-05-31", "suspect": false, "type": "选择", "title": "采用碱提酸沉法提取芦丁所用的碱的是", "options": {"A": "碳酸氢钠", "B": "碳酸钠", "C": "石灰乳", "D": "氢氧化钠"}, "answer": "C", "chapter": "5. 黄酮类化合物", "isRecall": false, "answerText": "", "mnemonic": "汇集各章习题(sId6)", "id": "tr-1021", "number": "", "priority": "重要", "examProb": "了解"}, {"course": "天然药物化学", "sourceId": 6, "addedAt": "2026-05-31", "suspect": false, "type": "选择", "title": "某中药水提取液中,在进行HCl-Mg粉反应时, 加入Mg粉无颜色变化, 加入浓HCl则有颜色变化, 只加浓HCl不加Mg粉也有红色出现, 加水稀释后红色也不褪去,则该提取液中可确定含有:", "options": {"A": "异黄酮", "B": "黄酮醇", "C": "花色素", "D": "黄酮类"}, "answer": "C", "chapter": "5. 黄酮类化合物", "isRecall": false, "answerText": "", "mnemonic": "汇集各章习题(sId6)", "id": "tr-1022", "number": "", "priorit rText": "脑,薄荷脑。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0897", "course": "天然药物化学", "type": "填空记忆", "chapter": "6. 萜类与挥发油", "number": 8, "title": "含有醛基的挥发油成分可以用 反应给以分离,含有醇类成分的挥发油成分可以用 法与其它成分分离。", "answerText": "Girard T(P) ,邻苯二甲酸酐。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0898", "course": "天然药物化学", "type": "填空记忆", "chapter": "6. 萜类与挥发油", "number": 9, "title": "环烯醚萜类多以苷类形式存在,水解生成的苷元为 结构,遇氨基酸或者与皮肤接触可以发生颜色变化。", "answerText": "半缩醛。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0899", "course": "天然药物化学", "type": "填空记忆", "chapter": "6. 萜类与挥发油", "number": 10, "title": "奥类成分多存在于 高沸点部分,呈兰、紫色,不但溶于石油醚,还可溶于强酸 (60~65%硫酸)。", "answerText": "挥发油。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0900", "course": "天然药物化学", "type": "简答记忆", "chapter": "6. 萜类与挥发油", "number": 3, "title": "用单向二次展开的薄层色谱法检识挥发油中各成分时, 为什么第一次展开所用的展开剂极性最好大于第二次展开所用的展开剂极性?", "answerText": "单向二次展开先用极性稍强的展开剂进行第一次展层, 当展开剂展至薄层板的一半距离时停止, 立即挥去薄层板上的溶剂。此时挥发油中极性较大的成分被分离展开,再改换极性较小的展开剂作第二次展层,极性较小的成分则被展开到终端,从而可使极性小的成分更好地分离展开,达到在一块薄层板上实现极性大小不同的多种成分都得到较好分离的目的。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0901", "course": "天然药物化学", "type": "简答记忆", "chapter": "6. 萜类与挥发油", "number": 6, "title": "为什么可用相对密度小于 1.0 的挥发油测定器测定相对密度大于 1.0 的挥发油含量?", "answerText": "测定相对密度大于 1.0 的挥发油,也可在相对密度小于 1.0 的测定器中进行。关键是在加热前,预先加入 1ml 二甲苯于测定器内, 然后再进行水蒸气蒸馏, 使蒸出的相对密度大于 1.0 的挥发油溶于二甲苯中。由于二甲苯的相对密度为0.8969,一般能使挥发油与二甲苯的混合溶液浮于水面.在计 ", "course": "天然药物化学", "type": "名词解释记忆", "chapter": "8. 甾体及其苷类", "number": 6, "title": "强心苷", "answerText": "强心苷:是生物界中一类对心脏具有显著生物活性的甾体苷类化合物。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0919", "course": "天然药物化学", "type": "名词解释记忆", "chapter": "8. 甾体及其苷类", "number": 8, "title": "乙型强心苷元(海葱甾烯或蟾酥甾烯)", "answerText": "乙型强心苷元(海葱甾烯或蟾酥甾烯): C17 位连接的是六元不饱和内酯(△ α(β), Y(δ)-δ-内酯)环称为海葱甾烯或蟾酥甾烯。由 24 个碳原子组成。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0920", "course": "天然药物化学", "type": "填空记忆", "chapter": "8. 甾体及其苷类", "number": 1, "title": "去乙酰毛花洋地黄苷丙是从 叶子中提取的,它的商品名是 。经过 解可以进一步获得临床上应用的狄高辛。", "answerText": "毛花洋地黄,西地兰,酶。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0921", "course": "天然药物化学", "type": "填空记忆", "chapter": "8. 甾体及其苷类", "number": 2, "title": "甾体皂苷除了本身的药用价值外,其苷元可以作为 原料。", "answerText": "合成激素类药物(或甾体类药物)。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0922", "course": "天然药物化学", "type": "简答记忆", "chapter": "8. 甾体及其苷类", "number": 1, "title": "如何用 IR 区分甾体皂苷中的 C25 的构型?", "answerText": "螺甾烷醇型皂苷IR在**980、920、900、860 cm⁻¹**附近有四特征带(E/F环缩酮)。其中**920(B带)与900(A带)两峰相对强度**区分C25构型:**25R(异螺甾烷醇型)A<B**(900<920);**25S(螺甾烷醇型)A>B**(900>920)。", "options": {}, "answer": null, "mnemonic": " [答案据教材手写补全]", "priority": "必背", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "必考"}, {"id": "tr-0923", "course": "天然药物化学", "type": "简答记忆", "chapter": "8. 甾体及其苷类", "number": 2, "title": "写出分离螺甾烷醇型皂苷与呋甾烷醇型皂苷的流程。", "answerText": "利用呋甾烷醇型的**特异显色**与极性差异分离:①总皂苷正丁醇萃取后经**硅胶柱色谱**分离;②**Ehrlich试剂**(对二甲氨基苯甲醛)喷雾,**呋甾烷醇型显红色**(F环开链C22-OH),**螺甾烷醇型不显色**;③呋甾烷醇型极性大(多糖+C22-OH),色谱中Rf小,先洗下螺甾烷醇型,后洗呋甾烷醇型。", "options": {}, "answer": null, "mnemonic": " [答案据教材手写补全]", "priority": "必背", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "必考"}, {"id": "tr-0924", "course": "天然药物化学", "type": "简答记忆", "chapter": "8. 甾体及其苷类", "number": 3, "title": "甾体皂苷的基本结构是什么?可分为几种类型,各自结构有何特征?", "answerText": "甾体皂苷由**螺甾烷类化合物**与糖缩合而成,苷元为27个碳的螺甾烷醇衍生物(含A-F六环,E、F环以螺缩酮形式相连)。按C25构型及F环是否成环分四类:①**螺甾烷醇型**(25S,F环闭环);②**异螺甾烷醇型**(25R);③**呋甾烷醇型**(F环开链,C22-OH);④**变形螺甾烷醇型**。多数无C3-COOH,故多为中性皂苷;无强心苷的不饱和内酯环。", "options": {}, "answer": null, "mnemonic": " [答案据教材手写补全]", "priority": "必背", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "必考"}, {"id": "tr-0925", "course": "天然药物化学", "type": "简答记忆", "chapter": "8. 甾体及其苷类", "number": 7, "title": "提取强心苷原生苷时应注意哪几方面因素?", "answerText": "提取**原生苷**(一级苷)关键是**抑制酶解和酸碱水解**:①新鲜药材**及时干燥或冷冻**,迅速破坏共存水解酶;②可加**硫酸铵**等使酶失活;③**忌用酸、碱**及长时间加热(防苷键及内酯环水解);④多用**>70%乙醇**冷浸或渗漉;⑤铅盐沉淀除杂时条件温和。", "options": {}, "answer": null, "mnemonic": " [答案据教材手写补全]", "priority": "必背", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "必考"}, {"id": "tr-0926", "course": "天然药物化学", "type": "简答记忆", "chapter": "8. 甾体及其苷类", "number": 8, "title": "命名下列化合物:\n洋地黄毒苷元 乌本苷元 海葱苷元", "answerText": "(强心苷元命名题)依甲型/乙型判断:**洋地黄毒苷元**(digitoxigenin,甲型,C3β-OH、C14β-OH、C17接Δαβ-五元不饱和内酯);**乌本苷元**(ouabagenin,甲型,多羟基);**海葱苷元**(scillarenin,**乙型**,C17接六元双烯δ-内酯)。命名要点:标明甾核羟基位置与构型及内酯环类型(甲型五元单烯/乙型六元双烯)。", "options": {}, "answer": null, "mnemonic": " [答案据教材手写补全]", "priority": "必背", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "必考"}, {"id": "tr-0927", "course": "天然药物化学", "type": "简答记忆", "chapter": "8. 甾体及其苷类", "number": 9, "title": "以反应式表示:由毛花洋地黄苷丙 (C)制备临床上应用的强心苷类药物西地兰和狄戈辛。", "answerText": "毛花洋地黄苷丙(lanatoside C)经**碱性水解脱去C16乙酰基并脱末端葡萄糖**生成**西地兰**(去乙酰毛花苷,deslanoside);西地兰经**温和酸水解**调整糖链得**狄戈辛**(digoxin,狄戈辛元+3洋地黄毒糖)。要点:①脱乙酰(碱);②脱葡萄糖;③控制水解保留3去氧糖。", "options": {}, "answer": null, "mnemonic": " [答案据教材手写补全]", "priority": "必背", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "必考"}, {"id": "tr-0928", "course": "天然药物化学", "type": "简答记忆", "chapter": "8. 甾体及其苷类", "number": 10, "title": "影响强心苷水溶性的因素有哪些?", "answerText": "强心苷水溶性取决于**糖的数目和苷元上羟基的数目与位置**:①**糖基越多**水溶性越大;②苷元上**羟基越多**亲水性越强;③糖基为**羟基糖**(如葡萄糖)比**去氧糖**(如洋地黄毒糖)更亲水;④羟基若形成**分子内氢键**则水溶性下降。原生苷一般比次生苷、苷元更易溶于水。", "options": {}, "answer": null, "mnemonic": " [答案据教材手写补全]", "priority": "必背", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "必考"}, {"id": "tr-0950", "course": "天然药物化学", "type": "简答记忆", "chapter": "8. 甾体及其苷类", "number": "7", "title": "强心苷的定义及甲型、乙型的区别", "answerText": "强心苷是存在于植物中具有强心作用的甾体苷类化合物,由强心苷元和糖两部分构成。根据苷元C17位侧链不同分为:侧链为五元不饱和内酯环(Δαβ-γ-内酯)的甲型强心苷,和侧链为六元不饱和内酯环(Δαβ,γδ-δ-内酯)的乙型强心苷。", "options": {}, "answer": "", "mnemonic": "必背｜星空历年真题", "priority": "必背", "isRecall": true, "sourceId": 4, "addedAt": 1780232235677, "suspect": false, "examProb": "必考"}, {"id": "tr-0965", "course": "天然药物化学", "type": "选择", "chapter": "8. 甾体及其苷类", "number": "57", "title": "3 , 5-二硝基苯甲酸反应呈阳性, (Keller-Kiliani)反应呈阴性的是( )", "answerText": "", "options": {"A": "西地兰", "B": "毛花洋地黄苷 C", "C": "毛花洋地黄苷 A", "D": "狄高辛", "E": "铃兰毒苷"}, "answer": "E", "mnemonic": "重要｜习题汇总含答案 [恢复:数字开头化合物名题,曾被片段过滤误删]", "priority": "重要", "isRecall": false, "sourceId": 5, "addedAt": 1780232092253, "suspect": false, "examProb": "了解"}, {"id": "tr-0966", "course": "天然药物化学", "type": "多选", "chapter": "8. 甾体及其苷类", "number": "34", "title": "3 , 5-二硝基苯甲酸反应与占吨氢醇反应均呈阳性的反应是( )( )( )( )( )", "answerText": "", "options": {"A": "红海葱苷", "B": "西地兰", "C": "狄高辛", "D": "去乙酰毛花洋地黄苷A", "E": "毛花洋地黄苷C"}, "answer": "BCDE", "mnemonic": "重要｜习题汇总含答案 [恢复:数字开头化合物名题,曾被片段过滤误删]", "priority": "重要", "isRecall": false, "sourceId": 5, "addedAt": 1780232092288, "suspect": false, "examProb": "了解"}, {"course": "天然药物化学", "sourceId": 6, 原理:\n交换原理: R-SO3-H++BH+ —→ R-SO3-BH+ + H+\n碱化原理: R-SO3-BH++ NH4OH —→ R-SO3-NH4++B+H2O\n(2)酸水渗漉时渗漉液的 pH 变化情况:\n开始渗漉时 pH4~5,继续渗漉有生物碱交换在树脂上,树脂柱流出液 pH1~2,当树脂交换饱和时,流出液 pH4~5。\n(3)划线部分的目的:\n①纯化水冲至澄明,抽滤,室温风干:如果树脂较湿,提取时石油醚不易穿透树脂表面的水化膜,影响提取效果。\n②洗脱至碘化铋钾试剂呈阴性。是说明生物碱提取完全,可以停止回流。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0934", "course": "天然药物化学", "type": "简答记忆", "chapter": "9. 生物碱", "number": 3, "title": "某豆科植物的种子, 经过石油醚充分脱脂后的乙醇提取液浓缩液中主要含有 A、B、C、D 四种成分以及水溶性杂质,将该提取液点样在 pH 缓冲纸色谱上,以水饱和的氯仿展开显色后,将每个成分的斑点连成线结果如下图。\n试回答下列问题;\n⑴A、B、C、D 分别属于哪一类成分?\nA B C D \nx比较 A、B 的 pKa 大小顺序\npKa: >", "answerText": "试回答下列问题:\n⑴ A 、B 、C 、D 分别属于哪一类成分?\nA 弱碱 B 中强碱 C 酚性生物碱 D 酸性成分 \nx 比较 A 、B 的 pKa 大小顺序pKa: B > A", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0956", "course": "天然药物化学", "type": "填空记忆", "chapter": "9. 生物碱", "number": "13", "title": "生物碱的存在形式", "answerText": "生物碱在植物体内存在形式有:游离碱类、盐类、N-氧化物类;提取分离常利用其电子效应和空间效应。", "options": {}, "answer": "", "mnemonic": "必背｜星空历年真题", "priority": "必背", "isRecall": true, "sourceId": 4, "addedAt": 1780232235683, "suspect": false, "examProb": "必考"}, {"course": "天然药物化学", "sourceId": 6, "addedAt": "2026-05-31", "suspect": false, "type": "选择", "title": "碱性最强的生物碱是", "options": {"A": "季胺碱", "B": "叔胺碱", "C": "仲胺碱", "D": "伯胺碱"}, "answer": "A", "chapter": "9. 生物碱", "isRecall": false, "answerText": "", "mnemonic": "汇集各章习题(sId6)", "id": "tr-1056", "number": "", "priority": "重要", "examProb": "了解"}, {"course": "天然药物化学", "sourceId": 6, "addedAt": "2026-05-31", "suspect": false, "type": "选择", "title": "利用高效液相色谱法分离生物碱时,通常使用的流动相为", "options": {"A": "弱酸性", "B": "弱碱性", "C": "中性", "D": "强酸性"}, "answer": "B", "chapter": "9. 生物碱", "isRecall": false, "answerText": "", "mnemonic": "汇集各章习题(sId6)", "id": "tr-1057", "number": "", "priority": 药物化学", "type": "填空记忆", "chapter": "10. 其他", "number": 2, "title": "从海洋生物中分离得到的前列腺素类成分,通常含有 元素。一般都具有 活性。", "answerText": "卤族,抗肿瘤", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0939", "course": "天然药物化学", "type": "填空记忆", "chapter": "10. 其他", "number": 3, "title": "内酯环含有氧环的大环内酯类化合物除内酯环外,还可能含有 、 、 等。", "answerText": "三元氧环,五元氧环,六元氧环。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0940", "course": "天然药物化学", "type": "填空记忆", "chapter": "10. 其他", "number": 4, "title": "酯环上超过一个酯键的大环内酯化合物,称为 。", "answerText": "多聚内酯。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0941", "course": "天然药物化学", "type": "填空记忆", "chapter": "10. 其他", "number": 5, "title": "聚醚类化合物的特点是结构中含有多个以 为主的 环,醚环间 骈合,形成骈合后聚醚的同侧为 结构,氧原子 排列,形成一个梯子状结构,又称 。", "answerText": "六元环,醚,反式,顺式,相间,聚醚梯。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0942", "course": "天然药物化学", "type": "填空记忆", "chapter": "10. 其他", "number": 6, "title": "乙酸原化合物系指从 或 生物合成的一类化合物, 根据结构特点分为以下不同的结构类型: 、 、 、 。", "answerText": "乙酸乙酯,乙酰辅酶 A,直链化合物,环氧化合物,碳环化合物,其它类似乙酸原化合物。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0943", "course": "天然药物化学", "type": "简答记忆", "chapter": "10. 其他", "number": 1, "title": "目前研究发现的海洋天然产物中结构特殊、生理活性明显的化合物主要有哪几种类型?主要表现出什么生物活性?", "answerText": "目前研究发现的海洋天然产物中结构特殊、生理活性明显的化合物主要有以下几种类型及活性:\n①大环内酯类化合物多具有抗肿瘤活性, 有的也可抗菌, 抗病毒。如从海绵 Thenonellswinhoei 中分离得到了具有广谱抗肿瘤活性和抗真菌活性的 swinholide A、B、C 等。②聚醚化合物, 是海洋生物中的一类毒性成分。可抗肿瘤, 作用于神经系统等。如从海绵 (Halichondrai okadai) 中分离得到的 halichondrin B 可抑制小鼠黑色素瘤细胞。③肽类化合物,具有多种生物活性,常见抗肿瘤,抗病毒等,有些已进入临床研究。如从芋螺属类软体动物中得到的芋螺毒素是一类具有神经药理活性的多肽, 具有镇痛、神经保护、抗惊厥、镇咳等作用, 应用潜力巨大, 目前已进入Ⅲ期临床研究。④\nC15 乙酸原化合物。⑤前列腺素类似物, 除表现前列腺素样活性外, 还表现出一定的抗肿瘤活性, 特别是一些含有卤素元素取代的化合物,如从八方珊瑚中分离得到的 punaglandin 作为抗肿瘤药临床研究有效。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0944", "course": "天然药物化学", "type": "简答记忆", "chapter": "10. 其他", "number": 2, "title": "已发现的海洋活性产物按活性分类主要有哪些?", "answerText": "①海洋抗肿瘤物质。从海绵、海兔、软珊瑚等海洋生物中得到了很多具有抗肿瘤活性的大环内酯、聚醚和海洋多肽类物质。②神经作用物质。主要为海洋毒素,如海兔毒素、海参毒素、河豚毒素等可作用于离子通道,对神经系统起作用。③心血管作用物质。如岩沙海葵毒素、类水母毒素等具有降压、抗心率失常等作用。④抗 AID 海洋药物。⑤其它还有免疫抑制、抗结核等作用物质。", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-0945", "course": "天然药物化学", "type": "简答记忆", "chapter": "10. 其他", "number": 3, "title": "简述聚醚类化合物的结构特点。\n\n第十一章 天然产物的研究开发", "answerText": "聚醚类化合物的特点是结构中含有多个以六元环为主的醚环, 醚环间反式骈合, 形成骈合后聚醚的同侧为顺式结构,氧原子相间排列,形成一个梯子状结构,又称聚醚梯。常见聚醚梯类化合物多有无规则取代的甲基等, 一般极性低,为脂溶性毒素。另一类聚醚化合物, 同样含有高度氧化的碳链,但仅部分羟基形成醚环,多数羟基游离,与聚醚梯类化合物不同,属于水溶性聚醚。有的聚醚类化合物可以首尾相连形成大环内酯或局部形成大环。\n\n第十一章 参考答案", "options": {}, "answer": null, "mnemonic": "", "priority": "重要", "isRecall": true, "sourceId": 5, "suspect": false, "addedAt": "2026-05-31", "examProb": "常考"}, {"id": "tr-412", "course": "天然药物化学", "type": "选择", "chapter": "10. 其他", "number": "1", "title": "目前从海参中分离的生物活性成分是", "answerText": "", "options": {"A": "多糖", "B": "萜类", "C": "生物碱", "D": "苷类", "E": "挥发油"}, "answer": "A", "mnemonic": "了解｜doubao习题汇总", "priority": "了解", "isRecall": false, "sourceId": 1, "addedAt": 1780168175365, "suspect": false, "examProb": "了解"}, {"id": "tr-414", "course": "天然药物化学", "type": "多选", "chapter": "10. 其他", "number": "1", "title": "目前从海洋生物中获得的成分有", "answerText": "", "options": {"A": "前列腺素类", "B": "聚醚类化合物", "C": "肽类化合物", "D": "大环内酯类", "E": "C15 乙酸原化合物"}, "answer": "ABCDE", "mnemonic": "了解｜doubao习题汇总", "priority": "了解", "isRecall": false, "sourceId": 1, "addedAt": 1780168175367, "suspect": false, "examProb": "了解"}, {"id": "tr-415", "course": "天然药物化学", "type": "多选", "chapter": "10. 其他", "number": "2", "title": "大环内酯类化合物根据结构不同,根据结构类型不同可以分为", "answerText": "", "options": {"A": "前列腺素类", "B": "简单大环内酯类", "C": "内酯环含有氧环的大环内酯", "D": "多聚内酯", "E": "E. 其他大环内酯类\n二、名词解释"}, "answer": "BCDE", "mnemonic": "了解｜doubao习题汇总", "priority": "了解", "isRecall": false, "sourceId": 1, "addedAt": 1780168175368, "suspect": false, "examProb": "了解"}, {"id": "tr-0816", "course": "天然药物化学", "type": "选择", "chapter": "11. 天然产物的研究开发", "number": "2", "title": "系统预试验的基本过程是( )", "answerText": "", "options": {"A": "47%", "B": "57%", "C": "67%", "D": "77%", "E": "87%"}, "answer": "E", "mnemonic": "重要｜习题汇总含答案 [答案据习题汇总答案键校正:B→E]", "priority": "重要", "isRecall": false, "sourceId": 5, "addedAt": 1780232092336, "suspect": false, "examProb": "了解"}, {"id": "tr-0817", "course": "天然药物化学", "type": "多选", "chapter": "11. 天然产物的研究开发", "number": "1", "title": "水提预试液可检查的成分有( )", "answerText": "", "options": {"A": "前列腺素类", "B": "聚醚类化合物", "C": "肽类化合物", "D": "大环内酯类", "E": "C15 乙酸原化合物"}, "answer": "ABCDE", "mnemonic": "重要｜习题汇总含答案 [答案据习题汇总答案键校正:BCD→ABCDE]", "priority": "重要", "isRecall": false, "sourceId": 5, "addedAt": 1780232092343, "suspect": false, "examProb": "了解"}, {"id": "tr-0818", "course": "天然药物化学", "type": "多选", "chapter": "11. 天然产物的研究开发", "number": "2", "title": "为了提高预试验的准确性,可考虑采用的方法有( )", "answerText": "", "options": {"A": "前列腺素类", "B": "简单大环内酯类", "C": "内酯环含有氧环的大环内酯", "D": "多聚内酯", "E": "其他大环内酯类"}, "answer": "BCDE", "mnemonic": "重要｜习题汇总含答案 [答案据习题汇总答案键校正:ABCDE→BCDE]", "priority": "重要", "isRecall": false, "sourceId": 5, "addedAt": 1780232092344, "suspect": false, "examProb": "了解"}, {"id": "tr-416", "course": "天然药物化学", "type": "选择", "chapter": "11. 天然产物的研究开发", "number": "1", "title": "进行天然药物化学成分预试验时,欲想检查黄酮类的存在,供试液应选择", "answerText": "", "options": {" 异戊二烯单位(C15)构成。该化合物属于(  )", "answerText": "", "options": {"A": "单萜", "B": "倍半萜", "C": "二萜", "D": "二倍半萜"}, "answer": "B", "mnemonic": "倍半萜=C15(3个异戊二烯单位),如青蒿素、莪术醇;单萜C10、二萜C20、二倍半萜C25。【原卷答案键sId6萜类Q11=B;本库早期解析错配为C,已据答案键订正:原C→正B;据答案反推结构描述入库】", "priority": "重要", "isRecall": false, "sourceId": 6, "addedAt": 1780244657269, "suspect": false, "examProb": "常考"}, {"id": "tr-1047", "course": "天然药物化学", "type": "选择", "chapter": "6. 萜类与挥发油", "number": "", "title": "某萜类化合物由4个异戊二烯单位(C20)构成。该化合物属于(  )", "answerText": "", "options": {"A": "单萜", "B": "倍半萜", "C": "二萜", "D": "二倍半萜"}, "answer": "C", "mnemonic": "二萜=C20(4个异戊二烯单位),如紫杉醇、穿心莲内酯、银杏内酯、甜菊苷元。【原卷答案键sId6萜类Q12=C;本库早期解析错配为A,已据答案键订正:原A→正C;据答案反推结构描述入库】", "priority": "重要", "isRecall": false, "sourceId": 6, "addedAt": 1780244657269, "suspect": false, "examProb": "常考"}, {"id": "tr-0790", "course": "天然药物化学", "type": "选择", "chapter": "8. 甾体及其苷类", "number": "", "title": "某甾体皂苷元由27个碳组成,含A、B、C、D、E、F六个环,E/F环以C22螺缩酮形式相连(螺甾烷);C25甲基为直立a键、β型(25S/L型)。该皂苷元属于(  )", "answerText": "", "options": {"A": "螺甾烷醇型皂苷元", "B": "异螺甾烷醇型皂苷元", "C": "呋甾烷醇型皂苷元", "D": "四环三萜皂苷元", "E": "五环三萜皂苷元"}, "answer": "A", "mnemonic": "甾体皂苷元C27、A-F六环、E/F螺缩酮(螺甾烷);**C25甲基a键β型=25S=螺甾烷醇型(L/neo)**,**e键a型=25R=异螺甾烷醇型(D/iso,更稳定)**;呋甾烷醇型=F环开裂。【原卷此题选项被OCR完全打乱(含\"您螺甾烷\"乱字)无法核源答案键;据教材螺甾烷醇型定义重构题干+选项入库,答案A为教材标准;tr-0790/0791原为同一题双胞胎,已合并】", "priority": "重要", "isRecall": false, "sourceId": 5, "addedAt": 1780244657269, "suspect": false, "examProb": "常考"}, {"id": "tr-1198", "course": "天然药物化学", "type": "简答记忆", "chapter": "5. 黄酮类化合物", "number": "", "title": "【母题·每年必考】综合论述黄酮类化合物结构鉴定的主要方法（理化鉴别+显色反应+波谱）", "answerText": "答题要点：①理化性质——多为黄色结晶，溶解性与是否成苷/羟基数有关；②显色反应：盐酸-镁粉反应（还原显红~紫红，鉴别黄酮/黄酮醇/二氢黄酮）、四氢硼钠(NaBH4)反应（二氢黄酮专属，显红~紫）、与金属盐络合（AlCl3显黄色并荧光、醋酸镁、ZrOCl2-枸橼酸区别3-OH/5-OH）、氨性氯化锶（邻二酚羟基）、Molish（黄酮苷检糖）；③酸碱：浓硫酸显色、与碱（如NaOH）显黄~橙；④波谱：UV用诊断试剂（甲醇、NaOMe、AlCl3/AlCl3+HCl、NaOAc、NaOAc+H3BO3）位移判断各位置羟基；¹H/¹³C-NMR、MS定结构与糖连接。结论：综合理化+显色+四大谱，对号确定母核类型和取代位置。", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-03-31 10:28 [03:18]〕｜非真题原题·据课堂整理｜周志望·每年期末必考·分值最大", "priority": "必背", "isRecall": true, "sourceId": 3, "addedAt": 1780244657270, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1199", "course": "天然药物化学", "type": "简答记忆", "chapter": "1. 总论", "number": "", "title": "【母题·必考】简述四大波谱（UV、IR、NMR、MS）在天然产物结构鉴定中的作用", "answerText": "答题要点：①紫外光谱(UV)——反映共轭体系/发色团，黄酮、蒽醌等用诊断试剂位移判断羟基位置；②红外光谱(IR)——反映官能团（羟基、羰基、芳环等特征吸收）；③核磁共振(NMR)——¹H-NMR给出氢的化学位移/积分/裂分，¹³C-NMR给出碳骨架，2D（COSY、HSQC、HMBC）确定连接；④质谱(MS)——给出分子量（分子离子峰）和碎片，软电离可逐级裂解糖以确定糖连接顺序。本课波谱约占1/3内容，必考。", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-03-03 09:38 [02:39]〕｜非真题原题·据课堂整理｜周志望·波谱约占1/3·一定考", "priority": "必背", "isRecall": true, "sourceId": 3, "addedAt": 1780244657271, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1200", "course": "天然药物化学", "type": "简答记忆", "chapter": "1. 总论", "number": "", "title": "【母题】选择提取溶剂的三个原则是什么？", "answerText": "答题要点（三点都要答全，老师强调简答勿只答一点）：①相似相溶——根据被提取成分的极性选择极性相近的溶剂；②溶剂对有效成分溶解度大、对杂质溶解度小（选择性好）；③溶剂安全、价廉易得、操作方便、毒性低、沸点适中易回收，且与药材成分不发生化学反应。", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-03-03 11:18 [10:10]〕｜非真题原题·据课堂整理｜汪玢·简答三点须答全", "priority": "必背", "isRecall": true, "sourceId": 3, "addedAt": 1780244657272, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1201", "course": "天然药物化学", "type": "名词解释记忆", "chapter": "4. 醌类化合物", "number": "", "title": "羟基蒽醌", "answerText": "羟基蒽醌是指蒽醌母核上带有酚羟基的衍生物。含游离酚羟基（尤其α-或β-OH）者在碱性溶液中形成共轭体系而显红~紫红色（Borntrager反应），是蒽醌类的特征鉴别依据。", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-03-27 09:38 [37:13]〕｜非真题原题·据课堂整理｜补醌类名解空缺", "priority": "重要", "isRecall": true, "sourceId": 3, "addedAt": 1780244657273, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1202", "course": "天然药物化学", "type": "名词解释记忆", "chapter": "4. 醌类化合物", "number": "", "title": "Borntrager反应（碱液显色反应）", "answerText": "Borntrager反应是羟基蒽醌类的特征鉴别反应：含游离酚羟基的蒽醌在碱性（NaOH、氨水）条件下因形成共轭酚氧负离子而显红~紫红色，用于蒽醌类成分定性鉴别。", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-03-27 09:38 [37:13]〕｜非真题原题·据课堂整理", "priority": "重要", "isRecall": true, "sourceId": 3, "addedAt": 1780244657274, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1203", "course": "天然药物化学", "type": "简答记忆", "chapter": "1. 总论", "number": "", "title": "【母题】天然药物常用的提取方法有哪些？", "answerText": "答题要点：①溶剂提取法（煎煮法、浸渍法、渗漉法、回流提取法、连续回流提取法/索氏提取）——最常用，依相似相溶选溶剂；②水蒸气蒸馏法——适于挥发性、能随水蒸气蒸馏且不被破坏的成分（如挥发油）；③升华法——适于具升华性的成分；④压榨法；⑤超临界流体萃取法（SFE，常用CO2）——绿色高效。", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-03-06 09:38 [15:00]〕｜非真题原题·据课堂整理｜汪玢·常用提取方法", "priority": "必背", "isRecall": true, "sourceId": 3, "addedAt": 1780244657275, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1204", "course": "天然药物化学", "type": "名词解释记忆", "chapter": "1. 总论", "number": "", "title": "超临界流体萃取法（SFE）", "answerText": "超临界流体萃取法是利用处于临界温度（Tc）和临界压力（Pc）以上的流体（常用超临界CO2）作为萃取剂提取天然产物的方法。超临界流体兼具气体的扩散性和液体的溶解能力，通过调节温度/压力改变其溶解性能，具有提取效率高、选择性好、无溶剂残留、适于热敏成分等优点。", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-03-06 09:38 [16:00]〕｜非真题原题·据课堂整理｜汪玢明言名词解释会考", "priority": "必背", "isRecall": true, "sourceId": 3, "addedAt": 1780244657276, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1205", "course": "天然药物化学", "type": "简答记忆", "chapter": "9. 生物碱", "number": "", "title": "【母题】用生物碱沉淀试剂进行鉴别时，为什么至少要用三种试剂同时检查？操作注意事项？", "answerText": "答题要点：①因部分非生物碱成分（如氨基酸、蛋白质、多糖、脂质等）也能与某些沉淀试剂产生沉淀（假阳性），单一试剂阳性不能确证；故鉴定时至少选用三种不同的生物碱沉淀试剂，均呈阳性才可初步判定含生物碱；②注意事项：在酸性（稀酸）水溶液中进行、控制含水量、沉淀试剂应慢慢滴加而非一次倒入，以避免误判。", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-04-24 10:28 [05:00]〕｜非真题原题·据课堂整理｜毛水春·至少三种沉淀试剂", "priority": "必背", "isRecall": true, "sourceId": 3, "addedAt": 1780244657277, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1206", "course": "天然药物化学", "type": "选择", "chapter": "9. 生物碱", "number": "", "title": "用生物碱沉淀试剂鉴别生物碱时，一般要求（）", "answerText": "", "options": {"A": "只需一种试剂阳性即可确证", "B": "至少用三种沉淀试剂同时检查，避免假阳性", "C": "在强碱条件下进行", "D": "沉淀试剂一次性大量加入"}, "answer": "B", "mnemonic": "🆕课堂强调·补充｜〔2026-04-24 10:28 [05:00]〕｜非真题原题·据课堂整理", "priority": "重要", "isRecall": false, "sourceId": 3, "addedAt": 1780244657278, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1207", "course": "天然药物化学", "type": "选择", "chapter": "8. 甾体及其苷类", "number": "", "title": "强心苷中甾体母核 C17 位上的不饱和内酯环（甲型，五元）可发生的显色反应及其试剂是（）", "answerText": "", "options": {"A": "Legal反应——亚硝酰铁氰化钠（钠盐）", "B": "Molisch反应——α-萘酚", "C": "三氯化铁反应", "D": "茚三酮反应"}, "answer": "A", "mnemonic": "🆕课堂强调·补充｜〔2026-04-14 09:38 [36:00]〕｜非真题原题·据课堂整理｜毛水春·Legal反应可考选择/解答", "priority": "必背", "isRecall": false, "sourceId": 3, "addedAt": 1780244657279, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1208", "course": "天然药物化学", "type": "名词解释记忆", "chapter": "8. 甾体及其苷类", "number": "", "title": "Legal反应（强心苷的显色反应）", "answerText": "Legal反应是强心苷中具α,β-不饱和五元内酯环（甲型强心苷）所含活性次甲基的特征显色反应：在碱性条件下与亚硝酰铁氰化钠（钠盐）作用显红色，用于甲型强心苷的鉴别。", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-04-14 09:38 [35:33]〕｜非真题原题·据课堂整理", "priority": "重要", "isRecall": true, "sourceId": 3, "addedAt": 1780244657280, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1209", "course": "天然药物化学", "type": "简答记忆", "chapter": "3. 苯丙素类化合物", "number": "", "title": "【母题·易混点】香豆素按母核取代情况可分为哪几类？", "answerText": "答题要点：课本通常按母核结构分为4类——①简单香豆素；②呋喃香豆素（线型/角型）；③吡喃香豆素；④其他香豆素（如异香豆素、双香豆素等）。注意：本课老师按取代基不同更细分为6类（在课本4类基础上进一步细化），答题时以老师课堂分类为准并能与课本对应。", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-03-17 09:38 [05:10]〕｜非真题原题·据课堂整理｜老师分6类/课本4类·易混", "priority": "必背", "isRecall": true, "sourceId": 3, "addedAt": 1780244657281, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1210", "course": "天然药物化学", "type": "简答记忆", "chapter": "1. 总论", "number": "", "title": "结晶法与重结晶法的操作有何异同？", "answerText": "答题要点：两者操作过程基本相同（均为利用溶解度差异，热溶解→冷析晶→过滤）；区别在于——结晶是从不纯的提取物中第一次析出晶体的过程；重结晶（穷尽结晶法）是将已得晶体再次溶解、再次结晶以进一步纯化的过程，差别主要体现在母液和纯度上。", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-03-06 09:38 [19:46]〕｜非真题原题·据课堂整理｜考研常考点", "priority": "重要", "isRecall": true, "sourceId": 3, "addedAt": 1780244657282, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1211", "course": "天然药物化学", "type": "简答记忆", "chapter": "2. 糖和苷", "number": "", "title": "【母题】苷类一般对碱稳定，但哪些特殊的苷可在碱性条件下水解？", "answerText": "答题要点：苷一般对碱较稳定（多用碱水解区别于酸），但下列特殊苷能在碱性条件下水解——①酯苷（苷键为酯键，易被碱水解）；②酚苷；③烯醇苷；④β-位有吸电子取代基的苷（如β-硝基、β-羰基等使苷键活化者）。", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-03-13 09:38 [24:44]〕｜非真题原题·据课堂整理｜汪玢·碱水解特殊苷", "priority": "必背", "isRecall": true, "sourceId": 3, "addedAt": 1780244657283, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1212", "course": "天然药物化学", "type": "多选", "chapter": "2. 糖和苷", "number": "", "title": "下列哪些特殊苷可在碱性条件下发生水解（）", "answerText": "", "options": {"A": "酯苷", "B": "酚苷", "C": "烯醇苷", "D": "β-吸电子取代苷", "E": "普通氧苷（醇苷）"}, "answer": "ABCD", "mnemonic": "🆕课堂强调·补充｜〔2026-03-13 09:38 [24:44]〕｜非真题原题·据课堂整理", "priority": "必背", "isRecall": false, "sourceId": 3, "addedAt": 1780244657284, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1213", "course": "天然药物化学", "type": "判断", "chapter": "4. 醌类化合物", "number": "", "title": "苯醌类化合物因易被氧化，多以氢醌（酚）形式存在，游离苯醌常仅存在于新鲜植物中。（　）", "answerText": "", "options": {}, "answer": "对", "mnemonic": "🆕课堂强调·补充｜〔2026-03-17 11:18 [14:31]〕｜非真题原题·据课堂整理｜考过", "priority": "重要", "isRecall": false, "sourceId": 3, "addedAt": 1780244657285, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1214", "course": "天然药物化学", "type": "选择", "chapter": "4. 醌类化合物", "number": "", "title": "关于游离苯酚/苯醌在植物中的存在，正确的是（）", "answerText": "", "options": {"A": "大量稳定存在于干燥药材", "B": "因易氧化，主要存在于新鲜植物中", "C": "不存在于植物", "D": "只存在于动物"}, "answer": "B", "mnemonic": "🆕课堂强调·补充｜〔2026-03-17 11:18 [14:31]〕｜非真题原题·据课堂整理", "priority": "重要", "isRecall": false, "sourceId": 3, "addedAt": 1780244657286, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1215", "course": "天然药物化学", "type": "选择", "chapter": "5. 黄酮类化合物", "number": "", "title": "盐酸-镁粉反应主要用于鉴别下列哪类黄酮（显红~紫红色）（）", "answerText": "", "options": {"A": "查耳酮和橙酮", "B": "黄酮、黄酮醇、二氢黄酮（醇）", "C": "异黄酮", "D": "花色素"}, "answer": "B", "mnemonic": "🆕课堂强调·补充｜〔2026-03-31 10:28 [03:18]〕｜非真题原题·据课堂整理", "priority": "重要", "isRecall": false, "sourceId": 3, "addedAt": 1780244657287, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1216", "course": "天然药物化学", "type": "选择", "chapter": "5. 黄酮类化合物", "number": "", "title": "区别黄酮类化合物3-OH与5-OH常用的显色反应是（）", "answerText": "", "options": {"A": "盐酸-镁粉反应", "B": "二氯氧锆(ZrOCl2)-枸橼酸反应", "C": "Molisch反应", "D": "茚三酮反应"}, "answer": "B", "mnemonic": "🆕课堂强调·补充｜〔2026-03-31 10:28 [03:18]〕｜非真题原题·据课堂整理", "priority": "重要", "isRecall": false, "sourceId": 3, "addedAt": 1780244657288, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1217", "course": "天然药物化学", "type": "名词解释记忆", "chapter": "5. 黄酮类化合物", "number": "", "title": "盐酸-镁粉反应", "answerText": "盐酸-镁粉反应是黄酮类化合物的特征显色反应：在乙醇溶液中加镁粉和浓盐酸，黄酮、黄酮醇、二氢黄酮（醇）等被还原而显红色至紫红色（花色素本身在酸性即显色，需做空白对照），用于黄酮类的鉴别。", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-03-31 10:28 [03:18]〕｜非真题原题·据课堂整理", "priority": "重要", "isRecall": true, "sourceId": 3, "addedAt": 1780244657289, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1218", "course": "天然药物化学", "type": "填空记忆", "chapter": "8. 甾体及其苷类", "number": "", "title": "强心苷按C17位不饱和内酯环的不同分为甲型（____元不饱和内酯环）和乙型（六元不饱和内酯环）。", "answerText": "五（5）", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-04-10 11:18 [10:00]〕｜非真题原题·据课堂整理", "priority": "重要", "isRecall": true, "sourceId": 3, "addedAt": 1780244657290, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1219", "course": "天然药物化学", "type": "填空记忆", "chapter": "8. 甾体及其苷类", "number": "", "title": "甲型强心苷C17位为五元不饱和内酯环（Δαβ-____内酯）。", "answerText": "γ（丁烯）", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-04-10 11:18 [10:30]〕｜非真题原题·据课堂整理", "priority": "了解", "isRecall": true, "sourceId": 3, "addedAt": 1780244657291, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1220", "course": "天然药物化学", "type": "填空记忆", "chapter": "8. 甾体及其苷类", "number": "", "title": "强心苷中能发生Legal反应、Kedde反应等显色反应的结构基础是C17位不饱和内酯环上的______。", "answerText": "活性次甲基（活性亚甲基）", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-04-14 09:38 [35:33]〕｜非真题原题·据课堂整理", "priority": "重要", "isRecall": true, "sourceId": 3, "addedAt": 1780244657292, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1221", "course": "天然药物化学", "type": "判断", "chapter": "4. 醌类化合物", "number": "", "title": "萘醌类化合物在自然界大多以游离态（非苷）形式存在。（　）", "answerText": "", "options": {}, "answer": "对", "mnemonic": "🆕课堂强调·补充｜〔2026-03-17 11:18 [26:42]〕｜非真题原题·据课堂整理｜老师明确\"注意判断题\"", "priority": "重要", "isRecall": false, "sourceId": 3, "addedAt": 1780244657293, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1222", "course": "天然药物化学", "type": "选择", "chapter": "7. 三萜及其苷类", "number": "", "title": "三萜皂苷的水溶液振摇后能产生持久泡沫，这是因为皂苷具有（）", "answerText": "", "options": {"A": "还原性", "B": "表面活性（亲水亲脂两亲性）", "C": "酸性", "D": "挥发性"}, "answer": "B", "mnemonic": "🆕课堂强调·补充｜〔2026-04-14 11:18 [10:00]〕｜非真题原题·据课堂整理", "priority": "重要", "isRecall": false, "sourceId": 3, "addedAt": 1780244657294, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1223", "course": "天然药物化学", "type": "简答记忆", "chapter": "7. 三萜及其苷类", "number": "", "title": "简述皂苷的主要理化性质（发泡性、溶血性、显色反应）", "answerText": "答题要点：①发泡性——皂苷有表面活性，水溶液振摇产生持久泡沫；②溶血性——多数皂苷（尤三萜/甾体皂苷）能破坏红细胞膜引起溶血；③显色反应——Liebermann-Burchard反应（醋酐-浓硫酸，三萜显红~紫，甾体显蓝绿）等，用于皂苷类鉴别；④可与胆甾醇形成沉淀。", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-04-14 11:18 [10:00]〕｜非真题原题·据课堂整理", "priority": "重要", "isRecall": true, "sourceId": 3, "addedAt": 1780244657295, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1224", "course": "天然药物化学", "type": "名词解释记忆", "chapter": "7. 三萜及其苷类", "number": "", "title": "Liebermann-Burchard反应", "answerText": "Liebermann-Burchard反应（醋酐-浓硫酸反应）是三萜及甾体类化合物的特征显色反应：样品溶于醋酐，沿管壁加入浓硫酸，三萜皂苷显红~紫色、甾体皂苷显蓝~绿色，可用于二者的初步区别与鉴别。", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-04-14 11:18 [10:00]〕｜非真题原题·据课堂整理", "priority": "重要", "isRecall": true, "sourceId": 3, "addedAt": 1780244657296, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1225", "course": "天然药物化学", "type": "选择", "chapter": "5. 黄酮类化合物", "number": "", "title": "用质谱(MS)确定黄酮苷中糖的连接位置/顺序时，常利用（）", "answerText": "", "options": {"A": "硬电离一次全裂", "B": "软电离逐级裂解、依次脱去糖基", "C": "紫外位移", "D": "旋光变化"}, "answer": "B", "mnemonic": "🆕课堂强调·补充｜〔2026-03-31 11:18 [40:25]〕｜非真题原题·据课堂整理｜周志望·MS定糖连接", "priority": "重要", "isRecall": false, "sourceId": 3, "addedAt": 1780244657297, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1226", "course": "天然药物化学", "type": "选择", "chapter": "1. 总论", "number": "", "title": "答题时看清卷面问的是\"有效成分的提取方法\"还是\"溶剂提取法中的具体方法\"，这是老师强调的（）", "answerText": "", "options": {"A": "易混淆扣分点", "B": "与提取无关", "C": "同一概念", "D": "仅指蒸馏"}, "answer": "A", "mnemonic": "🆕课堂强调·补充｜〔2026-03-03 11:18 [18:26]〕｜非真题原题·据课堂整理｜汪玢·审题易混点", "priority": "重要", "isRecall": false, "sourceId": 3, "addedAt": 1780244657298, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1228", "course": "天然药物化学", "type": "名词解释记忆", "chapter": "2. 糖和苷", "number": "", "title": "杀酶保苷（灭活）", "answerText": "杀酶保苷是指在采集/加工药材时，采用加热（如蒸、煮）、用沸水或醇等方法迅速破坏（灭活）药材中能水解苷的酶，以防止原生苷被酶解为次生苷，从而保留原生苷的处理措施。", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-03-27 09:38 [08:12]〕｜非真题原题·据课堂整理", "priority": "重要", "isRecall": true, "sourceId": 3, "addedAt": 1780244657300, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1229", "course": "天然药物化学", "type": "名词解释记忆", "chapter": "1. 总论", "number": "", "title": "凝胶过滤法（分子筛过滤/Sephadex LH-20）", "answerText": "凝胶过滤法是利用凝胶（如葡聚糖凝胶Sephadex及其衍生物LH-20）的分子筛作用，按分子大小不同进行分离的色谱方法：大分子先洗脱、小分子后洗脱。Sephadex LH-20为羟丙基化的葡聚糖凝胶，既可在水中也可在有机溶剂中使用，常用于天然产物（如黄酮、苷类）的分离。", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-03-27 09:38 [16:23]〕｜非真题原题·据课堂整理", "priority": "重要", "isRecall": true, "sourceId": 3, "addedAt": 1780244657301, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1230", "course": "天然药物化学", "type": "填空记忆", "chapter": "1. 总论", "number": "", "title": "测定比旋光度时，记录/报告必须注明测定的______和浓度（及溶剂）。", "answerText": "温度", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-04-21 10:28 [29:35]〕｜非真题原题·据课堂整理｜老师强调旋光必写温度浓度", "priority": "重要", "isRecall": true, "sourceId": 3, "addedAt": 1780244657302, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1231", "course": "天然药物化学", "type": "简答记忆", "chapter": "3. 苯丙素类化合物", "number": "", "title": "【母题】香豆素类化合物按结构如何分类？（注意老师讲法与课本的差异）", "answerText": "答题要点：香豆素以苯骈α-吡喃酮为母核。课本通常分为4类——①简单香豆素；②呋喃香豆素（线型如补骨脂内酯、角型如白芷内酯）；③吡喃香豆素；④其他香豆素（如双香豆素、异香豆素等）。老师课堂上进一步细分为6类（在课本4类基础上将\"其他类\"再展开）。答题时按老师课堂口径作答，避免只写一两类。", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-03-10 10:28 [05:10]〕｜非真题原题·据课堂整理｜情报确认·老师6类/课本4类", "priority": "必背", "isRecall": true, "sourceId": 3, "addedAt": 1780244657303, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1232", "course": "天然药物化学", "type": "选择", "chapter": "3. 苯丙素类化合物", "number": "", "title": "香豆素类化合物的基本母核是（）", "answerText": "", "options": {"A": "苯骈γ-吡喃酮", "B": "苯骈α-吡喃酮（顺式邻羟基桂皮酸内酯）", "C": "黄酮母核", "D": "蒽醌母核"}, "answer": "B", "mnemonic": "🆕课堂强调·补充｜〔2026-03-10 10:28 [05:10]〕｜非真题原题·据课堂整理", "priority": "重要", "isRecall": false, "sourceId": 3, "addedAt": 1780244657304, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1233", "course": "天然药物化学", "type": "选择", "chapter": "3. 苯丙素类化合物", "number": "", "title": "香豆素类在紫外光下多显（），且其内酯环在稀碱中可开环、加酸又可环合，此性质常用于鉴别与提取。", "answerText": "", "options": {"A": "无荧光", "B": "蓝色或紫色荧光", "C": "红色荧光", "D": "黑色"}, "answer": "B", "mnemonic": "🆕课堂强调·补充｜〔2026-03-13 10:28 [10:00]〕｜非真题原题·据课堂整理", "priority": "重要", "isRecall": false, "sourceId": 3, "addedAt": 1780244657305, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1234", "course": "天然药物化学", "type": "名词解释记忆", "chapter": "3. 苯丙素类化合物", "number": "", "title": "香豆素的内酯环碱水解（开环-闭环）性质", "answerText": "香豆素具有内酯结构，在稀碱液中内酯环可水解开环生成顺式邻羟基桂皮酸盐（溶于水）；加酸酸化后又可环合恢复为内酯（香豆素）。利用此可逆的开环-闭环性质可对香豆素进行提取、纯化与鉴别（注意长时间强碱加热可发生顺反异构，反式不能再环合）。", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-03-13 10:28 [10:00]〕｜非真题原题·据课堂整理", "priority": "重要", "isRecall": true, "sourceId": 3, "addedAt": 1780244657306, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1235", "course": "天然药物化学", "type": "简答记忆", "chapter": "4. 醌类化合物", "number": "", "title": "【母题】羟基蒽醌类化合物酸性强弱的排序规律是什么？（pH梯度萃取依据）", "answerText": "答题要点：羟基蒽醌酸性强弱取决于羟基位置与数目。一般规律：含—COOH > 含两个以上β-OH（2位等）> 一个β-OH > 两个α-OH > 一个α-OH。即β-羟基酸性强于α-羟基（α-OH与相邻羰基形成分子内氢键，酸性减弱）。据此可用pH梯度萃取法（不同浓度碱液：5%NaHCO₃→5%Na₂CO₃→1%NaOH→5%NaOH）依次分离酸性不同的羟基蒽醌。", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-03-17 10:28 [10:00]〕｜非真题原题·据课堂整理｜醌类重点·pH梯度萃取", "priority": "必背", "isRecall": true, "sourceId": 3, "addedAt": 1780244657307, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1236", "course": "天然药物化学", "type": "选择", "chapter": "4. 醌类化合物", "number": "", "title": "下列羟基蒽醌中，酸性最强的是（）", "answerText": "", "options": {"A": "1-羟基蒽醌（α-OH）", "B": "2-羟基蒽醌（β-OH）", "C": "1,8-二羟基蒽醌（两个α-OH）", "D": "含—COOH的羟基蒽醌"}, "answer": "D", "mnemonic": "🆕课堂强调·补充｜〔2026-03-17 10:28 [10:00]〕｜非真题原题·据课堂整理", "priority": "重要", "isRecall": false, "sourceId": 3, "addedAt": 1780244657308, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1237", "course": "天然药物化学", "type": "填空记忆", "chapter": "4. 醌类化合物", "number": "", "title": "pH梯度萃取分离羟基蒽醌时，使用的碱由弱到强依次为5%NaHCO₃、5%Na₂CO₃、1%NaOH、______。", "answerText": "5%NaOH", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-03-17 10:28 [10:30]〕｜非真题原题·据课堂整理", "priority": "重要", "isRecall": true, "sourceId": 3, "addedAt": 1780244657309, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tr-1238", "course": "天然药物化学", "type": "简答记忆", "chapter": "9. 生物碱", "number": "", "title": "【母题】影响生物碱碱性强弱的主要结构因素有哪些？", "answerText": "答题要点：生物碱碱性强弱主要取决于氮原子的电子云密度及其杂化状态：①氮杂化方式——sp³>sp²>sp（杂化中s成分越多碱性越弱），季铵碱碱性最强；②诱导效应——给电子基增强碱性、吸电子基（如邻位羟基、羰基）减弱碱性；③共轭效应——氮孤对电子参与共轭（如酰胺、芳胺）碱性显著减弱；④空间效应与分子内氢键——质子化后能形成分子内氢键者碱性增强。", "options": {}, "answer": "", "mnemonic": "🆕课堂强调·补充｜〔2026-04-24 10:28 [05:00]〕｜非真题原题·据课堂整理｜毛水春·生物碱碱性", "priority": "必背", "isRecall": true, "sourceId": 3, "addedAt": 1780244657310, "suspect": false, "isPatch": true, "examProb": "必考"}, {"id": "tre-001", "course": "天然药物化学实验", "type": "简答记忆", "chapter": "实验一·虎杖中蒽醌类成分", "number": "目的", "title": "虎杖中蒽醌类成分实验的目的与要求", "answerText": "1、掌握PH梯度法自乙醚提取液中分离游离蒽醌成分。 2、熟悉虎杖中主要成分和性质。 3、熟悉蒽醌类成分的鉴定。", "options": {}, "answer": "", "mnemonic": "必背｜实验指导·目的", "priority": "必背", "isRecall": true, "sourceId": 1, "addedAt": 1780168176200, "examProb": "必考"}, {"id": "tre-002", "course": "天然药物化学实验", "type": "简答记忆", "chapter": "实验一·虎杖中蒽醌类成分", "number": "原理", "title": "虎杖中蒽醌类成分实验的原理(提取/分离依据)", "answerText": "羟基蒽醌类化合物及二苯乙烯类成分,可溶于乙醇中,因此可用乙醇将它们提取出来 。羟基蒽醌类化合物易溶于乙醚等弱极性溶剂,白藜芦醇苷在乙醚中溶解度很小,利用 它们对乙醚的溶解性差异使羟基蒽醌类与白藜芦醇苷分离,再利用各羟基蒽醌类结构上 的不同所表现酸性不同,用PH梯度萃取法分离它们。", "options": {}, "answer": "", "mnemonic": "必背｜实验指导·原理", "priority": "必背", "isRecall": true, "sourceId": 1, "addedAt": 1780168176201, "examProb": "必考"}, {"id": "tre-003", "course": "天然药物化学实验", "type": "简答记忆", "chapter": "实验一·虎杖中蒽醌类成分", "number": "思考1", "title": "归纳本实验提取、分离、鉴定的原理。", "answerText": "【提取】虎杖根茎用乙醇回流提取,得羟基蒽醌类与二苯乙烯类(白藜芦醇苷)成分。【分离】(1)利用对乙醚溶解性差异:游离羟基蒽醌易溶乙醚、白藜芦醇苷难溶,使两类分开;(2)对乙醚液用pH梯度法(碱性递增)分离游离蒽醌:5%NaHCO3先萃出酸性最强的大黄酸(含-COOH),再用5%Na2CO3萃取中等酸性的大黄素(含β-酚OH),最后用1%NaOH萃取酸性最弱的大黄酚、大黄素甲醚(仅α-酚OH)。酸性强弱:含-COOH > 含β-OH(2个) > 含β-OH(1个) > 仅含α-OH,体现羟基蒽醌酸性随酚羟基数目/位置变化的规律。【鉴定】Bornträger反应(碱液显红色)、醋酸镁反应、TLC对照、熔点测定。", "options": {}, "answer": "", "mnemonic": "必背｜实验指导·复习思考题", "priority": "必背", "isRecall": true, "sourceId": 1, "addedAt": 1780168176202, "examProb": "必考"}, {"id": "tre-004", "course": "天然药物化学实验", "type": "简答记忆", "chapter": "实验二·槐花米中芦丁", "number": "目的", "title": "槐花米中芦丁实验的目的与要求", "answerText": "1、掌握酸碱法提取黄酮苷的原理和方法。 2、熟悉化学鉴别试验、苷水解、衍生物制备、熔点和薄层层析等手段在苷类结构鉴定中 的应用。 3、通过UV、IR、HNMR和MS图谱解析,了解光谱方法在黄酮类化合物结构鉴定中的应 用。", "options": {}, "answer": "", "mnemonic": "必背｜实验指导·目的", "priority": "必背", "isRecall": true, "sourceId": 1, "addedAt": 1780168176203, "examProb": "必考"}, {"id": "tre-005", "course": "天然药物化学实验", "type": "简答记忆", "chapter": "实验二·槐花米中芦丁", "number": "原理", "title": "槐花米中芦丁实验的原理(提取/分离依据)", "answerText": "芸香苷分子中有酚羟基,显弱酸性,在碱水中成盐增大溶解能力,用碱水为溶剂煮沸 提取,提取液加酸酸化后又成为游离芸香苷析出,再利用芸香苷对冷、热水溶解度的差 异较大的特性进行精制。 黄酮苷可通过酸水解得到苷元和糖,并可通过薄层色谱法进行检识。 利用黄酮化合物对紫外光有特定吸收的特性进行结构测定;也可制备乙酰化物进行结 构测定。", "options": {}, "answer": "", "mnemonic": "必背｜实验指导·原理", "priority": "必背", "isRecall": true, "sourceId": 1, "addedAt": 1780168176204, "examProb": "必考"}, {"id": "tre-006", "course": "天然药物化学实验", "type": "简答记忆", "chapter": "实验二·槐花米中芦丁", "number": "思考1", "title": "黄酮类化合物的结构研究的一般程序是什么?", "answerText": "(1)提取分离得单体;(2)测理化常数(熔点、旋光、溶解度);(3)显色反应初判类型(盐酸-镁粉、锆盐、AlCl3等);(4)UV加诊断试剂(NaOMe/NaOAc/AlCl3/H3BO3)推断羟基位置;(5)1H-NMR、13C-NMR确定母核与取代;(6)MS定分子量;(7)酸水解鉴定糖与苷元、确定糖连接位置;(8)综合解析确定结构。", "options": {}, "answer": "", "mnemonic": "必背｜实验指导·复习思考题", "priority": "必背", "isRecall": true, "sourceId": 1, "addedAt": 1780168176205, "examProb": "必考"}, {"id": "tre-007", "course": "天然药物化学实验", "type": "简答记忆", "chapter": "实验二·槐花米中芦丁", "number": "思考2", "title": "检识黄酮类化合物的常用化学方法有哪些?", "answerText": "(1)盐酸-镁粉反应(黄酮/黄酮醇显橙红~紫红,查耳酮、异黄酮多阴性);(2)盐酸-锌粉反应;(3)四氢硼钠(NaBH4)反应(二氢黄酮专属,显红~紫);(4)锆-枸橼酸反应(区别3-OH与5-OH黄酮);(5)三氯化铝反应(黄色荧光);(6)氨性氯化锶(检邻二酚羟基);(7)醋酸镁反应;(8)Molisch反应(检糖,即黄酮苷)。", "options": {}, "answer": "", "mnemonic": "必背｜实验指导·复习思考题", "priority": "必背", "isRecall": true, "sourceId": 1, "addedAt": 1780168176206, "examProb": "必考"}, {"id": "tre-008", "course": "天然药物化学实验", "type": "简答记忆", "chapter": "实验三·汉防己生物碱", "number": "目的", "title": "汉防己生物碱实验的目的与要求", "answerText": "1、掌握总生物碱的提取及脂溶性生物碱和水溶性生物碱、酚性叔胺碱及非酚性叔胺 碱、水溶性生物碱与水溶性杂质的分离、纯化原理和方法。 2、学习用吸附柱色谱分离生物碱,掌握一般柱色谱的操作方法。 3、熟悉生物碱的常用鉴定方法。 4、了解生物碱衍生物的制备方法。", "options": {}, "answer": "", "mnemonic": "必背｜实验指导·目的", "priority": "必背", "isRecall": true, "sourceId": 1, "addedAt": 1780168176207, "examProb": "必考"}, {"id": "tre-009", "course": "天然药物化学实验", "type": "简答记忆", "chapter": "实验三·汉防己生物碱", "number": "原理", "title": "汉防己生物碱实验的原理(提取/分离依据)", "answerText": "根据大多数生物碱或生物碱盐均能溶于乙醇的通性,用乙醇回流提取法提取总碱;利用 季铵型生物碱易溶于水,不溶于亲脂性有机溶剂的性质,用溶剂萃取法分离脂溶性生物 碱和水溶性生物碱;利用汉防己甲素和汉防己乙素结构上的差异,用吸附柱色谱分离二 者,或利用汉防己甲素的极性小于汉防己乙素,在冷苯中溶解度比汉防己乙素大而加以 分离;利用季铵型生物碱可与雷氏铵盐产生沉淀的性质,使季铵型生物碱与其它水溶性 成分分离。", "options": {}, "answer": "", "mnemonic": "必背｜实验指导·原理", "priority": "必背", "isRecall": true, "sourceId": 1, "addedAt": 1780168176208, "examProb": "必考"}, {"id": "tre-010", "course": "天然药物化学实验", "type": "简答记忆", "chapter": "实验三·汉防己生物碱", "number": "思考1", "title": "汉防己甲素、汉防己乙素在结构与性质上有何异同点?实验过程中,我们应怎样利用 它们的共性和个性?怎样分离?请设计方案。", "answerText": "【同】均为双苄基异喹啉类生物碱,基本骨架相同,为脂溶性叔胺碱,溶于氯仿等亲脂溶剂,生理活性相似(降压、肌松)。【异】甲素(粉防己碱)甲氧基化程度高(全甲基化),乙素(防己诺林碱)含一个酚羟基(少一甲基),故乙素极性略大。【利用与分离】共性:均溶于乙醇→乙醇回流提总碱,溶于氯仿→萃取。个性:乙素含酚OH可溶于稀NaOH而甲素不溶→用NaOH碱液萃取分离二者;或利用极性差异以硅胶吸附柱色谱分离。", "options": {}, "answer": "", "mnemonic": "必背｜实验指导·复习思考题", "priority": "必背", "isRecall": true, "sourceId": 1, "addedAt": 1780168176209, "examProb": "必考"}, {"id": "tre-011", "course": "天然药物化学实验", "type": "简答记忆", "chapter": "实验三·汉防己生物碱", "number": "思考2", "title": "雷氏铵盐法分离纯化季铵碱有何优缺点?解释雷氏铵盐法分离水溶性生物碱的原理。", "answerText": "【原理】雷氏铵盐(硫氰酸铬铵)与季铵型生物碱定量生成难溶性复盐而沉淀,从而与脂溶性叔胺碱及水溶性杂质分离。【优点】选择性较好,能使季铵碱与叔胺碱分开,操作较简便。【缺点】复盐不稳定、遇热/光易分解,需低温避光新鲜配制;后处理(丙酮溶解、银盐或离子交换复分解)繁琐、损失较大;雷氏盐本身有色干扰检测。", "options": {}, "answer": "", "mnemonic": "必背｜实验指导·复习思考题", "priority": "必背", "isRecall": true, "sourceId": 1, "addedAt": 1780168176210, "examProb": "必考"}, {"id": "tre-012", "course": "天然药物化学实验", "type": "简答记忆", "chapter": "实验三·汉防己生物碱", "number": "思考3", "title": "萃取过程中怎样防止和消除乳化?", "answerText": "【防止】(1)避免剧烈振摇,轻缓旋转混合;(2)避免强碱性或含蛋白胶质条件下萃取;(3)控制两相比例。【消除】(1)静置较长时间分层;(2)加电解质(NaCl)盐析破乳;(3)滴加数滴乙醇/戊醇改变界面张力;(4)适当加热;(5)离心;(6)过滤除去固体悬浮物;(7)调节pH。", "options": {}, "answer": "", "mnemonic": "必背｜实验指导·复习思考题", "priority": "必背", "isRecall": true, "sourceId": 1, "addedAt": 1780168176211, "examProb": "必考"}, {"id": "tre-013", "course": "天然药物化学实验", "type": "简答记忆", "chapter": "实验一·虎杖中蒽醌类成分", "number": "pH梯度法", "title": "虎杖实验中pH梯度萃取分离游离蒽醌的试剂顺序及对应成分", "answerText": "按碱性递增依次萃取:5%碳酸氢钠(NaHCO3)→萃取酸性最强的大黄酸(含-COOH);5%碳酸钠(Na2CO3)→萃取中等酸性的大黄素(含β-酚OH);1%氢氧化钠(NaOH)→萃取酸性最弱的大黄酚、大黄素甲醚(仅α-酚OH)。原理:羟基蒽醌酸性强弱取决于酚羟基的数目和位置(含-COOH>含β-OH>仅含α-OH)。", "options": {}, "answer": "", "mnemonic": "必背｜实验指导·方法要点", "priority": "必背", "isRecall": true, "sourceId": 1, "addedAt": 1780168176212, "examProb": "必考"}, {"id": "tre-014", "course": "天然药物化学实验", "type": "简答记忆", "chapter": "实验一·虎杖中蒽醌类成分", "number": "羟基蒽醌鉴定", "title": "羟基蒽醌类成分的鉴定(显色)反应", "answerText": "(1)Bornträger反应:与碱液(NaOH/氨水)反应显红~紫红色(羟基蒽醌的特征反应);(2)醋酸镁反应:与0.5%醋酸镁甲醇液生成橙红~紫红色络合物(可区别羟基位置);(3)与金属离子(Pb2+等)络合显色;(4)薄层色谱(TLC)对照、可见光/UV下显色。", "options": {}, "answer": "", "mnemonic": "重要｜实验指导·鉴定", "priority": "重要", "isRecall": true, "sourceId": 1, "addedAt": 1780168176213, "examProb": "必考"}, {"id": "tre-015", "course": "天然药物化学实验", "type": "简答记忆", "chapter": "实验二·槐花米中芦丁", "number": "酸碱法步骤", "title": "槐花米中芦丁(芸香苷)酸碱法提取的关键步骤与原理", "answerText": "原理:芸香苷含酚羟基显弱酸性,在碱水中成盐溶解度增大;酸化后又游离析出;再利用其冷热水溶解度差异精制。步骤:(1)槐花米加石灰乳(或硼砂)碱水煮沸提取(硼砂保护邻二酚羟基防氧化);(2)趁热过滤;(3)滤液用盐酸调pH3~4酸化,放冷使芦丁析出;(4)粗品用热水重结晶精制。", "options": {}, "answer": "", "mnemonic": "必背｜实验指导·方法要点", "priority": "必背", "isRecall": true, "sourceId": 1, "addedAt": 1780168176214, "examProb": "必考"}, {"id": "tre-016", "course": "天然药物化学实验", "type": "简答记忆", "chapter": "实验二·槐花米中芦丁", "number": "芦丁鉴定", "title": "芦丁(黄酮苷)的化学鉴别反应", "answerText": "(1)盐酸-镁粉反应:显橙红~红色(黄酮醇苷阳性);(2)三氯化铝反应:显黄色并有荧光;(3)Molisch反应:检识所含糖(证明为苷);(4)锆-枸橼酸反应;(5)酸水解后检识苷元(槲皮素)与糖(葡萄糖、鼠李糖)。", "options": {}, "answer": "", "mnemonic": "重要｜实验指导·鉴定", "priority": "重要", "isRecall": true, "sourceId": 1, "addedAt": 1780168176215, "examProb": "常考"}, {"id": "tre-017", "course": "天然药物化学实验", "type": "简答记忆", "chapter": "实验三·汉防己生物碱", "number": "总碱提取分离流程", "title": "汉防己总生物碱的提取及各类生物碱的分离流程", "answerText": "(1)提取:药材用乙醇回流提取总碱(生物碱及其盐均溶于乙醇);(2)分离脂溶性与水溶性碱:总碱溶液酸化后用亲脂性溶剂萃取——脂溶性叔胺碱入有机相,季铵型水溶性碱留水相;(3)分离酚性与非酚性叔胺碱:利用乙素含酚OH可溶于NaOH,用碱液萃取使甲素(非酚)与乙素(酚性)分开;(4)水溶性季铵碱:用雷氏铵盐沉淀法纯化;(5)甲、乙素可进一步用吸附柱色谱分离。", "options": {}, "answer": "", "mnemonic": "必背｜实验指导·方法要点", "priority": "必背", "isRecall": true, "sourceId": 1, "addedAt": 1780168176216, "examProb": "必考"}, {"id": "tre-018", "course": "天然药物化学实验", "type": "简答记忆", "chapter": "实验三·汉防己生物碱", "number": "生物碱鉴定", "title": "生物碱的常用沉淀鉴别反应", "answerText": "生物碱沉淀试剂:(1)碘化铋钾(Dragendorff)→橙红色沉淀;(2)碘化汞钾(Mayer)→白色/淡黄色沉淀;(3)碘-碘化钾(Wagner)→棕色沉淀;(4)硅钨酸→淡黄色沉淀;(5)苦味酸(苦酮酸)沉淀。注意需在酸性水溶液中进行;季铵碱另可用雷氏铵盐生成红色复盐鉴别。", "options": {}, "answer": "", "mnemonic": "重要｜实验指导·鉴定", "priority": "重要", "isRecall": true, "sourceId": 1, "addedAt": 1780168176217, "examProb": "常考"}, {"id": "tr-1239", "course": "天然药物化学", "type": "名词解释记忆", "chapter": "速通补充", "number": "", "title": "【名词解释】强心苷、甾体皂苷的概念", "answerText": "掌握强心苷、甾体皂苷的概念(定义)——可能考名词解释。\n\n〔老师强调/扣分点〕老师:『需要掌握强心苷、甾体皂苷的概念，有可能会考这个概念题』。笔记列为高频名词解释。", "options": {}, "answer": "", "mnemonic": "🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 名词解释(强心苷/甾体皂苷概念—真题名解'强心苷'(2020/2016多年)+知到判断'甾体〕｜参考答案据课堂/教材整理", "priority": "必背", "isRecall": true, "sourceId": "速通考点情报", "examProb": "必考", "isPatch": true, "addedAt": 1781604125124}, {"id": "tr-1240", "course": "天然药物化学", "type": "简答记忆", "chapter": "速通补充", "number": "", "title": "【简答】典型化合物的结构、俗名及结构类型", "answerText": "掌握典型化合物的结构、俗名及结构类型：通常给结构写俗名(不默写完整结构)；结构类型要求写到二级结构(甾体母核=一级结构，其下分的类型=二级结构)。\n\n〔老师强调/扣分点〕老师:『结构可分一级、二级结构…甾体倒转就是一级结构，X下分的结构类型叫二级结构』。考核形式=给结构写俗名+写结构类型。", "options": {}, "answer": "", "mnemonic": "🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 简答/结构题(典型化合物俗名+结构类型到二级—真题简答'写名称结构类型活性'(认结构题每年必考))〕｜参考答案据课堂/教材整理", "priority": "必背", "isRecall": true, "sourceId": "速通考点情报", "examProb": "必考", "isPatch": true, "addedAt": 1781604125125}, {"id": "tr-1241", "course": "天然药物化学", "type": "简答记忆", "chapter": "速通补充", "number": "", "title": "【简答】强心苷、甾体皂苷的理化性质和鉴别反应", "answerText": "掌握强心苷、甾体皂苷的理化性质和鉴别反应——特征性鉴别反应为必考内容(本章核心实验考点，后续详讲)。\n\n〔老师强调/扣分点〕笔记『考试重点』:鉴别反应为必考，需掌握反应原理和现象。", "options": {}, "answer": "", "mnemonic": "🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(强心苷甾体皂苷理化性质鉴别反应—真题+知到'甲型强心苷苷元结构特点')〕｜参考答案据课堂/教材整理", "priority": "必背", "isRecall": true, "sourceId": "速通考点情报", "examProb": "必考", "isPatch": true, "addedAt": 1781604125126}, {"id": "tr-1242", "course": "天然药物化学", "type": "名词解释记忆", "chapter": "速通补充", "number": "", "title": "【名词解释】强心苷、甾体皂苷的光谱学特征及提取分离", "answerText": "熟悉强心苷、甾体皂苷的光谱学特征及提取分离，重点掌握原生苷(一级苷)与次生苷(二级苷)的区别。\n\n〔老师强调/扣分点〕老师强调:『主要是掌握这些原生苷跟次生苷的基因[区别]』；笔记列为熟悉级。", "options": {}, "answer": "", "mnemonic": "🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 简答/填空(原生苷vs次生苷区别—真题名解'次生苷'+填空+知到'提取原生苷方法')〕｜参考答案据课堂/教材整理", "priority": "必背", "isRecall": true, "sourceId": "速通考点情报", "examProb": "必考", "isPatch": true, "addedAt": 1781604125127}, {"id": "tr-1243", "course": "天然药物化学", "type": "简答记忆", "chapter": "速通补充", "number": "", "title": "【简答】强酸水解", "answerText": "强酸水解:酸浓度3~5%,延长水解时间并加压;能水解2-OH糖、定量得葡萄糖,但引起苷元脱水(得不到原苷元)。如羟基毛地黄毒苷强酸水解得三脱水产物而非原苷元。\n\n〔老师强调/扣分点〕强酸水解副作用=苷元脱水。结构中C3连糖、C14-OH、C16-OH易脱水。", "options": {}, "answer": "", "mnemonic": "🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 简答(强酸水解苷元脱水—真题'裂解苷键方法'+强心苷脱水苷)〕｜参考答案据课堂/教材整理", "priority": "必背", "isRecall": true, "sourceId": "速通考点情报", "examProb": "必考", "isPatch": true, "addedAt": 1781604125128}, {"id": "tr-1244", "course": "天然药物化学", "type": "简答记忆", "chapter": "速通补充", "number": "", "title": "【简答】盐酸丙酮法(Mannich水解)", "answerText": "盐酸丙酮法(Mannich水解):HCl+丙酮溶液,室温长时间反应;要求糖分子有C2-OH和C3-OH;邻二-OH与丙酮生成丙酮化物再水解;可得原苷元和糖的衍生物(苷元不受影响)。\n\n〔老师强调/扣分点〕优点=既能水解又保护苷元不脱水。前提:二位、三位必须有羟基取代。", "options": {}, "answer": "", "mnemonic": "🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 简答(盐酸丙酮法Mannich水解条件—真题'裂解苷键方法'简答之一)〕｜参考答案据课堂/教材整理", "priority": "必背", "isRecall": true, "sourceId": "速通考点情报", "examProb": "必考", "isPatch": true, "addedAt": 1781604125129}, {"id": "tr-1245", "course": "天然药物化学", "type": "简答记忆", "chapter": "速通补充", "number": "", "title": "【简答】K-K反应(鉴别2-去氧糖)的局限性", "answerText": "K-K反应(鉴别2-去氧糖)的局限性:①只有游离2-去氧糖才能显色;②若2-去氧糖与其他糖形成二糖/三糖(结合紧密)则无法显色。\n\n〔老师强调/扣分点〕老师:『只有这个游离的二[去]氧[糖]…才能显示…如果形成二糖三糖…在这个条件下它是不显示的』。", "options": {}, "answer": "", "mnemonic": "🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 简答(K-K反应局限性—真题强心苷鉴别延伸)〕｜参考答案据课堂/教材整理", "priority": "必背", "isRecall": true, "sourceId": "速通考点情报", "examProb": "必考", "isPatch": true, "addedAt": 1781604125130}, {"id": "tr-1246", "course": "天然药物化学", "type": "名词解释记忆", "chapter": "速通补充", "number": "", "title": "【名词解释】生物碱准确定义", "answerText": "生物碱准确定义(1983年法国药物学家派勒蒂埃):指含负氧化态氮原子、存在于生物有机体内的环状化合物。三要点:①含负氧化态氮②生物体内③环状。\n\n〔老师强调/扣分点〕负氧化态氮包括胺(-3)、酰胺(-3)、季铵(-3)、氮氧化物(-1);不包括硝基(+3)、亚硝基(+1)。如小檗碱是生物碱,马兜铃酸(含硝基+3)不是。", "options": {}, "answer": "", "mnemonic": "🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 名词解释(★生物碱准确定义派勒蒂埃—真题名解'生物碱'(1818Meissner/1983)〕｜参考答案据课堂/教材整理", "priority": "必背", "isRecall": true, "sourceId": "速通考点情报", "examProb": "必考", "isPatch": true, "addedAt": 1781604125131}, {"id": "tr-1247", "course": "天然药物化学", "type": "名词解释记忆", "chapter": "速通补充", "number": "", "title": "【名词解释】植物一次代谢(初生代谢)", "answerText": "植物一次代谢(初生代谢):维持植物生命活动的代谢过程(如葡萄糖等初生代谢产物)。二次代谢:产生次生代谢产物(多为天然药物有效成分)的过程。\n\n〔老师强调/扣分点〕老师:『要知道什么是植物的一次代谢』(名词解释)。", "options": {}, "answer": "", "mnemonic": "🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 名词解释/简答(一次代谢vs二次代谢产物—真题名解+问答'一次/二次代谢产物'+知到多选'一〕｜参考答案据课堂/教材整理", "priority": "必背", "isRecall": true, "sourceId": "速通考点情报", "examProb": "必考", "isPatch": true, "addedAt": 1781604125132}, {"id": "tr-1248", "course": "天然药物化学", "type": "名词解释记忆", "chapter": "速通补充", "number": "", "title": "【名词解释】差向异构体", "answerText": "差向异构体(anomers):单糖成环后形成一个新的不对称碳原子称端基碳(anomeric carbon),生成一对a、β两种构型的差向异构体。因C=O为平面结构,羟基可从平面两边进攻C=O,得到a/β两种异构体。\n\n〔老师强调/扣分点〕老师:『注意这两个名词解释,通过考题要考得出来』。Haworth式判断:五碳吡喃糖C4-OH与端基碳羟基同侧为α、异侧为β。", "options": {}, "answer": "", "mnemonic": "🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 名词解释(差向异构体/端基碳anomers—知到判断'五元结构糖叫呋喃糖'+真题名解)〕｜参考答案据课堂/教材整理", "priority": "必背", "isRecall": true, "sourceId": "速通考点情报", "examProb": "必考", "isPatch": true, "addedAt": 1781604125133}, {"id": "tr-1249", "course": "天然药物化学", "type": "简答记忆", "chapter": "速通补充", "number": "", "title": "【简答】过碘酸氧化(高碘酸)", "answerText": "过碘酸氧化(高碘酸):裂解邻二醇结构。可推测糖苷键连接位置:1,3连接的糖苷键不与过碘酸反应(无邻二醇),1,4连接可反应——用于确定糖与糖连接位置。\n\n〔老师强调/扣分点〕老师强调用于结构测定(糖连接位置)。", "options": {}, "answer": "", "mnemonic": "🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(过碘酸氧化邻二醇推苷键位置—知到'全甲基化甲醇解判断糖连接位置'+'1,3连接不〕｜参考答案据课堂/教材整理", "priority": "必背", "isRecall": true, "sourceId": "速通考点情报", "examProb": "必考", "isPatch": true, "addedAt": 1781604125134}, {"id": "tr-1250", "course": "天然药物化学", "type": "简答记忆", "chapter": "速通补充", "number": "", "title": "【简答】苷键裂解的5种方法", "answerText": "苷键裂解的5种方法:①酸催化水解(重点)②乙酰解③碱催化水解和β消除④酶催化水解(重点)⑤氧化开裂法/Smith降解法(重点)。苷键=缩醛键,对碱和氧化剂较稳定,易被稀酸水解。\n\n〔老师强调/扣分点〕老师:『三个重点:酸水解、酶水解、Smith降解,都必须掌握』。", "options": {}, "answer": "", "mnemonic": "🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(★苷键裂解5法:酸/乙酰解/碱/酶/氧化开裂—知到'水解得真正苷元:氧化开裂法/〕｜参考答案据课堂/教材整理", "priority": "必背", "isRecall": true, "sourceId": "速通考点情报", "examProb": "必考", "isPatch": true, "addedAt": 1781604125135}, {"id": "tr-1251", "course": "天然药物化学", "type": "论述记忆", "chapter": "速通补充", "number": "", "title": "【论述】酸水解难易规律", "answerText": "酸水解难易规律:①苷原子电子密度升高、质子化能力增强则易水解,顺序 N-苷>O-苷>S-苷>C-苷(C-苷最难水解,与碱度顺序一致)②呋喃糖苷比吡喃糖苷易水解(五元环平面性使取代基重叠、水解中间体张力小)③酮糖比醛糖易水解。\n\n〔老师强调/扣分点〕高频为什么类:为什么C-苷最难水解(苷原子电子密度低、难质子化);为什么呋喃糖苷易水解(环张力)。", "options": {}, "answer": "", "mnemonic": "🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择(★酸水解难易N>O>S>C苷—知到'苷键酸水解错误论述'(多题:呋喃>吡喃,去氧>羟基〕｜参考答案据课堂/教材整理", "priority": "必背", "isRecall": true, "sourceId": "速通考点情报", "examProb": "必考", "isPatch": true, "addedAt": 1781604125136}, {"id": "tr-1252", "course": "天然药物化学", "type": "简答记忆", "chapter": "速通补充", "number": "", "title": "【简答】苷键构型确定(重点)", "answerText": "苷键构型确定(重点):①酶水解法——麦芽糖酶水解α-苷键、苦杏仁酶水解β-苷键②1H-NMR——端基质子信号δ5.0ppm,据偶合常数J值判断α/β(六碳吡喃糖需用碳谱)③13C-NMR——端基碳化学位移α-甲苷97~101ppm、β-甲苷103~106ppm,α/β相差约4ppm。\n\n〔老师强调/扣分点〕笔记★★★(β构型化学位移值更大,大4ppm)。老师:『一定会考一道这种题,至少10分』。易混:相差4ppm的方向。", "options": {}, "answer": "", "mnemonic": "🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(★苷键构型确定:麦芽糖酶α/苦杏仁酶β+1H-NMR端基氢J值—知到多选'确定苷〕｜参考答案据课堂/教材整理", "priority": "必背", "isRecall": true, "sourceId": "速通考点情报", "examProb": "必考", "isPatch": true, "addedAt": 1781604125137}, {"id": "tr-1253", "course": "天然药物化学", "type": "简答记忆", "chapter": "速通补充", "number": "", "title": "【简答】糖苷分离8法", "answerText": "糖苷分离8法:活性炭柱色谱(分离水溶性物质如氨基酸/糖/苷,上样量大、来源廉、缺点:无理想吸附力分级方法)、纤维素色谱、离子交换柱色谱、凝胶柱色谱、季铵氢氧化物沉淀法、分级沉淀/溶解法、蛋白质除去法、铅盐沉淀法。\n\n〔老师强调/扣分点〕笔记活性炭吸附★★★★(非极性、LH-20适用)。老师重点讲活性炭分离糖/苷。", "options": {}, "answer": "", "mnemonic": "🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(糖苷分离8法:活性炭/凝胶/离子交换—知到多选'糖和苷分离方法:活性炭/凝胶/离〕｜参考答案据课堂/教材整理", "priority": "必背", "isRecall": true, "sourceId": "速通考点情报", "examProb": "必考", "isPatch": true, "addedAt": 1781604125138}, {"id": "tr-1254", "course": "天然药物化学", "type": "简答记忆", "chapter": "速通补充", "number": "", "title": "【简答】香豆素显色反应", "answerText": "香豆素显色反应:①异羟肟酸铁反应(内酯/酯键,呈红色)②Gibbs反应(2,6-二氯(溴)苯醌氯亚胺,酚羟基对位无取代呈阳性蓝色)③Emerson反应(氨基安替匹林+铁氰化钾,酚羟基且对位无取代呈红色)。游离香豆素能升华、随水蒸气蒸出;成苷后无香味、不升华、不挥发。\n\n〔老师强调/扣分点〕老师:『Gibbs和Emerson是重点,条件:有游离酚羟基且对位无取代呈阳性』。扣分点:必须强调'对位无取代'。", "options": {}, "answer": "", "mnemonic": "🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(★香豆素显色:异羟肟酸铁/Gibbs/Emerson—知到'鉴别香豆素首选异羟肟〕｜参考答案据课堂/教材整理", "priority": "必背", "isRecall": true, "sourceId": "速通考点情报", "examProb": "必考", "isPatch": true, "addedAt": 1781604125139}, {"id": "tr-1255", "course": "天然药物化学", "type": "简答记忆", "chapter": "速通补充", "number": "", "title": "【简答】强心苷分类", "answerText": "强心苷分类(据苷元C17侧链内酯环大小,高频考点):①甲型强心苷——C17侧链为五元不饱和内酯环(Δαβ-γ-内酯,即强心烯内酯,如洋地黄毒苷)②乙型强心苷——C17侧链为六元不饱和内酯环(Δαβ,γδ-δ-内酯,即蟾蜍二烯内酯)。\n\n〔老师强调/扣分点〕笔记★★★★甲型(五元)vs乙型(六元)区分是高频考点。命名:希腊字母标双键位置。老师:『每周考题会涉及』。", "options": {}, "answer": "", "mnemonic": "🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(★强心苷甲/乙型分类C17内酯环五元/六元—真题简答'甲型C17五元不饱和内酯/〕｜参考答案据课堂/教材整理", "priority": "必背", "isRecall": true, "sourceId": "速通考点情报", "examProb": "必考", "isPatch": true, "addedAt": 1781604125140}, {"id": "tr-1256", "course": "天然药物化学", "type": "简答记忆", "chapter": "速通补充", "number": "", "title": "【简答】强心苷提取分离", "answerText": "强心苷提取分离:提取注意共存物质(糖类、皂苷、色素、鞣质)干扰。分离方法:①两相溶剂萃取法(据分配系数不同)②逆流分配法③色谱分离(硅胶吸附层析分离亲脂性单糖苷/次级苷/苷元、C18反相分配层析对亲水性成分)。可两糖苷与四糖苷分离。\n\n〔老师强调/扣分点〕老师:『重点掌握两糖苷与四糖苷的区别分离』。", "options": {}, "answer": "", "mnemonic": "🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(强心苷提取分离两相溶剂萃取—  true, "sourceId": "速通考点情报", "examProb": "必考", "isPatch": true, "addedAt": 1781604125144}, {"id": "tr-1260", "course": "天然药物化学", "type": "简答记忆", "chapter": "速通补充", "number": "", "title": "【简答】生物碱显色反应(专属鉴别)", "answerText": "生物碱显色反应(专属鉴别):酸性水/稀醇中生物碱与浓无机酸反应生成有色物(非沉淀)。①Vitali反应(发烟硝酸+NaOH醇液)——仅托烷类(含莨菪酸):阿托品/莨菪碱/东莨菪碱②Marquis反应(含甲醛浓硫酸)——吗啡显紫红色、可待因显蓝色,专鉴吗啡类。\n\n〔老师强调/扣分点〕笔记★★★。Vitali=托烷类专属、Marquis=吗啡类专属是高频对应题。", "options": {}, "answer": "", "mnemonic": "🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(★生物碱显色反应Vitali/Marquis—知到'生物碱结构鉴定:化学方法光谱〕｜参考答案据课堂/教材整理", "priority": "必背", "isRecall": true, "sourceId": "速通考点情报", "examProb": "必考", "isPatch": true, "addedAt": 1781604125145}];


        // --- 3. 模态框组件 ---
        
        const CustomModal = ({ isOpen, type, title, message, onConfirm, onCancel, confirmText = "确定", cancelText = "取消" }) => {
            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black bg-opacity-50 animate-fade-in">
                    <div className="bg-white rounded-xl shadow-2xl max-w-sm w-full overflow-hidden transform transition-all scale-100">
                        <div className={`p-4 flex items-center ${type === 'danger' ? 'bg-red-50 text-red-700' : 'bg-teal-50 text-teal-700'}`}>
                            {type === 'danger' ? <Icons.AlertTriangle className="w-6 h-6 mr-2" /> : <Icons.Info className="w-6 h-6 mr-2" />}
                            <h3 className="font-bold text-lg">{title}</h3>
                        </div>
                        <div className="p-6">
                            <p className="text-gray-600 text-sm whitespace-pre-wrap leading-relaxed">{message}</p>
                        </div>
                        <div className="p-4 bg-gray-50 flex justify-end space-x-3">
                            {type !== 'alert' && (
                                <button 
                                    onClick={onCancel}
                                    className="px-4 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100 font-medium transition"
                                >
                                    {cancelText}
                                </button>
                            )}
                            <button 
                                onClick={onConfirm}
                                className={`px-4 py-2 rounded-lg text-white font-bold shadow-md transition ${type === 'danger' ? 'bg-red-600 hover:bg-red-700' : 'bg-teal-600 hover:bg-teal-700'}`}
                            >
                                {confirmText}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const RenameModal = ({ isOpen, currentName, onConfirm, onCancel }) => {
            const [value, setValue] = useState('');
            useEffect(() => { if (isOpen) setValue(currentName); }, [isOpen, currentName]);
            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black bg-opacity-50 animate-fade-in">
                    <div className="bg-white rounded-xl shadow-2xl max-w-sm w-full p-6 transform transition-all scale-100">
                        <h3 className="font-bold text-lg mb-2 text-gray-800 flex items-center">

                            修改课程名称

                        <input
