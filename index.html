｜doubao习题汇总","addedAt":1781947616073},{"id":"tr-450","course":"天然药物化学","type":"多选","chapter":"1. 总论","number":"tr-0083","title":"测定和确定化合物结构的方法包括","options":{"A":"确定单体","B":"物理常数测定","C":"确定极性大小","D":"测定荧光性质和溶解性","E":"解析各种光谱"},"answer":"ABE","answerText":"","mnemonic":"了解｜doubao习题汇总","addedAt":1781947616073},{"id":"tr-451","course":"天然药物化学","type":"多选","chapter":"1. 总论","number":"tr-0084","title":"目前可用于确定化合物分子式的方法有","options":{"A":"元素定量分析配合分子量测定","B":"同位素峰位法","C":"HI-MS 法","D":"EI-MS 法","E":"CI-MS 法"},"answer":"ABC","answerText":"","mnemonic":"了解｜doubao习题汇总","addedAt":1781947616073},{"id":"tr-452","course":"天然药物化学","type":"多选","chapter":"1. 总论","number":"tr-0085","title":"MS在化合物分子结构测定中的应用是","options":{"A":"测定分子量","B":"确定官能团","C":"推算分子式","D":"推测结构式","E":"推断分子构象"},"answer":"ACD","answerText":"","mnemonic":"了解｜doubao习题汇总","addedAt":1781947616073},{"id":"tr-453","course":"天然药物化学","type":"多选","chapter":"1. 总论","number":"tr-0086","title":"质谱(MS)可提供的结构信息有","options":{"A":"确定分子量","B":"求算分子式","C":"区别芳环取代","D":"根据裂解的碎片峰推测结构","E":"提供分子中氢的类型、数目"},"answer":"ABD","answerText":"","mnemonic":"了解｜doubao习题汇总","addedAt":1781947616073},{"id":"tr-454","course":"天然药物化学","type":"多选","chapter":"1. 总论","number":"tr-0087","title":"各种质谱方法中,依据其离子源不同可分为","options":{"A":"电子轰击电离","B":"加热电离","C":"酸碱电离","D":"场解析电离","E":"快速原子轰击电离"},"answer":"ADE","answerText":"","mnemonic":"了解｜doubao习题汇总","addedAt":1781947616073},{"id":"tr-455","course":"天然药物化学","type":"多选","chapter":"1. 总论","number":"tr-0088","title":"氢核磁共振谱(1H-NMR)在分子结构测定中的应用是","options":{"A":"确定分子量","B":"提供分子中氢的类型、数目","C":"推断分子中氢的相邻原子或原子团的信息","D":"判断是否存在共轭体系","E":"通过加人诊断试剂推断取代基类型、数目等"},"answer":"BC","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616073},{"id":"tr-456","course":"天然药物化学","type":"多选","chapter":"1. 总论","number":"tr-0089","title":"天然药物化学的研究内容主要包括天然药物中化学成分的","options":{"A":"结构类型","B":"性质与剂型的关系","C":"提取分离方法","D":"活性筛选","E":"结构鉴定"},"answer":"ACE","answerText":"","mnemonic":"了解｜doubao习题汇总","addedAt":1781947616073},{"id":"tr-457","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"tr-0090","title":"一次代谢产物与二次代谢产物的区别","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"糖、蛋白质、脂质、核酸等对植物机体生命活动不可缺少的物质称为一次代谢产物;由一次代谢产物进一步代谢产生的如萜类、生物碱类等成分,因并非维持植物生命活动所必需,称为二次代谢产物。","mnemonic":"必背｜星空历年真题","addedAt":1781947616073},{"id":"tr-458","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"tr-0091","title":"简述确定化合物分子量、分子式的方法。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"分子量的测定有冰点下降法,或沸点上升法、粘度法和凝胶过滤法等。目前最常用的是质谱法,该法通过确定质谱图中的分子离子峰,可精确得到化合物的分子量;分子式的确定可通过元素分析或质谱法进行。元素分析通过元素分析仪完成,通过测定给出化合物中除氧元素外的各组成元素的含量和比例, 并由此推算出化合物中各组成元素的含量,得出化合物的实验分子式,结合分子量确定化合物的确切分子式。质谱法测定分子式可采用同位素峰法和高分辨质谱法。","mnemonic":"[合并自tr-453(sId1)]","addedAt":1781947616073},{"id":"tr-459","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"tr-0092","title":"六种柱层析的吸附剂与分离原理","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"①硅胶柱:吸附剂硅胶,按分子极性由小到大分离,最常用。②氧化铝柱:吸附剂氧化铝,按极性由小到大分离,多用于碱性物质。③反相柱:反相硅胶,按极性由大到小分离。④凝胶柱:各类凝胶,按分子量大小分离。⑤聚酰胺柱:聚酰胺,按氢键强弱(吸附剂与物质间)分离。⑥大孔树脂柱:大孔树脂,按分子量大小分离。","mnemonic":"必背｜星空历年真题","addedAt":1781947616073},{"id":"tr-460","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"tr-0093","title":"【母题·必考】简述四大波谱（UV、IR、NMR、MS）在天然产物结构鉴定中的作用","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点：①紫外光谱(UV)——反映共轭体系/发色团，黄酮、蒽醌等用诊断试剂位移判断羟基位置；②红外光谱(IR)——反映官能团（羟基、羰基、芳环等特征吸收）；③核磁共振(NMR)——¹H-NMR给出氢的化学位移/积分/裂分，¹³C-NMR给出碳骨架，2D（COSY、HSQC、HMBC）确定连接；④质谱(MS)——给出分子量（分子离子峰）和碎片，软电离可逐级裂解糖以确定糖连接顺序。本课波谱约占1/3内容，必考。","mnemonic":"🆕课堂强调·补充｜〔2026-03-03 09:38 [02:39]〕｜非真题原题·据课堂整理｜周志望·波谱约占1/3·一定考","addedAt":1781947616073},{"id":"tr-461","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"tr-0094","title":"【母题】选择提取溶剂的三个原则是什么？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点（三点都要答全，老师强调简答勿只答一点）：①相似相溶——根据被提取成分的极性选择极性相近的溶剂；②溶剂对有效成分溶解度大、对杂质溶解度小（选择性好）；③溶剂安全、价廉易得、操作方便、毒性低、沸点适中易回收，且与药材成分不发生化学反应。","mnemonic":"🆕课堂强调·补充｜〔2026-03-03 11:18 [10:10]〕｜非真题原题·据课堂整理｜汪玢·简答三点须答全","addedAt":1781947616073},{"id":"tr-462","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"tr-0095","title":"【母题】天然药物常用的提取方法有哪些？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点：①溶剂提取法（煎煮法、浸渍法、渗漉法、回流提取法、连续回流提取法/索氏提取）——最常用，依相似相溶选溶剂；②水蒸气蒸馏法——适于挥发性、能随水蒸气蒸馏且不被破坏的成分（如挥发油）；③升华法——适于具升华性的成分；④压榨法；⑤超临界流体萃取法（SFE，常用CO2）——绿色高效。","mnemonic":"🆕课堂强调·补充｜〔2026-03-06 09:38 [15:00]〕｜非真题原题·据课堂整理｜汪玢·常用提取方法","addedAt":1781947616073},{"id":"tr-463","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"tr-0096","title":"结晶法与重结晶法的操作有何异同？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点：两者操作过程基本相同（均为利用溶解度差异，热溶解→冷析晶→过滤）；区别在于——结晶是从不纯的提取物中第一次析出晶体的过程；重结晶（穷尽结晶法）是将已得晶体再次溶解、再次结晶以进一步纯化的过程，差别主要体现在母液和纯度上。","mnemonic":"🆕课堂强调·补充｜〔2026-03-06 09:38 [19:46]〕｜非真题原题·据课堂整理｜考研常考点","addedAt":1781947616073},{"id":"tr-464","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"tr-0097","title":"天然药物有效成分提取方法有几种?采用这些方法提取的依据是什么?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"1溶剂提取法:利用溶剂把天然药物中所需要的成分溶解出来,而对其它成分不溶解或少溶解。2水蒸气蒸馏法:利用某些化学成分具有挥发性,能随水蒸气蒸馏而不被破坏的性质。3升华法:利用某些化合物具有升华的性质","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","addedAt":1781947616073},{"id":"tr-465","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"tr-0098","title":"常用溶剂的亲水性或亲脂性的强弱顺序如何排列?哪些与水混溶?哪些与水不混溶?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"石油醚>苯>氯仿>乙醚>乙酸乙酯>正丁醇>丙酮>乙醇>甲醇>水 与水互不相溶 与水相混溶","mnemonic":"了解｜doubao习题汇总｜巧记:亲水性溶剂——甲乙丙丁(甲醇/乙醇/丙酮/正丁醇)｜(答案待补,以教材为准)","addedAt":1781947616073},{"id":"tr-466","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"tr-0099","title":"溶剂分几类?溶剂极性与ε值关系?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"溶剂分为极性溶剂和非极性溶剂或亲水性溶剂和亲脂性溶剂两大类。常用介电常数(ε)表示物质的极性。一般ε值大,极性强,在水中溶解度大,为亲水性溶剂,如乙醇;ε值小,极性弱,在水中溶解度小或不溶,为亲脂性溶剂,如苯","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","addedAt":1781947616073},{"id":"tr-467","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"tr-0100","title":"溶剂提取的方法有哪些?它们都适合哪些溶剂的提取?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"1浸渍法:水或稀醇为溶剂。2渗漉法:稀乙醇或水为溶剂。3煎煮法:水为溶剂。4回流提取法:用有机溶剂提取。5连续回流提取法:用有机溶剂提取","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","addedAt":1781947616073},{"id":"tr-468","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"tr-0101","title":"两相溶剂萃取法是根据什么原理进行?在实际工作中如何选择溶剂?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"利用混合物中各成分在两相互不相溶的溶剂中分配系数不同而达到分离的目的。实际工作中,在水提取液中有效成分是亲脂的多选用亲脂性有机溶剂如苯、氯仿、乙醚等进行液-液萃取;若有效成分是偏于亲水性的则改用弱亲脂性溶剂如乙酸乙酯、正丁醇等,也可采用氯仿或乙醚加适量乙醇或甲醇的混合剂","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","addedAt":1781947616073},{"id":"tr-469","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"tr-0102","title":"萃取操作时要注意哪些问题?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"1水提取液的浓度最好在相对密度2之间。2溶剂与水提取液应保持一定量比例。第一次用量为水提取液1/2~1/3,以后用量为水提取液1/4~1/6。3一般萃取3~4次即可。4用氯仿萃取,应避免乳化。可采用旋转混合,改用氯仿:乙醚混合溶剂等。若已形成乳化,应采取破乳措施","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","addedAt":1781947616073},{"id":"tr-470","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"tr-0103","title":"萃取操作中若已发生乳化,应如何处理?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"轻度乳化可用一金属丝在乳层中搅动。 将乳化层抽滤。 将乳化层加热或冷冻。 分出乳化层更换新的溶剂。 加入食盐以饱和水溶液或滴入数滴戊醇增加其表面张力,使乳化层破坏","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","addedAt":1781947616073},{"id":"tr-471","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"tr-0104","title":"色谱法的基本原理是什么?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"利用混合物中各成分在不同的两相中吸附、分配及其亲和力的差异而达到相互分离的方法","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","addedAt":1781947616073},{"id":"tr-472","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"tr-0105","title":"凝胶色谱原理是什么?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"凝胶色谱相当于分子筛的作用。凝胶颗粒中有许多网眼,色谱过程中,小分子化合物可进入网眼;大分子化合物被阻滞在颗粒外,不能进入网孔,所受阻力小,移动速度快,随洗脱液先流出柱外;小分子进入凝胶颗粒内部,受阻力大,移动速度慢,后流出柱外","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","addedAt":1781947616073},{"id":"tr-473","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"tr-0106","title":"如何判断天然药物化学成分的纯度?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"判断天然药物化学成分的纯度可通过样品的外观如晶形以及熔点、溶程、比旋度、色泽等物理常数进行判断。纯的化合物外观和形态较为均一,通常有明确的熔点,熔程一般应小于2°C;更多的是采用薄层色谱或纸色谱方法,一般要求至少选择在三种溶剂系统中展开时样品均呈单一斑点,方可判断其为纯化合物","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","addedAt":1781947616073},{"id":"tr-474","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"tr-0107","title":"在研究天然药物化学成分结构中,IR光谱有何作用?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"IR光谱在天然药物化学成分结构研究中具有如下作用:测定分子中的基团;已知化合物的确证;未知成分化学结构的推测与确定;提供化合物分子的几何构型与立体构象的研究信息","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","addedAt":1781947616073},{"id":"tr-475","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"tr-0108","title":"简述紫外光谱图的表示方法及用文字表示的方法和意义","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"紫外光谱(UV)的表示方法有两种:①图示法:以波长λ(nm)为横坐标、吸光度A(或摩尔吸光系数ε、logε)为纵坐标作图,得到吸收曲线,曲线上的吸收峰位置即最大吸收波长λmax;②文字表示法:用 λmax(溶剂)nm(logε) 的形式记录,如 λmax(EtOH)nm:240(4.05),其中注明所用溶剂、最大吸收波长及对应的logε值。意义:λmax反映分子中生色团及助色团等共轭体系的结构特征,logε反映该跃迁的强弱,据此可推断化合物结构类型及共轭程度。","mnemonic":"重要｜doubao习题汇总｜据教材补","addedAt":1781947616073},{"id":"tr-476","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"tr-0109","title":"简述聚酰胺色谱的原理、吸附力的影响因素","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"适用范围：聚酰胺属于氢键吸附，是一种用途十分广泛的分离方法，极性物质与非极性物质均可适用。但特别适合分离酚类、醌类、黄酮类化合物。原理：一般认为是通过分子中的酰胺羰基与酚类、黄酮类化合物的酚羟基，或酰胺键上的游离胺基与醌类、脂肪酸上的羰基形成氢键缔合而产生吸附。吸附力的影响因素：至于吸附强弱则取决于各种化合物与之形成氢键缔合的能力。通常在汗水溶剂中大致有下列规律：①形成氢键的基团数目越多，则吸附能力越强②称键位置对吸附力也有影响。易形成分子内氢键者，其在聚酰胺上的吸附即相应减弱③分子中芳香化程度高者，则吸附性增强；反之，则减弱","mnemonic":"重要｜天然药物化学名词解释+简答.docx","addedAt":1781947616073},{"id":"tr-477","course":"天然药物化学","type":"选择","chapter":"1. 总论","number":"tr-0110","title":"在某一化合物的UV光谱中,加入NaOMe时带I出现40~60nm红移,则该化合物有:","options":{"A":"4’-OH","B":"3-OH","C":"7-OH","D":"5-OH","E":""},"answer":"A","answerText":"","mnemonic":"了解｜doubao知到","addedAt":1781947616073},{"id":"tr-478","course":"天然药物化学","type":"选择","chapter":"1. 总论","number":"tr-0111","title":"两相溶剂萃取法的原理是利用混合物中各成分在两相溶剂中的","options":{"A":"比重不同","B":"分配系数不同","C":"分离系数不同","D":"萃取常数不同","E":"介电常数不同"},"answer":"B","answerText":"","mnemonic":"了解｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616073},{"id":"tr-479","course":"天然药物化学","type":"选择","chapter":"1. 总论","number":"tr-0112","title":"原理为氢键吸附的色谱是","options":{"A":"离子交换色谱","B":"凝胶滤过色谱","C":"聚酰胺色谱","D":"硅胶色谱","E":"氧化铝色谱"},"answer":"C","answerText":"","mnemonic":"了解｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616073},{"id":"tr-480","course":"天然药物化学","type":"选择","chapter":"1. 总论","number":"tr-0113","title":"分馏法分离适用于","options":{"A":"极性大成分","B":"极性小成分","C":"升华性成分","D":"挥发性成分","E":"内酯类成分"},"answer":"D","answerText":"","mnemonic":"了解｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616073},{"id":"tr-481","course":"天然药物化学","type":"选择","chapter":"1. 总论","number":"tr-0114","title":"聚酰胺薄层色谱,下列展开剂中展开能力最强的是","options":{"A":"30%乙醇","B":"无水乙醇","C":"70%乙醇","D":"丙酮","E":"水"},"answer":"D","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616073},{"id":"tr-482","course":"天然药物化学","type":"选择","chapter":"1. 总论","number":"tr-0115","title":"可将天然药物水提液中的亲水性成分萃取出来的溶剂是","options":{"A":"乙醚","B":"醋酸乙酯","C":"丙酮","D":"正丁醇","E":"乙醇"},"answer":"D","answerText":"","mnemonic":"了解｜doubao习题汇总｜(答案存疑,以教材为准)｜巧记:亲水性溶剂——甲乙丙丁(甲醇/乙醇/丙酮/正丁醇)","addedAt":1781947616073},{"id":"tr-483","course":"天然药物化学","type":"选择","chapter":"1. 总论","number":"tr-0116","title":"红外光谱的单位是","options":{"A":"cm-1","B":"nm","C":"m/z","D":"mm","E":"δ"},"answer":"A","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616073},{"id":"tr-484","course":"天然药物化学","type":"选择","chapter":"1. 总论","number":"tr-0117","title":"在水液中不能被乙醇沉淀的是","options":{"A":"蛋白质","B":"多肽","C":"多糖","D":"酶","E":"鞣质"},"answer":"E","answerText":"","mnemonic":"了解｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616073},{"id"  生物合成的一类化合物。","mnemonic":"","addedAt":1781947616073},{"id":"tr-529","course":"天然药物化学","type":"填空记忆","chapter":"10. 海洋天然产物及其他","number":"tr-0162","title":"海参中除了分离出多糖之外,___还分离出___,作为阴离子表面活性剂作用于红血球,表现出___作用。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"皂苷,较强的溶血。","mnemonic":"","addedAt":1781947616073},{"id":"tr-530","course":"天然药物化学","type":"填空记忆","chapter":"10. 海洋天然产物及其他","number":"tr-0163","title":"从海洋生物中分离得到的前列腺素类成分,通常含有___元素。一般都具有___活性。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"卤族,抗肿瘤","mnemonic":"","addedAt":1781947616073},{"id":"tr-531","course":"天然药物化学","type":"填空记忆","chapter":"10. 海洋天然产物及其他","number":"tr-0164","title":"内酯环含有氧环的大环内酯类化合物除内酯环外,还可能含有___、___、___等。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"三元氧环,五元氧环,六元氧环。","mnemonic":"","addedAt":1781947616073},{"id":"tr-532","course":"天然药物化学","type":"填空记忆","chapter":"10. 海洋天然产物及其他","number":"tr-0165","title":"酯环上超过一个酯键的大环内酯化合物,称为___。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"多聚内酯。","mnemonic":"","addedAt":1781947616073},{"id":"tr-533","course":"天然药物化学","type":"填空记忆","chapter":"10. 海洋天然产物及其他","number":"tr-0166","title":"聚醚类化合物的特点是结构中含有多个以___为主的___环,醚环间___骈合,形成骈合后聚醚的同侧为___结构,氧原子___排列,形成一个梯子状结构,又称___。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"六元环,醚,反式,顺式,相间,聚醚梯。","mnemonic":"","addedAt":1781947616073},{"id":"tr-534","course":"天然药物化学","type":"填空记忆","chapter":"10. 海洋天然产物及其他","number":"tr-0167","title":"乙酸原化合物系指从___或___生物合成的一类化合物,___根据结构特点分为以下不同的结构类型:___、___、___、___。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"乙酸乙酯,乙酰辅酶 A,直链化合物,环氧化合物,碳环化合物,其它类似乙酸原化合物。","mnemonic":"","addedAt":1781947616073},{"id":"tr-535","course":"天然药物化学","type":"多选","chapter":"10. 海洋天然产物及其他","number":"tr-0168","title":"目前从海洋生物中获得的成分有有( )( )( )( )( )","options":{"A":"前列腺素类","B":"聚醚类化合物","C":"肽类化合物","D":"大环内酯类","E":"C15 乙酸原化合物"},"answer":"ABCDE","answerText":"","mnemonic":"重要｜习题汇总含答案","addedAt":1781947616073},{"id":"tr-536","course":"天然药物化学","type":"多选","chapter":"10. 海洋天然产物及其他","number":"tr-0169","title":"目前从海洋生物中获得的成分有","options":{"A":"前列腺素类","B":"聚醚类化合物","C":"肽类化合物","D":"大环内酯类","E":"C15 乙酸原化合物"},"answer":"ABCDE","answerText":"","mnemonic":"了解｜doubao习题汇总","addedAt":1781947616073},{"id":"tr-537","course":"天然药物化学","type":"多选","chapter":"10. 海洋天然产物及其他","number":"tr-0170","title":"大环内酯类化合物根据结构不同,根据结构类型不同可以分为","options":{"A":"前列腺素类","B":"简单大环内酯类","C":"内酯环含有氧环的大环内酯","D":"多聚内酯","E":"其他大环内酯类"},"answer":"BCDE","answerText":"","mnemonic":"了解｜doubao习题汇总","addedAt":1781947616073},{"id":"tr-538","course":"天然药物化学","type":"简答记忆","chapter":"10. 海洋天然产物及其他","number":"tr-0171","title":"目前研究发现的海洋天然产物中结构特殊、生理活性明显的化合物主要有哪几种类型?主要表现出什么生物活性?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"目前研究发现的海洋天然产物中结构特殊、生理活性明显的化合物主要有以下几种类型及活性:\n①大环内酯类化合物多具有抗肿瘤活性, 有的也可抗菌, 抗病毒。如从海绵 Thenonellswinhoei 中分离得到了具有广谱抗肿瘤活性和抗真菌活性的 swinholide A、B、C 等。②聚醚化合物, 是海洋生物中的一类毒性成分。可抗肿瘤, 作用于神经系统等。如从海绵 (Halichondrai okadai) 中分离得到的 halichondrin B 可抑制小鼠黑色素瘤细胞。③肽类化合物,具有多种生物活性,常见抗肿瘤,抗病毒等,有些已进入临床研究。如从芋螺属类软体动物中得到的芋螺毒素是一类具有神经药理活性的多肽, 具有镇痛、神经保护、抗惊厥、镇咳等作用, 应用潜力巨大, 目前已进入Ⅲ期临床研究。④\nC15 乙酸原化合物。⑤前列腺素类似物, 除表现前列腺素样活性外, 还表现出一定的抗肿瘤活性, 特别是一些含有卤素元素取代的化合物,如从八方珊瑚中分离得到的 punaglandin 作为抗肿瘤药临床研究有效。","mnemonic":"","addedAt":1781947616073},{"id":"tr-539","course":"天然药物化学","type":"简答记忆","chapter":"10. 海洋天然产物及其他","number":"tr-0172","title":"已发现的海洋活性产物按活性分类主要有哪些?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"①海洋抗肿瘤物质。从海绵、海兔、软珊瑚等海洋生物中得到了很多具有抗肿瘤活性的大环内酯、聚醚和海洋多肽类物质。②神经作用物质。主要为海洋毒素,如海兔毒素、海参毒素、河豚毒素等可作用于离子通道,对神经系统起作用。③心血管作用物质。如岩沙海葵毒素、类水母毒素等具有降压、抗心率失常等作用。④抗 AID 海洋药物。⑤其它还有免疫抑制、抗结核等作用物质。","mnemonic":"","addedAt":1781947616073},{"id":"tr-540","course":"天然药物化学","type":"简答记忆","chapter":"10. 海洋天然产物及其他","number":"tr-0173","title":"简述聚醚类化合物的结构特点。\n\n第十一章 天然产物的研究开发","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"聚醚类化合物的特点是结构中含有多个以六元环为主的醚环, 醚环间反式骈合, 形成骈合后聚醚的同侧为顺式结构,氧原子相间排列,形成一个梯子状结构,又称聚醚梯。常见聚醚梯类化合物多有无规则取代的甲基等, 一般极性低,为脂溶性毒素。另一类聚醚化合物, 同样含有高度氧化的碳链,但仅部分羟基形成醚环,多数羟基游离,与聚醚梯类化合物不同,属于水溶性聚醚。有的聚醚类化合物可以首尾相连形成大环内酯或局部形成大环。\n\n第十一章 参考答案","mnemonic":"","addedAt":1781947616073},{"id":"tr-541","course":"天然药物化学","type":"选择","chapter":"10. 海洋天然产物及其他","number":"tr-0174","title":"目前从海参中分离的生物活性成分是","options":{"A":"多糖","B":"萜类","C":"生物碱","D":"苷类","E":"挥发油"},"answer":"A","answerText":"","mnemonic":"了解｜doubao习题汇总","addedAt":1781947616073},{"id":"tr-542","course":"天然药物化学","type":"选择","chapter":"10. 海洋天然产物及其他","number":"tr-0175","title":"海洋生物量占地球总生物量约( )","options":{"A":"47%","B":"57%","C":"67%","D":"77%","E":"87%"},"answer":"E","answerText":"","mnemonic":"重要｜习题汇总含答案","addedAt":1781947616073},{"id":"tr-543","course":"天然药物化学","type":"名词解释记忆","chapter":"11. 天然产物的研究开发","number":"tr-0176","title":"天然产物化学","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"运用现代科学理论与方法研究天然药物中化学成分的一门学科。","mnemonic":"重要｜天然药物化学名词解释+简答.docx","addedAt":1781947616073},{"id":"tr-544","course":"天然药物化学","type":"多选","chapter":"11. 天然产物的研究开发","number":"tr-0177","title":"水提预试液可检查的成分有( )","options":{"A":"前列腺素类","B":"聚醚类化合物","C":"肽类化合物","D":"大环内酯类","E":"C15 乙酸原化合物"},"answer":"ABCDE","answerText":"","mnemonic":"重要｜习题汇总含答案 [答案据习题汇总答案键校正:BCD→ABCDE]","addedAt":1781947616073},{"id":"tr-545","course":"天然药物化学","type":"多选","chapter":"11. 天然产物的研究开发","number":"tr-0178","title":"为了提高预试验的准确性,可考虑采用的方法有( )","options":{"A":"前列腺素类","B":"简单大环内酯类","C":"内酯环含有氧环的大环内酯","D":"多聚内酯","E":"其他大环内酯类"},"answer":"BCDE","answerText":"","mnemonic":"重要｜习题汇总含答案 [答案据习题汇总答案键校正:ABCDE→BCDE]","addedAt":1781947616073},{"id":"tr-546","course":"天然药物化学","type":"选择","chapter":"11. 天然产物的研究开发","number":"tr-0179","title":"进行天然药物化学成分预试验时,欲想检查黄酮类的存在,供试液应选择","options":{"A":"中性醇提取液","B":"酸性醇提取液","C":"水提取液","D":"酸水提取液","E":"石油醚提取液"},"answer":"A","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616073},{"id":"tr-547","course":"天然药物化学","type":"选择","chapter":"11. 天然产物的研究开发"," "B":"","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"重要｜doubao知到;(判断答案格式规范:A→对)","addedAt":1781947616074},{"id":"tr-555","course":"天然药物化学","type":"判断","chapter":"2. 糖和苷","number":"tr-0188","title":"糖、蛋白质、脂质、核酸等为植物机体生命活动不可缺少的物质, 因此称之为一次代谢产物。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"汇集各章习题(sId6)","addedAt":1781947616074},{"id":"tr-556","course":"天然药物化学","type":"判断","chapter":"2. 糖和苷","number":"tr-0189","title":"氰苷是氧苷的一种。( )","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"汇集各章习题(sId6)","addedAt":1781947616074},{"id":"tr-557","course":"天然药物化学","type":"判断","chapter":"2. 糖和苷","number":"tr-0190","title":"用分级沉淀法得到的多糖, 常夹杂有较多的蛋白质, 为除之, 通常选择色素脱除法去除。()","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"汇集各章习题(sId6)","addedAt":1781947616074},{"id":"tr-558","course":"天然药物化学","type":"判断","chapter":"2. 糖和苷","number":"tr-0191","title":"糖类具有水溶性,但醇溶性会随着糖聚合度的增加而降低()","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"汇集各章习题(sId6)","addedAt":1781947616074},{"id":"tr-559","course":"天然药物化学","type":"判断","chapter":"2. 糖和苷","number":"tr-0192","title":"组成苷的糖的数目增多、苷元比例相应减小,则苷的亲水性增大。()","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"汇集各章习题(sId6)","addedAt":1781947616074},{"id":"tr-560","course":"天然药物化学","type":"名词解释记忆","chapter":"2. 糖和苷","number":"tr-0193","title":"原生苷与次生苷","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"原生苷:植物体内原存形式的苷。\n次生苷:是原生苷经过水解去掉部分糖生成的苷。","mnemonic":"","addedAt":1781947616074},{"id":"tr-561","course":"天然药物化学","type":"名词解释记忆","chapter":"2. 糖和苷","number":"tr-0194","title":"苷类(配糖体)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"苷类也称配糖体,是糖或糖的衍生物(如氨基酸、糖醛酸)与另一非糖物质,通过糖的半缩醛或半缩酮羟基与苷元脱水形成的一类化合物。","mnemonic":"必背｜星空历年真题","addedAt":1781947616074},{"id":"tr-562","course":"天然药物化学","type":"名词解释记忆","chapter":"2. 糖和苷","number":"tr-0195","title":"酶解","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"酶解:苷类物质在酶催化下水解生成次生苷的一种水解方法。","mnemonic":"","addedAt":1781947616074},{"id":"tr-563","course":"天然药物化学","type":"名词解释记忆","chapter":"2. 糖和苷","number":"tr-0196","title":"低聚糖","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"由2~9个单糖通过苷键结合而成的直链或支链聚糖。","mnemonic":"必背｜星空历年真题","addedAt":1781947616074},{"id":"tr-564","course":"天然药物化学","type":"名词解释记忆","chapter":"2. 糖和苷","number":"tr-0197","title":"苷化位移","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"苷化位移:糖苷化后,端基碳和苷元“-C 化学位移值均向低场移动, 而邻碳稍向高场移动(偶而也有向低场移动的),对其余碳的影响不大,这种苷化前后的化学变化,称苷化位移。","mnemonic":"","addedAt":1781947616074},{"id":"tr-565","course":"天然药物化学","type":"名词解释记忆","chapter":"2. 糖和苷","number":"tr-0198","title":"酚苷","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"非糖物质的酚羟基与糖的端基碳原子连接而成的苷。","mnemonic":"汇集各章习题(sId6)名词解释","addedAt":1781947616074},{"id":"tr-566","course":"天然药物化学","type":"名词解释记忆","chapter":"2. 糖和苷","number":"tr-0199","title":"β一构型","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"非糖物质与 β-糖的端基碳原子连接而成的苷。","mnemonic":"汇集各章习题(sId6)名词解释","addedAt":1781947616074},{"id":"tr-567","course":"天然药物化学","type":"名词解释记忆","chapter":"2. 糖和苷","number":"tr-0200","title":"碳苷","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"非糖物质与糖的端基碳原子以碳碳键连接而成的苷。","mnemonic":"汇集各章习题(sId6)名词解释","addedAt":1781947616074},{"id":"tr-568","course":"天然药物化学","type":"名词解释记忆","chapter":"2. 糖和苷","number":"tr-0201","title":"次生苷","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"原始苷被部分切去糖后生成的苷。","mnemonic":"汇集各章习题(sId6)名词解释","addedAt":1781947616074},{"id":"tr-569","course":"天然药物化学","type":"名词解释记忆","chapter":"2. 糖和苷","number":"tr-0202","title":"多聚糖","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"由十个以上单糖通过苷键连接而成的糖称为多聚糖。","mnemonic":"汇集各章习题(sId6)名词解释","addedAt":1781947616074},{"id":"tr-570","course":"天然药物化学","type":"名词解释记忆","chapter":"2. 糖和苷","number":"tr-0203","title":"杀酶保苷（灭活）","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"杀酶保苷是指在采集/加工药材时，采用加热（如蒸、煮）、用沸水或醇等方法迅速破坏（灭活）药材中能水解苷的酶，以防止原生苷被酶解为次生苷，从而保留原生苷的处理措施。","mnemonic":"🆕课堂强调·补充｜〔2026-03-27 09:38 [08:12]〕｜非真题原题·据课堂整理","addedAt":1781947616074},{"id":"tr-571","course":"天然药物化学","type":"名词解释记忆","chapter":"2. 糖和苷","number":"tr-0204","title":"端基碳","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"单糖成环后形成了一个新的手性碳原子,这个新的手性碳原子就是端基碳","mnemonic":"重要｜WCY整理｜WCY补充","addedAt":1781947616074},{"id":"tr-572","course":"天然药物化学","type":"名词解释记忆","chapter":"2. 糖和苷","number":"tr-0205","title":"【名词解释】差向异构体","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"差向异构体(anomers):单糖成环后形成一个新的不对称碳原子称端基碳(anomeric carbon),生成一对a、β两种构型的差向异构体。因C=O为平面结构,羟基可从平面两边进攻C=O,得到a/β两种异构体。\n\n〔老师强调/扣分点〕老师:『注意这两个名词解释,通过考题要考得出来』。Haworth式判断:五碳吡喃糖C4-OH与端基碳羟基同侧为α、异侧为β。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 名词解释(差向异构体/端基碳anomers—知到判断'五元结构糖叫呋喃糖'+真题名解)〕｜参考答案据课堂/教材整理","addedAt":1781947616074},{"id":"tr-573","course":"天然药物化学","type":"名词解释记忆","chapter":"2. 糖和苷","number":"tr-0206","title":"酯值","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"代表挥发油中脂类成分含量， 以水解 1g 挥发油所需 KOH 的毫克数来表示","mnemonic":"重要｜天然药物化学名词解释+简答.docx","addedAt":1781947616074},{"id":"tr-574","course":"天然药物化学","type":"填空记忆","chapter":"2. 糖和苷","number":"tr-0207","title":"Molisch反应的试剂是___和___,可用于鉴别糖和苷,其阳性现象是两液面间出现___。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"α-萘酚,浓硫酸,紫(红)色环","mnemonic":"题干据教材还原(原OCR截断)","addedAt":1781947616074},{"id":"tr-575","course":"天然药物化学","type":"填空记忆","chapter":"2. 糖和苷","number":"tr-0208","title":"将苷加入与水不相混溶的有机溶剂中,使水解后的苷元立即进入___,从而获得原始苷元,该法称为___。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"有机相,二相水解法","mnemonic":"题干据教材还原(原OCR截断)","addedAt":1781947616074},{"id":"tr-576","course":"天然药物化学","type":"填空记忆","chapter":"2. 糖和苷","number":"tr-0209","title":"单糖的链状结构常用___投影式表示,环状结构常用___投影式表示。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"Fischer,Haworth","mnemonic":"原topic标签题,据答案改写为规范填空题并挖考点;答案存answerText","addedAt":1781947616074},{"id":"tr-577","course":"天然药物化学","type":"填空记忆","chapter":"2. 糖和苷","number":"tr-0210","title":"转化糖酶能水解___苷键。麦芽糖酶水解___苷键。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"β-果糖苷；α-葡萄糖苷","mnemonic":"汇集各章习题(sId6)填空","addedAt":1781947616074},{"id":"tr-578","course":"天然药物化学","type":"填空记忆","chapter":"2. 糖和苷","number":"tr-0211","title":"苷类的溶解性与苷元和糖的结构均有关系。一般而言,___苷类分子的极性、亲水性随糖基数目的增加而___。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"增加","mnemonic":"汇集各章习题(sId6)填空","addedAt":1781947616074},{"id":"tr-579","course":"天然药物化学","type":"填空记忆","chapter":"2. 糖和苷","number":"tr-0212","title":"Molisch反应的试剂是___和___,用于鉴别糖和苷,反应现象是两液面间出现___。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"α-萘酚,浓硫酸,紫色环","mnemonic":"填空考点挖空(考点优先);答案存answerText","addedAt":1781947616074},{"id":"tr-580","course":"天然药物化学","type":"填空记忆","chapter":"2. 糖和苷","number":"tr-0213","title":"苷类又称___,是糖或糖衍生物与另一非糖物质通过糖的___连接而成的化合物。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"配糖体,端基碳原子","mnemonic":"填空考点挖空(考点优先);答案存answerText","addedAt":1781947616074},{"id":"tr-581","course":"天然药物化学","type":"多选","chapter":"2. 糖和苷","number":"tr-0214","title":"属于氧苷的是","options":{"A":"红景天苷","B":"天麻苷","C":"芦荟苷","D":"苦杏仁苷","E":"萝卜苷"},"answer":"ABD","answerText":"","mnemonic":"了解｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616074},{"id":"tr-582","course":"天然药物化学","type":"多选","chapter":"2. 糖和苷","number":"tr-0215","title":"从中药中提取原生苷的方法是","options":{"A":"沸水提取","B":"70%乙醇提取","C":"取新鲜植物 40℃发酵 12 小时","D":"甲醇提取","E":"在中药中加入碳酸钙"},"answer":"ABE","answerText":"","mnemonic":"了解｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616074},{"id":"tr-583","course":"天然药物化学","type":"多选","chapter":"2. 糖和苷","number":"tr-0216","title":"酶水解具有","options":{"A":"专属性","B":"选择性","C":"氧化性","D":"保持苷元结构不变","E":"条件温和"},"answer":"ABDE","answerText":"","mnemonic":"了解｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616074},{"id":"tr-584","course":"天然药物化学","type":"多选","chapter":"2. 糖和苷","number":"tr-0217","title":"水解后能够得到真正苷元的水解方法是","options":{"A":"酶水解","B":"碱水解","C":"酸水解","D":"氧化开裂法","E":"剧烈酸水解"},"answer":"AD","answerText":"","mnemonic":"了解｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616074},{"id":"tr-585","course":"天然药物化学","type":"多选","chapter":"2. 糖和苷","number":"tr-0218","title":"确定苷键构型的方法为","options":{"A":"利用 Klyne 经验公式计算","B":"1H-NMR 中,端基氢偶合常数 J=6~8Hz 为β-构型, J=3~4Hz 为α-构型","C":"1H-NMR 中,端基氢偶合常数 J=6~8Hz 为α-构型, J=3~4Hz 为β-构型","D":"¹³C-NMR 中,端基碳与氢偶合常数 J=160Hz 为β-构型, J=170Hz 为α-构型","E":"¹³C-NMR 中,端基碳与氢偶合常数 J=160Hz 为α-构型, J=170Hz 为β-构型"},"answer":"ABD","answerText":"","mnemonic":"了解｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616074},{"id":"tr-586","course":"天然药物化学","type":"多选","chapter":"2. 糖和苷","number":"tr-0219","title":"下列哪些特殊苷可在碱性条件下发生水解（）","options":{"A":"酯苷","B":"酚苷","C":"烯醇苷","D":"β-吸电子取代苷","E":"普通氧苷（醇苷）"},"answer":"ABCD","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-03-13 09:38 [24:44]〕｜非真题原题·据课堂整理","addedAt":1781947616074},{"id":"tr-587","course":"天然药物化学","type":"简答记忆","chapter":"2. 糖和苷","number":"tr-0220","title":"【母题】苷类一般对碱稳定，但哪些特殊的苷可在碱性条件下水解？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点：苷一般对碱较稳定（多用碱水解区别于酸），但下列特殊苷能在碱性条件下水解——①酯苷（苷键为酯键，易被碱水解）；②酚苷；③烯醇苷；④β-位有吸电子取代基的苷（如β-硝基、β-羰基等使苷键活化者）。","mnemonic":"🆕课堂强调·补充｜〔2026-03-13 09:38 [24:44]〕｜非真题原题·据课堂整理｜汪玢·碱水解特殊苷","addedAt":1781947616074},{"id":"tr-588","course":"天然药物化学","type":"简答记忆","chapter":"2. 糖和苷","number":"tr-0221","title":"某苷经箱守法甲基化(CH₃I,NaH,DMSO)及甲醇解(CH₃OH,HCl)得到如下产物,根据产物推测原苷的结构,并写出上述两个反应的全部过程。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"箱守法(Hakomori法)甲基化:NaH与DMSO生成二甲亚砜负离子(碳负离子),夺取苷分子中游离羟基的质子生成醇钠,再与CH₃I发生Williamson醚合成,将所有游离羟基甲基化;随后甲醇解(CH₃OH/HCl)切断苷键并打开糖环。根据甲基化产物中游离羟基(原参与成苷/成环的位置甲基化不上)的位置,即可推断糖与糖、糖与苷元的连接位置及原苷结构。","mnemonic":"原误标填空,实为简答/论述题;题干据答案还原,答案据教材整理(箱守法等)","addedAt":1781947616074},{"id":"tr-589","course":"天然药物化学","type":"简答记忆","chapter":"2. 糖和苷","number":"tr-0222","title":"苷键具有什么性质,常用哪些方法裂解?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"苷键是苷类分子特有的化学键,具有缩醛性质,易被化学或生物方法裂解。苷键裂解常用的方法有酸、碱催化水解法、酶催化水解法、氧化开裂法等","mnemonic":"了解｜doubao习题汇总","addedAt":1781947616074},{"id":"tr-590","course":"天然药物化学","type":"简答记忆","chapter":"2. 糖和苷","number":"tr-0223","title":"苷类的酸催化水解与哪些因素有关?水解难易有什么规律?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"苷类的酸催化水解与苷键原子的碱度(即苷键原子上的电子云密度及其空间环境)有关,有利于苷键原子质子化就有利于水解。水解难易规律:①按苷键原子不同,水解易难顺序为 N-苷>O-苷>S-苷>C-苷;②呋喃糖苷较吡喃糖苷易水解,酮糖苷较醛糖苷易水解;③吡喃糖苷中,吡喃环C-5上取代基越大越难水解,速率顺序为 五碳糖苷>甲基五碳糖苷>六碳糖苷>七碳糖苷>糖醛酸苷(C-5为-COOH的糖醛酸苷最难水解);④氨基糖较羟基糖难水解,羟基糖又较去氧糖难水解,易难顺序为 2,6-二去氧糖苷>2-去氧糖苷>6-去氧糖苷>2-羟基糖苷>2-氨基糖苷。","mnemonic":"了解｜doubao习题汇总｜据教材补","addedAt":1781947616074},{"id":"tr-591","course":"天然药物化学","type":"简答记忆","chapter":"2. 糖和苷","number":"tr-0224","title":"【简答】强酸水解","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"强酸水解:酸浓度3~5%,延长水解时间并加压;能水解2-OH糖、定量得葡萄糖,但引起苷元脱水(得不到原苷元)。如羟基毛地黄毒苷强酸水解得三脱水产物而非原苷元。\n\n〔老师强调/扣分点〕强酸水解副作用=苷元脱水。结构中C3连糖、C14-OH、C16-OH易脱水。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 简答(强酸水解苷元脱水—真题'裂解苷键方法'+强心苷脱水苷)〕｜参考答案据课堂/教材整理","addedAt":1781947616074},{"id":"tr-592","course":"天然药物化学","type":"简答记忆","chapter":"2. 糖和苷","number":"tr-0225","title":"【简答】盐酸丙酮法(Mannich水解)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"盐酸丙酮法(Mannich水解):HCl+丙酮溶液,室温长时间反应;要求糖分子有C2-OH和C3-OH;邻二-OH与丙酮生成丙酮化物再水解;可得原苷元和糖的衍生物(苷元不受影响)。\n\n〔老师强调/扣分点〕优点=既能水解又保护苷元不脱水。前提:二位、三位必须有羟基取代。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 简答(盐酸丙酮法Mannich水解条件—真题'裂解苷键方法'简答之一)〕｜参考答案据课堂/教材整理","addedAt":1781947616074},{"id":"tr-593","course":"天然药物化学","type":"简答记忆","chapter":"2. 糖和苷","number":"tr-0226","title":"【简答】过碘酸氧化(高碘酸)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"过碘酸氧化(高碘酸):裂解邻二醇结构。可推测糖苷键连接位置:1,3连接的糖苷键不与过碘酸反应(无邻二醇),1,4连接可反应——用于确定糖与糖连接位置。\n\n〔老师强调/扣分点〕老师强调用于结构测定(糖连接位置)。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(过碘酸氧化邻二醇推苷键位置—知到'全甲基化甲醇解判断糖连接位置'+'1,3连接不〕｜参考答案据课堂/教材整理","addedAt":1781947616074},{"id":"tr-594","course":"天然药物化学","type":"简答记忆","chapter":"2. 糖和苷","number":"tr-0227","title":"【简答】苷键裂解的5种方法","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"苷键裂解的5种方法:①酸催化水解(重点)②乙酰解③碱催化水解和β消除④酶催化水解(重点)⑤氧化开裂法/Smith降解法(重点)。苷键=缩醛键,对碱和氧化剂较稳定,易被稀酸水解。\n\n〔老师强调/扣分点〕老师:『三个重点:酸水解、酶水解、Smith降解,都必须掌握』。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(★苷键裂解5法:酸/乙酰解/碱/酶/氧化开裂—知到'水解得真正苷元:氧化开裂法/〕｜参考答案据课堂/教材整理","addedAt":1781947616074},{"id":"tr-595","course":"天然药物化学","type":"简答记忆","chapter":"2. 糖和苷","number":"tr-0228","title":"【简答】苷键构型确定(重点)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"苷键构型确定(重点):①酶水解法——麦芽糖酶水解α-苷键、苦杏仁酶水解β-苷键②1H-NMR——端基质子信号δ5.0ppm,据偶合常数J值判断α/β(六碳吡喃糖需用碳谱)③13C-NMR——端基碳化学位移α-甲苷97~101ppm、β-甲苷103~106ppm,α/β相差约4ppm。\n\n〔老师强调/扣分点〕笔记★★★(β构型化学位移值更大,大4ppm)。老师:『一定会考一道这种题,至少10分』。易混:相差4ppm的方向。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(★苷键构型确定:麦芽糖酶α/苦杏仁酶β+1H-NMR端基氢J值—知到多选'确定苷〕｜参考答案据课堂/教材整理","addedAt":1781947616074},{"id":"tr-596","course":"天然药物化学","type":"简答记忆","chapter":"2. 糖和苷","number":"tr-0229","title":"【简答】糖苷分离8法","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"糖苷分离8法:活性炭柱色谱(分离水溶性物质如氨基酸/糖/苷,上样量大、来源廉、缺点:无理想吸附力分级方法)、纤维素色谱、离子交换柱色谱、凝胶柱色谱、季铵氢氧化物沉淀法、分级沉淀/溶解法、蛋白质除去法、铅盐沉淀法。\n\n〔老师强调/扣分点〕笔记活性炭吸附★★★★(非极性、LH-20适用)。老师重点讲活性炭分离糖/苷。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(糖苷分离8法:活性炭/凝胶/离子交换—知到多选'糖和苷分离方法:活性炭/凝胶/离〕｜参考答案据课堂/教材整理","addedAt":1781947616074},{"id":"tr-597","course":"天然药物化学","type":"简答记忆","chapter":"2. 糖和苷","number":"tr-0230","title":"【简答】强心苷提取分离","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"强心苷提取分离:提取注意共存物质(糖类、皂苷、色素、鞣质)干扰。分离方法:①两相溶剂萃取法(据分配系数不同)②逆流分配法③色谱分离(硅胶吸附层析分离亲脂性单糖苷/次级苷/苷元、C18反相分配层析对亲水性成分)。可两糖苷与四糖苷分离。\n\n〔老师强调/扣分点〕老师:『重点掌握两糖苷与四糖苷的区别分离』。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(强心苷提取分离两相溶剂萃取—知到'提取狄戈辛次生苷不宜方法'+真题)〕｜参考答案据课堂/教材整理","addedAt":1781947616074},{"id":"tr-598","course":"天然药物化学","type":"简答记忆","chapter":"2. 糖和苷","number":"tr-0231","title":"简述苷键裂解常用的方法有哪些？酸催化水解的反应机理和常用试剂、催化剂有哪些？方法：酸催化水解、碱催化水解、乙酰解、酶解、过碘酸裂解","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"酸催化水解的反应机理：苷原子先被质子化，然后苷键断裂形成糖基正离子或半椅式的中间体，该中间体在雨水结合形成糖，并释放催化剂质子。常用试剂：水或稀酸 催化剂：稀盐酸、稀硫酸、乙酸、 甲酸","mnemonic":"重要｜天然药物化学名词解释+简答.docx","addedAt":1781947616074},{"id":"tr-599","course":"天然药物化学","type":"论述记忆","chapter":"2. 糖和苷","number":"tr-0232","title":"【论述】酸水解难易规律","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"论述题","answerText":"酸水解难易规律:①苷原子电子密度升高、质子化能力增强则易水解,顺序 N-苷>O-苷>S-苷>C-苷(C-苷最难水解,与碱度顺序一致)②呋喃糖苷比吡喃糖苷易水解(五元环平面性使取代基重叠、水解中间体张力小)③酮糖比醛糖易水解。\n\n〔老师强调/扣分点〕高频为什么类:为什么C-苷最难水解(苷原子电子密度低、难质子化);为什么呋喃糖苷易水解(环张力)。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择(★酸水解难易N>O>S>C苷—知到'苷键酸水解错误论述'(多题:呋喃>吡喃,去氧>羟基〕｜参考答案据课堂/教材整理","addedAt":1781947616074},{"id":"tr-600","course":"天然药物化学","type":"选择","chapter":"2. 糖和苷","number":"tr-0233","title":"最难被酸水解的是","options":{"A":"氧苷","B":"氮苷","C":"硫苷","D":"碳苷","E":"氰苷"},"answer":"D","answerText":"","mnemonic":"了解｜doubao习题汇总","addedAt":1781947616074},{"id":"tr-601","course":"天然药物化学","type":"选择","chapter":"2. 糖和苷","number":"tr-0234","title":"提取苷类成分时,为抑制或破坏酶常加入一定量的","options":{"A":"硫酸","B":"酒石酸","C":"碳酸钙","D":"氢氧化钠","E":"碳酸钠"},"answer":"C","answerText":"","mnemonic":"了解｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616074},{"id":"tr-602","course":"天然药物化学","type":"选择","chapter":"2. 糖和苷","number":"tr-0235","title":"提取药材中的原生苷,除了采用沸水提取外,还可选用","options":{"A":"热乙醇 60%~","B":"氯仿","C":"乙醚","D":"冷水","E":"酸水"},"answer":"A","answerText":"","mnemonic":"了解｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616074},{"id":"tr-603","course":"天然药物化学","type":"选择","chapter":"2. 糖和苷","nu 氯化铁反应","E":"醋酐-浓硫酸反应"},"answer":"BC","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616074},{"id":"tr-681","course":"天然药物化学","type":"多选","chapter":"3. 苯丙素类化合物","number":"tr-0314","title":"Gibb’s 反应为阴性的化合物有( )","options":{"A":"7, 8-二羟基香豆素","B":"8-甲氧基-6, 7-呋喃香豆素","C":"6, 7-二羟基香豆素","D":"6-甲氧基香豆素","E":"七叶苷"},"answer":"BCDE","answerText":"","mnemonic":"重要｜习题汇总含答案 [答案据习题汇总答案键校正:B→BCDE]","addedAt":1781947616074},{"id":"tr-682","course":"天然药物化学","type":"多选","chapter":"3. 苯丙素类化合物","number":"tr-0315","title":"简单香豆素的取代规律是","options":{"A":"7 位大多有含氧基团存在","B":"5、6、8 位可有含氧基团存在","C":"常见的取代基团有羟基、甲氧基、异戊烯基等","D":"异戊烯基常连在 6、8 位","E":"异戊烯基常连在 3、7 位"},"answer":"ABCD","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616074},{"id":"tr-683","course":"天然药物化学","type":"简答记忆","chapter":"3. 苯丙素类化合物","number":"tr-0316","title":"【母题·易混点】香豆素按母核取代情况可分为哪几类？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点：课本通常按母核结构分为4类——①简单香豆素；②呋喃香豆素（线型/角型）；③吡喃香豆素；④其他香豆素（如异香豆素、双香豆素等）。注意：本课老师按取代基不同更细分为6类（在课本4类基础上进一步细化），答题时以老师课堂分类为准并能与课本对应。","mnemonic":"🆕课堂强调·补充｜〔2026-03-17 09:38 [05:10]〕｜非真题原题·据课堂整理｜老师分6类/课本4类·易混","addedAt":1781947616074},{"id":"tr-684","course":"天然药物化学","type":"简答记忆","chapter":"3. 苯丙素类化合物","number":"tr-0317","title":"【母题】香豆素类化合物按结构如何分类？（注意老师讲法与课本的差异）","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点：香豆素以苯骈α-吡喃酮为母核。课本通常分为4类——①简单香豆素；②呋喃香豆素（线型如补骨脂内酯、角型如白芷内酯）；③吡喃香豆素；④其他香豆素（如双香豆素、异香豆素等）。老师课堂上进一步细分为6类（在课本4类基础上将\"其他类\"再展开）。答题时按老师课堂口径作答，避免只写一两类。","mnemonic":"🆕课堂强调·补充｜〔2026-03-10 10:28 [05:10]〕｜非真题原题·据课堂整理｜情报确认·老师6类/课本4类","addedAt":1781947616074},{"id":"tr-685","course":"天然药物化学","type":"简答记忆","chapter":"3. 苯丙素类化合物","number":"tr-0318","title":"香豆素及其苷在碱性条件下能与盐酸羟胺作用生成异羟肟酸,在酸性条件下再与三氯化铁试剂反应生成何物?此性质有何用途?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"生成红色配合物。该异羟肟酸铁反应是香豆素(内酯结构)的特征鉴别反应,可用于香豆素及其内酯类化合物的鉴别与分离。","mnemonic":"原误标填空,实为简答/论述题;题干据答案还原,答案据教材整理(箱守法等)","addedAt":1781947616074},{"id":"tr-686","course":"天然药物化学","type":"简答记忆","chapter":"3. 苯丙素类化合物","number":"tr-0319","title":"游离香豆素及其苷分子中具有内酯环结构,在碱水中可水解开环,加酸又环合成难溶于水的内酯而沉淀析出,此性质有何用途?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"此「碱开环—酸环合」的内酯特性可用于香豆素及其内酯类化合物的鉴别和提取分离(碱溶酸沉法)。","mnemonic":"原误标填空,实为简答/论述题;题干据答案还原,答案据教材整理(箱守法等)","addedAt":1781947616074},{"id":"tr-687","course":"天然药物化学","type":"简答记忆","chapter":"3. 苯丙素类化合物","number":"tr-0320","title":"分别取6,7-呋喃香豆素和7,8-呋喃香豆素样品于两支试管中,分别加碱碱化,然后加入Emerson试剂(或Gibbs试剂),如何区别二者?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"加碱后再加Emerson试剂(或Gibb's试剂):反应呈阳性(显色)者为7,8-呋喃香豆素(C6位无取代、活泼),阴性者为6,7-呋喃香豆素。因Emerson/Gibbs反应要求酚羟基对位有游离活泼氢。","mnemonic":"原误标填空,实为简答/论述题;题干据答案还原,答案据教材整理(箱守法等)","addedAt":1781947616074},{"id":"tr-688","course":"天然药物化学","type":"简答记忆","chapter":"3. 苯丙素类化合物","number":"tr-0321","title":"某药材中含有A、B两种香豆素类化合物,如何用化学显色方法将二者加以鉴别?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"A、B分别用Gibb's试剂(2,6-二氯(溴)苯氯亚胺)鉴别,如果反应生成蓝色化合物是A,化合物B不产生颜色;或用Emerson试剂(4-氨基安替比林-铁氰化钾)反应鉴别,A生成红色化合物,B不产生颜色","mnemonic":"必背｜doubao习题汇总｜题干据答案重构(原OCR丢失)","addedAt":1781947616074},{"id":"tr-689","course":"天然药物化学","type":"简答记忆","chapter":"3. 苯丙素类化合物","number":"tr-0322","title":"将四成分(七叶苷、七叶内酯、伞形花内酯等)分别溶于乙醇,如何用化学方法逐一鉴别?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"①加α-萘酚-浓硫酸(Molisch)试剂,产生紫色环的是七叶苷(含糖);②其余成分碱水解后用Gibb's试剂,产生蓝色的是伞形花内酯,另一个为七叶内酯。","mnemonic":"原误标填空,实为简答/论述题;题干据答案还原,答案据教材整理(箱守法等)","addedAt":1781947616074},{"id":"tr-690","course":"天然药物化学","type":"简答记忆","chapter":"3. 苯丙素类化合物","number":"tr-0323","title":"简述碱溶酸沉法提取分离香豆素类成分的基本原理,并说明提取分离时应注意的问题。(4点)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"香豆素类化合物结构中具有内酯环,在热碱液中内酯环开裂成顺式邻羟基桂皮酸盐,溶于水中,加酸又重新环合成内酯而析出。 在提取分离时须注意所加碱液的浓度不宜太浓,加热时间不宜过长,温度不宜过高,以免破坏内酯环。碱溶酸沉法不适合于遇酸、碱不稳定的香豆素类化合物的提取","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","addedAt":1781947616074},{"id":"tr-691","course":"天然药物化学","type":"简答记忆","chapter":"3. 苯丙素类化合物","number":"tr-0324","title":"写出异肟酸铁反应的试剂、反应式、反应结果以及在鉴别结构中的用途","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"试剂:盐酸羟胺、碳酸钠、盐酸、三氯化铁 反应式: 反应结果:异羟肟酸铁而显红色。 应用:签别有内酯结构的化合物","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","addedAt":1781947616074},{"id":"tr-692","course":"天然药物化学","type":"简答记忆","chapter":"3. 苯丙素类化合物","number":"tr-0325","title":"民间草药窝儿七中含有抗癌成分鬼白毒素、脱氧鬼白毒素、脱氢鬼白毒素等,试设计提取其总木脂素的流程,若用硅胶色谱法","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"民间草药窝儿七中含有抗癌成分鬼白毒素、脱氧鬼白毒素、脱氢鬼白毒素等,试设计提取其总木脂素的流程,若用硅胶色谱法分离,分析三者的Rf值大小顺序","mnemonic":"了解｜doubao习题汇总","addedAt":1781947616074},{"id":"tr-693","course":"天然药物化学","type":"简答记忆","chapter":"3. 苯丙素类化合物","number":"tr-0326","title":"【简答】香豆素显色反应","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"香豆素显色反应:①异羟肟酸铁反应(内酯/酯键,呈红色)②Gibbs反应(2,6-二氯(溴)苯醌氯亚胺,酚羟基对位无取代呈阳性蓝色)③Emerson反应(氨基安替匹林+铁氰化钾,酚羟基且对位无取代呈红色)。游离香豆素能升华、随水蒸气蒸出;成苷后无香味、不升华、不挥发。\n\n〔老师强调/扣分点〕老师:『Gibbs和Emerson是重点,条件:有游离酚羟基且对位无取代呈阳性』。扣分点:必须强调'对位无取代'。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(★香豆素显色:异羟肟酸铁/Gibbs/Emerson—知到'鉴别香豆素首选异羟肟〕｜参考答案据课堂/教材整理","addedAt":1781947616074},{"id":"tr-694","course":"天然药物化学","type":"选择","chapter":"3. 苯丙素类化合物","number":"tr-0327","title":"由甲戊二羟酸演变而成的化合物类型是","options":{"A":"糖类","B":"萜类","C":"黄酮类","D":"木脂素类","E":""},"answer":"B","answerText":"","mnemonic":"了解｜doubao知到","addedAt":1781947616074},{"id":"tr-695","course":"天然药物化学","type":"选择","chapter":"3. 苯丙素类化合物","number":"tr-0328","title":"鉴别香豆素首选的显色反应为","options":{"A":"三氯化铁反应","B":"Gibb ’s 反应","C":"Emerson 反应","D":"异羟肟酸铁反应","E":"三氯化铝反应"},"answer":"D","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616074},{"id":"tr-696","course":"天然药物化学","type":"选择","chapter":"3. 苯丙素类化合物","number":"tr-0329","title":"游离香豆素可溶于热的氢氧化钠水溶液,是由于其结构中存在","options":{"A":"甲氧基","B":"亚甲二氧基","C":"内酯环","D":"酚羟基对位的活泼氢","E":"酮基"},"answer":"C","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616074},{"id":"tr-697","course":"天然药物化学","type 容易解离。","E":"上述原因均不是。"},"answer":"AD","answerText":"","mnemonic":"重要｜习题汇总含答案","addedAt":1781947616074},{"id":"tr-779","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0412","title":"醌类化合物分哪几种类型,写出基本母核,各举一例。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"醌类分四种类型:①**苯醌**(对苯醌、邻苯醌,母核为苯醌环,如2,6-二甲氧基对苯醌);②**萘醌**(α-(1,4)、β-(1,2)、amphi-(2,6)三型,以α-萘醌最常见,如紫草素);③**菲醌**(邻菲醌、对菲醌,如丹参醌ⅡA);④**蒽醌**(最重要,含羟基蒽醌如大黄素、蒽酚/蒽酮、二蒽酮如番泻苷)。基本母核分别为苯醌、萘醌、菲醌、蒽醌环。","mnemonic":"[答案据教材手写补全] [合并自tr-522(sId1)]","addedAt":1781947616074},{"id":"tr-780","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0413","title":"蒽醌类化合物分哪几类,举例说明。\n蒽醌类、蒽酚类、蒽酮类、二蒽酮类。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"蒽醌类分为\n(1)羟基蒽醌类,又分为大黄素型,如大黄素,茜素型如茜草素。\n(2)蒽酚.蒽酮类:为蒽醌的还原产物,如柯亚素。\n(3)二蒽酮和二蒽醌类:如番泻苷类。","mnemonic":"","addedAt":1781947616074},{"id":"tr-781","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0414","title":"为什么β-OH 蒽醌比“-OH 蒽醌的酸性大。\n答: 因为β-OH 与羰基处于同一个共轭体系中,受羰基吸电子作用的影响,使羟基上氧的电子云密度降低,质子容易解离,酸性较强。而“-OH 处在羰基的邻位,因产生分子内氢键,质子不易解离,故酸性较弱。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"因为β-OH 与羰基处于同一个共轭体系中,受羰基吸电子作用的影响,使羟基上氧的电子云密度降低,质子容易解离,酸性较强。而“-OH 处在羰基的邻位,因产生分子内氢键,质子不易解离,故酸性较弱。","mnemonic":"","addedAt":1781947616074},{"id":"tr-782","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0415","title":"比较下列蒽醌的酸性强弱,并利用酸性的差异分离他们,写出流程。\nA. 1, 4, 7-三羟基蒽醌\nB. 1, 5-二 OH-3-COOH 蒽醌\nC. 1, 8-二 OH 蒽醌\nD. 1-CH3 蒽醌","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"酸性强弱顺序: B>A>C>D\n混 合 物 碱水液(含有 A)\n乙醚液 5%Na2CO3\n乙醚层 5%NaOH","mnemonic":"","addedAt":1781947616074},{"id":"tr-783","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0416","title":"用显色反应区别下列各组成分:\n(1)大黄素与大黄素-8-葡萄糖苷\n(2)番泻苷 A 与大黄素苷\n(3)蒽醌与苯醌\n答:\n醌类化合物分为四种类型: 有苯醌,如 2, 6-二甲氧基对苯醌; 萘醌,如紫草素; 菲醌,如丹参醌Ⅰ; 蒽醌,如大黄酸。\n萘醌\n±%Ő《\n·圧Ő《\nŸìŐ《","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"(1)将二成分分别用乙醇溶解,分别加 Molish 试剂,产生紫色环的为大黄素-8-葡萄糖苷,不反应的为大黄素。\n(2) 将二成分分别加 5%的氢氧化钠溶液,溶解后溶液显红色的是大黄素苷,溶解后溶液不变红色的为番泻苷 A。\n(3)将二成分分别用乙醇溶解,分别滴于硅胶板上加无色亚甲蓝试剂,在白色背景上与呈现蓝色斑点为苯醌,另一个无反应的是蒽醌。","mnemonic":"","addedAt":1781947616074},{"id":"tr-784","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0417","title":"【母题】羟基蒽醌类化合物酸性强弱的排序规律是什么？（pH梯度萃取依据）","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点：羟基蒽醌酸性强弱取决于羟基位置与数目。一般规律：含—COOH > 含两个以上β-OH（2位等）> 一个β-OH > 两个α-OH > 一个α-OH。即β-羟基酸性强于α-羟基（α-OH与相邻羰基形成分子内氢键，酸性减弱）。据此可用pH梯度萃取法（不同浓度碱液：5%NaHCO₃→5%Na₂CO₃→1%NaOH→5%NaOH）依次分离酸性不同的羟基蒽醌。","mnemonic":"🆕课堂强调·补充｜〔2026-03-17 10:28 [10:00]〕｜非真题原题·据课堂整理｜醌类重点·pH梯度萃取","addedAt":1781947616074},{"id":"tr-785","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0418","title":"上述成分分别用乙醇溶解后,在滤纸上进行无色亚甲蓝反应及Molisch反应,如何鉴别A、B、C?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"①滤纸上无色亚甲蓝反应:在白色背景上呈现蓝色斑点的是B和C(苯醌/萘醌类),无正反应的为A;②再取B、C加Molisch试剂,产生紫色环的为C(含糖苷),另一为B。","mnemonic":"原误标填空,实为简答/论述题;题干据答案还原,答案据教材整理(箱守法等)","addedAt":1781947616074},{"id":"tr-786","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0419","title":"现有A、B两种醌类化合物,如何用5%氢氧化钠溶液(碱液显色)将二者加以鉴别?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"将A、B分别加5%的氢氧化钠溶液,溶解后溶液显红色的是B,溶解后溶液不变红色的为A","mnemonic":"了解｜doubao习题汇总｜题干据答案重构(原OCR丢失)","addedAt":1781947616074},{"id":"tr-787","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0420","title":"现有A、B、C、D、E五种成分,试用无色亚甲蓝反应和Molish反应等设计鉴别方案,区分各成分。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"上述成分分别用乙醇溶解,分别做: 1无色亚甲蓝反应,产生正反应的是C和E,无正反应的为A、B、D 2将C和E分别做Molish反应,产生紫色环的是E,不反应的是C 3将A、B、D分别加碱液,溶液变红色的是B、D,不反应的是A 4将B、D分别做Molish反应,产生紫色环的是D,不反应的是B","mnemonic":"了解｜doubao习题汇总｜题干据答案重构(原OCR丢失)","addedAt":1781947616074},{"id":"tr-788","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0421","title":"蒽醌类化合物分哪几类,举例说明","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"蒽醌类化合物按母核分为两大类:①单蒽核类——包括(a)蒽醌类(又分大黄素型,羟基分布在两侧苯环、多为橙黄色,如大黄素;茜草素型,羟基分布在同一苯环,如茜草素);(b)氧化蒽酚(蒽酚的羟基互变异构体);(c)蒽酚与蒽酮(蒽醌的还原产物,如大黄酚蒽酮);(d)C-糖基蒽衍生物(糖以C-C键直接连接,如芦荟苷)。②双蒽核类——包括(a)二蒽酮类(两分子蒽酮C10-C10'相连,如番泻苷A~F);(b)二蒽醌类(如山扁豆双醌);(c)去氢二蒽酮、中位萘骈二蒽酮(如金丝桃素)等。","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)｜据教材补","addedAt":1781947616074},{"id":"tr-789","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0422","title":"为什么β-OH醌比a-OH醌的酸性大","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"因为β-OH与羰基处于同一个共轭体系中,受羰基吸电子作用的影响,使羟基上氧的电子云密度降低,质子容易解离,酸性较强。而a-OH处在羰基的邻位,因产生分子内氢键,质子不易解离,故酸性较弱","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","addedAt":1781947616074},{"id":"tr-790","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0423","title":"比较下列醌的酸性强弱,并利用酸性的差异分离他们,写出流程。 A.1,4,7-三羟基蒽醌 B.1,5-二OH-3","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"比较下列醌的酸性强弱,并利用酸性的差异分离他们,写出流程。 A.1,4,7-三羟基蒽醌 B.1,5-二OH-3-COOH蒽醌 C.1,8-二OH蒽醌 D.1-CH3蒽醌","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616074},{"id":"tr-791","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0424","title":"用显色反应区别下列各组成分: (1)大黄素与大黄素-8-葡萄糖苷 (2)番泻苷A与大黄素苷 (3)蒽配与苯醌","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"(1)大黄素 vs 大黄素-8-O-葡萄糖苷：醋酸镁反应均阳性(橙红);但游离大黄素能溶于乙醚并被5%碳酸氢钠萃取(显红),其葡萄糖苷因极性大、酸性弱不被碳酸氢钠萃取——可用碱梯度萃取/纸色谱Rf区别。(2)番泻苷A 属二蒽酮苷,加酸水解再氧化可显蒽醌反应;Bornträger(碱液显红)用于区别蒽醌类。关键:游离羟基蒽醌遇碱显红(Bornträger反应),苷与苷元用碳酸氢钠/碳酸钠/氢氧化钠pH梯度区别酸性强弱。","mnemonic":"必背｜doubao习题汇总","addedAt":1781947616074},{"id":"tr-792","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0425","title":"醌类化合物按基本母核可分为哪几种类型?各举一例。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"醌类化合物按基本母核分为四种类型:①苯醌类(分邻苯醌、对苯醌,天然多为对苯醌),如2,6-二甲氧基对苯醌;②萘醌类(分α(1,4)、β(1,2)、amphi(2,6)三型,天然多为α-萘醌),如紫草素;③菲醌类(分邻菲醌、对菲醌),如丹参醌Ⅰ(丹参中);④蒽醌类(按母核分单蒽核、双蒽核;其中羟基蒽醌按羟基分布分大黄素型、茜草素型),如大黄酸、大黄素。","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)｜据教材补","addedAt":1781947616074},{"id":"tr-793","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0426","title":"蒽醌类分为 (1)羟基醌类,又分为大黄素型,如大黄素,茜素型如茜草素。 (2)蒽酚.蒽酮类:为蒽醌的还原产物,","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"蒽醌类分为 (1)羟基醌类,又分为大黄素型,如大黄素,茜素型如茜草素。 (2)蒽酚.蒽酮类:为蒽醌的还原产物,如柯亚素。 (3)二蒽酮和二蒽类:如番泻苷类","mnemonic":"必背｜doubao习题汇总","addedAt":1781947616074},{"id":"tr-794","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0427","title":"现有A、B、C、D四种羟基蒽醌类化合物,试排列其酸性强弱顺序,并设计pH梯度萃取(碱液分步萃取)分离方案。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"酸性强弱顺序:B>A>C>D 乙醚液 5%NaHCO3→乙醚层 5%NaOH","mnemonic":"重要｜doubao习题汇总｜(答案待补,以教材为准)｜题干据答案重构(原OCR丢失)","addedAt":1781947616074},{"id":"tr-795","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0428","title":"现有大黄素-8-葡萄糖苷与大黄素(或苯醌与蒽醌)两种成分,如何用Molish反应、碱液显色及无色亚甲蓝反应将其鉴别?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"(1)将二成分分别用乙醇溶解,分别加Molish试剂,产生紫色环的为大黄素-8-葡萄糖苷,不反应的为大黄素。 (2)将二成分分别加5%的氢氧化钠溶液,溶解后溶液显红色的是大黄素苷,溶解后溶液不变红色的是潘泻苷A。 (3)将二成分分别用乙醇溶解,分别滴于硅胶板上加无色亚甲蓝试剂,在白色背景上与呈现蓝色斑点为苯醒,另一个无反应的是蒽醌","mnemonic":"必背｜doubao习题汇总｜题干据答案重构(原OCR丢失)","addedAt":1781947616074},{"id":"tr-796","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0429","title":"某中药主要含有大黄酸、大黄素、大黄素甲醚,三种成分的氧苷试完成下列问题。 (1)如何鉴定药材中含有该类成分?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"某中药主要含有大黄酸、大黄素、大黄素甲醚,三种成分的氧苷试完成下列问题。 (1)如何鉴定药材中含有该类成分? (2)试设计从该中药中提取、分离三种苷元的流程","mnemonic":"必背｜doubao习题汇总","addedAt":1781947616074},{"id":"tr-797","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0430","title":"某中药中含有下列成分,试设计方案提取并分离出其中的蒽醌类成分:(1)大黄酸(含-COOH) (2)大黄素(含β-OH) (3)大黄酚(仅含α-OH) (4)树胶 (5)蛋白质 (6)淀粉 (7)氨基酸。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"①提取:蒽醌类多与糖结合成苷存在,先用稀硫酸(20%H₂SO₄)加热水解使蒽醌苷生成游离苷元,苷元具亲脂性,用氯仿(或乙醚)回流提取,使游离羟基蒽醌进入氯仿层;树胶、蛋白质、淀粉、氨基酸等亲水性杂质不溶于氯仿而留在水层,经分液弃去酸水层并水洗除酸,即除去杂质。②分离(pH梯度萃取法):羟基蒽醌酸性强弱不同——大黄酸含-COOH酸性最强,大黄素含β-OH酸性次之,大黄酚仅含α-OH酸性最弱。将氯仿提取液依次用5%NaHCO₃、5%Na₂CO₃、5%NaOH碱液梯度萃取:5%NaHCO₃萃取出酸性最强的大黄酸,5%Na₂CO₃萃取出大黄素,5%NaOH萃取出酸性最弱的大黄酚;各碱水层分别用盐酸酸化至pH3,析出沉淀,过滤、干燥,再以冰醋酸或乙醇重结晶,即得大黄酸、大黄素、大黄酚纯品。","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)｜题干据教材还原((1)-(3)原OCR丢失);答案据教材补","addedAt":1781947616074},{"id":"tr-798","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0431","title":"中药虎杖中含有大黄素、大黄酚、大黄素甲醚、大黄素-8-D-葡萄糖苷、大黄素甲醚-8-D-葡萄糖苷、白蒙芦醇、白","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"中药虎杖中含有大黄素、大黄酚、大黄素甲醚、大黄素-8-D-葡萄糖苷、大黄素甲醚-8-D-葡萄糖苷、白蒙芦醇、白藜芦醇葡萄糖苷等成分,试设计从虎杖中提取分离游离醒的流程","mnemonic":"必背｜doubao习题汇总","addedAt":1781947616074},{"id":"tr-799","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0432","title":"中药萱草根中含有大黄酸、大黄酚、决明意、决明意型甲醛、β谷笛醇等成分,试设计提取分离流程","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"系统溶剂法+pH梯度萃取:①药材乙醇(或乙醚)提取得总蒽醌;②乙醚液依次用5%NaHCO₃→5%Na₂CO₃→1%NaOH→5%NaOH梯度萃取,按酸性强弱分离:大黄酸(含-COOH,酸性最强)入NaHCO₃层;含β-酚OH(如大黄素)入Na₂CO₃层;仅含α-酚OH者需NaOH;③β-谷甾醇为亲脂性甾醇,留乙醚层,经硅胶柱色谱分离。利用游离蒽醌酸性差异(COOH>2个β-OH>1个β-OH>α-OH)实现分离。","mnemonic":"必背｜doubao习题汇总","addedAt":1781947616074},{"id":"tr-800","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0433","title":"从中药中分得一黄色结晶,测得其分子式为C14H8O4,与氢氧化钠反应呈红色,与醋酸镁反应呈橙红色;UV(MeOH)λmax(logε):225(4.57),258(4.33),279(4.01),388(4.07),432nm(4.08);IR νmax:1675,1621cm⁻¹。请推断其结构。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"①与5%NaOH呈红色,示为羟基蒽醌类;②α-萘酚-浓硫酸(Molisch)反应阴性,示非苷类(为游离苷元);③醋酸镁反应呈橙红色,示母核每侧苯环至少各有一个α-酚羟基;④分子式C14H8O4=蒽醌母核(C14H8O2)+2个酚OH,故为二羟基蒽醌;⑤UV在432nm有较强吸收带(第Ⅴ峰带,由醌环C=O引起)而无提示β-OH的高强度第Ⅲ峰,说明分子中无β-酚羟基、含两个α-酚羟基,位置为1,5位或1,8位;⑥IR在1675cm⁻¹(游离C=O)与1621cm⁻¹(缔合C=O)出现两个羰基吸收峰,两峰相距较大,符合1,8-二羟基(α-OH与相邻C=O形成分子内氢键)的特征,而非1,5-取代。综合推断该化合物为1,8-二羟基蒽醌(1,8-dihydroxyanthraquinone)。","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)｜题干据广西中医药大学中药化学题库还原;答案据光谱推断;原OCR碎裂已合并","addedAt":1781947616074},{"id":"tr-801","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"tr-0434","title":"37) KBr IR νmaxKBr cm−1: 0507","title":"芸香苷具有的反应有","options":{"A":"盐酸-镁粉反应","B":"α-萘酚-浓硫酸反应","C":"四氢硼钠反应","D":"三氯化铝反应","E":"锆-枸橼酸反应"},"answer":"ABDE","answerText":"","mnemonic":"了解｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616075},{"id":"tr-875","course":"天然药物化学","type":"多选","chapter":"5. 黄酮类化合物","number":"tr-0508","title":"黄酮苷类化合物常用的提取方法有","options":{"A":"碱溶解酸沉淀法","B":"乙醇提取法","C":"水蒸气蒸馏法","D":"沸水提取法","E":"酸提取碱沉淀法"},"answer":"ABD","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616075},{"id":"tr-876","course":"天然药物化学","type":"多选","chapter":"5. 黄酮类化合物","number":"tr-0509","title":"芸香苷经酸水解后,可得到的单糖有","options":{"A":"葡萄糖","B":"甘露糖","C":"果糖","D":"阿拉伯糖","E":"鼠李糖"},"answer":"AE","answerText":"","mnemonic":"了解｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616075},{"id":"tr-877","course":"天然药物化学","type":"多选","chapter":"5. 黄酮类化合物","number":"tr-0510","title":"下列各化合物能利用其甲醇光谱区别的是","options":{"A":"黄酮与黄酮醇","B":"黄酮与查耳酮","C":"黄酮醇-3-O-葡萄糖苷与黄酮醇-3-O-鼠李糖苷","D":"二氢黄酮与二氢黄酮醇","E":"芦丁与槲皮素"},"answer":"ABE","answerText":"","mnemonic":"了解｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616075},{"id":"tr-878","course":"天然药物化学","type":"多选","chapter":"5. 黄酮类化合物","number":"tr-0511","title":"聚酰胺吸附色谱法适用于分离","options":{"A":"蒽醌","B":"黄酮","C":"多糖","D":"鞣质","E":"皂苷"},"answer":"ABD","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616075},{"id":"tr-879","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0512","title":"试述二氢黄酮.异黄酮.花色素水溶液性比黄酮大的原因。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"二氢黄酮(醇)由于 C 环被氢化成近似半椅式结构,破坏了分子的平面性,受\n吡喃环羰基立体结构的阻碍,平面性降低,水溶性增大;花色素虽为平面结构,但以离子形式存在,具有盐的通性,所以水溶性较大。","mnemonic":"[合并自tr-589(sId1)]","addedAt":1781947616075},{"id":"tr-880","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0513","title":"黄酮类化合物与金属盐试剂的显色反应","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"①铝盐:常用1%三氯化铝或硝酸铝溶液,生成黄色络合物并有荧光,可用于定性及定量。②铅盐:常用1%中性醋酸铅及碱式醋酸铅水溶液,生成黄~红色沉淀,一般酚羟基化合物均可沉淀,用于鉴定、提取分离。③锆盐(ZrOCl₂):黄酮分子中有游离3-或5-羟基时生成黄色络合物,但加入枸橼酸后5-羟基黄酮酮颜色褪去、3-羟基黄酮酮颜色不变(锆-枸橼酸反应,可区分3-OH与5-OH)。④镁盐:常用醋酸镁甲醇溶液,二氢黄酮、二氢黄酮醇显天蓝色荧光,黄酮、黄酮醇及异黄酮显黄~橙黄~褐色。⑤锶盐:常用氯化锶的碱性甲醇溶液,用于鉴别具邻二酚羟基的化合物。","mnemonic":"必背｜星空历年真题","addedAt":1781947616075},{"id":"tr-881","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0514","title":"根据下列流程,指出划线部分的作用,并回答相关问题\n槐花粗粉\n芸香苷结晶\n(1)流程中采用的提取方法与依据是什么?\n(2)提取液中加入 0.4%硼砂水的目的?\n(3)以石灰乳调 pH8~9 的目的?如果 pH>12 以上会造成什么结果?\n(4)酸化时加盐酸为什么控制 pH 在 4-5?如果 pH<2 以上会造成什么结果?\n(5)以热水或乙醇重结晶的依据?提取芸香苷还可以采用什么方法?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"(1)流程中采用的提取方法是:碱提取酸沉淀法依据:芸香苷显酸性可溶于碱水。\n(2)提取液中加入 0.4%硼砂水的目的:硼砂可以与邻二羟基络合,保护邻二羟基不被氧化。\n(3)以石灰乳调pH8~9 的目的: 芸香苷含有 7-OH, 4, -OH,碱性较强可以溶于pH8~9 的碱水中。如果 pH>12 以上,碱性太强,钙离子容易与羟基、羰基形成难溶于水的鳌合物,降低收率。\n(4)酸化时加盐酸为什么控制 pH 在4-5 足以是芸香苷析出沉淀,如果 pH<2 以上容易使芸香苷的醚键形成金羊盐,不易析出沉淀。\n(5) 以热水或乙醇重结晶的依据是:芸香苷在热水和热乙醇中溶解度较大,在冷水及冷乙醇中溶解度较小的原因。提取芸香苷还可以采用乙醇回流提取法。","mnemonic":"","addedAt":1781947616075},{"id":"tr-882","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0515","title":"黄酮类化合物的化学检识(Mg-HCl等)与UV解析思路","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"化学检识:Mg-HCl反应(盐酸-镁粉)阳性、FeCl₃反应阳性→含酚羟基的黄酮类;Molish反应阴性→不含糖;ZrOCl₂-枸橼酸呈黄色后褪色→有游离5-OH、无游离3-OH;SrCl₂阴性→不具邻位酚羟基。UV(加诊断试剂):带Ⅰ~328nm证实黄酮;NaOMe带Ⅰ红移~51nm示4'-OH;NaOAc带Ⅱ红移~12nm示游离7-OH;NaOAc/H₃BO₃带Ⅰ、Ⅱ无变化示无邻二酚羟基。综合可推得如5,7-二羟基-4'-OMe-黄酮。","mnemonic":"必背｜星空历年真题","addedAt":1781947616075},{"id":"tr-883","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0516","title":"黄酮¹H-NMR解析(活泼氢与芳环质子)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"¹H-NMR:δ12.91(1H,s,OH)、10.85(1H,s,OH)示两个游离酚羟基;δ8.03(2H,d,J=8.8Hz)、7.10(2H,d,J=8.8Hz)为B环质子,B环为1,4-二取代;δ6.86(1H,s)、6.47(1H,d,J=1.8Hz)、6.19(1H,d,J=1.8Hz)为A环质子,J=1.8Hz示间位偶合。结合UV可定结构。","mnemonic":"必背｜星空历年真题","addedAt":1781947616075},{"id":"tr-884","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0517","title":"【母题·每年必考】综合论述黄酮类化合物结构鉴定的主要方法（理化鉴别+显色反应+波谱）","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点：①理化性质——多为黄色结晶，溶解性与是否成苷/羟基数有关；②显色反应：盐酸-镁粉反应（还原显红~紫红，鉴别黄酮/黄酮醇/二氢黄酮）、四氢硼钠(NaBH4)反应（二氢黄酮专属，显红~紫）、与金属盐络合（AlCl3显黄色并荧光、醋酸镁、ZrOCl2-枸橼酸区别3-OH/5-OH）、氨性氯化锶（邻二酚羟基）、Molish（黄酮苷检糖）；③酸碱：浓硫酸显色、与碱（如NaOH）显黄~橙；④波谱：UV用诊断试剂（甲醇、NaOMe、AlCl3/AlCl3+HCl、NaOAc、NaOAc+H3BO3）位移判断各位置羟基；¹H/¹³C-NMR、MS定结构与糖连接。结论：综合理化+显色+四大谱，对号确定母核类型和取代位置。","mnemonic":"🆕课堂强调·补充｜〔2026-03-31 10:28 [03:18]〕｜非真题原题·据课堂整理｜周志望·每年期末必考·分值最大","addedAt":1781947616075},{"id":"tr-885","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0518","title":"如何用四氢硼钠(NaBH₄)反应区别二氢黄酮(醇)A与其他黄酮B?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"取A、B分别加NaBH₄(四氢硼钠)的甲醇液并加浓盐酸:产生红~紫红色者为A(二氢黄酮、二氢黄酮醇),不显色(-)者为B。NaBH₄是二氢黄酮(醇)类专属性较高的还原显色试剂。","mnemonic":"原误标填空且仅存答案,实为鉴别简答题;题干据答案+教材重建;答案据教材整理","addedAt":1781947616075},{"id":"tr-886","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0519","title":"如何用锆盐-枸橼酸(ZrOCl₂/枸橼酸)反应区别3-OH黄酮A与5-OH黄酮B?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"取A、B分别加ZrOCl₂生成黄色锆配合物,再加枸橼酸:颜色不褪(+)者为A(含3-OH黄酮,锆-3-OH配合物稳定),颜色减褪(-)者为B(仅含5-OH黄酮,配合物遇酸分解)。","mnemonic":"原误标填空且仅存答案,实为鉴别简答题;题干据答案+教材重建;答案据教材整理","addedAt":1781947616075},{"id":"tr-887","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0520","title":"如何用盐酸-镁粉(HCl-Mg)反应区别黄酮(醇)A与查耳酮/异黄酮B?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"取A、B乙醇液分别加镁粉和浓盐酸:显红~紫红色(+)者为A(黄酮、黄酮醇、二氢黄酮(醇)),不显色(-)者为B(查耳酮、异黄酮一般不显色)。","mnemonic":"原误标填空且仅存答案,实为鉴别简答题;题干据答案+教材重建;答案据教材整理","addedAt":1781947616075},{"id":"tr-888","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0521","title":"分别取A、B、C样品乙醇液鉴别:加2%NaBH₄甲醇液和浓HCl,及α-萘酚-浓硫酸反应,如何区分三者?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"①加2%NaBH₄甲醇液+浓HCl,产生红~紫红色者为A(二氢黄酮,NaBH₄反应专属);②再取B、C加10%α-萘酚乙醇液并沿壁滴加浓硫酸,两液界面有紫色环者为C(含糖苷),无此现象者为B。","mnemonic":"原误标填空,实为简答/论述题;题干据答案还原,答案据教材整理(箱守法等)","addedAt":1781947616075},{"id":"tr-889","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0522","title":"以聚酰胺柱色谱分离下列化合物,以浓度递增的乙醇液洗脱,写出洗脱先后顺序并说明理由。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"洗脱先后顺序:C>A>B。理由:A、C都有4个酚羟基,但C是非平面的二氢黄酮,与聚酰胺氢键吸附力较弱,故先于A洗脱;B分子中羟基最多,与聚酰胺吸附最牢固,最后洗脱。","mnemonic":"原误标填空,实为简答/论述题;题干据答案还原,答案据教材整理(箱守法等)","addedAt":1781947616075},{"id":"tr-890","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0523","title":"比较下列化合物的水溶性强弱顺序并说明理由。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"水溶性:C>B>A。理由:C是离子型化合物,水溶性最大;B是二氢黄酮,分子为非平面结构且羟基较多,水溶性大于平面型结构的A。","mnemonic":"原误标填空,实为简答/论述题;题干据答案还原,答案据教材整理(箱守法等)","addedAt":1781947616075},{"id":"tr-891","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0524","title":"用聚酰胺柱色谱分离下列化合物,以50%乙醇液洗脱,写出洗脱先后顺序并说明理由。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"洗脱先后顺序:B>C>A。理由:B、C同为单糖苷,但B羟基少且分子非平面,与聚酰胺吸附力较弱,先于C、A洗脱;A是苷元且羟基最多,与聚酰胺吸附最牢,最后洗脱。","mnemonic":"原误标填空,实为简答/论述题;题干据答案还原,答案据教材整理(箱守法等)","addedAt":1781947616075},{"id":"tr-892","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0525","title":"用聚酰胺柱色谱分离下列化合物,以浓度递增的乙醇液洗脱,写出洗脱先后顺序并说明理由。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"洗脱先后顺序:B>A>C。理由:含水溶剂系统中苷比苷元先洗脱,故B(苷)最先;分子内芳香程度越高、共轭双键越多则吸附力越强,黄酮(C)>二氢黄酮(A),故A比C先洗脱。","mnemonic":"原误标填空,实为简答/论述题;题干据答案还原,答案据教材整理(箱守法等)","addedAt":1781947616075},{"id":"tr-893","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0526","title":"试述黄酮类化合物的基本母核及结构的分类依据,常见黄酮类化合物结构类型可分为哪几类?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"黄酮类化合物的基本母核为2-苯基色原酮(2-苯基苯并-γ-吡喃酮),即由两个苯环(A环、B环)通过中央三碳链(C环)相连构成的C6-C3-C6骨架。分类依据是:中央三碳链的氧化程度、B环(苯基)的连接位置(2位或3位)、以及三碳链是否构成环状。据此常见类型分为:黄酮、黄酮醇、二氢黄酮、二氢黄酮醇、异黄酮(B环连在3位)、二氢异黄酮、查耳酮(C环开环)、二氢查耳酮、橙酮(噢哢)、花色素(花青素)、黄烷醇(儿茶素)以及双黄酮等。","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)｜据教材补","addedAt":1781947616075},{"id":"tr-894","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0527","title":"试述黄酮(醇)多显黄色,而二氢黄酮(醇)不显色的原因","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"黄酮(醇)分子中存在交叉共轭体系:A环、C环上的羰基(C4=O)与2,3位双键以及B环形成贯通的大共轭系统,助色团(-OH、-OCH3)的引入使共轭链增长、电子跃迁所需能量降低,吸收波长红移至可见光区(其中带Ⅱ约240~280nm为苯甲酰基系统、带Ⅰ约300~400nm为桂皮酰基系统),故吸收部分可见光而显黄色。二氢黄酮(醇)因2,3位双键被氢化,A、B两环的共轭被中断、不能形成贯通的交叉共轭体系,吸收波长落在紫外区而不在可见区,故不显色(或仅显微黄色)。","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)｜据教材补","addedAt":1781947616075},{"id":"tr-895","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0528","title":"试述黄酮(醇)难溶于水的原因","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"黄酮(醇)苷元为平面型分子:其母核2-苯基色原酮接近共平面,分子间排列紧密、可借π-π堆积及氢键缔合,分子间引力大,加之苷元极性相对较小,故难溶于水,而易溶于甲醇、乙醇、乙酸乙酯、乙醚等有机溶剂及稀碱液。当母核引入羟基、尤其结合成苷(引入糖基)后,分子平面性被破坏、亲水性增大,水溶性随之增大;二氢黄酮(醇)因C环非平面(近似半椅式),分子排列不紧密,水溶性也较平面型黄酮大。","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)｜据教材补","addedAt":1781947616075},{"id":"tr-896","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0529","title":"如何检识药材中含有黄酮类化合物?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"检识药材中黄酮类化合物常用:①盐酸-镁粉(Mg-HCl)反应——取样品乙醇液,加镁粉少许及浓盐酸数滴,黄酮、黄酮醇、二氢黄酮(醇)显红~紫红色(异黄酮、查耳酮、橙酮多不显色),为最常用的鉴别反应;②盐酸-锌粉反应(原理同上);③三氯化铝(AlCl3)反应——生成黄色络合物,并在紫外灯下显黄绿色荧光;④锆盐-枸橼酸反应——区别3-OH与5-OH黄酮(有3-OH或5-OH显黄色,加枸橼酸后,仅5-OH者褪色、3-OH者不褪);⑤醋酸镁反应(纸上显荧光);⑥氨性氯化锶反应(检查邻二酚羟基);⑦与硼酸反应(5-羟基或2'-羟基黄酮显黄色并带荧光)。另可用纸色谱/薄层色谱在紫外灯下观察荧光斑点辅助检识。","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)｜据教材补","addedAt":1781947616075},{"id":"tr-897","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0530","title":"简述黄芩中提取黄芩苷的原理","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"黄芩苷是黄酮苷,分子中含葡萄糖醛酸的-COOH,呈酸性,可溶于碱(碱溶);加酸后游离黄芩苷溶解度降低而沉淀析出(酸沉)——即碱溶酸沉法。注意:鲜黄芩中黄芩苷易被酶水解为黄芩素(苷元),黄芩素邻三酚羟基易氧化成醌而显绿色,故须先沸水煮(灭酶)再提取,以防苷被水解、苷元被氧化变绿、降低质量。","mnemonic":"必背｜doubao习题汇总","addedAt":1781947616075},{"id":"tr-898","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0531","title":"根据下列流程,指出划线部分的作用,并回答相关问题。 槐花粗粉─加约6倍量已煮沸的0.4%硼砂水溶液,搅拌下加入石灰乳至pH8~9,并保持该pH值30分钟,趁热抽滤,反复2次→水提取液;在60~70℃下用浓盐酸调pH4~5,搅拌,静置放冷,滤过,水洗至洗液呈中性,60℃干燥→芸香苷结晶。 (1)流程中采用的提取方法与依据是什么? (2)提取液中加入0.4%硼砂水的目的? (3)以石灰乳调pH8~9的目的?如果pH>12以上会造成什么结果? (4)酸化时加盐酸为什么控制pH在4~5?如果pH<2会造成什么结果? (5)以热水或乙醇重结晶的依据?提取芸香苷还可以采用什么方法?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"(1)碱提取酸沉淀法。依据芸香苷(芦丁)分子中含多个酚羟基显弱酸性,可溶于碱液生成盐而被提出,酸化后又游离析出沉淀。(2)硼砂能与芸香苷邻二酚羟基络合保护,防止其在碱性条件下被氧化破坏,并增大其水溶性、利于提取。(3)石灰乳(Ca(OH)₂)既调至碱性使芸香苷成盐溶出,又能与槐花中的多糖、蛋白质、黏液质等水溶性杂质生成钙盐沉淀而除杂;若pH>12过强,会使芸香苷的苷键或邻二酚羟基结构被破坏、并使部分杂质重新溶解,影响纯度与收率。(4)控制pH4~5可使芸香苷充分游离析出且结晶完全;若pH<2,强酸会促使芸香苷水解为苷元(槲皮素)并增大其在水中溶解损失,降低收率。(5)依据芸香苷在冷水中溶解度小、热水(或热乙醇)中溶解度大,故可用热溶冷析重结晶纯化。提取芸香苷还可用乙醇回流提取法、热水提取法等。","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)｜OCR拆碎已合并;答案据教材补","addedAt":1781947616075},{"id":"tr-899","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0532","title":"写出“碱提取酸沉淀”提取芸香苷的流程","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"「碱提取酸沉淀」提取芸香苷(芦丁)流程:槐米(或槐花)粗粉──加约6倍量沸水(或加0.4%硼砂的沸水以保护邻二酚羟基),再加石灰乳调至pH8~9,保持30分钟,趁热抽滤,药渣再如法提取2次→合并滤液(碱提取液,芦丁以盐的形式溶出,同时石灰乳使部分酸性杂质成钙盐沉淀除去);→滤液于60~70℃下用浓盐酸调至pH4~5,搅拌后静置放冷→析出黄色沉淀,滤过,水洗至中性,干燥→芦丁粗品;→用热水或乙醇重结晶→芸香苷(芦丁)精制品。(原理:芦丁含多个酚羟基显弱酸性,可溶于碱液成盐而被提出,酸化后又游离析出;并利用其热水中溶解度大、冷水中小重结晶纯化。)","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)｜据教材补","addedAt":1781947616075},{"id":"tr-900","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"tr-0533","title":"从某中药中分离一化合物,分子式C15H10O5,Mg-HCl反应(+),ZrCl2反应黄色,加枸橼酸褪色,氯化","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"分子式C15H10O5,Mg-HCl(盐酸-镁粉)反应(+)示黄酮或黄酮醇类;ZrOCl₂呈黄色、加枸橼酸后褪色,示无3-OH(若有3-OH加枸橼酸不褪色),提示为5-OH黄酮;氯化锶反应(-)示无邻二酚羟基;四氢硼钠反应(-)示非二氢黄酮。UV(MeOH)267、296sh、336nm为典型黄酮(带Ⅱ267、带Ⅰ336)吸收。综合C15H10O5(即三羟基黄酮)及上述反应,结合¹H-NMR芳氢偶合(J≈2Hz为间位偶合,~8Hz为邻位偶合)数据,推断该化合物为5,7,4'-三羟基黄酮(芹菜素,apigenin)。","mnemonic":"了解｜doubao习题汇总｜OCR拆碎(tr-599为其结论)已合并;答案据教材补","addedAt":1781947616075},{"id":"tr-901","course":"天然药物化学","type":"选择","chapter":"5. 黄酮类化合物","number":"tr-0534","title":"黄酮类化合物的紫外光谱中,峰带I很强,而带II很弱的化合物是","options":{"A":"查耳酮","B":"异黄酮","C":"黄酮醇","D":"黄酮","E":""},"answer":"B","answerText":"","mnemonic":"重要｜doubao知到","addedAt":1781947616075},{"id":"tr-902","course":"天然药物化学","type":"选择","chapter":"5. 黄酮类化合物","number":"tr-0535","title":"构成黄酮类化合物的基本骨架是","options":{"A":"6C-6C-6C","B":"3C-6C-3C","C":"6C-3C","D":"6C-3C-6C","E":"6C-3C-3C"},"answer":"D","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616075},{"id":"tr-903","course":"天然药物化学","type":"选择","chapter":"5. 黄酮类化合物","number":"tr-0536","title":"黄酮类化合物的颜色与下列哪项因素有关","options":{"A":"具有色原酮","B":"具有色原酮和助色团","C":"具有 2-苯基色原酮","D":"具有 2-苯基色原酮和助色团","E":"结构中具有邻二酚羟基"},"answer":"D","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616075},{"id":"tr-904","course":"天然药物化学","type":"选择","chapter":"5. 黄酮类化合物","number":"tr-0537","title":"引入哪类基团可使黄酮类化合物脂溶性增加","options":{"A":"-OCH3","B":"-CH2OH","C":"-OH","D":"邻二羟基","E":"单糖"},"answer":"A","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616075},{"id":"tr-905","course":"天然药物化学","type":"选择","chapter":"5. 黄酮类化合物","number":"tr-0538","title":"黄酮类化合物的颜色加深,与助色团取代位置与数目有关,尤其在( )位置上。","options":{"A":"6, 7 位引入助色团","B":"7, 4/-位引入助色团","C":"3/, 4/位引入助色团","D":"5-位引入羟基","E":"引入甲基"},"answer":"B","answerText":"","mnemonic":"重要｜习题汇总含答案","addedAt":1781947616075},{"id":"tr-906","course":"天然药物化学","type":"选择","chapter":"5. 黄酮类化合物","number":"tr-0539","title":"黄酮类化合物的颜色加深,与助色团取代位置与数目有关,尤其在","options":{"A":"6, 7 位引入助色团","B":"7, 4/-位引入助色团","C":"3/, 4/位引入助色团","D":"5-位引入羟基","E":"引入甲基"},"answer":"B","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616075},{"id":"tr-907","course":"天然药物化学","type":"选择","chapter":"5. 黄酮类化合物","number":"tr-0540","title":"黄酮类化合物的酸性是因为其分子结构中含有","options":{"A":"糖","B":"羰基","C":"酚羟基","D":"氧原子","E":"双键"},"answer":"C","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616075},{"id":"tr-908","course":"天然药物化学","type":"选择","chapter":"5. 黄酮类化合物","number":"tr-0541","title":"下列黄酮中酸性最强的是","options":{"A":"3-OH 黄酮","B":"5-OH 黄酮","C":"5, 7-二 OH 黄酮","D":"7, 4/-二 OH 黄酮","E":"3/, 4/-二 OH 黄酮"},"answer":"D","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616075},{"id":"tr-909","course":"天然药物化学","type":"选择","chapter":"5. 黄酮类化合物","number":"tr-0542","title":"下列黄酮中水溶性性最大的是","options":{"A":"异黄酮","B":"黄酮","C":"二氢黄酮","D":"查耳酮","E":"花色素"},"answer":"E","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准) [答案经教材核对无误]","addedAt":1781947616075},{"id":"tr-910","course":"天然药物化学","type":"选择","chapter":"5. 黄酮类化合物","number":"tr-0543","title":"下列黄酮中水溶性最小的是( )","options":{"A":"黄酮","B":"二氢黄酮","C":"黄酮苷","D":"异黄酮","E":"花色素"},"answer":"A","answerText":"","mnemonic":"重要｜习题汇总含答案","addedAt":1781947616075},{"id":"tr-911","course":"天然药物化学","type":"选择","chapter":"5. 黄酮类化合物","number":"tr-0544","title":"下列黄酮类化合物酸性强弱的顺序为( )\n(1) 5, 7-二 OH 黄酮 (2) 7, 4/-二 OH 黄酮 (3) 6, 4/-二 OH 黄酮","options":{"A":"(1)> (2)> (3)","B":"(2)> (3)> (1)","C":"(3)> (2)> (1)","D":"(2)> (1)> (3)","E":"(1)> (3)> (2)"},"answer":"B","answerText":"","mnemonic":"重要｜习题汇总含答案","addedAt":1781947616075},{"id":"tr-912","course":"天然药物化学","type":"选择","chapter":"5. 黄酮类化合物","number":"tr-0545","title":"下列黄酮类化合物酸性强弱的顺序为","options":{"A":"(1)> (2)> (3)","B":"(2)> (3)> (1)","C":"(3)> (2)> (1)","D":"(2)> (1)> (3)","E":"(1)> (3)> (2)"},"answer":"B","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616075},{"id":"tr-913","course":"天然药物化学","type":"选择","chapter":"5. 黄酮类化合物","number":"tr-0546","title":"下列黄酮类化合物酸性最弱的是","options":{"A":"6-OH 黄酮","B":"5-OH 黄酮","C":"7-OH 黄酮","D":"4/-OH 黄酮","E":"7-4/-二 OH 黄酮"},"answer":"B","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616075},{"id":"tr-914","course":"天然药物化学","type":"选择","chapter":"5. 黄酮类化合物","number":"tr-0547","title":"某中药提取液只加盐酸不加镁粉,即产生红色的是","options":{"A":"黄酮","B":"黄酮醇","C":"二氢黄酮","D":"异黄酮","E":"花色素"},"answer":"E","answerText":"","mnemonic":"了解｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616075},{"id":"tr-915","course":"天然药物化学","type":"选择","chapter":"5. 黄酮类化合物","number":"tr-0548","t 生物。但从生源的观点看,甲戊二羟酸 (mevalonic acid , MVA)才是萜类化合物真正的基本单元。","mnemonic":"","addedAt":1781947616075},{"id":"tr-966","course":"天然药物化学","type":"名词解释记忆","chapter":"6. 萜类与挥发油","number":"tr-0599","title":"挥发油","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"挥发油 (Volatile oils)又称精油(essential oils),是一类难溶于水、可随水蒸气蒸馏、具有芳香气味的油状液体混合物。","mnemonic":"","addedAt":1781947616075},{"id":"tr-967","course":"天然药物化学","type":"名词解释记忆","chapter":"6. 萜类与挥发油","number":"tr-0600","title":"精油","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"精油:是一类难溶于水、可随水蒸气蒸馏、具有芳香气味的油状液体混合物。","mnemonic":"","addedAt":1781947616075},{"id":"tr-968","course":"天然药物化学","type":"名词解释记忆","chapter":"6. 萜类与挥发油","number":"tr-0601","title":"萜类(定义)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"由甲戊二羟酸衍生,分子式符合(C₅H₈)n通式的衍生物。","mnemonic":"必背｜星空历年真题","addedAt":1781947616075},{"id":"tr-969","course":"天然药物化学","type":"名词解释记忆","chapter":"6. 萜类与挥发油","number":"tr-0602","title":"环烯醚萜","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"环烯醚萜为臭蚁二醛的缩醛衍生物,分子中带有环烯醚键, 是一类特殊的单萜。","mnemonic":"汇集各章习题(sId6)名词解释","addedAt":1781947616075},{"id":"tr-970","course":"天然药物化学","type":"名词解释记忆","chapter":"6. 萜类与挥发油","number":"tr-0603","title":"生源的异戊二烯法则","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"萜类化合物的形成起源于葡萄糖;葡萄糖在酶的作用下产生乙酸,三分子乙酸经合成产生 MVA, 它经 ATP 作用、再经脱羧、脱水形成焦磷酸异戊烯酯, 可互变异构化为焦磷酸 V , V一二甲基丙烯酯。","mnemonic":"汇集各章习题(sId6)名词解释","addedAt":1781947616075},{"id":"tr-971","course":"天然药物化学","type":"名词解释记忆","chapter":"6. 萜类与挥发油","number":"tr-0604","title":"单萜","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"一般根据其构成分子碳架的异戊二烯数目和碳环数目对萜类进行分类, 含有 2个异戊二烯单位的称为单萜。","mnemonic":"汇集各章习题(sId6)名词解释","addedAt":1781947616075},{"id":"tr-972","course":"天然药物化学","type":"名词解释记忆","chapter":"6. 萜类与挥发油","number":"tr-0605","title":"薁类化合物","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"一种特殊的倍半萜， "course":"天然药物化学","type":"多选","chapter":"6. 萜类与挥发油","number":"tr-0648","title":"挥发油主要存在于植物的","options":{"A":"腺毛","B":"油室","C":"油管","D":"分泌细胞或树脂道","E":"导管"},"answer":"ABCD","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616075},{"id":"tr-1016","course":"天然药物化学","type":"多选","chapter":"6. 萜类与挥发油","number":"tr-0649","title":"挥发油的存在形式有","options":{"A":"油滴状态","B":"盐的形式","C":"苷的形式","D":"与粘液质、树脂共同存在","E":"分子复合物的形式"},"answer":"AC","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616075},{"id":"tr-1017","course":"天然药物化学","type":"多选","chapter":"6. 萜类与挥发油","number":"tr-0650","title":"挥发油易溶的溶剂有","options":{"A":"石油醚","B":"苯","C":"水","D":"乙醚","E":"氯仿"},"answer":"ABDE","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616075},{"id":"tr-1018","course":"天然药物化学","type":"多选","chapter":"6. 萜类与挥发油","number":"tr-0651","title":"能用于挥发油鉴别的物理常数有","options":{"A":"酸值","B":"比重","C":"比旋光度","D":"折光率","E":"熔点"},"answer":"BCD","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616075},{"id":"tr-1019","course":"天然药物化学","type":"多选","chapter":"6. 萜类与挥发油","number":"tr-0652","title":"挥发油氧化变质后,一般的现象有","options":{"A":"颜色变深","B":"比重增大","C":"聚合形成树脂样物质","D":"失去挥发性","E":"气味改变"},"answer":"ABCDE","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616075},{"id":"tr-1020","course":"天然药物化学","type":"多选","chapter":"6. 萜类与挥发油","number":"tr-0653","title":"挥发油中各组分与结构有关的因素包括","options":{"A":"碳原子数不同","B":"含氧官能团极性不同","C":"是否具有双键","D":"双键数目不同","E":"是否形成环状"},"answer":"ABCDE","answerText":"","mnemonic":"重要｜doubao习题汇总 [答案经教材核对无误]","addedAt":1781947616075},{"id":"tr-1021","course":"天然药物化学","type":"多选","chapter":"6. 萜类与挥发油","number":"tr-0654","title":"挥发油的提取方法包括","options":{"A":"水蒸汽蒸馏法","B":"溶剂提取法","C":"冷压法","D":"油脂吸收法","E":"超临界流体萃取法"},"answer":"ABCDE","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616075},{"id":"tr-1022","course":"天然药物化学","type":"多选","chapter":"6. 萜类与挥发油","number":"tr-0655","title":"挥发油组成成分有","options":{"A":"环烯醚萜","B":"脂肪族小分子","C":"芳香族化合物","D":"单萜","E":"倍半萜"},"answer":"BCDE","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616075},{"id":"tr-1023","course":"天然药物化学","type":"多选","chapter":"6. 萜类与挥发油","number":"tr-0656","title":"挥发油具有的通性有","options":{"A":"特殊气味","B":"挥发油","C":"几乎不溶于水","D":"稳定性","E":"具有一定的物理常数"},"answer":"ABCE","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616075},{"id":"tr-1024","course":"天然药物化学","type":"简答记忆","chapter":"6. 萜类与挥发油","number":"tr-0657","title":"用单向二次展开的薄层色谱法检识挥发油中各成分时, 为什么第一次展开所用的展开剂极性最好大于第二次展开所用的展开剂极性?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"单向二次展开先用极性稍强的展开剂进行第一次展层, 当展开剂展至薄层板的一半距离时停止, 立即挥去薄层板上的溶剂。此时挥发油中极性较大的成分被分离展开,再改换极性较小的展开剂作第二次展层,极性较小的成分则被展开到终端,从而可使极性小的成分更好地分离展开,达到在一块薄层板上实现极性大小不同的多种成分都得到较好分离的目的。","mnemonic":"","addedAt":1781947616075},{"id":"tr-1025","course":"天然药物化学","type":"简答记忆","chapter":"6. 萜类与挥发油","number":"tr-0658","title":"紫杉醇的来源、结构类型与药理作用是什么?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"紫杉醇(Taxol)是从红豆杉属植物(红豆杉)中分离得到的二萜类化合物,为重要的抗癌(抗肿瘤)药,通过促进微管聚合、抑制微管解聚而发挥作用。","mnemonic":"原误标填空,实为简答/论述题;题干据答案还原,答案据教材整理(箱守法等)","addedAt":1781947616075},{"id":"tr-1026","course":"天然药物化学","type":"简答记忆","chapter":"6. 萜类与挥发油","number":"tr-0659","title":"写出化合物结构类型及活性(紫杉醇/青蒿素/大黄素/小檗碱/齐墩果酸)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"化合物A=紫杉醇,二萜类(萜类),抗癌药;B=青蒿素,倍半萜类(萜类),抗疟药;C=大黄素,蒽醌类(醌类),抗肿瘤/抗菌/免疫抑制/利尿;D=小檗碱(黄连素),异喹啉类生物碱,抗菌消炎药;E=齐墩果酸,三萜类,抗肝炎药。","mnemonic":"必背｜星空历年真题","addedAt":1781947616075},{"id":"tr-1027","course":"天然药物化学","type":"简答记忆","chapter":"6. 萜类与挥发油","number":"tr-0660","title":"生源的异戊二烯法则与经验的异戊二烯法则","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"生源的异戊二烯法则:自然界存在的萜类化合物是经甲戊二羟酸(MVA)途径衍生的一类化合物。经验的异戊二烯法则:自然界的萜类由异戊二烯演变而来,是异戊二烯的聚合物或衍生物,并以是否符合异戊二烯法则作为判断是否为萜类化合物的一个重要原则。","mnemonic":"必背｜星空历年真题","addedAt":1781947616075},{"id":"tr-1028","course":"天然药物化学","type":"简答记忆","chapter":"6. 萜类与挥发油","number":"tr-0661","title":"如何用显色反应区别萜类化合物A与香豆素/内酯类B(写出鉴别流程)?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"A溶于氯仿、不显色;加5%Br₂/氯仿、浓硫酸或对二甲氨基苯甲醛试剂后,A显蓝、紫或绿色,B显红或紫色;据各试剂的显色差异(A蓝/紫/绿、B红/紫)可区别二者。","mnemonic":"原误标填空且仅存答案,实为鉴别简答题;题干据答案+教材重建;答案据教材整理","addedAt":1781947616075},{"id":"tr-1029","course":"天然药物化学","type":"简答记忆","chapter":"6. 萜类与挥发油","number":"tr-0662","title":"如何用铜盐或铁盐反应区别化合物a(A)与b(B)?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"分别取a、b的乙醇溶液少许,加铜盐溶液产生绿色结晶(或加铁盐溶液产生赤色结晶)的是B,无上述现象的是A。","mnemonic":"原误标填空且仅存答案,实为鉴别简答题;题干据答案+教材重建;答案据教材整理","addedAt":1781947616075},{"id":"tr-1030","course":"天然药物化学","type":"简答记忆","chapter":"6. 萜类与挥发油","number":"tr-0663","title":"某挥发油含以下几种成分,采用硅胶薄层检识、醋酸乙酯-石油醚展层,写出各成分Rf大→小排列顺序并说明理由。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"Rf大→小:D>E>B>A>C。理由:硅胶TLC为极性吸附,极性大者吸附牢、Rf小,反之Rf大;各成分极性大小为C>A>B>E>D,故Rf大→小为D>E>B>A>C。","mnemonic":"原误标填空,实为简答/论述题;题干据答案还原,答案据教材整理(箱守法等)","addedAt":1781947616075},{"id":"tr-1031","course":"天然药物化学","type":"简答记忆","chapter":"6. 萜类与挥发油","number":"tr-0664","title":"用含2.0%AgNO₃的硅胶柱层析,以苯:无水乙醚(5:1)洗脱下列化合物,写出洗脱先后顺序并说明理由。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"洗脱先→后:A>B>C。理由:硝酸银柱色谱中双键数相同时比较空间位阻——A为反式双键,空间位阻大于顺式的B,吸附力弱故先洗脱;C有末端双键,空间位阻最小、吸附最牢,最后洗脱。","mnemonic":"原误标填空,实为简答/论述题;题干据答案还原,答案据教材整理(箱守法等)","addedAt":1781947616075},{"id":"tr-1032","course":"天然药物化学","type":"简答记忆","chapter":"6. 萜类与挥发油","number":"tr-0665","title":"含羰基(醛、酮)的萜类成分可用什么试剂分离?写出反应。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"可用亚硫酸氢钠(NaHSO₃)加成法分离:含醛、酮基的萜类与NaHSO₃+H₂SO₄反应生成水溶性的α-羟基磺酸钠加成物而与其他成分分离,加酸或加碱又可使其分解复原。","mnemonic":"原误标填空且仅存答案,实为鉴别简答题;题干据答案+教材重建;答案据教材整理","addedAt":1781947616075},{"id":"tr-1033","course":"天然药物化学","type":"简答记忆","chapter":"6. 萜类与挥发油","number":"tr-0666","title":"萜类的分类依据是什么?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"萜类化合物以异戊二烯(C5)为基本结构单元,其分类依据是分子中所含异戊二烯单位(或碳原子)的数目。据此分为:半萜(C5,1个异戊二烯单位)、单萜(C10,2个)、倍半萜(C15,3个)、二萜(C20,4个)、二倍半萜(C25,5个)、三萜(C30,6个)、四萜(C40,8个,如胡萝卜素类)及多萜(>C40,如橡胶)。各类还可根据碳环数目进一步分为链状(无环)、单环、双环、三环等类型。","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)｜据教材补","addedAt":1781947616075},{"id":"tr-1034","course":"天然药物化学","type":"简答记忆","chapter":"6. 萜类与挥发油","number":"tr-0667","title":"挥发油的水蒸气蒸馏液,若由于其中的挥发油在水中的溶解度稍大或挥发油含量低,不易分层时,一般采取什么措施进行处理","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"当水蒸气蒸馏所得馏出液因挥发油在水中溶解度稍大、或挥发油含量低而不易分层时,一般可采取:①向馏出液中加入氯化钠(NaCl)使之饱和(盐析法),降低挥发油在水中的溶解度,促使其析出分层;②再用乙醚、石油醚等低沸点亲脂性有机溶剂萃取馏出液,合并有机层后蒸去(回收)溶剂,即得挥发油。必要时可重复盐析-萃取以提高回收率。","mnemonic":"了解｜doubao习题汇总｜据教材补","addedAt":1781947616075},{"id":"tr-1035","course":"天然药物化学","type":"简答记忆","chapter":"6. 萜类与挥发油","number":"tr-0668","title":"用单向二次展开的薄层色谱法检识挥发油中各成分时,为什么第一次展开所用的展开剂极性最好大于第二次展开所用的展开剂","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"用单向二次展开的薄层色谱法检识挥发油中各成分时,为什么第一次展开所用的展开剂极性最好大于第二次展开所用的展开剂极性?","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616075},{"id":"tr-1036","course":"天然药物化学","type":"简答记忆","chapter":"6. 萜类与挥发油","number":"tr-0669","title":"挥发油的哪些性质可用于挥发油的检识?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"可用于挥发油检识的性质有:①物理性质——多为油状液体,具特殊香气(嗅辨)、有挥发性(在滤纸上挥发不留持久油斑,借此与脂肪油区别),多无色或淡黄色,具旋光性、折光性,相对密度多小于1(少数大于1),不溶于水而溶于有机溶剂;②化学(显色)性质——油斑上滴加香草醛-浓硫酸、5%香草醛盐酸或浓硫酸等显色剂可显不同颜色,提示所含官能团;③官能团反应——如与亚硝酸或2,4-二硝基苯肼检查醛酮(羰基),与碱液检查酚、酸性成分,与三氯化铁检查酚类,与溴或亚硝酸检查不饱和键(双键)等;④色谱法——薄层色谱、气相色谱(GC)及GC-MS可对各组分进行分离与检识鉴定。","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)｜据教材补","addedAt":1781947616075},{"id":"tr-1037","course":"天然药物化学","type":"简答记忆","chapter":"6. 萜类与挥发油","number":"tr-0670","title":"简述挥发油各类成分的沸点随结构变化的规律","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"挥发油各类成分的沸点随结构呈以下规律:①含碳原子数(分子量)越多、沸点越高,故倍半萜及其含氧衍生物的沸点一般高于单萜;②同一基本骨架中,官能团极性越大、能形成氢键者沸点越高,故含氧化合物(醇、醛、酮、酸等)的沸点高于相应的萜烃(不含氧的萜烯);③同一类成分中,分子中双键数目越多沸点往往略高(共轭尤甚);④对映体或顺反异构体之间沸点相近但仍有差别。利用上述沸点差异(以及与水共沸的性质),可用分馏法将挥发油中各类成分分离。","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)｜据教材补","addedAt":1781947616075},{"id":"tr-1038","course":"天然药物化学","type":"简答记忆","chapter":"6. 萜类与挥发油","number":"tr-0671","title":"为什么可用相对密度小于1.0的挥发油测定器测定相对密度大于1.0的挥发油含量?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"挥发油测定器有两种:相对密度小于1.0(轻油)用甲法,相对密度大于1.0(重油)用乙法。乙法是在甲法基础上加入二甲苯等比水轻、与水不混溶的溶剂,使重于水的挥发油溶于二甲苯后,形成的「二甲苯-挥发油」混合液相对密度小于1.0而能浮于水面、在测定器刻度部分准确读取体积;测定时先单独测出所加二甲苯的体积,再测「二甲苯+挥发油」总体积,二者之差即为挥发油的实际体积。故借助加入低密度溶剂的乙法,即可用相对密度小于1.0的挥发油测定器测定相对密度大于1.0的挥发油含量。","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)｜OCR拆碎已合并;答案据教材补","addedAt":1781947616075},{"id":"tr-1039","course":"天然药物化学","type":"简答记忆","chapter":"6. 萜类与挥发油","number":"tr-0672","title":"回答下列问题: (1)指出上述化合物的苷元结构类型并给苷元碳原子标号 五环三萜中的齐墩果烷型 (2)若使化合物","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"回答下列问题: (1)指出上述化合物的苷元结构类型并给苷元碳原子标号 五环三萜中的齐墩果烷型 (2)若使化合物C只水解28位糖而不水解3位糖应采用哪种水解方法? 采用碱性条件下水解 (3)比较上述5种化合物在硅胶柱层析时,以氯仿-甲醇-水(65:35:5)洗脱,指出洗脱出柱的先后顺序 先后顺序为E>D>A>B>C (4)归属化合物D的C","mnemonic":"了解｜doubao习题汇总","addedAt":1781947616075},{"id":"tr-1040","course":"天然药物化学","type":"简答记忆","chapter":"6. 萜类与挥发油","number":"tr-0673","title":"挥发油的通性有哪些？应如何保存？为什么？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"①颜色：挥发油在常温下大多为无色或微带淡黄色，也有少数带有其他颜色。②气味：挥发油大多数具有香气或其他特异气味，由辛辣烧灼的感觉，呈中性或酸性。③形态：挥发油在常温下为透明液体， 由飞冷却时其主要成分可能结晶析出。④挥发性 :挥发油在常温下可自行挥发我、而不留任何痕迹，只是挥发油与脂肪油的本质区别。 保存：贮于棕色瓶内，装满、密塞并在阴凉处低温保存。原因：与空气及接触，常会逐渐氧化变质，使之比重增加，颜色变深，失去原有香味，并形成树脂样物质，也不能再随水蒸气蒸馏了。","mnemonic":"重要｜天然药物化学名词解释+简答.docx","addedAt":1781947616075},{"id":"tr-1041","course":"天然药物化学","type":"选择","chapter":"6. 萜类与挥发油","number":"tr-0674","title":"以溶剂提取法提取挥发油时,首选的溶剂是","options":{"A":"95%乙醇","B":"氯仿","C":"石油醚(30~60℃)","D":"四氯化碳","E":""},"answer":"C","answerText":"","mnemonic":"重要｜doubao知到","addedAt":1781947616075},{"id":"tr-1042","course":"天然药物化学","type":"选择","chapter":"6. 萜类与挥发油","number":"tr-0675","title":"单萜类化合物分子中的碳原子数为","options":{"A":"10 个","B":"15 个","C":"5 个","D":"20 个","E":"25 个"},"answer":"A","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616075},{"id":"tr-1043","course":"天然药物化学","type":"选择","chapter":"6. 萜类与挥发油","number":"tr-0676","title":"挥发油中的萜类化合物主要是","options":{"A":"二萜类","B":"二倍半萜类","C":"单萜和倍半萜类","D":"小分子脂肪族化合物","E":"挥发性生物碱"},"answer":"C","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616075},{"id":"tr-1044","course":"天然药物化学","type":"选择","chapter":"6. 萜类与挥发油","number":"tr-0677","title":"难溶于水,易溶于乙醇和亲脂性有机溶剂的是","options":{"A":"游离的萜类化合物","B":"与糖结合成苷的萜类化合物","C":"环烯醚萜苷类化合物","D":"皂苷类化合物","E":"单糖类化合物"},"answer":"A","answerText":"","mnemonic":"了解｜doubao习题汇总｜(答案存疑,以教材为准)｜巧记:亲水性溶剂——甲乙丙丁(甲醇/乙醇/丙酮/正丁醇)","addedAt":1781947616075},{"id":"tr-1045","course":"天然药物化学","type":"选择","chapter":"6. 萜类与挥发油","number":"tr-0678","title":"可(或易)溶于水及乙醇,难(或不)溶于亲脂性有机溶剂的是","options":{"A":"游离的单萜类化合物","B":"游离的倍半萜类化合物","C":"环烯醚萜苷类化合物","D":"游离的二萜类化合物","E":"大分子脂肪族化合物"},"answer":"C","answerText":"","mnemonic":"了解｜doubao习题汇总｜(答案存疑,以教材为准)｜巧记:亲水性溶剂——甲乙丙丁(甲醇/乙醇/丙酮/正丁醇)","addedAt":1781947616075},{"id":"tr-1046","course":"天然药物化学","type":"选择","chapter":"6. 萜类与挥发油","number":"tr-0679","title":"通常以树脂、苦味质、植物醇等为存在形式的萜类化合物为","options":{"A":"单萜","B":"二萜","C":"倍半萜","D":"二倍半萜","E":"三萜"},"answer":"B","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616075},{"id":"tr-1047","course":"天然药物化学","type":"选择","chapter":"6. 萜类与挥发油","number":"tr-0680","title":"即能溶解游离的萜类化合物,又能溶解萜苷类化合物的溶剂是","options":{"A":"乙醇","B":"水","C":"氯仿","D":"苯","E":"石油醚"},"answer":"A","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616075},{"id":"tr-1048","course":"天然药物化学","type":"选择","chapter":"6. 萜类与挥发油","number":"tr-0681","title":"非含氧的开链萜烯分子符合下列哪项通式","options":{"A":"(C8H5) n","B":"(C5H8)n","C":"(5C8H)n","D":"(C5H5)n","E":"(C8H8)n"},"answer":"B","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准) [合并自tr-0781(sId5)]","addedAt":1781947616075},{"id":"tr-1049","course":"天然药物化学","type":"选择","chapter":"6. 萜类与挥发油","number":"tr-0682","title":"二萜类化合物具有","options":{"A":"两个异戊二烯单元","B":"三个异戊二烯单元","C":"有四个异戊二烯单元","D":"五个异戊二烯单元","E":"六个异戊二烯单元"},
