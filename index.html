ya-0254","title":"专属性","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"专属性是指在其他成分（如杂质、降解产物、辅料等）可能存在的情况下，分析方法能够准确测定被测物的能力。它是鉴别试验和含量测定方法验证的重要指标之一。","mnemonic":"🆕课堂强调·补充｜〔2026-03-06 14:38 [00:30]〕｜非真题原题·据课堂整理","addedAt":1781947616078},{"id":"tr-1996","course":"药物分析学","type":"名词解释记忆","chapter":"第八章 定量分析方法的验证","number":"ya-0255","title":"内标法","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"内标法是色谱定量方法之一，向供试品溶液中加入一定量的内标物质，以待测组分与内标物的峰面积（或峰高）之比进行定量，可消除进样量及仪器波动带来的误差，提高测定的准确度。","mnemonic":"🆕课堂强调·补充｜〔2026-03-24 15:38 [01:00]〕｜非真题原题·据课堂整理","addedAt":1781947616078},{"id":"tr-1997","course":"药物分析学","type":"名词解释记忆","chapter":"第八章 定量分析方法的验证","number":"ya-0256","title":"剩余滴定法（回滴定法）","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"剩余滴定法是指向被测药物中加入定量且过量的滴定液使之反应完全，再用另一种滴定液回滴剩余的第一种滴定液，根据两者之差计算被测药物含量的方法。常用于反应较慢或无合适指示剂直接滴定的情形。","mnemonic":"🆕课堂强调·补充｜〔2026-03-20 15:38 [25:00]〕｜非真题原题·据课堂整理","addedAt":1781947616078},{"id":"tr-1998","course":"药物分析学","type":"名词解释记忆","chapter":"第八章 定量分析方法的验证","number":"ya-0257","title":"【名词解释】标准物质五类","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"标准物质五类(易混必考):①标准品——生物检定/抗生素/生化药品效价测定,纯度以效价单位表示(如土霉素)②对照品——化学药品含量测定,纯度以百分含量表示(如阿司匹林、黄芩苷)③对照药材/对照提取物——中药分析专用④参考品——微生物定性定量/诊断,以活性单位表示。记忆:抗生素→标准品→效价单位;化学药品→对照品→百分含量。\n\n〔老师强调/扣分点〕笔记★★。易错点:中药单体成分(黄芩苷)仍属对照品≠对照药材(后者需为药材整体)。土霉素效价→标准品是经典例题。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 名词解释(标准品/对照品五类—真题名解'标准品'+知到讨论题；精密称定/标准品真题名解)〕｜参考答案据课堂/教材整理","addedAt":1781947616078},{"id":"tr-1999","course":"药物分析学","type":"名词解释记忆","chapter":"第八章 定量分析方法的验证","number":"ya-0258","title":"准确度","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"测定值与真实值接近的程度，一般以回收率表示。","mnemonic":"重要｜药物分析-DY(OCR)(1).docx","addedAt":1781947616078},{"id":"tr-2000","course":"药物分析学","type":"名词解释记忆","chapter":"第八章 定量分析方法的验证","number":"ya-0259","title":"精密度","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"多次测定所得值的接近程度。","mnemonic":"重要｜药物分析-DY(OCR)(1).docx","addedAt":1781947616078},{"id":"tr-2001","course":"药物分析学","type":"名词解释记忆","chapter":"第八章 定量分析方法的验证","number":"ya-0260","title":"LOD","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"检测限，被测物能被检测的最低浓度或量。","mnemonic":"重要｜药物分析-DY(OCR)(1).docx","addedAt":1781947616078},{"id":"tr-2002","course":"药物分析学","type":"名词解释记忆","chapter":"第八章 定量分析方法的验证","number":"ya-0261","title":"LOQ","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"定量限，样品中被测物能被定量测定的最低量。","mnemonic":"重要｜药物分析-DY(OCR)(1).docx","addedAt":1781947616078},{"id":"tr-2003","course":"药物分析学","type":"填空记忆","chapter":"第八章 定量分析方法的验证","number":"ya-0262","title":"《中国药典》中凡用滴定分析法测定含量的药物，都会给出______，便于据此计算含量。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"滴定度（T）","mnemonic":"🆕课堂强调·补充｜〔2026-03-20 15:38 [06:00]〕｜非真题原题·据课堂整理","addedAt":1781947616078},{"id":"tr-2004","course":"药物分析学","type":"填空记忆","chapter":"第八章 定量分析方法的验证","number":"ya-0263","title":"药物鉴别试验要求所选方法应具有______和耐用性两个特性。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"专属性","mnemonic":"🆕课堂强调·补充｜〔2026-03-10 15:38 [02:00]〕｜非真题原题·据课堂整理","addedAt":1781947616078},{"id":"tr-2005","course":"药物分析学","type":"多选","chapter":"第八章 定量分析方法的验证","number":"ya-0264","title":"分析方法验证中评价\"精密度\"的实验包括（）","options":{"A":"重复性","B":"中间精密度","C":"重现性","D":"回收率","E":"专属性"},"answer":"ABC","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-03-24 15:38 [03:30]〕｜供练习用·期末是否考待定｜非真题原题·据课堂整理","addedAt":1781947616078},{"id":"tr-2006","course":"药物分析学","type":"多选","chapter":"第八章 定量分析方法的验证","number":"ya-0265","title":"HPLC系统适用性试验考察的参数包括（）","options":{"A":"理论塔板数","B":"分离度","C":"拖尾因子","D":"重复性","E":"灵敏度"},"answer":"ABCDE","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-03-24 14:38 [00:30]〕｜供练习用·期末是否考待定｜非真题原题·据课堂整理","addedAt":1781947616078},{"id":"tr-2007","course":"药物分析学","type":"多选","chapter":"第八章 定量分析方法的验证","number":"ya-0266","title":"色谱法常用的定量方法有（）","options":{"A":"内标法","B":"外标法","C":"面积归一化法","D":"标准溶液加入法（GC）","E":"重量法"},"answer":"ABCD","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-03-24 15:38 [01:00]〕｜供练习用·期末是否考待定｜非真题原题·据课堂整理","addedAt":1781947616078},{"id":"tr-2008","course":"药物分析学","type":"简答记忆","chapter":"第八章 定量分析方法的验证","number":"ya-0267","title":"简要介绍内消色法","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点:供试品溶液如带颜色,即取两份供试品溶液,于其中一份中加入可除去干扰离子的试剂,得无干扰且具有相同颜色的澄清溶液。再按法制成对照溶液,另一份中作为供试溶液,将两液在平行处理后比较,即可消除颜色的干扰。此法又称为内消色法。(可举例说明)","mnemonic":"必背｜南昌大学A卷(24-25)｜历年原题","addedAt":1781947616078},{"id":"tr-2009","course":"药物分析学","type":"简答记忆","chapter":"第八章 定量分析方法的验证","number":"ya-0268","title":"简述亚硝酸钠滴定法主要试剂的作用","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"加入溴化钾,加速反应;加入强酸加速反应,反应加快、重氮盐酸性中稳定、防偶氮基化合物生成","mnemonic":"必背｜南昌大学B卷(24-25)｜历年原题","addedAt":1781947616078},{"id":"tr-2010","course":"药物分析学","type":"简答记忆","chapter":"第八章 定量分析方法的验证","number":"ya-0269","title":"简述分析方法验证的主要内容（验证指标）","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点：准确度（回收率实验）、精密度（重复性、中间精密度、重现性）、专属性（选择性）、检测限与定量限（衡量灵敏度）、线性、范围、耐用性。注意：并非所有项目都要做全部内容，应根据分析项目的要求选择需验证的指标。","mnemonic":"🆕课堂强调·补充｜〔2026-03-24 15:38 [02:30]〕｜非真题原题·据课堂整理","addedAt":1781947616078},{"id":"tr-2011","course":"药物分析学","type":"简答记忆","chapter":"第八章 定量分析方法的验证","number":"ya-0270","title":"简述HPLC系统适用性试验的五个考察参数及意义","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点：①理论塔板数（n）——衡量柱效；②分离度（R）——相邻两峰的分离程度，一般要求≥1.5；③灵敏度——检测响应能力；④拖尾因子（T，对称因子）——衡量色谱峰对称性；⑤重复性——多次进样峰面积/保留时间的一致性（RSD）。意义：综合判断色谱系统性能是否满足样品分析要求。","mnemonic":"🆕课堂强调·补充｜〔2026-03-24 14:38 [01:00]〕｜非真题原题·据课堂整理","addedAt":1781947616078},{"id":"tr-2012","course":"药物分析学","type":"简答记忆","chapter":"第八章 定量分析方法的验证","number":"ya-0271","title":"【简答】准确度与精密度","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"准确度与精密度(必考):①准确度——测定值与真值接近程度,用QC样品。相对回收率RR=M̄/S×100%,相对误差RE=RR-100%。接受标准:常规浓度RR 85%-115%,LLOQ附近放宽80%-120%②精密度——批内精密度(同批次重复性)、批间精密度(不同分析批稳定性),用RSD表示。分析批=单次开机周期完成的所有测定。\n\n〔老师强调/扣分点〕笔记★★★。RR=85-115%、LLOQ 80-120%、批内vs批间精密度是高频。RR与RE关系RE=RR-100%。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 简答(准确度相对回收率RR/精密度—0615原题相关)〕｜参考答案据课堂/教材整理","addedAt":1781947616078},{"id":"tr-2013","course":"药物分析学","type":"简答记忆","chapter":"第八章 定量分析方法的验证","number":"ya-0272","title":"【简答】阿司匹林含量测定-直接酸碱滴定法","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"阿司匹林含量测定-直接酸碱滴定法(必考):取约0.4g精密称定,加20mL中性乙醇溶解,加3滴酚酞指示液,用0.1mol/L NaOH滴定(1:1)。关键:①用中性乙醇防止酯键水解(扣分点)②酚酞pH8.3-10.0变色③仅适用原料药、不适用制剂(酸性辅料消耗NaOH、酯键水解影响)。易水解药物(阿司匹林)可用水解后剩余滴定法(NaOH水解生成水杨酸钠+醋酸钠,避免直接滴定结果偏高)。\n\n〔老师强调/扣分点〕笔记★★★★高频。中性乙醇防水解、酚酞指示剂、仅限原料药是核心扣分点。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 计算/简答(★阿司匹林直接酸碱滴定中性乙醇—真题计算B卷选择21两步滴定+知到+0615原题〕｜参考答案据课堂/教材整理","addedAt":1781947616078},{"id":"tr-2014","course":"药物分析学","type":"简答记忆","chapter":"第八章 定量分析方法的验证","number":"ya-0273","title":"【简答】非水溶液滴定法","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"非水溶液滴定法(必考):溶剂选择——①酸性溶剂(冰醋酸)滴有机弱碱(增强相对碱度)②碱性溶剂(二甲基甲酰胺DMF)滴有机弱酸③两性溶剂(甲醇)④惰性溶剂(甲苯/氯仿/丙酮)。滴定弱碱用高氯酸标准液:BH⁺·A⁻+HClO4=BH⁺·ClO4⁻+HA。当置换出的HA酸性较强时加醋酸汞降低其酸性保证定量。硫酸奎宁:1分子与2分子高氯酸反应。\n\n〔老师强调/扣分点〕笔记★★★★高频。冰醋酸滴弱碱、DMF滴弱酸、高氯酸滴定剂、醋酸汞作用、硫酸奎宁1:2是必背计算要点。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(★非水溶液滴定法—真题多处选择17/B卷+知到'非水滴定生物碱注意事项'+061〕｜参考答案据课堂/教材整理","addedAt":1781947616078},{"id":"tr-2015","course":"药物分析学","type":"计算记忆","chapter":"第八章 定量分析方法的验证","number":"ya-0274","title":"异烟肼片标示量百分含量计算(溴酸钾法)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"标示量(%)=[V×T×f×W平均×100]/[25×20×W取样×标示量] ×100% =[16.10×2.057×(0.01667/0.01000)×2.422]/[25×20×100×0.2560] ×100% =104.5% 答:供试品标示量百分含量为104.5%","mnemonic":"必背｜南昌大学A卷(24-25)｜历年原题","addedAt":1781947616078},{"id":"tr-2016","course":"药物分析学","type":"计算记忆","chapter":"第八章 定量分析方法的验证","number":"ya-0275","title":"浓缩鱼肝油丸维生素A三点校正法含量计算","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"根据题意,计算各波长处吸收度与328nm波长处吸收度的比值,并与规定比值比较 其中,比值A316/A328、A340/A328与规定比值之差超过限度(±0.02),故需计算校正吸收度,并与实测值比较 A328(校正后)=3.52(2A328−A316−A300)=3.52(2×0.438−0.376−0.38)=0.4224 (A328校正 −A328实)/A328实=(0.4224−0.438)/0.438=−0.036 校正吸收度与实测值之差已超过实测值的-3%,故应以A328(校正)计算含量。 E1%1cm(328nm)=A校正/(100×ms/D)=0.4224/(100×0.1600/2500)=66 供试品中维生素A效价=E×1900(IU/g) 标示%=(效价×平均丸重)/标示量×100%=100.32% 答:供试品标示量百分含量为100.32%","mnemonic":"必背｜南昌大学A卷(24-25)｜历年原题","addedAt":1781947616078},{"id":"tr-2017","course":"药物分析学","type":"计算记忆","chapter":"第八章 定量分析方法的验证","number":"ya-0276","title":"滴定度法含量计算母题：已知滴定度T(mg/mL)、滴定液实际消耗体积V(mL)、浓度校正因子F，求被测药物的含量。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"答题要点（须有过程，结果保留2位有效数字）：被测药物质量 m = T × V × F（mg）；若计算标示量/含量百分数，再除以取样量或标示量并乘100%。说明：滴定度T即每1mL规定浓度滴定液相当的被测药物毫克数；F为滴定液实际浓度与规定浓度之比（校正因子）。","mnemonic":"🆕课堂强调·补充｜〔2026-03-20 15:38 [09:00]〕｜非真题原题·据课堂整理","addedAt":1781947616078},{"id":"tr-2018","course":"药物分析学","type":"计算记忆","chapter":"第八章 定量分析方法的验证","number":"ya-0277","title":"【计算】剩余滴定法(回滴法)计算","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"剩余滴定法(回滴法)计算(必考):先加过量滴定液A与药物反应,反应完全后用滴定液B回滴剩余A,需空白校正。含量(%)=[(V0-VS)×FB×TA]/W×100%(V0=空白消耗体积,VS=样品消耗体积,F=校正因子=实际浓度/规定浓度)。美洛昔康例:(23.25-12.18)×1.023×33.14÷402.1×100%。空白试验消除杂质干扰提高准确度。\n\n〔老师强调/扣分点〕笔记★★★高频计算。剩余滴定用(V0-VS)、F校正因子=实际/规定浓度必记。注意是空白减样品。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 计算(★剩余滴定法/两步滴定—真题计算'阿司匹林两步滴定'B卷选择21+异烟肼计算)〕｜参考答案据课堂/教材整理","addedAt":1781947616078},{"id":"tr-2019","course":"药物分析学","type":"选择","chapter":"第八章 定量分析方法的验证","number":"ya-0278","title":"一般分析方法的回收率应在","options":{"A":"80%--120%","B":"85%--115%","C":"90%--110%","D":"95%--105%","E":"98%--100%"},"answer":"B","answerText":"","mnemonic":"必背｜南昌大学A卷(24-25)｜历年原题","addedAt":1781947616078},{"id":"tr-2020","course":"药物分析学","type":"选择","chapter":"第八章 定量分析方法的验证","number":"ya-0279","title":"药典(2005版)用高氯酸液滴定枸橼酸乙胺嗪片(规格100mg/片)取供试品10片,精密称定得2.000g,精密称取0.5000g,依法滴定,消耗0.1000mol/L的高氯酸液6.40ml,每1ml的高氯酸(0.1mol/L)相当于39.14mg枸橼酸乙胺嗪,该供试品含量相当标示量为","options":{"A":"99.5%"," 分析","number":"ya-0326","title":"什么叫戊烯二醛反应和2,4-二硝基氯苯反应?这两个反应适用于什么样的化合物?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"成烯二醛反应是指澳化氰作用于吡啶环，使环上氮原子由 3 价转变于 5 价，吡啶环发生水 解反应生成成烯二醛，再与芳伯胺缩合，生成有色的成烯二醛衍生物的反应。 2, 4-二硝基氯葵反应是在无水条件下，将吡啶及某些衍生物与 2, 4二硝基氯葵混合共热或 使其热至熔融，冷却后加醇制氨氧化钾溶液将残酒溶解，溶液呈紫红色的反应。 这两个反应适用于吡啶环的8 位或Y 位被羧基衍生物所取代的尼可刹米和异烟脖。","mnemonic":"重要｜药分答案PDF-OCR","addedAt":1781947616078},{"id":"tr-2068","course":"药物分析学","type":"计算记忆","chapter":"第八章 杂环类药物的分析","number":"ya-0327","title":"异烟肼含量测定:取本品0.2g,精密称定,用溴酸钾滴定液(0.01667mol/L)滴定至终点,消耗24.08mL,每1mL溴酸钾滴定液(0.01667mol/L)相当于3.429mg异烟肼,计算含量。 ---","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"含量% = (V×T×F)/W ×100% = (24.08×3.429×10−3)/0.2 ×100% = **99.8%**","mnemonic":"了解｜学习与解题指南","addedAt":1781947616078},{"id":"tr-2069","course":"药物分析学","type":"计算记忆","chapter":"第八章 杂环类药物的分析","number":"ya-0328","title":"取苯巴比妥对照品用适量溶剂配成10μ g/ml的对照液。另取50mg苯巴比妥钠供试品 溶于水，加酸，用氯仿提取蒸干后，残渣用适当溶剂配成100ml供试品溶液。在240nm 波长处测定吸收度，对照液为0.431,供试液为0.392,计算苯巴比妥钠的百分含量? (99.6%)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"“〈注: 茶巴比妥钠的相对分子质量为 254. 22，葵巴 比妥的相对分子质量为 232. 24。两者之比为 1. 095) 解: 计算公式如下: (可参考教材 P. 124一125 的例子) 2. 取葵巴比妥 0.4045g，加入新制的碳酸钠试液 16m] 使溶解，加丙酮 12ml 与水 90m] ，用硝酸银滴定液 (0. 1025mol7/L) 滴定至","mnemonic":"重要｜药分答案PDF-OCR","addedAt":1781947616078},{"id":"tr-2070","course":"药物分析学","type":"计算记忆","chapter":"第八章 杂环类药物的分析","number":"ya-0329","title":"取苯巴比妥0.4045g, 加入新制的碳酸钠试液16ml 使溶解，加丙酮12ml 与水90ml, 用硝酸银滴定液(0.1025mol/L) 滴定至终点，消耗硝酸银滴定液16.88ml, 求苯巴比妥 的百分含量(每1ml0.1mol/L 硝酸银相当于23.22mg的 C₁₂H„N₂O₃?(99.3%)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"解: 计算公式如下 2% 一 99.32%% ”0. 4045 11 一、选择题 1. 15 . 16 . 17. 18 . 19. 20. 21. 双相滴定法可适) (添加Br 生成HBr 省酸钠滴定法中，加入 KBr 的作/ 第六章“” 芳酸及其酯类药物的分析 古: (B) 生成NOr。Br- (D) 生产 Br 的药物为: (D) 茶 (A) 18. 02mg “(B 本司匹林片的含 )180. 2mg (BE ) (B) 对乙酰氨基酚 二酸 (3B ) 《E) 抑人 〈C)90. 08mg (D)45. 04mg (D) 丙磺舒 那种芳酸或芳胺类药物，不和 (B) 葵甲酸钠 用三 (BE) 贝详酯 乙酰水杨酸用中和法测定时， 4 防 ","D":"","E":""},"answer":"填空题","answerText":"溶出度","mnemonic":"🆕课堂强调·补充｜〔2026-03-17 13:48 [05:00]〕｜非真题原题·据课堂整理","addedAt":1781947616080},{"id":"tr-2151","course":"药物分析学","type":"多选","chapter":"第十二章 药物制剂分析","number":"ya-0410","title":"片剂中应检查的项目有","options":{"A":"澄明度","B":"应重复原料药的检查项目","C":"应重复辅料的检查项目","D":"检查生产、贮存过程中引入的杂质","E":"重量差异"},"answer":"DE","answerText":"片剂应检查:检查生产、贮存过程中引入的杂质(D)、重量差异(E)。澄明度是注射剂项目;制剂不必重复原料药(B)或辅料(C)的检查项目。","mnemonic":"重要｜药分-DY｜[92,94,122]","addedAt":1781947616080},{"id":"tr-2152","course":"药物分析学","type":"多选","chapter":"第十二章 药物制剂分析","number":"ya-0411","title":"关于药物制剂的杂质检查，叙述正确的是","options":{"A":"杂质检查项目应与原料药的检查项目相同","B":"杂质检查项目应与辅料的检查项目相同","C":"杂质检查主要是检查制剂生产、贮存过程中引入或产生的杂质方面的有关检查","D":"不再进行杂质检查","E":"除杂质检查外还应进行制剂学方面的常规检查"},"answer":"CE","answerText":"药物制剂检查:除杂质检查外还应进行制剂方面的常规检查(C);杂质检查主要是检查制剂生产、贮存过程中引入或产生的杂质(E)。不与原料药(A)/辅料(B)检查项目相同,也并非不再检查杂质(D)。","mnemonic":"重要｜药分-DY｜[98,122]","addedAt":1781947616080},{"id":"tr-2153","course":"药物分析学","type":"多选","chapter":"第十二章 药物制剂分析","number":"ya-0412","title":"进行复方片剂分析时，应考虑排除的干扰有()","options":{"A":"淀粉","B":"滑石粉","C":"丙酮","D":"药物之间","E":"亚硫酸氢钠"},"answer":"ABDE","answerText":"复方片剂分析应排除的干扰:淀粉(A)、滑石粉(B)、药物之间的相互干扰(D)、亚硫酸氢钠(E)等赋形剂/附加剂。丙酮(C)为挥发性溶剂(常作掩蔽剂,可挥发除去),通常不作为需排除的持久干扰。","mnemonic":"重要｜药分-DY｜[100,122]","addedAt":1781947616080},{"id":"tr-2154","course":"药物分析学","type":"简答记忆","chapter":"第十二章 药物制剂分析","number":"ya-0413","title":"药物制剂分析有何特点?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"成分复杂、含辅料、结果以标示量%表示、检查项目更多。","mnemonic":"了解｜学习与解题指南","addedAt":1781947616080},{"id":"tr-2155","course":"药物分析学","type":"简答记忆","chapter":"第十二章 药物制剂分析","number":"ya-0414","title":"什么是含量均匀度?适用哪些片剂?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"小剂量片剂单剂含量均匀程度,≤10mg或≤标示量5%的片剂。","mnemonic":"重要｜学习与解题指南","addedAt":1781947616080},{"id":"tr-2156","course":"药物分析学","type":"简答记忆","chapter":"第十二章 药物制剂分析","number":"ya-0415","title":"片剂溶出度合格标准是什么?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"6片溶出量均不低于70%(Q)。","mnemonic":"重要｜学习与解题指南","addedAt":1781947616080},{"id":"tr-2157","course":"药物分析学","type":"简答记忆","chapter":"第十二章 药物制剂分析","number":"ya-0416","title":"【简答】含量均匀度检查","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"含量均匀度检查(必考计算):适用——单剂标示量<25mg或主药<单剂重量25%的小剂量制剂、注射用无菌粉末、软胶囊等。方法:取10片测相对含量X→算均值X̄、标准差S、A=|100-X̄|,算A+2.2S和A+S。限度L=15.0(多数)/20.0(混悬液软胶囊)/25.0(透皮贴剂栓剂)。判断:A+2.2S≤L合格;A+S>L不合格;A+2.2S>L但A+S≤L需复试(另取20片共30片,A≤0.25L且A²+S²≤0.25L²)。\n\n〔老师强调/扣分点〕笔记★★★★高频计算。<25mg/<25%适用条件、A+2.2S≤L判据、L=15必背。奋乃静片例:A+2.2S=7.80<15合格。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 计算/简答(★含量均匀度A+2.2S≤L—0615原题详解+知到'硬脂酸镁干扰'相关制剂分析〕｜参考答案据课堂/教材整理","addedAt":1781947616080},{"id":"tr-2158","course":"药物分析学","type":"简答记忆","chapter":"第十二章 药物制剂分析","number":"ya-0417","title":"片剂的溶出度可以用于评价片剂的什么质量?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"难溶性药物溶出的速度和程度。","mnemonic":"重要｜药分答案PDF-OCR","addedAt":1781947616080},{"id":"tr-2159","course":"药物分析学","type":"简答记忆","chapter":"第十二章 药物制剂分析","number":"ya-0418","title":"硬酯酸镁对哪些方面有干扰?如何进行消除?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"氧化还原滴定法，改用氧化电位稍低的氧化剂。","mnemonic":"重要｜药分答案PDF-OCR","addedAt":1781947616080},{"id":"tr-2160","course":"药物分析学","type":"简答记忆","chapter":"第十二章 药物制剂分析","number":"ya-0419","title":"如何排除注射液中抗氧剂的干扰?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":")加掩蔽剂丙酮或甲醛，2) 加酸分解法，3) 加弱氧化剂，4) 提取分离。","mnemonic":"重要｜药分答案PDF-OCR","addedAt":1781947616080},{"id":"tr-2161","course":"药物分析学","type":"简答记忆","chapter":"第十二章 药物制剂分析","number":"ya-0420","title":"什么叫制剂分析?制剂分析与原料药分析相比较有哪些不同?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"利用物理、化学或生物测定方法对不同剂型的药物进行检验分析，以确定其是否符合质量标准。不同点，1J)检验项目和要求不同;2) 杂质检查的项目不同;3) 杂质限量的要求不同;4) 含量表示方法及合格率范围不同。","mnemonic":"重要｜药物分析-DY(OCR)(1).docx","addedAt":1781947616080},{"id":"tr-2162","course":"药物分析学","type":"简答记忆","chapter":"第十二章 药物制剂分析","number":"ya-0421","title":"片剂中的糖类对哪些分析测定方法有干扰?如何进行消除?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"氧化还原滴定法，改用氧化电位稍低的氧化剂。","mnemonic":"重要｜药物分析-DY(OCR)(1).docx","addedAt":1781947616080},{"id":"tr-2163","course":"药物分析学","type":"简答记忆","chapter":"第十二章 药物制剂分析","number":"ya-0422","title":"主要有哪些方法可以用于复方制剂分离的分析测定?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"柱色谱法; TLC HPLC 6GCOn)并人","mnemonic":"重要｜药物分析-DY(OCR)(1).docx","addedAt":1781947616080},{"id":"tr-2164","course":"药物分析学","type":"简答记忆","chapter":"第十二章 药物制剂分析","number":"ya-0423","title":"什么叫做单方制剂和复方制剂?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点:单方制剂指含有一种有效成分(一种药物)的制剂;复方制剂指含有两种或两种以上有效成分(药物)的制剂,如复方阿司匹林片、复方新诺明片等。","mnemonic":"重要｜药分-DY｜[72,75,78]","addedAt":1781947616080},{"id":"tr-2165","course":"药物分析学","type":"简答记忆","chapter":"第十二章 药物制剂分析","number":"ya-0424","title":"复方制剂分析中不经分离而直接测定的有哪些方法?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点:复方制剂不经分离直接测定各组分含量的方法主要有——双波长分光光度法、吸收度比值法、计算分光光度法(解联立方程组法)、导数光谱法(消除无关/线性干扰),以及化学计量学方法(如偏最小二乘法PLS)等。","mnemonic":"重要｜药分-DY｜[62,63,64,66,69,70]","addedAt":1781947616080},{"id":"tr-2166","course":"药物分析学","type":"计算记忆","chapter":"第十二章 药物制剂分析","number":"ya-0425","title":"阿司匹林片标示量0.5g,平均片重0.5768g,取样0.3566g,消耗滴定液对应阿司匹林0.4523g,求标示量%。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"标示量% = (0.4523 ÷ 0.3566 × 0.5768) ÷ 0.5 ×100% = **98.9%**","mnemonic":"重要｜学习与解题指南","addedAt":1781947616080},{"id":"tr-2167","course":"药物分析学","type":"计算记忆","chapter":"第十二章 药物制剂分析","number":"ya-0426","title":"【计算】取样范围计算","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"取样范围计算(必考计算):取样范围=药粉取样量相当于主成分0.5g时的90%-110%区间。方法:先称20/15片求平均片重,建立比例(药粉取样量/0.5g=平均片重/单片规格量)解出理论取样量,×90%-110%。例:标示量150mg/片,设取样量x,x/0.5=平均片重/0.15解方程。注意mg与g换算,碾碎前必须记录总重。\n\n〔老师强调/扣分点〕笔记★★★高频计算。0.5g主成分、90-110%范围、比例关系建立是核心。复方片剂实验必算。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 计算(取样                 <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black bg-opacity-50 animate-fade-in">

            const showAlert = (title, message) => {
                setModalConfig({ isOpen: true, type: 'alert', title, message, onConfirm: () => setModalConfig(prev => ({ ...prev, isOpen: false })), onCancel: () => setModalConfig(prev => ({ ...prev, isOpen: false })) });

                setModalConfig({ isOpen: true, type, title, message, onConfirm: () => { onConfirm(); setModalConfig(prev => ({ ...prev, isOpen: false })); }, onCancel: () => setModalConfig(prev => ({ ...prev, isOpen: false })) });

            // 初始化加载
            useEffect(() => {
                try {
                    const savedVersion = localStorage.getItem('med_quiz_seed_version');

                    let parsedQuestions = savedQuestions ? JSON.parse(savedQuestions) : [];

                    if (versionChanged) {
                        // 题库版本更新：只保留用户自行导入的题目（不在新旧默认库中的）
                        const oldDefaultIds = new Set(parsedQuestions.map(q => q.id).filter(id => id.startsWith('tr-')));
                        const newDefaultIds = new Set(DEFAULT_QUESTIONS.map(q => q.id));
                        // 用户导入的题目 ID 不以 tr- 开头，或虽以 tr- 开头但不在旧默认库中
                        const userOnlyQuestions = parsedQuestions.filter(q => {
                            if (!q.id) return true;
                            if (!q.id.startsWith('tr-')) return true; // 用户导入
                            // tr- 开头但在旧库中有但新库中没有的 → 是旧库删除的，也丢弃
                            return false;
                        });
                        parsedQuestions = userOnlyQuestions;
                        // 保存新版本号
                        localStorage.setItem('med_quiz_seed_version', DEFAULT_QUESTION_SEED_VERSION);
                    }

                    const defaultIds = new Set(DEFAULT_QUESTIONS.map(q => q.id));
                    // 自动补全ID，并移除已考完的药剂学题库。
                    parsedQuestions = parsedQuestions
                        .filter(q => q.course !== '药剂学')
                        .map(q => {
                            const normalized = q.id ? q : { ...q, id: generateId() };
                            // 章节名归一化
                            if (normalized.course === '生物药剂学与药物动力学' && CHAPTER_NORMALIZE_MAP[normalized.chapter]) {
                                normalized.chapter = CHAPTER_NORMALIZE_MAP[normalized.chapter];
                            }
                            return normalized;
                        });
                    // 合并策略：localStorage 中的版本优先（用户可能编辑过默认题），
                    // 再补充 localStorage 中没有的新默认题
                    const localStorageIds = new Set(parsedQuestions.map(q => q.id));
                    const newDefaults = DEFAULT_QUESTIONS.filter(q => !localStorageIds.has(q.id));
                    const seededQuestions = [...parsedQuestions, ...newDefaults];
                    const validIds = new Set(seededQuestions.map(q => q.id));
                    setQuestions(seededQuestions);

                    if (savedWrong) {
                        const cleanedWrong = JSON.parse(savedWrong).filter(id => validIds.has(id));
                        setWrongQuestionIds(new Set(cleanedWrong));
                    }
                    
                    if (savedSettings) {
                        const settings = JSON.parse(savedSettings);
                        setIsShuffleQuestions(settings.shuffleQuestions || false);
                        setIsShuffleOptions(settings.shuffleOptions || false);
                    }

                    const savedSets = localStorage.getItem('med_quiz_custom_sets');
                    if (savedSets) setCustomSets(JSON.parse(savedSets));
                    
                    setIsLoaded(true);
                } catch (e) {
                    console.error("加载缓存失败", e);
                    setQuestions(DEFAULT_QUESTIONS);
                    setWrongQuestionIds(new Set());
                    setIsLoaded(true);
                }
            }, []);

            // 持久化存储
            useEffect(() => {
                if (isLoaded) {
                    localStorage.setItem('med_quiz_questions', JSON.stringify(questions));
                }
            }, [questions, isLoaded]);

            useEffect(() => {
                if (isLoaded) {
                    localStorage.setItem('med_quiz_wrong', JSON.stringify([...wrongQuestionIds]));
                }
            }, [wrongQuestionIds, isLoaded]);

            useEffect(() => {
                if (isLoaded) {
                    localStorage.setItem('med_quiz_settings', JSON.stringify({ shuffleQuestions: isShuffleQuestions, shuffleOptions: isShuffleOptions }));
                }
            }, [isShuffleQuestions, isShuffleOptions, isLoaded]);

            useEffect(() => {
                if (isLoaded) {
                    localStorage.setItem('med_quiz_custom_sets', JSON.stringify(customSets));
                }
            }, [customSets, isLoaded]);

            // --- 核心逻辑 ---

            // 引号安全的CSV解析：在「完整文本」上做引号感知的切分，
            // 双引号包裹的字段内可含逗号、中文逗号、以及换行(多行答案)，均不被切断；
            // "" 转义为字面量引号。仅在「引号外」遇到换行才视为一条记录结束。
            const parseCSVRecords = (text) => {
                const records = [];
                let field = '';
                let row = [];
                let inQ = false;
                for (let k = 0; k < text.length; k++) {
                    const ch = text[k];
                    if (inQ) {
                        if (ch === '"') {
                            if (text[k + 1] === '"') { field += '"'; k++; }
                            else { inQ = false; }
                        } else { field += ch; }
                    } else {
                        if (ch === '"') { inQ = true; }
                        else if (ch === ',') { row.push(field); field = ''; }
                        else if (ch === '\n' || ch === '\r') {
                            if (ch === '\r' && text[k + 1] === '\n') k++; // CRLF
                            row.push(field); field = '';
                            // 跳过完全空行
                            if (!(row.length === 1 && row[0].trim() === '')) records.push(row);
                            row = [];
                        } else { field += ch; }
                    }
                }
                // 收尾最后一行(无结尾换行)
                row.push(field);
                if (!(row.length === 1 && row[0].trim() === '')) records.push(row);
                return records;
            };

            const parseCSV = (text, courseName) => {
                const records = parseCSVRecords(text.replace(/^\ufeff/, '')); // 去除可能的BOM
                const newQuestions = [];
                if (records.length === 0) return newQuestions;
                const headerCells = records[0].map(c => c.trim());
                const hasHeader = headerCells.some(c => c.includes('题型') || c.includes('课程'));
                // 是否含「课程」列(置于第1列)：表头含「课程」即整表按13列(course-first)解析
                const hasCourseCol = hasHeader && headerCells[0] && headerCells[0].includes('课程');
                const headerHasAnswerText = hasHeader && headerCells.some(c => c.includes('answerText'));
                const startIdx = hasHeader ? 1 : 0;
                // 选择/多选答案才做字母规范化；判断(对/错)与主观题占位(填空题/简答题等)原样保留
                const letterTypes = ['选择', '多选'];

                for (let i = startIdx; i < records.length; i++) {
                    const raw = records[i].map(c => c.trim());
                    // off=1 表示首列是「课程」,其余列整体右移一位
                    const off = hasCourseCol ? 1 : 0;
                    const rowCourse = hasCourseCol ? (raw[0] || courseName) : courseName;
                    const cols = raw.slice(off);
                    if (cols.length < 10) continue;

                    const type = (cols[0] || '').trim();
                    // 列结构自适应：12列含 answerText；旧11列(助记在 cols[10])
                    const hasAT = headerHasAnswerText || cols.length >= 12;
                    const answerText = hasAT ? (cols[10] || '') : '';
                    const mnemonic = hasAT ? (cols[11] || '') : (cols[10] || '');
                    const rawAnswer = (cols[9] || '');
                    const answer = letterTypes.includes(type)
                        ? rawAnswer.toUpperCase().replace(/[^A-E]/g, '')
                        : rawAnswer.trim();

                    newQuestions.push({
                        id: generateId(),
                        course: (rowCourse || courseName || '').trim() || courseName,
                        type: type, // 确保去掉首尾空格
                        chapter: cols[1],
                        number: cols[2],
                        title: cols[3],
                        options: {
                            A: (cols[4] || '').replace(/^A\./, ''),
                            B: (cols[5] || '').replace(/^B\./, ''),
                            C: (cols[6] || '').replace(/^C\./, ''),
                            D: (cols[7] || '').replace(/^D\./, ''),
                            E: (cols[8] || '').replace(/^E\./, '')
                        },
                        answer: answer,
                        answerText: answerText,
                        mnemonic: mnemonic,
                        addedAt: Date.now()
                    });
                }
                return newQuestions;
            };

            const processImport = (parsedQs) => {
                if (parsedQs.length === 0) { showAlert("导入失败", "未识别到有效题目，请检查格式"); return; }
                const existingMap = new Map();
                questions.forEach((q, idx) => {
                    const sig = `${q.course}-${q.chapter}-${q.title.trim()}`;
                    existingMap.set(sig, idx);
                });
                let updatedCount = 0;
                let addedCount = 0;
                const newQuestions = [...questions];
                parsedQs.forEach(q => {
                    const sig = `${q.course}-${q.chapter}-${q.title.trim()}`;
                    if (existingMap.has(sig)) {
                        newQuestions[existingMap.get(sig)] = q;
                        updatedCount++;
                    } else {
                        newQuestions.push(q);
                        addedCount++;
                    }
                });
                setQuestions(newQuestions);
                setImportText('');
                showAlert("导入成功", `📝 覆盖更新：${updatedCount} 道\n✅ 新增题目：${addedCount} 道`);
                setView('home');
            };

            const handleImport = () => {
                if (!importText || !importCourseName) { showAlert("提示", "请输入课程名称和题目数据"); return; }
                const parsedQs = parseCSV(importText, importCourseName);
                processImport(parsedQs);
            };

            // 编码自动检测：先 UTF-8，若检测到乱码则回退到 GB18030
            const readFileWithEncoding = (file, callback) => {
                const reader1 = new FileReader();
                reader1.onload = (ev) => {
                    const text = ev.target.result;
                    // 乱码检测：替换字符过多 或 前500字符无中文字符
                    const hasGarbled = (text.match(/\ufffd/g) || []).length > 5 ||
                        (text.length > 20 && !/[\u4e00-\u9fff]/.test(text.substring(0, 500)));
                    if (hasGarbled) {
                        const reader2 = new FileReader();
                        reader2.onload = (ev2) => { callback(ev2.target.result); };
                        reader2.readAsText(file, 'gb18030');
                    } else {
                        callback(text);
                    }
                };
                reader1.readAsText(file, 'utf-8');
            };

            const handleFileDrop = (e) => {
                e.preventDefault();
                e.stopPropagation();
                setIsDragging(false);
                const file = e.dataTransfer.files[0];
                if (file && (file.name.endsWith('.csv') || file.type === 'text/csv')) {
                    readFileWithEncoding(file, (text) => {
                        setImportText(text);
                        if (!importCourseName) {
                            const name = file.name.replace(/\.csv$/, '').replace(/_\d+$/, '');
                            setImportCourseName(name);
                        }
                    });
                } else {
                    showAlert("格式错误", "请拖入 CSV 格式文件");
                }
            };

            const handleFileSelect = (e) => {
                const file = e.target.files[0];
                if (file && (file.name.endsWith('.csv') || file.type === 'text/csv')) {
                    readFileWithEncoding(file, (text) => {
                        setImportText(text);
                        if (!importCourseName) {
                            const name = file.name.replace(/\.csv$/, '').replace(/_\d+$/, '');
                            setImportCourseName(name);
                        }
                    });
                } else {
                    showAlert("格式错误", "请选择 CSV 格式文件");
                }
                e.target.value = '';
            };

            const handleRenameCourse = (newName) => {
                if (!newName || !newName.trim()) return;
                if (newName === renamingCourseName) { setRenamingCourseName(null); return; }
                setQuestions(prev => prev.map(q => q.course === renamingCourseName ? { ...q, course: newName } : q));
                setRenamingCourseName(null);
            };

            // 核心启动函数：增加 typeFilter、probFilter 参数
            const startStudy = (course, chapter, mode = 'quiz', forceShuffleQuestions = isShuffleQuestions, typeFilter = '全部', probFilter = '全部') => {
                let queue;
                if (chapter === '所有题目') queue = questions.filter(q => q.course === course);
                else queue = questions.filter(q => q.course === course && q.chapter === chapter);
                
                // 增加题型筛选逻辑
                if (typeFilter && typeFilter !== '全部') {
                    queue = queue.filter(q => q.type === typeFilter);
                }
                // 增加考概率筛选逻辑
                if (probFilter && probFilter !== '全部') {
                    if (probFilter === '仅必考') queue = queue.filter(q => q.examProb === '必考');
                    else if (probFilter === '必考+常考') queue = queue.filter(q => q.examProb === '必考' || q.examProb === '常考');
                }
                
                if (queue.length === 0) { 
                    const parts = [];
                    if (typeFilter !== '全部') parts.push(typeFilter);
                    if (probFilter !== '全部') parts.push(probFilter);
                    const msg = parts.length > 0 ? `该章节下没有【${parts.join('/')}】的题目` : "该章节没有题目";
                    showAlert("提示", msg); 
                    return; 
                }
                
                if (forceShuffleQuestions) queue = shuffleArray(queue);

                setStudyQueue(queue);
                setCurrentCourse(course);
                setCurrentTypeFilter(typeFilter);
                setCurrentProbFilter(probFilter);
                // 标题带上筛选信息
                let chapterLabel = chapter;
                if (typeFilter !== '全部' || probFilter !== '全部') {
                    const parts = [];
                    if (typeFilter !== '全部') parts.push(typeFilter);
                    if (probFilter !== '全部') parts.push(probFilter);
                    chapterLabel = `${chapter} (${parts.join('/')})`;
                }
                setCurrentChapter(chapterLabel);
                setStudyMode(mode);
                setCurrentIndex(0);
                
                // 初始化第一个卡片状态
                setSelectedOption(null);
                setSelectedMultiOptions(new Set());
                // 如果是背题模式，默认显示答案
                setShowAnswer(mode === 'recite');
                
                setView('study');
            };

            const startWrongReview = (course) => {
                let queue = questions.filter(q => wrongQuestionIds.has(q.id));
                if (course) queue = queue.filter(q => q.course === course);
                
                if (queue.length === 0) { showAlert("提示", "该分类下暂无错题！"); return; }
                queue = shuffleArray(queue);

                setStudyQueue(queue);
                setCurrentCourse(course || '错题本');
                setCurrentChapter('复习模式');
                setStudyMode('quiz'); // 错题复习默认为刷题模式
                setCurrentIndex(0);
                
                setSelectedOption(null);
                setSelectedMultiOptions(new Set());
                setShowAnswer(false);

                setView('study');
            };

            // 滚动模式入口
            const startScrollStudy = (course, chapter, typeFilter = '全部', mode = 'quiz', probFilter = '全部') => {
                let queue;
                if (chapter === '所有题目') queue = questions.filter(q => q.course === course);
                else queue = questions.filter(q => q.course === course && q.chapter === chapter);
                if (typeFilter && typeFilter !== '全部') queue = queue.filter(q => q.type === typeFilter);
                if (probFilter && probFilter !== '全部') {
                    if (probFilter === '仅必考') queue = queue.filter(q => q.examProb === '必考');
                    else if (probFilter === '必考+常考') queue = queue.filter(q => q.examProb === '必考' || q.examProb === '常考');
                }
                if (queue.length === 0) { showAlert("提示", "该筛选条件下没有题目"); return; }
                setStudyQueue(queue);
                setCurrentCourse(course);
                setCurrentChapter(chapter);
                setCurrentTypeFilter(typeFilter);
                setCurrentProbFilter(probFilter);
                setStudyMode('scroll');
                setScrollReciteMode(mode === 'recite');
                setView('study');
            };

            // === 自定义板块 ===
            const parseIndexRange = (str) => {
                const nums = new Set();
                str.split(/[,，]/).forEach(part => {
                    part = part.trim();
                    if (!part) return;
                    const m = part.match(/^(\d+)\s*[-~]\s*(\d+)$/);
                    if (m) { for (let i = +m[1]; i <= +m[2]; i++) nums.add(i); }
                    else if (/^\d+$/.test(part)) nums.add(+part);
                });
                return [...nums].sort((a, b) => a - b);
            };

            const createCustomSet = (name, course, rangeStr) => {
                const indices = parseIndexRange(rangeStr);
                const courseQs = questions.filter(q => q.course === course);
                const selected = indices.filter(i => i >= 1 && i <= courseQs.length).map(i => courseQs[i - 1].id);
                if (selected.length === 0) { showAlert('提示', '未匹配到任何题目，请检查序号'); return false; }
                const newSet = { id: generateId(), name: name || `板块 ${customSets.length + 1}`, course, indices, rangeStr };
                setCustomSets(prev => [...prev, newSet]);
                return true;
            };

            const deleteCustomSet = (id) => {
                setCustomSets(prev => prev.filter(s => s.id !== id));
            };

            const startCustomSetStudy = (cs, mode, scrollMode) => {
                const courseQs = questions.filter(q => q.course === cs.course);
                const queue = cs.indices.filter(i => i >= 1 && i <= courseQs.length).map(i => courseQs[i - 1]);
                if (queue.length === 0) { showAlert('提示', '该板块下没有匹配的题目'); return; }
                setStudyQueue(queue);
                setCurrentCourse(cs.course);
                setCurrentChapter(cs.name);
                setCurrentTypeFilter('全部');
                setCurrentProbFilter('全部');
                if (scrollMode) {
                    setStudyMode('scroll');
                    setScrollReciteMode(mode === 'recite');
                } else {
                    setStudyMode(mode);
                    setCurrentIndex(0);
                    setShowAnswer(mode === 'recite');
                    setSelectedOption(null);
                    setSelectedMultiOptions(new Set());
                }
                setView('study');
            };

            // 更新单道题目（自动保存）
            const updateQuestion = (updatedQ) => {
                setQuestions(prev => prev.map(q => q.id === updatedQ.id ? updatedQ : q));
            };

            // 卡片模式中更新题目（同步更新 questions 和 studyQueue）
            const handleStudyUpdate = (updatedQ) => {
                setQuestions(prev => prev.map(q => q.id === updatedQ.id ? updatedQ : q));
                setStudyQueue(prev => prev.map(q => q.id === updatedQ.id ? updatedQ : q));
            };

            // 卡片模式中删除题目（同步删除并调整 currentIndex）
            const handleStudyDelete = (id) => {
                const idxInQueue = studyQueue.findIndex(q => q.id === id);
                setQuestions(prev => prev.filter(q => q.id !== id));
                setStudyQueue(prev => {
                    const newQueue = prev.filter(q => q.id !== id);
                    if (newQueue.length === 0) return newQueue;
                    return newQueue;
                });
                if (idxInQueue >= 0) {
                    if (studyQueue.length <= 1) {
                        showAlert("提示", "该章节题目已全部删除");
                        setView('home');
                    } else if (currentIndex >= studyQueue.length - 1) {
                        setCurrentIndex(prev => Math.max(0, prev - 1));
                    }
                }
            };

            const resetCardState = useCallback((targetMode) => {
                setShowAnswer(targetMode === 'recite');
                setSelectedOption(null);
                setSelectedMultiOptions(new Set());
            }, []);

            const handleAnswer = useCallback((optionKey) => {
                // 如果已经显示答案（包括背题模式），则不再处理答题逻辑（不记录对错）
                if (showAnswer) return;
                
                const currentQ = studyQueue[currentIndex];
                if (optionKey === 'SHOW' || currentQ.isRecall) {
                    setShowAnswer(true);
                    return;
                }
                const isMulti = currentQ.type && (currentQ.type.includes('多') || currentQ.type.includes('Multi'));
                if (isMulti) {
                    setSelectedMultiOptions(prev => {
                        const newSet = new Set(prev);
                        if (newSet.has(optionKey)) newSet.delete(optionKey); else newSet.add(optionKey);
                        return newSet;
                    });
                } else {
                    setSelectedOption(optionKey); 
                    setShowAnswer(true);
                    if (optionKey !== currentQ.answer) setWrongQuestionIds(prev => new Set(prev).add(currentQ.id));
                }
            }, [showAnswer, studyQueue, currentIndex]);

            const handleSubmitMulti = useCallback(() => {
                const currentQ = studyQueue[currentIndex];
                setShowAnswer(true);
                const userAns = Array.from(selectedMultiOptions).sort().join('');
                const correctAns = currentQ.answer.split('').sort().join('');
                if (userAns !== correctAns) setWrongQuestionIds(prev => new Set(prev).add(currentQ.id));
            }, [selectedMultiOptions, studyQueue, currentIndex]);

            const nextQuestion = useCallback(() => {
                if (currentIndex < studyQueue.length - 1) { 
                    setCurrentIndex(prev => prev + 1); 
                    resetCardState(studyMode); 
                } else { 
                    showConfirm("恭喜", "本章节题目已刷完！返回首页？", () => setView('home')); 
                }
            }, [currentIndex, studyQueue.length, studyMode, resetCardState]);

            const prevQuestion = useCallback(() => {
                if (currentIndex > 0) { 
                    setCurrentIndex(prev => prev - 1); 
                    resetCardState(studyMode); 
                }
            }, [currentIndex, studyMode, resetCardState]);

            const deleteCourse = (courseName) => {
                showConfirm("确认删除", `确定要删除《${courseName}》下的所有题目吗？`, () => setQuestions(prev => prev.filter(q => q.course !== courseName)), 'danger');
            };

            const requestFixData = () => {
                showConfirm("高级修复", "这将强制重置所有题目的 ID。\n\n解决无法删除的问题。", () => {
                    const fixedQuestions = questions.map(q => ({ ...q, id: generateId() }));
                    setQuestions(fixedQuestions);
                    localStorage.setItem('med_quiz_questions', JSON.stringify(fixedQuestions));
                    showAlert("修复完成", "所有题目已分配全新 ID。");
                }, 'danger');
            };

            const requestDeleteSingle = (id) => {
                if (!id) { showAlert("错误", "ID缺失"); return; }
                showConfirm("删除题目", "确定要删除吗？", () => setQuestions(prev => prev.filter(q => q.id !== id)), 'danger');
            };

            const handleQuestionShuffleChange = (newValue) => {
                showConfirm("设置变更", "更改【题目乱序】将重新开始本章节，是否继续？", () => {
                    setIsShuffleQuestions(newValue);
