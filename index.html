的透皮给药系统宜调节pH为偏碱性，使其呈非解离型，以利于药物吸收","C":"脂溶性药物的软膏剂，应以脂溶性材料为基质，才能更好地促进药物的经皮吸收","D":"药物主要通过细胞间隙或细胞膜扩散穿透皮肤，但皮肤附属器亦可能成为重要的透皮吸收途径","E":""},"answer":"C","answerText":"","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1574","course":"生物药剂学与药物动力学","type":"多选","chapter":"3. 非口服给药途径","number":"sw-0179","title":"药物在肺部沉积的机制主要有","options":{"A":"雾化吸入","B":"惯性碰撞","C":"沉降","D":"扩散","E":""},"answer":"BCD","answerText":"","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1575","course":"生物药剂学与药物动力学","type":"多选","chapter":"3. 非口服给药途径","number":"sw-0180","title":"关于注射给药正确的表述是","options":{"A":"皮下注射给药容量较小，一般用于过敏试验","B":"不同部位肌内注射吸收顺序：臀大肌>大腿外侧肌>上臂三角肌","C":"混悬型注射剂可于注射部位形成药物贮库，药物吸收过程较长","D":"显著低渗的注射液可局部注射后，药物被动扩散速率小于等渗注射液","E":""},"answer":"C","answerText":"","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1576","course":"生物药剂学与药物动力学","type":"多选","chapter":"3. 非口服给药途径","number":"sw-0181","title":"下列论述正确的是","options":{"A":"光学异构体对药物代谢无影响","B":"体外法可完全替代体内法进行药物代谢的研究","C":"黄酮体具有很强的肝首过效应，因此口服无效","D":"硝酸甘油具有很强的肝首过效应，因此通过皮肤、鼻腔、直肠、口腔黏膜 吸收可提高生物利用度 五、名词解释","E":""},"answer":"CD","answerText":"","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1577","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"3. 非口服给药途径","number":"sw-0182","title":"口腔粘膜给药的优点","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"1避免肝首过效应和胃肠道破坏;2吸收迅速,生物利用度高;3给药方便,可随时中止;4适合蛋白多肽类;5口腔粘膜血流丰富、渗透性较好。","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","addedAt":1781947616077},{"id":"tr-1578","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"3. 非口服给药途径","number":"sw-0183","title":"哪些给药途径可避免肝首过效应?原理","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"静脉注射、肌内注射;口腔黏膜给药;经皮给药;鼻腔给药;肺部给药;直肠给药(距肛门2cm)。原理:不经过门静脉入肝","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1579","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"3. 非口服给药途径","number":"sw-0184","title":"肺部给药吸收迅速的原因","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"肺泡表面积巨大、血流丰富、转运距离极小,药物直接入血无首过","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1580","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"3. 非口服给药途径","number":"sw-0185","title":"增加眼用制剂疗效的方法","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"增加黏度;减少给药体积、提高浓度;调节pH与渗透压;用软膏、膜剂、原位凝胶延长接触时间。\n# 生物药剂学与药物动力学 习题全集(第3版) #","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1581","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"3. 非口服给药途径","number":"sw-0186","title":"采用什么给药途径可避免肝首过效应？试结合各给药途径的生理学特点说明其避免首过效应的原理。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"可以通过改变给药途径尽量避免首过效应，尤其是肝首过效应。主要途径有： (1)薛脉、肌内注射：静脉注射直接进入体循环，因此不存在首过效应；肌内注射经毛细血管吸收进入体循环，不经门肝系统，因此不存在首过效应。 (2)口腔黏膜吸收：口腔黏膜下有大量毛细血管汇总至颈内静脉，不经肝脏而直接进入心脏，可绕过肝脏的首过作用。一般可制成口腔贴片给药。 (3)经皮吸收：药物应用到皮肤后，首先从制剂中释放到皮肤表面，溶解的药物分配进入角质层，扩散通过角质层到达活性表皮的界面，再分配进入水性的活性表皮，继续扩散到达真皮，被毛细血管吸收进入血液循环，可避开门肝系统。 (4)经鼻给药：鼻黏膜血管丰富，鼻黏膜渗透性高，有利于全身吸收。药物吸收后直接进入体循环，无首过效应。 (5)经肺吸收：肺泡表面积大，具有丰富的毛细血管和极小的转运距离，因此肺部给药吸收迅速，而且吸收后药物直接进入血液循环，不受肝首过效应的影响。 (6)直肠给药：栓剂距肛门2cm处，可使大部分药物避开肝首过效应，给药生物利用度远高于距肛门4cm处给药。当栓剂距肛门6cm处给药时，大部分药物经直肠上静脉进入门静脉--肝脏系统。淋巴循环也有助于直肠药物吸收，经淋巴吸收的药物可避开肝脏代谢作用。","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1582","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"3. 非口服给药途径","number":"sw-0187","title":"试述影响经皮给药的影响因素。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"(1)生理因素：皮肤的生理情况因种族、年龄、性别、人体因素及部位的差异而有显著不同，其差异主要由角质层的厚度、致密性和附属器的密度引起，由此对皮肤的通透性产生明显的影响。身体各部位皮肤渗透性大小为阴襄>耳后>腋窝区>头皮>手臂>腿部>胸部。皮肤生理条件会随着年龄和性别而发生变化，胎儿的角质层从妊娠期开始产生，出生时形成，由于婴儿还没有发达的角质层，因此皮肤的通透性比较大；成年人的萎皮肤结构功能不断完善，通透性也在不断地减弱。通常，老人和男性的皮肤通透性低于儿童和妇女。 (2)剂型因素：对于经皮给药系统的候选药物，一般以剂量小、药理作用强者较为理想。角质层的结构限制了大分子药物渗透的可能性。分子量大于600的物质不能自由通过角质层。药物的熔点也能影响经皮渗透性能，低熔点的药物容易渗透通过皮肤。脂溶性药物较水溶性药物或亲水性药物容易通过角质层屏障，但是脂溶性太强的药物也难以透过亲水性的活性表皮层和真皮层，主要在角质层中蓄积。给药系统的剂型对药物的释放性能影响很大，药物从给药系统中释放越容易，则越有利于药物的经皮渗透。常用的经皮给药剂型有乳膏、凝胶、涂剂和透皮贴片等，药物从这些剂型中释放往往有显著差异。基质对药物的亲和力不应太大，否则难以将药物转移到皮肤中，影响药物的吸收。 (3)透皮吸收促进剂：应用经皮吸收促进剂可提高药物的经皮吸收。常用的促进剂有表面活性剂类，氮酮类化合物、醇类和脂肪酸类化合物芳香精油等。","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1583","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"3. 非口服给药途径","number":"sw-0188","title":"粒子在肺部沉积的机制是什么？简述影响药物经肺部吸收的因素。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"药物粒子在气道内的沉积机制有：①惯性碰撞：动量较大的粒子随气体吸入，在气道分叉处突然改变方向，受涡流的影响，产生离心力，当离心力足够大时，即与气道壁发生惯性碰撞：②沉降：质量较大的粒子在气道内的停留时间足够长时，受重力的作用沉积于气道；③扩散：当药物粒子的粒径较小时，沉积也可能仅仅是布朗运动的结果，即通过单纯的扩散运动与气道相接触。 影响药物经肺部吸收的因素主要有以下几方面：①药物粒子在气道中的沉积：吸入粒子在气道中的沉积主要受三方面因素的影响：气溶胶剂的特性、肺通气参数和呼吸道生理构造。粒子在肺部的沉积还与粒子的大小有关。②生理因素：气管壁上的纤毛运动可使停留在该部位的异物在几小时内被排除。呼吸道越往下，纤毛运动越弱。呼吸道的直径对药物粒子到达的部位亦有很大影响。酶代谢也是肺部药物吸收的屏障因素之一。③药物的理化性质：药物的脂溶性和油水分配系数影响药物的吸收。水溶性化合物主要通过细胞旁路吸收，吸收较脂溶性药物慢。药物的分子量大小也是影响肺部吸收的因素之一。④制剂因素：制剂的处方组成、吸入装置的构造影响药物雾滴或粒子的大小和性质、粒子的喷出速度等，进而影响药物的吸收。","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1584","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"3. 非口服给药途径","number":"sw-0189","title":"滞后时间 EMBED Equation.KSEE3 EMBED Equation.KSEE3 EMBED Equat","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"ion.KSEE3 EMBED Equation.KSEE3 EMBED Equation.KSEE3 EMBED Equation.KSEE3 EMBED Equation.KSEE3 多剂量给药多剂量函数第一次静脉注射后，体内最大药量 EMBED Equation.KSEE3 等于静脉注射剂量 EMBED Equation.KSEE3 EMBED Equation.KSEE3 在第一次给药后经过 EMBED Equation.KSEE3 时，体内药量达到最小，即 EMBED Equation.KSEE3 随后第二次静脉注射，则体内药量迅速增至 EMBED Equation.KSEE3 ，其为第一次给药后药物在体内的剩余量与第二次剂量之和。即： EMBED Equation.KSEE3 经过 EMBED Equation.KSEE3 后，第二次给药达最小药量： EMBED","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1585","course":"生物药剂学与药物动力学","type":"判断","chapter":"4. 药物分布","number":"sw-0190","title":"药物分布是指药物从给药部位吸收进入血液后,由循环系统运送至体内各脏器组织的过程。分布速度往往比消除慢。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1586","course":"生物药剂学与药物动力学","type":"判断","chapter":"4. 药物分布","number":"sw-0191","title":"由于药物的理化性质及生理因素的差异,不同药物在体内具有不同的分布特性,但药物在体内分布是均匀的。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1587","course":"生物药剂学与药物动力学","type":"判断","chapter":"4. 药物分布","number":"sw-0192","title":"药物从血液向组织器官分布的速度取决于组织器官的血液灌流速度和药物与组织器官的亲和力。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1588","course":"生物药剂学与药物动力学","type":"判断","chapter":"4. 药物分布","number":"sw-0193","title":"连续应用某药物,当药物从组织解脱入血的速度比进入组织的速度快时,组织中的药物浓度会逐渐升高而引起蓄积。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1589","course":"生物药剂学与药物动力学","type":"判断","chapter":"4. 药物分布","number":"sw-0194","title":"蛋白结合率越高,游离药物浓度越小。当存在饱和现象或竞争结合现象时,游离浓度变化不大,对于毒副作用较强的药物,不易发生用药安全问题。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1590","course":"生物药剂学与药物动力学","type":"判断","chapter":"4. 药物分布","number":"sw-0195","title":"药物体内分布主要决定于血液中游离型药物的浓度,其次与该药物和组织结合的程度有关。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1591","course":"生物药剂学与药物动力学","type":"判断","chapter":"4. 药物分布","number":"sw-0196","title":"药物与血浆蛋白结合,能降低药物的分布与消除速度,延长作用时间,并有减毒和保护机体的作用。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1592","course":"生物药剂学与药物动力学","type":"判断","chapter":"4. 药物分布","number":"sw-0197","title":"蛋白质大分子药物主要依赖淋巴系统转运,可使药物不通过肝从而避免首过作用。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1593","course":"生物药剂学与药物动力学","type":"判断","chapter":"4. 药物分布","number":"sw-0198","title":"胎盘屏障不同于血脑屏障。药物脂溶性越大,越难透过。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1594","course":"生物药剂学与药物动力学","type":"判断","chapter":"4. 药物分布","number":"sw-0199","title":"将聚乙二醇(PEG)引入到微粒的表面,可提高微粒的亲水性和柔软性,以使其易于被单核巨噬细胞识别和吞噬。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1595","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"4. 药物分布","number":"sw-0200","title":"表观分布容积","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"体内药量与血药浓度间的比例常数(V=X/C),表示药物在体内分布的程度,无直接生理意义,单位L或L/kg。","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","addedAt":1781947616077},{"id":"tr-1596","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"4. 药物分布","number":"sw-0201","title":"处置","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"分布、代谢和排泄过程称为处置","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1597","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"4. 药物分布","number":"sw-0202","title":"蓄积","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"药物从组织解脱回血液的速度慢于由血液进入组织的速度，连续用药时组织中的药物浓度有逐渐升高的趋势，这种现象称为蓄积","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1598","course":"生物药剂学与药物动力学","type":"填空记忆","chapter":"4. 药物分布","number":"sw-0203","title":"人血中主要有三种蛋白质______、_______、______与大多数药物结合有关。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"白蛋白，1--酸性糖蛋白，脂蛋白","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1599","course":"生物药剂学与药物动力学","type":"填空记忆","chapter":"4. 药物分布","number":"sw-0204","title":"粒径小于______m的微粒，大部分聚集于网状内皮系统，被______摄取，这也是目前研究认为微粒系统在体内分布的主要途径。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"7，肝和脾中的单核巨噬细胞","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1600","course":"生物药剂学与药物动力学","type":"填空记忆","chapter":"4. 药物分布","number":"sw-0205","title":"制备长循环微粒，可通过改善微粒的______、增加微粒表面的______及其______则可明显延长微粒在血液循环中的半衰期。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"亲水性，柔韧性，位阻","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1601","course":"生物药剂学与药物动力学","type":"填空记忆","chapter":"4. 药物分布","number":"sw-0206","title":"药物的组织结合起着药物的______作用，可延长______。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"贮库，作用时间","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1602","course":"生物药剂学与药物动力学","type":"填空记忆","chapter":"4. 药物分布","number":"sw-0207","title":"药物与蛋白结合除了受药物的理他性质、给药剂量、药物与蛋白质的亲和力及药物相互作用等因素影响外，还与______、_______和______等因素有关。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"动物种差，性别差异，生理与病理状态差异","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1603","course":"生物药剂学与药物动力学","type":"填空记忆","chapter":"4. 药物分布","number":"sw-0208","title":"当组织中的药物浓度低于血液中的药物浓度，则表观分布容积V将比该药物实际分布容积______。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"小","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1604","course":"生物药剂学与药物动力学","type":"填空记忆","chapter":"4. 药物分布","number":"sw-0209","title":"药物与血浆蛋白结合存在竞争抑制作用，这种置换作用主要对______表观分布容积、______结合率的药物影响大，故华法林与保泰松合用时需调整剂量，否则易引起______反应。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"低，高蛋自，中毒（不良，出血）","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1605","course":"生物药剂学与药物动力学","type":"填空记忆","chapter":"4. 药物分布","number":"sw-0210","title":"延长微粒在血中循环时间的方法有______、______和______。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"改善表面亲水性，减小粒径，表面荷正电","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1606","course":"生物药剂学与药物动力学","type":"填空记忆","chapter":"4. 药物分布","number":"sw-0211","title":"血浆蛋白结合率高的药物，其表观分布容积____，当增大剂量或同服另一结合率更强的药物，应注意______问题。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"小，安全性","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1607","course":"生物药剂学与药物动力学","type":"填空记忆","chapter":"4. 药物分布","number":"sw-0212","title":"药物与血浆蛋白的结合是______，有______现象，只有______型才能向组织转运并发挥药理作用，组织结合高的药物，有时会造成药物消除______。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"可逆的，饱和，游离，缓慢","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1608","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"4. 药物分布","number":"sw-0213","title":"决定药物被组织摄取和积蓄的主要因素是？哪些组织摄取药物最快？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"决定药物被组织摄取和积蓄的主要因素是组织器官的血液灌流速度和药物与组织器官的亲和力。而药物与组织和器官的亲和力主要和药物的结构、解离度、脂溶性以及蛋白结合率有关。通常血流丰富的组织摄取药物较快。","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1609","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"4. 药物分布","number":"sw-0214","title":"为什么应用“表观分布容积”这一名词，表观分布容积有何意义？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"表观分布容积是指在药物充分分布的前提下，体内全部药物按血中同样浓度溶解时所需的体液总容积。它不是药物体内分布的真实容积，而是通过实验，根据体内药量和血药浓度的比值计算得到的容积，它是真实容积在实际情况下所表现出的特征值，所以称为表观分布容积。通过表观分布容积与血药浓度可以计算体内药量及进行相关的药物动力学计算。表观分布容积与药物的蛋白结合及药物在组织中的分布密切相关，能反映药物在体内的分布特点。","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1610","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"4. 药物分布","number":"sw-0215","title":"药物血浆蛋白结合和组织蛋白结合对表观分布容积和药物消除有何影响？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"当药物主要与血浆蛋白结合时，其表观分布容积小于它们的真实分布容积；而当药物主要与血管外的组织结合时，其表观分布容积大于它们的真实分布容积。蛋白结合率高的药物，通常体内消除较慢。","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1611","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"4. 药物分布","number":"sw-0216","title":"讨论药物蛋白结合率的临床意义。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"药物与血浆蛋白结合，能降低药物的分布与消除速度，延长作用时间，并有减毒和保护机体的作用。若药物与血浆蛋白结合率很高，药理作用将受到显著影向。由于药理作用主要与血中游离药物浓度有关，因此血中游离药物浓度的变化是影响药效的重要因素。如一个结合率低于70%的药物，即使结合率降低10%，体内游离药物浓度最多只增加15%,而一个结合率高达98%的药物，若结合率降低10%，则可以使游离药物浓度上升5倍，这时可引起疗效的显著改变，甚至引起毒性反应。","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1612","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"4. 药物分布","number":"sw-0217","title":"药物蛋白结合率轻微改变（如变化率为1%），是否会显著影响作用强度？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"由于作用强度主要和血中游离药物浓度有关。对于高蛋白结合率的药物，药物蛋白结合率的轻微变化，可能导致血中游离药物浓度明显变化，因而会显著影响药物作用强度。如结合率高达98%的药物，若结合率降低1%，则可以使游离药物浓度上升","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1613","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"4. 药物分布","number":"sw-0218","title":"请举例说明为什么弱碱性药物比弱酸性药物易透过血脑屏障。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"在血浆pH7.4时，弱酸性药物主要以解离型存在，而弱碱性药物主要以非解离型存在。一般说来，弱碱性药物容易向脑脊液转运。如水杨酸和奎宁在血浆pH7.4时，非离子型分别为","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1614","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"4. 药物分布","number":"sw-0219","title":"如何通过药剂学途径增加药物的淋巴转运？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"由于大分子药物和微粒等容易通过淋巴管转运，药剂学通常采用现代制剂技术，制备脂质体、微乳、微粒、纳米粒、复合乳剂等各种载药系统，来增加药物的淋巴转运。","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1615","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"4. 药物分布","number":"sw-0220","title":"为什么微粒在体内的半衰期很短，如何延长微粒在血液中循环时间？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"常规设计的微粒给药系统在体内会被网状内皮系统的单核巨噬细胞吞噬，因此半衰期很短。通过改善微粒的亲水性，增加微粒的柔韧性及其空间位阻，干扰吞噬细胞对微粒的识别过程，则可明显延长微粒在血液中的循环时间。目前最常用的方法就是采用表面修饰技术，该技术系通过一定的化学反应，将非离子型聚合物如聚乙二醇(PEG)以共价结合的方式引入到微粒的表面，既提高了微粒的亲水性和柔韧性，又明显增加微粒的空间位阻，使微粒具有隐蔽性，不易被单核巨噬细胞识别和吞噬，从而达到长循环的目的。","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1616","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"4. 药物分布","number":"sw-0221","title":"影响微粒给药系统体内分布的因素有哪些？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"(1)细胞和微粒之间的相互作用，包括内吞作用、吸附作用、融合作用、 膜间作用等。 (2)微粒本身的理化性质，包括粒径、电荷、表面性质的影响。 (3)微粒的生物降解。 (4)机体的病理生理状况。","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1617","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"4. 药物分布","number":"sw-0222","title":"如何根据表观分布容积的大小判断药物在体内的分布情况？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"（1）组织中药物浓度与血液中药物几乎相等的药物，即具有在组织内均匀分布特征的药物。（2）组织中药物浓度比血液中药物浓度，则V值将比该药实际分布容积小。（3）组织中药物浓度高于血液中药物浓度时，V值将比该药实际分布容积大","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1618","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"4. 药物分布","number":"sw-0223","title":"简述影响药物分布的因素。影响药物分布速度的因素：（1）透过限制型分布（2）灌注限制型分布影响药物分布程度的因素：（1）药","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"物的分子量（2）药物的脂溶性（3）药物的pKa与环境pH (4)药物的血浆蛋白的结合：①蛋白结合与体内分布 ②蛋白结合与药效 ③影响蛋白结合的因素 （5）药物与组织的亲和力。","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1619","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"4. 药物分布","number":"sw-0224","title":"为什么婴幼儿和老人对某些药物的用药剂量要较成人少？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"因为婴幼儿的肝、肾功能未发育完全，对药物的消除能力低，有可能造成某些药物在婴幼儿体内蓄积，产生毒副作用。因为老人的肝、肾功衰竭，对药物的消除能力低，有可能造成某些药物在老人体内蓄积。所以婴幼儿和老人对某些药物的用药剂量要较成人少。产生毒副作用","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1620","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"4. 药物分布","number":"sw-0225","title":"为什么哺乳期妇女对某些药物要慎用？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"虽然大多数药物的乳汁排泄量低，一般低于摄入药量的2%。但由于婴儿的肝、肾功能未发育完全，对药物的消除能力低，有可能造成某些药物经乳汁进入婴儿体内蓄积，导致引入产生毒副作用。所以哺乳期妇女对某些药物要慎用","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1621","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"4. 药物分布","number":"sw-0226","title":"简述提高药物脑内分布的措施。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"将药物直接注射入脑脊液；脑内埋植灌注泵或储库型植入制剂；采取措施可逆地增加血脑屏障通透性。","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1622","course":"生物药剂学与药物动力学","type":"选择","chapter":"4. 药物分布","number":"sw-0227","title":"药物和血浆蛋白结合的特点有","options":{"A":"结合型与游离型存在动态平衡","B":"无竞争","C":"无饱和性","D":"结合率取决于血液pH","E":""},"answer":"A","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1623","course":"生物药剂学与药物动力学","type":"选择","chapter":"4. 药物分布","number":"sw-0228","title":"药物的表观分布容积是指","options":{"A":"人体总体积","B":"人体的体液总体积","C":"游离药物量与血药浓度之比","D":"体内药量与血药浓度之比","E":""},"answer":"D","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1624","course":"生物药剂学与药物动力学","type":"选择","chapter":"4. 药物分布","number":"sw-0229","title":"下列有关药物表观分布容积的叙述中,叙述正确的是","options":{"A":"表观分布容积大,表明药物在血浆中浓度小","B":"表观分布容积表明药物在体内分布的实际容积","C":"表观分布容积不可能超过体液量","D":"表观分布容积的单位是L/h","E":""},"answer":"A","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1625","course":"生物药剂学与药物动力学","type":"选择","chapter":"4. 药物分布","number":"sw-0230","title":"药物与蛋白结合后","options":{"A":"能透过血管壁","B":"能由肾小球滤过","C":"能经肝代谢","D":"不能透过胎盘屏障","E":""},"answer":"D","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1626","course":"生物药剂学与药物动力学","type":"选择","chapter":"4. 药物分布","number":"sw-0231","title":"以下错误的是","options":{"A":"淋巴循环可使药物不通过肝从而减少首过作用","B":"乳剂有利于脂溶性药物通过淋巴系统吸收","C":"都对","D":"都不对","E":""},"answer":"D","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1627","course":"生物药剂学与药物动力学","type":"选择","chapter":"4. 药物分布","number":"sw-0232","title":"5-氟尿嘧啶不同乳剂给药后,转运进入淋巴的量依次为","options":{"A":"W/O/W型>W/O型>O/W型","B":"W/O型>W/O/W型>O/W型","C":"O/W型>W/O/W型>W/O型","D":"W/O型>O/W型>W/O/W型","E":""},"answer":"A","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1628","course":"生物药剂学与药物动力学","type":"选择","chapter":"4. 药物分布","number":"sw-0233","title":"体内细胞对微粒的作用及摄取主要有以下几种方式","options":{"A":"胞饮、吸附、膜间作用、膜孔转运","B":"膜孔转运","C":"膜孔转运、胞饮、内吞","D":"膜间作用、吸附、融合、内吞","E":""},"answer":"D","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1629","course":"生物药剂学与药物动力学","type":"选择","chapter":"4. 药物分布","number":"sw-0234","title":"以下关于蛋白结合的叙述正确的是","options":{"A":"蛋白结合率越高,由于竞争结合现象,容易引起不良反应","B":"药物与蛋白结合是不可逆,有饱和和竞争结合现象","C":"药物与蛋白结合后,可促进透过血脑屏障","D":"蛋白结合率低的药物,由于竞争结合现象,容易引起不良反应","E":""},"answer":"A","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1630","course":"生物药剂学与药物动力学","type":"选择","chapter":"4. 药物分布","number":"sw-0235","title":"以下关于药物向中枢神经系统转运的叙述正确的是","options":{"A":"药物的脂溶性越高,向脑内转运越慢","B":"药物的脂溶性越低,向脑内转运越慢","C":"药物血浆蛋白结合率,结合率越高,越易向脑内转运","D":"延长载药纳米粒在体内的循环时间,降低了药物向脑内转运的效率","E":""},"answer":"B","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1631","course":"生物药剂学与药物动力学","type":"选择","chapter":"4. 药物分布","number":"sw-0236","title":"有关表观分布容积的描述正确的是","options":{"A":"具有生理学意义,指含药体液的真实容积","B":"药动学的一个重要参数,是将血浆中药物浓度与体内药量联系起来的比例常数,其大小与体液的体积相当","C":"其大小与药物的蛋白结合及药物在组织中的分布无关","D":"指在药物充分分布的假设前提下,体内全部药物按血中同样浓度溶解时所需的体液总体容积","E":""},"answer":"D","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1632","course":"生物药剂学与药物动力学","type":"选择","chapter":"4. 药物分布","number":"sw-0237","title":"当药物与蛋白结合率较大时,下列叙述正确的是","options":{"A":"血浆中游离药物浓度也高","B":"药物难以透过血管壁向组织分布","C":"可以通过肾小球滤过","D":"可以经肝脏代谢","E":""},"answer":"B","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1633","course":"生物药剂学与药物动力学","type":"选择","chapter":"4. 药物分布","number":"sw-0238","title":"有关药物的组织分布下列叙述正确的是","options":{"A":"一般药物与组织结合是不可逆的","B":"亲脂性药物易在脂肪组织蓄积,会造成药物消除加快","C":"当药物对某些组织具有特殊亲和性时,该组织往往起到药物贮库的作用","D":"对于一些血浆蛋白结合率低的药物,另一药物的竞争结合作用将使药效大大增强或发生不良反应","E":""},"answer":"C","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1634","course":"生物药剂学与药物动力学","type":"选择","chapter":"4. 药物分布","number":"sw-0239","title":"一般药物由血向体内各组织器官分布的速度为","options":{"A":"肝、肾>脂肪组织、结缔组织>肌肉、皮肤","B":"肝、肾>肌肉、皮肤>脂肪组织、结缔组织","C":"脂肪组织、结缔组织>肌肉、皮肤>肝、肾","D":"脂肪组织、结缔组织>肝、肾>肌肉、皮肤","E":""},"answer":"B","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1635","course":"生物药剂学与药物动力学","type":"判断","chapter":"5. 药物代谢","number":"sw-0240","title":"药物结合反应(Ⅱ相代谢)所需的酶称为「结合酶」。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-03-16 10:28 [41:11]〕｜非真题原题·据课堂整理","addedAt":1781947616077},{"id":"tr-1636","course":"生物药剂学与药物动力学","type":"判断","chapter":"5. 药物代谢","number":"sw-0241","title":"药物吸收进入体内后均会发生代谢反应。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1637","course":"生物药剂学与药物动力学","type":"判断","chapter":"5. ddedAt":1781947616077},{"id":"tr-1645","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"5. 药物代谢","number":"sw-0250","title":"肝提取率","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"药物经过肝脏一次,被肝脏摄取消除的分数,ER=(进入肝脏药量-流出肝脏药量)/进入肝脏药量,反映肝脏对药物的清除效率。","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","addedAt":1781947616077},{"id":"tr-1646","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"5. 药物代谢","number":"sw-0251","title":"药物代谢","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"药物在体内多种酶(主要为肝微粒体酶系)催化下发生化学结构改变的过程,又称生物转化,分I相反应(氧化/还原/水解)和II相反应(结合)。","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","addedAt":1781947616077},{"id":"tr-1647","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"5. 药物代谢","number":"sw-0252","title":"排泄","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是指药物或其代谢产物排出体外的过程","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1648","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"5. 药物代谢","number":"sw-0253","title":"消除","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"药物的代谢与排泄过程合称为消除","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1649","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"5. 药物代谢","number":"sw-0254","title":"第一相反应","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是引入官能团的反应过程，包括氧化、还原和水解反应，多数脂溶性药物经过第一相反应生成极性基团","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1650","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"5. 药物代谢","number":"sw-0255","title":"第二相反应","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是指药物中的极性基团或由第一相反应生成的代谢产物结构中的极性基团与机体内源物质反应生成结合物的过程，亦即结合反应","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1651","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"5. 药物代谢","number":"sw-0256","title":"酶诱导作用","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"人体摄入某种化学物质后，药物代谢增强的现象称为酶诱导作用","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1652","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"5. 药物代谢","number":"sw-0257","title":"酶抑制作用","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"人体摄入某种化学物质后，药物代谢减慢的现象称为酶抑制作用","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1653","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"5. 药物代谢","number":"sw-0258","title":"酶诱导剂","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"人体摄入某种化学物质后，药物代谢增强的现象称为酶诱导作用，导致药物代谢增强的化学物质称为酶诱导剂","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1654","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"5. 药物代谢","number":"sw-0259","title":"酶抑制剂","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"人体摄入某种化学物质后，药物代谢减慢的现象称为酶抑制作用，导致药物代谢减慢的化学物质称为酶抑制剂","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1655","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"5. 药物代谢","number":"sw-0260","title":"药物排泄","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是指体内原形药物及其代谢物排出体外的过程，它与生物转化统称为药物消除","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1656","course":"生物药剂学与药物动力学","type":"填空记忆","chapter":"5. 药物代谢","number":"sw-0261","title":"药物排泄的主要器官是____，一般药物以代谢产物形式排出，也有的药物以____排出。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"肾，原形药物","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1657","course":"生物药剂学与药物动力学","type":"多选","chapter":"5. 药物代谢","number":"sw-0262","title":"药物代谢酶存在于以下哪些部位中","options":{"A":"肝","B":"肠","C":"肾","D":"肺","E":""},"answer":"ABCD","answerText":"","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1658","course":"生物药剂学与药物动力学","type":"多选","chapter":"5. 药物代谢","number":"sw-0263","title":"药物代谢I相反应不包括","options":{"A":"氧化反应","B":"还原反应","C":"水解反应","D":"结合反应","E":""},"answer":"D","answerText":"","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1659","course":"生物药剂学与药物动力学","type":"多选","chapter":"5. 药物代谢","number":"sw-0264","title":"体内常见的结合剂主要包括","options":{"A":"葡萄糖醛酸","B":"乙酰辅酶A","C":"腺苷甲硫氨酸","D":"硫酸","E":""},"answer":"ABCD","answerText":"","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1660","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"5. 药物代谢","number":"sw-0265","title":"药物代谢的临床意义","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"1使药物失活或活性降低(多数);2使药物活化(前药转化为活性物);3产生毒性代谢物;4影响药物作用强度与持续时间;5酶诱导/酶抑制引起药物相互作用;6个体差异(基因多态性)影响疗效与安全性,是个体化给药依据。","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","addedAt":1781947616077},{"id":"tr-1661","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"5. 药物代谢","number":"sw-0266","title":"药物代谢对药理作用可能产生哪些影响？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"药物代谢对药理作用有可能产生以下影响：①使药物失去活性，代谢可以使药物作用钝化，即由活性药物变化为无活性的代谢物，使药物失去治疗活性；②使药物活性降低药物经代谢后，其代谢物活性明显下降，但仍具有一定的药理作用；③使药物活性增强，即药物经代谢后，表现出药理效应增强，有些药物的代谢产物比其原药的药理作用更强；④使药理作用激活，有一些药物本身没有药理活性，在体内经代谢后产生有活性的代谢产物，通常的前体药物就是根据此作用设计的，即将活性药物衍生化成药理惰性物质，但该惰性物质能够在体内经化学反应或酶反应，使母体药物再生而发挥治疗作用；⑤代谢产生毒性代谢物，有些药物经代谢后可产生毒性物质。","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1662","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"5. 药物代谢","number":"sw-0267","title":"简述药物代谢反应的类型。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"药物在体内的代谢反应是一个很复杂的化学反应过程，通常可以分为I相反应和相反应两大类。I相反应包括氧化反应、还原反应和水解反应，参与各种不同反应的药物代谢酶依次为氧化酶、还原酶和水解酶，通常是脂溶性较强的药物通过反应生成极性基团。相反应即结合反应，参与该反应的药物代谢酶为各种不同类型的转移酶，通常是药物或I相反应生成的代谢产物结构中的极性基团与机体内源性物质反应生成结合物。","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1663","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"5. 药物代谢","number":"sw-0268","title":"通过干预药物代谢过程可改善制剂的疗效，试举例说明其原理。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"根据药酶抑制剂的性质，可设计利用一个药物对药酶产生抑制，从而来减少或延缓另一个药物的代谢，达到提高疗效或延长作用时间的目的。以左旋多巴为例，为了减少脱羧酶的脱羧作用，设计将脱羧酶抑制剂和左旋多巴同时应用，组成复方片剂。如采用的脱羧酶抑制剂卡比多巴和盐酸苄丝肼。它们可抑制小肠、肝、肾中的脱羧酶的活性，故能抑制左旋多巴的脱羧作用。这两种脱羧酶抑制剂不能透过血．脑屏障，因而不会影响脑内脱羧酶的活性。结果是既能抑制外周的左旋多巴的代谢，增加进入中枢的左旋多巴的量，又能使摄入脑内的左旋多巴顺利地转化成多巴胺，进而发挥药理作用，大大降低了左旋多巴的给药剂量。","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1664","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"5. 药物代谢","number":"sw-0269","title":"为什么孕妇对某些药物要慎用？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"药品都有其适应征和禁忌征，特别是毒性强的药品，毒副作用更大，不良后果，比较明显的是致瘾，致畸，致突变，所以孕妇对某些药物要慎用，以免引起胎儿发育不良及先天性疾病。 药物代谢","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1665","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"5. 药物代谢","number":"sw-0270","title":"药物代谢酶分为哪几类？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"主要存在于哪些组织中？药物在哪些部位会发生代谢？药物代谢酶分为微粒体酶系和非微粒体酶系。微粒体酶系主要存在于肝脏内质网，非微粒体酶系在肝脏、血液、肠粘膜、肾及其他组织中均有存在。药物的代谢部位：肝、肠、肾、肺、脑、血浆、胎盘、眼、皮肤和脾脏。第一相代谢反应、第二相代谢反应各包括哪些具体反应？第一相反应：氧化反应、还原反应、水解反应。第二相反应：葡萄糖醛酸结合、硫酸结合、葡萄糖结合、氨基酸结合、乙酰化、甲基化、谷胱苷肽结合","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1666","course":"生物药剂学与药物动力学","type":"判断","chapter":"6. 药物排泄","number":"sw-0271","title":"与血浆蛋白结合的药物不能被肾小球滤过。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1667","course":"生物药剂学与药物动力学","type":"判断","chapter":"6. 药物排泄","number":"sw-0272","title":"药物的清除率具有加和性,即:Cl_T=Cl_R+Cl_NR(Cl_R为肾清除率,Cl_NR为经非肾途径药物的清除率)。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1668","course":"生物药剂学与药物动力学","type":"判断","chapter":"6. 药物排泄","number":"sw-0273","title":"如果药物只经肾小球滤过,并全部从尿中排出,则药物排泄率与滤过率相等。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1669","course":"生物药剂学与药物动力学","type":"判断","chapter":"6. 药物排泄","number":"sw-0274","title":"肾小管分泌是将药物转运至尿中排泄,该过程分为主动转运和被动扩散两种方式。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1670","course":"生物药剂学与药物动力学","type":"判断","chapter":"6. 药物排泄","number":"sw-0275","title":"药物的肾排泄是指肾小球滤过、肾小管分泌、肾小管重吸收的总和。所以总的排泄率可表示为:药物肾排泄=药物滤过+药物分泌+药物重吸收。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1671","course":"生物药剂学与药物动力学","type":"判断","chapter":"6. 药物排泄","number":"sw-0276","title":"正常生理条件下,在肾脏滤过的绝大部分液体(约99%)被重吸收,同时重吸收其中的葡萄糖、氯化钠、代谢产生的废物、尿酸、肌酸酐等。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1672","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"6. 药物排泄","number":"sw-0277","title":"肠肝循环","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"经胆汁排入肠道的药物(或其结合物经水解)在肠道被重新吸收、经门静脉返回肝脏的现象。可使药物在体内停留时间延长、出现血药浓度第二高峰(双峰现象)。","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","addedAt":1781947616077},{"id":"tr-1673","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"6. 药物排泄","number":"sw-0278","title":"肾清除率","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"单位时间内肾脏能将多少体积血浆中的药物完全清除,Clr=肾排泄速率/血药浓度=尿药浓度×尿流速/血药浓度,单位ml/min或L/h。","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","addedAt":1781947616077},{"id":"tr-1674","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"6. 药物排泄","number":"sw-0279","title":"肝肠循环（双峰现象+作用延长）","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"经胆汁(或部分经胆汁)排入肠道的药物,在肠道中又被重新吸收、经门静脉返回肝脏的现象。两层表现要一起答:药动学上表现为双峰现象(第二峰小于第一峰);药效上表现为作用时间延长(如洋地黄毒苷、吗啡、氯霉素)。","mnemonic":"🆕课堂强调·补充｜〔2026-04-01 11:18 [25:28]〕｜非真题原题·据课堂整理","addedAt":1781947616077},{"id":"tr-1675","course":"生物药剂学与药物动力学","type":"填空记忆","chapter":"6. 药物排泄","number":"sw-0280","title":"不同物质通过肾小球滤过膜的能力决定于被滤过物质____和____。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"相对分子质量，所带的电荷","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1676","course":"生物药剂学与药物动力学","type":"填空记忆","chapter":"6. 药物排泄","number":"sw-0281","title":"肾小球滤过的结构基础是____，肾小球滤过的动力是____，肾小球滤过作用的大小以____表示。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"滤过膜，有效滤过压，肾小球滤过率","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1677","course":"生物药剂学与药物动力学","type":"填空记忆","chapter":"6. 药物排泄","number":"sw-0282","title":"肾小球滤过的Na+约有65%～70%是在____被重吸收的。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"肾近曲小管","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1678","course":"生物药剂学与药物动力学","type":"填空记忆","chapter":"6. 药物排泄","number":"sw-0283","title":"如果某种物质的血浆清除率等____ml/min，表明该物质只经肾小球滤过，不被肾小管重吸收，也不被肾小管分泌。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"125","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1679","course":"生物药剂学与药物动力学","type":"填空记忆","chapter":"6. 药物排泄","number":"sw-0284","title":"大多数外源性物质（如药物）的重吸收主要是被动过程，其重吸收的程度取决于药物的____、____、____、____。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"脂溶性，pKa，尿量，尿的pH","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1680","course":"生物药剂学与药物动力学","type":"填空记忆","chapter":"6. 药物排泄","number":"sw-0285","title":"药物经肾排泄包括____、____、____三个过程。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"肾小球滤过，肾小管分泌，肾小管重吸收","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1681","course":"生物药剂学与药物动力学","type":"填空记忆","chapter":"6. 药物排泄","number":"sw-0286","title":"分子量在____左右的药物有较大的胆汁排泄率。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"500","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1682","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"6. 药物排泄","number":"sw-0287","title":"苯巴比妥中毒的肾排泄解救","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"苯巴比妥为弱酸性药(pKa约7.4)。碱化尿液(静滴碳酸氢钠)使尿液pH升高,药物在尿中解离度增大、脂溶性降低、肾小管重吸收减少,从而加速其经肾排泄——即'碱化尿液促弱酸性药排泄'。同时利尿可加快清除。","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","addedAt":1781947616077},{"id":"tr-1683","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"6. 药物排泄","number":"sw-0288","title":"为什么药物与血浆蛋白结合后，会延长仅由肾小球滤过药物的肾清除率，但不影响通过肾小球滤过和肾小管主动分泌两种途径清除药物的肾清除率？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"由于只有游寓型才能被肾小球滤过，因此药物与血浆蛋白结合后，会降低药物的肾小球过滤。对于仅由肾小球滤过的药物，则导致其肾清除率延长。对于同时存在肾小球滤过和肾小管主动分泌两种途径清除的药物，由于肾小管主动分泌一般不受蛋白结合率的影响，因此其肾清除率基本不受影响。如青霉素G尽管血浆蛋白结合率很高，很少被肾小球滤过，但主要由近曲小管分泌排入小管液，只需通过一次肾血液循环就几乎完全从血浆中被清除。","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1684","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"6. 药物排泄","number":"sw-0289","title":"影响肾小球滤过的因素有哪些？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"主要有如下三个因素： (1)肾小球滤过膜的通透性和面积：当通透性改变或面积减少时，可使滤过聋尿液的成分改变和尿量减少。 (2)肾小球有效滤过压改变：当肾小球毛细血管血压显著降低（如大失血）或囊压升高（如输尿管结石等）时，可使有效滤过压降低，滤过率下降，尿量减少。如果血渗透压降低（血浆蛋白明显减少或静脉注射大量生理盐水），则有效滤过压升高，滤过率增多。 (3)肾血流量：肾血流量大时，滤过率高；反之，滤过率低。","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1685","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"6. 药物排泄","number":"sw-0290","title":"静脉快速输入大量生理盐水或大量饮用清水，尿量会发生什么样的变化？变化的原因是什么？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"均会引起尿量增多。主要原因是血浆蛋白被稀释，血浆蛋白浓度降低、血浆胶体渗透压下降，从而使肾小球有效滤过压升高，肾小球滤过率升高，最后导致尿量增加。","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1686","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"6. 药物排泄","number":"sw-0291","title":"大量出汗或大量失血，尿量会发生什么变化？变化的原因是什么？ 参考答案","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"大量出汗或大量失血，都会引起尿量减少。主要原因如下： (1)大量出汗时，水的丢失多于电解质的丢失，血浆晶体渗透压升高，渗透压感受器兴奋，使下丘脑视上核、室旁核神经元合成抗利尿激素增多，神经垂体释放抗利尿激素增多，远曲小管和集合管对水通透性增加，水的重吸收增加，尿量减少。 (2)循环血量减少时，对容量感受器（位于大静脉和左心房）的刺激减弱，感受器沿迷走神经传人冲动减少，对视上核、室旁核的抑制减弱，使神经垂体释放抗利尿激素增加，远曲小管和集合管对水的通透性增加，水的重吸收增加，尿量减少。 鮟钘趑蚊肃穽獷p漀漀漀漀漀漀脈脈漀漀鶠鞚醔認蒇綀癹灳漀漀漀漀漀漀漀漀漀漀漀鶠隙辒覌莆籿癹r漀漀漀漀漀漀漀漀漀漀漀漀鮞閘辒覌莆綀睺煴漀漀漀漀漀漀漀漀漀漀鲠隙邓覍莆綀発s漀漀漀漀漀麡颛銕讎薈纁硻u漀漀漀麢颛銕貏蚉肃穽w漀龢馜鎖趐螊肃穽v漀漀⑤⑦鲟隙邓覍莆綀睺t漀漀漀漀鶠鞚醔讎薈纁硻u漀漀漀鶠隙邓覌芅籿癹漀漀漀漀漀骝钗躑袋芅籿癹s漀漀漀漀漀鮞閘辒覌莆綀睺t漀漀漀漀麡颛銕貏蚉肃穽w漀鶡隚邓認莇粀畹r漀漀漀漀漀漀漀漀漀漀漀漀鲟閘躑螊膄签瑷p漀漀漀漀漀漀漀漀漀漀漀漀漀漀鶠隚输袌膅签獷p脈脈漀漀漀漀漀漀漀漀漀漀漀漀麡颛銕貏蚉肃祽u脈脈漀鲟隙邓認蒇纁硻牵漀漀漀上 制？","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1688","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"6. 药物排泄","number":"sw-0293","title":"简述药物胆汁排泄的过程及其影响因素。药物胆汁排泄：药物自胆汁进入十二指肠，随粪便排出体外；自胆汁排入十二指肠的药物在小肠","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"再被重吸收（肝肠循环）影响胆汁排泄的因素：（1）胆汁流量：药物的胆汁排泄往往随胆汁流量的增加而增加。（2）化合物的理化性质：化合物的分子量、极性、取代基、解离状态及脂溶性等，对胆汁排泄影响较大。（3）生理因素：种属差异、代谢状况、蛋白质结合率、疾病和老化等会影响化合物的胆汁排泄。","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1689","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"6. 药物排泄","number":"sw-0294","title":"肝肠循环有何意义？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"①可以有效地利用体内必需物质，如帮助消化的胆盐通过肝肠循环可以得到再次利用。②较大药量反复进行肝肠循环可延长药物的生物半衰期和药效维持时间。药物传递系统的设计及其体内过程","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1690","course":"生物药剂学与药物动力学","type":"选择","chapter":"6. 药物排泄","number":"sw-0295","title":"以下哪个不属于肾排泄的过程","options":{"A":"肾小球滤过","B":"肾小球重吸收","C":"肾小管分泌","D":"肾小管重吸收","E":""},"answer":"B","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1691","course":"生物药剂学与药物动力学","type":"选择","chapter":"6. 药物排泄","number":"sw-0296","title":"以下哪种物质用以测定肾小球的滤过率","options":{"A":"菊粉","B":"葡萄糖","C":"胍乙啶","D":"维生素C","E":""},"answer":"A","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1692","course":"生物药剂学与药物动力学","type":"选择","chapter":"6. 药物排泄","number":"sw-0297","title":"临床上可用调节尿液pH的方法影响药物的重吸收,从而影响药物的排泄。以下哪种药物中毒可采用碱化尿液以加速其排泄","options":{"A":"氨茶碱","B":"哌替啶","C":"阿托品","D":"阿司匹林","E":""},"answer":"D","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1693","course":"生物药剂学与药物动力学","type":"选择","chapter":"6. 药物排泄","number":"sw-0298","title":"以下哪种药物的主要排泄途径不是胆汁排泄","options":{"A":"水飞蓟素","B":"吲哚美辛","C":"庆大霉素","D":"β-胆甾醇类","E":""},"answer":"C","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1694","course":"生物药剂学与药物动力学","type":"选择","chapter":"6. 药物排泄","number":"sw-0299","title": 集","addedAt":1781947616077},{"id":"tr-1709","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"7. 药物动力学概述","number":"sw-0314","title":"生物半衰期","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是指体内药量或血药浓度降低一半所需的时间，又称半衰期或消除半衰期清除率：单位时间内机体清除含有药物的血药或血浆的体积，单位为ml/min。CL=kV2.简述生物药剂学与药物动力学的研究目的。（1）生物药剂学研究目的：为了正确评价药物制剂质量、设计合理的剂型及制剂工艺、指导合理临床用药提供科学依据，以确保用药的安全与有效。（2）药物动力学研究目的：研究药物在体内的经时变化过程，并提出这种变化过程的数学模型；研究制剂的生物利用度与生物等效性；应用药物动力学参数设计给药方案；指导药物制剂的设计并对其生产质量进行评价；探讨药物化学结构域药物动力学特征之间的关系。第八章 单室模型第一节 静脉注射1.血药","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1710","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"7. 药物动力学概述","number":"sw-0315","title":"试述药物动力学在药剂学研究中的作用","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"指导新剂型/制剂处方工艺优化;评价制剂生物利用度与等效性;为缓控释、靶向制剂设计提供依据;建立体内外相关性指导质量控制","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1711","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"7. 药物动力学概述","number":"sw-0316","title":"表观分布容积是否具有直接生理意义?为什么","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"无直接生理意义。它是体内药量与血药浓度的比例常数,不代表真实体液容积,仅反映药物在体内分布广窄程度。 --- #","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1712","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"7. 药物动力学概述","number":"sw-0317","title":"前体药物是怎样产生药效的？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"前体药物本身没有活性或活性很低，经过体内代谢后变为有活性的物质而产生药效。药物动力学概述","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1713","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"7. 药物动力学概述","number":"sw-0318","title":"血药浓度经时变化 EMBED Equation.KSEE3 EMBED Equation.KSEE3 EMBED E","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"quation.KSEE3 EMBED Equation.KSEE3","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1714","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"7. 药物动力学概述","number":"sw-0319","title":"血药浓度达峰时间和峰值 EMBED Equation.KSEE3 血药浓度-时间曲线下面积 EMBED Equation"," ":"D","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1721","course":"生物药剂学与药物动力学","type":"选择","chapter":"7. 药物动力学概述","number":"sw-0326","title":"关于表观分布容积的叙述,正确的是","options":{"A":"表观分布容积与血药浓度成正比","B":"无生理学意义","C":"是体内药物真实容积","D":"评价药物靶向分布","E":""},"answer":"B","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1722","course":"生物药剂学与药物动力学","type":"选择","chapter":"7. 药物动力学概述","number":"sw-0327","title":"某药物组织结合率很高,因此该药物","options":{"A":"半衰期长","B":"半衰期短","C":"表观分布容积小","D":"表观分布容积大","E":""},"answer":"D","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1723","course":"生物药剂学与药物动力学","type":"选择","chapter":"7. 药物动力学概述","number":"sw-0328","title":"下列哪项不是生理药动学模型的局限性","options":{"A":"模型结构复杂,方程求解困难","B":"需要大量动物生理参数","C":"验证需多时间点组织样本","D":"模型与解剖生理无直接联系,仅用血药浓度推测靶器官浓度","E":""},"answer":"D","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1724","course":"生物药剂学与药物动力学","type":"选择","chapter":"7. 药物动力学概述","number":"sw-0329","title":"关于隔室模型的叙述,正确的是","options":{"A":"周边室指心脏以外组织","B":"机体最多只有二室模型","C":"隔室有解剖学实际意义","D":"隔室以速度论观点划分","E":""},"answer":"D","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1725","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"8. 单室模型","number":"sw-0330","title":"对于半衰期短的药物根据生物半衰期设计给药方案","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"半衰期极短的药物,若按t1/2给药则给药过频。可采取:1静脉滴注维持稳态;2制成缓控释制剂延缓释放;3加入吸收延缓剂;4必要时联合负荷剂量+维持滴注。目标是维持血药浓度在治疗窗内、减少波动。","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","addedAt":1781947616077},{"id":"tr-1726","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"8. 单室模型","number":"sw-0331","title":"静脉滴注法求算药物动力学参数稳态时停滴 EMBED Equation.KSEE3 （2）稳态前停滴 EMBED Equa","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"tion.KSEE3 静脉滴注的负荷剂量问题快速静脉注射同时静脉滴注的给药方式 EMBED Equation.KSEE3 先快速滴注再慢速滴注的给药方式 EMBED Equation.KSEE3 EMBED Equation.KSEE3 第三节 血管外给药","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1727","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"8. 单室模型","number":"sw-0332","title":"多次口服给药（血管外给药） EMBED Equation.KSEE3 EMBED Equation.KSEE3 稳态血","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"药浓度多次静脉注射稳态血药浓度达到稳态时， EMBED Equation.KSEE3 EMBED Equation.KSEE3 EMBED Equation.KSEE3 多剂量给药后稳态血药浓度公式的通式 EMBED Equation.KSEE3 两室模型药物多次静脉注射后稳态血药浓度公式 EMBED Equation.KSEE3 多次口服给药稳态血药浓度 EMBED Equation.KSEE3 ①稳态时最大血药浓度（峰值） EMBED Equation.KSEE3 ②稳态时最小血药浓度， EMBED Equation.KSEE3 EMBED Equation.KSEE3 ③稳态血药浓度峰值时间 EMBED Equation.KSEE3 EMBED Equation.KSEE3 整理得多剂量给药血药浓度达峰值时间 EMBED Equation.KSEE3 单剂量给药血药浓度达峰值","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1728","course":"生物药剂学与药物动力学","type":"计算记忆","chapter":"8. 单室模型","number":"sw-0333","title":"安定先静注10mg,半小时后静脉滴注k0=10mg/h,经3小时是否达治疗浓度0.5-2.5mg/ml(t1/2=5.5h)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"k=0.693/5.5=0.126 h−1。叠加原理:静注后t时浓度C1=(X0/V)e^(−kt);滴注开始后t'时间贡献C2=(k0/(kV))(1−e^(−kt'))。总浓度=两部分之和。代入静注后总时长3h(其中滴注进行2.5h),分别算静注残留与滴注累积之和,与0.5–2.5mg/ml比较判断。本题考叠加原理:静注+滴注血药浓度=各自贡献之和。\n注:本题需V值代入方可得数值结论;若题目给出V(或体重×分布容积),按上式叠加计算3h时总浓度再与0.5–2.5mg/ml比较。此处展示解法框架,数值以题给V为准。","mnemonic":"必背｜doubao历年P114｜历年计算原题(P114必考)·解法据教材","addedAt":1781947616077},{"id":"tr-1729","course":"生物药剂学与药物动力学","type":"计算记忆","chapter":"8. 单室模型","number":"sw-0334","title":"单次静脉注射单室模型药物2g,测得不同时间血药浓度,求k、Cl、V、AUC及14h血药浓度","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"对单室静注,lgC对t线性回归:得 a(截距lgC0)=−0.4954, b(斜率)=−0.0610, |r|=0.999(相关性好)。回归方程 lgC=−0.061t−0.4954。\n1k=−2.303×b=−2.303×(−0.061)=0.1405 h−1\n2t1/2=0.693/k=0.693/0.1405=4.93 h\n3C0=10^(−0.4954)=0.3196 mg/ml\n4V=X0/C0=2000mg/0.3196=6258 ml=6.258 L\n5Cl=k·V=0.1405×6.258=0.879 L/h\n6AUC=C0/k=0.3196/0.1405=2.275 mg·h/ml(或X0/Cl)\n7t=14h: lgC=−0.061×14−0.4954=−1.3494 → C=10^(−1.3494)=0.0447 mg/ml=44.7 μg/ml。\n关键:须判断回归用lg还是ln(本题用lg,故k=−2.303b)。","mnemonic":"必背｜doubao历年P114｜历年计算原题(P114必考)","addedAt":1781947616077},{"id":"tr-1730","course":"生物药剂学与药物动力学","type":"计算记忆","chapter":"8. 单室模型","number":"sw-0335","title":"某单室模型药物生物半衰期5小时,静脉滴注达稳态血药浓度的95%需要多少时间?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"达稳态分数 fss=1-e^(-kt)。达95%即 1-e^(-kt)=0.95 → e^(-kt)=0.05 → kt=ln20≈3.0 → t=3.0/k。k=0.693/t1/2=0.693/5=0.1386 h−1。t=ln20/k=2.996/0.1386≈21.6 h。规律:达稳态95%约需4.32个半衰期(4.32×5=21.6h)。","mnemonic":"必背｜doubao历年P114｜历年计算原题(P114必考)·解法据教材","addedAt":1781947616077},{"id":"tr-1731","course":"生物药剂学与药物动力学","type":"计算记忆","chapter":"8. 单室模型","number":"sw-0336","title":"【计算】【考试原题·计算题】单室模型静脉注射参数计算(老师课堂亲述考题)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"【考试原题·计算题】单室模型静脉注射参数计算(老师课堂亲述考题):已知某单室模型药物单次静脉注射剂量2000mg,静脉采血2-3mL经蛋白沉淀预处理后用HPLC测定各时刻血药浓度:1h(0.28)→2h(0.24)→3h(0.21)→4h(0.18)→5h(0.16)→6h(0.14)→8h(0.10)→10h(0.08)(μg/mL)。求:k、t½、C₀、Cl、AUC及14h血药浓度。解法:lgC-t线性回归得 lgC=−0.1356t+2.1762→k=−2.303×(−0.1356)=0.312h⁻¹、t½=0.693/0.312=2.22h、C₀=10^2.1762=150μg/mL、V=X₀/C₀=2000mg/150μg/mL=13.33L、14h浓度用方程外推。注意mg与μg换算(1mg=1000μg)。\n\n〔老师强调/扣分点〕★★★★考试原题(老师课堂亲述并要求提交)。单室静注全套参数计算,数据2000mg给药,1h(0.28)→10h(0.08),是期中/期末必考计算题原型。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 单室静注计算—【考试原题】(老师亲述,真题计算题原型)〕｜参考答案据课堂/教材整理","addedAt":1781947616077},{"id":"tr-1732","course":"生物药剂学与药物动力学","type":"选择","chapter":"8. 单室模型","number":"sw-0337","title":"单室模型药物静脉注射,血药浓度与时间关系为","options":{"A":"直线","B":"抛物线","C":"指数曲线","D":"双曲线","E":""},"answer":"C","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1733","course":"生物药剂学与药物动力学","type":"选择","chapter":"8. 单室模型","number":"sw-0338","title":"单室模型静脉注射,lgC-t图斜率为","options":{"A":"-k/2.303","B":"-k","C":"k","D":"2.303k","E":""},"answer":"A","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1734","course":"生物药剂学与药物动力学","type":"选择","chapter":"8. 单室模型","number":"sw-0339","title":"单室模型静脉注射,t1/2计算公式为","options":{"A":"0.693/k","B":"k/0.693","C":"2.303/k","D":"k/2.303","E":""},"answer":"A","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1735","course":"生物药剂学与药物动力学","type":"选择","chapter":"8. 单室模型","number":"sw-0340","title":"静脉滴注达稳态前停止滴注,血药浓度如何变化","options":{"A":"立即下降","B":"先升后降","C":"持续上升","D":"保持不变","E":""},"answer":"A","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1736","course":"生物药剂学与药物动力学","type":"选择","chapter":"8. 单室模型","number":"sw-0341","title":"单室模型血管外给药,血药浓度公式为","options":{"A":"C=X0/V·(ka/(ka−k))(e−kt−e−kat)","B":"C=X0/V·e−kt","C":"C=k0/Vk·(1−e−kt)","D":"C=X0/V·(k/(ka−k))(e−kat−e−kt)","E":""},"answer":"A","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1737","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"9. 多室模型","number":"sw-0342","title":"双室模型","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"将机体视为中央室和周边室两个房室,药物先分布于中央室(血液及血流丰富组织),再向周边室(血流较少组织)转运,血药浓度-时间曲线呈双指数衰减。","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","addedAt":1781947616077},{"id":"tr-1738","course":"生物药剂学与药物动力学","type":"选择","chapter":"9. 多室模型","number":"sw-0343","title":"双室模型药物静脉注射,中央室药物向周边室转运的速率常数为","options":{"A":"k10","B":"k12","C":"k21","D":"k0","E":""},"answer":"B","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1739","course":"生物药剂学与药物动力学","type":"选择","chapter":"9. 多室模型","number":"sw-0344","title":"双室模型静脉注射,消除发生在","options":{"A":"中央室","B":"外周室","C":"中央室与外周室","D":"全身","E":""},"answer":"A","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1740","course":"生物药剂学与药物动力学","type":"选择","chapter":"9. 多室模型","number":"sw-0345","title":"双室模型血药浓度-时间曲线分为","options":{"A":"吸收相、分布相","B":"分布相、消除相","C":"吸收相、消除相","D":"起效相、效应相","E":""},"answer":"B","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1741","course":"生物药剂学与药物动力学","type":"选择","chapter":"9. 多室模型","number":"sw-0346","title":"双室模型中,α称为","options":{"A":"消除速率常数","B":"吸收速率常数","C":"分布相混杂参数","D":"消除相混杂参数","E":""},"answer":"C","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1742","course":"药物分析学","t 762","course":"药物分析学","type":"简答记忆","chapter":"第一章 绪论","number":"ya-0021","title":"药品的概念?对药品的进行质量控制的意义?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"1)药品是指用于预防、治疗、诊断人的疾病，有目的地调节人的生理机能并规定有适应证或者功能主治、用法用量的物质，是广大人民和群众防病治病、保护健康必不可少的特殊商品。用于预防治疗诊断人的疾病的特殊商品。2) 对药品的进行质量控制的意义; 保证药品质量，保障人民用药的安全、有效和维护人民身体健康药物分析在药品的质量控制中担任着主要的任务是什么?答: 保证人们用药安人全、合理、有效，完成药品质量监督工作。常见的药品标准主要有哪些， 各有何特点?: 国家药品标准(药典) ;临床研究用药质量标准;暂行或试行药品标准;企业标准。国药 (2005 年版) 是怎样编排的?凡例、正文、附录、索引。么叫恒重，什么叫空白试验，什么叫标准品、对照品?恒重是供试品连续两次干燥或灼烧后的重量差异在 0. 3mg 以下的重量;空白试验","mnemonic":"重要｜药物分析-DY(OCR)(1).docx","addedAt":1781947616078},{"id":"tr-1763","course":"药物分析学","type":"简答记忆","chapter":"第一章 绪论","number":"ya-0022","title":"亚硝酸钠滴定法常采用的指示终点的方法有哪些?中国药典采用的是哪种?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"亚硝酸钠滴定法常采用的指示终点的方法有;电位法、永停滴定法、外指示剂法和内指示剂法。中国药典采用的是永停滴定法。","mnemonic":"重要｜药物分析-DY(OCR)(1).docx","addedAt":1781947616078},{"id":"tr-1764","course":"药物分析学","type":"计算记忆","chapter":"第一章 绪论","number":"ya-0023","title":"精密称取丙磺舒0.6119g, 按药典规定加中性乙醇溶解后，以酚酞为指示液，用氢氧 化钠滴定液(0.1022mol/L) 滴定片10片，用去氢氧化钠滴定液20.77ml, 求丙磺舒的百 分含量?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"答案：99.01%","mnemonic":"重要｜药物分析-DY(OCR)(1).docx","addedAt":1781947616078},{"id":"tr-1765","course":"药物分析学","type":"计算记忆","chapter":"第一章 绪论","number":"ya-0024","title":"称取对氨基水杨酸钠0.4132g, 按药典规定加水和盐酸后，按永停滴定法用亚硝酸钠 滴定液(0.1023mol/L) 滴定到终点，消耗亚硝酸钠滴定液22.91ml, 求对氨基水杨酸钠 (C₇H₆NNaO₃) 的百分含量?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"答案：99.32%","mnemonic":"重要｜药物分析-DY(OCR)(1).docx","addedAt":1781947616078},{"id":"tr-1766","course":"药物分析学","type":"计算记忆","chapter":"第一章 绪论","number":"ya-0025","title":"取标示量为0.5g 阿司匹林10片，称出总重为5.7680g, 研细后，精密称取0.3576g, 按药典规定用两次加碱剩余碱量法测定。消耗硫酸滴定液(0.05020mol/L)22.92ml, 空 白试验消耗该硫酸滴定液39.84ml, 求阿司匹林的含量为标示量的多少?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"答案：98.75%","mnemonic":"重要｜药物分析-DY(OCR)(1).docx","addedAt":17819476160 },"answer":"填空题","answerText":"因所需标准铅/砷量极微,直接称量误差大,故先配成较浓贮备液,临用前精密量取并稀释,以减小称量误差、保证浓度准确","mnemonic":"重要｜药物分析习题集-南京廖华答案网","addedAt":1781947616078},{"id":"tr-1801","course":"药物分析学","type":"多选","chapter":"第三章 药物的杂质检查","number":"ya-0060","title":"药物中杂质的来源包括（）","options":{"A":"原料不纯或反应不完全","B":"中间体及副产物","C":"精制中残留的试剂/溶剂","D":"储藏中氧化、水解、聚合等","E":"金属器皿/装置带入的金属杂质"},"answer":"ABCDE","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-03-10 15:38 [08:30]〕｜供练习用·期末是否考待定｜非真题原题·据课堂整理","addedAt":1781947616078},{"id":"tr-1802","course":"药物分析学","type":"多选","chapter":"第三章 药物的杂质检查","number":"ya-0061","title":"下列属于药品安全性检查项目的有（）","options":{"A":"无菌检查","B":"热原检查","C":"细菌内毒素检查","D":"降压物质检查","E":"重量差异检查"},"answer":"ABCD","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-03-10 15:38 [04:00]〕｜供练习用·期末是否考待定｜非真题原题·据课堂整理","addedAt":1781947616078},{"id":"tr-1803","course":"药物分析学","type":"多选","chapter":"第三章 药物的杂质检查","number":"ya-0062","title":"用对照法进行药物的一般杂质检查时，操作中应注意( )","options":{"A":"供 试 管 与 对 照 管 应 同 步 操 作","B":"称 取 1g 以 上 供 试 品 时 ， 不 超 过 规 定 量 的 ± 1 % 虹","C":"仪器应配对","D":"溶剂应是去离子水","E":"对照品必须与待检杂质为同一物质"},"answer":"AB","answerText":"","mnemonic":"重要｜药分答案PDF-OCR","addedAt":1781947616078},{"id":"tr-1804","course":"药物分析学","type":"多选","chapter":"第三章 药物的杂质检查","number":"ya-0063","title":"关于药物中氯化物的检查，正确的是( )","options":{"A":"氯化物检查在一定程度上可“指示”生产、储存是否正常","B":"氯化物检查可反应Ag 的多少","C":"氯化物检查是在酸性条件下进行的","D":"供试品的取量可任意","E":"标准 NaCl液的取量由限量及供试品取量而定"},"answer":"BE","answerText":"","mnemonic":"重要｜药分答案PDF-OCR","addedAt":1781947616078},{"id":"tr-1805","course":"药物分析学","type":"多选","chapter":"第三章 药物的杂质检查","number":"ya-0064","title":"检查重金属的方法有( )","options":{"A":"古蔡氏法","B":"硫代乙酰胺","C":"硫化钠法","D":"微孔滤膜法","E":"硫氰酸法"},"answer":"D","answerText":"","mnemonic":"重要｜药分答案PDF-OCR","addedAt":1781947616078},{"id":"tr-1806","course":"药物分析学","type":"多选","chapter":"第三章 药物的杂质检查","number":"ya-0065","title":"关于硫代乙酰胺法错误的叙述是( )","options":{"A":"是检查氯化物的方法","B":"是检查 重金属的方法","C":"反应结果是以黑色为背景","D":"在弱酸性条件下水解，产生硫化氢","E":"反应时pH 应为7-8"},"answer":"D","answerText":"","mnemonic":"重要｜药分答案PDF-OCR","addedAt":1781947616078},{"id":"tr-1807","course":"药物分析学","type":"多选","chapter":"第三章 药物的杂质检查","number":"ya-0066","title":"下列不属于一般杂质的是 ( )","options":{"A":"氯化物","B":"重金属","C":"氰化物","D":"2-甲基-5-硝基咪唑","E":"硫酸盐"},"answer":"D","answerText":"","mnemonic":"重要｜药分答案PDF-OCR","addedAt":1781947616078},{"id":"tr-1808","course":"药物分析学","type":"多选","chapter":"第三章 药物的杂质检查","number":"ya-0067","title":"药品杂质限量的基本要求包括( )","options":{"A":"不影响疗效和不发生毒性","B":"保证药品质量","C":"便于生产","D":"便于储存","E":"便于制剂生产"},"answer":"ABCDE","answerText":"","mnemonic":"重要｜药分答案PDF-OCR","addedAt":1781947616078},{"id":"tr-1809","course":"药物分析学","type":"多选","chapter":"第三章 药物的杂质检查","number":"ya-0068","title":"药物的杂质来源有( )","options":{"A":"药品的生产过程中","B":"药品的储藏过程中","C":"药品的使用过程中","D":"药品的运输 过程中","E":"药品的研制过程中"},"answer":"AB","answerText":"","mnemonic":"重要｜药分答案PDF-OCR","addedAt":1781947616078},{"id":"tr-1810","course":"药物分析学","type":"多选","chapter":"第三章 药物的杂质检查","number":"ya-0069","title":"药品的杂质会影响( )","options":{"A":"危害健康","B":"影响药物的疗效","C":"影响药物的生物利用度","D":"影响药物的 稳定性","E":"影响药物的均一性"},"answer":"C","answerText":"","mnemonic":"重要｜药分答案PDF-OCR","addedAt":1781947616078},{"id":"tr-1811","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0070","title":"简述重金属检查法第三法的原理与适用条件","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点:用于难溶于稀酸但能溶于碱性水溶液(磺胺类、巴比妥类)NaOH +水+NaS","mnemonic":"必背｜南昌大学B卷(24-25)｜历年原题","addedAt":1781947616078},{"id":"tr-1812","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0071","title":"药物中杂质的来源有哪些?试举例说明。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"药物中杂质主要有两个来源,一是生产过程中引入杂质,如阿司匹林在生产过程中水杨酸乙酰化不完全,那么水杨酸就是杂质;地塞米松磷酸钠在生产过程中使用大量甲醇和丙酮,残留在成品中,就是杂质。杂质的第二个来源是在贮藏过程中引入杂质,维生素C在贮藏过程中因氧化色变深;青霉素在贮藏过程中遇水分会水解开环而失效。","mnemonic":"重要｜学习与解题指南","addedAt":1781947616078},{"id":"tr-1813","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0072","title":"氯化物杂质检查的原理是什么?有何注意事项?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"原理:利用氯化物在硝酸溶液中与硝酸银试液作用,生成氯化银的白色浑浊液,与一定量标准氯化钠溶液在相同条件下生成的氯化银浑浊液比较,以判断供试品中氯化物是否超过限量。 注意事项:1如供试液浑浊,要过滤;2如供试液有颜色,可采用内消色法或外消色法消除影响。","mnemonic":"重要｜学习与解题指南","addedAt":1781947616078},{"id":"tr-1814","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0073","title":"铁盐检查中除另有规定外,为什么要加过硫酸铵?有的样品采用硝酸处理,用硝酸处理的样品是否还需加过硫酸铵?加硝酸后的样品为什么要加热煮沸?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"过硫酸铵的作用是氧化剂,把二价的铁杂质氧化成三价铁。若药品加硝酸处理,因为硝酸是氧化剂,故不需加过硫酸铵。因硝酸中可能含亚硝酸,它能跟硫氰酸根离子作用,产生红色亚硝酰硫氰化物,影响比色,所以剩余的硝酸必须加热煮沸除去。","mnemonic":"重要｜学习与解题指南","addedAt":1781947616078},{"id":"tr-1815","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0074","title":"古蔡法检砷时,试验中加碘化钾和酸性氯化亚锡试液的作用是什么?醋酸铅棉花的作用是什么?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"碘化钾和酸性氯化亚锡试液的作用:1还原五价的砷为三价的砷;2碘离子可以和锌离子形成稳定的配位化合物,有利于砷化氢气体不断产生;3可抑制锑化氢的产生;4氯化亚锡可与锌作用,生成锌锡齐,使氢气可以连续均匀地放出。醋酸铅棉花的作用是吸收硫化氢气体。","mnemonic":"重要｜学习与解题指南","addedAt":1781947616078},{"id":"tr-1816","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0075","title":"什么叫干燥失重?常用的干燥失重测定方法有哪些?干燥失重和水分有何区别?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"干燥失重是指药品在规定的条件下经干燥后所减失的量,以百分率表示。常用的干燥失重测定方法有四种:1常压恒温干燥法,适用于受热较稳定的药物;2干燥剂干燥法,适用于受热分解或易升华的供试品;3减压干燥法,适用于熔点低或受热分解的供试品;4热分析法。干燥失重的内容物主要指水分,也包括其他挥发性物质,如残留的挥发性有机溶剂。","mnemonic":"重要｜学习与解题指南","addedAt":1781947616078},{"id":"tr-1817","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0076","title":"残留溶剂一般是指什么?《中国药典》一般采用何种方法进行检查?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"残留溶剂指在合成原料药、辅料或制剂生产的过程中使用的,但在工艺中未能完全除去的有机溶剂。 《中国药典》常采用气相色谱法进行检查。常用的方法有两种:1《中国药典》法;2静态顶空进样法(适用于挥发性大的组分分析)。","mnemonic":"重要｜学习与解题指南","addedAt":1781947616078},{"id":"tr-1818","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0077","title":"什么叫热分析法?常用的热分析法有哪些?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"热分析法是指在程序控制温度下测量物质的物理、化学性质与温度关系的一类技术。常用的热分析法有热重分析法、差示热分析法和差示扫描量热分析。","mnemonic":"了解｜学习与解题指南","addedAt":1781947616078},{"id":"tr-1819","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0078","title":"薄层色谱法检查杂质中,什么叫供试品溶液自身稀释对照法?有何特点?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"先配制一定浓度的供试品溶液,然后将供试品溶液按限量要求稀释至一定浓度作为对照溶液。适用于杂质的结构不能确定或无杂质对照品的情况(仅限于二者的颜色相近或相同,且对显色剂的灵敏度相近或相同的情况)。","mnemonic":"重要｜学习与解题指南","addedAt":1781947616078},{"id":"tr-1820","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0079","title":"检查甲苯咪唑中的无效晶型A晶型,《中国药典》采用的是何种方法?如何检查?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"《中国药典》采用红外光谱法进行鉴别。无效A晶型在640cm−1处有强吸收,药物C晶型在此波长处吸收很弱;而在662cm−1处,A晶型的吸收很弱,C晶型却有较强吸收。当供试品含有A晶型时,在上述两波数处的吸光度比值将发生改变。","mnemonic":"了解｜学习与解题指南","addedAt":1781947616078},{"id":"tr-1821","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0080","title":"两性霉素A是两性霉素B发酵过程中的副产物,《中国药典》采用何种方法检查两性霉素A,如何检查?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"《中国药典》采用紫外光谱法进行鉴别。在305nm处两性霉素A的吸收最强,而两性霉素B的吸收很弱,通过测定两性霉素B供试品溶液在305nm处的吸光度来控制两性霉素A的限量。","mnemonic":"了解｜学习与解题指南","addedAt":1781947616078},{"id":"tr-1822","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0081","title":"采用高效液相色谱法检查特殊杂质,《中国药典》收载有哪些方法?各有何特点?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"内标法加校正因子法:用于有杂质对照品时,能够测定杂质的校正因子和杂质的含量。外标法:用于有杂质对照品或杂质对照品易制备的情况。加校正因子的主成分自身对照法:用于有杂质对照品时杂质的含量测定。不加校正因子的主成分自身对照法:用于没有杂质对照品的情况。峰面积归一化法:粗略测量供试品中杂质的含量。前三种方法准确,后两种方法粗略。 #","mnemonic":"重要｜学习与解题指南","addedAt":1781947616078},{"id":"tr-1823","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0082","title":"简述药物中杂质的来源","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点：①生产过程引入——原料不纯、反应不完全、中间体及副产物、精制中未除尽的试剂/溶剂/还原剂残留、金属器皿装置带入的金属杂质；②储藏过程引入——在温度、湿度、日光、空气或微生物作用下发生水解、氧化、分解、脱羧、聚合、潮解、发霉等变化而产生的杂质。","mnemonic":"🆕课堂强调·补充｜〔2026-03-10 15:38 [08:30]〕｜非真题原题·据课堂整理","addedAt":1781947616078},{"id":"tr-1824","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0083","title":"【简答】杂质来源","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"杂质来源(必考):①生产制备引入——原料不纯/反应不完全、中间体副产物(异构体/多晶型)未除尽、试剂溶剂残留、金属器皿引入(铅铁铜锌)②贮藏过程引入——温度/湿度/日光/空气/微生物致水解/氧化/分解/异构化/晶型转变/聚合/潮解/发霉。例:麻醉乙醚贮藏产生醛类及有毒过氧化物(药典规定启封后24小时内用);甲巯咪唑可逆重排产生杂质。\n\n〔老师强调/扣分点〕笔记。两大来源(生产+贮藏)及典型变化必背。乙醚24h、过氧化物是经典例。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 简答/判断(杂质来源—真题考点；信号杂质硫酸盐0615原题判断)〕｜参考答案据课堂/教材整理","addedAt":1781947616078},{"id":"tr-1825","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0084","title":"【简答】砷盐检查-古蔡氏法","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"砷盐检查-古蔡氏法(必考简答):装置=发生瓶(锌粒+盐酸+碘化钾试液+酸性氯化亚锡)→醋酸铅棉花(导管中部,填6-8cm)→溴化汞试纸(顶部)。各试剂作用:①锌粒+盐酸提供新生态氢(Zn+2HCl→ZnCl2+H2↑)②碘化钾+酸性氯化亚锡将As⁵⁺还原为As³⁺③醋酸铅棉花吸收硫化氢消除硫化物干扰(生成PbS)④溴化汞试纸与砷化氢AsH3反应生成黄至棕色砷斑(深浅与砷量成正比)。\n\n〔老师强调/扣分点〕笔记★★★★最经典简答题。扣分点:每个试剂的作用必须答全(还原剂/除硫化氢/生成砷斑)。标准砷溶液1μg/mL 2mL临用新配,需浓盐酸,砷斑立即观察。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 简答(★必考砷盐古蔡氏法装置/反应式—真题简答'砷盐古蔡法反应式+装置图哪里发生'+知到讨论〕｜参考答案据课堂/教材整理","addedAt":1781947616078},{"id":"tr-1826","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0085","title":"【简答】砷盐检查-二乙基二硫代氨基甲酸银法(Ag-DDC法)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"砷盐检查-二乙基二硫代氨基甲酸银法(Ag-DDC法):原理——砷化氢与Ag-DDC在有机碱(三乙胺)存在下生成红色胶态银,目视比色或510nm测吸光度(AsH3+6Ag(DDC)→As(DDC)3+6Ag↓)。线性0.75-7.5μg,Ag-DDC试液两周内稳定,加氯化亚锡+碘化钾消除锑干扰。现代法:氢化物原子吸收(193.7nm,硼氢化钠还原)、ICP-MS(检测限10^-12,痕量重金属)。\n\n〔老师强调/扣分点〕笔记★★★。Ag-DDC法510nm红色胶态银vs古蔡氏法砷斑是对比考点。中药材限量:铅≤5ppm/镉≤0.3/砷≤2/汞≤0.2/铜≤20ppm。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 简答(Ag-DDC法测砷—知到讨论题'微量砷方法'+真题；DDC-Ag三乙胺0615原题)〕｜参考答案据课堂/教材整理","addedAt":1781947616078},{"id":"tr-1827","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0086","title":"【简答】喹啉类抗疟药(奎宁/奎尼丁)分析","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"喹啉类抗疟药(奎宁/奎尼丁)分析:喹啉母核=苯环+吡啶环稠合。成盐目的:增稳定性/专利保护。碱性规律:侧链氮(叔氮)碱性强>杂环氮弱;叔氮>仲氮>伯氮。性质:①旋光性(硫酸奎宁左旋/奎尼丁右旋,手性HPLC控光学异构体)②荧光(平面共轭,稀硫酸中显蓝色荧光,灵敏度比UV高3个数量级)。\n\n〔老师强调/扣分点〕笔记★★★。奎宁左旋vs奎尼丁右旋、稀硫酸蓝色荧光、碱性叔>仲>伯是高频。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 简答(喹啉类奎宁—知到'硫酸奎宁杂质检查'+真题B卷选择3'高氯酸滴定硫酸奎宁1:3'+06〕｜参考答案据课堂/教材整理","addedAt":1781947616078},{"id":"tr-1828","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0087","title":"【简答】重金属检查三/四法选择","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"重金属检查三/四法选择(必考简答,真题):中国药典重金属检查——①第一法(硫代乙酰胺法)适用于水/稀酸或与水互溶有机溶剂、不含强配位基团药物(最常用);②炽灼后硫代乙酰胺法(第二法)适用于难溶于水/稀酸的有机药物及含强配位基团芳环/杂环药物(炽灼500-600℃);③硫化钠法(第三法)适用于溶于碱性水溶液而难溶于稀酸的药物,如磺胺类、巴比妥类;④第四法目的=消除难溶物的干扰。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 简答(B卷)+选择(B卷)+知到讨论题〕｜参考答案据课堂/教材整理","addedAt":1781947616078},{"id":"tr-1829","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0088","title":"杂质有哪些来源和途径?来源；","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"①.从药物生长过程中引入 ②. 由药物储藏过程中引入途径： 在合成药的生产过程中，未反应完全的原料、反应的中间体和副产物，在精致时未能完全出去，就会成为产品中的杂质。药品在储藏过程中，在外界条件的影响下，或因微生物的作用，可能发生水解、氧化、分解、异构化、晶型转变、聚合、潮解和发霉等变化，产生有光的杂质。具有酚羟基、巯基、亚硝基、醛基以及长链共轭多烯等结构的药物，在空气中易被氧化，引起药物变色、失效甚至产生毒性的氧化产物等 。","mnemonic":"重要｜药物分析简答题.docx","addedAt":1781947616078},{"id":"tr-1830","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0089","title":"铁盐检查法中加入硫酸铵的目的是什么？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"加入氧化剂过硫酸铵，一方面可以氧化供试品中Fe² +成 Fe³+ , 同时可防止光线导致的硫氰酸铁还原或分解褪色。","mnemonic":"重要｜药物分析简答题.docx","addedAt":1781947616078},{"id":"tr-1831","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0090","title":"为什么标准铅液、标准铁液、标准砷液都要事先配制成储备液存放，用时稀释？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"铅离子、铁离子和亚砷酸根离子在低浓度、近中性溶液中易水解，故先配成高浓度的酸性储备液，使其稳定。用时稀释即可。","mnemonic":"重要｜药物分析简答题.docx","addedAt":1781947616078},{"id":"tr-1832","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0091","title":"用对照法检查杂质，应注意哪些方面的平行？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"供试液的处理和对照液的处理在所用试剂、反应条件、反应时间、实验顺序登方面要相同，以保证结果的可比性。","mnemonic":"重要｜药物分析简答题.docx","addedAt":1781947616078},{"id":"tr-1833","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0092","title":"重金属检查的常用四种方法反别在什么情况下应用？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"第一法（硫代乙酰胺法）：适用于无需有机破坏，在酸性条件下可溶解的，无色的药物的重金属检查。 第二法（炽灼破坏后检查重金属）：适用于含芳香环、杂环以及不溶于水稀酸及乙醇的有机药物的重金属检查。 第三法（硫化钠法）：适用于溶于碱而不溶于稀酸或在稀酸中生成沉淀的药物。 第四法（微孔滤膜法）：适用于含 2～5 μg 重金属杂质及有色供试液的检查。","mnemonic":"重要｜药物分析简答题.docx","addedAt":1781947616078},{"id":"tr-1834","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0093","title":"制定杂质检查项目和限量的原则是什么？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"凡是影响疗效和对人体健康有害的杂质均应制定相应的检查项目和限量。 原则； ①.质量标准中规定的杂质限量是指正常生产和储藏过程中可能引入的杂质。 ②.制定杂质的检查项目和限量要不断完善和提高 ③.杂志项目和限量的制定要有针对性，能反映生产水平的高低以及生产工艺是否正常 ④.严重危害人体健康和影响药物稳定性的杂质必须制定相应的检查项目，并严格控制其限量 ⑤.药物的杂质检查项目和限量制定与化学制剂的杂质控制项目和限量不同，不能混淆。","mnemonic":"重要｜药物分析简答题.docx","addedAt":1781947616078},{"id":"tr-1835","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0094","title":"比较阿司匹林原料与制剂杂质检查项目的差异，并说明原因。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"阿司匹林原料除要检查的一般杂质外，还要检查溶液澄清度、水杨酸和易碳化物；而阿司匹林制剂只要求检查水杨酸。这是因为制剂应用合格原料生产。影响澄清度和易碳化物等杂质在制剂的正常生产和储存过程中不会引入，故无必要再检查；水杨酸在制剂的正常生产和储藏过程中仍可能引入，故在制剂中仍要求检查。","mnemonic":"重要｜药物分析简答题.docx","addedAt":1781947616078},{"id":"tr-1836","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"ya-0095","title":"中药制剂中杂质检查的目的是什么?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"中药制剂中杂质检查项目水分，灰分，酸不溶性灰分，砷盐，重金属，有毒成分。","mnemonic":"重要｜药分答案PDF-OCR","addedAt":1781947616078},{"id":"tr-1837","course":"药物分析学","type":"计算记忆","chapter":"第三章 药物的杂质检查","number":"ya-0096","title":"司可巴比妥钠重金属检查标准铅溶液取样量计算","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"1. V=L×S/c=20×10^-6×1.0×10^6/10=2.0ml","mnemonic":"必背｜南昌大学B卷(24-25)｜历年原题","addedAt":1781947616078},{"id":"tr-1838","course":"药物分析学","type":"计算记忆","chapter":"第三章 药物的杂质检查","number":"ya-0097","title":"杂质限量计算母题：取供试品量S(g)，用标准杂质溶液体积V(mL)、浓度c(g/mL)作对照，求杂质限量L。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"答题要点（须有过程）：杂质限量 L(%) = (标准溶液中杂质量 / 供试品量) × 100% = (c × V / S) × 100%。说明：限量检查中供试品所显反应（如颜色/浊度）不得深于由一定量标准杂质溶液(c×V)制成的对照液，故供试品中杂质量≤c×V，除以取样量S即为限量。","mnemonic":"🆕课堂强调·补充｜〔2026-03-10 16:28 [02:00]〕｜非真题原题·据课堂整理","addedAt":1781947616078},{"id":"tr-1839","course":"药物分析学","type":"计算记忆","chapter":"第三章 药物的杂质检查","number":"ya-0098","title":"取葡萄糖4.0g, 加水30ml 溶解后，加醋酸盐缓冲溶液.( pH3.5)2.6ml, 依法检查重 金属(中国药典),含重金属不得超过百万分之五，问应取标准铅溶液多少ml? ( 每 1ml 相当于Pb10μ g/ml)(2ml)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"(每 Iml 相当了 解， L=CVWS ， V=LS/C=5X10*X4.0/10X10-s-2ml 1 开 金属(中国药 Pbl0 nu g]ml) 检查某药物中的砷盐，取标准砷溶液 2ml1 (每 Iml 相当于 1 ug 的 As)制备标准砷斑，砷盐的限量","mnemonic":"重要｜药分答案PDF-OCR","addedAt":1781947616078},{"id":"tr-1840","course":"药物分析学","type":"计算记忆","chapter":"第三章 药物的杂质检查","number":"ya-0099","title":"检查某药物中的砷盐，取标准砷溶液2ml ( 每1ml相当于1μg 的As) 制备标准砷斑， 砷盐的限量为0.0001%,应取供试品的量为多少?(2.0g)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"解; S=CVWL=2X1X10-*/0.00001%=2g","mnemonic":"重要｜药分答案PDF-OCR","addedAt":1781947616078},{"id":"tr-1841","course":"药物分析学","type":"计算记忆","chapter":"第三章 药物的杂质检查","number":"ya-0100","title":"依法检查枸橼酸中的砷盐，规定含砷量不得超过1ppm, 问应取检品多少克? (标准 砷溶液每1ml 相当于1μ g砷)(2.0g)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"(标准 相当于1usg 砷) 解; S= CVW/ L=2X1X10- /lppm=2.0g","mnemonic":"重要｜药分答案PDF-OCR","addedAt":1781947616078},{"id":"tr-1842","course":"药物分析学","type":"计算记忆","chapter":"第三章 药物的杂质检查","number":"ya-0101","title":"配制每1ml中10μ gCl的标准溶液500ml,应取纯氯化钠多少克?(已知 Cl:35.45Na; 23)(8.24mg)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"计算题","answerText":"(已知 C1: 35.45 Na: 23) 解: 500X10X :"","C":"","D":"","E":""},"answer":"填空题","answerText":"无","mnemonic":"重要｜药物分析习题集-南京廖华答案网","addedAt":1781947616078},{"id":"tr-1927","course":"药物分析学","type":"填空记忆","chapter":"第二章 药物的鉴别试验","number":"ya-0186","title":"苯乙胺类药物结构中多含有______的结构，显______基性质，可与重金属离子络合呈色；露置空气中或遇光易______，色渐变深，在______性溶液中更易变色。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"酚羟基(邻苯二酚) 酚 氧化 碱","mnemonic":"重要｜药物分析习题集-南京廖华答案网","addedAt":1781947616078},{"id":"tr-1928","course":"药物分析学","type":"多选","chapter":"第二章 药物的鉴别试验","number":"ya-0187","title":"亚硝酸钠法（重氮化反应）的影响因素包括（）","options":{"A":"加溴化钾作催化剂","B":"酸的种类和浓度","C":"反应温度","D":"滴定速度","E":"光照强度"},"answer":"ABCD","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-04-07 14:38 [27:43]〕｜供练习用·期末是否考待定｜非真题原题·据课堂整理","addedAt":1781947616078},{"id":"tr-1929","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"ya-0188","title":"药物鉴别的意义是什么?药品质量标准中常用的鉴别方法有哪些?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"药物的鉴别试验可以用来证实贮藏在有标签容器中的药物是否为其表示的药物,可以判断药物的真伪。药物鉴别的方法有化学鉴别法、光谱鉴别法、X射线粉末衍射法、色谱鉴别法以及生物学法。","mnemonic":"了解｜学习与解题指南","addedAt":1781947616078},{"id":"tr-1930","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"ya-0189","title":"对化学鉴别试验的要求是什么?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"化学鉴别试验必须反应迅速,现象明显,不要求反应一定要进行完全。","mnemonic":"了解｜学习与解题指南","addedAt":1781947616078},{"id":"tr-1931","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"ya-0190","title":"紫外光谱法在药物的鉴别试验中有哪些应用?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"1测定最大吸收波长,或同时测定最小吸收波长;2规定一定浓度的供试液在最大吸收波长处的吸光度;3规定吸收波长和吸收系数法;4规定吸收波长和吸光度比值法;5经化学处理后,测定其反应产物的吸收光谱特征。","mnemonic":"了解｜学习与解题指南","addedAt":1781947616078},{"id":"tr-1932","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"ya-0191","title":"采用红外光谱法鉴别药物时,固体试样的制备需注意什么问题?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"1药品和溴化钾稀释剂及所用器皿均需干燥;2研磨均匀,且需在红外灯下操作;3压片时需抽真空。","mnemonic":"了解｜学习与解题指南","addedAt":1781947616078},{"id":"tr-1933","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"ya-0192","title":"比较紫外光谱法和红外光谱法鉴别药物的优缺点。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"紫外光谱法的优点:不要求是单一组分,有其他成分时也可进行鉴别试验;缺点:吸收光谱简单,曲线形状变化不大,专属性不强。红外光谱法的优点:专属性强,应用广泛,特别适合于用其他方法不易区分的同类药物;缺点:多组分或多晶现象不适用。 #","mnemonic":"了解｜学习与解题指南","addedAt":1781947616078},{"id":"tr-1934","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"ya-0193","title":"简述亚硝酸钠法（重氮化反应滴定法）测定的主要影响因素","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点（四个影响因素）：①加入溴化钾作催化剂——提高NO⁺浓度、加快重氮化反应速度；②酸的种类和浓度——用盐酸，过量约1:2.5~1:6，作用是加快反应速度、使重氮盐稳定、防止生成偶氮氨基化合物（盐酸过量过多会使重氮盐分解）；③反应温度——室温10~30℃，15℃以下结果较准确（温度过高重氮盐易分解）；④滴定速度——先快后慢，终点前充分搅拌。","mnemonic":"🆕课堂强调·补充｜〔2026-04-07 14:38 [27:43]〕｜非真题原题·据课堂整理｜刘超明言必考·三连问","addedAt":1781947616078},{"id":"tr-1935","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"ya-0194","title":"亚硝酸钠法测定的三连问母题：反应原理、影响因素、指示终点的方法有哪些","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点：①反应原理——凡具有芳伯氨基或水解后产生芳伯氨基的药物，在酸性条件下与亚硝酸钠发生重氮化反应生成重氮盐；②影响因素——加溴化钾作催化剂、盐酸的种类与浓度、反应温度（室温/低温）、滴定速度（先快后慢）；③指示终点的方法——永停滴定法（电流变化指示）等共四种方法。","mnemonic":"🆕课堂强调·补充｜〔2026-04-07 14:38 [27:43]〕｜非真题原题·据课堂整理｜刘超明言三连问必考","addedAt":1781947616078},{"id":"tr-1936","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"ya-0195","title":"为什么鉴别题\"对号入座\"不能靠死记？应如何复习？（刘超强调）","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点：①鉴别题常把整本书的药物名称与特征反应\"打乱\"重新组合，用药物名称代替其特征鉴别实验来出题，纯靠死记只能猜（4选项约25%几率命中）；②应从药物的结构和官能团出发，理解每种药物的特征反应及其与结构的关系（如含芳伯氨基→重氮化-偶合；酚羟基/水杨酸→三氯化铁显色；氯化物→硝酸银白色沉淀），做到见结构能推反应、见反应能定药物。","mnemonic":"🆕课堂强调·补充｜〔2026-03-31 16:28 [33:37]〕｜非真题原题·据课堂整理｜刘超核心考法提示","addedAt":1781947616078},{"id":"tr-1937","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"ya-0196","title":"选用适当的化学方法，区别重酒石酸去甲肾上腺素。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"水溶液中显翠绿色，加碳酸氢钠试液，即显蓝色，最后变成红色的是重酒石酸去甲肾上腺素；水溶液中显墨绿色，加 1%氨溶液，即转变成紫红色的是盐酸多巴胺；水溶液中显紫色，加碳酸氢钠试液即生成橙黄色浑浊的是硫酸沙丁胺醇。","mnemonic":"重要｜药物分析简答题.docx","addedAt":1781947616078},{"id":"tr-1938","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"ya-0197","title":"什么叫恒重，什么叫空白试验，什么叫标准品、对照品?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"恒重是供试品连续两次干燥或灼烧后的重量差异在 0. 3mg 以下的重量; 空白试验是不加供试品或以等量溶剂代替供试液的情况下，同法操作所得的结果; 标准品、对照品是用于鉴别、检查、含量测定的物质。","mnemonic":"重要｜药分答案PDF-OCR","addedAt":1781947616078},{"id":"tr-1939","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"ya-0198","title":"请简述银量法用于巴比妥类药物含量测定的原理?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"巴比妥类药物在碱溶液可与银盐生成沉淀。","mnemonic":"重要｜药分答案PDF-OCR","addedAt":1781947616078},{"id":"tr-1940","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"ya-0199","title":"如何鉴别含有芳环取代基的巴比妥药物?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"甲醛-硫酸反应生成玫瑰红色产物。","mnemonic":"重要｜药分答案PDF-OCR","addedAt":1781947616078},{"id":"tr-1941","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"ya-0200","title":"如何鉴别酰肼基?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"还原反应及缩合反应都可用于酰脐基的鉴别。","mnemonic":"重要｜药分答案PDF-OCR","addedAt":1781947616078},{"id":"tr-1942","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"ya-0201","title":"用化学方法区别下列药物：1.盐酸普鲁卡因 2.盐酸丁卡因 3.对乙酰氨基酚 4.肾上腺素。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点:盐酸普鲁卡因具芳伯氨基,可发生重氮化-偶合反应,产生橙黄至猩红色沉淀;盐酸丁卡因具仲胺结构,与亚硝酸反应生成乳白色沉淀;对乙酰氨基酚具酚羟基,与三氯化铁发生显色反应,呈蓝紫色;肾上腺素与三氯化铁显色呈翠绿色,再加氨水变紫色最后变紫红色。","mnemonic":"重要｜药物分析习题集-南京廖华答案网","addedAt":1781947616078},{"id":"tr-1943","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"ya-0202","title":"银盐鉴别反应时，能不能加入过多的Na₂CO₃, 为什么?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点:不能加入过多的Na₂CO₃。银盐鉴别是巴比妥类(丙二酰脲)在碳酸钠溶液中与硝酸银先生成可溶性一银盐(振摇溶解)、继续加过量硝酸银生成难溶性二银盐(白色沉淀不再溶解)。若Na₂CO₃过多(碱性过强),会使Ag⁺生成AgOH/Ag₂O或Ag₂CO₃沉淀,干扰二银盐的生成与终点观察,故碳酸钠用量要适当、不能过多。","mnemonic":"重要｜药分-DY｜[21,24,26,30]","addedAt":1781947616078},{"id":"tr-1944","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"ya-0203","title":"用反应式说明测定对氨基水杨酸钠的反应原理和反应条件","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点:对氨基水杨酸钠含具有芳伯氨基,在盐酸酸性溶液中与亚硝酸钠定量发生重氮化反应,生成重氮盐(亚硝酸钠滴定法/重氮化法)。反应式:Ar-NH₂+NaNO₂+2HCl→Ar-N₂⁺Cl⁻+NaCl+2H₂O。条件:加适量KBr加速反应、加过量盐酸(强酸性使重氮盐稳定并避免副反应)、室温(10~30℃,低温防重氮盐分解)、滴定管插入液面下滴定;永停法(或外指示剂法)指示终点。","mnemonic":"重要｜药分-DY｜[51,52,54,57,61]","addedAt":1781947616078},{"id":"tr-1945","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"ya-0204","title":"试述鉴别水杨酸盐和对氨基水杨酸钠的反应原理，反应条件和反应现象?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点:(1)三氯化铁反应——水杨酸盐具酚羟基,在弱酸性(pH4~6)与FeCl₃生成紫堇(紫)色配位化合物;对氨基水杨酸钠加稀盐酸成酸性后与FeCl₃显紫红色(放置3h不沉淀,与5-氨基水杨酸钠区别)。(2)重氮化-偶合反应——对氨基水杨酸钠具芳伯氨基,在盐酸酸性下与亚硝酸钠重氮化,生成的重氮盐与碱性β-萘酚偶合生成橙红色沉淀;水杨酸盐无芳伯氨基,无此反应,可资区别。","mnemonic":"重要｜药分-DY｜[52,53,57,58,59]","addedAt":1781947616078},{"id":"tr-1946","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"ya-0205","title":"如何用双相滴定法测定苯甲酸钠的含量?说明测定原理和方法?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点:原理——苯甲酸钠水溶液显碱性,可用盐酸滴定;但生成的苯甲酸不溶于水会影响终点观察,故加入与水不相混溶的乙醚,随滴随振摇将生成的苯甲酸萃取入乙醚层,使中和反应定量完成、终点清晰(双相滴定/水-乙醚体系)。方法——取本品约1.5g精密称定,置分液漏斗,加水约25ml、乙醚50ml与甲基橙指示液2滴,用盐酸滴定液(0.5mol/L)随滴随振摇至水层显持续橙红色;分取水层,乙醚层用水洗涤、洗液并入,加乙醚20ml继续滴定至水层持续橙红色即得。每1ml盐酸(0.5mol/L)相当于72.06mg C₇H₅O₂Na。","mnemonic":"重要｜药分-DY｜[31,32,35]","addedAt":1781947616078},{"id":"tr-1947","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"ya-0206","title":"为什么利多卡因盐的水溶液比较稳定，不易水解?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点:利多卡因在酰氨基的邻位存在两个甲基,由于空间位阻影响,酰胺键较难水解,故其盐的水溶液比较稳定、不易水解。","mnemonic":"重要｜药分-DY｜[41,42,61]","addedAt":1781947616078},{"id":"tr-1948","course":"药物分析学","type":"选择","chapter":"第二章 药物的鉴别试验","number":"ya-0207","title":"下列
