pe":"选择","chapter":"6. 萜类与挥发油","number":"","title":"某萜类化合物由3个异戊二烯单位(C15)构成。该化合物属于(  )","answerText":"","options":{"A":"单萜","B":"倍半萜","C":"二萜","D":"二倍半萜"},"answer":"B","mnemonic":"倍半萜=C15(3个异戊二烯单位),如青蒿素、莪术醇;单萜C10、二萜C20、二倍半萜C25。【原卷答案键sId6萜类Q11=B;本库早期解析错配为C,已据答案键订正:原C→正B;据答案反推结构描述入库】","priority":"重要","isRecall":false,"sourceId":6,"addedAt":1780244657269,"suspect":false,"examProb":"常考"},{"id":"tr-1047","course":"天然药物化学","type":"选择","chapter":"6. 萜类与挥发油","number":"","title":"某萜类化合物由4个异戊二烯单位(C20)构成。该化合物属于(  )","answerText":"","options":{"A":"单萜","B":"倍半萜","C":"二萜","D":"二倍半萜"},"answer":"C","mnemonic":"二萜=C20(4个异戊二烯单位),如紫杉醇、穿心莲内酯、银杏内酯、甜菊苷元。【原卷答案键sId6萜类Q12=C;本库早期解析错配为A,已据答案键订正:原A→正C;据答案反推结构描述入库】","priority":"重要","isRecall":false,"sourceId":6,"addedAt":1780244657269,"suspect":false,"examProb":"常考"},{"id":"tr-0790","course":"天然药物化学","type":"选择","chapter":"8. 甾体及其苷类","number":"","title":"某甾体皂苷元由27个碳组成,含A、B、C、D、E、F六个环,E/F环以C22螺缩酮形式相连(螺甾烷);C25甲基为直立a键、β型(25S/L型)。该皂苷元属于(  )","answerText":"","options":{"A":"螺甾烷醇型皂苷元","B":"异螺甾烷醇型皂苷元","C":"呋甾烷醇型皂苷元","D":"四环三萜皂苷元","E":"五环三萜皂苷元"},"answer":"A","mnemonic":"甾体皂苷元C27、A-F六环、E/F螺缩酮(螺甾烷);**C25甲基a键β型=25S=螺甾烷醇型(L/neo)**,**e键a型=25R=异螺甾烷醇型(D/iso,更稳定)**;呋甾烷醇型=F环开裂。【原卷此题选项被OCR完全打乱(含\"您螺甾烷\"乱字)无法核源答案键;据教材螺甾烷醇型定义重构题干+选项入库,答案A为教材标准;tr-0790/0791原为同一题双胞胎,已合并】","priority":"重要","isRecall":false,"sourceId":5,"addedAt":1780244657269,"suspect":false,"examProb":"常考"},{"id":"tr-1198","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"","title":"【母题·每年必考】综合论述黄酮类化合物结构鉴定的主要方法（理化鉴别+显色反应+波谱）","answerText":"答题要点：①理化性质——多为黄色结晶，溶解性与是否成苷/羟基数有关；②显色反应：盐酸-镁粉反应（还原显红~紫红，鉴别黄酮/黄酮醇/二氢黄酮）、四氢硼钠(NaBH4)反应（二氢黄酮专属，显红~紫）、与金属盐络合（AlCl3显黄色并荧光、醋酸镁、ZrOCl2-枸橼酸区别3-OH/5-OH）、氨性氯化锶（邻二酚羟基）、Molish（黄酮苷检糖）；③酸碱：浓硫酸显色、与碱（如NaOH）显黄~橙；④波谱：UV用诊断试剂（甲醇、NaOMe、AlCl3/AlCl3+HCl、NaOAc、NaOAc+H3BO3）位移判断各位置羟基；¹H/¹³C-NMR、MS定结构与糖连接。结论：综合理化+显色+四大谱，对号确定母核类型和取代位置。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-03-31 10:28 [03:18]〕｜非真题原题·据课堂整理｜周志望·每年期末必考·分值最大","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780244657270,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1199","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"","title":"【母题·必考】简述四大波谱（UV、IR、NMR、MS）在天然产物结构鉴定中的作用","answerText":"答题要点：①紫外光谱(UV)——反映共轭体系/发色团，黄酮、蒽醌等用诊断试剂位移判断羟基位置；②红外光谱(IR)——反映官能团（羟基、羰基、芳环等特征吸收）；③核磁共振(NMR)——¹H-NMR给出氢的化学位移/积分/裂分，¹³C-NMR给出碳骨架，2D（COSY、HSQC、HMBC）确定连接；④质谱(MS)——给出分子量（分子离子峰）和碎片，软电离可逐级裂解糖以确定糖连接顺序。本课波谱约占1/3内容，必考。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-03-03 09:38 [02:39]〕｜非真题原题·据课堂整理｜周志望·波谱约占1/3·一定考","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780244657271,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1200","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"","title":"【母题】选择提取溶剂的三个原则是什么？","answerText":"答题要点（三点都要答全，老师强调简答勿只答一点）：①相似相溶——根据被提取成分的极性选择极性相近的溶剂；②溶剂对有效成分溶解度大、对杂质溶解度小（选择性好）；③溶剂安全、价廉易得、操作方便、毒性低、沸点适中易回收，且与药材成分不发生化学反应。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-03-03 11:18 [10:10]〕｜非真题原题·据课堂整理｜汪玢·简答三点须答全","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780244657272,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1201","course":"天然药物化学","type":"名词解释记忆","chapter":"4. 醌类化合物","number":"","title":"羟基蒽醌","answerText":"羟基蒽醌是指蒽醌母核上带有酚羟基的衍生物。含游离酚羟基（尤其α-或β-OH）者在碱性溶液中形成共轭体系而显红~紫红色（Borntrager反应），是蒽醌类的特征鉴别依据。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-03-27 09:38 [37:13]〕｜非真题原题·据课堂整理｜补醌类名解空缺","priority":"重要","isRecall":true,"sourceId":3,"addedAt":1780244657273,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1202","course":"天然药物化学","type":"名词解释记忆","chapter":"4. 醌类化合物","number":"","title":"Borntrager反应（碱液显色反应）","answerText":"Borntrager反应是羟基蒽醌类的特征鉴别反应：含游离酚羟基的蒽醌在碱性（NaOH、氨水）条件下因形成共轭酚氧负离子而显红~紫红色，用于蒽醌类成分定性鉴别。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-03-27 09:38 [37:13]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":3,"addedAt":1780244657274,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1203","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"","title":"【母题】天然药物常用的提取方法有哪些？","answerText":"答题要点：①溶剂提取法（煎煮法、浸渍法、渗漉法、回流提取法、连续回流提取法/索氏提取）——最常用，依相似相溶选溶剂；②水蒸气蒸馏法——适于挥发性、能随水蒸气蒸馏且不被破坏的成分（如挥发油）；③升华法——适于具升华性的成分；④压榨法；⑤超临界流体萃取法（SFE，常用CO2）——绿色高效。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-03-06 09:38 [15:00]〕｜非真题原题·据课堂整理｜汪玢·常用提取方法","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780244657275,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1204","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"","title":"超临界流体萃取法（SFE）","answerText":"超临界流体萃取法是利用处于临界温度（Tc）和临界压力（Pc）以上的流体（常用超临界CO2）作为萃取剂提取天然产物的方法。超临界流体兼具气体的扩散性和液体的溶解能力，通过调节温度/压力改变其溶解性能，具有提取效率高、选择性好、无溶剂残留、适于热敏成分等优点。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-03-06 09:38 [16:00]〕｜非真题原题·据课堂整理｜汪玢明言名词解释会考","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780244657276,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1205","course":"天然药物化学","type":"简答记忆","chapter":"9. 生物碱","number":"","title":"【母题】用生物碱沉淀试剂进行鉴别时，为什么至少要用三种试剂同时检查？操作注意事项？","answerText":"答题要点：①因部分非生物碱成分（如氨基酸、蛋白质、多糖、脂质等）也能与某些沉淀试剂产生沉淀（假阳性），单一试剂阳性不能确证；故鉴定时至少选用三种不同的生物碱沉淀试剂，均呈阳性才可初步判定含生物碱；②注意事项：在酸性（稀酸）水溶液中进行、控制含水量、沉淀试剂应慢慢滴加而非一次倒入，以避免误判。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-04-24 10:28 [05:00]〕｜非真题原题·据课堂整理｜毛水春·至少三种沉淀试剂","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780244657277,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1206","course":"天然药物化学","type":"选择","chapter":"9. 生物碱","number":"","title":"用生物碱沉淀试剂鉴别生物碱时，一般要求（）","answerText":"","options":{"A":"只需一种试剂阳性即可确证","B":"至少用三种沉淀试剂同时检查，避免假阳性","C":"在强碱条件下进行","D":"沉淀试剂一次性大量加入"},"answer":"B","mnemonic":"🆕课堂强调·补充｜〔2026-04-24 10:28 [05:00]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780244657278,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1207","course":"天然药物化学","type":"选择","chapter":"8. 甾体及其苷类","number":"","title":"强心苷中甾体母核 C17 位上的不饱和内酯环（甲型，五元）可发生的显色反应及其试剂是（）","answerText":"","options":{"A":"Legal反应——亚硝酰铁氰化钠（钠盐）","B":"Molisch反应——α-萘酚","C":"三氯化铁反应","D":"茚三酮反应"},"answer":"A","mnemonic":"🆕课堂强调·补充｜〔2026-04-14 09:38 [36:00]〕｜非真题原题·据课堂整理｜毛水春·Legal反应可考选择/解答","priority":"必背","isRecall":false,"sourceId":3,"addedAt":1780244657279,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1208","course":"天然药物化学","type":"名词解释记忆","chapter":"8. 甾体及其苷类","number":"","title":"Legal反应（强心苷的显色反应）","answerText":"Legal反应是强心苷中具α,β-不饱和五元内酯环（甲型强心苷）所含活性次甲基的特征显色反应：在碱性条件下与亚硝酰铁氰化钠（钠盐）作用显红色，用于甲型强心苷的鉴别。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-04-14 09:38 [35:33]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":3,"addedAt":1780244657280,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1209","course":"天然药物化学","type":"简答记忆","chapter":"3. 苯丙素类化合物","number":"","title":"【母题·易混点】香豆素按母核取代情况可分为哪几类？","answerText":"答题要点：课本通常按母核结构分为4类——①简单香豆素；②呋喃香豆素（线型/角型）；③吡喃香豆素；④其他香豆素（如异香豆素、双香豆素等）。注意：本课老师按取代基不同更细分为6类（在课本4类基础上进一步细化），答题时以老师课堂分类为准并能与课本对应。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-03-17 09:38 [05:10]〕｜非真题原题·据课堂整理｜老师分6类/课本4类·易混","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780244657281,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1210","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"","title":"结晶法与重结晶法的操作有何异同？","answerText":"答题要点：两者操作过程基本相同（均为利用溶解度差异，热溶解→冷析晶→过滤）；区别在于——结晶是从不纯的提取物中第一次析出晶体的过程；重结晶（穷尽结晶法）是将已得晶体再次溶解、再次结晶以进一步纯化的过程，差别主要体现在母液和纯度上。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-03-06 09:38 [19:46]〕｜非真题原题·据课堂整理｜考研常考点","priority":"重要","isRecall":true,"sourceId":3,"addedAt":1780244657282,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1211","course":"天然药物化学","type":"简答记忆","chapter":"2. 糖和苷","number":"","title":"【母题】苷类一般对碱稳定，但哪些特殊的苷可在碱性条件下水解？","answerText":"答题要点：苷一般对碱较稳定（多用碱水解区别于酸），但下列特殊苷能在碱性条件下水解——①酯苷（苷键为酯键，易被碱水解）；②酚苷；③烯醇苷；④β-位有吸电子取代基的苷（如β-硝基、β-羰基等使苷键活化者）。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-03-13 09:38 [24:44]〕｜非真题原题·据课堂整理｜汪玢·碱水解特殊苷","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780244657283,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1212","course":"天然药物化学","type":"多选","chapter":"2. 糖和苷","number":"","title":"下列哪些特殊苷可在碱性条件下发生水解（）","answerText":"","options":{"A":"酯苷","B":"酚苷","C":"烯醇苷","D":"β-吸电子取代苷","E":"普通氧苷（醇苷）"},"answer":"ABCD","mnemonic":"🆕课堂强调·补充｜〔2026-03-13 09:38 [24:44]〕｜非真题原题·据课堂整理","priority":"必背","isRecall":false,"sourceId":3,"addedAt":1780244657284,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1213","course":"天然药物化学","type":"判断","chapter":"4. 醌类化合物","number":"","title":"苯醌类化合物因易被氧化，多以氢醌（酚）形式存在，游离苯醌常仅存在于新鲜植物中。（　）","answerText":"","options":{},"answer":"对","mnemonic":"🆕课堂强调·补充｜〔2026-03-17 11:18 [14:31]〕｜非真题原题·据课堂整理｜考过","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780244657285,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1214","course":"天然药物化学","type":"选择","chapter":"4. 醌类化合物","number":"","title":"关于游离苯酚/苯醌在植物中的存在，正确的是（）","answerText":"","options":{"A":"大量稳定存在于干燥药材","B":"因易氧化，主要存在于新鲜植物中","C":"不存在于植物","D":"只存在于动物"},"answer":"B","mnemonic":"🆕课堂强调·补充｜〔2026-03-17 11:18 [14:31]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780244657286,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1215","course":"天然药物化学","type":"选择","chapter":"5. 黄酮类化合物","number":"","title":"盐酸-镁粉反应主要用于鉴别下列哪类黄酮（显红~紫红色）（）","answerText":"","options":{"A":"查耳酮和橙酮","B":"黄酮、黄酮醇、二氢黄酮（醇）","C":"异黄酮","D":"花色素"},"answer":"B","mnemonic":"🆕课堂强调·补充｜〔2026-03-31 10:28 [03:18]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780244657287,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1216","course":"天然药物化学","type":"选择","chapter":"5. 黄酮类化合物","number":"","title":"区别黄酮类化合物3-OH与5-OH常用的显色反应是（）","answerText":"","options":{"A":"盐酸-镁粉反应","B":"二氯氧锆(ZrOCl2)-枸橼酸反应","C":"Molisch反应","D":"茚三酮反应"},"answer":"B","mnemonic":"🆕课堂强调·补充｜〔2026-03-31 10:28 [03:18]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780244657288,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1217","course":"天然药物化学","type":"名词解释记忆","chapter":"5. 黄酮类化合物","number":"","title":"盐酸-镁粉反应","answerText":"盐酸-镁粉反应是黄酮类化合物的特征显色反应：在乙醇溶液中加镁粉和浓盐酸，黄酮、黄酮醇、二氢黄酮（醇）等被还原而显红色至紫红色（花色素本身在酸性即显色，需做空白对照），用于黄酮类的鉴别。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-03-31 10:28 [03:18]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":3,"addedAt":1780244657289,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1218","course":"天然药物化学","type":"填空记忆","chapter":"8. 甾体及其苷类","number":"","title":"强心苷按C17位不饱和内酯环的不同分为甲型（____元不饱和内酯环）和乙型（六元不饱和内酯环）。","answerText":"五（5）","options":{},"answer":"填空题","mnemonic":"🆕课堂强调·补充｜〔2026-04-10 11:18 [10:00]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":3,"addedAt":1780244657290,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1219","course":"天然药物化学","type":"填空记忆","chapter":"8. 甾体及其苷类","number":"","title":"甲型强心苷C17位为五元不饱和内酯环（Δαβ-____内酯）。","answerText":"γ（丁烯）","options":{},"answer":"填空题","mnemonic":"🆕课堂强调·补充｜〔2026-04-10 11:18 [10:30]〕｜非真题原题·据课堂整理","priority":"了解","isRecall":true,"sourceId":3,"addedAt":1780244657291,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1220","course":"天然药物化学","type":"填空记忆","chapter":"8. 甾体及其苷类","number":"","title":"强心苷中能发生Legal反应、Kedde反应等显色反应的结构基础是C17位不饱和内酯环上的______。","answerText":"活性次甲基（活性亚甲基）","options":{},"answer":"填空题","mnemonic":"🆕课堂强调·补充｜〔2026-04-14 09:38 [35:33]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":3,"addedAt":1780244657292,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1221","course":"天然药物化学","type":"判断","chapter":"4. 醌类化合物","number":"","title":"萘醌类化合物在自然界大多以游离态（非苷）形式存在。（　）","answerText":"","options":{},"answer":"对","mnemonic":"🆕课堂强调·补充｜〔2026-03-17 11:18 [26:42]〕｜非真题原题·据课堂整理｜老师明确\"注意判断题\"","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780244657293,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1222","course":"天然药物化学","type":"选择","chapter":"7. 三萜及其苷类","number":"","title":"三萜皂苷的水溶液振摇后能产生持久泡沫，这是因为皂苷具有（）","answerText":"","options":{"A":"还原性","B":"表面活性（亲水亲脂两亲性）","C":"酸性","D":"挥发性"},"answer":"B","mnemonic":"🆕课堂强调·补充｜〔2026-04-14 11:18 [10:00]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780244657294,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1223","course":"天然药物化学","type":"简答记忆","chapter":"7. 三萜及其苷类","number":"","title":"简述皂苷的主要理化性质（发泡性、溶血性、显色反应）","answerText":"答题要点：①发泡性——皂苷有表面活性，水溶液振摇产生持久泡沫；②溶血性——多数皂苷（尤三萜/甾体皂苷）能破坏红细胞膜引起溶血；③显色反应——Liebermann-Burchard反应（醋酐-浓硫酸，三萜显红~紫，甾体显蓝绿）等，用于皂苷类鉴别；④可与胆甾醇形成沉淀。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-04-14 11:18 [10:00]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":3,"addedAt":1780244657295,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1224","course":"天然药物化学","type":"名词解释记忆","chapter":"7. 三萜及其苷类","number":"","title":"Liebermann-Burchard反应","answerText":"Liebermann-Burchard反应（醋酐-浓硫酸反应）是三萜及甾体类化合物的特征显色反应：样品溶于醋酐，沿管壁加入浓硫酸，三萜皂苷显红~紫色、甾体皂苷显蓝~绿色，可用于二者的初步区别与鉴别。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-04-14 11:18 [10:00]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":3,"addedAt":1780244657296,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1225","course":"天然药物化学","type":"选择","chapter":"5. 黄酮类化合物","number":"","title":"用质谱(MS)确定黄酮苷中糖的连接位置/顺序时，常利用（）","answerText":"","options":{"A":"硬电离一次全裂","B":"软电离逐级裂解、依次脱去糖基","C":"紫外位移","D":"旋光变化"},"answer":"B","mnemonic":"🆕课堂强调·补充｜〔2026-03-31 11:18 [40:25]〕｜非真题原题·据课堂整理｜周志望·MS定糖连接","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780244657297,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1226","course":"天然药物化学","type":"选择","chapter":"1. 总论","number":"","title":"答题时看清卷面问的是\"有效成分的提取方法\"还是\"溶剂提取法中的具体方法\"，这是老师强调的（）","answerText":"","options":{"A":"易混淆扣分点","B":"与提取无关","C":"同一概念","D":"仅指蒸馏"},"answer":"A","mnemonic":"🆕课堂强调·补充｜〔2026-03-03 11:18 [18:26]〕｜非真题原题·据课堂整理｜汪玢·审题易混点","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780244657298,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1228","course":"天然药物化学","type":"名词解释记忆","chapter":"2. 糖和苷","number":"","title":"杀酶保苷（灭活）","answerText":"杀酶保苷是指在采集/加工药材时，采用加热（如蒸、煮）、用沸水或醇等方法迅速破坏（灭活）药材中能水解苷的酶，以防止原生苷被酶解为次生苷，从而保留原生苷的处理措施。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-03-27 09:38 [08:12]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":3,"addedAt":1780244657300,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1229","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"","title":"凝胶过滤法（分子筛过滤/Sephadex LH-20）","answerText":"凝胶过滤法是利用凝胶（如葡聚糖凝胶Sephadex及其衍生物LH-20）的分子筛作用，按分子大小不同进行分离的色谱方法：大分子先洗脱、小分子后洗脱。Sephadex LH-20为羟丙基化的葡聚糖凝胶，既可在水中也可在有机溶剂中使用，常用于天然产物（如黄酮、苷类）的分离。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-03-27 09:38 [16:23]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":3,"addedAt":1780244657301,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1230","course":"天然药物化学","type":"填空记忆","chapter":"1. 总论","number":"","title":"测定比旋光度时，记录/报告必须注明测定的______和浓度（及溶剂）。","answerText":"温度","options":{},"answer":"填空题","mnemonic":"🆕课堂强调·补充｜〔2026-04-21 10:28 [29:35]〕｜非真题原题·据课堂整理｜老师强调旋光必写温度浓度","priority":"重要","isRecall":true,"sourceId":3,"addedAt":1780244657302,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1231","course":"天然药物化学","type":"简答记忆","chapter":"3. 苯丙素类化合物","number":"","title":"【母题】香豆素类化合物按结构如何分类？（注意老师讲法与课本的差异）","answerText":"答题要点：香豆素以苯骈α-吡喃酮为母核。课本通常分为4类——①简单香豆素；②呋喃香豆素（线型如补骨脂内酯、角型如白芷内酯）；③吡喃香豆素；④其他香豆素（如双香豆素、异香豆素等）。老师课堂上进一步细分为6类（在课本4类基础上将\"其他类\"再展开）。答题时按老师课堂口径作答，避免只写一两类。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-03-10 10:28 [05:10]〕｜非真题原题·据课堂整理｜情报确认·老师6类/课本4类","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780244657303,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1232","course":"天然药物化学","type":"选择","chapter":"3. 苯丙素类化合物","number":"","title":"香豆素类化合物的基本母核是（）","answerText":"","options":{"A":"苯骈γ-吡喃酮","B":"苯骈α-吡喃酮（顺式邻羟基桂皮酸内酯）","C":"黄酮母核","D":"蒽醌母核"},"answer":"B","mnemonic":"🆕课堂强调·补充｜〔2026-03-10 10:28 [05:10]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780244657304,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1233","course":"天然药物化学","type":"选择","chapter":"3. 苯丙素类化合物","number":"","title":"香豆素类在紫外光下多显（），且其内酯环在稀碱中可开环、加酸又可环合，此性质常用于鉴别与提取。","answerText":"","options":{"A":"无荧光","B":"蓝色或紫色荧光","C":"红色荧光","D":"黑色"},"answer":"B","mnemonic":"🆕课堂强调·补充｜〔2026-03-13 10:28 [10:00]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780244657305,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1234","course":"天然药物化学","type":"名词解释记忆","chapter":"3. 苯丙素类化合物","number":"","title":"香豆素的内酯环碱水解（开环-闭环）性质","answerText":"香豆素具有内酯结构，在稀碱液中内酯环可水解开环生成顺式邻羟基桂皮酸盐（溶于水）；加酸酸化后又可环合恢复为内酯（香豆素）。利用此可逆的开环-闭环性质可对香豆素进行提取、纯化与鉴别（注意长时间强碱加热可发生顺反异构，反式不能再环合）。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-03-13 10:28 [10:00]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":3,"addedAt":1780244657306,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1235","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"","title":"【母题】羟基蒽醌类化合物酸性强弱的排序规律是什么？（pH梯度萃取依据）","answerText":"答题要点：羟基蒽醌酸性强弱取决于羟基位置与数目。一般规律：含—COOH > 含两个以上β-OH（2位等）> 一个β-OH > 两个α-OH > 一个α-OH。即β-羟基酸性强于α-羟基（α-OH与相邻羰基形成分子内氢键，酸性减弱）。据此可用pH梯度萃取法（不同浓度碱液：5%NaHCO₃→5%Na₂CO₃→1%NaOH→5%NaOH）依次分离酸性不同的羟基蒽醌。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-03-17 10:28 [10:00]〕｜非真题原题·据课堂整理｜醌类重点·pH梯度萃取","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780244657307,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1236","course":"天然药物化学","type":"选择","chapter":"4. 醌类化合物","number":"","title":"下列羟基蒽醌中，酸性最强的是（）","answerText":"","options":{"A":"1-羟基蒽醌（α-OH）","B":"2-羟基蒽醌（β-OH）","C":"1,8-二羟基蒽醌（两个α-OH）","D":"含—COOH的羟基蒽醌"},"answer":"D","mnemonic":"🆕课堂强调·补充｜〔2026-03-17 10:28 [10:00]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780244657308,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1237","course":"天然药物化学","type":"填空记忆","chapter":"4. 醌类化合物","number":"","title":"pH梯度萃取分离羟基蒽醌时，使用的碱由弱到强依次为5%NaHCO₃、5%Na₂CO₃、1%NaOH、______。","answerText":"5%NaOH","options":{},"answer":"填空题","mnemonic":"🆕课堂强调·补充｜〔2026-03-17 10:28 [10:30]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":3,"addedAt":1780244657309,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tr-1238","course":"天然药物化学","type":"简答记忆","chapter":"9. 生物碱","number":"","title":"【母题】影响生物碱碱性强弱的主要结构因素有哪些？","answerText":"答题要点：生物碱碱性强弱主要取决于氮原子的电子云密度及其杂化状态：①氮杂化方式——sp³>sp²>sp（杂化中s成分越多碱性越弱），季铵碱碱性最强；②诱导效应——给电子基增强碱性、吸电子基（如邻位羟基、羰基）减弱碱性；③共轭效应——氮孤对电子参与共轭（如酰胺、芳胺）碱性显著减弱；④空间效应与分子内氢键——质子化后能形成分子内氢键者碱性增强。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-04-24 10:28 [05:00]〕｜非真题原题·据课堂整理｜毛水春·生物碱碱性","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780244657310,"suspect":false,"isPatch":true,"examProb":"必考"},{"id":"tre-001","course":"天然药物化学实验","type":"简答记忆","chapter":"实验一·虎杖中蒽醌类成分","number":"目的","title":"虎杖中蒽醌类成分实验的目的与要求","answerText":"1、掌握PH梯度法自乙醚提取液中分离游离蒽醌成分。 2、熟悉虎杖中主要成分和性质。 3、熟悉蒽醌类成分的鉴定。","options":{},"answer":"简答题","mnemonic":"必背｜实验指导·目的","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176200,"examProb":"必考"},{"id":"tre-002","course":"天然药物化学实验","type":"简答记忆","chapter":"实验一·虎杖中蒽醌类成分","number":"原理","title":"虎杖中蒽醌类成分实验的原理(提取/分离依据)","answerText":"羟基蒽醌类化合物及二苯乙烯类成分,可溶于乙醇中,因此可用乙醇将它们提取出来 。羟基蒽醌类化合物易溶于乙醚等弱极性溶剂,白藜芦醇苷在乙醚中溶解度很小,利用 它们对乙醚的溶解性差异使羟基蒽醌类与白藜芦醇苷分离,再利用各羟基蒽醌类结构上 的不同所表现酸性不同,用PH梯度萃取法分离它们。","options":{},"answer":"简答题","mnemonic":"必背｜实验指导·原理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176201,"examProb":"必考"},{"id":"tre-003","course":"天然药物化学实验","type":"简答记忆","chapter":"实验一·虎杖中蒽醌类成分","number":"思考1","title":"归纳本实验提取、分离、鉴定的原理。","answerText":"【提取】虎杖根茎用乙醇回流提取,得羟基蒽醌类与二苯乙烯类(白藜芦醇苷)成分。【分离】(1)利用对乙醚溶解性差异:游离羟基蒽醌易溶乙醚、白藜芦醇苷难溶,使两类分开;(2)对乙醚液用pH梯度法(碱性递增)分离游离蒽醌:5%NaHCO3先萃出酸性最强的大黄酸(含-COOH),再用5%Na2CO3萃取中等酸性的大黄素(含β-酚OH),最后用1%NaOH萃取酸性最弱的大黄酚、大黄素甲醚(仅α-酚OH)。酸性强弱:含-COOH > 含β-OH(2个) > 含β-OH(1个) > 仅含α-OH,体现羟基蒽醌酸性随酚羟基数目/位置变化的规律。【鉴定】Bornträger反应(碱液显红色)、醋酸镁反应、TLC对照、熔点测定。","options":{},"answer":"简答题","mnemonic":"必背｜实验指导·复习思考题","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176202,"examProb":"必考"},{"id":"tre-004","course":"天然药物化学实验","type":"简答记忆","chapter":"实验二·槐花米中芦丁","number":"目的","title":"槐花米中芦丁实验的目的与要求","answerText":"1、掌握酸碱法提取黄酮苷的原理和方法。 2、熟悉化学鉴别试验、苷水解、衍生物制备、熔点和薄层层析等手段在苷类结构鉴定中 的应用。 3、通过UV、IR、HNMR和MS图谱解析,了解光谱方法在黄酮类化合物结构鉴定中的应 用。","options":{},"answer":"简答题","mnemonic":"必背｜实验指导·目的","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176203,"examProb":"必考"},{"id":"tre-005","course":"天然药物化学实验","type":"简答记忆","chapter":"实验二·槐花米中芦丁","number":"原理","title":"槐花米中芦丁实验的原理(提取/分离依据)","answerText":"芸香苷分子中有酚羟基,显弱酸性,在碱水中成盐增大溶解能力,用碱水为溶剂煮沸 提取,提取液加酸酸化后又成为游离芸香苷析出,再利用芸香苷对冷、热水溶解度的差 异较大的特性进行精制。 黄酮苷可通过酸水解得到苷元和糖,并可通过薄层色谱法进行检识。 利用黄酮化合物对紫外光有特定吸收的特性进行结构测定;也可制备乙酰化物进行结 构测定。","options":{},"answer":"简答题","mnemonic":"必背｜实验指导·原理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176204,"examProb":"必考"},{"id":"tre-006","course":"天然药物化学实验","type":"简答记忆","chapter":"实验二·槐花米中芦丁","number":"思考1","title":"黄酮类化合物的结构研究的一般程序是什么?","answerText":"(1)提取分离得单体;(2)测理化常数(熔点、旋光、溶解度);(3)显色反应初判类型(盐酸-镁粉、锆盐、AlCl3等);(4)UV加诊断试剂(NaOMe/NaOAc/AlCl3/H3BO3)推断羟基位置;(5)1H-NMR、13C-NMR确定母核与取代;(6)MS定分子量;(7)酸水解鉴定糖与苷元、确定糖连接位置;(8)综合解析确定结构。","options":{},"answer":"简答题","mnemonic":"必背｜实验指导·复习思考题","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176205,"examProb":"必考"},{"id":"tre-007","course":"天然药物化学实验","type":"简答记忆","chapter":"实验二·槐花米中芦丁","number":"思考2","title":"检识黄酮类化合物的常用化学方法有哪些?","answerText":"(1)盐酸-镁粉反应(黄酮/黄酮醇显橙红~紫红,查耳酮、异黄酮多阴性);(2)盐酸-锌粉反应;(3)四氢硼钠(NaBH4)反应(二氢黄酮专属,显红~紫);(4)锆-枸橼酸反应(区别3-OH与5-OH黄酮);(5)三氯化铝反应(黄色荧光);(6)氨性氯化锶(检邻二酚羟基);(7)醋酸镁反应;(8)Molisch反应(检糖,即黄酮苷)。","options":{},"answer":"简答题","mnemonic":"必背｜实验指导·复习思考题","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176206,"examProb":"必考"},{"id":"tre-008","course":"天然药物化学实验","type":"简答记忆","chapter":"实验三·汉防己生物碱","number":"目的","title":"汉防己生物碱实验的目的与要求","answerText":"1、掌握总生物碱的提取及脂溶性生物碱和水溶性生物碱、酚性叔胺碱及非酚性叔胺 碱、水溶性生物碱与水溶性杂质的分离、纯化原理和方法。 2、学习用吸附柱色谱分离生物碱,掌握一般柱色谱的操作方法。 3、熟悉生物碱的常用鉴定方法。 4、了解生物碱衍生物的制备方法。","options":{},"answer":"简答题","mnemonic":"必背｜实验指导·目的","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176207,"examProb":"必考"},{"id":"tre-009","course":"天然药物化学实验","type":"简答记忆","chapter":"实验三·汉防己生物碱","number":"原理","title":"汉防己生物碱实验的原理(提取/分离依据)","answerText":"根据大多数生物碱或生物碱盐均能溶于乙醇的通性,用乙醇回流提取法提取总碱;利用 季铵型生物碱易溶于水,不溶于亲脂性有机溶剂的性质,用溶剂萃取法分离脂溶性生物 碱和水溶性生物碱;利用汉防己甲素和汉防己乙素结构上的差异,用吸附柱色谱分离二 者,或利用汉防己甲素的极性小于汉防己乙素,在冷苯中溶解度比汉防己乙素大而加以 分离;利用季铵型生物碱可与雷氏铵盐产生沉淀的性质,使季铵型生物碱与其它水溶性 成分分离。","options":{},"answer":"简答题","mnemonic":"必背｜实验指导·原理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176208,"examProb":"必考"},{"id":"tre-010","course":"天然药物化学实验","type":"简答记忆","chapter":"实验三·汉防己生物碱","number":"思考1","title":"汉防己甲素、汉防己乙素在结构与性质上有何异同点?实验过程中,我们应怎样利用 它们的共性和个性?怎样分离?请设计方案。","answerText":"【同】均为双苄基异喹啉类生物碱,基本骨架相同,为脂溶性叔胺碱,溶于氯仿等亲脂溶剂,生理活性相似(降压、肌松)。【异】甲素(粉防己碱)甲氧基化程度高(全甲基化),乙素(防己诺林碱)含一个酚羟基(少一甲基),故乙素极性略大。【利用与分离】共性:均溶于乙醇→乙醇回流提总碱,溶于氯仿→萃取。个性:乙素含酚OH可溶于稀NaOH而甲素不溶→用NaOH碱液萃取分离二者;或利用极性差异以硅胶吸附柱色谱分离。","options":{},"answer":"简答题","mnemonic":"必背｜实验指导·复习思考题","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176209,"examProb":"必考"},{"id":"tre-011","course":"天然药物化学实验","type":"简答记忆","chapter":"实验三·汉防己生物碱","number":"思考2","title":"雷氏铵盐法分离纯化季铵碱有何优缺点?解释雷氏铵盐法分离水溶性生物碱的原理。","answerText":"【原理】雷氏铵盐(硫氰酸铬铵)与季铵型生物碱定量生成难溶性复盐而沉淀,从而与脂溶性叔胺碱及水溶性杂质分离。【优点】选择性较好,能使季铵碱与叔胺碱分开,操作较简便。【缺点】复盐不稳定、遇热/光易分解,需低温避光新鲜配制;后处理(丙酮溶解、银盐或离子交换复分解)繁琐、损失较大;雷氏盐本身有色干扰检测。","options":{},"answer":"简答题","mnemonic":"必背｜实验指导·复习思考题","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176210,"examProb":"必考"},{"id":"tre-012","course":"天然药物化学实验","type":"简答记忆","chapter":"实验三·汉防己生物碱","number":"思考3","title":"萃取过程中怎样防止和消除乳化?","answerText":"【防止】(1)避免剧烈振摇,轻缓旋转混合;(2)避免强碱性或含蛋白胶质条件下萃取;(3)控制两相比例。【消除】(1)静置较长时间分层;(2)加电解质(NaCl)盐析破乳;(3)滴加数滴乙醇/戊醇改变界面张力;(4)适当加热;(5)离心;(6)过滤除去固体悬浮物;(7)调节pH。","options":{},"answer":"简答题","mnemonic":"必背｜实验指导·复习思考题","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176211,"examProb":"必考"},{"id":"tre-013","course":"天然药物化学实验","type":"简答记忆","chapter":"实验一·虎杖中蒽醌类成分","number":"pH梯度法","title":"虎杖实验中pH梯度萃取分离游离蒽醌的试剂顺序及对应成分","answerText":"按碱性递增依次萃取:5%碳酸氢钠(NaHCO3)→萃取酸性最强的大黄酸(含-COOH);5%碳酸钠(Na2CO3)→萃取中等酸性的大黄素(含β-酚OH);1%氢氧化钠(NaOH)→萃取酸性最弱的大黄酚、大黄素甲醚(仅α-酚OH)。原理:羟基蒽醌酸性强弱取决于酚羟基的数目和位置(含-COOH>含β-OH>仅含α-OH)。","options":{},"answer":"简答题","mnemonic":"必背｜实验指导·方法要点","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176212,"examProb":"必考"},{"id":"tre-014","course":"天然药物化学实验","type":"简答记忆","chapter":"实验一·虎杖中蒽醌类成分","number":"羟基蒽醌鉴定","title":"羟基蒽醌类成分的鉴定(显色)反应","answerText":"(1)Bornträger反应:与碱液(NaOH/氨水)反应显红~紫红色(羟基蒽醌的特征反应);(2)醋酸镁反应:与0.5%醋酸镁甲醇液生成橙红~紫红色络合物(可区别羟基位置);(3)与金属离子(Pb2+等)络合显色;(4)薄层色谱(TLC)对照、可见光/UV下显色。","options":{},"answer":"简答题","mnemonic":"重要｜实验指导·鉴定","priority":"重要","isRecall":true,"sourceId":1,"addedAt":1780168176213,"examProb":"必考"},{"id":"tre-015","course":"天然药物化学实验","type":"简答记忆","chapter":"实验二·槐花米中芦丁","number":"酸碱法步骤","title":"槐花米中芦丁(芸香苷)酸碱法提取的关键步骤与原理","answerText":"原理:芸香苷含酚羟基显弱酸性,在碱水中成盐溶解度增大;酸化后又游离析出;再利用其冷热水溶解度差异精制。步骤:(1)槐花米加石灰乳(或硼砂)碱水煮沸提取(硼砂保护邻二酚羟基防氧化);(2)趁热过滤;(3)滤液用盐酸调pH3~4酸化,放冷使芦丁析出;(4)粗品用热水重结晶精制。","options":{},"answer":"简答题","mnemonic":"必背｜实验指导·方法要点","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176214,"examProb":"必考"},{"id":"tre-016","course":"天然药物化学实验","type":"简答记忆","chapter":"实验二·槐花米中芦丁","number":"芦丁鉴定","title":"芦丁(黄酮苷)的化学鉴别反应","answerText":"(1)盐酸-镁粉反应:显橙红~红色(黄酮醇苷阳性);(2)三氯化铝反应:显黄色并有荧光;(3)Molisch反应:检识所含糖(证明为苷);(4)锆-枸橼酸反应;(5)酸水解后检识苷元(槲皮素)与糖(葡萄糖、鼠李糖)。","options":{},"answer":"简答题","mnemonic":"重要｜实验指导·鉴定","priority":"重要","isRecall":true,"sourceId":1,"addedAt":1780168176215,"examProb":"常考"},{"id":"tre-017","course":"天然药物化学实验","type":"简答记忆","chapter":"实验三·汉防己生物碱","number":"总碱提取分离流程","title":"汉防己总生物碱的提取及各类生物碱的分离流程","answerText":"(1)提取:药材用乙醇回流提取总碱(生物碱及其盐均溶于乙醇);(2)分离脂溶性与水溶性碱:总碱溶液酸化后用亲脂性溶剂萃取——脂溶性叔胺碱入有机相,季铵型水溶性碱留水相;(3)分离酚性与非酚性叔胺碱:利用乙素含酚OH可溶于NaOH,用碱液萃取使甲素(非酚)与乙素(酚性)分开;(4)水溶性季铵碱:用雷氏铵盐沉淀法纯化;(5)甲、乙素可进一步用吸附柱色谱分离。","options":{},"answer":"简答题","mnemonic":"必背｜实验指导·方法要点","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176216,"examProb":"必考"},{"id":"tre-018","course":"天然药物化学实验","type":"简答记忆","chapter":"实验三·汉防己生物碱","number":"生物碱鉴定","title":"生物碱的常用沉淀鉴别反应","answerText":"生物碱沉淀试剂:(1)碘化铋钾(Dragendorff)→橙红色沉淀;(2)碘化汞钾(Mayer)→白色/淡黄色沉淀;(3)碘-碘化钾(Wagner)→棕色沉淀;(4)硅钨酸→淡黄色沉淀;(5)苦味酸(苦酮酸)沉淀。注意需在酸性水溶液中进行;季铵碱另可用雷氏铵盐生成红色复盐鉴别。","options":{},"answer":"简答题","mnemonic":"重要｜实验指导·鉴定","priority":"重要","isRecall":true,"sourceId":1,"addedAt":1780168176217,"examProb":"常考"},{"id":"tr-1239","course":"天然药物化学","type":"名词解释记忆","chapter":"速通补充","number":"","title":"【名词解释】强心苷、甾体皂苷的概念","answerText":"掌握强心苷、甾体皂苷的概念(定义)——可能考名词解释。\n\n〔老师强调/扣分点〕老师:『需要掌握强心苷、甾体皂苷的概念，有可能会考这个概念题』。笔记列为高频名词解释。","options":{},"answer":"名词解释","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 名词解释(强心苷/甾体皂苷概念—真题名解'强心苷'(2020/2016多年)+知到判断'甾体〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125124},{"id":"tr-1240","course":"天然药物化学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】典型化合物的结构、俗名及结构类型","answerText":"掌握典型化合物的结构、俗名及结构类型：通常给结构写俗名(不默写完整结构)；结构类型要求写到二级结构(甾体母核=一级结构，其下分的类型=二级结构)。\n\n〔老师强调/扣分点〕老师:『结构可分一级、二级结构…甾体倒转就是一级结构，X下分的结构类型叫二级结构』。考核形式=给结构写俗名+写结构类型。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 简答/结构题(典型化合物俗名+结构类型到二级—真题简答'写名称结构类型活性'(认结构题每年必考))〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125125},{"id":"tr-1241","course":"天然药物化学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】强心苷、甾体皂苷的理化性质和鉴别反应","answerText":"掌握强心苷、甾体皂苷的理化性质和鉴别反应——特征性鉴别反应为必考内容(本章核心实验考点，后续详讲)。\n\n〔老师强调/扣分点〕笔记『考试重点』:鉴别反应为必考，需掌握反应原理和现象。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(强心苷甾体皂苷理化性质鉴别反应—真题+知到'甲型强心苷苷元结构特点')〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125126},{"id":"tr-1242","course":"天然药物化学","type":"名词解释记忆","chapter":"速通补充","number":"","title":"【名词解释】强心苷、甾体皂苷的光谱学特征及提取分离","answerText":"熟悉强心苷、甾体皂苷的光谱学特征及提取分离，重点掌握原生苷(一级苷)与次生苷(二级苷)的区别。\n\n〔老师强调/扣分点〕老师强调:『主要是掌握这些原生苷跟次生苷的基因[区别]』；笔记列为熟悉级。","options":{},"answer":"名词解释","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 简答/填空(原生苷vs次生苷区别—真题名解'次生苷'+填空+知到'提取原生苷方法')〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125127},{"id":"tr-1243","course":"天然药物化学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】强酸水解","answerText":"强酸水解:酸浓度3~5%,延长水解时间并加压;能水解2-OH糖、定量得葡萄糖,但引起苷元脱水(得不到原苷元)。如羟基毛地黄毒苷强酸水解得三脱水产物而非原苷元。\n\n〔老师强调/扣分点〕强酸水解副作用=苷元脱水。结构中C3连糖、C14-OH、C16-OH易脱水。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 简答(强酸水解苷元脱水—真题'裂解苷键方法'+强心苷脱水苷)〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125128},{"id":"tr-1244","course":"天然药物化学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】盐酸丙酮法(Mannich水解)","answerText":"盐酸丙酮法(Mannich水解):HCl+丙酮溶液,室温长时间反应;要求糖分子有C2-OH和C3-OH;邻二-OH与丙酮生成丙酮化物再水解;可得原苷元和糖的衍生物(苷元不受影响)。\n\n〔老师强调/扣分点〕优点=既能水解又保护苷元不脱水。前提:二位、三位必须有羟基取代。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 简答(盐酸丙酮法Mannich水解条件—真题'裂解苷键方法'简答之一)〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125129},{"id":"tr-1245","course":"天然药物化学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】K-K反应(鉴别2-去氧糖)的局限性","answerText":"K-K反应(鉴别2-去氧糖)的局限性:①只有游离2-去氧糖才能显色;②若2-去氧糖与其他糖形成二糖/三糖(结合紧密)则无法显色。\n\n〔老师强调/扣分点〕老师:『只有这个游离的二[去]氧[糖]…才能显示…如果形成二糖三糖…在这个条件下它是不显示的』。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 简答(K-K反应局限性—真题强心苷鉴别延伸)〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125130},{"id":"tr-1246","course":"天然药物化学","type":"名词解释记忆","chapter":"速通补充","number":"","title":"【名词解释】生物碱准确定义","answerText":"生物碱准确定义(1983年法国药物学家派勒蒂埃):指含负氧化态氮原子、存在于生物有机体内的环状化合物。三要点:①含负氧化态氮②生物体内③环状。\n\n〔老师强调/扣分点〕负氧化态氮包括胺(-3)、酰胺(-3)、季铵(-3)、氮氧化物(-1);不包括硝基(+3)、亚硝基(+1)。如小檗碱是生物碱,马兜铃酸(含硝基+3)不是。","options":{},"answer":"名词解释","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 名词解释(★生物碱准确定义派勒蒂埃—真题名解'生物碱'(1818Meissner/1983)〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125131},{"id":"tr-1247","course":"天然药物化学","type":"名词解释记忆","chapter":"速通补充","number":"","title":"【名词解释】植物一次代谢(初生代谢)","answerText":"植物一次代谢(初生代谢):维持植物生命活动的代谢过程(如葡萄糖等初生代谢产物)。二次代谢:产生次生代谢产物(多为天然药物有效成分)的过程。\n\n〔老师强调/扣分点〕老师:『要知道什么是植物的一次代谢』(名词解释)。","options":{},"answer":"名词解释","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 名词解释/简答(一次代谢vs二次代谢产物—真题名解+问答'一次/二次代谢产物'+知到多选'一〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125132},{"id":"tr-1248","course":"天然药物化学","type":"名词解释记忆","chapter":"速通补充","number":"","title":"【名词解释】差向异构体","answerText":"差向异构体(anomers):单糖成环后形成一个新的不对称碳原子称端基碳(anomeric carbon),生成一对a、β两种构型的差向异构体。因C=O为平面结构,羟基可从平面两边进攻C=O,得到a/β两种异构体。\n\n〔老师强调/扣分点〕老师:『注意这两个名词解释,通过考题要考得出来』。Haworth式判断:五碳吡喃糖C4-OH与端基碳羟基同侧为α、异侧为β。","options":{},"answer":"名词解释","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 名词解释(差向异构体/端基碳anomers—知到判断'五元结构糖叫呋喃糖'+真题名解)〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125133},{"id":"tr-1249","course":"天然药物化学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】过碘酸氧化(高碘酸)","answerText":"过碘酸氧化(高碘酸):裂解邻二醇结构。可推测糖苷键连接位置:1,3连接的糖苷键不与过碘酸反应(无邻二醇),1,4连接可反应——用于确定糖与糖连接位置。\n\n〔老师强调/扣分点〕老师强调用于结构测定(糖连接位置)。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(过碘酸氧化邻二醇推苷键位置—知到'全甲基化甲醇解判断糖连接位置'+'1,3连接不〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125134},{"id":"tr-1250","course":"天然药物化学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】苷键裂解的5种方法","answerText":"苷键裂解的5种方法:①酸催化水解(重点)②乙酰解③碱催化水解和β消除④酶催化水解(重点)⑤氧化开裂法/Smith降解法(重点)。苷键=缩醛键,对碱和氧化剂较稳定,易被稀酸水解。\n\n〔老师强调/扣分点〕老师:『三个重点:酸水解、酶水解、Smith降解,都必须掌握』。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(★苷键裂解5法:酸/乙酰解/碱/酶/氧化开裂—知到'水解得真正苷元:氧化开裂法/〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125135},{"id":"tr-1251","course":"天然药物化学","type":"论述记忆","chapter":"速通补充","number":"","title":"【论述】酸水解难易规律","answerText":"酸水解难易规律:①苷原子电子密度升高、质子化能力增强则易水解,顺序 N-苷>O-苷>S-苷>C-苷(C-苷最难水解,与碱度顺序一致)②呋喃糖苷比吡喃糖苷易水解(五元环平面性使取代基重叠、水解中间体张力小)③酮糖比醛糖易水解。\n\n〔老师强调/扣分点〕高频为什么类:为什么C-苷最难水解(苷原子电子密度低、难质子化);为什么呋喃糖苷易水解(环张力)。","options":{},"answer":"论述题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择(★酸水解难易N>O>S>C苷—知到'苷键酸水解错误论述'(多题:呋喃>吡喃,去氧>羟基〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125136},{"id":"tr-1252","course":"天然药物化学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】苷键构型确定(重点)","answerText":"苷键构型确定(重点):①酶水解法——麦芽糖酶水解α-苷键、苦杏仁酶水解β-苷键②1H-NMR——端基质子信号δ5.0ppm,据偶合常数J值判断α/β(六碳吡喃糖需用碳谱)③13C-NMR——端基碳化学位移α-甲苷97~101ppm、β-甲苷103~106ppm,α/β相差约4ppm。\n\n〔老师强调/扣分点〕笔记★★★(β构型化学位移值更大,大4ppm)。老师:『一定会考一道这种题,至少10分』。易混:相差4ppm的方向。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(★苷键构型确定:麦芽糖酶α/苦杏仁酶β+1H-NMR端基氢J值—知到多选'确定苷〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125137},{"id":"tr-1253","course":"天然药物化学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】糖苷分离8法","answerText":"糖苷分离8法:活性炭柱色谱(分离水溶性物质如氨基酸/糖/苷,上样量大、来源廉、缺点:无理想吸附力分级方法)、纤维素色谱、离子交换柱色谱、凝胶柱色谱、季铵氢氧化物沉淀法、分级沉淀/溶解法、蛋白质除去法、铅盐沉淀法。\n\n〔老师强调/扣分点〕笔记活性炭吸附★★★★(非极性、LH-20适用)。老师重点讲活性炭分离糖/苷。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(糖苷分离8法:活性炭/凝胶/离子交换—知到多选'糖和苷分离方法:活性炭/凝胶/离〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125138},{"id":"tr-1254","course":"天然药物化学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】香豆素显色反应","answerText":"香豆素显色反应:①异羟肟酸铁反应(内酯/酯键,呈红色)②Gibbs反应(2,6-二氯(溴)苯醌氯亚胺,酚羟基对位无取代呈阳性蓝色)③Emerson反应(氨基安替匹林+铁氰化钾,酚羟基且对位无取代呈红色)。游离香豆素能升华、随水蒸气蒸出;成苷后无香味、不升华、不挥发。\n\n〔老师强调/扣分点〕老师:『Gibbs和Emerson是重点,条件:有游离酚羟基且对位无取代呈阳性』。扣分点:必须强调'对位无取代'。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(★香豆素显色:异羟肟酸铁/Gibbs/Emerson—知到'鉴别香豆素首选异羟肟〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125139},{"id":"tr-1255","course":"天然药物化学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】强心苷分类","answerText":"强心苷分类(据苷元C17侧链内酯环大小,高频考点):①甲型强心苷——C17侧链为五元不饱和内酯环(Δαβ-γ-内酯,即强心烯内酯,如洋地黄毒苷)②乙型强心苷——C17侧链为六元不饱和内酯环(Δαβ,γδ-δ-内酯,即蟾蜍二烯内酯)。\n\n〔老师强调/扣分点〕笔记★★★★甲型(五元)vs乙型(六元)区分是高频考点。命名:希腊字母标双键位置。老师:『每周考题会涉及』。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(★强心苷甲/乙型分类C17内酯环五元/六元—真题简答'甲型C17五元不饱和内酯/〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125140},{"id":"tr-1256","course":"天然药物化学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】强心苷提取分离","answerText":"强心苷提取分离:提取注意共存物质(糖类、皂苷、色素、鞣质)干扰。分离方法:①两相溶剂萃取法(据分配系数不同)②逆流分配法③色谱分离(硅胶吸附层析分离亲脂性单糖苷/次级苷/苷元、C18反相分配层析对亲水性成分)。可两糖苷与四糖苷分离。\n\n〔老师强调/扣分点〕老师:『重点掌握两糖苷与四糖苷的区别分离』。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(强心苷提取分离两相溶剂萃取—知到'提取狄戈辛次生苷不宜方法'+真题)〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125141},{"id":"tr-1257","course":"天然药物化学","type":"论述记忆","chapter":"速通补充","number":"","title":"【论述】甾体皂苷分类","answerText":"甾体皂苷分类(依螺甾烷C25构型和F环环合状态分四类):①螺甾烷醇类(spirostanols,25S/L型)②异螺甾烷醇类(isospirostanols,25R/D型)③呋甾烷醇类(furostanols,F环开裂)④变形螺甾烷醇类(pseudo-spirostanols)。甾体皂苷元基本骨架=螺甾烷(27碳,ABCDEF六环)。\n\n〔老师强调/扣分点〕老师:『重点掌握甾体皂苷苷元的结构类型分类有哪几种』。剑麻皂苷元(sisalagenin)是合成120多种激素的原料。25R(异螺甾)更稳定。","options":{},"answer":"论述题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择(甾体皂苷四类:螺甾烷醇/异螺甾烷醇/呋甾烷醇/变形—知到'螺甾醇型甾体元错误论述'(多〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125142},{"id":"tr-1258","course":"天然药物化学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】生物碱生源途径","answerText":"生物碱生源途径:①来源于氨基酸途径(主要途径,大多数生物碱)——鸟氨酸/赖氨酸→哌啶类/吲哚里西啶类/喹诺里西啶类;邻氨基苯甲酸→喹啉类/吖啶酮类;苯丙氨酸/酪氨酸→苯丙胺类/异喹啉类;色氨酸→吲哚类②来源于甲戊二羟酸途径(少数,萜类/甾体生物碱)。\n\n〔老师强调/扣分点〕老师讲生源关系。考点:氨基酸前体与生物碱母核对应(酪氨酸→异喹啉、色氨酸→吲哚)。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(生物碱生源:氨基酸途径鸟氨酸/赖氨酸—知到'毒芹碱吡啶类''吗啡吗啡烷类'+真题〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125143},{"id":"tr-1259","course":"天然药物化学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】生物碱沉淀反应","answerText":"生物碱沉淀反应(必考):在酸性水/稀醇中(使生物碱呈盐)与试剂生成难溶复盐/络合物。三大类试剂:①碘化物复盐——碘化铋钾Dragendorff(BiI3·KI,黄至橘红色沉淀,最常用可作显色剂)、碘化汞钾Mayer(HgI2·2KI,白色沉淀)、碘-碘化钾Wagner(I2-KI,棕褐色沉淀)②重金属盐——3%氯化金(黄色)、10%硅钨酸(灰白/淡黄)、雷氏铵盐(紫红色,兼鉴别+提取,实验室最常用)③大分子酸——苦味酸(2,4,6-三硝基苯酚,黄色晶形)。\n\n〔老师强调/扣分点〕笔记★★★★。用途:检识/分离纯化/鉴定。注意:需≥3种不同类型试剂交叉验证;醇含水量>50%;氨基酸/蛋白/多糖/鞣质假阳性需碱化CHCl3萃取纯化。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(★生物碱沉淀反应碘化铋钾/碘化汞钾—知到'生物碱沉淀反应条件:酸性水溶液'+'生〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125144},{"id":"tr-1260","course":"天然药物化学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】生物碱显色反应(专属鉴别)","answerText":"生物碱显色反应(专属鉴别):酸性水/稀醇中生物碱与浓无机酸反应生成有色物(非沉淀)。①Vitali反应(发烟硝酸+NaOH醇液)——仅托烷类(含莨菪酸):阿托品/莨菪碱/东莨菪碱②Marquis反应(含甲醛浓硫酸)——吗啡显紫红色、可待因显蓝色,专鉴吗啡类。\n\n〔老师强调/扣分点〕笔记★★★。Vitali=托烷类专属、Marquis=吗啡类专属是高频对应题。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(★生物碱显色反应Vitali/Marquis—知到'生物碱结构鉴定:化学方法光谱〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125145},{"id":"ya-001","course":"药物分析学","type":"选择","chapter":"历年真题","number":"A1","title":"中国药典规定的“水浴温度”指()摄氏度","answerText":"","options":{"A":"80-90","B":"75-85","C":"95-100","D":"85-95","E":"98-100"},"answer":"E","mnemonic":"必背｜南昌大学A卷(24-25)｜历年原题","priority":"必背","isRecall":false,"sourceId":1,"addedAt":1780168174750,"examProb":"必考"},{"id":"ya-002","course":"药物分析学","type":"选择","chapter":"历年真题","number":"A2","title":"一般分析方法的回收率应在","answerText":"","options":{"A":"80%--120%","B":"85%--115%","C":"90%--110%","D":"95%--105%","E":"98%--100%"},"answer":"B","mnemonic":"必背｜南昌大学A卷(24-25)｜历年原题","priority":"必背","isRecall":false,"sourceId":1,"addedAt":1780168174751,"examProb":"必考"},{"id":"ya-003","course":"药物分析学","type":"选择","chapter":"历年真题","number":"A3","title":"将药物经炽灼后再进行重金属检查,炽灼温度应保持在()摄氏度","answerText":"","options":{"A":"500以下","B":"500-600","C":"600-700","D":"700-800","E":"800以上"},"answer":"B","mnemonic":"必背｜南昌大学A卷(24-25)｜历年原题","priority":"必背","isRecall":false,"sourceId":1,"addedAt":1780168174752,"examProb":"必考"},{"id":"ya-004","course":"药物分析学","type":"选择","chapter":"历年真题","number":"A4","title":"铁盐检查时,需要加入过硫酸铵适量,为了","answerText":"","options":{"A":"消除干扰","B":"加速高铁与SCN离子的反应速度","C":"增加颜色深度","D":"将低价铁氧化为高铁,同时防止硫氰酸铁在光线作用下被还原或分解","E":"将低价铁氧化为高铁"},"answer":"D","mnemonic":"必背｜南昌大学A卷(24-25)｜历年原题","priority":"必背","isRecall":false,"sourceId":1,"addedAt":1780168174753,"examProb":"必考"},{"id":"ya-005","course":"药物分析学","type":"选择","chapter":"历年真题","number":"A5","title":"下列属于信号杂质的是","answerText":"","options":{"A":"酮体","B":"重金属","C":"氰化物","D":"2-甲基-5-硝基咪唑","E":"硫酸盐"},"answer":"E","mnemonic":"必背｜南昌大学A卷(24-25)｜历年原题","priority":"必背","isRecall":false,"sourceId":1,"addedAt":1780168174754,"examProb":"必考"},{"id":"ya-006","course":"药物分析学","type":"选择","chapter":"历年真题","number":"A6","title":"药典(2005版)用高氯酸液滴定枸橼酸乙胺嗪片(规格100mg/片)取供试品10片,精密称定得2.000g,精密称取0.5000g,依法滴定 "},{"id":"ya-073","course":"药物分析学","type":"简答记忆","chapter":"历年真题","number":"","title":"简述重金属检查法第三法的原理与适用条件","answerText":"答题要点:用于难溶于稀酸但能溶于碱性水溶液(磺胺类、巴比妥类)NaOH +水+NaS","options":{},"answer":"简答题","mnemonic":"必背｜南昌大学B卷(24-25)｜历年原题","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168174822,"examProb":"必考"},{"id":"ya-074","course":"药物分析学","type":"简答记忆","chapter":"历年真题","number":"","title":"简述亚硝酸钠滴定法主要试剂的作用","answerText":"加入溴化钾,加速反应;加入强酸加速反应,反应加快、重氮盐酸性中稳定、防偶氮基化合物生成","options":{},"answer":"简答题","mnemonic":"必背｜南昌大学B卷(24-25)｜历年原题","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168174823,"examProb":"必考"},{"id":"ya-075","course":"药物分析学","type":"计算记忆","chapter":"历年真题","number":"","title":"异烟肼片标示量百分含量计算(溴酸钾法)","answerText":"标示量(%)=[V×T×f×W平均×100]/[25×20×W取样×标示量] ×100% =[16.10×2.057×(0.01667/0.01000)×2.422]/[25×20×100×0.2560] ×100% =104.5% 答:供试品标示量百分含量为104.5%","options":{},"answer":"计算题","mnemonic":"必背｜南昌大学A卷(24-25)｜历年原题","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168174824,"examProb":"必考"},{"id":"ya-076","course":"药物分析学","type":"计算记忆","chapter":"历年真题","number":"","title":"浓缩鱼肝油丸维生素A三点校正法含量计算","answerText":"根据题意,计算各波长处吸收度与328nm波长处吸收度的比值,并与规定比值比较 其中,比值A316/A328、A340/A328与规定比值之差超过限度(±0.02),故需计算校正吸收度,并与实测值比较 A328(校正后)=3.52(2A328−A316−A300)=3.52(2×0.438−0.376−0.38)=0.4224 (A328校正 −A328实)/A328实=(0.4224−0.438)/0.438=−0.036 校正吸收度与实测值之差已超过实测值的-3%,故应以A328(校正)计算含量。 E1%1cm(328nm)=A校正/(100×ms/D)=0.4224/(100×0.1600/2500)=66 供试品中维生素A效价=E×1900(IU/g) 标示%=(效价×平均丸重)/标示量×100%=100.32% 答:供试品标示量百分含量为100.32%","options":{},"answer":"计算题","mnemonic":"必背｜南昌大学A卷(24-25)｜历年原题","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168174825,"examProb":"必考"},{"id":"ya-077","course":"药物分析学","type":"计算记忆","chapter":"历年真题","number":"","title":"司可巴比妥钠重金属检查标准铅溶液取样量计算","answerText":"1. V=L×S/c=20×10^-6×1.0×10^6/10=2.0ml","options":{},"answer":"计算题","mnemonic":"必背｜南昌大学B卷(24-25)｜历年原题","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168174826,"examProb":"必考"},{"id" c":"了解｜学习与解题指南","priority":"了解","isRecall":false,"sourceId":2,"addedAt":1780168174853,"examProb":"了解"},{"id":"ya-105","course":"药物分析学","type":"选择","chapter":"第十三章 生物制品分析概论","number":"2","title":"生物制品必须检查","answerText":"","options":{"A":"溶出度","B":"无菌","C":"崩解时限","D":"水分"},"answer":"B","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":false,"sourceId":2,"addedAt":1780168174854,"examProb":"了解"},{"id":"ya-106","course":"药物分析学","type":"选择","chapter":"第十四章 中药及其制剂分析概论","number":"1","title":"中药制剂定性鉴别最常用","answerText":"","options":{"A":"HPLC","B":"TLC","C":"GC","D":"UV"},"answer":"B","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":false,"sourceId":2,"addedAt":1780168174855,"examProb":"了解"},{"id":"ya-107","course":"药物分析学","type":"选择","chapter":"第十四章 中药及其制剂分析概论","number":"2","title":"中药需检查残留","answerText":"","options":{"A":"有机溶剂","B":"农药","C":"氧化物","D":"水分"},"answer":"B","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":false,"sourceId":2,"addedAt":1780168174856,"examProb":"了解"},{"id":"ya-108","course":"药物分析学","type":"选择","chapter":"第十五章 药品质量标准的制订","number":"1","title":"药品质量标准制订不包括","answerText":"","options":{"A":"安全有效","B":"价格低廉","C":"技术先进","D":"统一规范"},"answer":"B","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":false,"sourceId":2,"addedAt":1780168174857,"examProb":"了解"},{"id":"ya-109","course":"药物分析学","type":"选择","chapter":"第十五章 药品质量标准的制订","number":"2","title":"药品质量标准核心内容不包括","answerText":"","options":{"A":"广告","B":"鉴别","C":"检查","D":"含量"},"answer":"A","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":false,"sourceId":2,"addedAt":1780168174858,"examProb":"了解"},{"id":"ya-110","course":"药物分析学","type":"选择","chapter":"第十六章 药品质量控制中现代分析方法的进展","number":"1","title":"定性定量最强的技术是","answerText":"","options":{"A":"UV","B":"HPLC","C":"LC-MS","D":"TLC"},"answer":"C","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":false,"sourceId":2,"addedAt":1780168174859,"examProb":"了解"},{"id":"ya-111","course":"药物分析学","type":"选择","chapter":"第十六章 药品质量控制中现代分析方法的进展","number":"2","title":"近红外光谱特点是","answerText":"","options":{"A":"有损","B":"慢速","C":"快速无损","D":"只测液体"},"answer":"C","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":false,"sourceId":2,"addedAt":1780168174860,"examProb":"了解"},{"id":"ya-112","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"","title":"药物鉴别的意义是什么?药品质量标准中常用的鉴别方法有哪些?","answerText":"药物的鉴别试验可以用来证实贮藏在有标签容器中的药物是否为其表示的药物,可以判断药物的真伪。药物鉴别的方法有化学鉴别法、光谱鉴别法、X射线粉末衍射法、色谱鉴别法以及生物学法。","options":{},"answer":"简答题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174861,"examProb":"常考"},{"id":"ya-113","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"","title":"对化学鉴别试验的要求是什么?","answerText":"化学鉴别试验必须反应迅速,现象明显,不要求反应一定要进行完全。","options":{},"answer":"简答题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174862,"examProb":"常考"},{"id":"ya-114","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"","title":"紫外光谱法在药物的鉴别试验中有哪些应用?","answerText":"1测定最大吸收波长,或同时测定最小吸收波长;2规定一定浓度的供试液在最大吸收波长处的吸光度;3规定吸收波长和吸收系数法;4规定吸收波长和吸光度比值法;5经化学处理后,测定其反应产物的吸收光谱特征。","options":{},"answer":"简答题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174863,"examProb":"常考"},{"id":"ya-115","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"","title":"采用红外光谱法鉴别药物时,固体试样的制备需注意什么问题?","answerText":"1药品和溴化钾稀释剂及所用器皿均需干燥;2研磨均匀,且需在红外灯下操作;3压片时需抽真空。","options":{},"answer":"简答题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174864,"examProb":"常考"},{"id":"ya-116","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"","title":"比较紫外光谱法和红外光谱法鉴别药物的优缺点。","answerText":"紫外光谱法的优点:不要求是单一组分,有其他成分时也可进行鉴别试验;缺点:吸收光谱简单,曲线形状变化不大,专属性不强。红外光谱法的优点:专属性强,应用广泛,特别适合于用其他方法不易区分的同类药物;缺点:多组分或多晶现象不适用。 #","options":{},"answer":"简答题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174865,"examProb":"常考"},{"id":"ya-117","course":"药物分析学","type":"填空记忆","chapter":"第二章 药物的鉴别试验","number":"","title":"重氮化-偶合反应可用来鉴别______类药物。","answerText":"芳香第一胺","options":{},"answer":"填空题","mnemonic":"重要｜学习与解题指南","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174866,"examProb":"常考"},{"id":"ya-118","course":"药物分析学","type":"填空记忆","chapter":"第二章 药物的鉴别试验","number":"","title":"含有酚羟基的药物可采用______方法来鉴别。","answerText":"三氯化铁显色","options":{},"answer":"填空题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174867,"examProb":"常考"},{"id":"ya-119","course":"药物分析学","type":"填空记忆","chapter":"第二章 药物的鉴别试验","number":"","title":"含______的药物经直火加热可生成______;含氮杂环类药物可以和______试剂反应生成沉淀。","answerText":"碘 紫色碘蒸气 生物碱沉淀","options":{},"answer":"填空题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174868,"examProb":"常考"},{"id":"ya-120","course":"药物分析学","type":"填空记忆","chapter":"第二章 药物的鉴别试验","number":"","title":"______盐加碱处理后,产生的气体可以使湿润的红色石蕊试纸变______色,使湿润的硝酸亚汞试纸显______色。","answerText":"铵 蓝 黑","options":{},"answer":"填空题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174869,"examProb":"常考"},{"id":"ya-121","course":"药物分析学","type":"填空记忆","chapter":"第二章 药物的鉴别试验","number":"","title":"硫酸盐的鉴别试验,向供试液中滴加氯化钡试液生成______。","answerText":"白色沉淀","options":{},"answer":"填空题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174870,"examProb":"常考"},{"id":"ya-122","course":"药物分析学","type":"填空记忆","chapter":"第二章 药物的鉴别试验","number":"","title":"水杨酸盐的鉴别,取供试液,加稀盐酸即析出______,分离,沉淀在______溶解。","answerText":"白色水杨酸 醋酸铵","options":{},"answer":"填空题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174871,"examProb":"常考"},{"id":"ya-123","course":"药物分析学","type":"填空记忆","chapter":"第二章 药物的鉴别试验","number":"","title":"用红外光谱法进行鉴别试验时,《中国药典》采用______,USP采用______。","answerText":"标准图谱对照法 对照品法","options":{},"answer":"填空题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174872,"examProb":"常考"},{"id":"ya-124","course":"药物分析学","type":"填空记忆","chapter":"第二章 药物的鉴别试验","number":"","title":"影响鉴别反应的因素主要有______、______、______、______、______。","answerText":"溶液的浓度 溶液的温度 溶液的酸碱度 试验时间 干扰成分","options":{},"answer":"填空题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174873,"examProb":"常考"},{"id":"ya-125","course":"药物分析学","type":"填空记忆","chapter":"第二章 药物的鉴别试验","number":"","title":"核磁共振法通过测定供试品指定基团上的______和______进行药物的鉴别。","answerText":"化学位移 偶合常数","options":{},"answer":"填空题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174874,"examProb":"常考"},{"id":"ya-126","course":"药物分析学","type":"填空记忆","chapter":"第二章 药物的鉴别试验","number":"","title":"薄层色谱法中,比移值的最佳范围是______。","answerText":"0.3~0.5 #","options":{},"answer":"填空题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174875,"examProb":"常考"},{"id":"ya-127","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"","title":"药物中杂质的来源有哪些?试举例说明。","answerText":"药物中杂质主要有两个来源,一是生产过程中引入杂质,如阿司匹林在生产过程中水杨酸乙酰化不完全,那么水杨酸就是杂质;地塞米松磷酸钠在生产过程中使用大量甲醇和丙酮,残留在成品中,就是杂质。杂质的第二个来源是在贮藏过程中引入杂质,维生素C在贮藏过程中因氧化色变深;青霉素在贮藏过程中遇水分会水解开环而失效。","options":{},"answer":"简答题","mnemonic":"重要｜学习与解题指南","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174876,"examProb":"常考"},{"id":"ya-128","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"","title":"氯化物杂质检查的原理是什么?有何注意事项?","answerText":"原理:利用氯化物在硝酸溶液中与硝酸银试液作用,生成氯化银的白色浑浊液,与一定量标准氯化钠溶液在相同条件下生成的氯化银浑浊液比较,以判断供试品中氯化物是否超过限量。 注意事项:1如供试液浑浊,要过滤;2如供试液有颜色,可采用内消色法或外消色法消除影响。","options":{},"answer":"简答题","mnemonic":"重要｜学习与解题指南","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174877,"examProb":"常考"},{"id":"ya-129","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"","title":"铁盐检查中除另有规定外,为什么要加过硫酸铵?有的样品采用硝酸处理,用硝酸处理的样品是否还需加过硫酸铵?加硝酸后的样品为什么要加热煮沸?","answerText":"过硫酸铵的作用是氧化剂,把二价的铁杂质氧化成三价铁。若药品加硝酸处理,因为硝酸是氧化剂,故不需加过硫酸铵。因硝酸中可能含亚硝酸,它能跟硫氰酸根离子作用,产生红色亚硝酰硫氰化物,影响比色,所以剩余的硝酸必须加热煮沸除去。","options":{},"answer":"简答题","mnemonic":"重要｜学习与解题指南","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174878,"examProb":"常考"},{"id":"ya-130","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"","title":"古蔡法检砷时,试验中加碘化钾和酸性氯化亚锡试液的作用是什么?醋酸铅棉花的作用是什么?","answerText":"碘化钾和酸性氯化亚锡试液的作用:1还原五价的砷为三价的砷;2碘离子可以和锌离子形成稳定的配位化合物,有利于砷化氢气体不断产生;3可抑制锑化氢的产生;4氯化亚锡可与锌作用,生成锌锡齐,使氢气可以连续均匀地放出。醋酸铅棉花的作用是吸收硫化氢气体。","options":{},"answer":"简答题","mnemonic":"重要｜学习与解题指南","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174879,"examProb":"常考"},{"id":"ya-131","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"","title":"什么叫干燥失重?常用的干燥失重测定方法有哪些?干燥失重和水分有何区别?","answerText":"干燥失重是指药品在规定的条件下经干燥后所减失的量,以百分率表示。常用的干燥失重测定方法有四种:1常压恒温干燥法,适用于受热较稳定的药物;2干燥剂干燥法,适用于受热分解或易升华的供试品;3减压干燥法,适用于熔点低或受热分解的供试品;4热分析法。干燥失重的内容物主要指水分,也包括其他挥发性物质,如残留的挥发性有机溶剂。","options":{},"answer":"简答题","mnemonic":"重要｜学习与解题指南","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174880,"examProb":"常考"},{"id":"ya-132","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"","title":"残留溶剂一般是指什么?《中国药典》一般采用何种方法进行检查?","answerText":"残留溶剂指在合成原料药、辅料或制剂生产的过程中使用的,但在工艺中未能完全除去的有机溶剂。 《中国药典》常采用气相色谱法进行检查。常用的方法有两种:1《中国药典》法;2静态顶空进样法(适用于挥发性大的组分分析)。","options":{},"answer":"简答题","mnemonic":"重要｜学习与解题指南","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174881,"examProb":"常考"},{"id":"ya-133","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"","title":"什么叫热分析法?常用的热分析法有哪些?","answerText":"热分析法是指在程序控制温度下测量物质的物理、化学性质与温度关系的一类技术。常用的热分析法有热重分析法、差示热分析法和差示扫描量热分析。","options":{},"answer":"简答题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174882,"examProb":"常考"},{"id":"ya-134","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"","title":"薄层色谱法检查杂质中,什么叫供试品溶液自身稀释对照法?有何特点?","answerText":"先配制一定浓度的供试品溶液,然后将供试品溶液按限量要求稀释至一定浓度作为对照溶液。适用于杂质的结构不能确定或无杂质对照品的情况(仅限于二者的颜色相近或相同,且对显色剂的灵敏度相近或相同的情况)。","options":{},"answer":"简答题","mnemonic":"重要｜学习与解题指南","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174883,"examProb":"常考"},{"id":"ya-135","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"","title":"检查甲苯咪唑中的无效晶型A晶型,《中国药典》采用的是何种方法?如何检查?","answerText":"《中国药典》采用红外光谱法进行鉴别。无效A晶型在640cm−1处有强吸收,药物C晶型在此波长处吸收很弱;而在662cm−1处,A晶型的吸收很弱,C晶型却有较强吸收。当供试品含有A晶型时,在上述两波数处的吸光度比值将发生改变。","options":{},"answer":"简答题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174884,"examProb":"常考"},{"id":"ya-136","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"","title":"两性霉素A是两性霉素B发酵过程中的副产物,《中国药典》采用何种方法检查两性霉素A,如何检查?","answerText":"《中国药典》采用紫外光谱法进行鉴别。在305nm处两性霉素A的吸收最强,而两性霉素B的吸收很弱,通过测定两性霉素B供试品溶液在305nm处的吸光度来控制两性霉素A的限量。","options":{},"answer":"简答题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174885,"examProb":"常考"},{"id":"ya-137","course":"药物分析学","type":"简答记忆","chapter":"第三章 药物的杂质检查","number":"","title":"采用高效液相色谱法检查特殊杂质,《中国药典》收载有哪些方法?各有何特点?","answerText":"内标法加校正因子法:用于有杂质对照品时,能够测定杂质的校正因子和杂质的含量。外标法:用于有杂质对照品或杂质对照品易制备的情况。加校正因子的主成分自身对照法:用于有杂质对照品时杂质的含量测定。不加校正因子的主成分自身对照法:用于没有杂质对照品的情况。峰面积归一化法:粗略测量供试品中杂质的含量。前三种方法准确,后两种方法粗略。 #","options":{},"answer":"简答题","mnemonic":"重要｜学习与解题指南","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174886,"examProb":"常考"},{"id":"ya-138","course":"药物分析学","type":"填空记忆","chapter":"第三章 药物的杂质检查","number":"","title":"药物杂质的两个来源是______和______。","answerText":"生产过程中引入 贮藏过程中产生","options":{},"answer":"填空题","mnemonic":"重要｜学习与解题指南","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174887,"examProb":"常考"},{"id":"ya-139","course":"药物分析学","type":"填空记忆","chapter":"第三章 药物的杂质检查","number":"","title":"在药物贮藏的过程中,导致药物变质的主要因素有______和______。","answerText":"氧化反应 水解反应","options":{},"answer":"填空题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174888,"examProb":"常考"},{"id":"ya-140","course":"药物分析学","type":"填空记忆","chapter":"第三章 药物的杂质检查","number":"","title":"杂质的限量通常用______或______来表示。","answerText":"百分之几 百万分之几","options":{},"answer":"填空 中规定了四种重金属的检查方法,分别是______、______、______和______。","answerText":"硫代乙酰胺法","options":{},"answer":"填空题","mnemonic":"重要｜学习与解题指南","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174896,"examProb":"常考"},{"id":"ya-148","course":"药物分析学","type":"简答记忆","chapter":"第八章 杂环类药物的分析","number":"","title":"如何用戊烯二醛反应鉴别尼可刹米?","answerText":"尼可刹米加水溶解,加溴化氰试液与苯胺溶液,加热,显黄色。","options":{},"answer":"简答题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174897,"examProb":"常考"},{"id":"ya-149","course":"药物分析学","type":"简答记忆","chapter":"第八章 杂环类药物的分析","number":"","title":"简述异烟肼银镜反应的原理。","answerText":"酰肼基还原硝酸银为单质银,生成黑色银镜。","options":{},"answer":"简答题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174898,"examProb":"常考"},{"id":"ya-150","course":"药物分析学","type":"简答记忆","chapter":"第八章 杂环类药物的分析","number":"","title":"吩噻嗪类药物的鉴别方法有哪些?","answerText":"氧化剂显色、钯离子显色、红外光谱。","options":{},"answer":"简答题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174899,"examProb":"常考"},{"id":"ya-151","course":"药物分析学","type":"简答记忆","chapter":"第八章 杂环类药物的分析","number":"","title":"什么是Vitali反应?用于什么药物?","answerText":"托烷类生物碱与发烟硝酸共热,得黄色三硝基衍生物,遇醇制氢氧化钾显深紫色。","options":{},"answer":"简答题","mnemonic":"重要｜学习与解题指南","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174900,"examProb":"常考"},{"id":"ya-152","course":"药物分析学","type":"简答记忆","chapter":"第八章 杂环类药物的分析","number":"","title":"绿奎宁反应的原理与适用药物是什么?","answerText":"奎宁在微酸性溶液中与溴水、氨水反应,显翠绿色。","options":{},"answer":"简答题","mnemonic":"了解｜学习与解题指南","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168174901,"examProb":"常考"},{"id":"ya-153","course":"药物分析学","type":"填空记忆","chapter":"第八章 杂环类药物的分析","number":"","title":"异烟肼中检查的特殊杂质是______。","answerText":"游离肼","options":{},"answer":"填空题","mnemonic":"重要｜学习与解题指南","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174902,"examProb":"常考"},{"id":"ya-154","course":"药物分析学","type":"填空记忆","chapter":"第八章 杂环类药物的分析","number 子F，求被测药物的含量。","answerText":"答题要点（须有过程，结果保留2位有效数字）：被测药物质量 m = T × V × F（mg）；若计算标示量/含量百分数，再除以取样量或标示量并乘100%。说明：滴定度T即每1mL规定浓度滴定液相当的被测药物毫克数；F为滴定液实际浓度与规定浓度之比（校正因子）。","options":{},"answer":"计算题","mnemonic":"🆕课堂强调·补充｜〔2026-03-20 15:38 [09:00]〕｜非真题原题·据课堂整理","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174970,"isPatch":true,"examProb":"必考"},{"id":"ya-222","course":"药物分析学","type":"选择","chapter":"第二章 药物的鉴别试验","number":"","title":"亚硝酸钠法（重氮化法）测定时加入溴化钾的主要作用是（）","answerText":"","options":{"A":"调节pH","B":"作催化剂，提高NO⁺浓度、加快重氮化反应速度","C":"指示终点","D":"防止氧化","E":"增大溶解度"},"answer":"B","mnemonic":"🆕课堂强调·补充｜〔2026-04-07 14:38 [30:00]〕｜非真题原题·据课堂整理｜刘超反复强调必考","priority":"必背","isRecall":false,"sourceId":3,"addedAt":1780168174971,"isPatch":true,"examProb":"必考"},{"id":"ya-223","course":"药物分析学","type":"选择","chapter":"第二章 药物的鉴别试验","number":"","title":"亚硝酸钠法重氮化反应通常加入的酸及其过量程度是（）","answerText":"","options":{"A":"硫酸，1:1","B":"醋酸，过量10倍","C":"盐酸，约1:2.5~1:6","D":"硝酸，1:10","E":"磷酸，等量"},"answer":"C","mnemonic":"🆕课堂强调·补充｜〔2026-04-07 14:38 [33:00]〕｜非真题原题·据课堂整理","priority":"必背","isRecall":false,"sourceId":3,"addedAt":1780168174972,"isPatch":true,"examProb":"必考"},{"id":"ya-224","course":"药物分析学","type":"选择","chapter":"第二章 药物的鉴别试验","number":"","title":"亚硝酸钠法重氮化反应的适宜温度是（）","answerText":"","options":{"A":"0℃以下","B":"室温（10~30℃），15℃以下结果较准确","C":"50~60℃","D":"沸水浴","E":"温度无影响"},"answer":"B","mnemonic":"🆕课堂强调·补充｜〔2026-04-07 14:38 [35:00]〕｜非真题原题·据课堂整理","priority":"必背","isRecall":false,"sourceId":3,"addedAt":1780168174973,"isPatch":true,"examProb":"必考"},{"id":"ya-225","course":"药物分析学","type":"选择","chapter":"第二章 药物的鉴别试验","number":"","title":"亚硝酸钠法滴定时滴定速度应采用（）","answerText":"","options":{"A":"匀速","B":"先慢后快","C":"先快后慢","D":"一次性加入","E":"随意"},"answer":"C","mnemonic":"🆕课堂强调·补充｜〔2026-04-07 14:38 [37:00]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780168174974,"isPatch":true,"examProb":"必考"},{"id":"ya-226","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"","title":"简述亚硝酸钠法（重氮化反应滴定法）测定的主要影响因素","answerText":"答题要点（四个影响因素）：①加入溴化钾作催化剂——提高NO⁺浓度、加快重氮化反应速度；②酸的种类和浓度——用盐酸，过量约1:2.5~1:6，作用是加快反应速度、使重氮盐稳定、防止生成偶氮氨基化合物（盐酸过量过多会使重氮盐分解）；③反应温度——室温10~30℃，15℃以下结果较准确（温度过高重氮盐易分解）；④滴定速度——先快后慢，终点前充分搅拌。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-04-07 14:38 [27:43]〕｜非真题原题·据课堂整理｜刘超明言必考·三连问","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174975,"isPatch":true,"examProb":"必考"},{"id":"ya-227","course":"药物分析学","type":"简答记忆","chapter":"第二章 药物的鉴别试验","number":"","title":"亚硝酸钠法测定的三连问母题：反应原理、影响因素、指示终点的方法有哪些","answerText":"答题要点：①反应原理——凡具有芳伯氨基或水解后产生芳伯氨基的药物，在酸性条件下与亚硝酸钠发生重氮化反应生成重氮盐；②影响因素——加溴化钾作催化剂、盐酸的种类与浓度、反应温度（室温/低温）、滴定速度（先快后慢）；③指示终点的方法——永停滴定法（电流变化指示）等共四种方法。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-04-07 14:38 [27:43]〕｜非真题原题·据课堂整理｜刘超明言三连问必考","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174976,"isPatch":true,"examProb":"必考"},{"id":"ya-228","course":"药物分析学","type":"名词解释记忆","chapter":"第二章 药物的鉴别试验","number":"","title":"永停滴定法","answerText":"永停滴定法是亚硝酸钠法等指示终点的方法之一，将两个相同的铂电极插入待测溶液（在盐酸酸性、搅拌条件下），滴定过程中观察电流变化：终点前溶液中无过量亚硝酸，电流无明显变化；到达终点时出现过量亚硝酸，电极去极化使电流突变并不再回复，据此指示终点。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-04-07 14:38 [38:00]〕｜非真题原题·据课堂整理","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174977,"isPatch":true,"examProb":"必考"},{"id":"ya-229","course":"药物分析学","type":"填空记忆","chapter":"第二章 药物的鉴别试验","number":"","title":"亚硝酸钠滴定盐酸普鲁卡因时，应加入的催化剂是______。","answerText":"溴化钾（KBr）","options":{},"answer":"填空题","mnemonic":"🆕课堂强调·补充｜〔2026-04-07 15:38 [17:47]〕｜非真题原题·据课堂整理｜刘超明确为选择/填空考点","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174978,"isPatch":true,"examProb":"必考"},{"id":"ya-230","course":"药物分析学","type":"选择","chapter":"第八章 定量分析方法的验证","number":"","title":"衡量分析方法灵敏度的验证指标是（）","answerText":"","options":{"A":"专属性","B":"检测限和定量限","C":"准确度","D":"耐用性","E":"范围"},"answer":"B","mnemonic":"🆕课堂强调·补充｜〔2026-03-24 15:38 [02:00]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780168174979,"isPatch":true,"examProb":"必考"},{"id":"ya-231","course":"药物分析学","type":"选择","chapter":"第八章 定量分析方法的验证","number":"","title":"分析方法验证中，\"准确度\"通常通过下列哪项实验来评价（）","answerText":"","options":{"A":"重复性实验","B":"回收率实验","C":"线性实验","D":"耐用性实验","E":"专属性实验"},"answer":"B","mnemonic":"🆕课堂强调·补充｜〔2026-03-24 15:38 [03:00]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780168174980,"isPatch":true,"examProb":"必考"},{"id":"ya-232","course":"药物分析学","type":"选择","chapter":"第八章 定量分析方法的验证","number":"","title":"分析方法验证中评价\"精密度\"的三类实验是（）","answerText":"","options":{"A":"专属性、线性、范围","B":"重复性、中间精密度、重现性","C":"检测限、定量限、灵敏度","D":"准确度、耐用性、回收率","E":"系统适用性、空白、对照"},"answer":"B","mnemonic":"🆕课堂强调·补充｜〔2026-03-24 15:38 [03:30]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780168174981,"isPatch":true,"examProb":"必考"},{"id":"ya-233","course":"药物分析学","type":"简答记忆","chapter":"第八章 定量分析方法的验证","number":"","title":"简述分析方法验证的主要内容（验证指标）","answerText":"答题要点：准确度（回收率实验）、精密度（重复性、中间精密度、重现性）、专属性（选择性）、检测限与定量限（衡量灵敏度）、线性、范围、耐用性。注意：并非所有项目都要做全部内容，应根据分析项目的要求选择需验证的指标。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-03-24 15:38 [02:30]〕｜非真题原题·据课堂整理","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174982,"isPatch":true,"examProb":"必考"},{"id":"ya-234","course":"药物分析学","type":"名词解释记忆","chapter":"第八章 定量分析方法的验证","number":"","title":"专属性","answerText":"专属性是指在其他成分（如杂质、降解产物、辅料等）可能存在的情况下，分析方法能够准确测定被测物的能力。它是鉴别试验和含量测定方法验证的重要指标之一。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-03-06 14:38 [00:30]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":3,"addedAt":1780168174983,"isPatch":true,"examProb":"必考"},{"id":"ya-235","course":"药物分析学","type":"填空记忆","chapter":"第八章 定量分析方法的验证","number":"","title":"药物鉴别试验要求所选方法应具有______和耐用性两个特性。","answerText":"专属性","options":{},"answer":"填空题","mnemonic":"🆕课堂强调·补充｜〔2026-03-10 15:38 [02:00]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":3,"addedAt":1780168174984,"isPatch":true,"examProb":"必考"},{"id":"ya-236","course":"药物分析学","type":"选择","chapter":"第八章 定量分析方法的验证","number":"","title":"HPLC系统适用性试验通常考察的五个参数是（）","answerText":"","options":{"A":"理论塔板数、分离度、灵敏度、拖尾因子、重复性","B":"pH、温度、流速、波长、柱长","C":"准确度、精密度、专属性、线性、范围","D":"保留时间、峰高、峰面积、对称性、噪声","E":"内标、外标、归一化、加入法、面积"},"answer":"A","mnemonic":"🆕课堂强调·补充｜〔2026-03-24 14:38 [00:30]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780168174985,"isPatch":true,"examProb":"必考"},{"id":"ya-237","course":"药物分析学","type":"选择","chapter":"第八章 定量分析方法的验证","number":"","title":"下列色谱定量方法中，需在供试品溶液中加入已知量参照物质的是（）","answerText":"","options":{"A":"外标法","B":"内标法","C":"面积归一化法","D":"峰高法","E":"直接进样法"},"answer":"B","mnemonic":"🆕课堂强调·补充｜〔2026-03-24 15:38 [01:00]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780168174986,"isPatch":true,"examProb":"必考"},{"id":"ya-238","course":"药物分析学","type":"选择","chapter":"第八章 定量分析方法的验证","number":"","title":"气相色谱法相比HPLC法，定量方法上特有的是（）","answerText":"","options":{"A":"内标法","B":"外标法","C":"面积归一化法","D":"标准溶液加入法","E":"峰高法"},"answer":"D","mnemonic":"🆕课堂强调·补充｜〔2026-03-24 15:38 [05:00]〕｜非真题原题·据课堂整理","priority":"了解","isRecall":false,"sourceId":3,"addedAt":1780168174987,"isPatch":true,"examProb":"必考"},{"id":"ya-239","course":"药物分析学","type":"名词解释记忆","chapter":"第八章 定量分析方法的验证","number":"","title":"内标法","answerText":"内标法是色谱定量方法之一，向供试品溶液中加入一定量的内标物质，以待测组分与内标物的峰面积（或峰高）之比进行定量，可消除进样量及仪器波动带来的误差，提高测定的准确度。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-03-24 15:38 [01:00]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":3,"addedAt":1780168174988,"isPatch":true,"examProb":"必考"},{"id":"ya-240","course":"药物分析学","type":"简答记忆","chapter":"第八章 定量分析方法的验证","number":"","title":"简述HPLC系统适用性试验的五个考察参数及意义","answerText":"答题要点：①理论塔板数（n）——衡量柱效；②分离度（R）——相邻两峰的分离程度，一般要求≥1.5；③灵敏度——检测响应能力；④拖尾因子（T，对称因子）——衡量色谱峰对称性；⑤重复性——多次进样峰面积/保留时间的一致性（RSD）。意义：综合判断色谱系统性能是否满足样品分析要求。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-03-24 14:38 [01:00]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":3,"addedAt":1780168174989,"isPatch":tr werText":"","options":{"A":"增大误差","B":"扣除试剂等空白消耗、降低误差、提高准确度","C":"指示终点","D":"标定浓度","E":"稀释样品"},"answer":"B","mnemonic":"🆕课堂强调·补充｜〔2026-03-20 15:38 [20:00]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780168175032,"isPatch":true,"examProb":"必考"},{"id":"ya-284","course":"药物分析学","type":"选择","chapter":"第八章 定量分析方法的验证","number":"","title":"当被测药物与滴定液反应慢或无合适指示终点时，常采用的滴定方式是（）","answerText":"","options":{"A":"直接滴定法","B":"剩余滴定法（回滴法）","C":"电位滴定","D":"比色法","E":"重量法"},"answer":"B","mnemonic":"🆕课堂强调·补充｜〔2026-03-20 15:38 [25:00]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780168175033,"isPatch":true,"examProb":"必考"},{"id":"ya-285","course":"药物分析学","type":"名词解释记忆","chapter":"第八章 定量分析方法的验证","number":"","title":"剩余滴定法（回滴定法）","answerText":"剩余滴定法是指向被测药物中加入定量且过量的滴定液使之反应完全，再用另一种滴定液回滴剩余的第一种滴定液，根据两者之差计算被测药物含量的方法。常用于反应较慢或无合适指示剂直接滴定的情形。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-03-20 15:38 [25:00]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":3,"addedAt":1780168175034,"isPatch":true,"examProb":"必考"},{"id":"ya-286","course":"药物分析学","type":"选择","chapter":"第十一章 抗生素类药物的分析","number":"","title":"抗生素类药物分析中需要特别关注的检查项目是（）","answerText":"","options":{"A":"熔点","B":"高分子杂质检查","C":"旋光度","D":"酸碱度","E":"颜色"},"answer":"B","mnemonic":"🆕课堂强调·补充｜〔2026-04-21 13:48 [10:00]〕｜非真题原题·据课堂整理｜抗生素多由发酵制得、杂质多,需查高分子杂质","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780168175035,"isPatch":true,"examProb":"必考"},{"id":"ya-287","course":"药物分析学","type":"选择","chapter":"第十一章 抗生素类药物的分析","number":"","title":"下列关于抗生素类药物特点的叙述，错误的是（）","answerText":"","options":{"A":"多由发酵法生产","B":"生产工艺复杂","C":"产品稳定性差、杂质多","D":"成分单一、易于分析","E":"常需测定效价"},"answer":"D","mnemonic":"🆕课堂强调·补充｜〔2026-04-21 13:48 [12:00]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780168175036,"isPatch":true,"examProb":"必考"},{"id":"ya-288","course":"药物分析学","type":"名词解释记忆","chapter":"第十一章 抗生素类药物的分析","number":"","title":"效价（抗生素效价）","answerText":"效价是衡量抗生素中有效成分（抗菌活性）含量的指标，常以单位（U）或μg/mg表示，可用微生物检定法或理化方法测定。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-04-21 13:48 [05:00]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":3,"addedAt":1780168175037,"isPatch":true,"examProb":"必考"},{"id":"ya-289","course":"药物分析学","type":"填空记忆","chapter":"第十一章 抗生素类药物的分析","number":"","title":"青霉素类、头孢菌素类、氨基糖苷类、大环内酯类、四环素类是抗生素按______的分类。","answerText":"化学结构","options":{},"answer":"填空题","mnemonic":"🆕课堂强调·补充｜〔2026-04-21 13:48 [08:00]〕｜非真题原题·据课堂整理","priority":"了解","isRecall":true,"sourceId":3,"addedAt":1780168175038,"isPatch":true,"examProb":"必考"},{"id":"ya-290","course":"药物分析学","type":"选择","chapter":"第八章 杂环类药物的分析","number":"","title":"异烟肼（含肼基）可用下列哪种方法测定含量（）","answerText":"","options":{"A":"溴酸钾法（氧化还原滴定）","B":"非水滴定","C":"银量法","D":"络合滴定","E":"重量法"},"answer":"A","mnemonic":"🆕课堂强调·补充｜〔2026-04-07 15:38 [05:00]〕｜非真题原题·据课堂整理｜对应历年真题异烟肼片溴酸钾法计算","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780168175039,"isPatch":true,"examProb":"必考"},{"id":"ya-291","course":"药物分析学","type":"选择","chapter":"第二章 药物的鉴别试验","number":"","title":"\"对号入座\"型鉴别选择题，若纯靠死记硬背而不理解结构，命中正确答案的几率约为（4选项）（）","answerText":"","options":{"A":"25%","B":"50%","C":"75%","D":"100%","E":"0%"},"answer":"A","mnemonic":"🆕课堂强调·补充｜〔2026-03-31 16:28 [34:00]〕｜非真题原题·据课堂整理｜刘超明言猜测命中率约25%","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780168175040,"isPatch":true,"examProb":"必考"},{"id":"ya-292","course":"药物分析学","type":"选择","chapter":"第二章 药物的鉴别试验","number":"","title":"具有酚羟基结构的药物（如水杨酸、对乙酰氨基酚部分水解产物），常用的显色鉴别试剂是（）","answerText":"","options":{"A":"硝酸银","B":"三氯化铁","C":"茚三酮","D":"碘","E":"高锰酸钾"},"answer":"B","mnemonic":"🆕课堂强调·补充｜〔2026-03-06 14:38 [02:00]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":3,"addedAt":1780168175041,"isPatch":true,"examProb":"必考"},{"id":"ya-293","course":"药物分析学","type":"名词解释记忆","chapter":"速通补充","number":"","title":"【名词解释】标准物质五类","answerText":"标准物质五类(易混必考):①标准品——生物检定/抗生素/生化药品效价测定,纯度以效价单位表示(如土霉素)②对照品——化学药品含量测定,纯度以百分含量表示(如阿司匹林、黄芩苷)③对照药材/对照提取物——中药分析专用④参考品——微生物定性定量/诊断,以活性单位表示。记忆:抗生素→标准品→效价单位;化学药品→对照品→百分含量。\n\n〔老师强调/扣分点〕笔记★★。易错点:中药单体成分(黄芩苷)仍属对照品≠对照药材(后者需为药材整体)。土霉素效价→标准品是经典例题。","options":{},"answer":"名词解释","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 名词解释(标准品/对照品五类—真题名解'标准品'+知到讨论题；精密称定/标准品真题名解)〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125125},{"id":"ya-294","course":"药物分析学","type":"名词解释记忆","chapter":"速通补充","number":"","title":"【名词解释】杂质与纯度","answerText":"杂质与纯度(必考名解):①杂质——药物在生产及储藏过程中引入的、无治疗作用或影响药物纯度/稳定性/疗效甚至危害健康的物质②纯度——药物纯净程度(活性成分相对于其他物质的程度)。检查四方面:安全性(无菌/热原/细菌内毒素)、有效性(制酸力/含氟量)、均一性(重量差异/含量均匀度)、纯度(水分/氯化物/铁盐/重金属/砷盐)。\n\n〔老师强调/扣分点〕笔记。杂质定义+纯度检查四类(安全性/有效性/均一性/纯度)是核心。","options":{},"answer":"名词解释","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 名词解释(杂质/特殊杂质—真题A/B卷名解'药物的杂质''特殊杂质''杂质限量')〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125126},{"id":"ya-295","course":"药物分析学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】杂质来源","answerText":"杂质来源(必考):①生产制备引入——原料不纯/反应不完全、中间体副产物(异构体/多晶型)未除尽、试剂溶剂残留、金属器皿引入(铅铁铜锌)②贮藏过程引入——温度/湿度/日光/空气/微生物致水解/氧化/分解/异构化/晶型转变/聚合/潮解/发霉。例:麻醉乙醚贮藏产生醛类及有毒过氧化物(药典规定启封后24小时内用);甲巯咪唑可逆重排产生杂质。\n\n〔老师强调/扣分点〕笔记。两大来源(生产+贮藏)及典型变化必背。乙醚24h、过氧化物是经典例。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 简答/判断(杂质来源—真题考点；信号杂质硫酸盐0615原题判断)〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125127},{"id":"ya-296","course":"药物分析学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】砷盐检查-古蔡氏法","answerText":"砷盐检查-古蔡氏法(必考简答):装置=发生瓶(锌粒+盐酸+碘化钾试液+酸性氯化亚锡)→醋酸铅棉花(导管中部,填6-8cm)→溴化汞试纸(顶部)。各试剂作用:①锌粒+盐酸提供新生态氢(Zn+2HCl→ZnCl2+H2↑)②碘化钾+酸性氯化亚锡将As⁵⁺还原为As³⁺③醋酸铅棉花吸收硫化氢消除硫化物干扰(生成PbS)④溴化汞试纸与砷化氢AsH3反应生成黄至棕色砷斑(深浅与砷量成正比)。\n\n〔老师强调/扣分点〕笔记★★★★最经典简答题。扣分点:每个试剂的作用必须答全(还原剂/除硫化氢/生成砷斑)。标准砷溶液1μg/mL 2mL临用新配,需浓盐酸,砷斑立即观察。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 简答(★必考砷盐古蔡氏法装置/反应式—真题简答'砷盐古蔡法反应式+装置图哪里发生'+知到讨论〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125128},{"id":"ya-297","course":"药物分析学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】砷盐检查-二乙基二硫代氨基甲酸银法(Ag-DDC法)","answerText":"砷盐检查-二乙基二硫代氨基甲酸银法(Ag-DDC法):原理——砷化氢与Ag-DDC在有机碱(三乙胺)存在下生成红色胶态银,目视比色或510nm测吸光度(AsH3+6Ag(DDC)→As(DDC)3+6Ag↓)。线性0.75-7.5μg,Ag-DDC试液两周内稳定,加氯化亚锡+碘化钾消除锑干扰。现代法:氢化物原子吸收(193.7nm,硼氢化钠还原)、ICP-MS(检测限10^-12,痕量重金属)。\n\n〔老师强调/扣分点〕笔记★★★。Ag-DDC法510nm红色胶态银vs古蔡氏法砷斑是对比考点。中药材限量:铅≤5ppm/镉≤0.3/砷≤2/汞≤0.2/铜≤20ppm。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 简答(Ag-DDC法测砷—知到讨论题'微量砷方法'+真题；DDC-Ag三乙胺0615原题)〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125129},{"id":"ya-298","course":"药物分析学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】含量均匀度检查","answerText":"含量均匀度检查(必考计算):适用——单剂标示量<25mg或主药<单剂重量25%的小剂量制剂、注射用无菌粉末、软胶囊等。方法:取10片测相对含量X→算均值X̄、标准差S、A=|100-X̄|,算A+2.2S和A+S。限度L=15.0(多数)/20.0(混悬液软胶囊)/25.0(透皮贴剂栓剂)。判断:A+2.2S≤L合格;A+S>L不合格;A+2.2S>L但A+S≤L需复试(另取20片共30片,A≤0.25L且A²+S²≤0.25L²)。\n\n〔老师强调/扣分点〕笔记★★★★高频计算。<25mg/<25%适用条件、A+2.2S≤L判据、L=15必背。奋乃静片例:A+2.2S=7.80<15合格。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 计算/简答(★含量均匀度A+2.2S≤L—0615原题详解+知到'硬脂酸镁干扰'相关制剂分析〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125130},{"id":"ya-299","course":"药物分析学","type":"计算记忆","chapter":"速通补充","number":"","title":"【计算】剩余滴定法(回滴法)计算","answerText":"剩余滴定法(回滴法)计算(必考):先加过量滴定液A与药物反应,反应完全后用滴定液B回滴剩余A,需空白校正。含量(%)=[(V0-VS)×FB×TA]/W×100%(V0=空白消耗体积,VS=样品消耗体积,F=校正因子=实际浓度/规定浓度)。美洛昔康例:(23.25-12.18)×1.023×33.14÷402.1×100%。空白试验消除杂质干扰提高准确度。\n\n〔老师强调/扣分点〕笔记★★★高频计算。剩余滴定用(V0-VS)、F校正因子=实际/规定浓度必记。注意是空白减样品。","options":{},"answer":"计算题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 计算(★剩余滴定法/两步滴定—真题计算'阿司匹林两步滴定'B卷选择21+异烟肼计算)〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125131},{"id":"ya-300","course":"药物分析学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】准确度与精密度","answerText":"准确度与精密度(必考):①准确度——测定值与真值接近程度,用QC样品。相对回收率RR=M̄/S×100%,相对误差RE=RR-100%。接受标准:常规浓度RR 85%-115%,LLOQ附近放宽80%-120%②精密度——批内精密度(同批次重复性)、批间精密度(不同分析批稳定性),用RSD表示。分析批=单次开机周期完成的所有测定。\n\n〔老师强调/扣分点〕笔记★★★。RR=85-115%、LLOQ 80-120%、批内vs批间精密度是高频。RR与RE关系RE=RR-100%。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 简答(准确度相对回收率RR/精密度—0615原题相关)〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125132},{"id":"ya-301","course":"药物分析学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】阿司匹林含量测定-直接酸碱滴定法","answerText":"阿司匹林含量测定-直接酸碱滴定法(必考):取约0.4g精密称定,加20mL中性乙醇溶解,加3滴酚酞指示液,用0.1mol/L NaOH滴定(1:1)。关键:①用中性乙醇防止酯键水解(扣分点)②酚酞pH8.3-10.0变色③仅适用原料药、不适用制剂(酸性辅料消耗NaOH、酯键水解影响)。易水解药物(阿司匹林)可用水解后剩余滴定法(NaOH水解生成水杨酸钠+醋酸钠,避免直接滴定结果偏高)。\n\n〔老师强调/扣分点〕笔记★★★★高频。中性乙醇防水解、酚酞指示剂、仅限原料药是核心扣分点。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 计算/简答(★阿司匹林直接酸碱滴定中性乙醇—真题计算B卷选择21两步滴定+知到+0615原题〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125133},{"id":"ya-302","course":"药物分析学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】喹啉类抗疟药(奎宁/奎尼丁)分析","answerText":"喹啉类抗疟药(奎宁/奎尼丁)分析:喹啉母核=苯环+吡啶环稠合。成盐目的:增稳定性/专利保护。碱性规律:侧链氮(叔氮)碱性强>杂环氮弱;叔氮>仲氮>伯氮。性质:①旋光性(硫酸奎宁左旋/奎尼丁右旋,手性HPLC控光学异构体)②荧光(平面共轭,稀硫酸中显蓝色荧光,灵敏度比UV高3个数量级)。\n\n〔老师强调/扣分点〕笔记★★★。奎宁左旋vs奎尼丁右旋、稀硫酸蓝色荧光、碱性叔>仲>伯是高频。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 简答(喹啉类奎宁—知到'硫酸奎宁杂质检查'+真题B卷选择3'高氯酸滴定硫酸奎林1:3'+06〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125134},{"id":"ya-303","course":"药物分析学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】非水溶液滴定法","answerText":"非水溶液滴定法(必考):溶剂选择——①酸性溶剂(冰醋酸)滴有机弱碱(增强相对碱度)②碱性溶剂(二甲基甲酰胺DMF)滴有机弱酸③两性溶剂(甲醇)④惰性溶剂(甲苯/氯仿/丙酮)。滴定弱碱用高氯酸标准液:BH⁺·A⁻+HClO4=BH⁺·ClO4⁻+HA。当置换出的HA酸性较强时加醋酸汞降低其酸性保证定量。硫酸奎宁:1分子与2分子高氯酸反应。\n\n〔老师强调/扣分点〕笔记★★★★高频。冰醋酸滴弱碱、DMF滴弱酸、高氯酸滴定剂、醋酸汞作用、硫酸奎宁1:2是必背计算要点。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(★非水溶液滴定法—真题多处选择17/B卷+知到'非水滴定生物碱注意事项'+061〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125135},{"id":"ya-304","course":"药物分析学","type":"计算记忆","chapter":"速通补充","number":"","title":"【计算】取样范围计算","answerText":"取样范围计算(必考计算):取样范围=药粉取样量相当于主成分0.5g时的90%-110%区间。方法:先称20/15片求平均片重,建立比例(药粉取样量/0.5g=平均片重/单片规格量)解出理论取样量,×90%-110%。例:标示量150mg/片,设取样量x,x/0.5=平均片重/0.15解方程。注意mg与g换算,碾碎前必须记录总重。\n\n〔老师强调/扣分点〕笔记★★★高频计算。0.5g主成分、90-110%范围、比例关系建立是核心。复方片剂实验必算。","options":{},"answer":"计算题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 计算(取样范围0.5g×90%-110%—真题计算相关)〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125136},{"id":"ya-305","course":"药物分析学","type":"计算记忆","chapter":"速通补充","number":"","title":"【计算】抗生素效价测定","answerText":"抗生素效价测定(必考计算):效价单位(U)=每mL或每mg中有效成分的量(如1mg青霉素G钠盐=1667单位)。效价换算按分子量:青霉素G钾盐效价=1667×356.4/372.5=1595U/mg。生物学法:①管碟法(琼脂抑菌圈大小)②浊度法(液体培养基细菌浊度),优点灵敏直观与疗效吻合、缺点操作复杂费时;适用已知/新发现/精制或粗制品。理化法:准确专属简便,但与疗效有偏差易受杂质干扰,仅适用结构明确已提纯抗生素,且需与生物学法吻合才能替代。\n\n〔老师强调/扣分点〕笔记★★★。效价单位定义、分子量换算公式(钾盐=1667×356.4/372.5)、生物学法vs理化法适用范围是高频。","options":{},"answer":"计算题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 计算/判断(抗生素效价U/mg—0615原题'效价单位U/mg'+知到'微生物检定vs理化优〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125137},{"id":"ya-306","course":"药物分析学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】重金属检查三/四法选择","answerText":"重金属检查三/四法选择(必考简答,真题):中国药典重金属检查——①第一法(硫代乙酰胺法)适用于水/稀酸或与水互溶有机溶剂、不含强配位基团药物(最常用);②炽灼后硫代乙酰胺法(第二法)适用于难溶于水/稀酸的有机药物及含强配位基团芳环/杂环药物(炽灼500-600℃);③硫化钠法(第三法)适用于溶于碱性水溶液而难溶于稀酸的药物,如磺胺类、巴比妥类;④第四法目的=消除难溶物的干扰。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂 理学","type":"选择","chapter":"综合","number":"7","title":"下列不良反应哪项不属于环磷酰胺的不良反应?","answerText":"","options":{"A":"中毒性肝炎","B":"中枢神经毒性","C":"胃肠道反应","D":"⻣髓抑制"},"answer":"B","mnemonic":"必背｜历年高频｜临床药理题库(学习通)","priority":"必背","isRecall":false,"sourceId":1,"addedAt":1780168174573,"examProb":"必考"},{"id":"lin-008","course":"临床药理学","type":"选择","chapter":"综合","number":"8","title":"阿霉素的主要不良反应为","answerText":"A肝脏损害;B神经毒性;C心脏毒性;D过敏反应","options":{"A":"肝脏损害","B":"神经毒性","C":"心脏毒性","D":"过敏反应"},"answer":"C","mnemonic":"必背｜历年高频｜临床药理题库(学习通)","priority":"必背","isRecall":false,"sourceId":1,"addedAt":1780168174574,"examProb":"必考"},{"id":"lin-013","course":"临床药理学","type":"选择","chapter":"综合","number":"1","title":"妊娠多少周内药物致畸最敏感","answerText":"","options":{"A":"3~10周左右","B":"3~12周左右","C":"2~12周左右","D":"1~3周左右"},"answer":"B","mnemonic":"了解｜临床药理题库(学习通)","priority":"了解","isRecall":false,"sourceId":1,"addedAt":1780168174579,"examProb":"了解"},{"id":"lin-014","course":"临床药理学","type":"选择","chapter":"综合","number":"2","title":"妊娠期用药易导致","answerText":"","options":{"A":"药物蓄积和药物中毒","B":"过敏反应","C":"对所有药物不敏感","D":"药效下降"},"answer":"A","mnemonic":"了解｜临床药理题库(学习通)","priority":"了解","isRecall":false,"sourceId":1,"addedAt":1780168174580,"examProb":"了解"},{"id":"lin-015","course":"临床药理学","type":"选择","chapter":"综合","number":"3","title":"药物在胎盘转运过程中不正确的是","answerText":"","options":{"A":"简单扩散","B":"特殊转运","C":"主动转运","D":"易化扩散"},"answer":"A","mnemonic":"了解｜临床药理题库(学习通)","priority":"了解","isRecall":false,"sourceId":1,"addedAt":1780168174581,"examProb":"了解"},{"id":"lin-016","course":"临床药理学","type":"选择","chapter":"综合","number":"4","title":"下述妊娠期合理用药原则不正确的是","answerText":"","options":{"A":"若病情必需,在妊娠早期孕妇必须应用对胎儿肯定有害甚至可能致 畸的药物,则应该先终止妊娠,然后再用药","B":"尽量联合用药以减少每种药物的剂量","C":"能用疗效肯定的老药就避免用尚难确定对胎儿有无不良影响的新药","D":"能用小剂量药物就避免用大剂量药物<#and#>早孕期间避免使用C类、D类 药物"},"answer":"B","mnemonic":"必背｜历年高频｜临床药理题库(学习通)","priority":"必背","isRecall":false,"sourceId":1,"addedAt":1780168174582,"examProb":"必考"},{"id":"lin-017","course":"临床药理学","type":"选择","chapter":"综合","n
