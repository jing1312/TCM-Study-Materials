8","course":"临床药理学","type":"名词解释记忆","chapter":"1. 总论","number":"lin-0008","title":"第三代胃动力药是","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"A⻄沙必利;B甲氧氯普胺;C多潘立酮;D硫糖铝","mnemonic":"重要｜临床药理试题库","addedAt":1781947616072},{"id":"tr-009","course":"临床药理学","type":"名词解释记忆","chapter":"1. 总论","number":"lin-0009","title":"非甾体抗炎免疫药","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"A对正常体温亦有降温作用; B对内脏平滑肌绞痛有效; C对临床常见的慢性钝痛有良好的镇痛效果; D能根治类⻛湿关节炎","mnemonic":"重要｜临床药理试题库","addedAt":1781947616072},{"id":"tr-010","course":"临床药理学","type":"名词解释记忆","chapter":"1. 总论","number":"lin-0010","title":"临床药理学","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"研究药物在人体内的作用规律和人体与药物间相互作用过程的交叉学科;","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","addedAt":1781947616072},{"id":"tr-011","course":"临床药理学","type":"名词解释记忆","chapter":"1. 总论","number":"lin-0011","title":"遗传药理学","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"研究DNA序列个体变异引起的药物反应异常的学科,通过研究机体的遗传因素在药物代谢、转运和效应中的作用,以阐明人体对外源性物质反应个体差异的原因,是药理学和遗传学相结合发展起来的边缘学科。","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","addedAt":1781947616072},{"id":"tr-012","course":"临床药理学","type":"名词解释记忆","chapter":"1. 总论","number":"lin-0012","title":"新药临床研究","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"人体进行的安全性与疗效的评价,是指任何在人体(病人或健康志愿者)进行药品的系统性研究,以证实或揭示试验用药品的作用及不良反应等,目的是确定试验用新药的疗效与安全性。","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","addedAt":1781947616072},{"id":"tr-013","course":"临床药理学","type":"名词解释记忆","chapter":"1. 总论","number":"lin-0013","title":"【名词解释】临床药理学定义","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"临床药理学定义(必考名词解释):临床药理学(Clinical Pharmacology)是研究药物在人体内的作用规律和人体与药物间相互作用过程的交叉学科。以药理学和临床医学为基础,阐述药代动力学、药效动力学、药物的毒副反应及相互作用的性质、机制和规律。研究对象必须以人体为研究对象(区别于基础药理学)。是药物治疗学的科学基础,目的是促进医药结合、基础与临床结合,指导临床合理用药、提高治疗水平。\n\n〔老师强调/扣分点〕笔记★★★高频名词解释。'以人体为研究对象'是与基础药理学的核心区别,定义必背。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 名词解释(临床药理学定义—真题回忆多年名解'临床药理学研究内容')〕｜参考答案据课堂/教材整理","addedAt":1781947616072},{"id":"tr-014","course":"临床药理学","type":"多选","chapter":"1. 总论","number":"lin-0014","title":"药物对胎儿的影响主要表现在","options":{"A":"脏器功能损害","B":"溶血","C":"发育缺陷","D":"致死","E":""},"answer":"ABCD","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-015","course":"临床药理学","type":"多选","chapter":"1. 总论","number":"lin-0015","title":"关于单核苷酸多态性形成的三种基因型的正确叙述包括","options":{"A":"wt/m为野生型杂合子","B":"wt/m为突变型杂合子 B、","C":"m/m为野生型杂合子","D":"wt/wt为野生型纯合子","E":""},"answer":"AD","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-016","course":"临床药理学","type":"多选","chapter":"1. 总论","number":"lin-0016","title":"临床药理学的主要研究内容","options":{"A":"临床药效学","B":"临床药代动力学","C":"药理毒理学研究","D":"药物相互作用","E":"药物临床试验与评价"},"answer":"ABCDE","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-017","course":"临床药理学","type":"多选","chapter":"1. 总论","number":"lin-0017","title":"氟脲嘧啶的适应症有","options":{"A":"恶性葡萄胎","B":"绒毛膜上皮细胞癌","C":"头颈部恶性肿瘤","D":"乳腺癌辅助治疗","E":""},"answer":"ABCD","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-018","course":"临床药理学","type":"多选","chapter":"1. 总论","number":"lin-0018","title":"孕妇使用氯霉素可引起胎儿","options":{"A":"可产生新生儿血小板减少症","B":"出现灰婴综合征","C":"可引起溶血,导致发生肝损害和核⻩疸","D":"第八对脑神经及肾脏受损","E":""},"answer":"BD","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-019","course":"临床药理学","type":"多选","chapter":"1. 总论","number":"lin-0019","title":"估算连续用药达稳态时间 第一章绪论 临床药理学的主要职能","options":{"A":"新药临床试验","B":"上市后药物再评价","C":"药品不良反应监测及药物警戒","D":"临床药理学教学与培训","E":"开展临床药理学专业服务"},"answer":"ABCDE","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-020","course":"临床药理学","type":"简答记忆","chapter":"1. 总论","number":"lin-0020","title":"东方人对酒精(乙醇)不耐受的原因","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"乙醛脱氢酶(ALDH)异常是乙醇不耐受的主要原因。因为东方人中线粒体ALDH2缺损发生率高,低红细胞ALDH活性与饮酒后心率加快呈负相关,ALDH2缺损者比无面部潮红正常ALDH2有更高的乙醛浓度,但它们乙醇浓度却相同。乙醇脱氢酶(ADH)异常是乙醇不耐受的次要原因,因为90%以上的东方人具有活性高于正常几倍的非典型ADH,而因高浓度乙醛引起面红发生率仅为50%。典型和非典型ADH携带者在乙 醇代谢速率无显著差异。","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","addedAt":1781947616072},{"id":"tr-021","course":"临床药理学","type":"简答记忆","chapter":"1. 总论","number":"lin-0021","title":"药物滥用的危害","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"对个人的危害:药物滥用者身心健康遭受催残。药物过量,常致中毒死亡。身体免疫力降低,引发各种感染。对社会的危害:药物滥用破坏家庭正常生活;药物滥用促发犯罪行为;药物滥用耗竭社会经济,阻碍社会发展","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","addedAt":1781947616072},{"id":"tr-022","course":"临床药理学","type":"简答记忆","chapter":"1. 总论","number":"lin-0022","title":"合理使用抗菌药的目的","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"提高感染的抗菌治疗水平保障患者用药安全减少细菌耐药性降低医药费用","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","addedAt":1781947616072},{"id":"tr-023","course":"临床药理学","type":"简答记忆","chapter":"1. 总论","number":"lin-0023","title":"老年人用药原则","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"选药原则:1.须有明确的用药指征2.选用最熟悉的药物3.避免应用不适于老年患者的药物4.选择合适的药物剂型5.慎用滋补药或抗衰老药用药准确合理:1.避免多重用药2.个体化给药剂量3.及时停药4.选择最佳给药时间5.嗜好控制6.提高用药依从性","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","addedAt":1781947616072},{"id":"tr-024","course":"临床药理学","type":"简答记忆","chapter":"1. 总论","number":"lin-0024","title":"细胞周期特异性与非特异性药物作用特点比较","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"周期特异性药物对癌细胞的作用慢而弱剂量反应曲线为渐近线,在血药浓度和用药时间的关系中,用药时间是主要因素,给药逄径以缓慢滴注为主。周期非特异性药物对癌细胞的作用快而强,剂量反应曲线呈直线关系,在血药浓度和用药时间的关系中,血药浓度是主要影响因素,采用静脉推注的方式为主。","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","addedAt":1781947616072},{"id":"tr-025","course":"临床药理学","type":"选择","chapter":"1. 总论","number":"lin-0025","title":"盐酸异丙肾上腺素在何种输液中不稳定","options":{"A":"0.9%氯化钠注射液","B":"平衡液","C":"糖盐水","D":"碳酸氢钠","E":"5%葡萄糖注射液"},"answer":"D","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-026","course":"临床药理学","type":"选择","chapter":"1. 总论","number":"lin-0026","title":"被称为「抗厌氧菌的头孢菌素」的是","options":{"A":"第一代头孢","B":"第四代头孢","C":"头霉素","D":"青霉素G","E":""},"answer":"C","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-04-09 72},{"id":"tr-034","course":"临床药理学","type":"判断","chapter":"2. 药物代谢动力学","number":"lin-0034","title":"磺胺类药物的血浆蛋白结合率较高,表格分布容积较小","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-035","course":"临床药理学","type":"判断","chapter":"2. 药物代谢动力学","number":"lin-0035","title":"不同人对同一药物的消除半衰期可有数倍之差,而CL在肝肾功能基本正常时均 相同","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"必背｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-036","course":"临床药理学","type":"判断","chapter":"2. 药物代谢动力学","number":"lin-0036","title":"Bayesian 反馈法取血点少,获得的个体药动学参数准确性高,对于药动学参数偏 离群体值的个体尤为适用","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-037","course":"临床药理学","type":"判断","chapter":"2. 药物代谢动力学","number":"lin-0037","title":"苯巴比妥重复给药时由于肝药酶的诱导作用可导致其多次给药半衰期比单次给 药的半衰期更长","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"必背｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-038","course":"临床药理学","type":"判断","chapter":"2. 药物代谢动力学","number":"lin-0038","title":"对于某些以肾排泄为主的药物,如地高辛,当肾功能严重受损时,其消除速率常数 K及CL显著增大,应根据肾功能修正参数和调整剂量,避免毒性反应","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-039","course":"临床药理学","type":"判断","chapter":"2. 药物代谢动力学","number":"lin-0039","title":"普鲁卡因胺给药后由于活性代谢物的存在可导致其效应半衰期明显长于普鲁卡 因胺的药动学消除半衰期","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"必背｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-040","course":"临床药理学","type":"判断","chapter":"2. 药物代谢动力学","number":"lin-0040","title":"一个药物做成缓释制剂后其半衰期明显延长","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"必背｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-041","course":"临床药理学","type":"判断","chapter":"2. 药物代谢动力学","number":"lin-0041","title":"房室模型与解剖结构及生理功能有关","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-042","course":"临床药理学","type":"判断","chapter":"2. 药物代谢动力学","number":"lin-0042","title":"遵循一级动力学消除的药物其半衰期及清除率与给药剂量无关","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"必背｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-043","course":"临床药理学","type":"名词解释记忆","chapter":"2. 药物代谢动力学","number":"lin-0043","title":"半衰期","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"药物的消除半衰期是指药物在体内消除一半所需要的时间,或血药浓度下降一半所需要 的时间。","mnemonic":"必背｜临床药理试题库","addedAt":1781947616072},{"id":"tr-044","course":"临床药理学","type":"名词解释记忆","chapter":"2. 药物代谢动力学","number":"lin-0044","title":"稳态血药浓度","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"临床用药若以一定的时间间隔,以相同的剂量多次给药,在 给药过程中血药浓度可逐次叠加,直至血药浓度维持在一定水平或在一定水平内上下波动,该范围即称为 稳态浓度,它有一个峰值(稳态时最大血药浓度),有一个谷值(稳态时最小血药浓 度)。","mnemonic":"必背｜历年高频｜临床药理试题库","addedAt":1781947616072},{"id":"tr-045","course":"临床药理学","type":"名词解释记忆","chapter":"2. 药物代谢动力学","number":"lin-0045","title":"生物利用度","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是药物吸收速度与程度的一种量度。生物利用度可通过测定药物进入身血液循环 的相对量表示吸收程度,用血药浓度以及达峰的时间表示吸收速度(1分","mnemonic":"必背｜临床药理试题库","addedAt":1781947616072},{"id":"tr-046","course":"临床药理学","type":"名词解释记忆","chapter":"2. 药物代谢动力学","number":"lin-0046","title":"表观分布容积","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是血药浓度与体内药物间的一个比值,意指体内药物按血浆中同样浓度分布时所 需的液体总容积,并不代表具体生理空间。反映药物分布的广泛程度或药物与组织成分的结合程 度。(1分","mnemonic":"重要｜临床药理试题库","addedAt":1781947616072},{"id":"tr-047","course":"临床药理学","type":"名词解释记忆","chapter":"2. 药物代谢动力学","number":"lin-0047","title":"首过消除","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"胃肠粘膜及肝脏的酶的代谢作用,使进入体循环的药量减少的效应","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","addedAt":1781947616072},{"id":"tr-048","course":"临床药理学","type":"名词解释记忆","chapter":"2. 药物代谢动力学","number":"lin-0048","title":"【名词解释】遗传药理学定义","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"遗传药理学定义(必考名词解释):研究遗传因素在药物代谢、转运和效应中的作用,阐明个体对外源性物质反应差异的学科,是药理学与遗传学相结合的边缘学科。研究重点:①药代动力学层面(基因变异对吸收/分布/代谢/清除的影响)②药效动力学层面(基因变异对药物靶点敏感性或作用通路的影响)。与药物基因组学区别:遗传药理学更聚焦单基因/少数基因,药物基因组学着眼全基因组。\n\n〔老师强调/扣分点〕笔记★★★高频名词解释。定义(遗传因素影响药物反应的边缘学科)、与药物基因组学的区别是核心。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 名解(★遗传药理学定义—真题名解原题'遗传药理学'(2022/2019/2018多年))〕｜参考答案据课堂/教材整理","addedAt":1781947616072},{"id":"tr-049","course":"临床药理学","type":"名词解释记忆","chapter":"2. 药物代谢动力学","number":"lin-0049","title":"首关效应","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"又称首过消除，是指某些药物首次通过肠壁或肝脏时被其中的酶所代谢，使体循环要量减少的现象。药物在肠道吸收后，通过肝门静脉进入肝脏，部分药物在通过肠黏膜及肝脏时被灭活代谢，使进入体循环的药量减少，药效也随之下降的现象。","mnemonic":"重要｜临床药理-DY.docx","addedAt":1781947616072},{"id":"tr-050","course":"临床药理学","type":"名词解释记忆","chapter":"2. 药物代谢动力学","number":"lin-0050","title":"总清除率CL","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"又称血浆清除率，是指体内诸消除器官在单位时间内清除药物的血浆容积。单位时间内有多少毫升血中所含的药物被清除，是正确估算药物从体内消除速度的唯一参数。","mnemonic":"重要｜临床药理-DY.docx","addedAt":1781947616072},{"id":"tr-051","course":"临床药理学","type":"名词解释记忆","chapter":"2. 药物代谢动力学","number":"lin-0051","title":"有效血药浓度范围","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"指最小有效浓度和最小治疗浓度之间的范围。","mnemonic":"重要｜临床药理-DY.docx","addedAt":1781947616072},{"id":"tr-052","course":"临床药理学","type":"多选","chapter":"2. 药物代谢动力学","number":"lin-0052","title":"通过表观分布容积,可以","options":{"A":"估算机体血容量及体液量","B":"推测药物在体内的分布范围","C":"估算静滴药物时的首次负荷量","D":"估算药物的给药间隔","E":""},"answer":"ABC","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-053","course":"临床药理学","type":"多选","chapter":"2. 药物代谢动力学","number":"lin-0053","title":"对于稳态一点法以下描述正确的是","options":{"A":"该药物必须遵循线性药代动力学","B":"稳态条件下采血","C":"对半衰期长的药物特别有利","D":"通常检测偏谷浓度","E":""},"answer":"ABD","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-054","course":"临床药理学","type":"多选","chapter":"2. 药物代谢动力学","number":"lin-0054","title":"反映药物吸收进入体循环的速度及程度的参数包括","options":{"A":"t1/2","B":"tmax","C":"Cmax","D":"AUC","E":"CL"},"answer":"BCD","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-055","course":"临床药理学","type":"多选","chapter":"2. 药物代谢动力学","number":"lin-0055","title":"遗传药理学的研究范围包括","options":{"A":"药物代谢酶多态性、转运载体多态性和受体多态性","B":"遗传变异对药物反应的影响","C":"遗传变异对药代动力学和药效动力学的影响","D":"对药物有无遗传性异常反应的预测","E":""},"answer":"ABCD","answerText":"","mnemonic":"必背｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-056","course":"临床药理学","type":"多选","chapter":"2. 药物代谢动力学","number":"lin-0056","title":"当连续多次给药达到稳态时,以下描述正确的有","options":{"A":"体内消除药量与所给药量相等","B":"达稳态时间与给药间隔有关","C":"达稳态时间与t1/2成正比","D":"坪值浓度与给药剂量有关","E":"稳态浓度波动与给药间隔有关"},"answer":"CDE","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-057","course":"临床药理学","type":"多选","chapter":"2. 药物代谢动力学","number":"lin-0057","title":"影响药物在胃肠道吸收的因素包括","options":{"A":"胃肠道pH环境","B":"胃肠道蠕动快慢","C":"胃肠内容物","D":"首过效应","E":"胃肠道黏膜功能受损"},"answer":"ABCDE","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-058","course":"临床药理学","type":"多选","chapter":"2. 药物代谢动力学","number":"lin-0058","title":"引起药物首过效应的主要因素有","options":{"A":"肠黏膜上皮细胞中代谢酶","B":"肠黏膜上皮细胞中外排转运体","C":"肝脏代谢酶","D":"肾脏代谢酶","E":""},"answer":"ABC","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-059","course":"临床药理学","type":"多选","chapter":"2. 药物代谢动力学","number":"lin-0059","title":"以下给药方式可以避免首过效应的有","options":{"A":"舌下给药","B":"口服给药","C":"静脉给药","D":"直肠给药","E":"呼吸道吸入给药"},"answer":"ACDE","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-060","course":"临床药理学","type":"简答记忆","chapter":"2. 药物代谢动力学","number":"lin-0060","title":"抗心律失常药临床应用原则","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答:不同类型的抗心律失常药其临床适应症各有不同,又易引起不同 类型的不良反应,甚至发生致心律失常作用。抗心律失常药的合理应用,应注意以下原则: 1认识并消除各种心律失常的促发因素。如患者身体内电解质的紊乱、心肌缺血缺氧等。 2明确诊断,按临床适应症合理选药。不同类型抗心律失常药电生理作用存在差异,故临床适应症各有不 同。 3掌握患者情况,实施个体化治疗方案。临床不同病理因素的影响,可能改变药物体内过 程,以致在常规剂量下,可能发生血药浓度偏高的现象,故必须强调按患者的具体情况,个体化的确定用 药方案。 4注意用药禁忌,减少危险因素。不同抗心律失常药的药理作用存在差异,决定它们有着各不相同的临床 用药禁忌,为减少发生严重不良反应的危险,需重视临床用药的禁忌。","mnemonic":"重要｜临床药理试题库","addedAt":1781947616072},{"id":"tr-061","course":"临床药理学","type":"简答记忆","chapter":"2. 药物代谢动力学","number":"lin-0061","title":"影响药物作用的药物方面的因素","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答:1剂量问题:通常按照在一定时间内给药总剂量不变的原则,两次给药之间的间隔时间较 长,则每次的用药量就较大,而血药浓度波动也较大。最大浓度不能超过最低中毒浓度,最低浓度不应低 于最小有效浓度。 2药物的剂型问题:同一药物的不同剂型吸收速率和分布的范围可以不同,从 而影响药物起效时间、作用强度和维持时间等。一般来说,吸收快的剂型药物血浓度的峰值较高,单位时 间内排出也较多,故维持时间较短。吸收太慢则血药峰浓度可能太低而影响疗效。 3制药工艺问题:提取和纯化等制药工艺的粗精,影响药物杂质的含量,从而影响药物本身的作用;制药工艺的差异, 包括所用赋形剂的不同,可能导致药物颗粒大小不同而影响药物吸收。 4复方制剂(成药)问题:复方制剂实即联合用药的一种方便病人服用的制剂,应该考虑药物的相互作用。","mnemonic":"重要｜临床药理试题库","addedAt":1781947616072},{"id":"tr-062","course":"临床药理学","type":"简答记忆","chapter":"2. 药物代谢动力学","number":"lin-0062","title":"一级速率过程的特点","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"一级速率过程是指某一时刻体内药量转化的速率与体内当时药量成正比, 用方程表示为:dX/dt=-kX.其特点为:1半衰期与剂量无关;2药物转运呈指数衰减,每 单位时间内转运的百分比不变;3一次给药后药时曲线下面积与剂量成正比。","mnemonic":"重要｜临床药理试题库","addedAt":1781947616072},{"id":"tr-063","course":"临床药理学","type":"简答记忆","chapter":"2. 药物代谢动力学","number":"lin-0063","title":"简述抗菌药按PK/PD的三大分类及评价指标。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"①浓度依赖型(氨基糖苷类、氟喹诺酮类、两性霉素B、甲硝唑;指标AUC/MIC、Cmax/MIC);②时间依赖型(短PAE)(指标%T>MIC,即血药浓度高于MIC的时间占给药间隔百分比);③时间依赖型(长PAE)。","mnemonic":"🆕课堂强调·补充｜〔2026-04-09 09:38 [30:27、37:21]〕｜非真题原题·据课堂整理","addedAt":1781947616072},{"id":"tr-064","course":"临床药理学","type":"简答记忆","chapter":"2. 药物代谢动力学","number":"lin-0064","title":"反映药物吸收速度与吸收程度的参数分别是什么?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"吸收速度:达峰时间Tmax、峰浓度Cmax;吸收程度:AUC(药-时曲线下面积)。","mnemonic":"🆕课堂强调·补充｜〔2026-03-02 13:48 [34:06]〕｜非真题原题·据课堂整理","addedAt":1781947616072},{"id":"tr-065","course":"临床药理学","type":"简答记忆","chapter":"2. 药物代谢动力学","number":"lin-0065","title":"【简答】房室模型","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"房室模型(Compartment Model,必考):将人体按动力学特点划分若干房室(转运速率相同的部位视为同一房室),为开放性房室系统(药物可进出),与解剖部位无关。①一室模型——药物快速均匀分布全身,消除曲线呈单指数下降,C=C0·e^(-ke·t)②二室模型——初期快速分布到血流丰富的中央室(心/肝/肾),后期缓慢分布到周边室(肌肉/脂肪),消除曲线呈双指数特征。一致性评价:通过BE生物等效性试验比较AUC、Cmax验证仿制药与原研药等效。\n\n〔老师强调/扣分点〕笔记★★★★高频。一室vs二室模型(单指数vs双指数)、中央室(心肝肾)vs周边室(肌肉脂肪)、房室与解剖部位无关是核心。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 理解/简答(房室模型—真题选择+药动学基础)〕｜参考答案据课堂/教材整理","addedAt":1781947616072},{"id":"tr-066","course":"临床药理学","type":"选择","chapter":"2. 药物代谢动力学","number":"lin-0066","title":"以下哪一个药物的主要清除途径是肝脏","options":{"A":"阿莫⻄林","B":"头孢呋辛","C":"美罗培南","D":"罗红霉素","E":"庆大霉素"},"answer":"D","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-067","course":"临床药理学","type":"选择","chapter":"2. 药物代谢动力学","number":"lin-0067","title":"在以下碳⻘霉烯类抗菌药物中,哪一个药物的血半衰期最长","options":{"A":"亚胺培南","B":"美罗培南","C":"帕尼培南","D":"厄他培南","E":"比阿培南"},"answer":"D","answerText":"","mnemonic":"必背｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-068","course":"临床药理学","type":"选择","chapter":"2. 药物代谢动力学","number":"lin-0068","title":"临床上监测普鲁卡因胺的浓度时一般要求测定","options":{"A":"普鲁卡因胺","B":"普鲁卡因胺及其活性代谢物","C":"普鲁卡因胺的活性代谢物","D":"普鲁卡因胺的游离药物浓度","E":""},"answer":"B","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-069","course":"临床药理学","type":"选择","chapter":"2. 药物代谢动力学","number":"lin-0069","title":"已知茶碱的半衰期t1/2=7.7h,某患者按每8h给药一次,最少给药()次后体内茶碱药 物浓度能达到稳态","options":{"A":"2","B":"4","C":"6","D":"8","E":""},"answer":"B","answerText":"","mnemonic":"必背｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-070","course":"临床药理学","type":"选择","chapter":"2. 药物代谢动力学","number":"lin-0070","title":"药物在胎盘转运过程中不正确的是","options":{"A":"简单扩散","B":"特殊转运","C":"主动转运","D":"易化扩散","E":""},"answer":"A","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-071","course":"临床药理学","type":"选择","chapter":"2. 药物代谢动力学","number":"lin-0071","title":"血管外给药进行药代动力学研究时,样本采集描述错误的有","op r-119","course":"临床药理学","type":"判断","chapter":"4. 影响药物作用的因素","number":"lin-0119","title":"安慰剂就是把没有药理活性的物质如乳糖、淀粉等,用作临床对照试验中的阴 性对照。安慰剂在临床上不会产生任何效应","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"必背｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-120","course":"临床药理学","type":"名词解释记忆","chapter":"4. 影响药物作用的因素","number":"lin-0120","title":"药物滥用","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"广义的药物滥用是指不合理应用药物。限定意义的药物滥用,指的是与医疗、预防和 保健目的无关的反复大量使用有依赖性特性(或称依赖潜能)的药物,用药者采用自身给药的方式 ,导致精神依赖性和生理依赖性,造成精神紊乱和出现一系列异常行为。","mnemonic":"必背｜临床药理试题库","addedAt":1781947616072},{"id":"tr-121","course":"临床药理学","type":"简答记忆","chapter":"4. 影响药物作用的因素","number":"lin-0121","title":"影响药物作用的因素有哪些","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"1.药物方面的因素: 1剂量问题; 2药物剂型问题; 3制药工艺问题:4复方制剂问题。2 .机体方面的因素:1年龄;2性别;3营养状态;4精神因素。5疾病因素;6遗传因素。3.环境条件方面的因素: 1给药途径;2时间药理学因素;3连续用药;4联合用药和药物的相互作用;5吸烟、嗜酒与环境污染问题","mnemonic":"必背｜历年高频｜临床药理试题库","addedAt":1781947616072},{"id":"tr-122","course":"临床药理学","type":"简答记忆","chapter":"4. 影响药物作用的因素","number":"lin-0122","title":"安慰剂对照在药物评价中的作用","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"1.随机对照试验中作阴性对照,使新药有可能在盲法条件下评价其安全有效性2.在有阳性对照时,同时设安慰剂对照,监察测试方法灵敏度3.排除精神因素在药物治疗中的作用4.排除疾病本身的自发变化。","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","addedAt":1781947616072},{"id":"tr-123","course":"临床药理学","type":"选择","chapter":"4. 影响药物作用的因素","number":"lin-0123","title":"研究表明,与许多药物在显效和毒性方面的个体差异有关的主要因素是","options":{"A":"药物效应基因的遗传多态性","B":"药物基因","C":"药物效应基因","D":"药物效应基因种类","E":""},"answer":"A","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-124","course":"临床药理学","type":"选择","chapter":"4. 影响药物作用的因素","number":"lin-0124","title":"遗传多态性是指","options":{"A":"同一基因位点上多个等位基因引起","B":"同一基因位点上单个等位基因引起","C":"不同基因位点上单个等位基因引起","D":"不同基因位点上多个等位基因引起","E":""},"answer":"A","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-125","course":"临床药理学","type":"选择","chap 制霉菌素","C":"酮康唑","D":"灰黄霉素","E":"以上都不是"},"answer":"D","answerText":"","mnemonic":"重要｜临床药理-DY.docx","addedAt":1781947616072},{"id":"tr-132","course":"临床药理学","type":"选择","chapter":"4. 影响药物作用的因素","number":"lin-0132","title":"下列关于老年患者用药基本原则叙述不正确 的是( )A可用可不用的药以不用为好B宜选用缓、控释药物制剂C用药期间应注意食物的选择","options":{"A":"","B":"","C":"","D":"尽量简化治疗方案E注意饮食的合理选择和搭配","E":""},"answer":"B","answerText":"","mnemonic":"重要｜临床药理-DY.docx","addedAt":1781947616072},{"id":"tr-133","course":"临床药理学","type":"选择","chapter":"4. 影响药物作用的因素","number":"lin-0133","title":"老年患者抗菌药物使用原则描述正确的是：","options":{"A":"老年患者常有肝功障碍，主要经肝灭活的抗生 素如氯霉素、红霉素、四环素等，应慎用或禁用。","B":"老年患者有肾功能减退，药物肾清除减慢，氨 基苷类、四环素类、氨苄西林、羧苄西林，应根据肾 功减退情况，适当减量或延长给药间隔时间。","C":"老年患者患感染性疾病，宜选用青霉素类和头 孢菌素类、氟喹诺酮类杀菌药。","D":"抗菌药物一旦选定，在疗效未确定之前，疗程 不应少于5d, 不超过14d。E以上都是","E":""},"answer":"E","answerText":"","mnemonic":"重要｜临床药理-DY.docx","addedAt":1781947616072},{"id":"tr-134","course":"临床药理学","type":"选择","chapter":"4. 影响药物作用的因素","number":"lin-0134","title":"对于新生儿出血，宜选用：","options":{"A":"维生素K","B":"氨基己酸","C":"氨甲苯酸","D":"氨甲环酸","E":"抑肽酶"},"answer":"A","answerText":"","mnemonic":"重要｜临床药理-DY.docx","addedAt":1781947616072},{"id":"tr-135","course":"临床药理学","type":"选择","chapter":"4. 影响药物作用的因素","number":"lin-0135","title":"老年患者给药剂量一般规定只用成人剂量的：","options":{"A":"1/3","B":"1/2","C":"2/5","D":"3/4","E":"3/5"},"answer":"D","answerText":"","mnemonic":"重要｜临药OCR内联解析","addedAt":1781947616072},{"id":"tr-136","course":"临床药理学","type":"判断","chapter":"5. 药物不良反应与药物警戒","number":"lin-0136","title":"因过量服用药品而发生的毒性反应属于药品不良反应。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-03-23 14:38 [07:23]〕｜非真题原题·据课堂整理","addedAt":1781947616072},{"id":"tr-137","course":"临床药理学","type":"判断","chapter":"5. 药物不良反应与药物警戒","number":"lin-0137","title":"正常用量下因个体差异等引起的毒性作用属于药品不良反应。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-03-23 14:38 [05:59]〕｜非真题原题·据课堂整理","addedAt":1781947616072},{"id":"tr-138","course":"临床药理学","type":"判断","chapter":"5. 药物不良反应与药物警戒","number":"lin-0138","title":"变态反应(过敏反应)通常发生于首次用药。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-03-23 14:38 [12:48]〕｜非真题原题·据课堂整理","addedAt":1781947616072},{"id":"tr-139","course":"临床药理学","type":"判断","chapter":"5. 药物不良反应与药物警戒","number":"lin-0139","title":"药源性疾病的范围比药物不良反应更广。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-03-23 15:38 [41:47]〕｜非真题原题·据课堂整理","addedAt":1781947616072},{"id":"tr-140","course":"临床药理学","type":"判断","chapter":"5. 药物不良反应与药物警戒","number":"lin-0140","title":"药物警戒只针对药品上市后的不良反应监测。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 13:48 [13:48]〕｜非真题原题·据课堂整理","addedAt":1781947616072},{"id":"tr-141","course":"临床药理学","type":"名词解释记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0141","title":"不良反应","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是药物在正常用法和用量时由药物引起的不良和不期望产生的反应包括副作用毒性 反应、依赖性、特异质反应、过敏反应、致畸、致癌和致突变反应。 二、填空(请将正确答案填在横线上,每空","mnemonic":"必背｜历年高频｜临床药理试题库","addedAt":1781947616072},{"id":"tr-142","course":"临床药理学","type":"名词解释记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0142","title":"⻬多夫定的主要不良反应","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"A⻣髓抑制;B末梢神经炎;C胰腺炎;D过敏反应","mnemonic":"必背｜历年高频｜临床药理试题库","addedAt":1781947616072},{"id":"tr-143","course":"临床药理学","type":"名词解释记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0143","title":"后遗效应","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"停药后仍残留在体内的低于最低有效治疗浓度的药物所引起的药物效应。药 物的后遗效应可以是短暂的或是持久的。(1分","mnemonic":"重要｜临床药理试题库","addedAt":1781947616072},{"id":"tr-144","course":"临床药理学","type":"名词解释记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0144","title":"药物依赖性","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"药物滥用条件下,机体与滥用药物相互作用所形成的一种特殊精神状态,有些滥用药物还会使机体形成一种特殊身体状态。","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","addedAt":1781947616072},{"id":"tr-145","course":"临床药理学","type":"名词解释记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0145","title":"药源性疾病","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"人们在应用药物预防、治疗和诊断疾病时,因药物本身的固有作用、药物之间的相互作用以及药物的不合理使用,而导致机体组织器官发生功能性或器质性损害,并具有一系列临床症状和体征的疾病。","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","addedAt":1781947616072},{"id":"tr-146","course":"临床药理学","type":"名词解释记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0146","title":"药品不良反应（ADR）","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"在正常的用法用量下,用于预防、诊断、治疗疾病或调节生理功能时,出现的与用药目的无关的有害反应。【三关键词】正常用法用量／与用药目的无关／有害反应。","mnemonic":"🆕课堂强调·补充｜〔2026-03-23 13:48 [27:53]〕｜非真题原题·据课堂整理","addedAt":1781947616072},{"id":"tr-147","course":"临床药理学","type":"名词解释记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0147","title":"不良事件（AE）","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"用药病人或临床研究对象在用药过程中发生的任何不幸的医学事件,但该事件不一定与治疗有因果关系。与ADR的根本区别:是否必须有因果关系。","mnemonic":"🆕课堂强调·补充｜〔2026-03-23 13:48 [31:51]〕｜非真题原题·据课堂整理","addedAt":1781947616072},{"id":"tr-148","course":"临床药理学","type":"名词解释记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0148","title":"毒性作用","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"在正常用法用量下,由于个体差异、病理状态或合并用药使敏感性增加而引起的有害反应,属于ADR。注意:因过量服用引起的毒性反应不属于ADR。","mnemonic":"🆕课堂强调·补充｜〔2026-03-23 14:38 [05:39]〕｜非真题原题·据课堂整理","addedAt":1781947616072},{"id":"tr-149","course":"临床药理学","type":"名词解释记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0149","title":"药物警戒","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"与发现、评估、理解和预防药物不良反应或任何其他药物相关问题有关的科学研究与活动;贯穿药品研发设计到上市后的始终,是主动手段。","mnemonic":"🆕课堂强调·补充(对比角度:贯穿研发→上市后始终·主动)｜〔2026-03-25 13:48 [13:19]〕｜非真题原题·据课堂整理","addedAt":1781947616072},{"id":"tr-150","course":"临床药理学","type":"名词解释记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0150","title":"抗生素后效应（PAE）","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"细菌与抗菌药短暂接触后,在药物浓度降至MIC以下甚至消失后,细菌生长仍受到持续抑制的效应(类比后遗效应)。老师明确「经常会考到它」。","mnemonic":"🆕课堂强调·补充｜〔2026-04-09 09:38 [29:36]〕｜非真题原题·据课堂整理","addedAt":1781947616072},{"id":"tr-151","course":"临床药理学","type":"名词解释记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0151","title":"药物滥用／药物依赖性","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"药物滥用:与医疗目的无关、反复大量地自行使用药物(追求快感)。药物依赖性:分精神依赖性与身体(生理)依赖性,后者表现为戒断反应。","mnemonic":"🆕课堂强调·补充｜〔2026-04-02 09:38 [10:18]〕〔2026-04-02 09:38 [15:03]〕｜非真题原题·据课堂整理","addedAt":1781947616072},{"id":"tr-152","course":"临床药理学","type":"名词解释记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0152","title":"【名词解释】重大药源性事件","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"重大药源性事件(必考案例):①氨基匹林——退热→粒细胞缺乏症死亡2000余人②乙烯雌酚——先兆流产→少女阴道腺癌300余例③二硝基酚——减肥→白内障/骨髓抑制(177人死亡)④PPA(苯丙醇胺)感冒药→脑出血⑤西伐他汀(拜斯亭)→心血管意外⑥马兜铃酸(关木通)→肾功能衰竭。这些事件推动临床药理学发展。\n\n〔老师强调/扣分点〕笔记★★★高频案例。每个药源性事件的'药物—用途—危害'对应关系(乙烯雌酚→阴道腺癌、马兜铃酸→肾衰)是核心考点。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 案例/填空(重大药源性事件:氨基匹林/乙烯雌酚/反应停—真题论述案例背景+药源性疾病名解)〕｜参考答案据课堂/教材整理","addedAt":1781947616072},{"id":"tr-153","course":"临床药理学","type":"名词解释记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0153","title":"副作用（side reaction）","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"由于选择性低，药理效应涉及多个器官，当一效应作用用作为治疗目的时，其他效应就成为副反应。","mnemonic":"重要｜临床药理-DY.docx","addedAt":1781947616072},{"id":"tr-154","course":"临床药理学","type":"多选","chapter":"5. 药物不良反应与药物警戒","number":"lin-0154","title":"下列不属于吉非替尼的不良反应有","options":{"A":"心脏毒性","B":"痤疮","C":"腹泻","D":"白细胞减少症","E":""},"answer":"AD","answerText":"","mnemonic":"必背｜历年高频｜临床药理题库(学习通)","addedAt":1781947616072},{"id":"tr-155","course":"临床药理学","type":"简答记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0155","title":"强心甙的不良反应及其防治","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答:1不良反应:A.心脏毒性:强心甙中毒可表现我各种不 同类型的心律失常;B.胃肠道反应:为早发症状,如恶心、呕吐等;C.神经系症状:头 痛、头晕、嗜睡等,也可发生视觉障碍及色觉障碍。 2防治:个体化用药方案是预防强心甙中毒 的关键。及早发现并消除电解质紊乱等中毒促发因素,并根据血药浓度合理调整用药剂量,是有效的预防 措施。治疗则是根据中毒症状的类型和严重程度,采取相应措施。","mnemonic":"必背｜历年高频｜临床药理试题库","addedAt":1781947616072},{"id":"tr-156","course":"临床药理学","type":"简答记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0156","title":"⻘霉素过敏反应的抢救和预防","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答:抢救:过敏反应以皮疹最常见,以过敏性休克最严 重。过敏性休克一旦发生,必须就地抢救,立即给病人肌注","mnemonic":"重要｜临床药理试题库","addedAt":1781947616072},{"id":"tr-157","course":"临床药理学","type":"简答记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0157","title":"诊断ADR的主要依据、ADR的可能度及ADR判断的方法","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答:ADR即 adverse reaction,不良反应。 依据:1是否以前对这种反应有结论性的报告,即是否是在动物试验或临床研究和应用中已经肯 定过的反应;2这种不良反应是否发生在被怀疑的药物应用之后(时序性);3在停止使用被怀疑的药物 (撤药试验)或者是用了特异性对抗药后不良反应获得改善,4再次使用被怀疑的药物后(包括皮试)这 种不良反应又发生(激惹现象);5是否有药物以外的可疑因素引起这种反应;6在应用安慰剂后,这种 反应是否仍然发生;7是否从血液或其它体液中检测到了可引起毒性的药物浓度;8当药物剂量增加或降 低时,反应是否也随之加重和改善(激惹现象);9病人在以前是否在同一药物或相似药物之后有相同的 反应;10反应是否被任何客观证据证实。 可能度:在确定药物和不良反应或药源性疾病之 间的因果关系时,通常根据下述标准进行分类:1肯定:用药后符合合理的时间顺序;从体液或组织内测 得的药物浓度获得证实;符合被怀疑药物的反应特点;停止用药后即可改善,或者再次用药又发生;不能 由病人的疾病所解释。 2很可能:在药物应用之后由一个合理的时间顺序;符合药物已知的反应特点; 经停药证实,当未经再给药证实;病人的疾病不能解释。3可能:有合理的时间顺序;可能符合,也可能 不符合已知的反应方式;可以由患者的临床表现或已知的药物反应特征解释。 4条件的:时间顺序合 理;与已知的不良反应不符;不能以疾病来解释。 5可疑的:反应很可能时由被怀疑药物以外的其它因 素引起。 ADR判断的方法:包括临床医学中的常规诊断方法和ADR判断的专属性方法,确 定病例报告中药物与可疑ADR之间因果关系有四种方法,即综合判断法、描述性系统评价法、记分评定 法、统计学分析判断法。统计分析方法包括泊松分布判断法、⻉叶斯判别法、利用死亡率统计调查、干预 试验法等。","mnemonic":"重要｜临床药理试题库","addedAt":1781947616072},{"id":"tr-158","course":"临床药理学","type":"简答记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0158","title":"抗菌药物临床应用的基本原则","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"1重视和加强病原学检查,尽早确立感染性疾病的病原诊断,严 格掌握适应症2熟悉药物的抗菌活性,药代动力学特点,适应症和不良反应3按照患者的 生理、病理及免疫状态等和利用药 4应注意抗菌药物的使用应严加控制或尽量避免的情况: 如病 毒性感染或发热不明者不宜轻易采用;皮肤粘膜等局部应用抗菌药应避免,因易引起过敏或产生耐药;选 用适当的给药方案和疗程;加强宣传教育,建立相应组织,纠正不合理 使用抗菌药物等。","mnemonic":"必背｜临床药理试题库","addedAt":1781947616072},{"id":"tr-159","course":"临床药理学","type":"简答记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0159","title":"药物不良反应和药源性疾病的治疗原则","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"133 答:药物不良反应和药源性疾病的治疗原则为: 药源性疾病的处理,原则上是若怀疑出现的 病征是由药物所引起,而又不能明确定为何种药物时,可能的话,首先是停止应用某种药物。这样做不但 可能及时终止致病药物继续损害机体,而且有助于诊断。停药后,临床症状减轻或缓解可提示疾病为药源 性。此后根据病情采取治疗方案。A.由于药源性疾病多有自限性的特征,停药后无需特殊处理,待药物自 体内消除后,可以缓解。B.症状严重时须进行对症治疗,如致病药物已很明确,可选用特异性拮 抗药。若是药物变态反应,应将致病药物告知病人防治日后再度复发。","mnemonic":"必背｜临床药理试题库","addedAt":1781947616072},{"id":"tr-160","course":"临床药理学","type":"简答记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0160","title":"细菌对⻘霉素产生耐药性的机制","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答:细菌对⻘霉素产生耐药性主要有三种机制:1细菌产生β内 酰胺酶,使⻘霉素类水解灭活;2细菌体内⻘霉素类作用靶位-⻘霉素结合蛋白发生改变,致药 物不能与之结合而产生抗菌作用;3细菌细胞壁对⻘霉素类的渗透性减低。其中以第一种 机制最为常见,也最重要。","mnemonic":"重要｜临床药理试题库","addedAt":1781947616072},{"id":"tr-161","course":"临床药理学","type":"简答记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0161","title":"与剂量有关和无关的药物不良反应特点","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"与剂量有关(A型反应 与剂量无关(B型反应) 1 反应性质 定量 定性 2可预见性 可 不可 3发生率 高 低 4死亡率 低 高 5肝脏或肾脏功能障碍 毒性增加 不影响 6预防 调整剂量 避免用药 7治疗 调整计量 停止用药","mnemonic":"必背｜临床药理试题库","addedAt":1781947616072},{"id":"tr-162","course":"临床药理学","type":"简答记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0162","title":"阿司匹林的药理作用及其机制、不良反应","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"1)药理作用及其机制:1抗炎、抗⻛湿作用:主要是 由于其抑制PG合成酶,减少PG的生成;此外通过抑制白细胞凝聚,减少激肽的形成、抑制透明质酸酶、 抑制血小板聚集、及钙的转移而发挥抗炎作用;2解热作用:抑制PGs合成而发挥解热作用,能 降低发热者的体温,对体温正常者几乎无影响,对症而步对因;3镇痛作用:减少炎症部位PGs 的生成,故有明显镇痛作用,对慢性疼痛效果良好,对尖锐性一过性疼痛无效;4影响血栓形 成:抑制COX活性,减少血小板中TXA2的生成,有抗血小板聚集和抗血栓形成作用。(1分不良反 应:1胃肠道反应:短期用不良反应少,用量较大时,常易发生⻝欲不振、恶心呕吐;严重时消化道出 血,长期服用溃疡发生率较高; 2对血液系统的影响:用药后出血时间延长,大剂量时易引起血 小板减少症,维生素K可防治之;3对肝、肾的影响:表现为转氨酶升高,肝细胞坏死。PG有扩 张血管维持肾血流的作用,长期使用可出现不同程度的肾损伤;(1分 4水杨酸反应:应用本品量过大 时,可出现耳鸣、头痛、头晕、视听减退,重者有精神紊乱、酸碱平衡障碍和出血等; 5过敏反 应:较常见的是哮喘,严重的可致死。 6其他不良反应 4","mnemonic":"必背｜历年高频｜临床药理试题库","addedAt":1781947616072},{"id":"tr-163","course":"临床药理学","type":"简答记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0163","title":"A型与B型不良反应的特点","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"A型反应(augmented):是指由于药品的药理作用增强而引起的不良反应。其程度轻重与用药剂量有关,一般容易预测,发生率较高而死亡率较低。副作用、毒性反应、继发反应、后遗效应和停药反应等均属此类型。B型反应(bizarre):是指与药品本身药理作用无关的异常反应。通常难以预测在具体病人身上是否会出现。在药物研究阶段的常规毒理学试验中难以发现,一般与用药剂量无关,发生率低但死亡率较高。特异质反应和过敏反应属于此类。","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","addedAt":1781947616072},{"id":"tr-164","course":"临床药理学","type":"简答记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0164","title":"药物警戒与药品不良反应监测的区别(「四点不一样」)。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"方法不一样(警戒主动、监测相对被动)、内容不一样、时间范围不一样(警戒贯穿研发到上市后始终,监测仅上市后)、(监测)对象不一样。","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 13:48 [15:16]〕｜非真题原题·据课堂整理","addedAt":1781947616072},{"id":"tr-165","course":"临床药理学","type":"简答记忆","chapter":"5. 药物不良反应与药物警戒","number":"lin-0165","title":"简述药物滥用者戒治的三个环节。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"①脱毒(最关键,用替代递减疗法,如美沙酮/可待因,可乐定快速脱瘾)→②预防复吸(主要解决精神依赖性)→③重返社会。三环节须连贯进行。","mnemonic":"🆕课堂强调·补充｜〔2026-04-02 10:28 [29:38]〕｜非真题原题·据课堂整理","addedAt":1781947616073},{"id":"tr-166","course":"临床药理学","type":"选择","chapter":"5. 药物不良反应与药物警戒","number":"lin-0166","title":"妊娠多少周内药物致畸最敏感","options":{"A":"3~10周左右","B":"3~12周左右","C":"2~12周左右","D":"1~3周左右","E":""},"answer":"B","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-167","course":"临床药理学","type":"选择","chapter":"5. 药物不良反应与药物警戒","number":"lin-0167","title":"哪个药品停药后不会出现戒断症状","options":{"A":"大麻","B":"古柯叶","C":"哌替啶","D":"普鲁卡因胺","E":"美沙酮"},"answer":"D","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-168","course":"临床药理学","type":"选择","chapter":"5. 药物不良反应与药物警戒","number":"lin-0168","title":"药物依赖性包括","options":{"A":"身体依赖性和精神依赖性","B":"药物耐受性和病人依从性","C":"精神依赖性和病人依从性","D":"中枢兴奋性和精神依赖性","E":"成瘾性和病人不 依从性"},"answer":"A","answerText":"","mnemonic":"必背｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-169","course":"临床药理学","type":"选择","chapter":"5. 药物不良反应与药物警戒","number":"lin-0169","title":"A型不良反应特点是","options":{"A":"不可预见","B":"可预见","C":"发生率低","D":"死亡率高","E":""},"answer":"B","answerText":"","mn 有致畸作用的药物是（ ） （5）可引起药源性哮喘的药物是（ ）","options":{"A":"氯霉素","B":"雌激素类","C":"奎尼丁","D":"氯丙嗪","E":"阿司匹林"},"answer":"D C A B E","answerText":"（1）D（氯丙嗪） （2）C（奎尼丁） （3）A（氯霉素） （4）B（雌激素类） （5）E（阿司匹林）","mnemonic":"重要｜临床药理-DY.docx","addedAt":1781947616073},{"id":"tr-191","course":"临床药理学","type":"判断","chapter":"6. 药物相互作用","number":"lin-0191","title":"配伍禁忌(体外理化反应)属于药效学相互作用。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 13:48 [40:33]〕｜非真题原题·据课堂整理","addedAt":1781947616073},{"id":"tr-192","course":"临床药理学","type":"判断","chapter":"6. 药物相互作用","number":"lin-0192","title":"协同作用是指两药合用效果恰好等于二者单用之和(1+1=2)。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 14:38 [10:39]〕｜非真题原题·据课堂整理","addedAt":1781947616073},{"id":"tr-193","course":"临床药理学","type":"判断","chapter":"6. 药物相互作用","number":"lin-0193","title":"前体药物(前药)在发生相互作用时通常表现为疗效减弱。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 15:38 [41:18]〕｜非真题原题·据课堂整理","addedAt":1781947616073},{"id":"tr-194","course":"临床药理学","type":"名词解释记忆","chapter":"6. 药物相互作用","number":"lin-0194","title":"联合用药的意义在于","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"1提高药物的疗效;2减少药物的某些副作用;和3延缓机体耐受性或病原体耐药 性的产生,可延长疗程,从而提高药物的效果","mnemonic":"重要｜临床药理试题库","addedAt":1781947616073},{"id":"tr-195","course":"临床药理学","type":"名词解释记忆","chapter":"6. 药物相互作用","number":"lin-0195","title":"联合用药（药物相互作用）","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"同时或相隔一定时间内使用两种或两种以上药物,所产生的药动学和药效学的改变,从而使药物在体内的药理作用出现增强或减弱的现象。","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 13:48 [23:57]〕｜非真题原题·据课堂整理","addedAt":1781947616073},{"id":"tr-196","course":"临床药理学","type":"名词解释记忆","chapter":"6. 药物相互作用","number":"lin-0196","title":"药物的相互作用","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"指两种或两种以上的药物合并或先后序贯使用时，所引起的药物作用和效应的变化。广义：联合用药时所发生的疗效变化，疗效变化只有两种可能，作用加强和作用减弱。狭义：不良药物相互作用。","mnemonic":"重要｜临床药理-DY.docx","addedAt":1781947616073},{"id":"tr-197","course":"临床药理学","type":"名词解释记忆","chapter":"6. 药物相互作用","number":"lin-0197","title":"交叉依赖性","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"人体对一种药物产生生理依赖性时，停用该药所引发的戒断综合症可能为另一性质相似的药物所抑制，并维持已形成的依赖状态，称交叉依赖性。两药药理作用可相互替代，亦可为部分药理作用的交叉依赖。","mnemonic":"重要｜临床药理-DY.docx","addedAt":1781947616073},{"id":"tr-198","course":"临床药理学","type":"简答记忆","chapter":"6. 药物相互作用","number":"lin-0198","title":"血管紧张素转化酶抑制 药","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"卡托普利、依那普利、雷米普利","mnemonic":"重要｜临床药理试题库","addedAt":1781947616073},{"id":"tr-199","course":"临床药理学","type":"简答记忆","chapter":"6. 药物相互作用","number":"lin-0199","title":"药物相互作用的几种方式","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"体外药物相互作用,药代动力学方面药物相互作用,药效学方面药物相互作用体外药物相互作用:指药物合用时,由于制剂不合理,发生直接物理或化学反应导致药物作用改变,即一般所称的化学或物理配伍禁忌,也称为物理化学性相互作用,大部分可归于体外作用。药代动力学方面药物相互作用: 指一种药物能使另一种药物的吸收、分布、代谢和排泄等环节发生变化,从而影响另一种药物的血浆浓度,进一步改变其作用强度。药效学方面药物相互作用: 是指药物合用,一种药物增强或减弱了另一种药物的药理效应,但对血药浓度并无明显的影响。","mnemonic":"必背｜历年高频｜临床药理试题库","addedAt":1781947616073},{"id":"tr-200","course":"临床药理学","type":"简答记忆","chapter":"6. 药物相互作用","number":"lin-0200","title":"简述药物相互作用的三种类型。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"①体外(理化)相互作用=配伍禁忌(物理化学性质改变,如沉淀/结晶/氧化分解);②药效学相互作用(影响药理效应、协同/拮抗,但对血药浓度无明显影响);③药动学相互作用(经ADME改变血药浓度进而改变药效,代谢环节最关键)。","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 13:48 [39:56]〕〔2026-03-25 14:38 [09:54、24:33]〕｜非真题原题·据课堂整理","addedAt":1781947616073},{"id":"tr-201","course":"临床药理学","type":"论述记忆","chapter":"6. 药物相互作用","number":"lin-0201","title":"【论述】注射剂配伍禁忌(体外相互作用,必考)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"论述题","answerText":"注射剂配伍禁忌(体外相互作用,必考):①沉淀——酸性药液与碱性药液合用中和形成沉淀(盐酸氯丙嗪酸性+异戊巴比妥钠碱性;肝素+阿米卡星/胺碘酮/红霉素/吗啡 5-10min沉淀)②结晶——溶解度下降析出晶体(磺胺嘧啶钠用10%葡萄糖稀释析晶致血管栓塞)③氧化分解失效——维生素C注射液pH>6易氧化(禁配氨茶碱等碱性液);氨基糖苷类+羧苄西林(氨基与β-内酰胺环作用失活);氨基酸营养液禁加任何药物。60年代澳大利亚苯妥英钠事件(赋形剂硫酸钙改乳糖致生物利用度升高中毒)。\n\n〔老师强调/扣分点〕笔记★★★高频。配伍禁忌三类(沉淀酸碱中和/结晶磺胺嘧啶/氧化VitC)、氨基糖苷+羧苄西林失活、氨基酸营养液禁加药是核心。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 理解/论述(注射剂配伍禁忌—真题论述'氢氯噻嗪低钾'病例+药物相互作用)〕｜参考答案据课堂/教材整理","addedAt":1781947616073},{"id":"tr-202","course":"临床药理学","type":"论述记忆","chapter":"6. 药物相互作用","number":"lin-0202","title":"【论述】高血压联合用药","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"论述题","answerText":"高血压联合用药(必考):意义——单药仅40%有效,联合治疗可达80%以上;机制互补(RAAS+容量负荷)、不良反应抵消(CCB水肿可被ARB减轻)、协同延长作用时间。原则:血压≥160/100mmHg或高于目标20/10mmHg、单药未达标、高危患者起始小剂量联合;优选机制互补组合(RAAS抑制剂+利尿剂)。剂量策略:标准剂量单药平均降压10/5mmHg,加倍剂量仅额外降2/1mmHg(故联合优于加量)。CCB降DBP最强(氨氯地平)、ARB/ACEI对SBP更显著。中国指南优先固定复方制剂。\n\n〔老师强调/扣分点〕笔记★★★高频。单药40%vs联合80%、加倍剂量仅额外降2/1mmHg(联合优于加量)、RAAS抑制剂+利尿剂优选组合是核心。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 论述(★高血压联合用药—真题论述原题'抗高血压药合理应用:联合用药'+病例'合并肾病用药')〕｜参考答案据课堂/教材整理","addedAt":1781947616073},{"id":"tr-203","course":"临床药理学","type":"选择","chapter":"6. 药物相互作用","number":"lin-0203","title":"下列有关联合用药的说法,错误的是","options":{"A":"提高药物疗效","B":"减少不良反应","C":"增加给药剂量","D":"延缓病原体产生耐药性","E":"延缓机体耐受性"},"answer":"C","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-204","course":"临床药理学","type":"选择","chapter":"6. 药物相互作用","number":"lin-0204","title":"以下哪项属于影响药物吸收的药物相互作用","options":{"A":"考来烯胺使地高辛的疗效降低","B":"阿司匹林增加甲氨蝶呤的肝脏毒性","C":"服用泼尼松控制哮喘发作的患者,在加服苯巴比妥之后哮喘发作次数增加","D":"器官移植患者应用免疫抑制剂环孢素,加用利福平使机体出现排斥反应","E":"碳酸氢钠用于苯巴比妥中毒解救"},"answer":"A","answerText":"","mnemonic":"必背｜历年高频｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-205","course":"临床药理学","type":"选择","chapter":"6. 药物相互作用","number":"lin-0205","title":"⻥精蛋白注射液解救肝素过量出血,这种现象称为","options":{"A":"增敏作用","B":"拮抗作用","C":"协同作用","D":"增强作用","E":"相加作用"},"answer":"B","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-206","course":"临床药理学","type":"选择","chapter":"6. 药物相互作用","number":"lin-0206","title":"氨氯地平和氢氯噻嗪产生的相互作用可能导致","options":{"A":"降压作用增强","B":"巨幼红细胞症","C":"抗凝作用下降","D":"高钾血症","E":"肾毒性增 强"},"answer":"A","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-207","course":"临床药理学","type":"选择","chapter":"6. 药物相互作用","number":"lin-0207","title":"某些药物促进自身或其他合用药物代谢的现象属于","options":{"A":"酶诱导作用","B":"膜动转运","C":"血脑屏障","D":"肠肝循环","E":"蓄积效应"},"answer":"A","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-208","course":"临床药理学","type":"选择","chapter":"6. 药物相互作用","number":"lin-0208","title":"不具有酶诱导作用的药物是","options":{"A":"保泰松","B":"利福平","C":"水合氯醛","D":"安体舒通","E":"利血平"},"answer":"E","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-209","course":"临床药理学","type":"选择","chapter":"6. 药物相互作用","number":"lin-0209","title":"下列属于药动学相互作用的是","options":{"A":"配伍禁忌(沉淀结晶)","B":"受体水平的协同/拮抗","C":"通过影响吸收/分布/代谢/排泄改变血药浓度","D":"体外理化反应","E":""},"answer":"C","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 14:38 [24:33]〕｜非真题原题·据课堂整理","addedAt":1781947616073},{"id":"tr-210","course":"临床药理学","type":"选择","chapter":"6. 药物相互作用","number":"lin-0210","title":"在药物相互作用中,发生比例最大、临床意义最大的是","options":{"A":"吸收环节","B":"分布环节","C":"代谢环节(约90%经CYP450,酶抑制约70%、酶诱导约23%)","D":"排泄环节","E":""},"answer":"C","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 15:38 [26:35]〕｜非真题原题·据课堂整理","addedAt":1781947616073},{"id":"tr-211","course":"临床药理学","type":"选择","chapter":"6. 药物相互作用","number":"lin-0211","title":"下面正确描述的是：","options":{"A":"联合用药的意义在于提高疗效，减少不良反应","B":"不良反应的发生率常随着联合用药的种类和数 量的增多而减少","C":"联合用药的结果主要是药效学方面出现增强作 用","D":"氨基甙类抗生素之间联合用药可提高疗效 EPH 值的变化不会影响药物的体内过程","E":""},"answer":"A","answerText":"","mnemonic":"重要｜临床药理-DY.docx","addedAt":1781947616073},{"id":"tr-212","course":"临床药理学","type":"选择","chapter":"6. 药物相互作用","number":"lin-0212","title":"正确的联合用药是：","options":{"A":"氯丙嗪+氢氯噻嗪","B":"氯丙嗪+呋塞米","C":"氯丙嗪+普蔡洛尔","D":"呋塞米+庆大霉素","E":"异烟肼+维生素 B6"},"answer":"E","answerText":"","mnemonic":"重要｜临床药理-DY.docx","addedAt":1781947616073},{"id":"tr-213","course":"临床药理学","type":"选择","chapter":"6. 药物相互作用","number":"lin-0213","title":"不正确的联合用药是：","options":{"A":"碳酸氢钠+庆大霉素","B":"丙磺舒+青霉素","C":"普萘洛尔+硝苯地平","D":"青霉素+链霉素","E":"庆大霉素+呋塞米"},"answer":"D"," ","answerText":"","mnemonic":"必背｜历年高频｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-235","course":"临床药理学","type":"判断","chapter":"7. 临床试验与GCP","number":"lin-0235","title":"耐受性试验由小剂量到大剂量逐步进行,可以在同一受试者身上进行逐步的剂 量递增试验","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"必背｜历年高频｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-236","course":"临床药理学","type":"判断","chapter":"7. 临床试验与GCP","number":"lin-0236","title":"随机化是使临床试验中的受试者有同等的机会被分配到试验组或对照组中,而 不受研究者或受试者主管意愿的影响。常与盲法合用以避免偏倚","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"必背｜历年高频｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-237","course":"临床药理学","type":"判断","chapter":"7. 临床试验与GCP","number":"lin-0237","title":"盲法是指试验过程者患者对参加什么药物临床试验不清楚","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"必背｜历年高频｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-238","course":"临床药理学","type":"判断","chapter":"7. 临床试验与GCP","number":"lin-0238","title":"在试验方案中,当试验组与对照组按1:1设计时,一般采用两次揭盲法","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-239","course":"临床药理学","type":"判断","chapter":"7. 临床试验与GCP","number":"lin-0239","title":"在临床试验过程中由于不能获得外观一致的对照产品而无法进行盲法试验时, 一般采用开放试验","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"必背｜历年高频｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-240","course":"临床药理学","type":"名词解释记忆","chapter":"7. 临床试验与GCP","number":"lin-0240","title":"GCP(药物临床试验质量管理规范)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"临床试验全过程的标准规定。包括方案设计、组织实施、稽查、记录、分析总结和报告。","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","addedAt":1781947616073},{"id":"tr-241","course":"临床药理学","type":"名词解释记忆","chapter":"7. 临床试验与GCP","number":"lin-0241","title":"安慰剂效应","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"（placebo effect）：尽管安慰剂本身并无药理作用，但在一定条件下，安慰剂可以产生效应，称为安慰剂效应。如镇痛，镇静，止咳等。","mnemonic":"重要｜临床药理-DY.docx","addedAt":1781947616073},{"id":"tr-242","course":"临床药理学","type":"多选","chapter":"7. 临床试验与GCP","number":"lin-0242","title":"II期临床试验设计原则为","options":{"A":"代表性","B":"重复性","C":"随机性","D":"合理性","E":""},"answer":"ABCD","answerText":"","mnemonic":"必背｜历年高频｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-243","course":"临床药理学","type":"多选","chapter":"7. 临床试验与GCP","number":"lin-0243","title":"盲法试验分为","options":{"A":"单盲","B":"双盲","C":"双盲双模拟","D":"开放","E":""},"answer":"ABC","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-244","course":"临床药理学","type":"多选","chapter":"7. 临床试验与GCP","number":"lin-0244","title":"知情同意书内容包括","options":{"A":"试验目的及背景","B":"试验过程及相关步骤","C":"预期收益及⻛险","D":"受试者信息保密,任何人不得查看研究资料","E":"有权在试验任何阶段随时退出试验而不遭到歧视或报复"},"answer":"ABCE","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-245","course":"临床药理学","type":"多选","chapter":"7. 临床试验与GCP","number":"lin-0245","title":"伦理委员会成员组成一般应包括","options":{"A":"医药学专业人员","B":"非医药学专业人员","C":"伦理学或法律学专业人员","D":"外单位人员","E":"普通社区代表"},"answer":"ABCDE","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-246","course":"临床药理学","type":"多选","chapter":"7. 临床试验与GCP","number":"lin-0246","title":"伦理审查决议一般包括以下","options":{"A":"同意","B":"必要的修改后同意","C":"修正后重审","D":"不同意","E":"终止或暂停已批准的临床试验"},"answer":"ABCDE","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-247","course":"临床药理学","type":"简答记忆","chapter":"7. 临床试验与GCP","number":"lin-0247","title":"新药临床试验分几期","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"简述各期主要内容是什么?分为四期。I期临床试验:初步的临床药理学及 人体安全性评价;包括药物耐受性试验与药动学研究;实验对象:健康志愿者;II期临床试验:主要 目的:确定是否安全有效,与对照组比较有多大的治疗价值;确定适应证、最佳治疗方案;评价不良反应 及危险性并提供防治方法。III期临床试验:扩大的多中心临床试验,进一步评价新药的有效性和安 全性;治疗作用确证阶段。IV期临床试验:目的:考察在广泛使用条件下的疗效和不良反应等。主 要对象是一些疗效不确切或不良反应较多或有严重反应的市场药物","mnemonic":"必背｜历年高频｜临床药理试题库","addedAt":1781947616073},{"id":"tr-248","course":"临床药理学","type":"简答记忆","chapter":"7. 临床试验与GCP","number":"lin-0248","title":"II期临床试验设计","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"(10点)1)对照试验:新药临床试验必须设对照组,是比较两组病人的治疗结果。 2)随机化设计:目的使试验对象被均匀地分配到各试验组去,不受主观意志或客观条件的影 响,排除分配误差。 3)盲法试验:是不让医生和病人知道每一个具体的受试者接受 的是试验药还是对照药。 4)安慰剂:是把没有药理活性的物质用作临床对照试验中 的阴性对照。 5)病例选择与淘汰标准:病例选择标准:1根据专业要求确定选择标 准。2根据统计学要求确定选择标准。3应把获得受试者知情同意书作为入选标准。病例排除标准:1根据专业要求确定淘汰标准。2 根据统计学要求确定淘汰标准。 6)药效评定标准: 我国临床疗效评价一般采用四级评定标准:无效,改善,进步和明显进步。 7)病人的依从性 :临床试验中,病人的依从性最重要的一点是按规定服药。 8)临床试验的病例数估 计:1根据统计学要求估计病例数。2按专业要求估计病例数。3按照新药审批要求完成病例 数。 9)安全性评估:临床试验中不良事件包括临床不良反应与化验异常两个部分 。 10)临床资料的统计处:临床试验资料有计量资料与计数资料,统计采用比较权威 的软件进行。","mnemonic":"必背｜历年高频｜临床药理试题库","addedAt":1781947616073},{"id":"tr-249","course":"临床药理学","type":"简答记忆","chapter":"7. 临床试验与GCP","number":"lin-0249","title":"新药临床试验的分期及内容","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"分为四期。I期临床试验:初步的临床药理学及人体安全性评 价;包括药物耐受性试验与药动学研究;实验对象:健康志愿者;II期临床试验:主要目的:确定是 否安全有效,与对照组比较有多大的治疗价值;确定适应证、最佳治疗方案;评价不良反应及危险性并提 供防治方法。III期临床试验:扩大的多中心临床试验,进一步评价新药的有效性和安全性;治疗作 用确证阶段。IV期临床试验:目的:考察在广泛使用条件下的疗效和不良反应等。主要对象是一些 疗效不确切或不良反应较多或有严重反应的市场药物","mnemonic":"必背｜临床药理试题库","addedAt":1781947616073},{"id":"tr-250","course":"临床药理学","type":"简答记忆","chapter":"7. 临床试验与GCP","number":"lin-0250","title":"【简答】GCP核心原则","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"GCP核心原则(必考):①保护受试者权益和安全——必须符合《赫尔辛基宣言》原则(1964年芬兰制定,全球医学伦理基石),受试者权益和安全是最高优先级,高于科学价值和社会效益(如新冠疫苗研发不能牺牲受试者安全)②伦理审查+知情同意双重机制——前者审查方案科学性,后者确保受试者自主选择权③风险-获益比评估——只有预期获益显著大于风险才能开展,过程中持续监测,风险超获益须立即中止④质量管理贯穿全过程(双人核查/源数据验证)。\n\n〔老师强调/扣分点〕笔记★★★★高频。赫尔辛基宣言(1964芬兰)、受试者安全高于科学价值、伦理审查+知情同意双机制、风险获益比是核心。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 论述/简答(★GCP核心原则+赫尔辛基宣言—真题论述原题'如何保障受试者权益'(多年)+填空'赫尔辛基宣〕｜参考答案据课堂/教材整理","addedAt":1781947616073},{"id":"tr-251","course":"临床药理学","type":"论述记忆","chapter":"7. 临床试验与GCP","number":"lin-0251","title":"新药临床试验四期及内容目的","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"论述题","answerText":"I期临床试验:初步的临床药理学及人体安全性评价试验,内容为药物耐受性试验与药物动力学研究。目的:研究人体对药物的耐受程度并通过药物动力学研究,了解药物在人体内的吸收、分布、消除的规律,为新药II期临床试验提供安全有效的合理试验方案II期临床试验:治疗作用初步评价阶段,目的:初步评价药物对目标适应症患者的治疗作用和安全性,也包括为III期临床试验研究设计和给药剂量方案的确定提供依据。III期临床试验:扩大的多中心临床试验,是治疗作用的确证阶段。目的是进一步验证药物对目标适应症患者的治疗作用和安全性,评价利益与⻛险关系,最终为药物注册申请获得批准提供充份的依据。IV期新药临床试验:即上市后临床试验,又称上市后监察,内容包括扩大临床试验,特殊对象的临床试验,补充临床试验,不良反应考察。目的是考察在广泛使用条件下的药物的疗效和不良反应(注意罕见不良反应),评价在普通或者特殊人群中使用的利益与⻛险关系;改进给药剂量等,并根据进一步了解的疗效、适应症与不良反应情况,指导临床合理用药","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","addedAt":1781947616073},{"id":"tr-252","course":"临床药理学","type":"选择","chapter":"7. 临床试验与GCP","number":"lin-0252","title":"伦理委员会组成成员最少不少于","options":{"A":"5人","B":"8人","C":"10人","D":"12人","E":""},"answer":"A","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-253","course":"临床药理学","type":"选择","chapter":"7. 临床试验与GCP","number":"lin-0253","title":"制定GCP的目的不包括以下哪个","options":{"A":"保障临床试验过程的规范","B":"保障结果科学可靠","C":"保护受试者权益与安全","D":"确保研究结果获得新药注册申报","E":""},"answer":"D","answerText":"","mnemonic":"必背｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-254","course":"临床药理学","type":"选择","chapter":"7. 临床试验与GCP","number":"lin-0254","title":"以下情况一般视为新药临床试验的排除标准,哪种除外","options":{"A":"肝肾功能不全患者","B":"轻度胃肠功能障碍患者","C":"小儿","D":"孕妇","E":"药物过敏者"},"answer":"B","answerText":"","mnemonic":"必背｜历年高频｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-255","course":"临床药理学","type":"选择","chapter":"7. 临床试验与GCP","number":"lin-0255","title":"（临床试验/安慰剂）正确的描述是","options":{"A":"安慰剂在临床药理研究中无实际的意义","B":"临床试验中应设立双盲法","C":"临床试验中的单盲法指对医生保密，对病人不 保密","D":"安慰剂在试验中不会引起不良反应E新药的随机对照试验都必须使用安慰剂","E":""},"answer":"B","answerText":"","mnemonic":"重要｜临床药理-DY.docx","addedAt":1781947616073},{"id":"tr-256","course":"临床药理学","type":"选择","chapter":"7. 临床试验与GCP","number":"lin-0256","title":"安慰剂可用于以下场合，但不包括","options":{"A":"用于某些作用较弱或专用于治疗慢性疾病的药 物的阴性对照药","B":"用于治疗轻度精神忧郁症，配合暗示，可获得 疗效","C":"已证明有安慰剂效应的慢性疼痛病人，可作为 间歇治疗期用药","D":"其它一些证实不需用药的病人，如坚持要求用 药者","E":"危重、急性病人"},"answer":"E","answerText":"","mnemonic":"重要｜临床药理-DY.docx","addedAt":1781947616073},{"id":"tr-257","course":"临床药理学","type":"选择","chapter":"7. 临床试验与GCP","number":"lin-0257","title":"新药临床试验应遵循下面哪个质量规范：","options":{"A":"GLP","B":"GCP","C":"GMP","D":"GSP","E":"ISO"},"answer":"B","answerText":"","mnemonic":"重要｜临床药理-DY.docx","addedAt":1781947616073},{"id":"tr-258","course":"临床药理学","type":"判断","chapter":"8. 治疗药物监测与给药方案","number":"lin-0258","title":"一个良好的临床效应指标总是优于血药浓度监测。临床上大对数药物可以通过 效应指标来进行剂量调整","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-259","course":"临床药理学","type":"判断","chapter":"8. 治疗药物监测与给药方案","number":"lin-0259","title":"半衰期大于24h的药物一般每天给药一次,给药间隔小于t1/2,初始负荷剂量高于 维持剂量的2倍","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"必背｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-260","course":"临床药理学","type":"判断","chapter":"8. 治疗药物监测与给药方案","number":"lin-0260","title":"TDM重复一点法适用于一些药动学参数与正常值或群体参数偏离较大的病 人","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"必背｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-261","course":"临床药理学","type":"名词解释记忆","chapter":"8. 治疗药物监测与给药方案","number":"lin-0261","title":"治疗药物监测（TDM）","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"在药物治疗过程中,通过测定血药浓度等指标,据此设计或调整给药方案,使药物维持在治疗窗(最低有效浓度~最低中毒浓度)内,实现个体化给药。理论基础:血药浓度与药理效应的关系优于剂量与效应的关系。","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 13:48 [28:19]〕〔2026-04-09 09:38 [38:03]〕｜非真题原题·据课堂整理","addedAt":1781947616073},{"id":"tr-262","course":"临床药理学","type":"多选","chapter":"8. 治疗药物监测与给药方案","number":"lin-0262","title":"临床上进行TDM可以采集的样本包括","options":{"A":"血液","B":"唾液","C":"脑脊液","D":"尿液","E":""},"answer":"ABCD","answerText":"","mnemonic":"必背｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-263","course":"临床药理学","type":"多选","chapter":"8. 治疗药物监测与给药方案","number":"lin-0263","title":"需要进行治疗药物监测(TDM)的药物/情况包括","options":{"A":"治疗指数低、治疗窗窄、毒性大的药物","B":"新生儿/小儿","C":"需长期用药维持治疗的病人","D":"多脏器功能障碍患者","E":""},"answer":"ABCD","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-04-09 09:38 [38:03]〕〔2026-03-25 13:48 [34:16]〕｜非真题原题·据课堂整理","addedAt":1781947616073},{"id":"tr-264","course":"临床药理学","type":"简答记忆","chapter":"8. 治疗药物监测与给药方案","number":"lin-0264","title":"在何种情况下血药进行治疗药物监测","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答:1药物的有效血浓度范围(cid:4608)窄。此类药物多为治疗 指数小的药物,如强心苷类。 2同一剂量可能出现较大的血药浓度差异的药物。如三环类抗忧郁 症药。 3具有非线性药代动力学特征的药物。如苯妥因钠、茶碱、水杨酸等。 4肝肾功能不全或衰竭的患者使用主要经肝代谢消除(利多卡因、茶碱等)或肾排泄(氨基糖苷类抗生素 等)的药物时,以及胃肠道功能不良的患者口服某些药物时。 5长期用药的患者,依从性差,不 按医嘱用药;或者某些药物长期使用后产生耐药性;或诱导(或抑制)肝药酶的活性而引起药效降低(或 升高),以及原因不明的药效变化。 6怀疑患者药物中毒,尤其有的药物中毒症状与剂量不足的 症状类似,而临床又不能明确辨别。如普鲁卡因胺治疗心律失常时,过量也会引起心律失常。 7 合并用药产生相互作用而影响疗效时。8药代动力学的个体差异很大,特别是由遗传造成药物 代谢速率明显差异的情况。如普鲁卡因胺的乙酰化代谢。9常规剂量下出现毒性反应,诊断和 处理过量中毒,以及为医疗事故提供法律依据。10当病人的血浆蛋白含量低时,需要测定血中 游离药物的浓度。如苯妥因钠","mnemonic":"必背｜临床药理试题库","addedAt":1781947616073},{"id":"tr-265","course":"临床药理学","type":"简答记忆","chapter":"8. 治疗药物监测与给药方案","number":"lin-0265","title":"在哪些情况下需要进行TDM","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"需要进行治疗药物监测(TDM)的情况主要有:①治疗指数小、安全范围窄、毒性反应强的药物(如地高辛、茶碱、锂盐、氨基糖苷类、万古霉素等),血药浓度稍高即易中毒;②药代动力学个体差异大、按常规剂量难以预测血药浓度的药物;③具非线性(零级/饱和)动力学特征的药物(如苯妥英钠、茶碱、水杨酸),剂量略增血药浓度即急剧上升;④中毒症状与原发病症状或剂量不足表现相似、难以从临床表现区分疗效与毒性时(如地高辛中毒与心衰加重、苯妥英钠中毒与癫痫发作);⑤合并用药存在明显药物相互作用而影响血药浓度时;⑥肝、肾功能不全或胃肠功能异常影响药物代谢与排泄时;⑦长期用药、怀疑患者不依从(漏服/误服)或出现治疗无效、原因不明的毒性反应时;⑧需个体化给药并已知血药浓度与疗效/毒性有明确相关关系的药物。对大多数安全范围宽、量效关系明确的药物则不必进行TDM。","mnemonic":"必背｜临床药理试题库｜据教材补","addedAt":1781947616073},{"id":"tr-266","course":"临床药理学","type":"简答记忆","chapter":"8. 治疗药物监测与给药方案","number":"lin-0266","title":"需要进行TDM的抗菌药物","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答:1药物毒性大,其治疗浓度与中毒浓度接近者:如氨基糖苷类。 2新生儿期使用易发生严重毒性反应者,如氯霉素。 3肾功能减退时易发生毒性反应 者,如氟胞嘧啶。 4某些特殊部位的感染,确定感染部位是否已达到有效药物浓度,或浓度过高 有可能导致毒性反应,如测定⻘霉素在脑脊液中的浓度。⻘霉素类、头孢菌素类、大环内酯类等由于其毒 性低,治疗浓度范围宽,一般在治疗剂量范围内根据病情调整剂量可达到有效浓度水平,不致发生毒性反 应,因此原则上对上述抗生素毋须常规进行TDM监测。但在特殊情况下,如肾功能减退患者伴发严重感 染需用大剂量⻘霉素时,为防止脑脊液内药物浓度过高而发生中枢神经系统毒性反应,则可进行脑脊液及 血药浓度监测,据以调整药物剂量。","mnemonic":"必背｜临床药理试题库","addedAt":1781947616073},{"id":"tr-267","course":"临床药理学","type":"简答记忆","chapter":"8. 治疗药物监测与给药方案","number":"lin-0267","title":"TDM(治疗药物监测)的临床意义","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"1.使给药方案个体化 2.诊断和处理药物过量中毒 3.进行临床药代动力学和药效学的研究,探讨新药的给药方案 4.节省患者治疗时间,提高治疗成功率 5.降低治疗费用 6.避免法律纠纷","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","addedAt":1781947616073},{"id":"tr-268","course":"临床药理学","type":"简答记忆","chapter":"8. 治疗药物监测与给药方案","number":"lin-0268","title":"需要进行TDM的情况","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"(1)药物的有效血药浓度范围狭窄。(2)同一剂量可能出现较大的个体间血药浓度差异的药物。(3)具有非线形药代动力学特征的药物,尤其是非线性动力学过程发生在有效血药浓度范围内或小于最低有效血药浓度时。(4)肝肾功能不全或衰竭的患者使用主要经肝代谢消除或肾排泄的药物时。(5)长期用药的患者的不依从性。(6)怀疑患者药物中毒,尤其有的药物的中毒症状与剂量不足的症状类似,而临床又不能明确辨别的。(7)合并用药产生相互作用而影响疗效的。","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","addedAt":1781947616073},{"id":"tr-269","course":"临床药理学","type":"简答记忆","chapter":"8. 治疗药物监测与给药方案","number":"lin-0269","title":"简述需要进行TDM的药物特点/情况。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"①治疗指数低、治疗窗窄、毒性大;②新生儿/小儿;③需长期用药维持治疗者;④多脏器功能障碍患者;⑤(理论基础)血药浓度与药效关系优于剂量与效应关系。","mnemonic":"🆕课堂强调·补充｜〔2026-04-09 09:38 [38:03]〕｜非真题原题·据课堂整理","addedAt":1781947616073},{"id":"tr-270","course":"临床药理学","type":"简答记忆","chapter":"8. 治疗药物监测与给药方案","number":"lin-0270","title":"简述给药方案与半衰期/治疗指数的关系。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"半衰期约8h→一天3次;约12h→一天2次。治疗指数高→给药间隔相当、负荷剂量约维持剂量的2倍;治疗指数低→调整维持剂量与给药间隔(缩窄安全范围)。","mnemonic":"🆕课堂强调·补充｜〔2026-03-02 13:48 [31:49]〕〔2026-03-23 13:48 [07:08]〕｜非真题原题·据课堂整理","addedAt":1781947616073},{"id":"tr-271","course":"临床药理学","type":"选择","chapter":"8. 治疗药物监测与给药方案","number":"lin-0271","title":"以下药物中无需常规进行TDM的药物是","options":{"A":"链霉素","B":"万古霉素","C":"阿米卡星","D":"阿奇霉素","E":"两性霉素B"},"answer":"D","answerText":"","mnemonic":"必背｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-272","course":"临床药理学","type":"选择","chapter":"8. 治疗药物监测与给药方案","number":"lin-0272","title":"药物代谢动力学的临床应用是","options":{"A":"给药方案的调整及进行TDMB 给药方案的设计及观察ADRC 进行TDM 和观察ADRD 测定生物利用度及ADRE测定生物利用度，进行 TDM 和观察ADR","B":"","C":"","D":"","E":""},"answer":"E","answerText":"","mnemonic":"重要｜临床药理-DY.docx","addedAt":1781947616073},{"id":"tr-273","course":"临床药理学","type":"选择","chapter":"8. 治疗药物监测与给药方案","number":"lin-0273","title":"开展治疗药物监测主要的目的是","options":{"A":"对有效血药浓度范围狭窄的药物进行血药浓度 监测，从而获得最佳治疗剂量，制定个体化给药方案","B":"处理不良反应","C":"进行新药药动学参数计算","D":"进行药效学的探讨 E评价新药的安全性","E":""},"answer":"A","answerText":"","mnemonic":"重要｜临床药理-DY.docx","addedAt":1781947616073},{"id":"tr-274","course":"临床药理学","type":"名词解释记忆","chapter":"9. 各系统疾病的临床用药","number":"lin-0274","title":"第3代磺酰脲类降糖药是","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"A格列本脲 B格列吡嗪 C格列⻬特 D格列美脲","mnemonic":"重要｜临床药理试题库","addedAt":1781947616073},{"id":"tr-275","course":"临床药理学","type":"多选","chapter":"9. 各系统疾病的临床用药","number":"lin-0275","title":"下列属于烷化剂类抗肿瘤药的有","options":{"A":"硫唑嘌呤","B":"美法仑","C":"白消安","D":"环磷酰胺","E":""},"answer":"BCD","answerText":"","mnemonic":"必背｜历年高频｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-276","course":"临床药理学","type":"多选","chapter":"9. 各系统疾病的临床用药","number":"lin-0276","title":"孕妇用药应遵守以下原则","options":{"A":"哺乳期不要随便用药","B":"防止孕期滥用药物和不敢用药两种偏向","C":"妊娠晚期、分娩期用药要考虑到药物对新生儿的影响","D":"根据病情需要,选择疗效确实且对胎儿比较安全的药物","E":""},"answer":"ABCD","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-277","course":"临床药理学","type":"多选","chapter":"9. 各系统疾病的临床用药","number":"lin-0277","title":"下列药物属于天然来源抗肿瘤药物的有","options":{"A":"长春新碱","B":"替尼泊苷","C":"羟基喜树碱","D":"多⻄他赛","E":""},"answer":"ABCD","answerText":"","mnemonic":"必背｜历年高频｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-278","course":"临床药理学","type":"多选","chapter":"9. 各系统疾病的临床用药","number":"lin-0278","title":"β受体阻断剂的禁忌/慎用情况包括","options":{"A":"急性心力衰竭","B":"支气管哮喘","C":"二度以上房室传导阻滞","D":"严重心动过缓","E":""},"answer":"ABCD","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-04-01 14:38 [23:08]〕｜非真题原题·据课堂整理","addedAt":1781947616073},{"id":"tr-279","course":"临床药理学","type":"简答记忆","chapter":"9. 各系统疾病的临床用药","number":"lin-0279","title":"抗恶性肿瘤药中细胞周期特异性药物与非细胞周期特异性药物作用特点的比较","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答:周期特异性药物对 癌细胞的作用慢而弱,剂量反应曲线为渐近线,在血药浓度和用药时间的关系中,用药时间是主要因素, 给药途径以缓慢滴注为主。;周期非特异性药物对癌细胞的作用快而强,剂量反应曲线呈直线 关系,在血药浓度和用药时间的关系中,血药浓度是主要影响因素,采用静脉推注的方式为主。","mnemonic":"必背｜临床药理试题库","addedAt":1781947616073},{"id":"tr-280","course":"临床药理学","type":"简答记忆","chapter":"9. 各系统疾病的临床用药","number":"lin-0280","title":"抗高血压药物的分类及代表药","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"1. 肾素-血管紧张素系统抑制药:卡托普利,洛沙坦,2. 钙通道阻滞药:硝苯地平,尼莫地平3. 交感神经阻断药:可乐定,利血平,哌唑嗪,普萘洛尔4. 利尿药:氢氯噻嗪5. 血管扩张药:二氮嗪","mnemonic":"必背｜临床药理试题库","addedAt":1781947616073},{"id":"tr-281","course":"临床药理学","type":"简答记忆","chapter":"9. 各系统疾病的临床用药","number":"lin-0281","title":"抗心律失常药物的分类及代表药","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"简述抗心律失常药物的分类及代表药。","mnemonic":"重要｜临床药理试题库","addedAt":1781947616073},{"id":"tr-282","course":"临床药理学","type":"简答记忆","chapter":"9. 各系统疾病的临床用药","number":"lin-0282","title":"胰岛素的适应症及使用时的注意事项","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"a.I型糖尿病、妊娠糖尿病、特殊类型糖尿病(垂体性 糖尿病); b.对合理的饮⻝治疗和口服降糖药治疗后血糖仍然未达标的II型糖尿病患者; 2使用时的注意 事项: a. 个体化,从小剂量开始(皮下)使用。 I型糖尿病:替代治疗、II型糖尿病:补充治疗或 替代治疗 开始就单用胰岛素,初始剂量可按","mnemonic":"重要｜临床药理试题库","addedAt":1781947616073},{"id":"tr-283","course":"临床药理学","type":"简答记忆","chapter":"9. 各系统疾病的临床用药","number":"lin-0283","title":"不宜使用强心苷治疗的心力衰竭类型","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答:心肌外界因素如心包填塞、缩窄性心包炎、严重二尖瓣 (cid:4608)窄所致心力衰竭。这些病理因素均使左心室舒张期血液充盈度严重受损,强心苷虽加强心肌收 缩,亦难以改善心肌功能。肥厚型心肌病伴左心室流出道(cid:4608)窄,亦应避免使用强心苷。急 性心急梗塞所致左心衰竭,强心苷单(cid:4607)使用可能增加心肌耗氧,导致心急梗塞范围扩大,应与降低心脏前 负荷的血管扩张配伍应用。","mnemonic":"重要｜临床药理试题库","addedAt":1781947616073},{"id":"tr-284","course":"临床药理学","type":"简答记忆","chapter":"9. 各系统疾病的临床用药","number":"lin-0284","title":"治疗心绞痛药物的分类及作用机制","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答:1硝酸酯类:A:血液动力学作用:本类药物能松弛大多数的 动脉和静脉的血管平滑肌低浓度的硝酸甘油引起静脉血管的扩张作用大于对动脉血管的扩张作用。B:对冠脉总血流量和局部血流量的作用:缺血是冠状血管扩张的有效刺激因素,它通过自身调节机 制改变小的阻力血管而对局部血流进行调整。C:对心肌耗氧量的影响:通过对全身血液循环的 作用,硝酸酯类可降低心肌耗氧量。D:硝酸甘油释放的 NO也可兴奋血小板的腺苷酸环化酶, cAMP增加可抑制血小板的聚集。2钙通道阻滞剂:A:平滑肌作用:钙通道阻滞药松弛平滑肌 细胞,以血管平滑肌最敏感,小动脉的敏感性较静脉更高B:心肌作用:钙通道阻滞药对心肌收缩 力有剂量依赖性减弱作用。从而减少心肌氧耗。C:血液动力学作用:硝苯地平在口服20mg 时可 引起全身阻力血管降低和血压下降,反射性引起心率加快和心输出量增加。3β受体阻滞药:其 对心绞痛的治疗作用来源于它的血液动力学作用:减慢心率、降低血压和收缩力,从而降低静息和运动时 的心肌耗氧。在减慢心率的同时,舒张期灌注时间延长,使心肌灌流增多。β受体阻滞药对缺血和 非缺血心肌冠脉段的作用不同,可使达到缺血心肌的冠脉流量重新分布。","mnemonic":"重要｜临床药理试题库","addedAt":1781947616073},{"id":"tr-285","course":"临床药理学","type":"简答记忆","chapter":"9. 各系统疾病的临床用药","number":"lin-0285","title":"抗休克治疗时缩血管药物的应用指征和注意事项","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"1)应用指征:1血压骤降,需短时间内提升血 压,增强心肌收缩力,保证重要脏器的血液供应;2补充血容量后,血压仍不回升,外周阻力降低, 心输出量少者;3与α受体阻断药合用,可去除其α受体的兴奋作用,保留β受体兴奋作用。 注意事项:在纠酸补充血容量总的原则下,短期内小量使用,如症状无明显改善,应停药, 改用其他抗休克药物。","mnemonic":"重要｜临床药理试题库","addedAt":1781947616073},{"id":"tr-286","course":"临床药理学","type":"简答记忆","chapter":"9. 各系统疾病的临床用药","number":"lin-0286","title":"【简答】引起G-6-PD缺陷患者溶血的常见药物","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"引起G-6-PD缺陷患者溶血的常见药物(必考简答):①抗疟药——伯氨喹/帕马喹/米帕林等;②抗菌药——磺胺类/氯霉素/对氨水杨酸等;③解热镇痛药——阿司匹林/非那西丁/氨基比林等;④其他——维生素K/丙磺舒/肼苯达嗪/奎尼丁/蚕豆素。属遗传药理学个体差异经典例。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 2016/2017简答+2019论述〕｜参考答案据课堂/教材整理","addedAt":1781947616073},{"id":"tr-287","course":"临床药理学","type":"论述记忆","chapter":"9. 各系统疾病的临床用药","number":"lin-0287","title":"【论述】反应停事件剖析","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"论述题","answerText":"反应停(Thalidomide)事件剖析(必考重点案例):1953年瑞士CIBA作为镇静催眠药合成(因效果不如巴比妥停止),1954年西德Grünenthal发现镇吐作用,1957年作为孕妇止吐剂上市(46国/14药厂)。1961年11月德国Lenz、12月澳大利亚McBride《柳叶刀》报告海豹肢畸形相关。后果:全球12000例畸形(海豹肢8000+)、死亡5000+。美国规避:FDA的Frances Kelsey发现动物实验未覆盖妊娠30-50天敏感期,坚持要求补充数据而未批准,1962年获肯尼迪总统勋章,推动1962年立法强化FDA监管。\n\n〔老师强调/扣分点〕笔记★★★★高频重点案例。Frances Kelsey阻止反应停在美上市、妊娠30-50天致畸敏感期、推动1962年FDA立法是核心考点。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 案例(反应停Thalidomide事件—真题重点案例,药源性疾病论述背景)〕｜参考答案据课堂/教材整理","addedAt":1781947616073},{"id":"tr-288","course":"临床药理学","type":"论述记忆","chapter":"9. 各系统疾病的临床用药","number":"lin-0288","title":"【论述】高血压发病机制","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"论述题","answerText":"高血压发病机制(必考):①心输出量改变——心肌收缩力增强致血压升高②肾功能异常——水钠潴留致血容量增加+交感神经激活③RAAS系统激活——肾素-血管紧张素-醛固酮系统激活致阻力小动脉收缩④血管重构——血管张力增加+管壁增厚致总外周阻力增加⑤内皮细胞功能受损——舒张因子(前列环素/NO)减少、收缩因子(内皮素/血管紧张素II)增加。降压药研发史:1960s噻嗪类利尿剂、1970s ACEI、2001 ARBs/CCB。\n\n〔老师强调/扣分点〕笔记★★★高频。高血压五大机制(心输出量/水钠潴留/RAAS/血管重构/内皮损伤)是核心机制考点。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 论述(★高血压发病机制—真题论述原题'高血压分类及合理应用'背景(几乎每年必考论述))〕｜参考答案据课堂/教材整理","addedAt":1781947616073},{"id":"tr-289","course":"临床药理学","type":"论述记忆","chapter":"9. 各系统疾病的临床用药","number":"lin-0289","title":"【论述】利尿剂分类(降压药,必考)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"论述题","answerText":"利尿剂分类(降压药,必考):①袢利尿剂(强效)——作用于髓袢升支粗段,抑制NaCl主动重吸收,代表呋塞米/布美他尼/托拉塞米②噻嗪类(中效)——作用于远曲小管始端,噻嗪型(氢氯噻嗪/苄氟噻嗪)、噻嗪样(氯噻酮/吲达帕胺)③保钾利尿剂(弱效)——抑制远曲小管Na+-H+转运体(氨苯蝶啶/阿米洛利,不依赖醛固酮)或醛固酮受体拮抗剂(螺内酯/依普利酮)。利尿剂适应症:老年高血压、难治性高血压、心衰合并高血压、盐敏感性高血压(老年人低肾素活性对盐敏感,利尿剂效果好)。\n\n〔老师强调/扣分点〕笔记★★★★高频。三类利尿剂(袢强效呋塞米/噻嗪中效氢氯噻嗪/保钾弱效螺内酯)作用部位与强度、利尿剂适合老年盐敏感是核心。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 论述/填空(★利尿剂分类(降压药)—真题论述'抗高血压药分类'+填空'WHO首选降压药利尿剂'+病例'氢〕｜参考答案据课堂/教材整理","addedAt":1781947616073},{"id":"tr-290","course":"临床药理学","type":"选择","chapter":"9. 各系统疾病的临床用药","number":"lin-0290","title":"干扰核酸代谢的抗恶性肿瘤药物是","options":{"A":"氟尿嘧啶","B":"烷化剂","C":"放线菌素","D":"长春新碱","E":""},"answer":"A","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-291","course":"临床药理学","type":"选择","chapter":"9. 各系统疾病的临床用药","number":"lin-0291","title":"以下哪一个药物不属于肾素-血管紧张素系统抑制药","options":{"A":"卡托普利","B":"氯沙坦","C":"依那普利","D":"美托洛尔","E":"替米沙坦"},"answer":"D","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-292","course":"临床药理学","type":"选择","chapter":"9. 各系统疾病的临床用药","number":"lin-0292","title":"用于治疗儿童急性白血病的抗叶酸药是","options":{"A":"环磷酰胺","B":"甲氨蝶呤","C":"氟尿嘧啶","D":"阿糖胞苷","E":""},"answer":"B","answerText":"","mnemonic":"了解｜临床药理题库(学习通)","addedAt":1781947616073},{"id":"tr-293"," :"汇集各章习题(sId6)","addedAt":1781947616073},{"id":"tr-388","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"tr-0021","title":"高速逆流色谱技术","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"它是依靠高速齿轮旋转产生的离心力使无载体支持的固定相稳定地保留在蛇形管中, 并使流动相单向、低速地通过固定相, 由于不同的物质在两相中具有不同的分配系数,其在柱中的移动速度也不一样, 从而实现样品的一种分离方法。","mnemonic":"汇集各章习题(sId6)名词解释","addedAt":1781947616073},{"id":"tr-389","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"tr-0022","title":"超临界流体萃取技术","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是指在临界温度和临界压力以上, 以接近临界点状态下的流体作为萃取溶剂,利用其在超临界状态下兼有液体和气体的双重性质选择性地溶解其他物质, 先将某一组分溶解, 然后通过控制温度和压力, 使临界流体变成普通气体, 被溶物会析出,从而从混合物中得以分离地技术。","mnemonic":"汇集各章习题(sId6)名词解释","addedAt":1781947616073},{"id":"tr-390","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"tr-0023","title":"超声波提取技术","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是指以超声波辐射压强产生的骚动效应、空化效应和热效应, 引起机械搅拌、加速扩散溶解的一种新型的利用外场介入的溶剂强化提取方法。","mnemonic":"汇集各章习题(sId6)名词解释","addedAt":1781947616073},{"id":"tr-391","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"tr-0024","title":"正相色谱","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"流动相的极性是非极性的,而固定相的极性是极性的。","mnemonic":"汇集各章习题(sId6)名词解释","addedAt":1781947616073},{"id":"tr-392","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"tr-0025","title":"反相色谱","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"固定相的极性小,而流动相的极性大。","mnemonic":"汇集各章习题(sId6)名词解释","addedAt":1781947616073},{"id":"tr-393","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"tr-0026","title":"超滤技术","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是指在常温下以一定压力和流量,利用不对称微孔结构和半透膜分离介质,以错流方怯进行过滤、使溶剂及小分子物质通过, 高分子物质和微粒子如蛋白质,水溶性高聚物、细菌等被膜阻流,从而达到分离的目的的一种分离技术。","mnemonic":"汇集各章习题(sId6)名词解释","addedAt":1781947616073},{"id":"tr-394","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"tr-0027","title":"化学位移","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"1H 核因为周围化学环境的不同, 其外围电子云密度, 以及绕核旋转时产生的磁的屏蔽效应也就不同。在一定的外磁场作用下其回旋频率也不同, 因而需要相应频率的射频磁场才能发生共振而得到吸收信号。这些信号将会出现在不同的区域, 我们在实际应用当中以四甲基硅烷 TMS 为内标物, 将其化学位移定为 0 ,测定各质子共振频率与它的相对距离,这个相对值就是质子的化学位移值。","mnemonic":"汇集各章习题(sId6)名词解释","addedAt":1781947616073},{"id":"tr-395","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"tr-0028","title":"碱溶酸沉法","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"利用某些具有一定酸性的亲脂性成分,在碱液中能够溶解, 加酸后又沉淀析出的性质,进行此类成分的提取和分离。","mnemonic":"汇集各章习题(sId6)名词解释","addedAt":1781947616073},{"id":"tr-396","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"tr-0029","title":"超临界流体萃取法（SFE）","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"超临界流体萃取法是利用处于临界温度（Tc）和临界压力（Pc）以上的流体（常用超临界CO2）作为萃取剂提取天然产物的方法。超临界流体兼具气体的扩散性和液体的溶解能力，通过调节温度/压力改变其溶解性能，具有提取效率高、选择性好、无溶剂残留、适于热敏成分等优点。","mnemonic":"🆕课堂强调·补充｜〔2026-03-06 09:38 [16:00]〕｜非真题原题·据课堂整理｜汪玢明言名词解释会考","addedAt":1781947616073},{"id":"tr-397","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"tr-0030","title":"凝胶过滤法（分子筛过滤/Sephadex LH-20）","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"凝胶过滤法是利用凝胶（如葡聚糖凝胶Sephadex及其衍生物LH-20）的分子筛作用，按分子大小不同进行分离的色谱方法：大分子先洗脱、小分子后洗脱。Sephadex LH-20为羟丙基化的葡聚糖凝胶，既可在水中也可在有机溶剂中使用，常用于天然产物（如黄酮、苷类）的分离。","mnemonic":"🆕课堂强调·补充｜〔2026-03-27 09:38 [16:23]〕｜非真题原题·据课堂整理","addedAt":1781947616073},{"id":"tr-398","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"tr-0031","title":"pH梯度萃取法","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是指在分离过程中,逐渐改变溶剂的pH酸碱度来萃取有效成分或去除杂质的方法","mnemonic":"必背｜doubao习题汇总","addedAt":1781947616073},{"id":"tr-399","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"tr-0032","title":"有效成分","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"有效成分是指经药理和临床筛选具有生物活性的单体化合物,能用结构式表示,并具一定物理常数","mnemonic":"必背｜doubao习题汇总","addedAt":1781947616073},{"id":"tr-400","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"tr-0033","title":"盐析法","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"在水提取液中加入无机盐(如氯化钠)达到一定浓度时,使水溶性较小的成分沉淀析出,而与水溶性较大的成分分离的方法","mnemonic":"必背｜doubao习题汇总","addedAt":1781947616073},{"id":"tr-401","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"tr-0034","title":"有效部位","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"有效成分的群体物质","mnemonic":"了解｜doubao习题汇总","addedAt":1781947616073},{"id":"tr-402","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"tr-0035","title":"渗漉法","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"将药材粗粉用适当溶剂湿润膨胀后(多用乙醇),装入渗漉筒中从上边添加溶剂,从下口收集流出液的方法","mnemonic":"了解｜doubao习题汇总","addedAt":1781947616073},{"id":"tr-403","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"tr-0036","title":"【名词解释】植物一次代谢(初生代谢)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"植物一次代谢(初生代谢):维持植物生命活动的代谢过程(如葡萄糖等初生代谢产物)。二次代谢:产生次生代谢产物(多为天然药物有效成分)的过程。\n\n〔老师强调/扣分点〕老师:『要知道什么是植物的一次代谢』(名词解释)。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 名词解释/简答(一次代谢vs二次代谢产物—真题名解+问答'一次/二次代谢产物'+知到多选'一〕｜参考答案据课堂/教材整理","addedAt":1781947616073},{"id":"tr-404","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"tr-0037","title":"SF/SFE","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"超临界流体（SF）：处于临界度（Tc），临界压力（Pc）以上的流体。超临界流体萃取（SFE）：利用一种物质在超临界区域形成的流体进行提取的方法称为超临界流体萃取。","mnemonic":"重要｜天然药物化学名词解释+简答.docx","addedAt":1781947616073},{"id":"tr-405","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"tr-0038","title":"透析","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"穿过膜的选择性扩散过程。可用于分离分子量大小不同的溶质，低于膜所截留阈值分子量的物质可扩散穿过膜，高于膜截留阈值分子量的物质则被保留在半透膜的另一侧。","mnemonic":"重要｜天然药物化学名词解释+简答.docx","addedAt":1781947616073},{"id":"tr-406","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"tr-0039","title":"梯度洗脱","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"梯度性地改变洗脱液的组分(成分、离子强度等)或 pH，以期将层析柱上不同的组分洗脱出来的方法","mnemonic":"重要｜天然药物化学名词解释+简答.docx","addedAt":1781947616073},{"id":"tr-407","course":"天然药物化学","type":"填空记忆","chapter":"1. 总论","number":"tr-0040","title":"天然药物化学成分的分离主要依据分配系数差异、溶解度差异、酸碱度差异、分子量差异、极性差异等,___根据上述差异主要采用的方法有:___、___、___、___、___等。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"两相溶剂萃取法,沉淀法, pH 梯度萃取法,凝胶色谱法,硅胶色谱法或氧化铝色谱法。","mnemonic":"","addedAt":1781947616073},{"id":"tr-408","course":"天然药物化学","type":"填空记忆","chapter":"1. 总论","number":"tr-0041","title":"溶剂提取法中溶剂的选择主要依据___,___,___。三方面来考虑。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"溶剂的极性,被分离成分的性质,共存的其它成分的性质。","mnemonic":"","addedAt":1781947616073},{"id":"tr-409","course":"天然药物化学","type":"填空记忆","chapter":"1. 总论","number":"tr-0042","title":"对于大分子化合物如多肽、蛋白质、多糖等常用___色谱进行分离,除去中药水提取液中的无机盐小分子杂质,宜采用___方法。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"凝胶,透析法。","mnemonic":"","addedAt":1781947616073},{"id":"tr-410","course":"天然药物化学","type":"填空记忆","chapter":"1. 总论","number":"tr-0043","title":"常用的沉淀法有___、___和___等。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"试剂沉淀法,酸碱沉淀法,铅盐沉淀法。","mnemonic":"","addedAt":1781947616073},{"id":"tr-411","course":"天然药物化学","type":"填空记忆","chapter":"1. 总论","number":"tr-0044","title":"天然药物成分在溶剂中的溶解度直接与溶剂的___有关,___溶剂可分为___、和___三种。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"极性,水,亲水性有机溶剂,亲脂性有机溶剂。","mnemonic":"","addedAt":1781947616073},{"id":"tr-412","course":"天然药物化学","type":"填空记忆","chapter":"1. 总论","number":"tr-0045","title":"天然药物化学成分的提取方法有:___,___和___。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"溶剂提取法,水蒸气蒸馏法,升华法。","mnemonic":"","addedAt":1781947616073},{"id":"tr-413","course":"天然药物化学","type":"填空记忆","chapter":"1. 总论","number":"tr-0046","title":"化合物的极性常以___表示。其一般规律是:___,___;___,___。","options":{"A":"","B":"","C":"","D":""
