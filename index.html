:"2","title":"临床药理学是药物治疗学的科学基础,可以促进医药结合及基础与临床的结 合","answerText":"","options":{},"answer":"对","mnemonic":"了解｜临床药理题库(学习通)","priority":"了解","isRecall":false,"sourceId":1,"addedAt":1780168174678,"examProb":"了解"},{"id":"lin-113","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"时间药理学","answerText":"时间药理学是研究药物与生物周期相互关系的一门学科。其主要研究内容包括机体 的昼夜节律对药物作用或体内 过程的影响,药物对机体昼夜节律的影响 2药物滥用 指人们背离医疗、预防和保健目的,间断或不间断地自行过量用药的行为。这种用药 具有无节制反复用药的特征,往往导致对用药个人精神和身体的危害,并进而酿成对社会的严重 危害","options":{},"answer":"名词解释","mnemonic":"必背｜历年高频｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174679,"examProb":"必考"},{"id":"lin-114","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"半衰期","answerText":"药物的消除半衰期是指药物在体内消除一半所需要的时间,或血药浓度下降一半所需要 的时间。","options":{},"answer":"名词解释","mnemonic":"必背｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174680,"examProb":"必考"},{"id":"lin-115","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"稳态血药浓度","answerText":"临床用药若以一定的时间间隔,以相同的剂量多次给药,在 给药过程中血药浓度可逐次叠加,直至血药浓度维持在一定水平或在一定水平内上下波动,该范围即称为 稳态浓度,它有一个峰值(稳态时最大血药浓度),有一个谷值(稳态时最小血药浓 度)。","options":{},"answer":"名词解释","mnemonic":"必背｜历年高频｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174681,"examProb":"必考"},{"id":"lin-116","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"药物耐受性","answerText":"指人体在重复用药条件下形成的一种对药物的反应性逐渐减弱的状态。在此状态 下,该药原用剂量的效应明显减弱,必须增加剂量方可获原用剂量的相同效应。","options":{},"answer":"名词解释","mnemonic":"必背｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174682,"examProb":"必考"},{"id":"lin-117","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"药物滥用","answerText":"广义的药物滥用是指不合理应用药物。限定意义的药物滥用,指的是与医疗、预防和 保健目的无关的反复大量使用有依赖性特性(或称依赖潜能)的药物,用药者采用自身给药的方式 ,导致精神依赖性和生理依赖性,造成精神紊乱和出现一系列异常行为。","options":{},"answer":"名词解释","mnemonic":"必背｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174683,"examProb":"必考"},{"id":"lin-118","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"生物利用度","answerText":"是药物吸收速度与程度的一种量度。生物利用度可通过测定药物进入身血液循环 的相对量表示吸收程度,用血药浓度以及达峰的时间表示吸收速度(1分","options":{},"answer":"名词解释","mnemonic":"必背｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174684,"examProb":"必考"},{"id":"lin-119","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"不良反应","answerText":"是药物在正常用法和用量时由药物引起的不良和不期望产生的反应包括副作用毒性 反应、依赖性、特异质反应、过敏反应、致畸、致癌和致突变反应。 二、填空(请将正确答案填在横线上,每空","options":{},"answer":"名词解释","mnemonic":"必背｜历年高频｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174685,"examProb":"必考"},{"id":"lin-120","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"第三代胃动力药是","answerText":"A⻄沙必利;B甲氧氯普胺;C多潘立酮;D硫糖铝","options":{},"answer":"名词解释","mnemonic":"重要｜临床药理试题库","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174686,"examProb":"常考"},{"id":"lin-121","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"⻬多夫定的主要不良反应","answerText":"A⻣髓抑制;B末梢神经炎;C胰腺炎;D过敏反应","options":{},"answer":"名词解释","mnemonic":"必背｜历年高频｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174687,"examProb":"必考"},{"id":"lin-122","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"第3代磺酰脲类降糖药是","answerText":"A格列本脲 B格列吡嗪 C格列⻬特 D格列美脲","options":{},"answer":"名词解释","mnemonic":"重要｜临床药理试题库","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174688,"examProb":"常考"},{"id":"lin-123","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"非甾体抗炎免疫药","answerText":"A对正常体温亦有降温作用; B对内脏平滑肌绞痛有效; C对临床常见的慢性钝痛有良好的镇痛效果; D能根治类⻛湿关节炎","options":{},"answer":"名词解释","mnemonic":"重要｜临床药理试题库","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174689,"examProb":"常考"},{"id":"lin-125","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"联合用药的意义在于","answerText":"1提高药物的疗效;2减少药物的某些副作用;和3延缓机体耐受性或病原体耐药 性的产生,可延长疗程,从而提高药物的效果","options":{},"answer":"名词解释","mnemonic":"重要｜临床药理试题库","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174691,"examProb":"常考"},{"id":"lin-126","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"竞争性拮抗药","answerText":"能被受体识别,与受体有亲和力,能以和激动药类似的方式与受体结合,但其内在活性为0,不能产生生理效应却能妨碍受体激动药的作用。","options":{},"answer":"名词解释","mnemonic":"重要｜临床药理试题库","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174692,"examProb":"常考"},{"id":"lin-127","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"后遗效应","answerText":"停药后仍残留在体内的低于最低有效治疗浓度的药物所引起的药物效应。药 物的后遗效应可以是短暂的或是持久的。(1分","options":{},"answer":"名词解释","mnemonic":"重要｜临床药理试题库","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174693,"examProb":"常考"},{"id":"lin-128","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"表观分布容积","answerText":"是血药浓度与体内药物间的一个比值,意指体内药物按血浆中同样浓度分布时所 需的液体总容积,并不代表具体生理空间。反映药物分布的广泛程度或药物与组织成分的结合程 度。(1分","options":{},"answer":"名词解释","mnemonic":"重要｜临床药理试题库","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174694,"examProb":"常考"},{"id":"lin-158","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"临床药理学","answerText":"研究药物在人体内的作用规律和人体与药物间相互作用过程的交叉学科;","options":{},"answer":"名词解释","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174724,"examProb":"必考"},{"id":"lin-159","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"遗传药理学","answerText":"研究DNA序列个体变异引起的药物反应异常的学科,通过研究机体的遗传因素在药物代谢、转运和效应中的作用,以阐明人体对外源性物质反应个体差异的原因,是药理学和遗传学相结合发展起来的边缘学科。","options":{},"answer":"名词解释","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174725,"examProb":"必考"},{"id":"lin-160","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"药物依赖性","answerText":"药物滥用条件下,机体与滥用药物相互作用所形成的一种特殊精神状态,有些滥用药物还会使机体形成一种特殊身体状态。","options":{},"answer":"名词解释","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174726,"examProb":"必考"},{"id":"lin-161","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"药源性疾病","answerText":"人们在应用药物预防、治疗和诊断疾病时,因药物本身的固有作用、药物之间的相互作用以及药物的不合理使用,而导致机体组织器官发生功能性或器质性损害,并具有一系列临床症状和体征的疾病。","options":{},"answer":"名词解释","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174727,"examProb":"必考"},{"id":"lin-162","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"治疗药物监测(TDM)","answerText":"在药动学原理的指导下,应用灵敏快速的分析技术,测定血液中或其他体液中药物浓度,分析药物浓度与疗效及毒性间的关系,进而设计或调整给药方案。","options":{},"answer":"名词解释","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174728,"examProb":"必考"},{"id":"lin-163","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"GCP(药物临床试验质量管理规范)","answerText":"临床试验全过程的标准规定。包括方案设计、组织实施、稽查、记录、分析总结和报告。","options":{},"answer":"名词解释","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174729,"examProb":"必考"},{"id":"lin-164","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"新药临床研究","answerText":"人体进行的安全性与疗效的评价,是指任何在人体(病人或健康志愿者)进行药品的系统性研究,以证实或揭示试验用药品的作用及不良反应等,目的是确定试验用新药的疗效与安全性。","options":{},"answer":"名词解释","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174730,"examProb":"必考"},{"id":"lin-166","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"首过消除","answerText":"胃肠粘膜及肝脏的酶的代谢作用,使进入体循环的药量减少的效应","options":{},"answer":"名词解释","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174732,"examProb":"必考"},{"id":"lin-168","course":"临床药理学","type":"名词解释记忆","chapter":"综合","number":"","title":"药物警戒","answerText":"发现、评价、认识和预防药品不良作用或其他任何与药物相关问题的科学和活动。","options":{},"answer":"名词解释","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174734,"examProb":"必考"},{"id":"lin-129","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"新药临床试验分几期","answerText":"简述各期主要内容是什么?分为四期。I期临床试验:初步的临床药理学及 人体安全性评价;包括药物耐受性试验与药动学研究;实验对象:健康志愿者;II期临床试验:主要 目的:确定是否安全有效,与对照组比较有多大的治疗价值;确定适应证、最佳治疗方案;评价不良反应 及危险性并提供防治方法。III期临床试验:扩大的多中心临床试验,进一步评价新药的有效性和安 全性;治疗作用确证阶段。IV期临床试验:目的:考察在广泛使用条件下的疗效和不良反应等。主 要对象是一些疗效不确切或不良反应较多或有严重反应的市场药物","options":{},"answer":"简答题","mnemonic":"必背｜历年高频｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174695,"examProb":"必考"},{"id":"lin-130","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"强心甙的不良反应及其防治","answerText":"答:1不良反应:A.心脏毒性:强心甙中毒可表现我各种不 同类型的心律失常;B.胃肠道反应:为早发症状,如恶心、呕吐等;C.神经系症状:头 痛、头晕、嗜睡等,也可发生视觉障碍及色觉障碍。 2防治:个体化用药方案是预防强心甙中毒 的关键。及早发现并消除电解质紊乱等中毒促发因素,并根据血药浓度合理调整用药剂量,是有效的预防 措施。治疗则是根据中毒症状的类型和严重程度,采取相应措施。","options":{},"answer":"简答题","mnemonic":"必背｜历年高频｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174696,"examProb":"必考"},{"id":"lin-131","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"抗心律失常药临床应用原则","answerText":"答:不同类型的抗心律失常药其临床适应症各有不同,又易引起不同 类型的不良反应,甚至发生致心律失常作用。抗心律失常药的合理应用,应注意以下原则: 1认识并消除各种心律失常的促发因素。如患者身体内电解质的紊乱、心肌缺血缺氧等。 2明确诊断,按临床适应症合理选药。不同类型抗心律失常药电生理作用存在差异,故临床适应症各有不 同。 3掌握患者情况,实施个体化治疗方案。临床不同病理因素的影响,可能改变药物体内过 程,以致在常规剂量下,可能发生血药浓度偏高的现象,故必须强调按患者的具体情况,个体化的确定用 药方案。 4注意用药禁忌,减少危险因素。不同抗心律失常药的药理作用存在差异,决定它们有着各不相同的临床 用药禁忌,为减少发生严重不良反应的危险,需重视临床用药的禁忌。","options":{},"answer":"简答题","mnemonic":"重要｜临床药理试题库","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174697,"examProb":"常考"},{"id":"lin-132","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"⻘霉素过敏反应的抢救和预防","answerText":"答:抢救:过敏反应以皮疹最常见,以过敏性休克最严 重。过敏性休克一旦发生,必须就地抢救,立即给病人肌注","options":{},"answer":"简答题","mnemonic":"重要｜临床药理试题库","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174698,"examProb":"常考"},{"id":"lin-133","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"抗恶性肿瘤药中细胞周期特异性药物与非细胞周期特异性药物作用特点的比较","answerText":"答:周期特异性药物对 癌细胞的作用慢而弱,剂量反应曲线为渐近线,在血药浓度和用药时间的关系中,用药时间是主要因素, 给药途径以缓慢滴注为主。;周期非特异性药物对癌细胞的作用快而强,剂量反应曲线呈直线 关系,在血药浓度和用药时间的关系中,血药浓度是主要影响因素,采用静脉推注的方式为主。","options":{},"answer":"简答题","mnemonic":"必背｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174699,"examProb":"必考"},{"id":"lin-134","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"在何种情况下血药进行治疗药物监测","answerText":"答:1药物的有效血浓度范围(cid:4608)窄。此类药物多为治疗 指数小的药物,如强心苷类。 2同一剂量可能出现较大的血药浓度差异的药物。如三环类抗忧郁 症药。 3具有非线性药代动力学特征的药物。如苯妥因钠、茶碱、水杨酸等。 4肝肾功能不全或衰竭的患者使用主要经肝代谢消除(利多卡因、茶碱等)或肾排泄(氨基糖苷类抗生素 等)的药物时,以及胃肠道功能不良的患者口服某些药物时。 5长期用药的患者,依从性差,不 按医嘱用药;或者某些药物长期使用后产生耐药性;或诱导(或抑制)肝药酶的活性而引起药效降低(或 升高),以及原因不明的药效变化。 6怀疑患者药物中毒,尤其有的药物中毒症状与剂量不足的 症状类似,而临床又不能明确辨别。如普鲁卡因胺治疗心律失常时,过量也会引起心律失常。 7 合并用药产生相互作用而影响疗效时。8药代动力学的个体差异很大,特别是由遗传造成药物 代谢速率明显差异的情况。如普鲁卡因胺的乙酰化代谢。9常规剂量下出现毒性反应,诊断和 处理过量中毒,以及为医疗事故提供法律依据。10当病人的血浆蛋白含量低时,需要测定血中 游离药物的浓度。如苯妥因钠","options":{},"answer":"简答题","mnemonic":"必背｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174700,"examProb":"必考"},{"id":"lin-135","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"诊断ADR的主要依据、ADR的可能度及ADR判断的方法","answerText":"答:ADR即 adverse reaction,不良反应。 依据:1是否以前对这种反应有结论性的报告,即是否是在动物试验或临床研究和应用中已经肯 定过的反应;2这种不良反应是否发生在被怀疑的药物应用之后(时序性);3在停止使用被怀疑的药物 (撤药试验)或者是用了特异性对抗药后不良反应获得改善,4再次使用被怀疑的药物后(包括皮试)这 种不良反应又发生(激惹现象);5是否有药物以外的可疑因素引起这种反应;6在应用安慰剂后,这种 反应是否仍然发生;7是否从血液或其它体液中检测到了可引起毒性的药物浓度;8当药物剂量增加或降 低时,反应是否也随之加重和改善(激惹现象);9病人在以前是否在同一药物或相似药物之后有相同的 反应;10反应是否被任何客观证据证实。 可能度:在确定药物和不良反应或药源性疾病之 间的因果关系时,通常根据下述标准进行分类:1肯定:用药后符合合理的时间顺序;从体液或组织内测 得的药物浓度获得证实;符合被怀疑药物的反应特点;停止用药后即可改善,或者再次用药又发生;不能 由病人的疾病所解释。 2很可能:在药物应用之后由一个合理的时间顺序;符合药物已知的反应特点; 经停药证实,当未经再给药证实;病人的疾病不能解释。3可能:有合理的时间顺序;可能符合,也可能 不符合已知的反应方式;可以由患者的临床表现或已知的药物反应特征解释。 4条件的:时间顺序合 理;与已知的不良反应不符;不能以疾病来解释。 5可疑的:反应很可能时由被怀疑药物以外的其它因 素引起。 ADR判断的方法:包括临床医学中的常规诊断方法和ADR判断的专属性方法,确 定病例报告中药物与可疑ADR之间因果关系有四种方法,即综合判断法、描述性系统评价法、记分评定 法、统计学分析判断法。统计分析方法包括泊松分布判断法、⻉叶斯判别法、利用死亡率统计调查、干预 试验法等。","options":{},"answer":"简答题","mnemonic":"重要｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174701,"examProb":"必考"},{"id":"lin-136","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"在哪些情况下需要进行TDM","answerText":"、在哪些情况下需要进行TDM?","options":{},"answer":"简答题","mnemonic":"必背｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174702,"examProb":"必考"},{"id":"lin-137","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"抗高血压药物的分类及代表药","answerText":"1. 肾素-血管紧张素系统抑制药:卡托普利,洛沙坦,2. 钙通道阻滞药:硝苯地平,尼莫地平3. 交感神经阻断药:可乐定,利血平,哌唑嗪,普萘洛尔4. 利尿药:氢氯噻嗪5. 血管扩张药:二氮嗪","options":{},"answer":"简答题","mnemonic":"必背｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174703,"examProb":"必考"},{"id":"lin-138","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"抗心律失常药物的分类及代表药","answerText":"简述抗心律失常药物的分类及代表药。","options":{},"answer":"简答题","mnemonic":"重要｜临床药理试题库","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174704,"examProb":"常考"},{"id":"lin-139","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"抗菌药物临床应用的基本原则","answerText":"1重视和加强病原学检查,尽早确立感染性疾病的病原诊断,严 格掌握适应症2熟悉药物的抗菌活性,药代动力学特点,适应症和不良反应3按照患者的 生理、病理及免疫状态等和利用药 4应注意抗菌药物的使用应严加控制或尽量避免的情况: 如病 毒性感染或发热不明者不宜轻易采用;皮肤粘膜等局部应用抗菌药应避免,因易引起过敏或产生耐药;选 用适当的给药方案和疗程;加强宣传教育,建立相应组织,纠正不合理 使用抗菌药物等。","options":{},"answer":"简答题","mnemonic":"必背｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174705,"examProb":"必考"},{"id":"lin-140","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"影响药物作用的因素有哪些","answerText":"1.药物方面的因素: 1剂量问题; 2药物剂型问题; 3制药工艺问题:4复方制剂问题。2 .机体方面的因素:1年龄;2性别;3营养状态;4精神因素。5疾病因素;6遗传因素。3.环境条件方面的因素: 1给药途径;2时间药理学因素;3连续用药;4联合用药和药物的相互作用;5吸烟、嗜酒与环境污染问题","options":{},"answer":"简答题","mnemonic":"必背｜历年高频｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174706,"examProb":"必考"},{"id":"lin-141","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"血管紧张素转化酶抑制 药","answerText":"卡托普利、依那普利、雷米普利","options":{},"answer":"简答题","mnemonic":"重要｜临床药理试题库","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174707,"examProb":"常考"},{"id":"lin-142","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"交感神经抑制药(1)中枢性降压药","answerText":"可乐定、α- 甲基多巴神经节阻滞药:美加明、咪噻芬交感神经末梢抑制药:利血平、胍乙啶α受体阻 断药:哌唑嗪、特拉唑嗪、多沙唑嗪β受体阻断药:普萘洛尔、美托洛尔α、β受体阻断药:拉 ⻉洛尔、卡维地洛 6血管扩张药直接舒张血管药:肼屈嗪、硝普钠钾通道开放药: 二氮嗪、吡那地尔、米诺地尔其他:乌拉地尔","options":{},"answer":"简答题","mnemonic":"必背｜历年高频｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174708,"examProb":"必考"},{"id":"lin-143","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"胰岛素的适应症及使用时的注意事项","answerText":"a.I型糖尿病、妊娠糖尿病、特殊类型糖尿病(垂体性 糖尿病); b.对合理的饮⻝治疗和口服降糖药治疗后血糖仍然未达标的II型糖尿病患者; 2使用时的注意 事项: a. 个体化,从小剂量开始(皮下)使用。 I型糖尿病:替代治疗、II型糖尿病:补充治疗或 替代治疗 开始就单用胰岛素,初始剂量可按","options":{},"answer":"简答题","mnemonic":"重要｜临床药理试题库","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174709,"examProb":"常考"},{"id":"lin-144","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"II期临床试验设计","answerText":"(10点)1)对照试验:新药临床试验必须设对照组,是比较两组病人的治疗结果。 2)随机化设计:目的使试验对象被均匀地分配到各试验组去,不受主观意志或客观条件的影 响,排除分配误差。 3)盲法试验:是不让医生和病人知道每一个具体的受试者接受 的是试验药还是对照药。 4)安慰剂:是把没有药理活性的物质用作临床对照试验中 的阴性对照。 5)病例选择与淘汰标准:病例选择标准:1根据专业要求确定选择标 准。2根据统计学要求确定选择标准。3应把获得受试者知情同意书作为入选标准。病例排除标准:1根据专业要求确定淘汰标准。2 根据统计学要求确定淘汰标准。 6)药效评定标准: 我国临床疗效评价一般采用四级评定标准:无效,改善,进步和明显进步。 7)病人的依从性 :临床试验中,病人的依从性最重要的一点是按规定服药。 8)临床试验的病例数估 计:1根据统计学要求估计病例数。2按专业要求估计病例数。3按照新药审批要求完成病例 数。 9)安全性评估:临床试验中不良事件包括临床不良反应与化验异常两个部分 。 10)临床资料的统计处:临床试验资料有计量资料与计数资料,统计采用比较权威 的软件进行。","options":{},"answer":"简答题","mnemonic":"必背｜历年高频｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174710,"examProb":"必考"},{"id":"lin-145","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"影响药物作用的药物方面的因素","answerText":"答:1剂量问题:通常按照在一定时间内给药总剂量不变的原则,两次给药之间的间隔时间较 长,则每次的用药量就较大,而血药浓度波动也较大。最大浓度不能超过最低中毒浓度,最低浓度不应低 于最小有效浓度。 2药物的剂型问题:同一药物的不同剂型吸收速率和分布的范围可以不同,从 而影响药物起效时间、作用强度和维持时间等。一般来说,吸收快的剂型药物血浓度的峰值较高,单位时 间内排出也较多,故维持时间较短。吸收太慢则血药峰浓度可能太低而影响疗效。 3制药工艺问题:提取和纯化等制药工艺的粗精,影响药物杂质的含量,从而影响药物本身的作用;制药工艺的差异, 包括所用赋形剂的不同,可能导致药物颗粒大小不同而影响药物吸收。 4复方制剂(成药)问题:复方制剂实即联合用药的一种方便病人服用的制剂,应该考虑药物的相互作用。","options":{},"answer":"简答题","mnemonic":"重要｜临床药理试题库","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174711,"examProb":"常考"},{"id":"lin-146","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"药物不良反应和药源性疾病的治疗原则","answerText":"133 答:药物不良反应和药源性疾病的治疗原则为: 药源性疾病的处理,原则上是若怀疑出现的 病征是由药物所引起,而又不能明确定为何种药物时,可能的话,首先是停止应用某种药物。这样做不但 可能及时终止致病药物继续损害机体,而且有助于诊断。停药后,临床症状减轻或缓解可提示疾病为药源 性。此后根据病情采取治疗方案。A.由于药源性疾病多有自限性的特征,停药后无需特殊处理,待药物自 体内消除后,可以缓解。B.症状严重时须进行对症治疗,如致病药物已很明确,可选用特异性拮 抗药。若是药物变态反应,应将致病药物告知病人防治日后再度复发。","options":{},"answer":"简答题","mnemonic":"必背｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174712,"examProb":"必考"},{"id":"lin-147","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"不宜使用强心苷治疗的心力衰竭类型","answerText":"答:心肌外界因素如心包填塞、缩窄性心包炎、严重二尖瓣 (cid:4608)窄所致心力衰竭。这些病理因素均使左心室舒张期血液充盈度严重受损,强心苷虽加强心肌收 缩,亦难以改善心肌功能。肥厚型心肌病伴左心室流出道(cid:4608)窄,亦应避免使用强心苷。急 性心急梗塞所致左心衰竭,强心苷单(cid:4607)使用可能增加心肌耗氧,导致心急梗塞范围扩大,应与降低心脏前 负荷的血管扩张配伍应用。","options":{},"answer":"简答题","mnemonic":"重要｜临床药理试题库","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174713,"examProb":"常考"},{"id":"lin-148","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"细菌对⻘霉素产生耐药性的机制","answerText":"答:细菌对⻘霉素产生耐药性主要有三种机制:1细菌产生β内 酰胺酶,使⻘霉素类水解灭活;2细菌体内⻘霉素类作用靶位-⻘霉素结合蛋白发生改变,致药 物不能与之结合而产生抗菌作用;3细菌细胞壁对⻘霉素类的渗透性减低。其中以第一种 机制最为常见,也最重要。","options":{},"answer":"简答题","mnemonic":"重要｜临床药理试题库","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174714,"examProb":"常考"},{"id":"lin-149","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"治疗心绞痛药物的分类及作用机制","answerText":"答:1硝酸酯类:A:血液动力学作用:本类药物能松弛大多数的 动脉和静脉的血管平滑肌低浓度的硝酸甘油引起静脉血管的扩张作用大于对动脉血管的扩张作用。B:对冠脉总血流量和局部血流量的作用:缺血是冠状血管扩张的有效刺激因素,它通过自身调节机 制改变小的阻力血管而对局部血流进行调整。C:对心肌耗氧量的影响:通过对全身血液循环的 作用,硝酸酯类可降低心肌耗氧量。D:硝酸甘油释放的 NO也可兴奋血小板的腺苷酸环化酶, cAMP增加可抑制血小板的聚集。2钙通道阻滞剂:A:平滑肌作用:钙通道阻滞药松弛平滑肌 细胞,以血管平滑肌最敏感,小动脉的敏感性较静脉更高B:心肌作用:钙通道阻滞药对心肌收缩 力有剂量依赖性减弱作用。从而减少心肌氧耗。C:血液动力学作用:硝苯地平在口服20mg 时可 引起全身阻力血管降低和血压下降,反射性引起心率加快和心输出量增加。3β受体阻滞药:其 对心绞痛的治疗作用来源于它的血液动力学作用:减慢心率、降低血压和收缩力,从而降低静息和运动时 的心肌耗氧。在减慢心率的同时,舒张期灌注时间延长,使心肌灌流增多。β受体阻滞药对缺血和 非缺血心肌冠脉段的作用不同,可使达到缺血心肌的冠脉流量重新分布。","options":{},"answer":"简答题","mnemonic":"重要｜临床药理试题库","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174715,"examProb":"常考"},{"id":"lin-150","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"药物相互作用的几种方式","answerText":"体外药物相互作用,药代动力学方面药物相互作用,药效学方面药物相互作用体外药物相互作用:指药物合用时,由于制剂不合理,发生直接物理或化学反应导致药物作用改变,即一般所称的化学或物理配伍禁忌,也称为物理化学性相互作用,大部分可归于体外作用。药代动力学方面药物相互作用: 指一种药物能使另一种药物的吸收、分布、代谢和排泄等环节发生变化,从而影响另一种药物的血浆浓度,进一步改变其作用强度。药效学方面药物相互作用: 是指药物合用,一种药物增强或减弱了另一种药物的药理效应,但对血药浓度并无明显的影响。","options":{},"answer":"简答题","mnemonic":"必背｜历年高频｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174716,"examProb":"必考"},{"id":"lin-151","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"需要进行TDM的抗菌药物","answerText":"答:1药物毒性大,其治疗浓度与中毒浓度接近者:如氨基糖苷类。 2新生儿期使用易发生严重毒性反应者,如氯霉素。 3肾功能减退时易发生毒性反应 者,如氟胞嘧啶。 4某些特殊部位的感染,确定感染部位是否已达到有效药物浓度,或浓度过高 有可能导致毒性反应,如测定⻘霉素在脑脊液中的浓度。⻘霉素类、头孢菌素类、大环内酯类等由于其毒 性低,治疗浓度范围宽,一般在治疗剂量范围内根据病情调整剂量可达到有效浓度水平,不致发生毒性反 应,因此原则上对上述抗生素毋须常规进行TDM监测。但在特殊情况下,如肾功能减退患者伴发严重感 染需用大剂量⻘霉素时,为防止脑脊液内药物浓度过高而发生中枢神经系统毒性反应,则可进行脑脊液及 血药浓度监测,据以调整药物剂量。","options":{},"answer":"简答题","mnemonic":"必背｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174717,"examProb":"必考"},{"id":"lin-152","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"一级速率过程的特点","answerText":"一级速率过程是指某一时刻体内药量转化的速率与体内当时药量成正比, 用方程表示为:dX/dt=-kX.其特点为:1半衰期与剂量无关;2药物转运呈指数衰减,每 单位时间内转运的百分比不变;3一次给药后药时曲线下面积与剂量成正比。","options":{},"answer":"简答题","mnemonic":"重要｜临床药理试题库","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174718,"examProb":"常考"},{"id":"lin-153","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"抗休克治疗时缩血管药物的应用指征和注意事项","answerText":"1)应用指征:1血压骤降,需短时间内提升血 压,增强心肌收缩力,保证重要脏器的血液供应;2补充血容量后,血压仍不回升,外周阻力降低, 心输出量少者;3与α受体阻断药合用,可去除其α受体的兴奋作用,保留β受体兴奋作用。 注意事项:在纠酸补充血容量总的原则下,短期内小量使用,如症状无明显改善,应停药, 改用其他抗休克药物。","options":{},"answer":"简答题","mnemonic":"重要｜临床药理试题库","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168174719,"examProb":"常考"},{"id":"lin-155","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"与剂量有关和无关的药物不良反应特点","answerText":"与剂量有关(A型反应 与剂量无关(B型反应) 1 反应性质 定量 定性 2可预见性 可 不可 3发生率 高 低 4死亡率 低 高 5肝脏或肾脏功能障碍 毒性增加 不影响 6预防 调整剂量 避免用药 7治疗 调整计量 停止用药","options":{},"answer":"简答题","mnemonic":"必背｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174721,"examProb":"必考"},{"id":"lin-156","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"新药临床试验的分期及内容","answerText":"分为四期。I期临床试验:初步的临床药理学及人体安全性评 价;包括药物耐受性试验与药动学研究;实验对象:健康志愿者;II期临床试验:主要目的:确定是 否安全有效,与对照组比较有多大的治疗价值;确定适应证、最佳治疗方案;评价不良反应及危险性并提 供防治方法。III期临床试验:扩大的多中心临床试验,进一步评价新药的有效性和安全性;治疗作 用确证阶段。IV期临床试验:目的:考察在广泛使用条件下的疗效和不良反应等。主要对象是一些 疗效不确切或不良反应较多或有严重反应的市场药物","options":{},"answer":"简答题","mnemonic":"必背｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174722,"examProb":"必考"},{"id":"lin-157","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"阿司匹林的药理作用及其机制、不良反应","answerText":"1)药理作用及其机制:1抗炎、抗⻛湿作用:主要是 由于其抑制PG合成酶,减少PG的生成;此外通过抑制白细胞凝聚,减少激肽的形成、抑制透明质酸酶、 抑制血小板聚集、及钙的转移而发挥抗炎作用;2解热作用:抑制PGs合成而发挥解热作用,能 降低发热者的体温,对体温正常者几乎无影响,对症而步对因;3镇痛作用:减少炎症部位PGs 的生成,故有明显镇痛作用,对慢性疼痛效果良好,对尖锐性一过性疼痛无效;4影响血栓形 成:抑制COX活性,减少血小板中TXA2的生成,有抗血小板聚集和抗血栓形成作用。(1分不良反 应:1胃肠道反应:短期用不良反应少,用量较大时,常易发生⻝欲不振、恶心呕吐;严重时消化道出 血,长期服用溃疡发生率较高; 2对血液系统的影响:用药后出血时间延长,大剂量时易引起血 小板减少症,维生素K可防治之;3对肝、肾的影响:表现为转氨酶升高,肝细胞坏死。PG有扩 张血管维持肾血流的作用,长期使用可出现不同程度的肾损伤;(1分 4水杨酸反应:应用本品量过大 时,可出现耳鸣、头痛、头晕、视听减退,重者有精神紊乱、酸碱平衡障碍和出血等; 5过敏反 应:较常见的是哮喘,严重的可致死。 6其他不良反应 4","options":{},"answer":"简答题","mnemonic":"必背｜历年高频｜临床药理试题库","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168174723,"examProb":"必考"},{"id":"lin-169","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"TDM(治疗药物监测)的临床意义","answerText":"1.使给药方案个体化 2.诊断和处理药物过量中毒 3.进行临床药代动力学和药效学的研究,探讨新药的给药方案 4.节省患者治疗时间,提高治疗成功率 5.降低治疗费用 6.避免法律纠纷","options":{},"answer":"简答题","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174735,"examProb":"必考"},{"id":"lin-170","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"需要进行TDM的情况","answerText":"(1)药物的有效血药浓度范围狭窄。(2)同一剂量可能出现较大的个体间血药浓度差异的药物。(3)具有非线形药代动力学特征的药物,尤其是非线性动力学过程发生在有效血药浓度范围内或小于最低有效血药浓度时。(4)肝肾功能不全或衰竭的患者使用主要经肝代谢消除或肾排泄的药物时。(5)长期用药的患者的不依从性。(6)怀疑患者药物中毒,尤其有的药物的中毒症状与剂量不足的症状类似,而临床又不能明确辨别的。(7)合并用药产生相互作用而影响疗效的。","options":{},"answer":"简答题","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174736,"examProb":"必考"},{"id":"lin-172","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"A型与B型不良反应的特点","answerText":"A型反应(augmented):是指由于药品的药理作用增强而引起的不良反应。其程度轻重与用药剂量有关,一般容易预测,发生率较高而死亡率较低。副作用、毒性反应、继发反应、后遗效应和停药反应等均属此类型。B型反应(bizarre):是指与药品本身药理作用无关的异常反应。通常难以预测在具体病人身上是否会出现。在药物研究阶段的常规毒理学试验中难以发现,一般与用药剂量无关,发生率低但死亡率较高。特异质反应和过敏反应属于此类。","options":{},"answer":"简答题","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174738,"examProb":"必考"},{"id":"lin-173","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"东方人对酒精(乙醇)不耐受的原因","answerText":"乙醛脱氢酶(ALDH)异常是乙醇不耐受的主要原因。因为东方人中线粒体ALDH2缺损发生率高,低红细胞ALDH活性与饮酒后心率加快呈负相关,ALDH2缺损者比无面部潮红正常ALDH2有更高的乙醛浓度,但它们乙醇浓度却相同。乙醇脱氢酶(ADH)异常是乙醇不耐受的次要原因,因为90%以上的东方人具有活性高于正常几倍的非典型ADH,而因高浓度乙醛引起面红发生率仅为50%。典型和非典型ADH携带者在乙 醇代谢速率无显著差异。","options":{},"answer":"简答题","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174739,"examProb":"必考"},{"id":"lin-176","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"药物滥用的危害","answerText":"对个人的危害:药物滥用者身心健康遭受催残。药物过量,常致中毒死亡。身体免疫力降低,引发各种感染。对社会的危害:药物滥用破坏家庭正常生活;药物滥用促发犯罪行为;药物滥用耗竭社会经济,阻碍社会发展","options":{},"answer":"简答题","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174742,"examProb":"必考"},{"id":"lin-178","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"合理使用抗菌药的目的","answerText":"提高感染的抗菌治疗水平保障患者用药安全减少细菌耐药性降低医药费用","options":{},"answer":"简答题","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174744,"examProb":"必考"},{"id":"lin-181","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"老年人用药原则","answerText":"选药原则:1.须有明确的用药指征2.选用最熟悉的药物3.避免应用不适于老年患者的药物4.选择合适的药物剂型5.慎用滋补药或抗衰老药用药准确合理:1.避免多重用药2.个体化给药剂量3.及时停药4.选择最佳给药时间5.嗜好控制6.提高用药依从性","options":{},"answer":"简答题","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174747,"examProb":"必考"},{"id":"lin-182","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"安慰剂对照在药物评价中的作用","answerText":"1.随机对照试验中作阴性对照,使新药有可能在盲法条件下评价其安全有效性2.在有阳性对照时,同时设安慰剂对照,监察测试方法灵敏度3.排除精神因素在药物治疗中的作用4.排除疾病本身的自发变化。","options":{},"answer":"简答题","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174748,"examProb":"必考"},{"id":"lin-183","course":"临床药理学","type":"简答记忆","chapter":"综合","number":"","title":"细胞周期特异性与非特异性药物作用特点比较","answerText":"周期特异性药物对癌细胞的作用慢而弱剂量反应曲线为渐近线,在血药浓度和用药时间的关系中,用药时间是主要因素,给药逄径以缓慢滴注为主。周期非特异性药物对癌细胞的作用快而强,剂量反应曲线呈直线关系,在血药浓度和用药时间的关系中,血药浓度是主要影响因素,采用静脉推注的方式为主。","options":{},"answer":"简答题","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174749,"examProb":"必考"},{"id":"lin-171","course":"临床药理学","type":"论述记忆","chapter":"综合","number":"","title":"新药临床试验四期及内容目的","answerText":"I期临床试验:初步的临床药理学及人体安全性评价试验,内容为药物耐受性试验与药物动力学研究。目的:研究人体对药物的耐受程度并通过药物动力学研究,了解药物在人体内的吸收、分布、消除的规律,为新药II期临床试验提供安全有效的合理试验方案II期临床试验:治疗作用初步评价阶段,目的:初步评价药物对目标适应症患者的治疗作用和安全性,也包括为III期临床试验研究设计和给药剂量方案的确定提供依据。III期临床试验:扩大的多中心临床试验,是治疗作用的确证阶段。目的是进一步验证药物对目标适应症患者的治疗作用和安全性,评价利益与⻛险关系,最终为药物注册申请获得批准提供充份的依据。IV期新药临床试验:即上市后临床试验,又称上市后监察,内容包括扩大临床试验,特殊对象的临床试验,补充临床试验,不良反应考察。目的是考察在广泛使用条件下的药物的疗效和不良反应(注意罕见不良反应),评价在普通或者特殊人群中使用的利益与⻛险关系;改进给药剂量等,并根据进一步了解的疗效、适应症与不良反应情况,指导临床合理用药","options":{},"answer":"论述题","mnemonic":"必背｜临床药理学讲义(带答案)｜历年高频","priority":"必背","isRecall":true,"sourceId":3,"addedAt":1780168174737,"examProb":"必考"},{"id":"lin-184","course":"临床药理学","type":"名词解释记忆","chapter":"课堂强调补充","number":"","title":"药品不良反应（ADR）","answerText":"在正常的用法用量下,用于预防、诊断、治疗疾病或调节生理功能时,出现的与用药目的无关的有害反应。【三关键词】正常用法用量／与用药目的无关／有害反应。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-03-23 13:48 [27:53]〕｜非真题原题·据课堂整理","priority":"必背","isRecall":true,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-185","course":"临床药理学","type":"名词解释记忆","chapter":"课堂强调补充","number":"","title":"不良事件（AE）","answerText":"用药病人或临床研究对象在用药过程中发生的任何不幸的医学事件,但该事件不一定与治疗有因果关系。与ADR的根本区别:是否必须有因果关系。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-03-23 13:48 [31:51]〕｜非真题原题·据课堂整理","priority":"必背","isRecall":true,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-186","course":"临床药理学","type":"名词解释记忆","chapter":"课堂强调补充","number":"","title":"药源性疾病","answerText":"由药物引起的疾病,范围比ADR更广——除正常用量下的不良反应外,还包括因超量、误服、错用、不正常使用药物所致的疾病。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充(对比角度:范围比ADR更广)｜〔2026-03-23 15:38 [41:47]〕｜非真题原题·据课堂整理","priority":"必背","isRecall":true,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-187","course":"临床药理学","type":"名词解释记忆","chapter":"课堂强调补充","number":"","title":"毒性作用","answerText":"在正常用法用量下,由于个体差异、病理状态或合并用药使敏感性增加而引起的有害反应,属于ADR。注意:因过量服用引起的毒性反应不属于ADR。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-03-23 14:38 [05:39]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-189","course":"临床药理学","type":"名词解释记忆","chapter":"课堂强调补充","number":"","title":"联合用药（药物相互作用）","answerText":"同时或相隔一定时间内使用两种或两种以上药物,所产生的药动学和药效学的改变,从而使药物在体内的药理作用出现增强或减弱的现象。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 13:48 [23:57]〕｜非真题原题·据课堂整理","priority":"必背","isRecall":true,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-190","course":"临床药理学","type":"名词解释记忆","chapter":"课堂强调补充","number":"","title":"药物警戒","answerText":"与发现、评估、理解和预防药物不良反应或任何其他药物相关问题有关的科学研究与活动;贯穿药品研发设计到上市后的始终,是主动手段。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充(对比角度:贯穿研发→上市后始终·主动)｜〔2026-03-25 13:48 [13:19]〕｜非真题原题·据课堂整理","priority":"必背","isRecall":true,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-191","course":"临床药理学","type":"名词解释记忆","chapter":"课堂强调补充","number":"","title":"治疗药物监测（TDM）","answerText":"在药物治疗过程中,通过测定血药浓度等指标,据此设计或调整给药方案,使药物维持在治疗窗(最低有效浓度~最低中毒浓度)内,实现个体化给药。理论基础:血药浓度与药理效应的关系优于剂量与效应的关系。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 13:48 [28:19]〕〔2026-04-09 09:38 [38:03]〕｜非真题原题·据课堂整理","priority":"必背","isRecall":true,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-192","course":"临床药理学","type":"名词解释记忆","chapter":"课堂强调补充","number":"","title":"抗生素后效应（PAE）","answerText":"细菌与抗菌药短暂接触后,在药物浓度降至MIC以下甚至消失后,细菌生长仍受到持续抑制的效应(类比后遗效应)。老师明确「经常会考到它」。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-04-09 09:38 [29:36]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-193","course":"临床药理学","type":"名词解释记忆","chapter":"课堂强调补充","number":"","title":"药物滥用／药物依赖性","answerText":"药物滥用:与医疗目的无关、反复大量地自行使用药物(追求快感)。药物依赖性:分精神依赖性与身体(生理)依赖性,后者表现为戒断反应。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-04-02 09:38 [10:18]〕〔2026-04-02 09:38 [15:03]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-194","course":"临床药理学","type":"多选","chapter":"课堂强调补充","number":"","title":"需要进行治疗药物监测(TDM)的药物/情况包括","answerText":"","options":{"A":"治疗指数低、治疗窗窄、毒性大的药物","B":"新生儿/小儿","C":"需长期用药维持治疗的病人","D":"多脏器功能障碍患者"},"answer":"ABCD","mnemonic":"🆕课堂强调·补充｜〔2026-04-09 09:38 [38:03]〕〔2026-03-25 13:48 [34:16]〕｜非真题原题·据课堂整理","priority":"必背","isRecall":false,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-195","course":"临床药理学","type":"选择","chapter":"课堂强调补充","number":"","title":"关于A型不良反应,下列正确的是","answerText":"","options":{"A":"与剂量无关、难预测","B":"与剂量相关、可预测、发生率高、死亡率低","C":"发生率低、死亡率高","D":"不发生于首次用药"},"answer":"B","mnemonic":"🆕课堂强调·补充｜〔2026-03-23 13:48 [35:24]〕｜非真题原题·据课堂整理","priority":"必背","isRecall":false,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-196","course":"临床药理学","type":"选择","chapter":"课堂强调补充","number":"","title":"下列属于药动学相互作用的是","answerText":"","options":{"A":"配伍禁忌(沉淀结晶)","B":"受体水平的协同/拮抗","C":"通过影响吸收/分布/代谢/排泄改变血药浓度","D":"体外理化反应"},"answer":"C","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 14:38 [24:33]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-197","course":"临床药理学","type":"选择","chapter":"课堂强调补充","number":"","title":"在药物相互作用中,发生比例最大、临床意义最大的是","answerText":"","options":{"A":"吸收环节","B":"分布环节","C":"代谢环节(约90%经CYP450,酶抑制约70%、酶诱导约23%)","D":"排泄环节"},"answer":"C","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 15:38 [26:35]〕｜非真题原题·据课堂整理","priority":"必背","isRecall":false,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-198","course":"临床药理学","type":"选择","chapter":"课堂强调补充","number":"","title":"关于药物吸收,下列正确的是(圈起来的口诀)","answerText":"","options":{"A":"脂溶性越低越易吸收","B":"脂溶性越高、解离度越小,越易吸收","C":"解离度越大越易吸收","D":"与脂溶性无关"},"answer":"B","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 14:38 [28:45]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-199","course":"临床药理学","type":"选择","chapter":"课堂强调补充","number":"","title":"妊娠期高血压患者禁用的降压药是","answerText":"","options":{"A":"ACEI / ARB","B":"甲基多巴","C":"拉贝洛尔","D":"硝苯地平"},"answer":"A","mnemonic":"🆕课堂强调·补充｜〔2026-04-01 15:38 [39:01]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-200","course":"临床药理学","type":"多选","chapter":"课堂强调补充","number":"","title":"β受体阻断剂的禁忌/慎用情况包括","answerText":"","options":{"A":"急性心力衰竭","B":"支气管哮喘","C":"二度以上房室传导阻滞","D":"严重心动过缓"},"answer":"ABCD","mnemonic":"🆕课堂强调·补充｜〔2026-04-01 14:38 [23:08]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-201","course":"临床药理学","type":"选择","chapter":"课堂强调补充","number":"","title":"按PK/PD分类,属于浓度依赖型抗菌药的是","answerText":"","options":{"A":"氨基糖苷类、氟喹诺酮类","B":"多数β-内酰胺类","C":"大环内酯类","D":"林可霉素"},"answer":"A","mnemonic":"🆕课堂强调·补充｜〔2026-04-09 09:38 [31:27]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-202","course":"临床药理学","type":"选择","chapter":"课堂强调补充","number":"","title":"被称为「抗厌氧菌的头孢菌素」的是","answerText":"","options":{"A":"第一代头孢","B":"第四代头孢","C":"头霉素","D":"青霉素G"},"answer":"C","mnemonic":"🆕课堂强调·补充｜〔2026-04-09 11:18 [13:49]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-203","course":"临床药理学","type":"判断","chapter":"课堂强调补充","number":"","title":"因过量服用药品而发生的毒性反应属于药品不良反应。","answerText":"","options":{},"answer":"错","mnemonic":"🆕课堂强调·补充｜〔2026-03-23 14:38 [07:23]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-204","course":"临床药理学","type":"判断","chapter":"课堂强调补充","number":"","title":"正常用量下因个体差异等引起的毒性作用属于药品不良反应。","answerText":"","options":{},"answer":"对","mnemonic":"🆕课堂强调·补充｜〔2026-03-23 14:38 [05:59]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-205","course":"临床药理学","type":"判断","chapter":"课堂强调补充","number":"","title":"变态反应(过敏反应)通常发生于首次用药。","answerText":"","options":{},"answer":"错","mnemonic":"🆕课堂强调·补充｜〔2026-03-23 14:38 [12:48]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-206","course":"临床药理学","type":"判断","chapter":"课堂强调补充","number":"","title":"配伍禁忌(体外理化反应)属于药效学相互作用。","answerText":"","options":{},"answer":"错","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 13:48 [40:33]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-207","course":"临床药理学","type":"判断","chapter":"课堂强调补充","number":"","title":"协同作用是指两药合用效果恰好等于二者单用之和(1+1=2)。","answerText":"","options":{},"answer":"错","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 14:38 [10:39]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-208","course":"临床药理学","type":"判断","chapter":"课堂强调补充","number":"","title":"药源性疾病的范围比药物不良反应更广。","answerText":"","options":{},"answer":"对","mnemonic":"🆕课堂强调·补充｜〔2026-03-23 15:38 [41:47]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-209","course":"临床药理学","type":"判断","chapter":"课堂强调补充","number":"","title":"药物警戒只针对药品上市后的不良反应监测。","answerText":"","options":{},"answer":"错","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 13:48 [13:48]〕｜非真题原题·据课堂整理","priority":"必背","isRecall":false,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-210","course":"临床药理学","type":"判断","chapter":"课堂强调补充","number":"","title":"前体药物(前药)在发生相互作用时通常表现为疗效减弱。","answerText":"","options":{},"answer":"错","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 15:38 [41:18]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-211","course":"临床药理学","type":"判断","chapter":"课堂强调补充","number":"","title":"氨基糖苷类抗生素具有耳毒性、肾毒性及神经肌肉接头阻滞作用。","answerText":"","options":{},"answer":"对","mnemonic":"🆕课堂强调·补充｜〔2026-04-09 11:18 [21:46]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-212","course":"临床药理学","type":"简答记忆","chapter":"课堂强调补充","number":"","title":"简述需要进行TDM的药物特点/情况。","answerText":"①治疗指数低、治疗窗窄、毒性大;②新生儿/小儿;③需长期用药维持治疗者;④多脏器功能障碍患者;⑤(理论基础)血药浓度与药效关系优于剂量与效应关系。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-04-09 09:38 [38:03]〕｜非真题原题·据课堂整理","priority":"必背","isRecall":true,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-213","course":"临床药理学","type":"简答记忆","chapter":"课堂强调补充","number":"","title":"药物警戒与药品不良反应监测的区别(「四点不一样」)。","answerText":"方法不一样(警戒主动、监测相对被动)、内容不一样、时间范围不一样(警戒贯穿研发到上市后始终,监测仅上市后)、(监测)对象不一样。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 13:48 [15:16]〕｜非真题原题·据课堂整理","priority":"必背","isRecall":true,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-214","course":"临床药理学","type":"简答记忆","chapter":"课堂强调补充","number":"","title":"简述药物相互作用的三种类型。","answerText":"①体外(理化)相互作用=配伍禁忌(物理化学性质改变,如沉淀/结晶/氧化分解);②药效学相互作用(影响药理效应、协同/拮抗,但对血药浓度无明显影响);③药动学相互作用(经ADME改变血药浓度进而改变药效,代谢环节最关键)。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 13:48 [39:56]〕〔2026-03-25 14:38 [09:54、24:33]〕｜非真题原题·据课堂整理","priority":"必背","isRecall":true,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-215","course":"临床药理学","type":"简答记忆","chapter":"课堂强调补充","number":"","title":"简述药物滥用者戒治的三个环节。","answerText":"①脱毒(最关键,用替代递减疗法,如美沙酮/可待因,可乐定快速脱瘾)→②预防复吸(主要解决精神依赖性)→③重返社会。三环节须连贯进行。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-04-02 10:28 [29:38]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-216","course":"临床药理学","type":"简答记忆","chapter":"课堂强调补充","number":"","title":"简述抗菌药按PK/PD的三大分类及评价指标。","answerText":"①浓度依赖型(氨基糖苷类、氟喹诺酮类、两性霉素B、甲硝唑;指标AUC/MIC、Cmax/MIC);②时间依赖型(短PAE)(指标%T>MIC,即血药浓度高于MIC的时间占给药间隔百分比);③时间依赖型(长PAE)。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-04-09 09:38 [30:27、37:21]〕｜非真题原题·据课堂整理","priority":"必背","isRecall":true,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-217","course":"临床药理学","type":"简答记忆","chapter":"课堂强调补充","number":"","title":"简述给药方案与半衰期/治疗指数的关系。","answerText":"半衰期约8h→一天3次;约12h→一天2次。治疗指数高→给药间隔相当、负荷剂量约维持剂量的2倍;治疗指数低→调整维持剂量与给药间隔(缩窄安全范围)。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-03-02 13:48 [31:49]〕〔2026-03-23 13:48 [07:08]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-218","course":"临床药理学","type":"简答记忆","chapter":"课堂强调补充","number":"","title":"反映药物吸收速度与吸收程度的参数分别是什么?","answerText":"吸收速度:达峰时间Tmax、峰浓度Cmax;吸收程度:AUC(药-时曲线下面积)。","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-03-02 13:48 [34:06]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"lin-219","course":"临床药理学","type":"名词解释记忆","chapter":"速通补充","number":"","title":"【名词解释】临床药理学定义","answerText":"临床药理学定义(必考名词解释):临床药理学(Clinical Pharmacology)是研究药物在人体内的作用规律和人体与药物间相互作用过程的交叉学科。以药理学和临床医学为基础,阐述药代动力学、药效动力学、药物的毒副反应及相互作用的性质、机制和规律。研究对象必须以人体为研究对象(区别于基础药理学)。是药物治疗学的科学基础,目的是促进医药结合、基础与临床结合,指导临床合理用药、提高治疗水平。\n\n〔老师强调/扣分点〕笔记★★★高频名词解释。'以人体为研究对象'是与基础药理学的核心区别,定义必背。","options":{},"answer":"名词解释","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 名词解释(临床药理学定义—真题回忆多年名解'临床药理学研究内容')〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125125},{"id":"lin-220","course":"临床药理学","type":"名词解释记忆","chapter":"速通补充","number":"","title":"【名词解释】重大药源性事件","answerText":"重大药源性事件(必考案例):①氨基匹林——退热→粒细胞缺乏症死亡2000余人②乙烯雌酚——先兆流产→少女阴道腺癌300余例③二硝基酚——减肥→白内障/骨髓抑制(177人死亡)④PPA(苯丙醇胺)感冒药→脑出血⑤西伐他汀(拜斯亭)→心血管意外⑥马兜铃酸(关木通)→肾功能衰竭。这些事件推动临床药理学发展。\n\n〔老师强调/扣分点〕笔记★★★高频案例。每个药源性事件的'药物—用途—危害'对应关系(乙烯雌酚→阴道腺癌、马兜铃酸→肾衰)是核心考点。","options":{},"answer":"名词解释","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 案例/填空(重大药源性事件:氨基匹林/乙烯雌酚/反应停—真题论述案例背景+药源性疾病名解)〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125126},{"id":"lin-221","course":"临床药理学","type":"论述记忆","chapter":"速通补充","number":"","title":"【论述】反应停事件剖析","answerText":"反应停(Thalidomide)事件剖析(必考重点案例):1953年瑞士CIBA作为镇静催眠药合成(因效果不如巴比妥停止),1954年西德Grünenthal发现镇吐作用,1957年作为孕妇止吐剂上市(46国/14药厂)。1961年11月德国Lenz、12月澳大利亚McBride《柳叶刀》报告海豹肢畸形相关。后果:全球12000例畸形(海豹肢8000+)、死亡5000+。美国规避:FDA的Frances Kelsey发现动物实验未覆盖妊娠30-50天敏感期,坚持要求补充数据而未批准,1962年获肯尼迪总统勋章,推动1962年立法强化FDA监管。\n\n〔老师强调/扣分点〕笔记★★★★高频重点案例。Frances Kelsey阻止反应停在美上市、妊娠30-50天致畸敏感期、推动1962年FDA立法是核心考点。","options":{},"answer":"论述题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 案例(反应停Thalidomide事件—真题重点案例,药源性疾病论述背景)〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125127},{"id":"lin-222","course":"临床药理学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】房室模型","answerText":"房室模型(Compartment Model,必考):将人体按动力学特点划分若干房室(转运速率相同的部位视为同一房室),为开放性房室系统(药物可进出),与解剖部位无关。①一室模型——药物快速均匀分布全身,消除曲线呈单指数下降,C=C0·e^(-ke·t)②二室模型——初期快速分布到血流丰富的中央室(心/肝/肾),后期缓慢分布到周边室(肌肉/脂肪),消除曲线呈双指数特征。一致性评价:通过BE生物等效性试验比较AUC、Cmax验证仿制药与原研药等效。\n\n〔老师强调/扣分点〕笔记★★★★高频。一室vs二室模型(单指数vs双指数)、中央室(心肝肾)vs周边室(肌肉脂肪)、房室与解剖部位无关是核心。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 理解/简答(房室模型—真题选择+药动学基础)〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125128},{"id":"lin-223","course":"临床药理学","type":"名词解释记忆","chapter":"速通补充","number":"","title":"【名词解释】遗传药理学定义","answerText":"遗传药理学定义(必考名词解释):研究遗传因素在药物代谢、转运和效应中的作用,阐明个体对外源性物质反应差异的学科,是药理学与遗传学相结合的边缘学科。研究重点:①药代动力学层面(基因变异对吸收/分布/代谢/清除的影响)②药效动力学层面(基因变异对药物靶点敏感性或作用通路的影响)。与药物基因组学区别:遗传药理学更聚焦单基因/少数基因,药物基因组学着眼全基因组。\n\n〔老师强调/扣分点〕笔记★★★高频名词解释。定义(遗传因素影响药物反应的边缘学科)、与药物基因组学的区别是核心。","options":{},"answer":"名词解释","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 名解(★遗传药理学定义—真题名解原题'遗传药理学'(2022/2019/2018多年))〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125129},{"id":"lin-224","course":"临床药理学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】GCP核心原则","answerText":"GCP核心原则(必考):①保护受试者权益和安全——必须符合《赫尔辛基宣言》原则(1964年芬兰制定,全球医学伦理基石),受试者权益和安全是最高优先级,高于科学价值和社会效益(如新冠疫苗研发不能牺牲受试者安全)②伦理审查+知情同意双重机制——前者审查方案科学性,后者确保受试者自主选择权③风险-获益比评估——只有预期获益显著大于风险才能开展,过程中持续监测,风险超获益须立即中止④质量管理贯穿全过程(双人核查/源数据验证)。\n\n〔老师强调/扣分点〕笔记★★★★高频。赫尔辛基宣言(1964芬兰)、受试者安全高于科学价值、伦理审查+知情同意双机制、风险获益比是核心。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 论述/简答(★GCP核心原则+赫尔辛基宣言—真题论述原题'如何保障受试者权益'(多年)+填空'赫尔辛基宣〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125130},{"id":"lin-225","course":"临床药理学","type":"论述记忆","chapter":"速通补充","number":"","title":"【论述】注射剂配伍禁忌(体外相互作用,必考)","answerText":"注射剂配伍禁忌(体外相互作用,必考):①沉淀——酸性药液与碱性药液合用中和形成沉淀(盐酸氯丙嗪酸性+异戊巴比妥钠碱性;肝素+阿米卡星/胺碘酮/红霉素/吗啡 5-10min沉淀)②结晶——溶解度下降析出晶体(磺胺嘧啶钠用10%葡萄糖稀释析晶致血管栓塞)③氧化分解失效——维生素C注射液pH>6易氧化(禁配氨茶碱等碱性液);氨基糖苷类+羧苄西林(氨基与β-内酰胺环作用失活);氨基酸营养液禁加任何药物。60年代澳大利亚苯妥英钠事件(赋形剂硫酸钙改乳糖致生物利用度升高中毒)。\n\n〔老师强调/扣分点〕笔记★★★高频。配伍禁忌三类(沉淀酸碱中和/结晶磺胺嘧啶/氧化VitC)、氨基糖苷+羧苄西林失活、氨基酸营养液禁加药是核心。","options":{},"answer":"论述题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 理解/论述(注射剂配伍禁忌—真题论述'氢氯噻嗪低钾'病例+药物相互作用)〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125131},{"id":"lin-226","course":"临床药理学","type":"论述记忆","chapter":"速通补充","number":"","title":"【论述】高血压发病机制","answerText":"高血压发病机制(必考):①心输出量改变——心肌收缩力增强致血压升高②肾功能异常——水钠潴留致血容量增加+交感神经激活③RAAS系统激活——肾素-血管紧张素-醛固酮系统激活致阻力小动脉收缩④血管重构——血管张力增加+管壁增厚致总外周阻力增加⑤内皮细胞功能受损——舒张因子(前列环素/NO)减少、收缩因子(内皮素/血管紧张素II)增加。降压药研发史:1960s噻嗪类利尿剂、1970s ACEI、2001 ARBs/CCB。\n\n〔老师强调/扣分点〕笔记★★★高频。高血压五大机制(心输出量/水钠潴留/RAAS/血管重构/内皮损伤)是核心机制考点。","options":{},"answer":"论述题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 论述(★高血压发病机制—真题论述原题'高血压分类及合理应用'背景(几乎每年必考论述))〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125132},{"id":"lin-227","course":"临床药理学","type":"论述记忆","chapter":"速通补充","number":"","title":"【论述】利尿剂分类(降压药,必考)","answerText":"利尿剂分类(降压药,必考):①袢利尿剂(强效)——作用于髓袢升支粗段,抑制NaCl主动重吸收,代表呋塞米/布美他尼/托拉塞米②噻嗪类(中效)——作用于远曲小管始端,噻嗪型(氢氯噻嗪/苄氟噻嗪)、噻嗪样(氯噻酮/吲达帕胺)③保钾利尿剂(弱效)——抑制远曲小管Na+-H+转运体(氨苯蝶啶/阿米洛利,不依赖醛固酮)或醛固酮受体拮抗剂(螺内酯/依普利酮)。利尿剂适应症:老年高血压、难治性高血压、心衰合并高血压、盐敏感性高血压(老年人低肾素活性对盐敏感,利尿剂效果好)。\n\n〔老师强调/扣分点〕笔记★★★★高频。三类利尿剂(袢强效呋塞米/噻嗪中效氢氯噻嗪/保钾弱效螺内酯)作用部位与强度、利尿剂适合老年盐敏感是核心。","options":{},"answer":"论述题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 论述/填空(★利尿剂分类(降压药)—真题论述'抗高血压药分类'+填空'WHO首选降压药利尿剂'+病例'氢〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125133},{"id":"lin-228","course":"临床药理学","type":"论述记忆","chapter":"速通补充","number":"","title":"【论述】高血压联合用药","answerText":"高血压联合用药(必考):意义——单药仅40%有效,联合治疗可达80%以上;机制互补(RAAS+容量负荷)、不良反应抵消(CCB水肿可被ARB减轻)、协同延长作用时间。原则:血压≥160/100mmHg或高于目标20/10mmHg、单药未达标、高危患者起始小剂量联合;优选机制互补组合(RAAS抑制剂+利尿剂)。剂量策略:标准剂量单药平均降压10/5mmHg,加倍剂量仅额外降2/1mmHg(故联合优于加量)。CCB降DBP最强(氨氯地平)、ARB/ACEI对SBP更显著。中国指南优先固定复方制剂。\n\n〔老师强调/扣分点〕笔记★★★高频。单药40%vs联合80%、加倍剂量仅额外降2/1mmHg(联合优于加量)、RAAS抑制剂+利尿剂优选组合是核心。","options":{},"answer":"论述题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 论述(★高血压联合用药—真题论述原题'抗高血压药合理应用:联合用药'+病例'合并肾病用药')〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125134},{"id":"lin-229","course":"临床药理学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】引起G-6-PD缺陷患者溶血的常见药物","answerText":"引起G-6-PD缺陷患者溶血的常见药物(必考简答):①抗疟药——伯氨喹/帕马喹/米帕林等;②抗菌药——磺胺类/氯霉素/对氨水杨酸等;③解热镇痛药——阿司匹林/非那西丁/氨基比林等;④其他——维生素K/丙磺舒/肼苯达嗪/奎尼丁/蚕豆素。属遗传药理学个体差异经典例。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 2016/2017简答+2019论述〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125135},{"id":"sw-001","course":"生物药剂学与药物动力学","type":"选择","chapter":"1. 生物药剂学概论","number":"1","title":"以下关于药物剂型因素的描述,正确的是","answerText":"","options":{"A":"是指片剂、胶囊剂、丸剂和溶液剂等药物的不同剂型","B":"是指剂型和给药方案","C":"是指给药途径和给药频率","D":"不仅指片剂、胶囊剂、注射剂等药剂中的剂型概念,而且广义地包括与剂型有关的各种因素"},"answer":"D","mnemonic":"了解｜习题集","priority":"了解","isRecall":false,"sourceId":2,"addedAt":1780168176022,"examProb":"了解"},{"id":"sw-002","course":"生物药剂学与药物动力学","type":"选择","chapter":"1. 生物药剂学概论","number":"2","title":"以下关于生物药剂学的描述,错误的是","answerText":"","options":{"A":"研究药物及剂型在体内的吸收、分布、代谢与排泄过程","B":"药物动力学为生物药剂学提供了理论基础和研究手段","C":"改善难溶性药物的溶出速率是生物药剂学的主要任务之一","D":"从药物生物利用度的高低就能判断药物制剂体内是否有效"},"answer":"D","mnemonic":"了解｜习题集","priority":"了解","isRecall":false,"sourceId":2,"add ddedAt":1780168176197,"examProb":"了解"},{"id":"sw-145","course":"生物药剂学与药物动力学","type":"选择","chapter":"第十五章","number":"2","title":"生物样品分析首选方法是","answerText":"","options":{"A":"UV","B":"荧光法","C":"HPLC","D":"LC-MS/MS"},"answer":"D","mnemonic":"了解｜习题集","priority":"了解","isRecall":false,"sourceId":2,"addedAt":1780168176198,"examProb":"了解"},{"id":"sw-146","course":"生物药剂学与药物动力学","type":"选择","chapter":"第十五章","number":"3","title":"药动学数据处理常用软件是","answerText":"","options":{"A":"Excel","B":"Word","C":"DAS、WinNonlin","D":"Photoshop"},"answer":"C","mnemonic":"了解｜习题集","priority":"了解","isRecall":false,"sourceId":2,"addedAt":1780168176199,"examProb":"了解"},{"id":"sw-147","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"3. 药物分布/代谢/排泄","number":"","title":"肠肝循环","answerText":"经胆汁排入肠道的药物(或其结合物经水解)在肠道被重新吸收、经门静脉返回肝脏的现象。可使药物在体内停留时间延长、出现血药浓度第二高峰(双峰现象)。","options":{},"answer":"名词解释","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168175999,"examProb":"必考"},{"id":"sw-148","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"3. 药物分布/代谢/排泄","number":"","title":"药物代谢","answerText":"药物在体内多种酶(主要为肝微粒体酶系)催化下发生化学结构改变的过程,又称生物转化,分I相反应(氧化/还原/水解)和II相反应(结合)。","options":{},"answer":"名词解释","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176003,"examProb":"必考"},{"id":"sw-149","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"3. 药物分布/代谢/排泄","number":"","title":"肾清除率","answerText":"单位时间内肾脏能将多少体积血浆中的药物完全清除,Clr=肾排泄速率/血药浓度=尿药浓度×尿流速/血药浓度,单位ml/min或L/h。","options":{},"answer":"名词解释","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176007,"examProb":"必考"},{"id":"sw-150","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"4. 药物动力学","number":"","title":"药物动力学","answerText":"应用动力学原理研究药物在体内吸收、分布、代谢、排泄(ADME)过程中量变(血药浓度/药量随时间变化)规律,并用数学模型加以描述的学科。","options":{},"answer":"名词解释","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176000,"examProb":"必考"},{"id":"sw-151","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"4. 药物动力学","number":"","title":"生物等效性","answerText":"指一种药物的不同制剂在相同试验条件下,以相同剂量给药,其吸收程度和速度(由AUC、Cmax、Tmax表征)无统计学显著差异。","options":{},"answer":"名词解释","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176001,"examProb":"必考"},{"id":"sw-152","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"4. 药物动力学","number":"","title":"双室模型","answerText":"将机体视为中央室和周边室两个房室,药物先分布于中央室(血液及血流丰富组织),再向周边室(血流较少组织)转运,血药浓度-时间曲线呈双指数衰减。","options":{},"answer":"名词解释","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176002,"examProb":"必考"},{"id":"sw-153","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"4. 药物动力学","number":"","title":"生物利用度","answerText":"指药物经血管外给药后被吸收进入体循环的相对量(F=吸收量/给药量)和速度,分绝对生物利用度和相对生物利用度。","options":{},"answer":"名词解释","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176005,"examProb":"必考"},{"id":"sw-154","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"4. 药物动力学","number":"","title":"表观分布容积","answerText":"体内药量与血药浓度间的比例常数(V=X/C),表示药物在体内分布的程度,无直接生理意义,单位L或L/kg。","options":{},"answer":"名词解释","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176006,"examProb":"必考"},{"id":"sw-155","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"1. 生物药剂学概论与药物转运","number":"","title":"首过效应","answerText":"口服药物在胃肠道吸收经门静脉进入肝脏,在到达体循环前被肠壁和肝脏代谢,使进入体循环的原型药量减少的现象(又称第一关卡效应)。","options":{},"answer":"名词解释","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176004,"examProb":"必考"},{"id":"sw-156","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"1. 生物药剂学概论与药物转运","number":"","title":"肝提取率","answerText":"药物经过肝脏一次,被肝脏摄取消除的分数,ER=(进入肝脏药量-流出肝脏药量)/进入肝脏药量,反映肝脏对药物的清除效率。","options":{},"answer":"名词解释","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176008,"examProb":"必考"},{"id":"sw-157","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 药物吸收/转运","number":"","title":"简述BCS生物药剂学分类系统","answerText":"BCS(生物药剂学分类系统)按药物的溶解度和肠壁渗透性分为四类:I类高溶解度高渗透性(吸收好,体内外相关性可能);II类低溶解度高渗透性(溶出为限速,可建立体内外相关);III类高溶解度低渗透性(渗透为限速);IV类低溶解度低渗透性(吸收差,问题最多)。","options":{},"answer":"简答题","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176009,"examProb":"必考"},{"id":"sw-158","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 药物吸收/转运","number":"","title":"单纯扩散和促进扩散的异同点","answerText":"相同点:both顺浓度梯度(高→低)、不耗能(被动转运)、不需ATP。不同点:1单纯扩散不需载体,无饱和现象、无竞争抑制、无结构特异性;2促进扩散需特异性载体,有饱和现象、有竞争抑制、有结构与部位特异性,转运速率远高于单纯扩散。","options":{},"answer":"简答题","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176010,"examProb":"必考"},{"id":"sw-159","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 药物吸收/转运","number":"","title":"促进药物口服吸收的方法","answerText":"1增加药物溶出:减小粒径、制成无定型/盐/前药、固体分散体、包合物;2加入吸收促进剂;3制成微粒给药系统(微乳/脂质体/纳米粒);4抑制外排(P-gp抑制剂);5改善胃肠道滞留时间;6结构修饰提高脂溶性/渗透性。","options":{},"answer":"简答题","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176012,"examProb":"必考"},{"id":"sw-160","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 药物吸收/转运","number":"","title":"主动转运的特点","answerText":"1逆浓度梯度(低→高)转运;2需要消耗能量(ATP);3需要特异性载体;4有饱和现象;5有结构特异性和部位特异性;6有竞争性抑制现象;7受代谢抑制剂影响。","options":{},"answer":"简答题","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176013,"examProb":"必考"},{"id":"sw-161","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 药物吸收/转运","number":"","title":"口腔粘膜给药的优点","answerText":"1避免肝首过效应和胃肠道破坏;2吸收迅速,生物利用度高;3给药方便,可随时中止;4适合蛋白多肽类;5口腔粘膜血流丰富、渗透性较好。","options":{},"answer":"简答题","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176018,"examProb":"必考"},{"id":"sw-162","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"3. 药物分布/代谢/排泄","number":"","title":"非线性动力学的特点","answerText":"1药物消除不遵循一级动力学,呈剂量(浓度)依赖性;2血药浓度和AUC与剂量不成正比(剂量增加,AUC不成比例增大);3消除半衰期随剂量增加而延长;4高浓度时近似零级(酶/载体饱和),低浓度时近似一级;5药物代谢/排泄能力有饱和性(米氏方程描述)。","options":{},"answer":"简答题","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176011,"examProb":"必考"},{"id":"sw-163","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"3. 药物分布/代谢/排泄","number":"","title":"苯巴比妥中毒的肾排泄解救","answerText":"苯巴比妥为弱酸性药(pKa约7.4)。碱化尿液(静滴碳酸氢钠)使尿液pH升高,药物在尿中解离度增大、脂溶性降低、肾小管重吸收减少,从而加速其经肾排泄——即'碱化尿液促弱酸性药排泄'。同时利尿可加快清除。","options":{},"answer":"简答题","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176015,"examProb":"必考"},{"id":"sw-164","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"3. 药物分布/代谢/排泄","number":"","title":"药物代谢的临床意义","answerText":"1使药物失活或活性降低(多数);2使药物活化(前药转化为活性物);3产生毒性代谢物;4影响药物作用强度与持续时间;5酶诱导/酶抑制引起药物相互作用;6个体差异(基因多态性)影响疗效与安全性,是个体化给药依据。","options":{},"answer":"简答题","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176016,"examProb":"必考"},{"id":"sw-165","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"4. 药物动力学","number":"","title":"对于半衰期短的药物根据生物半衰期设计给药方案","answerText":"半衰期极短的药物,若按t1/2给药则给药过频。可采取:1静脉滴注维持稳态;2制成缓控释制剂延缓释放;3加入吸收延缓剂;4必要时联合负荷剂量+维持滴注。目标是维持血药浓度在治疗窗内、减少波动。","options":{},"answer":"简答题","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176014,"examProb":"必考"},{"id":"sw-166","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"4. 药物动力学","number":"","title":"临床治疗药物监测TDM的目的及适用范围","answerText":"目的:通过测定血药浓度,据药动学原理调整给药方案,实现个体化给药,提高疗效、避免毒性。适用:1治疗指数窄(地高辛/茶碱/锂盐);2具非线性动力学(苯妥英钠);3肝肾功能不全;4合并用药致相互作用;5中毒症状与疾病难区分;6需长期用药者。","options":{},"answer":"简答题","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176017,"examProb":"必考"},{"id":"sw-167","course":"生物药剂学与药物动力学","type":"计算记忆","chapter":"4. 药物动力学(静脉滴注)","number":"","title":"某单室模型药物生物半衰期5小时,静脉滴注达稳态血药浓度的95%需要多少时间?","answerText":"达稳态分数 fss=1-e^(-kt)。达95%即 1-e^(-kt)=0.95 → e^(-kt)=0.05 → kt=ln20≈3.0 → t=3.0/k。k=0.693/t1/2=0.693/5=0.1386 h−1。t=ln20/k=2.996/0.1386≈21.6 h。规律:达稳态95%约需4.32个半衰期(4.32×5=21.6h)。","options":{},"answer":"计算题","mnemonic":"必背｜doubao历年P114｜历年计算原题(P114必考)·解法据教材","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176019,"examProb":"必考"},{"id":"sw-168","course":"生物药剂学与药物动力学","type":"计算记忆","chapter":"4. 药物动力学(静脉注射)","number":"","title":"单次静脉注射单室模型药物2g,测得不同时间血药浓度,求k、Cl、V、AUC及14h血药浓度","answerText":"对单室静注,lgC对t线性回归:得 a(截距lgC0)=−0.4954, b(斜率)=−0.0610, |r|=0.999(相关性好)。回归方程 lgC=−0.061t−0.4954。\n1k=−2.303×b=−2.303×(−0.061)=0.1405 h−1\n2t1/2=0.693/k=0.693/0.1405=4.93 h\n3C0=10^(−0.4954)=0.3196 mg/ml\n4V=X0/C0=2000mg/0.3196=6258 ml=6.258 L\n5Cl=k·V=0.1405×6.258=0.879 L/h\n6AUC=C0/k=0.3196/0.1405=2.275 mg·h/ml(或X0/Cl)\n7t=14h: lgC=−0.061×14−0.4954=−1.3494 → C=10^(−1.3494)=0.0447 mg/ml=44.7 μg/ml。\n关键:须判断回归用lg还是ln(本题用lg,故k=−2.303b)。","options":{},"answer":"计算题","mnemonic":"必背｜doubao历年P114｜历年计算原题(P114必考)","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176020,"examProb":"必考"},{"id":"sw-169","course":"生物药剂学与药物动力学","type":"计算记忆","chapter":"4. 药物动力学(静注+滴注叠加)","number":"","title":"安定先静注10mg,半小时后静脉滴注k0=10mg/h,经3小时是否达治疗浓度0.5-2.5mg/ml(t1/2=5.5h)","answerText":"k=0.693/5.5=0.126 h−1。叠加原理:静注后t时浓度C1=(X0/V)e^(−kt);滴注开始后t'时间贡献C2=(k0/(kV))(1−e^(−kt'))。总浓度=两部分之和。代入静注后总时长3h(其中滴注进行2.5h),分别算静注残留与滴注累积之和,与0.5–2.5mg/ml比较判断。本题考叠加原理:静注+滴注血药浓度=各自贡献之和。\n注:本题需V值代入方可得数值结论;若题目给出V(或体重×分布容积),按上式叠加计算3h时总浓度再与0.5–2.5mg/ml比较。此处展示解法框架,数值以题给V为准。","options":{},"answer":"计算题","mnemonic":"必背｜doubao历年P114｜历年计算原题(P114必考)·解法据教材","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168176021,"examProb":"必考"},{"id":"sw-170","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"1. 生物药剂学概论","number":"1","title":"生物药剂学","answerText":"是研究药物及其剂型在体内的吸收、分布、代谢与排泄过程,阐明药物的剂型因素、机体的生物因素与药理效应三者之间相互关系的科学","options":{},"answer":"名词解释","mnemonic":"了解｜习题集","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168176028,"examProb":"常考"},{"id":"sw-171","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"1. 生物药剂学概论","number":"2","title":"药物及剂型的体内过程","answerText":"是指药物及剂型从给药部位给药后在体内吸收、分布、代谢和排泄的过程","options":{},"answer":"名词解释","mnemonic":"了解｜习题集","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168176029,"examProb":"常考"},{"id":"sw-172","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"1. 生物药剂学概论","number":"3","title":"转运","answerText":"药物的吸收、分布和排泄过程的统称","options":{},"answer":"名词解释","mnemonic":"重要｜习题集","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168176030,"examProb":"常考"},{"id":"sw-173","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"1. 生物药剂学概论","number":"4","title":"代谢","answerText":"药物在吸收过程或进入体循环后,受肠道菌丛或体内酶系统的作用,结构发生转变的过程。 ---","options":{},"answer":"名词解释","mnemonic":"重要｜习题集","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168176031,"examProb":"常考"},{"id":"sw-174","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"1. 生物药剂学概论","number":"1","title":"生物药剂学的研究工作主要涉及哪些内容","answerText":"研究药物的理化性质对药物体内转运行为的影响;研究剂型、制剂处方和制剂工艺对药物体内过程的影响;根据机体的生理功能设计缓控释制剂;研究微粒给药系统在血液循环中的命运;研究新的给药途径与给药方法;研究中药制剂的溶出度和生物利用度;研究生物药剂学的试验方法","options":{},"answer":"简答题","mnemonic":"了解｜习题集","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168176032,"examProb":"常考"},{"id":"sw-175","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"1. 生物药剂学概论","number":"2","title":"简述生物药剂学研究在新药开发中的应用","answerText":"在新药的合成和筛选中考虑药物体内的转运和转化因素;在新药安全性评价中,药动学为毒性试验设计提供依据;在新药制剂研究中评价剂型设计合理性;在新药临床前及I期临床试验中进行生物药剂学与药动学评价;药品上市后变更仍需生物药剂学评估。 ---","options":{},"answer":"简答题","mnemonic":"了解｜习题集","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168176033,"examProb":"常考"},{"id":"sw-176","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物吸收","number":"1","title":"跨细胞途径转运","answerText":"是指一些脂溶性药物借助细胞膜的脂溶性,或者特殊转运机制的药物借助膜蛋白的作用,或者大分子和颗粒状物质借助特殊细胞的作用等,而穿过细胞膜的转运途径","options":{},"answer":"名词解释","mnemonic":"重要｜习题集","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168176089,"examProb":"常考"},{"id":"sw-177","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物吸收","number":"2","title":"被动转运","answerText":"是指不需要消耗能量,生物膜两侧的药物由高浓度侧向低浓度侧(顺浓度梯度)转运的过程。分为单纯扩散和促进扩散两种形式","options":{},"answer":"名词解释","mnemonic":"必背｜习题集","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168176090,"examProb":"必考"},{"id":"sw-178","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物吸收","number":"3","title":"溶出速率","answerText":"是指在一定溶出条件下,单位时间药物溶解的量","options":{},"answer":"名词解释","mnemonic":"重要｜习题集","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168176091,"examProb":"常考"},{"id":"sw-179","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物吸收","number":"4","title":"载体媒介转运","answerText":"借助生物膜上载体蛋白的作用,使药物透过生物膜的转运过程。分为促进扩散和主动转运两种形式","options":{},"answer":"名词解释","mnemonic":"重要｜习题集","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168176092,"examProb":"常考"},{"id":"sw-180","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物吸收","number":"5","title":"促进扩散","answerText":"是指某些药物在细胞膜上转运体的帮助下,由高浓度侧向低浓度侧跨细胞膜转运的过程","options":{},"answer":"名词解释","mnemonic":"必背｜习题集","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168176093,"examProb":"必考"},{"id":"sw-181","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物吸收","number":"6","title":"ATP驱动泵","answerText":"是指以ATP水解释放的能量为直接能源进行主动转运的载体蛋白家族","options":{},"answer":"名词解释","mnemonic":"了解｜习题集","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168176094,"examProb":"常考"},{"id":"sw-182","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物吸收","number":"7","title":"多药耐药","answerText":"是指外排转运体对抗肿瘤药物的外排作用导致肿瘤细胞内药量减少、对肿瘤细胞杀伤作用大大下降的现象","options":{},"answer":"名词解释","mnemonic":"了解｜习题集","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168176095,"examProb":"常考"},{"id":"sw-183","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物吸收","number":"8","title":"生物药剂学分类系统(BCS)","answerText":"根据药物体外溶解性和肠道渗透性高低对药物分类的科学方法。分四类:I高溶高渗、II低溶高渗、III高溶低渗、IV低溶低渗","options":{},"answer":"名词解释","mnemonic":"必背｜习题集","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168176096,"examProb":"必考"},{"id":"sw-184","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物吸收","number":"9","title":"药物外排转运体","answerText":"直接依赖ATP分解释能,逆浓度梯度将底物泵出细胞的转运体,如P-gp、MRP、BCRP等","options":{},"answer":"名词解释","mnemonic":"重要｜习题集","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168176097,"examProb":"常考"},{"id":"sw-185","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物吸收","number":"10","title":"多晶型","answerText":"化学结构相同的药物,因结晶条件不同形成数种晶格排列不同的晶型。 ---","options":{},"answer":"名词解释","mnemonic":"了解｜习题集","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168176098,"examProb":"常考"},{"id":"sw-186","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 口服药物吸收","number":"1","title":"简述促进扩散的特点,并与单纯扩散比较异同","answerText":"同:均顺浓度梯度、不耗能。异:促进扩散有载体参与、速率快、有选择性、饱和性、部位特异性、竞争性抑制;单纯扩散无载体、无饱和、无竞争、无选择性","options":{},"answer":"简答题","mnemonic":"必背｜习题集","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168176099,"examProb":"必考"},{"id":"sw-187","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 口服药物吸收","number":"2","title":"简述主动转运的分类及特点","answerText":"分原发性(ATP驱动泵)、继发性(协同转运)。特点:逆浓度梯度、耗能、需载体、饱和、竞争抑制、部位特异、受代谢抑制剂影响","options":{},"answer":"简答题","mnemonic":"必背｜习题集","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168176100,"examProb":"必考"},{"id":"sw-188","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 口服药物吸收","number":"3","title":"简述生理因素对药物吸收的影响","answerText":"胃肠液pH;胃排空速率;肠内运行;食物;胃肠道代谢;胃肠血流;肝首过效应;肠肝循环;淋巴系统;疾病","options":{},"answer":"简答题","mnemonic":"重要｜习题集","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168176101,"examProb":"常考"},{"id":"sw-189","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 口服药物吸收","number":"4","title":"某药生物利用度仅5%,与食物同服翻倍,分析原因并提出改善措施","answerText":"原因:溶解度低、渗透性差、存在部位特异性吸收、受胃肠环境影响。措施:制成可溶性盐、无定型、包合物、固体分散体;加吸收促进剂;延长胃肠滞留时间;抑制外排与代谢","options":{},"answer":"简答题","mnemonic":"必背｜习题集","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168176102,"examProb":"必考"},{"id":"sw-190","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 口服药物吸收","number":"5","title":"药物溶出速率对吸收有何意义?影响因素","answerText":"溶出是难溶性药物吸收限速过程,决定起效快慢与药效强弱。影响因素:溶解度、粒子大小、多晶型、溶剂化物、溶出条件","options":{},"answer":"简答题","mnemonic":"重要｜习题集","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168176103,"examProb":"常考"},{"id":"sw-191","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 口服药物吸收","number":"6","title":"影响II类药物吸收的理化因素及改善方法","answerText":"因素:溶解度、晶型、溶媒化物、粒径。方法:制成可溶性盐、适宜晶型、加表面活性剂、包合、微粉化、延长滞留、抑制外排与代谢。 ---","options":{},"answer":"简答题","mnemonic":"重要｜习题集","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168176104,"examProb":"常考"},{"id":"sw-192","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"3. 非口服给药吸收","number":"1","title":"哪些给药途径可避免肝首过效应?原理","answerText":"静脉注射、肌内注射;口腔黏膜给药;经皮给药;鼻腔给药;肺部给药;直肠给药(距肛门2cm)。原理:不经过门静脉入肝","options":{},"answer":"简答题","mnemonic":"必背｜习题集","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168176110,"examProb":"必考"},{"id":"sw-193","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"3. 非口服给药吸收","number":"2","title":"肺部给药吸收迅速的原因","answerText":"肺泡表面积巨大、血流丰富、转运距离极小,药物直接入血无首过","options":{},"answer":"简答题","mnemonic":"重要｜习题集","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168176111,"examProb":"常考"},{"id":"sw-194","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"3. 非口服给药吸收","number":"3","title":"增加眼用制剂疗效的方法","answerText":"增加黏度;减少给药体积、提高浓度;调节pH与渗透压;用软膏、膜剂、原位凝胶延长接触时间。\n# 生物药剂学与药物动力学 习题全集(第3版) #","options":{},"answer":"简答题","mnemonic":"重要｜习题集","priority":"重要","isRecall":true,"sourceId":2,"addedAt":1780168176112,"examProb":"常考"},{"id":"sw-195","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"7. 药物动力学概述","number":"2","title":"隔室模型","answerText":"按药物转运速率特征将机体划分为若干独立隔室,构成反映药物动力学特征的模型","options":{},"answer":"名词解释","mnemonic":"必背｜习题集","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168176157,"examProb":"必考"},{"id":"sw-196","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"7. 药物动力学概述","number":"3","title":"单室模型","answerText":"药物在体内迅速达到动态平衡,全身各组织转运速率相似,将机体视为一个隔室","options":{},"answer":"名词解释","mnemonic":"必背｜习题集","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168176158,"examProb":"必考"},{"id":"sw-197","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"7. 药物动力学概述","number":"5","title":"中央室","answerText":"由血流丰富、膜通透性好、药物易灌注的组织(心、肝、肾、肺等)组成,药物可快速达到平衡","options":{},"answer":"名词解释","mnemonic":"了解｜习题集","priority":"了解","isRecall":true,"sourceId":2,"addedAt":1780168176160,"examProb":"常考"},{"id":"sw-198","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"7. 药物动力学概述","number":"1","title":"试述药物动力学在药剂学研究中的作用","answerText":"指导新剂型/制剂处方工艺优化;评价制剂生物利用度与等效性;为缓控释、靶向制剂设计提供依据;建立体内外相关性指导质量控制","options":{},"answer":"简答题","mnemonic":"必背｜习题集","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168176171,"examProb":"必考"},{"id":"sw-199","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"7. 药物动力学概述","number":"2","title":"表观分布容积是否具有直接生理意义?为什么","answerText":"无直接生理意义。它是体内药量与血药浓度的比例常数,不代表真实体液容积,仅反映药物在体内分布广窄程度。 --- #","options":{},"answer":"简答题","mnemonic":"必背｜习题集","priority":"必背","isRecall":true,"sourceId":2,"addedAt":1780168176172,"examProb":"必考"},{"id":"sw-200","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"3. 药物分布/代谢/排泄","number":"","title":"肝肠循环（双峰现象+作用延长）","answerText":"经胆汁(或部分经胆汁)排入肠道的药物,在肠道中又被重新吸收、经门静脉返回肝脏的现象。两层表现要一起答:药动学上表现为双峰现象(第二峰小于第一峰);药效上表现为作用时间延长(如洋地黄毒苷、吗啡、氯霉素)。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-04-01 11:18 [25:28]〕｜非真题原题·据课堂整理","priority":"必背","isRecall":true,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"sw-201","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"4. 药物动力学","number":"","title":"群体药动学","answerText":"研究药物在目标人群中药动学参数的分布及其影响因素(含固定效应与随机效应两类因素)的学科。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-04-01 10:28 [06:19、13:34]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"sw-202","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"4. 药物动力学","number":"","title":"生理药动学（PBPK）","answerText":"以机体解剖、生理、生化特征为基础,按血流将各组织器官(房室)连接,定量描述药物体内过程的模型。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-04-01 10:28 [06:19、13:34]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"sw-203","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"4. 药物动力学","number":"","title":"时辰药动学","answerText":"研究药物体内过程(ADME)随时间呈节律性变化规律的学科(如降压药白天剂量大、夜间小)。","options":{},"answer":"名词解释","mnemonic":"🆕课堂强调·补充｜〔2026-04-01 09:38 [38:05]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"sw-204","course":"生物药剂学与药物动力学","type":"判断","chapter":"3. 药物分布/代谢/排泄","number":"","title":"药物结合反应(Ⅱ相代谢)所需的酶称为「结合酶」。","answerText":"","options":{"A":"对","B":"错"},"answer":"B","mnemonic":"🆕课堂强调·补充｜〔2026-03-16 10:28 [41:11]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"sw-205","course":"生物药剂学与药物动力学","type":"多选","chapter":"1. 生物药剂学概论","number":"","title":"仿制药一致性评价应包括","answerText":"","options":{"A":"参比制剂的选择","B":"体外多介质溶出曲线相似性(f2因子)","C":"体内生物等效性试验(AUC、Cmax,90%CI 80%~125%)","D":"杂质谱与基因毒性杂质研究"},"answer":"ABCD","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 10:28 [35:02]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":false,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"sw-206","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"4. 药物动力学","number":"","title":"需要进行治疗药物监测(TDM)的药物有哪些(八类)?","answerText":"①治疗指数低、治疗窗窄、安全范围小的药;②具非线性药动学特征的药;③个体差异大、难以用剂量预测血药浓度的药;④治疗作用与毒性反应相似、不易区分的药(如地高辛);⑤合并用药易发生相互作用时;⑥长期用药需维持有效浓度者;⑦抗生素(部分);⑧肿瘤化疗药。(确切八类清单以课本/PPT为准)","options":{},"answer":"简答题","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 10:28 [14:41、15:46]〕｜非真题原题·据课堂整理","priority":"重要","isRecall":true,"sourceId":10,"isPatch":true,"addedAt":1780505752329,"examProb":"必考"},{"id":"sw-207","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"速通补充","number":"","title":"【简答】易化扩散、主动转运与膜动转运对比","answerText":"易化扩散、主动转运与膜动转运对比(必考):①易化扩散——载体帮助下顺浓度梯度扩散、不耗能,但需载体蛋白故有结构特异性+饱和现象+竞争抑制+部位特异性,比单纯扩散快(小肠/血脑屏障的D-葡萄糖、氨基酸、季铵盐)②主动转运——逆浓度梯度、消耗ATP、需载体蛋白,速率 dC/dt=Vm·C/(Km+C),受代谢抑制剂(氰化物)影响,存在竞争性抑制(葡萄糖与半乳糖)与部位特异性(K+/Na+/I-/单糖/氨基酸/水溶性维生素)③膜动转运——胞饮(溶解物/液体)、吞噬(颗粒物如细菌)、胞吐(逆向如胰岛素分泌)。\n\n〔老师强调/扣分点〕笔记★★★★高频对比题。易化扩散(顺浓度不耗能但需载体)vs主动转运(逆浓度耗ATP)、膜动转运胞饮/吞噬/胞吐分类是核心辨析(注:笔记'载体'OCR为'甾体')。","options":{},"answer":"简答题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 主动转运特点—问答题(真题问答1)+胞饮选择题〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125126},{"id":"sw-208","course":"生物药剂学与药物动力学","type":"计算记忆","chapter":"速通补充","number":"","title":"【计算】【考试原题·计算题】单室模型静脉注射参数计算(老师课堂亲述考题)","answerText":"【考试原题·计算题】单室模型静脉注射参数计算(老师课堂亲述考题):已知某单室模型药物单次静脉注射剂量2000mg,静脉采血2-3mL经蛋白沉淀预处理后用HPLC测定各时刻血药浓度:1h(0.28)→2h(0.24)→3h(0.21)→4h(0.18)→5h(0.16)→6h(0.14)→8h(0.10)→10h(0.08)(μg/mL)。求:k、t½、C₀、Cl、AUC及14h血药浓度。解法:lgC-t线性回归得 lgC=−0.1356t+2.1762→k=−2.303×(−0.1356)=0.312h⁻¹、t½=0.693/0.312=2.22h、C₀=10^2.1762=150μg/mL、V=X₀/C₀=2000mg/150μg/mL=13.33L、14h浓度用方程外推。注意mg与μg换算(1mg=1000μg)。\n\n〔老师强调/扣分点〕★★★★考试原题(老师课堂亲述并要求提交)。单室静注全套参数计算,数据2000mg给药,1h(0.28)→10h(0.08),是期中/期末必考计算题原型。","options":{},"answer":"计算题","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 单室静注计算—【考试原题】(老师亲述,真题计算题原型)〕｜参考答案据课堂/教材整理","priority":"必背","isRecall":true,"sourceId":"速通考点情报","examProb":"必考","isPatch":true,"addedAt":1781604125127}];


        // --- 3. 模态框组件 ---

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black bg-opacity-50 animate-fade-in">
                    <div className="bg-white rounded-xl shadow-2xl max-w-sm w-full overflow-hidden transform transition-all scale-100">
                        <div className={`p-4 flex items-center ${type === 'danger' ? 'bg-red-50 text-red-700' : 'bg-teal-50 text-teal-700'}`}>

                            <button

                            >
                                {confirmText}

        };

        const RenameModal = ({ isOpen, currentName, onConfirm, onCancel }) => {
            const [value, setValue] = useState('');
            useEffect(() => { if (isOpen) setValue(currentName); }, [isOpen, currentName]);
            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black bg-opacity-50 animate-fade-in">
