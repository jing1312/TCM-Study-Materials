,"chapter":"7. 三萜及其苷类","number":"tr-0724","title":"皂苷","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是一类结构比较复杂的苷类化合物。它的水溶液经振摇后能产生大量持久性、似肥皂样的泡沫。","mnemonic":"","addedAt":1781947616075},{"id":"tr-1092","course":"天然药物化学","type":"名词解释记忆","chapter":"7. 三萜及其苷类","number":"tr-0725","title":"酯皂苷","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"糖链和苷元分子中的羧基相结合形成酯苷键,这类带有酯苷键的皂苷称为酯皂苷。","mnemonic":"","addedAt":1781947616075},{"id":"tr-1093","course":"天然药物化学","type":"名词解释记忆","chapter":"7. 三萜及其苷类","number":"tr-0726","title":"溶血指数","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是指在一定条件下(同一来源红血球、等渗、恒温等)能使血液中红细胞完全溶解的最低皂苷溶液浓度。","mnemonic":"","addedAt":1781947616075},{"id":"tr-1094","course":"天然药物化学","type":"名词解释记忆","chapter":"7. 三萜及其苷类","number":"tr-0727","title":"酸性皂苷","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"分子中含有羧基的皂苷,常指三萜皂苷。","mnemonic":"","addedAt":1781947616075},{"id":"tr-1095","course":"天然药物化学","type":"名词解释记忆","chapter":"7. 三萜及其苷类","number":"tr-0728","title":"三萜皂苷","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"三萜皂苷是由三萜皂苷元和糖组成的。三萜皂苷元是三萜类衍生物,由 30 个碳原子组成。","mnemonic":"","addedAt":1781947616075},{"id":"tr-1096","course":"天然药物化学","type":"名词解释记忆","chapter":"7. 三萜及其苷类","number":"tr-0729","title":"Liebermann-Burchard反应","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"Liebermann-Burchard反应（醋酐-浓硫酸反应）是三萜及甾体类化合物的特征显色反应：样品溶于醋酐，沿管壁加入浓硫酸，三萜皂苷显红~紫色、甾体皂苷显蓝~绿色，可用于二者的初步区别与鉴别。","mnemonic":"🆕课堂强调·补充｜〔2026-04-14 11:18 [10:00]〕｜非真题原题·据课堂整理","addedAt":1781947616075},{"id":"tr-1097","course":"天然药物化学","type":"填空记忆","chapter":"7. 三萜及其苷类","number":"tr-0730","title":"按皂苷元的化学结构可以将皂苷分成___和___两大类,___它们的苷元含碳原子数分别是___个和___个。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"三萜皂苷,甾体皂苷, 30, 27。","mnemonic":"","addedAt":1781947616075},{"id":"tr-1098","course":"天然药物化学","type":"填空记忆","chapter":"7. 三萜及其苷类","nu {"id":"tr-1126","course":"天然药物化学","type":"多选","chapter":"7. 三萜及其苷类","number":"tr-0759","title":"下列化合物属于四环三萜皂苷的是","options":{"A":"人参皂苷 Ro","B":"人参皂苷 Re","C":"人参皂苷 Rd","D":"人参皂苷 Re","E":"人参皂苷 Rf"},"answer":"BCDE","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616075},{"id":"tr-1127","course":"天然药物化学","type":"多选","chapter":"7. 三萜及其苷类","number":"tr-0760","title":"水解人参皂苷欲得真正苷元可选用","options":{"A":"矿酸水解法","B":"Smith 氧化降解法","C":"光解法","D":"土壤微生物培养法","E":"碱水解法"},"answer":"BCD","answerText":"","mnemonic":"必背｜doubao习题汇总","addedAt":1781947616075},{"id":"tr-1128","course":"天然药物化学","type":"多选","chapter":"7. 三萜及其苷类","number":"tr-0761","title":"皂苷的性质有","options":{"A":"脂溶性","B":"水溶性","C":"发泡性","D":"溶血性","E":"与甾醇生成分子复合物"},"answer":"BCDE","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616075},{"id":"tr-1129","course":"天然药物化学","type":"多选","chapter":"7. 三萜及其苷类","number":"tr-0762","title":"提取植物中原生苷方法","options":{"A":"沸水","B":"80%乙醇回流","C":"80%乙醇 40℃温浸","D":"40℃水温浸","E":"药材加硫酸铵水润湿,再水提"},"answer":"ABCE","answerText":"","mnemonic":"了解｜doubao习题汇总","addedAt":1781947616075},{"id":"tr-1130","course":"天然药物化学","type":"简答记忆","chapter":"7. 三萜及其苷类","number":"tr-0763","title":"简述皂苷的主要理化性质（发泡性、溶血性、显色反应）","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点：①发泡性——皂苷有表面活性，水溶液振摇产生持久泡沫；②溶血性——多数皂苷（尤三萜/甾体皂苷）能破坏红细胞膜引起溶血；③显色反应——Liebermann-Burchard反应（醋酐-浓硫酸，三萜显红~紫，甾体显蓝绿）等，用于皂苷类鉴别；④可与胆甾醇形成沉淀。","mnemonic":"🆕课堂强调·补充｜〔2026-04-14 11:18 [10:00]〕｜非真题原题·据课堂整理","addedAt":1781947616076},{"id":"tr-1131","course":"天然药物化学","type":"简答记忆","chapter":"7. 三萜及其苷类","number":"tr-0764","title":"如何用化学反应区别三萜皂苷(A)与甾体皂苷(B)?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"A 醋酐-浓硫酸(20:1)→红紫色;B 醋酐-浓硫酸(20:1)→蓝紫色。或:A 25%三氯醋酸/乙醇加热100°C显红色;B 25%三氯醋酸/乙醇加热60°C即显红色(甾体皂苷所需温度更低)。","mnemonic":"原误标填空,实为简答/论述题;题干据答案还原,答案据教材整理(箱守法等)","addedAt":1781947616076},{"id":"tr-1132","course":"天然药物化学","type":"简答记忆","chapter":"7. 三萜及其苷类","number":"tr-0765","title":"比较人参皂苷Rg1、Re、Rb1的Rf大小顺序并说明原因。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"Rf大小:人参皂苷Rg1>Re>Rb1。原因:(1)苷元连接的糖数目越多,极性越大,Rf越小;(2)羟基糖的极性大于去氧糖。","mnemonic":"原误标填空,实为简答/论述题;题干据答案还原,答案据教材整理(箱守法等)","addedAt":1781947616076},{"id":"tr-1133","course":"天然药物化学","type":"简答记忆","chapter":"7. 三萜及其苷类","number":"tr-0766","title":"写出下列化合物经硅胶柱色谱洗脱出柱的先→后顺序并说明理由。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"洗脱先→后:E>D>A>B>C。理由:硅胶为极性吸附剂,化合物极性越大与硅胶吸附力越强、越后出柱;各化合物极性由小到大为E<D<A<B<C,故洗脱先→后为E>D>A>B>C。","mnemonic":"原误标填空,实为简答/论述题;题干据答案还原,答案据教材整理(箱守法等)","addedAt":1781947616076},{"id":"tr-1134","course":"天然药物化学","type":"简答记忆","chapter":"7. 三萜及其苷类","number":"tr-0767","title":"皂苷溶血作用的原因及表示方法?含有皂苷的药物临床应用时应注意什么?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"①溶血原因:多数皂苷的水溶液能与红细胞膜上的胆甾醇结合,生成不溶于水的分子复合物,破坏红细胞膜的正常通透性,使细胞外水分渗入、细胞内渗透压升高而致红细胞胀破(溶血),故皂苷又称「皂毒素」。②表示方法:用溶血指数表示溶血作用强弱——即在等渗、等温、缓冲等规定条件下,能使同一来源血液中红细胞完全溶解所需皂苷的最低浓度(如甘草皂苷溶血指数约1:4000,薯蓣皂苷约1:400000)。③临床应用注意:因皂苷能破坏红细胞产生溶血,含皂苷的药物不能供静脉注射或肌肉注射(尤忌静脉给药);口服时皂苷在消化道不易吸收、并多被水解,故一般无溶血毒性,但对消化道黏膜有刺激性。此外应注意并非所有皂苷都溶血(如人参二醇型皂苷有抗溶血作用),且胆甾醇可解除皂苷的溶血毒性。","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)｜据教材补","addedAt":1781947616076},{"id":"tr-1135","course":"天然药物化学","type":"简答记忆","chapter":"7. 三萜及其苷类","number":"tr-0768","title":"写出铅盐沉淀法分离酸性皂苷与中性皂苷的流程","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"铅盐沉淀法分离酸性皂苷与中性皂苷的流程:总皂苷的水(或稀醇)溶液──加中性醋酸铅溶液→酸性皂苷与Pb²⁺生成铅盐沉淀,过滤分出→沉淀(酸性皂苷铅盐)与滤液(含中性皂苷)分开;→沉淀悬浮于适当溶剂中,通入硫化氢(H₂S)使生成PbS沉淀而脱铅,滤去PbS→得酸性皂苷;→上述滤液中再加碱式醋酸铅溶液→中性皂苷生成铅盐沉淀,过滤,同样以H₂S脱铅→得中性皂苷。(原理:酸性皂苷含羧基,可被中性醋酸铅沉淀;中性皂苷需用碱式醋酸铅才被沉淀,据此先后沉淀加以分离。)","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)｜据教材补","addedAt":1781947616076},{"id":"tr-1136","course":"天然药物化学","type":"简答记忆","chapter":"7. 三萜及其苷类","number":"tr-0769","title":"哪些试验可常用于检测药材中皂苷的存在?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"检测药材中皂苷常用:①泡沫试验——取药材粉末加水煮沸、滤过,滤液于试管中强烈振摇,产生持久性(15分钟以上不消失、加热不退)的蜂窝状泡沫,提示含皂苷;②溶血试验——皂苷水溶液能使红细胞悬液发生溶血;③颜色(显色)反应——醋酐-浓硫酸(Liebermann-Burchard)反应,三萜皂苷显红→紫色、甾体皂苷显蓝绿色;氯仿-浓硫酸(Salkowski)反应;三氯醋酸(Rosen-Heimer)反应等;④沉淀反应——酸性皂苷与中性醋酸铅、中性皂苷与碱式醋酸铅生成沉淀,甾体皂苷可与胆甾醇生成难溶复合物。综合泡沫、溶血与显色反应即可判断药材中是否含皂苷及其类型。","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)｜据教材补","addedAt":1781947616076},{"id":"tr-1137","course":"天然药物化学","type":"简答记忆","chapter":"7. 三萜及其苷类","number":"tr-0770","title":"简述柴胡皂苷a和d的分子组成,并简述为何在提取过程中要加入少量吡啶?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"①分子组成:柴胡皂苷a和柴胡皂苷d均属齐墩果烷型五环三萜皂苷(为柴胡的主要有效成分,具抗炎、降血脂等作用),二者苷元分别为柴胡皂苷元(saikogenin)系列,母核同属齐墩果烷型,在C3位等通过糖链与糖(如葡萄糖、岩藻糖等)结合成苷,a与d互为差向异构体(13,28-环氧结构的构型不同)。②加吡啶的原因:柴胡皂苷a、d分子中含有易受酸催化的13,28-环氧醚键(缩醛/烯醇醚结构),在提取过程中遇植物体中存在的有机酸或酸性环境时易发生构型转化或水解(生成次级皂苷而改变成分),故在提取时加入少量吡啶(碱性试剂)中和酸性、保持微碱性环境,以防止柴胡皂苷a、d因酸催化而分解或异构化,保护原生苷。","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)｜据教材补","addedAt":1781947616076},{"id":"tr-1138","course":"天然药物化学","type":"简答记忆","chapter":"7. 三萜及其苷类","number":"tr-0771","title":"实验测得甘草流浸膏的溶血指数为1:400,已知纯甘草皂苷的溶血指数为1:4000,求甘草浸膏中甘草皂苷的含量","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"溶血指数=能使血液完全溶血的皂苷最低浓度的倒数表示。甘草流浸膏溶血指数1:400,纯甘草皂苷1:4000,则流浸膏中甘草皂苷的百分含量=400/4000×100%=10%。即流浸膏含甘草皂苷约10%。","mnemonic":"必背｜doubao习题汇总","addedAt":1781947616076},{"id":"tr-1139","course":"天然药物化学","type":"简答记忆","chapter":"7. 三萜及其苷类","number":"tr-0772","title":"从某植物中分离得到一种成分(A),用5Mol氨水、2%H2SO4分别水解得到苷元为齐墩果酸,收率55%,水解液","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"从某植物中分离得到一种成分(A),用5Mol氨水、2%H2SO4分别水解得到苷元为齐墩果酸,收率55%,水解液中能检出D-Glucose及D-半乳糖,其克分子比为1:1。试回答下列问题: (1)归属化合物苷A的C","mnemonic":"必背｜doubao习题汇总","addedAt":1781947616076},{"id":"tr-1140","course":"天然药物化学","type":"选择","chapter":"7. 三萜及其苷类","number":"tr-0773","title":"皂苷具溶血作用的原因为","options":{"A":"具表面活性","B":"与细胞壁上胆甾醇生成沉淀","C":"具甾体母核","D":"多为寡糖苷,亲水性强","E":"有酸性基团存在"},"answer":"B","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616076},{"id":"tr-1141","course":"天然药物化学","type":"选择","chapter":"7. 三萜及其苷类","number":"tr-0774","title":"极性较大的三萜皂苷分离多采用","options":{"A":"氧化铝吸附柱色谱","B":"硅胶吸附柱色谱","C":"硅胶分配柱色谱","D":"聚酰胺柱色谱","E":"离子交换色谱"},"answer":"C","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616076},{"id":"tr-1142","course":"天然药物化学","type":"选择","chapter":"7. 三萜及其苷类","number":"tr-0775","title":"不符合皂苷通性的是","options":{"A":"分子较大,多为无定形粉末","B":"有显著而强烈的甜味","C":"对粘膜有刺激","D":"振摇后能产生泡沫","E":"大多数有溶血作用"},"answer":"B","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616076},{"id":"tr-1143","course":"天然药物化学","type":"选择","chapter":"7. 三萜及其苷类","number":"tr-0776","title":"三萜皂苷结构所具有的共性是","options":{"A":"5 个环组成","B":"一般不含有羧基","C":"均在 C3 位成苷键","D":"有 8 个甲基","E":"苷元由 30 个碳原子组成"},"answer":"E","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616076},{"id":"tr-1144","course":"天然药物化学","type":"选择","chapter":"7. 三萜及其苷类","number":"tr-0777","title":"属于齐墩果烷衍生物的是","options":{"A":"人参二醇","B":"薯蓣皂苷元","C":"甘草次酸","D":"雪胆甲素","E":"熊果酸"},"answer":"C","answerText":"","mnemonic":"了解｜doubao习题汇总","addedAt":1781947616076},{"id":"tr-1145","course":"天然药物化学","type":"选择","chapter":"7. 三萜及其苷类","number":"tr-0778","title":"溶剂沉淀法分离皂苷是利用总皂苷中各皂苷","options":{"A":"酸性强弱不同","B":"在乙醇中溶解度不同","C":"极性不同","D":"难溶于石油醚的性质","E":"分子量大小的差异"},"answer":"C","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616076},{"id":"tr-1146","course":"天然药物化学","type":"选择","chapter":"7. 三萜及其苷类","number":"tr-0779","title":"可以作为皂苷纸色谱显色剂的是","options":{"A":"醋酐-浓硫酸试剂","B":"香草醛-浓硫酸试剂","C":"三氯化铁-冰醋酸试剂","D":"三氯醋酸试剂","E":"α一萘酚-浓硫酸试剂"},"answer":"D","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616076},{"id":"tr-1147","course":"天然药物化学","type":"选择","chapter":"7. 三萜及其苷类","number":"tr-0780","title":"可用于分离中性皂苷与酸性皂苷的方法是","options":{"A":"中性醋酸铅沉淀","B":"碱性醋酸铅沉淀","C":"分段沉淀法","D":"胆甾醇沉淀法","E":"酸提取碱沉淀法"},"answer":"A","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616076},{"id":"tr-1148","course":"天然药物化学","type":"选择","chapter":"7. 三萜及其苷类","number":"tr-0781","title":"三萜类化合物结构的共同特点是都有","options":{"A":"30 个碳原子","B":"8 个甲基","C":"6 个甲基","D":"E 环为五元环","E":"都在 C3 位成苷键"},"answer":"A","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616076},{"id":"tr-1149","course":"天然药物化学","type":"选择","chapter":"7. 三萜及其苷类","number":"tr-0782","title":"Liebermann-Burchard反应所使用的试剂是","options":{"A":"氯仿-浓硫酸","B":"三氯醋酸","C":"香草醛-浓硫酸","D":"醋酐-浓硫酸","E":"盐酸-对二甲氨基苯甲醛"},"answer":"D","answerText":"","mnemonic":"必背｜doubao习题汇总","addedAt":1781947616076},{"id":"tr-1150","course":"天然药物化学","type":"选择","chapter":"7. 三萜及其苷类","number":"tr-0783","title":"从水溶液中萃取皂苷类最好用","options":{"A":"氯仿","B":"丙酮","C":"正丁醇","D":"乙醚","E":"乙醇"},"answer":"C","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616076},{"id":"tr-1151","course":"天然药物化学","type":"选择","chapter":"7. 三萜及其苷类","number":"tr-0784","title":"区别三萜皂苷与甾体皂苷的反应","options":{"A":"3 , 5-二硝基苯甲酸","B":"三氯化铁-冰醋酸","C":"α-萘酚-浓硫酸反应","D":"20%三氯醋酸反应","E":"盐酸-镁粉反应"},"answer":"D","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616076},{"id":"tr-1152","course":"天然药物化学","type":"选择","chapter":"7. 三萜及其苷类","number":"tr-0785","title":"有关人参皂苷叙述错误的是","options":{"A":"C 型是齐墩果酸的双糖链苷","B":"人参总皂苷可按皂苷提取通法提取","C":"A 型、B 型苷元是达玛烷型衍生物","D":"A 型、B 型有溶血作用, C 型有抗溶血作用","E":"人参皂苷的原始苷元应是 20 (S) -原人参二醇和 20 (S) -原人参三醇"},"answer":"D","answerText":"","mnemonic":"必背｜doubao习题汇总","addedAt":1781947616076},{"id":"tr-1153","course":"天然药物化学","type":"选择","chapter":"7. 三萜及其苷类","number":"tr-0786","title":"下列皂苷中具有甜味的是","options":{"A":"人参皂苷","B":"甘草皂苷","C":"薯蓣皂苷","D":"柴胡皂苷","E":"远志皂苷"},"answer":"B","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616076},{"id":"tr-1154","course":"天然药物化学","type":"选择","chapter":"7. 三萜及其苷类","number":"tr-0787","title":"制剂时皂苷不适宜的剂型是","options":{"A":"片剂","B":"注射剂","C":"冲剂","D":"糖浆剂","E":"合剂"},"answer":"B","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616076},{"id":"tr-1155","course":"天然药物化学","type":"选择","chapter":"7. 三萜及其苷类","number":"tr-0788","title":"下列成分的水溶液振摇后能产生大量持久性泡沫,并不因加热而消失的是","options":{"A":"蛋白质","B":"黄酮苷","C":"皂苷","D":"生物碱","E" "甾体皂苷由**螺甾烷类化合物**与糖缩合而成,苷元为27个碳的螺甾烷醇衍生物(含A-F六环,E、F环以螺缩酮形式相连)。按C25构型及F环是否成环分四类:①**螺甾烷醇型**(25S,F环闭环);②**异螺甾烷醇型**(25R);③**呋甾烷醇型**(F环开链,C22-OH);④**变形螺甾烷醇型**。多数无C3-COOH,故多为中性皂苷;无强心苷的不饱和内酯环。","mnemonic":"[答案据教材手写补全]","addedAt":1781947616076},{"id":"tr-1216","course":"天然药物化学","type":"简答记忆","chapter":"8. 甾体及其苷类","number":"tr-0849","title":"提取强心苷原生苷时应注意哪几方面因素?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"提取**原生苷**(一级苷)关键是**抑制酶解和酸碱水解**:①新鲜药材**及时干燥或冷冻**,迅速破坏共存水解酶;②可加**硫酸铵**等使酶失活;③**忌用酸、碱**及长时间加热(防苷键及内酯环水解);④多用**>70%乙醇**冷浸或渗漉;⑤铅盐沉淀除杂时条件温和。","mnemonic":"[答案据教材手写补全]","addedAt":1781947616076},{"id":"tr-1217","course":"天然药物化学","type":"简答记忆","chapter":"8. 甾体及其苷类","number":"tr-0850","title":"强心苷的定义及甲型、乙型的区别","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"强心苷是存在于植物中具有强心作用的甾体苷类化合物,由强心苷元和糖两部分构成。根据苷元C17位侧链不同分为:侧链为五元不饱和内酯环(Δαβ-γ-内酯)的甲型强心苷,和侧链为六元不饱和内酯环(Δαβ,γδ-δ-内酯)的乙型强心苷。","mnemonic":"必背｜星空历年真题","addedAt":1781947616076},{"id":"tr-1218","course":"天然药物化学","type":"简答记忆","chapter":"8. 甾体及其苷类","number":"tr-0851","title":"命名下列化合物:\n洋地黄毒苷元 乌本苷元 海葱苷元","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"(强心苷元命名题)依甲型/乙型判断:**洋地黄毒苷元**(digitoxigenin,甲型,C3β-OH、C14β-OH、C17接Δαβ-五元不饱和内酯);**乌本苷元**(ouabagenin,甲型,多羟基);**海葱苷元**(scillarenin,**乙型**,C17接六元双烯δ-内酯)。命名要点:标明甾核羟基位置与构型及内酯环类型(甲型五元单烯/乙型六元双烯)。","mnemonic":"[答案据教材手写补全]","addedAt":1781947616076},{"id":"tr-1219","course":"天然药物化学","type":"简答记忆","chapter":"8. 甾体及其苷类","number":"tr-0852","title":"以反应式表示:由毛花洋地黄苷丙 (C)制备临床上应用的强心苷类药物西地兰和狄戈辛。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"毛花洋地黄苷丙(lanatoside C)经**碱性水解脱去C16乙酰基并脱末端葡萄糖**生成**西地兰**(去乙酰毛花苷,deslanoside);西地兰经**温和酸水解**调整糖链得**狄戈辛**(digoxin,狄戈辛元+3洋地黄毒糖)。要点:①脱乙酰(碱);②脱葡萄糖;③控制水解保留3去氧糖。","mnemonic":"[答案据教材手写补全]","addedAt":1781947616076},{"id":"tr-1220","course":"天然药物化学","type":"简答记忆","chapter":"8. 甾体及其苷类","number":"tr-0853","title":"影响强心苷水溶性的因素有哪些?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"强心苷水溶性取决于**糖的数目和苷元上羟基的数目与位置**:①**糖基越多**水溶性越大;②苷元上**羟基越多**亲水性越强;③糖基为**羟基糖**(如葡萄糖)比**去氧糖**(如洋地黄毒糖)更亲水;④羟基若形成**分子内氢键**则水溶性下降。原生苷一般比次生苷、苷元更易溶于水。","mnemonic":"[答案据教材手写补全]","addedAt":1781947616076},{"id":"tr-1221","course":"天然药物化学","type":"简答记忆","chapter":"8. 甾体及其苷类","number":"tr-0854","title":"如何用醋酐-浓硫酸(Liebermann-Burchard)反应区别三萜皂苷(A)与甾体皂苷(B)?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"A(三萜皂苷)醋酐-浓硫酸反应最后显红紫色;B(甾体皂苷)醋酐-浓硫酸反应最后显蓝紫(绿)色。二者颜色终态不同,据此可区别。","mnemonic":"原误标填空且仅存答案,实为鉴别简答题;题干据答案+教材重建;答案据教材整理","addedAt":1781947616076},{"id":"tr-1222","course":"天然药物化学","type":"简答记忆","chapter":"8. 甾体及其苷类","number":"tr-0855","title":"如何用盐酸-对二甲氨基苯甲醛反应区别螺甾烷醇型皂苷(A)与呋甾烷醇型皂苷(B)?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"A(螺甾烷醇型)盐酸-对二甲氨基苯甲醛反应→阴性(-);B(呋甾烷醇型)→阳性(+),显红色。呋甾烷醇型因F环开裂、C22位为半缩酮/羟基,该反应阳性。","mnemonic":"原误标填空,实为简答/论述题;题干据答案还原,答案据教材整理(箱守法等)","addedAt":1781947616076},{"id":"tr-1223","course":"天然药物化学","type":"简答记忆","chapter":"8. 甾体及其苷类","number":"tr-0856","title":"【简答】典型化合物的结构、俗名及结构类型","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"掌握典型化合物的结构、俗名及结构类型：通常给结构写俗名(不默写完整结构)；结构类型要求写到二级结构(甾体母核=一级结构，其下分的类型=二级结构)。\n\n〔老师强调/扣分点〕老师:『结构可分一级、二级结构…甾体倒转就是一级结构，X下分的结构类型叫二级结构』。考核形式=给结构写俗名+写结构类型。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 简答/结构题(典型化合物俗名+结构类型到二级—真题简答'写名称结构类型活性'(认结构题每年必考))〕｜参考答案据课堂/教材整理","addedAt":1781947616076},{"id":"tr-1224","course":"天然药物化学","type":"简答记忆","chapter":"8. 甾体及其苷类","number":"tr-0857","title":"【简答】强心苷、甾体皂苷的理化性质和鉴别反应","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"掌握强心苷、甾体皂苷的理化性质和鉴别反应——特征性鉴别反应为必考内容(本章核心实验考点，后续详讲)。\n\n〔老师强调/扣分点〕笔记『考试重点』:鉴别反应为必考，需掌握反应原理和现象。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(强心苷甾体皂苷理化性质鉴别反应—真题+知到'甲型强心苷苷元结构特点')〕｜参考答案据课堂/教材整理","addedAt":1781947616076},{"id":"tr-1225","course":"天然药物化学","type":"简答记忆","chapter":"8. 甾体及其苷类","number":"tr-0858","title":"【简答】K-K反应(鉴别2-去氧糖)的局限性","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"K-K反应(鉴别2-去氧糖)的局限性:①只有游离2-去氧糖才能显色;②若2-去氧糖与其他糖形成二糖/三糖(结合紧密)则无法显色。\n\n〔老师强调/扣分点〕老师:『只有这个游离的二[去]氧[糖]…才能显示…如果形成二糖三糖…在这个条件下它是不显示的』。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 简答(K-K反应局限性—真题强心苷鉴别延伸)〕｜参考答案据课堂/教材整理","addedAt":1781947616076},{"id":"tr-1226","course":"天然药物化学","type":"简答记忆","chapter":"8. 甾体及其苷类","number":"tr-0859","title":"【简答】强心苷分类","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"强心苷分类(据苷元C17侧链内酯环大小,高频考点):①甲型强心苷——C17侧链为五元不饱和内酯环(Δαβ-γ-内酯,即强心烯内酯,如洋地黄毒苷)②乙型强心苷——C17侧链为六元不饱和内酯环(Δαβ,γδ-δ-内酯,即蟾蜍二烯内酯)。\n\n〔老师强调/扣分点〕笔记★★★★甲型(五元)vs乙型(六元)区分是高频考点。命名:希腊字母标双键位置。老师:『每周考题会涉及』。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(★强心苷甲/乙型分类C17内酯环五元/六元—真题简答'甲型C17五元不饱和内酯/〕｜参考答案据课堂/教材整理","addedAt":1781947616076},{"id":"tr-1227","course":"天然药物化学","type":"论述记忆","chapter":"8. 甾体及其苷类","number":"tr-0860","title":"【论述】甾体皂苷分类","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"论述题","answerText":"甾体皂苷分类(依螺甾烷C25构型和F环环合状态分四类):①螺甾烷醇类(spirostanols,25S/L型)②异螺甾烷醇类(isospirostanols,25R/D型)③呋甾烷醇类(furostanols,F环开裂)④变形螺甾烷醇类(pseudo-spirostanols)。甾体皂苷元基本骨架=螺甾烷(27碳,ABCDEF六环)。\n\n〔老师强调/扣分点〕老师:『重点掌握甾体皂苷苷元的结构类型分类有哪几种』。剑麻皂苷元(sisalagenin)是合成120多种激素的原料。25R(异螺甾)更稳定。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择(甾体皂苷四类:螺甾烷醇/异螺甾烷醇/呋甾烷醇/变形—知到'螺甾醇型甾体元错误论述'(多〕｜参考答案据课堂/教材整理","addedAt":1781947616076},{"id":"tr-1228","course":"天然药物化学","type":"选择","chapter":"8. 甾体及其苷类","number":"tr-0861","title":"区别原薯蓣皂苷与薯蓣皂苷的方法是","options":{"A":"1%香草醛-浓硫酸","B":"三氯化铁-冰醋酸","C":"醋酐-浓硫酸","D":"α一萘酚-浓硫酸","E":"盐酸-对二甲氨基苯甲醛"},"answer":"E","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616076},{"id":"tr-1229","course":"天然药物化学","type":"选择","chapter":"8. 甾体及其苷类","number":"tr-0862","title":"区别甾体皂苷元 C25 位构型,可根据 IR 光谱中的( )作为依据。","options":{"A":"B 带>C 带","B":"A 带>B 带","C":"D 带>A 带","D":"C 带>D 带","E":"A 带>C 带"},"answer":"A","answerText":"","mnemonic":"重要｜习题汇总含答案","addedAt":1781947616076},{"id":"tr-1230","course":"天然药物化学","type":"选择","chapter":"8. 甾体及其苷类","number":"tr-0863","title":"区别甾体皂苷元C25位构型,可根据IR光谱中的","options":{"A":"B 带>C 带","B":"A 带>B 带","C":"D 带>A 带","D":"C 带>D 带","E":"A 带>C 带"},"answer":"A","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616076},{"id":"tr-1231","course":"天然药物化学","type":"选择","chapter":"8. 甾体及其苷类","number":"tr-0864","title":"甾体皂苷不具有的性质是","options":{"A":"可溶于水、正丁醇","B":"与醋酸铅产生沉淀","C":"与碱性醋酸铅沉淀","D":"表面活性与溶血作用","E":"皂苷的苷键可以被酶、酸或碱水解"},"answer":"B","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616076},{"id":"tr-1232","course":"天然药物化学","type":"选择","chapter":"8. 甾体及其苷类","number":"tr-0865","title":"下列化合物属于( )\ng l c\n O\nO\n OH OH\n O O O O一\nOH /OH","options":{"A":"五环三萜皂苷","B":"呋甾烷醇型皂苷C. 螺甾烷醇型皂苷","C":"四环三萜皂苷","D":"甲型强心苷","E":""},"answer":"C","answerText":"","mnemonic":"重要｜习题汇总含答案","addedAt":1781947616076},{"id":"tr-1233","course":"天然药物化学","type":"选择","chapter":"8. 甾体及其苷类","number":"tr-0866","title":"可用于分离螺甾烷甾体皂苷和呋甾烷皂苷的方法是( )","options":{"A":"乙醇沉淀法","B":"pH 梯度萃取法","C":"醋酸铅沉淀法","D":"明胶沉淀法","E":"胆甾醇沉淀法"},"answer":"E","answerText":"","mnemonic":"重要｜习题汇总含答案","addedAt":1781947616076},{"id":"tr-1234","course":"天然药物化学","type":"选择","chapter":"8. 甾体及其苷类","number":"tr-0867","title":"有关薯蓣皂苷叙述错误的是","options":{"A":"与三氯醋酸试剂显红色,此反应不能用于纸色谱显色","B":"中性皂苷","C":"可溶于甲醇、乙醇","D":"其苷元是合成甾体激素的重要原料","E":"单糖链苷,三糖苷"},"answer":"A","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616076},{"id":"tr-1235","course":"天然药物化学","type":"选择","chapter":"8. 甾体及其苷类","number":"tr-0868","title":"含甾体皂苷水溶液中,分别加入酸管(加盐酸)碱管(加氢氧化钠)后振摇,结果是","options":{"A":"两管泡沫高度相同","B":"酸管泡沫高于碱管几倍","C":"碱管泡沫高于酸管几倍","D":"两管均无泡沫","E":"异螺甾烷醇型皂苷"},"answer":"C","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616076},{"id":"tr-1236","course":"天然药物化学","type":"选择","chapter":"8. 甾体及其苷类","number":"tr-0869","title":"有关螺甾醇型甾体皂苷元的错误论述是","options":{"A":"27 个碳原子","B":"C22 为螺原子","C":"E 环是呋喃环, F 环是吡喃环","D":"六个环组成","E":"D、E 环为螺缩酮形式连接"},"answer":"E","answerText":"","mnemon "【名词解释】生物碱准确定义","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"生物碱准确定义(1983年法国药物学家派勒蒂埃):指含负氧化态氮原子、存在于生物有机体内的环状化合物。三要点:①含负氧化态氮②生物体内③环状。\n\n〔老师强调/扣分点〕负氧化态氮包括胺(-3)、酰胺(-3)、季铵(-3)、氮氧化物(-1);不包括硝基(+3)、亚硝基(+1)。如小檗碱是生物碱,马兜铃酸(含硝基+3)不是。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 名词解释(★生物碱准确定义派勒蒂埃—真题名解'生物碱'(1818Meissner/1983)〕｜参考答案据课堂/教材整理","addedAt":1781947616076},{"id":"tr-1299","course":"天然药物化学","type":"填空记忆","chapter":"9. 生物碱","number":"tr-0932","title":"生物碱在植物体内的存在形式主要有___、___和___三类。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"游离碱类,盐类,N-氧化物类","mnemonic":"原topic标签题,据答案改写为规范填空题并挖考点;答案存answerText","addedAt":1781947616076},{"id":"tr-1300","course":"天然药物化学","type":"填空记忆","chapter":"9. 生物碱","number":"tr-0933","title":"黄连中的主要化学成分是___","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"小檗碱","mnemonic":"汇集各章习题(sId6)填空","addedAt":1781947616076},{"id":"tr-1301","course":"天然药物化学","type":"填空记忆","chapter":"9. 生物碱","number":"tr-0934","title":"生物碱按其溶解性可分为___和___。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"脂溶性生物碱；水溶性生物碱","mnemonic":"汇集各章习题(sId6)填空","addedAt":1781947616076},{"id":"tr-1302","course":"天然药物化学","type":"填空记忆","chapter":"9. 生物碱","number":"tr-0935","title":"植物体内,大多数生物碱与___结合成生物碱盐;少数生物碱与___成盐;还有的生物碱呈___状态存在。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"有机酸；无机酸；游离","mnemonic":"汇集各章习题(sId6)填空","addedAt":1781947616076},{"id":"tr-1303","course":"天然药物化学","type":"填空记忆","chapter":"9. 生物碱","number":"tr-0936","title":"常用的生物碱沉淀试剂有___试剂、___试剂等。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"碘-碘化钾；碘化铋钾","mnemonic":"汇集各章习题(sId6)填空","addedAt":1781947616076},{"id":"tr-1304","course":"天然药物化学","type":"填空记忆","chapter":"9. 生物碱","number":"tr-0937","title":"生物碱分离方法有:利用___差异进行分离;利用___差异进行分离;利用生物碱特殊功能基的性质进行分离。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"溶解度；碱性","mnemonic":"汇集各章习题(s nswerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616076},{"id":"tr-1320","course":"天然药物化学","type":"多选","chapter":"9. 生物碱","number":"tr-0953","title":"提取生物碱常用的提取方法有","options":{"A":"醇提取丙酮沉淀法","B":"酸水提取法","C":"亲脂性有机溶剂提取法","D":"醇类溶剂提取法","E":"碱提取酸沉淀法"},"answer":"BCD","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616076},{"id":"tr-1321","course":"天然药物化学","type":"多选","chapter":"9. 生物碱","number":"tr-0954","title":"亲水性生物碱通常指","options":{"A":"两性生物碱","B":"游离生物碱","C":"季铵生物碱","D":"具有 N →O 配位键的生物碱","E":"仲胺生物碱"},"answer":"CD","answerText":"","mnemonic":"重要｜doubao习题汇总｜巧记:亲水性溶剂——甲乙丙丁(甲醇/乙醇/丙酮/正丁醇)","addedAt":1781947616076},{"id":"tr-1322","course":"天然药物化学","type":"多选","chapter":"9. 生物碱","number":"tr-0955","title":"用溶剂法提取生物碱常采用的方法为","options":{"A":"萃取法","B":"水蒸气蒸馏法","C":"分馏法","D":"浸渍法","E":"渗漉法"},"answer":"AD","answerText":"","mnemonic":"重要｜doubao习题汇总 [存疑:'溶剂法提取生物碱常用方法'=浸渍法(D)、渗漉法(E)等溶剂提取;水蒸气蒸馏(]","addedAt":1781947616076},{"id":"tr-1323","course":"天然药物化学","type":"多选","chapter":"9. 生物碱","number":"tr-0956","title":"用乙醇提取生物碱可提出","options":{"A":"游离生物碱","B":"生物碱无机酸盐","C":"生物碱有机酸盐","D":"季铵型生物碱","E":"两性生物碱"},"answer":"ABCD","answerText":"","mnemonic":"重要｜doubao习题汇总 [答案经教材核对无误]","addedAt":1781947616076},{"id":"tr-1324","course":"天然药物化学","type":"多选","chapter":"9. 生物碱","number":"tr-0957","title":"溶剂法分离水溶性生物碱时,常用的溶剂有","options":{"A":"丙酮","B":"正丁醇","C":"异戊醇","D":"乙醇","E":"乙醇"},"answer":"BC","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616076},{"id":"tr-1325","course":"天然药物化学","type":"多选","chapter":"9. 生物碱","number":"tr-0958","title":"用酸水提取生物碱时,可用","options":{"A":"煎煮法","B":"回流法","C":"渗漉法","D":"浸渍法","E":"连续回流法"},"answer":"CD","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616076},{"id":"tr-1326","course":"天然药物化学","type":"多选","chapter":"9. 生物碱","number":"tr-0959","title":"生物碱的沉淀反应","options":{"A":"一般在稀酸水溶液中进行","B":"可应用于生物碱的分离纯化","C":"选用一种沉淀试剂反应呈阳性,即可判断有生物碱","D":"有些沉淀试剂可用作纸色谱和薄层色谱的显色剂","E":"可不必处理酸水提取液"},"answer":"ABD","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616076},{"id":"tr-1327","course":"天然药物化学","type":"多选","chapter":"9. 生物碱","number":"tr-0960","title":"用亲脂性有机溶剂提取总生物碱时,一般","options":{"A":"先用酸水湿润药材","B":"先用碱水湿润药材","C":"先用石油醚脱脂","D":"用氯仿、苯等溶剂提取","E":"用正丁醇、乙醇等溶剂提取"},"answer":"BD","answerText":"","mnemonic":"重要｜doubao习题汇总｜巧记:亲水性溶剂——甲乙丙丁(甲醇/乙醇/丙酮/正丁醇)","addedAt":1781947616076},{"id":"tr-1328","course":"天然药物化学","type":"多选","chapter":"9. 生物碱","number":"tr-0961","title":"生物碱分子结构与其碱性强弱的关系正确的是:","options":{"A":"氮原子价电子的 P 电子成分比例越大,碱性越强","B":"氮原子附近有吸电子基团则使碱性增强","C":"氮原子处于酰胺状态则碱性极弱","D":"生物碱的立体结构有利于氮原子接受质子,则其碱性性增强","E":"氮原子附近取代基团不利于其共轭酸中的质子形成氢键缔合,则碱性强"},"answer":"ACD","answerText":"","mnemonic":"重要｜doubao习题汇总","addedAt":1781947616076},{"id":"tr-1329","course":"天然药物化学","type":"简答记忆","chapter":"9. 生物碱","number":"tr-0962","title":"从黄连中提取小檗碱的实验流程如下,根据流程回答下列问题。\n黄连粗粉\n盐酸黄连素\n(1)写出小檗碱的分子结构式。\n(2)指出划线部分操作的目的是什么?\n①用 0.5%H2SO 提取\n②超声处理 30min\n③盐酸调 pH2\n④加 6%食盐","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"(1)小檗碱的结构式。\n(2)划线部分操作的目的是:\n①用 0.5%H2SO 提取是因为硫酸小檗碱的水溶性 (1 :30)较大,所以用硫酸水提取。\n②超声处理 30min,在于超声波的作用,使生物碱提取更完全。\n③盐酸调 pH2,因为盐酸小檗碱的水中溶解度 (1 :500)较小,容易析出沉淀。\n④加 6%食盐,通过盐析,使小檗碱更容易快速析出沉淀。","mnemonic":"","addedAt":1781947616076},{"id":"tr-1330","course":"天然药物化学","type":"简答记忆","chapter":"9. 生物碱","number":"tr-0963","title":"根据流程回答问题\n(1)写出以离子交换树脂法纯化生物碱酸水提取液的原理\n(2)酸水渗漉时渗漉液的 pH 变化情况如何?\n(3)划线部分的目的:","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"根据流程回答问题\n(1)离子交换树脂法纯化生物碱酸水提取液的原理:\n交换原理: R-SO3-H++BH+ —→ R-SO3-BH+ + H+\n碱化原理: R-SO3-BH++ NH4OH —→ R-SO3-NH4++B+H2O\n(2)酸水渗漉时渗漉液的 pH 变化情况:\n开始渗漉时 pH4~5,继续渗漉有生物碱交换在树脂上,树脂柱流出液 pH1~2,当树脂交换饱和时,流出液 pH4~5。\n(3)划线部分的目的:\n①纯化水冲至澄明,抽滤,室温风干:如果树脂较湿,提取时石油醚不易穿透树脂表面的水化膜,影响提取效果。\n②洗脱至碘化铋钾试剂呈阴性。是说明生物碱提取完全,可以停止回流。","mnemonic":"","addedAt":1781947616076},{"id":"tr-1331","course":"天然药物化学","type":"简答记忆","chapter":"9. 生物碱","number":"tr-0964","title":"某豆科植物的种子, 经过石油醚充分脱脂后的乙醇提取液浓缩液中主要含有 A、B、C、D 四种成分以及水溶性杂质,将该提取液点样在 pH 缓冲纸色谱上,以水饱和的氯仿展开显色后,将每个成分的斑点连成线结果如下图。\n试回答下列问题;\n⑴A、B、C、D 分别属于哪一类成分?\nA B C D \nx比较 A、B 的 pKa 大小顺序\npKa: >","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"试回答下列问题:\n⑴ A 、B 、C 、D 分别属于哪一类成分?\nA 弱碱 B 中强碱 C 酚性生物碱 D 酸性成分 \nx 比较 A 、B 的 pKa 大小顺序pKa: B > A","mnemonic":"","addedAt":1781947616076},{"id":"tr-1332","course":"天然药物化学","type":"简答记忆","chapter":"9. 生物碱","number":"tr-0965","title":"【母题】用生物碱沉淀试剂进行鉴别时，为什么至少要用三种试剂同时检查？操作注意事项？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点：①因部分非生物碱成分（如氨基酸、蛋白质、多糖、脂质等）也能与某些沉淀试剂产生沉淀（假阳性），单一试剂阳性不能确证；故鉴定时至少选用三种不同的生物碱沉淀试剂，均呈阳性才可初步判定含生物碱；②注意事项：在酸性（稀酸）水溶液中进行、控制含水量、沉淀试剂应慢慢滴加而非一次倒入，以避免误判。","mnemonic":"🆕课堂强调·补充｜〔2026-04-24 10:28 [05:00]〕｜非真题原题·据课堂整理｜毛水春·至少三种沉淀试剂","addedAt":1781947616076},{"id":"tr-1333","course":"天然药物化学","type":"简答记忆","chapter":"9. 生物碱","number":"tr-0966","title":"【母题】影响生物碱碱性强弱的主要结构因素有哪些？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"答题要点：生物碱碱性强弱主要取决于氮原子的电子云密度及其杂化状态：①氮杂化方式——sp³>sp²>sp（杂化中s成分越多碱性越弱），季铵碱碱性最强；②诱导效应——给电子基增强碱性、吸电子基（如邻位羟基、羰基）减弱碱性；③共轭效应——氮孤对电子参与共轭（如酰胺、芳胺）碱性显著减弱；④空间效应与分子内氢键——质子化后能形成分子内氢键者碱性增强。","mnemonic":"🆕课堂强调·补充｜〔2026-04-24 10:28 [05:00]〕｜非真题原题·据课堂整理｜毛水春·生物碱碱性","addedAt":1781947616076},{"id":"tr-1334","course":"天然药物化学","type":"简答记忆","chapter":"9. 生物碱","number":"tr-0967","title":"【简答】生物碱生源途径","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"生物碱生源途径:①来源于氨基酸途径(主要途径,大多数生物碱)——鸟氨酸/赖氨酸→哌啶类/吲哚里西啶类/喹诺里西啶类;邻氨基苯甲酸→喹啉类/吖啶酮类;苯丙氨酸/酪氨酸→苯丙胺类/异喹啉类;色氨酸→吲哚类②来源于甲戊二羟酸途径(少数,萜类/甾体生物碱)。\n\n〔老师强调/扣分点〕老师讲生源关系。考点:氨基酸前体与生物碱母核对应(酪氨酸→异喹啉、色氨酸→吲哚)。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(生物碱生源:氨基酸途径鸟氨酸/赖氨酸—知到'毒芹碱吡啶类''吗啡吗啡烷类'+真题〕｜参考答案据课堂/教材整理","addedAt":1781947616076},{"id":"tr-1335","course":"天然药物化学","type":"简答记忆","chapter":"9. 生物碱","number":"tr-0968","title":"【简答】生物碱沉淀反应","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"生物碱沉淀反应(必考):在酸性水/稀醇中(使生物碱呈盐)与试剂生成难溶复盐/络合物。三大类试剂:①碘化物复盐——碘化铋钾Dragendorff(BiI3·KI,黄至橘红色沉淀,最常用可作显色剂)、碘化汞钾Mayer(HgI2·2KI,白色沉淀)、碘-碘化钾Wagner(I2-KI,棕褐色沉淀)②重金属盐——3%氯化金(黄色)、10%硅钨酸(灰白/淡黄)、雷氏铵盐(紫红色,兼鉴别+提取,实验室最常用)③大分子酸——苦味酸(2,4,6-三硝基苯酚,黄色晶形)。\n\n〔老师强调/扣分点〕笔记★★★★。用途:检识/分离纯化/鉴定。注意:需≥3种不同类型试剂交叉验证;醇含水量>50%;氨基酸/蛋白/多糖/鞣质假阳性需碱化CHCl3萃取纯化。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(★生物碱沉淀反应碘化铋钾/碘化汞钾—知到'生物碱沉淀反应条件:酸性水溶液'+'生〕｜参考答案据课堂/教材整理","addedAt":1781947616076},{"id":"tr-1336","course":"天然药物化学","type":"简答记忆","chapter":"9. 生物碱","number":"tr-0969","title":"【简答】生物碱显色反应(专属鉴别)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"生物碱显色反应(专属鉴别):酸性水/稀醇中生物碱与浓无机酸反应生成有色物(非沉淀)。①Vitali反应(发烟硝酸+NaOH醇液)——仅托烷类(含莨菪酸):阿托品/莨菪碱/东莨菪碱②Marquis反应(含甲醛浓硫酸)——吗啡显紫红色、可待因显蓝色,专鉴吗啡类。\n\n〔老师强调/扣分点〕笔记★★★。Vitali=托烷类专属、Marquis=吗啡类专属是高频对应题。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★知到原题 ★历年考过 ｜ 选择/简答(★生物碱显色反应Vitali/Marquis—知到'生物碱结构鉴定:化学方法光谱〕｜参考答案据课堂/教材整理","addedAt":1781947616076},{"id":"tr-1337","course":"天然药物化学","type":"选择","chapter":"9. 生物碱","number":"tr-0970","title":"生物碱不具有的特点是","options":{"A":"分子中含 N 原子","B":"具有碱性","C":"分子中多有苯环","D":"显著而特殊的生物活性","E":"N 原子多在环内"},"answer":"C","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616076},{"id":"tr-1338","course":"天然药物化学","type":"选择","chapter":"9. 生物碱","number":"tr-0971","title":"生物碱碱性最强的是","options":{"A":"伯胺生物碱","B":"叔胺生物碱","C":"仲胺生物碱","D":"季铵生物碱","E":"酰胺生物碱"},"answer":"D","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616076},{"id":"tr-1339","course":"天然药物化学","type":"选择","chapter":"9. 生物碱","number":"tr-0972","title":"生物碱酸水提取液处理常用的方法是","options":{"A":"阴离子交换树脂","B":"阳离子交换树脂","C":"硅胶柱色谱吸附","D":"大孔树脂吸附","E":"氧化铝柱色谱吸附"},"answer":"B","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)","addedAt":1781947616076},{"id":"tr-1340","course":"天然药物化学","type":"选择","chapter":"9. 生物碱","number":"tr-0973","title":"碱性不同生物碱混合物的分离可选用","options":{"A":"简单萃取法","B":"酸提取碱沉淀法","C":"pH 梯度萃取法","D":"有机溶剂回流法","E":"分馏法"},"answer":"C","answerText":"","mnemonic":"重要｜doubao习题汇总｜(答案存疑,以教材为准)"," 题(sId6);(原卷答案疑误,已据教材订正:原C→正B)","addedAt":1781947616076},{"id":"tr-1378","course":"天然药物化学实验","type":"简答记忆","chapter":"实验一·虎杖中蒽醌类成分","number":"tr-1011","title":"虎杖中蒽醌类成分实验的目的与要求","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"1、掌握PH梯度法自乙醚提取液中分离游离蒽醌成分。 2、熟悉虎杖中主要成分和性质。 3、熟悉蒽醌类成分的鉴定。","mnemonic":"必背｜实验指导·目的","addedAt":1781947616076},{"id":"tr-1379","course":"天然药物化学实验","type":"简答记忆","chapter":"实验一·虎杖中蒽醌类成分","number":"tr-1012","title":"虎杖中蒽醌类成分实验的原理(提取/分离依据)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"羟基蒽醌类化合物及二苯乙烯类成分,可溶于乙醇中,因此可用乙醇将它们提取出来 。羟基蒽醌类化合物易溶于乙醚等弱极性溶剂,白藜芦醇苷在乙醚中溶解度很小,利用 它们对乙醚的溶解性差异使羟基蒽醌类与白藜芦醇苷分离,再利用各羟基蒽醌类结构上 的不同所表现酸性不同,用PH梯度萃取法分离它们。","mnemonic":"必背｜实验指导·原理","addedAt":1781947616076},{"id":"tr-1380","course":"天然药物化学实验","type":"简答记忆","chapter":"实验一·虎杖中蒽醌类成分","number":"tr-1013","title":"归纳本实验提取、分离、鉴定的原理。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"【提取】虎杖根茎用乙醇回流提取,得羟基蒽醌类与二苯乙烯类(白藜芦醇苷)成分。【分离】(1)利用对乙醚溶解性差异:游离羟基蒽醌易溶乙醚、白藜芦醇苷难溶,使两类分开;(2)对乙醚液用pH梯度法(碱性递增)分离游离蒽醌:5%NaHCO3先萃出酸性最强的大黄酸(含-COOH),再用5%Na2CO3萃取中等酸性的大黄素(含β-酚OH),最后用1%NaOH萃取酸性最弱的大黄酚、大黄素甲醚(仅α-酚OH)。酸性强弱:含-COOH > 含β-OH(2个) > 含β-OH(1个) > 仅含α-OH,体现羟基蒽醌酸性随酚羟基数目/位置变化的规律。【鉴定】Bornträger反应(碱液显红色)、醋酸镁反应、TLC对照、熔点测定。","mnemonic":"必背｜实验指导·复习思考题","addedAt":1781947616076},{"id":"tr-1381","course":"天然药物化学实验","type":"简答记忆","chapter":"实验一·虎杖中蒽醌类成分","number":"tr-1014","title":"虎杖实验中pH梯度萃取分离游离蒽醌的试剂顺序及对应成分","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"按碱性递增依次萃取:5%碳酸氢钠(NaHCO3)→萃取酸性最强的大黄酸(含-COOH);5%碳酸钠(Na2CO3)→萃取中等酸性的大黄素(含β-酚OH);1%氢氧化钠(NaOH)→萃取酸性最弱的大黄酚、大黄素甲醚(仅α-酚OH)。原理:羟基蒽醌酸性强弱取决于酚羟基的数目和位置(含-COOH>含β-OH>仅含α-OH)。","mnemonic":"必背｜实验指导·方法要点","addedAt":1781947616076},{"id":"tr-1382","course":"天然药物化学实验","type":"简答记忆","chapter":"实验一·虎杖中蒽醌类成分","number":"tr-1015","title":"羟基蒽醌类成分的鉴定(显色)反应","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"(1)Bornträger反应:与碱液(NaOH/氨水)反应显红~紫红色(羟基蒽醌的特征反应);(2)醋酸镁反应:与0.5%醋酸镁甲醇液生成橙红~紫红色络合物(可区别羟基位置);(3)与金属离子(Pb2+等)络合显色;(4)薄层色谱(TLC)对照、可见光/UV下显色。","mnemonic":"重要｜实验指导·鉴定","addedAt":1781947616076},{"id":"tr-1383","course":"天然药物化学实验","type":"简答记忆","chapter":"实验三·汉防己生物碱","number":"tr-1016","title":"汉防己生物碱实验的目的与要求","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"1、掌握总生物碱的提取及脂溶性生物碱和水溶性生物碱、酚性叔胺碱及非酚性叔胺 碱、水溶性生物碱与水溶性杂质的分离、纯化原理和方法。 2、学习用吸附柱色谱分离生物碱,掌握一般柱色谱的操作方法。 3、熟悉生物碱的常用鉴定方法。 4、了解生物碱衍生物的制备方法。","mnemonic":"必背｜实验指导·目的","addedAt":1781947616076},{"id":"tr-1384","course":"天然药物化学实验","type":"简答记忆","chapter":"实验三·汉防己生物碱","number":"tr-1017","title":"汉防己生物碱实验的原理(提取/分离依据)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"根据大多数生物碱或生物碱盐均能溶于乙醇的通性,用乙醇回流提取法提取总碱;利用 季铵型生物碱易溶于水,不溶于亲脂性有机溶剂的性质,用溶剂萃取法分离脂溶性生物 碱和水溶性生物碱;利用汉防己甲素和汉防己乙素结构上的差异,用吸附柱色谱分离二 者,或利用汉防己甲素的极性小于汉防己乙素,在冷苯中溶解度比汉防己乙素大而加以 分离;利用季铵型生物碱可与雷氏铵盐产生沉淀的性质,使季铵型生物碱与其它水溶性 成分分离。","mnemonic":"必背｜实验指导·原理","addedAt":1781947616076},{"id":"tr-1385","course":"天然药物化学实验","type":"简答记忆","chapter":"实验三·汉防己生物碱","number":"tr-1018","title":"汉防己甲素、汉防己乙素在结构与性质上有何异同点?实验过程中,我们应怎样利用 它们的共性和个性?怎样分离?请设计方案。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"【同】均为双苄基异喹啉类生物碱,基本骨架相同,为脂溶性叔胺碱,溶于氯仿等亲脂溶剂,生理活性相似(降压、肌松)。【异】甲素(粉防己碱)甲氧基化程度高(全甲基化),乙素(防己诺林碱)含一个酚羟基(少一甲基),故乙素极性略大。【利用与分离】共性:均溶于乙醇→乙醇回流提总碱,溶于氯仿→萃取。个性:乙素含酚OH可溶于稀NaOH而甲素不溶→用NaOH碱液萃取分离二者;或利用极性差异以硅胶吸附柱色谱分离。","mnemonic":"必背｜实验指导·复习思考题","addedAt":1781947616076},{"id":"tr-1386","course":"天然药物化学实验","type":"简答记忆","chapter":"实验三·汉防己生物碱","number":"tr-1019","title":"雷氏铵盐法分离纯化季铵碱有何优缺点?解释雷氏铵盐法分离水溶性生物碱的原理。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"【原理】雷氏铵盐(硫氰酸铬铵)与季铵型生物碱定量生成难溶性复盐而沉淀,从而与脂溶性叔胺碱及水溶性杂质分离。【优点】选择性较好,能使季铵碱与叔胺碱分开,操作较简便。【缺点】复盐不稳定、遇热/光易分解,需低温避光新鲜配制;后处理(丙酮溶解、银盐或离子交换复分解)繁琐、损失较大;雷氏盐本身有色干扰检测。","mnemonic":"必背｜实验指导·复习思考题","addedAt":1781947616076},{"id":"tr-1387","course":"天然药物化学实验","type":"简答记忆","chapter":"实验三·汉防己生物碱","number":"tr-1020","title":"萃取过程中怎样防止和消除乳化?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"【防止】(1)避免剧烈振摇,轻缓旋转混合;(2)避免强碱性或含蛋白胶质条件下萃取;(3)控制两相比例。【消除】(1)静置较长时间分层;(2)加电解质(NaCl)盐析破乳;(3)滴加数滴乙醇/戊醇改变界面张力;(4)适当加热;(5)离心;(6)过滤除去固体悬浮物;(7)调节pH。","mnemonic":"必背｜实验指导·复习思考题","addedAt":1781947616076},{"id":"tr-1388","course":"天然药物化学实验","type":"简答记忆","chapter":"实验三·汉防己生物碱","number":"tr-1021","title":"汉防己总生物碱的提取及各类生物碱的分离流程","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"(1)提取:药材用乙醇回流提取总碱(生物碱及其盐均溶于乙醇);(2)分离脂溶性与水溶性碱:总碱溶液酸化后用亲脂性溶剂萃取——脂溶性叔胺碱入有机相,季铵型水溶性碱留水相;(3)分离酚性与非酚性叔胺碱:利用乙素含酚OH可溶于NaOH,用碱液萃取使甲素(非酚)与乙素(酚性)分开;(4)水溶性季铵碱:用雷氏铵盐沉淀法纯化;(5)甲、乙素可进一步用吸附柱色谱分离。","mnemonic":"必背｜实验指导·方法要点","addedAt":1781947616076},{"id":"tr-1389","course":"天然药物化学实验","type":"简答记忆","chapter":"实验三·汉防己生物碱","number":"tr-1022","title":"生物碱的常用沉淀鉴别反应","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"生物碱沉淀试剂:(1)碘化铋钾(Dragendorff)→橙红色沉淀;(2)碘化汞钾(Mayer)→白色/淡黄色沉淀;(3)碘-碘化钾(Wagner)→棕色沉淀;(4)硅钨酸→淡黄色沉淀;(5)苦味酸(苦酮酸)沉淀。注意需在酸性水溶液中进行;季铵碱另可用雷氏铵盐生成红色复盐鉴别。","mnemonic":"重要｜实验指导·鉴定","addedAt":1781947616076},{"id":"tr-1390","course":"天然药物化学实验","type":"简答记忆","chapter":"实验二·槐花米中芦丁","number":"tr-1023","title":"槐花米中芦丁实验的目的与要求","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"1、掌握酸碱法提取黄酮苷的原理和方法。 2、熟悉化学鉴别试验、苷水解、衍生物制备、熔点和薄层层析等手段在苷类结构鉴定中 的应用。 3、通过UV、IR、HNMR和MS图谱解析,了解光谱方法在黄酮类化合物结构鉴定中的应 用。","mnemonic":"必背｜实验指导·目的","addedAt":1781947616076},{"id":"tr-1391","course":"天然药物化学实验","type":"简答记忆","chapter":"实验二·槐花米中芦丁","number":"tr-1024","title":"槐花米中芦丁实验的原理(提取/分离依据)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"芸香苷分子中有酚羟基,显弱酸性,在碱水中成盐增大溶解能力,用碱水为溶剂煮沸 提取,提取液加酸酸化后又成为游离芸香苷析出,再利用芸香苷对冷、热水溶解度的差 异较大的特性进行精制。 黄酮苷可通过酸水解得到苷元和糖,并可通过薄层色谱法进行检识。 利用黄酮化合物对紫外光有特定吸收的特性进行结构测定;也可制备乙酰化物进行结 构测定。","mnemonic":"必背｜实验指导·原理","addedAt":1781947616076},{"id":"tr-1392","course":"天然药物化学实验","type":"简答记忆","chapter":"实验二·槐花米中芦丁","number":"tr-1025","title":"黄酮类化合物的结构研究的一般程序是什么?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"(1)提取分离得单体;(2)测理化常数(熔点、旋光、溶解度);(3)显色反应初判类型(盐酸-镁粉、锆盐、AlCl3等);(4)UV加诊断试剂(NaOMe/NaOAc/AlCl3/H3BO3)推断羟基位置;(5)1H-NMR、13C-NMR确定母核与取代;(6)MS定分子量;(7)酸水解鉴定糖与苷元、确定糖连接位置;(8)综合解析确定结构。","mnemonic":"必背｜实验指导·复习思考题","addedAt":1781947616076},{"id":"tr-1393","course":"天然药物化学实验","type":"简答记忆","chapter":"实验二·槐花米中芦丁","number":"tr-1026","title":"检识黄酮类化合物的常用化学方法有哪些?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"(1)盐酸-镁粉反应(黄酮/黄酮醇显橙红~紫红,查耳酮、异黄酮多阴性);(2)盐酸-锌粉反应;(3)四氢硼钠(NaBH4)反应(二氢黄酮专属,显红~紫);(4)锆-枸橼酸反应(区别3-OH与5-OH黄酮);(5)三氯化铝反应(黄色荧光);(6)氨性氯化锶(检邻二酚羟基);(7)醋酸镁反应;(8)Molisch反应(检糖,即黄酮苷)。","mnemonic":"必背｜实验指导·复习思考题","addedAt":1781947616076},{"id":"tr-1394","course":"天然药物化学实验","type":"简答记忆","chapter":"实验二·槐花米中芦丁","number":"tr-1027","title":"槐花米中芦丁(芸香苷)酸碱法提取的关键步骤与原理","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"原理:芸香苷含酚羟基显弱酸性,在碱水中成盐溶解度增大;酸化后又游离析出;再利用其冷热水溶解度差异精制。步骤:(1)槐花米加石灰乳(或硼砂)碱水煮沸提取(硼砂保护邻二酚羟基防氧化);(2)趁热过滤;(3)滤液用盐酸调pH3~4酸化,放冷使芦丁析出;(4)粗品用热水重结晶精制。","mnemonic":"必背｜实验指导·方法要点","addedAt":1781947616076},{"id":"tr-1395","course":"天然药物化学实验","type":"简答记忆","chapter":"实验二·槐花米中芦丁","number":"tr-1028","title":"芦丁(黄酮苷)的化学鉴别反应","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"(1)盐酸-镁粉反应:显橙红~红色(黄酮醇苷阳性);(2)三氯化铝反应:显黄色并有荧光;(3)Molisch反应:检识所含糖(证明为苷);(4)锆-枸橼酸反应;(5)酸水解后检识苷元(槲皮素)与糖(葡萄糖、鼠李糖)。","mnemonic":"重要｜实验指导·鉴定","addedAt":1781947616076},{"id":"tr-1396","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"1. 生物药剂学概论","number":"sw-0001","title":"生物药剂学","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是研究药物及其剂型在体内的吸收、分布、代谢与排泄过程,阐明药物的剂型因素、机体的生物因素与药理效应三者之间相互关系的科学","mnemonic":"了解｜习题集","addedAt":1781947616076},{"id":"tr-1397","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"1. 生物药剂学概论","number":"sw-0002","title":"药物及剂型的体内过程","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是指药物及剂型从给药部位给药后在体内吸收、分布、代谢和排泄的过程","mnemonic":"了解｜习题集","addedAt":1781947616076},{"id":"tr-1398","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"1. 生物药剂学概论","number":"sw-0003","title":"转运","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"药物的吸收、分布和排泄过程的统称","mnemonic":"重要｜习题集","addedAt":1781947616076},{"id":"tr-1399","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"1. 生物药剂学概论","number":"sw-0004","title":"代谢","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"药物在吸收过程或进入体循环后,受肠道菌丛或体内酶系统的作用,结构发生转变的过程。 ---","mnemonic":"重要｜习题集","addedAt":1781947616076},{"id":"tr-1400","course":"生物药剂学与药物动力学","type":"填空记忆","chapter":"1. 生物药剂学概论","number":"sw-0005","title":"药物的淋巴管转运主要与药物的______有关。分子量在______以上的大分子物质，经淋巴管转运的选择性倾向很强。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"分子量，5000","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616076},{"id":"tr-1401","course":"生物药剂学与药物动力学","type":"填空记忆","chapter":"1. 生物药剂学概论","number":"sw-0006","title":"药物向中枢神经系统的转运，主要取决于药物的______性，另外药物与____也能在一定程度上影响血液--脑脊液间的药物分配。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"脂溶性，蛋白的结合率","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616076},{"id":"tr-1402","course":"生物药剂学与药物动力学","type":"多选","chapter":"1. 生物药剂学概论","number":"sw-0007","title":"生物因素主要包括","options":{"A":"种族差异","B":"性别和年龄差异","C":"体重和高矮差异","D":"生理和病理条件的差异","E":"遗传因素"},"answer":"ABDE","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616076},{"id":"tr-1403","course":"生物药剂学与药物动力学","type":"多选","chapter":"1. 生物药剂学概论","number":"sw-0008","title":"药物处置是指","options":{"A":"吸收","B":"渗透","C":"分布","D":"代谢","E":"排泄"},"answer":"CDE","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616076},{"id":"tr-1404","course":"生物药剂学与药物动力学","type":"多选","chapter":"1. 生物药剂学概论","number":"sw-0009","title":"药物消除是指","options":{"A":"吸收","B":"渗透","C":"分布","D":"代谢","E":"排泄"},"answer":"DE","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616076},{"id":"tr-1405","course":"生物药剂学与药物动力学","type":"多选","chapter":"1. 生物药剂学概论","number":"sw-0010","title":"药物效应包括","options":{"A":"生理变化","B":"治疗效果","C":"副作用","D":"毒性","E":"情绪变化"},"answer":"BCD","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616076},{"id":"tr-1406","course":"生物药剂学与药物动力学","type":"多选","chapter":"1. 生物药剂学概论","number":"sw-0011","title":"仿制药一致性评价应包括","options":{"A":"参比制剂的选择","B":"体外多介质溶出曲线相似性(f2因子)","C":"体内生物等效性试验(AUC、Cmax,90%CI 80%~125%)","D":"杂质谱与基因毒性杂质研究","E":""},"answer":"ABCD","answerText":"","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 10:28 [35:02]〕｜非真题原题·据课堂整理","addedAt":1781947616076},{"id":"tr-1407","course":"生物药剂学与药物动力学","type":"多选","chapter":"1. 生物药剂学概论","number":"sw-0012","title":"影响药物吸收的剂型因素有","options":{"A":"药物油水分配系数","B":"药物粒度大小","C":"药物晶型","D":"药物溶出度","E":"药物制剂的处方组成"},"answer":"ABCDE","answerText":"","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616076},{"id":"tr-1408","course":"生物药剂学与药物动力学","type":"多选","chapter":"1. 生物药剂学概论","number":"sw-0013","title":"下列关于药物代谢与剂型设计的论述正确的是","options":{"A":"药酶有一定的数量，因此可利用给予大剂量药物先使酶饱和，从而达到提高生物利用度的目的","B":"药物代谢的目的是使原形药物灭活，并从体内排出","C":"老人药物代谢速度减慢，因此服用与正常人相同的剂量，易引起不良反应和毒性","D":"盐酸苄丝肼为脱羧酶抑制剂，与左旋多巴组成复方，可抑制外周的左旋多巴的代谢，增加入脑量","E":""},"answer":"ACD","answerText":"","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616076},{"id":"tr-1409","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"1. 生物药剂学概论","number":"sw-0014","title":"生物药剂学的研究工作主要涉及哪些内容","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"研究药物的理化性质对药物体内转运行为的影响;研究剂型、制剂处方和制剂工艺对药物体内过程的影响;根据机体的生理功能设计缓控释制剂;研究微粒给药系统在血液循环中的命运;研究新的给药途径与给药方法;研究中药制剂的溶出度和生物利用度;研究生物药剂学的试验方法","mnemonic":"了解｜习题集","addedAt":1781947616076},{"id":"tr-1410","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"1. 生物药剂学概论","number":"sw-0015","title":"简述生物药剂学研究在新药开发中的应用","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"在新药的合成和筛选中考虑药物体内的转运和转化因素;在新药安全性评价中,药动学为毒性试验设计提供依据;在新药制剂研究中评价剂型设计合理性;在新药临床前及I期临床试验中进行生物药剂学与药动学评价;药品上市后变更仍需生物药剂学评估。 ---","mnemonic":"了解｜习题集","addedAt":1781947616076},{"id":"tr-1411","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"1. 生物药剂学概论","number":"sw-0016","title":"单纯扩散和促进扩散的异同点","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"相同点:both顺浓度梯度(高→低)、不耗能(被动转运)、不需ATP。不同点:1单纯扩散不需载体,无饱和现象、无竞争抑制、无结构特异性;2促进扩散需特异性载体,有饱和现象、有竞争抑制、有结构与部位特异性,转运速率远高于单纯扩散。","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","addedAt":1781947616076},{"id":"tr-1412","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"1. 生物药剂学概论","number":"sw-0017","title":"主动转运的特点","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"1逆浓度梯度(低→高)转运;2需要消耗能量(ATP);3需要特异性载体;4有饱和现象;5有结构特异性和部位特异性;6有竞争性抑制现象;7受代谢抑制剂影响。","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","addedAt":1781947616076},{"id":"tr-1413","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"1. 生物药剂学概论","number":"sw-0018","title":"【简答】易化扩散、主动转运与膜动转运对比","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"易化扩散、主动转运与膜动转运对比(必考):①易化扩散——载体帮助下顺浓度梯度扩散、不耗能,但需载体蛋白故有结构特异性+饱和现象+竞争抑制+部位特异性,比单纯扩散快(小肠/血脑屏障的D-葡萄糖、氨基酸、季铵盐)②主动转运——逆浓度梯度、消耗ATP、需载体蛋白,速率 dC/dt=Vm·C/(Km+C),受代谢抑制剂(氰化物)影响,存在竞争性抑制(葡萄糖与半乳糖)与部位特异性(K+/Na+/I-/单糖/氨基酸/水溶性维生素)③膜动转运——胞饮(溶解物/液体)、吞噬(颗粒物如细菌)、胞吐(逆向如胰岛素分泌)。\n\n〔老师强调/扣分点〕笔记★★★★高频对比题。易化扩散(顺浓度不耗能但需载体)vs主动转运(逆浓度耗ATP)、膜动转运胞饮/吞噬/胞吐分类是核心辨析(注:笔记'载体'OCR为'甾体')。","mnemonic":"🔴必考·速通补充｜〔来源:课堂考点情报 col9: ★历年考过 ｜ 主动转运特点—问答题(真题问答1)+胞饮选择题〕｜参考答案据课堂/教材整理","addedAt":1781947616077},{"id":"tr-1414","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"1. 生物药剂学概论","number":"sw-0019","title":"已知某药物普通口服固体剂型生物利用度只有5%，与食物同服生物利用度可提高近一倍。试分析影响该药物口服生物利用度的因素可能有哪些，拟采用哪些方法改善之。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"①影响该药物口服生物利用度的因素有很多，药物本身生物利用度低可能是由于药物的吸收差或受到胃肠分泌的影响。与食物同服，可促进胃排空速率加快，药物进入小肠，在肠内停留时间延长；脂肪类食物可促进胆汁分泌，而胆汁可促进难溶性药物溶解吸收。剂型因素也有很大影响，药用辅料的性质与药物相互作用均影响其生物利用度。②提高药物的生物利用度可将难溶性药物制成可溶性盐、无定型药物或加入表面活性剂；改变剂型增大药物表面积；制成复方制剂或改变剂量促使酶代谢饱和等；制成前体药物等。","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1415","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"1. 生物药剂学概论","number":"sw-0020","title":"剂型因素与生物因素各包括哪些方面？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"剂型因素：剂型种类、药物的某些化学性质、药物的某些物理性质、制剂处方、配伍药物在处方及体内的相互作用，以及制备工艺、贮存条件和给药方法等。生物因素：种属差异、种族差异、性别差异、年龄差异、生理和病理条件的差异及遗传因素等","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1416","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"1. 生物药剂学概论","number":"sw-0021","title":"简述生物药剂学的研究目的，请举例说明。生物药剂学的目的：是为了正确评价药物制剂质量、设计合理的剂型及制剂工艺、指导合理临","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"床用药提供科学依据，以确保用药的安全与有效。","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1417","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"1. 生物药剂学概论","number":"sw-0022","title":"\"药物化学结构唯一决定药物疗效\"的观点正确吗？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"请分析原因。不正确。因为随着生物药剂学的产生和发展，人们越来越清醒地认识到，药物在一定中所产生的效应除了与药物本身的化学结构有关外，还受到剂型因素与生物因素的影响，甚至在某种情况下，这种影响对药物疗效的发挥起着至关重要的作用。所以\"药物化学结构唯一决定药物疗效\"的观点不正确。药物的吸收","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1418","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"1. 生物药剂学概论","number":"sw-0023","title":"简述影响药物代谢的因素。（1）生理因素对药物代谢的影响：种属差异、个体差异（年龄、性别、病理状态）、遗传变异性、P-糖蛋","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"白（2）非生理因素对药物代谢的影响：药物的理化性质、给药途径与剂型、给药剂量、酶诱导和抑制作用、药物的相互作用第五章 药物排泄","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1419","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"1. 生物药剂学概论","number":"sw-0024","title":"简述设计靶向给药系统的目的及基本原理。（1）目的：使药物具有药理活性的专一性，增加药物对靶组织的指向性和滞留性，降低药物","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"对正常细胞的毒副作用，减少剂量，提高药物制剂的生物利用度。（2）基本原理：是载体将药物通过局部给药和全身血液循环而选择性的使药物浓集于靶器官、靶组织、靶细胞且疗效高、毒副作用小。","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1420","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"1. 生物药剂学概论","number":"sw-0025","title":"如何根据药物的代谢特性进行制剂设计？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"口服后的首过效应明显而生物利用度低且不稳定——改变给药途径或设计特殊口服制剂","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1421","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"1. 生物药剂学概论","number":"sw-0026","title":"简述淋巴系统转运的特点。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"①避免肝的首过效应②特定物质的转运③给药途径不同，药物的淋巴转运的方式不同④药物转运的单向流动性","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1422","course":"生物药剂学与药物动力学","type":"选择","chapter":"1. 生物药剂学概论","number":"sw-0027","title":"以下关于药物剂型因素的描述,正确的是","options":{"A":"是指片剂、胶囊剂、丸剂和溶液剂等药物的不同剂型","B":"是指剂型和给药方案","C":"是指给药途径和给药频率","D":"不仅指片剂、胶囊剂、注射剂等药剂中的剂型概念,而且广义地包括与剂型有关的各种因素","E":""},"answer":"D","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1423","course":"生物药剂学与药物动力学","type":"选择","chapter":"1. 生物药剂学概论","number":"sw-0028","title":"以下关于生物药剂学的描述,错误的是","options":{"A":"研究药物及剂型在体内的吸收、分布、代谢与排泄过程","B":"药物动力学为生物药剂学提供了理论基础和研究手段","C":"改善难溶性药物的溶出速率是生物药剂学的主要任务之一","D":"从药物生物利用度的高低就能判断药物制剂体内是否有效","E":""},"answer":"D","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1424","course":"生物药剂学与药物动力学","type":"选择","chapter":"1. 生物药剂学概论","number":"sw-0029","title":"以下关于生物药剂学的描述，正确的是","options":{"A":"剂型因素是指片剂、胶囊剂、丸剂和溶液剂等药物的不同剂型","B":"药物产品所产生的疗效主要与药物本身的化学结构有关","C":"药物效应包括药物的疗效、副作用和毒性","D":"改善难溶性药物的溶出速率主要是药剂学的研究内容","E":""},"answer":"C","answerText":"","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1425","course":"生物药剂学与药物动力学","type":"选择","chapter":"1. 生物药剂学概论","number":"sw-0030","title":"对生物膜结构的性质描述错误的是","options":{"A":"流动性","B":"不对称性","C":"饱和性","D":"半透性","E":"不稳定性"},"answer":"C","answerText":"","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1426","course":"生物药剂学与药物动力学","type":"选择","chapter":"1. 生物药剂学概论","number":"sw-0031","title":"K+、单糖、氨基酸等生命必需物质通过生物膜的转运方式是","options":{"A":"被动扩散","B":"膜孔转运","C":"主动转运","D":"促进扩散","E":"膜动转运"},"answer":"C","answerText":"","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1427","course":"生物药剂学与药物动力学","type":"选择","chapter":"1. 生物药剂学概论","number":"sw-0032","title":"膜孔转运有利于( )药物的吸收","options":{"A":"脂溶性大分子","B":"水溶性小分子","C":"水溶性大分子","D":" m/Km)·C,表现为一级(线性)动力学;当C≫Km时,−dC/dt≈Vm,表现为零级动力学(恒量消除)。非线性消除时半衰期、AUC随剂量增大而非比例改变。","mnemonic":"重要｜生物药剂-DY｜[154,155,156,162]","addedAt":1781947616077},{"id":"tr-1439","course":"生物药剂学与药物动力学","type":"选择","chapter":"11. 非线性药物动力学","number":"sw-0044","title":"非线性动力学特点是","options":{"A":"t1/2与剂量无关","B":"AUC与剂量成正比","C":"t1/2随剂量增加而延长","D":"消除速率常数恒定","E":""},"answer":"C","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1440","course":"生物药剂学与药物动力学","type":"选择","chapter":"11. 非线性药物动力学","number":"sw-0045","title":"非线性动力学可用以下方程描述","options":{"A":"一级动力学","B":"零级动力学","C":"米氏方程","D":"对数方程","E":""},"answer":"C","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1441","course":"生物药剂学与药物动力学","type":"选择","chapter":"11. 非线性药物动力学","number":"sw-0046","title":"出现非线性的主要原因是","options":{"A":"吸收饱和","B":"血浆蛋白结合饱和","C":"代谢酶或转运体饱和","D":"组织结合饱和","E":""},"answer":"C","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1442","course":"生物药剂学与药物动力学","type":"多选","chapter":"12. 统计矩分析","number":"sw-0047","title":"提高药物经角膜吸收的措施有","options":{"A":"增加滴眼液浓度，提高局部滞留时间","B":"减少给药体积，减少药物损失","C":"弱碱性药物调节pH至","D":"","E":""},"answer":"AB","answerText":"","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1443","course":"生物药剂学与药物动力学","type":"选择","chapter":"12. 统计矩分析","number":"sw-0048","title":"统计矩中,平均滞留时间MRT为","options":{"A":"一阶原点矩","B":"一阶中心矩","C":"二阶原点矩","D":"二阶中心矩","E":""},"answer":"A","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1444","course":"生物药剂学与药物动力学","type":"选择","chapter":"12. 统计矩分析","number":"sw-0049","title":"静脉注射MRT与t1/2关系为","options":{"A":"MRT=1.44t1/2","B":"MRT=0.693t1/2","C":"MRT=2t1/2","D":"MRT=t1/2","E":""},"answer":"A","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1445","course":"生物药剂学与药物动力学","type":"选择","chapter":"12. 统计矩分析","number":"sw-0050","title":"统计矩方法适用于","options":{"A":"线性动力学","B":"非线性动力学","C":"均适用","D":"仅隔室模型","E":""},"answer":"A","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1446","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"13. 药物动力学在临床药学中的应用","number":"sw-0051","title":"临床治疗药物监测TDM的目的及适用范围","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"目的:通过测定血药浓度,据药动学原理调整给药方案,实现个体化给药,提高疗效、避免毒性。适用:1治疗指数窄(地高辛/茶碱/锂盐);2具非线性动力学(苯妥英钠);3肝肾功能不全;4合并用药致相互作用;5中毒症状与疾病难区分;6需长期用药者。","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","addedAt":1781947616077},{"id":"tr-1447","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"13. 药物动力学在临床药学中的应用","number":"sw-0052","title":"需要进行治疗药物监测(TDM)的药物有哪些(八类)?","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"①治疗指数低、治疗窗窄、安全范围小的药;②具非线性药动学特征的药;③个体差异大、难以用剂量预测血药浓度的药;④治疗作用与毒性反应相似、不易区分的药(如地高辛);⑤合并用药易发生相互作用时;⑥长期用药需维持有效浓度者;⑦抗生素(部分);⑧肿瘤化疗药。(确切八类清单以课本/PPT为准)","mnemonic":"🆕课堂强调·补充｜〔2026-03-25 10:28 [14:41、15:46]〕｜非真题原题·据课堂整理","addedAt":1781947616077},{"id":"tr-1448","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"13. 药物动力学在临床药学中的应用","number":"sw-0053","title":"为什么肝肾功能不全者使用某些药物时要适当调整给药方案？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"因为肝肾功能不全者，对药物的消除能力低，有可能造成某些药物在体内蓄积，产生毒副作用，所以肝肾功能不全者使用某些药物时要适当调整给药方案","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1449","course":"生物药剂学与药物动力学","type":"选择","chapter":"13. 药物动力学在临床药学中的应用","number":"sw-0054","title":"治疗药物监测的目的是","options":{"A":"提高疗效","B":"降低毒性","C":"个体化给药","D":"以上都是","E":""},"answer":"D","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1450","course":"生物药剂学与药物动力学","type":"选择","chapter":"13. 药物动力学在临床药学中的应用","number":"sw-0055","title":"给药方案调整的主要依据是","options":{"A":"年龄","B":"体重","C":"血药浓度","D":"性别","E":""},"answer":"C","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1451","course":"生物药剂学与药物动力学","type":"选择","chapter":"13. 药物动力学在临床药学中的应用","number":"sw-0056","title":"肾功能不全患者,主要经肾排泄药物应","options":{"A":"加量","B":"减量或延长间隔","C":"不变","D":"缩短间隔","E":""},"answer":"B","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1452","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"14. 药物动力学在新药研究中的应用","number":"sw-0057","title":"生物等效性","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"指一种药物的不同制剂在相同试验条件下,以相同剂量给药,其吸收程度和速度(由AUC、Cmax、Tmax表征)无统计学显著差异。","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","addedAt":1781947616077},{"id":"tr-1453","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"14. 药物动力学在新药研究中的应用","number":"sw-0058","title":"生物利用度","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"指药物经血管外给药后被吸收进入体循环的相对量(F=吸收量/给药量)和速度,分绝对生物利用度和相对生物利用度。","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","addedAt":1781947616077},{"id":"tr-1454","course":"生物药剂学与药物动力学","type":"选择","chapter":"14. 药物动力学在新药研究中的应用","number":"sw-0059","title":"新药临床前药动学研究不包括","options":{"A":"动物单次给药","B":"动物多次给药","C":"人体I期临床","D":"组织分布","E":""},"answer":"C","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1455","course":"生物药剂学与药物动力学","type":"选择","chapter":"14. 药物动力学在新药研究中的应用","number":"sw-0060","title":"生物利用度评价的主要参数是","options":{"A":"Cmax、Tmax、AUC","B":"t1/2、V、Cl","C":"k、ka、α","D":"MRT、VRT","E":""},"answer":"A","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1456","course":"生物药剂学与药物动力学","type":"选择","chapter":"14. 药物动力学在新药研究中的应用","number":"sw-0061","title":"生物等效性判定标准是","options":{"A":"90%置信区间在80%~125%","B":"95%置信区间在70%~130%","C":"P<0.05","D":"方差分析P>0.05","E":""},"answer":"A","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1457","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"15. 药物动力学研究进展","number":"sw-0062","title":"生理药动学（PBPK）","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"以机体解剖、生理、生化特征为基础,按血流将各组织器官(房室)连接,定量描述药物体内过程的模型。","mnemonic":"🆕课堂强调·补充｜〔2026-04-01 10:28 [06:19、13:34]〕｜非真题原题·据课堂整理","addedAt":1781947616077},{"id":"tr-1458","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"15. 药物动力学研究进展","number":"sw-0063","title":"时辰药动学","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"研究药物体内过程(ADME)随时间呈节律性变化规律的学科(如降压药白天剂量大、夜间小)。","mnemonic":"🆕课堂强调·补充｜〔2026-04-01 09:38 [38:05]〕｜非真题原题·据课堂整理","addedAt":1781947616077},{"id":"tr-1459","course":"生物药剂学与药物动力学","type":"选择","chapter":"15. 药物动力学研究进展","number":"sw-0064","title":"药物动力学研究的核心是","options":{"A":"药效观测","B":"毒性观测","C":"体内药物浓度测定","D":"体外溶出测定","E":""},"answer":"C","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1460","course":"生物药剂学与药物动力学","type":"选择","chapter":"15. 药物动力学研究进展","number":"sw-0065","title":"生物样品分析首选方法是","options":{"A":"UV","B":"荧光法","C":"HPLC","D":"LC-MS/MS","E":""},"answer":"D","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1461","course":"生物药剂学与药物动力学","type":"选择","chapter":"15. 药物动力学研究进展","number":"sw-0066","title":"药动学数据处理常用软件是","options":{"A":"Excel","B":"Word","C":"DAS、WinNonlin","D":"Photoshop","E":""},"answer":"C","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1462","course":"生物药剂学与药物动力学","type":"判断","chapter":"2. 口服药物的吸收","number":"sw-0067","title":"注射给药药物直接进入血液循环，没有吸收过程。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1463","course":"生物药剂学与药物动力学","type":"判断","chapter":"2. 口服药物的吸收","number":"sw-0068","title":"药物经直肠给药可以完全避开肝首过效应。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1464","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物的吸收","number":"sw-0069","title":"首过效应","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"口服药物在胃肠道吸收经门静脉进入肝脏,在到达体循环前被肠壁和肝脏代谢,使进入体循环的原型药量减少的现象(又称第一关卡效应)。","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","addedAt":1781947616077},{"id":"tr-1465","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物的吸收","number":"sw-0070","title":"跨细胞途径转运","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是指一些脂溶性药物借助细胞膜的脂溶性,或者特殊转运机制的药物借助膜蛋白的作用,或者大分子和颗粒状物质借助特殊细胞的作用等,而穿过细胞膜的转运途径","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1466","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物的吸收","number":"sw-0071","title":"被动转运","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是指不需要消耗能量,生物膜两侧的药物由高浓度侧向低浓度侧(顺浓度梯度)转运的过程。分为单纯扩散和促进扩散两种形式","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1467","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物的吸收","number":"sw-0072","title":"溶出速率","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是指在一定溶出条件下,单位时间药物溶解的量","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1468","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物的吸收","number":"sw-0073","title":"载体媒介转运","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"借助生物膜上载体蛋白的作用,使药物透过生物膜的转运过程。分为促进扩散和主动转运两种形式","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1469","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物的吸收","number":"sw-0074","title":"促进扩散","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是指某些药物在细胞膜上转运体的帮助下,由高浓度侧向低浓度侧跨细胞膜转运的过程","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1470","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物的吸收","number":"sw-0075","title":"ATP驱动泵","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是指以ATP水解释放的能量为直接能源进行主动转运的载体蛋白家族","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1471","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物的吸收","number":"sw-0076","title":"多药耐药","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是指外排转运体对抗肿瘤药物的外排作用导致肿瘤细胞内药量减少、对肿瘤细胞杀伤作用大大下降的现象","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1472","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物的吸收","number":"sw-0077","title":"生物药剂学分类系统(BCS)","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"根据药物体外溶解性和肠道渗透性高低对药物分类的科学方法。分四类:I高溶高渗、II低溶高渗、III高溶低渗、IV低溶低渗","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1473","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物的吸收","number":"sw-0078","title":"药物外排转运体","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"直接依赖ATP分解释能,逆浓度梯度将底物泵出细胞的转运体,如P-gp、MRP、BCRP等","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1474","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物的吸收","number":"sw-0079","title":"多晶型","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"化学结构相同的药物,因结晶条件不同形成数种晶格排列不同的晶型。 ---","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1475","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物的吸收","number":"sw-0080","title":"吸收","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是指药物从用药部位进入体循环的过程","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1476","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物的吸收","number":"sw-0081","title":"胃空速率","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"单位时间内胃内容物的排出量","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1477","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物的吸收","number":"sw-0082","title":"溶出速度","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"是指固体药物制剂中有效成分在特定的溶解介质中的溶解速度和程度","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1478","course":"生物药剂学与药物动力学","type":"名词解释记忆","chapter":"2. 口服药物的吸收","number":"sw-0083","title":"pH-分配学说","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"名词解释","answerText":"药物的吸收取决于药物在胃肠道中的解离状态和油/水分配系数","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1479","course":"生物药剂学与药物动力学","type":"填空记忆","chapter":"2. 口服药物的吸收","number":"sw-0084","title":"体外评价药物经皮吸收速率可采用______或______扩散池。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"填空题","answerText":"单室，双室","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1480","course":"生物药剂学与药物动力学", 肠道的滞留时间"},"answer":"ABDE","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1487","course":"生物药剂学与药物动力学","type":"多选","chapter":"2. 口服药物的吸收","number":"sw-0092","title":"Caco-2细胞限制药物吸收物理屏障有","options":{"A":"不流动水层","B":"细胞连接","C":"P-糖蛋白","D":"细胞膜","E":"碱性磷酸酶"},"answer":"ABD","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1488","course":"生物药剂学与药物动力学","type":"多选","chapter":"2. 口服药物的吸收","number":"sw-0093","title":"以下选项中属于影响胃肠道吸收的药物因素的有","options":{"A":"药物在胃肠道中的稳定性","B":"药物粒度","C":"溶解度","D":"解离常数","E":"溶出度"},"answer":"ABCD","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1489","course":"生物药剂学与药物动力学","type":"多选","chapter":"2. 口服药物的吸收","number":"sw-0094","title":"口服固体制剂申请生物豁免需满足条件有","options":{"A":"速释型口服固体制剂","B":"药物具有高渗透性","C":"药物在pH1~7.5范围内具有高溶解性","D":"辅料的种类与用量符合FDA的规定","E":"药物具有较宽的治疗窗"},"answer":"ABCDE","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1490","course":"生物药剂学与药物动力学","type":"多选","chapter":"2. 口服药物的吸收","number":"sw-0095","title":"研究口服药物吸收的体外方法有","options":{"A":"组织流动室法","B":"外翻肠囊法","C":"外翻环法","D":"肠道灌流法","E":"肠襻法"},"answer":"ABC","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1491","course":"生物药剂学与药物动力学","type":"多选","chapter":"2. 口服药物的吸收","number":"sw-0096","title":"下列一般不利于药物吸收的因素有","options":{"A":"不流动水层","B":"P-gp外排作用","C":"胃排空速率增加","D":"加适量的表面活性剂","E":"溶媒牵引效应"},"answer":"AB","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1492","course":"生物药剂学与药物动力学","type":"多选","chapter":"2. 口服药物的吸收","number":"sw-0097","title":"被动扩散的特征有","options":{"A":"不消耗能量","B":"有结构和部位专属性","C":"有饱和现象","D":"借助载体进行转运","E":"由高浓度向低浓度转运"},"answer":"AE","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1493","course":"生物药剂学与药物动力学","type":"多选","chapter":"2. 口服药物的吸收","number":"sw-0098","title":"Caco-2细胞模型主要应用于","options":{"A":"研究药物结构与吸收转运的关系","B":"快速评价前体药物的口服吸收","C":"研究口服药物的吸收转运机制","D":"确定药物在肠腔吸收的最适pH","E":"研究辅料以及剂型对吸收的影响作用"},"answer":"ABCDE","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1494","course":"生物药剂学与药物动力学","type":"多选","chapter":"2. 口服药物的吸收","number":"sw-0099","title":"协同转运发生时需要的重要条件有","options":{"A":"浓度梯度","B":"结构特异性","C":"部位特异性","D":"载体亲和力的构象差异","E":"能量"},"answer":"AD","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1495","course":"生物药剂学与药物动力学","type":"多选","chapter":"2. 口服药物的吸收","number":"sw-0100","title":"关于转运体的叙述正确的有","options":{"A":"ABC转运体有ATP结合域,而SLC转运体无ATP结合域","B":"ABC转运体是主动转运体,而SLC转运体是易化转运体","C":"ABC转运体属于原发性主动转运体,SLC转运体属于继发性主动转运体","D":"转运体转运物质的动力学曲线具有非线性特征","E":"转运体属于外在蛋白,包括细胞表面受体、表面抗原和载体蛋白"},"answer":"AD","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1496","course":"生物药剂学与药物动力学","type":"多选","chapter":"2. 口服药物的吸收","number":"sw-0101","title":"改善药物跨细胞途径吸收的机制有","options":{"A":"改变黏液的流变学性质","B":"提高膜的流动性","C":"膜成分的溶解作用","D":"溶解拖动能力的增加","E":"与膜蛋白的相互作用"},"answer":"ABCE","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1497","course":"生物药剂学与药物动力学","type":"多选","chapter":"2. 口服药物的吸收","number":"sw-0102","title":"口服固体制剂申请生物学试验豁免需满足以下哪些条件","options":{"A":"为速释型口服固体制剂","B":"主药具有低渗透性","C":"制剂中的主药必须在pH1～","D":"","E":""},"answer":"ACDE","answerText":"","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1498","course":"生物药剂学与药物动力学","type":"多选","chapter":"2. 口服药物的吸收","number":"sw-0103","title":"影响胃排空速度的因素有","options":{"A":"药物的多晶型","B":"食物的组成","C":"胃内容物的体积","D":"胃内容物的黏庋","E":"药物的脂溶性"},"answer":"BCD","answerText":"","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1499","course":"生物药剂学与药物动力学","type":"多选","chapter":"2. 口服药物的吸收","number":"sw-0104","title":"影响药物吸收的理化因素有","options":{"A":"解离度","B":"脂溶性","C":"溶出速度","D":"稳定性","E":"晶型"},"answer":"ABCDE","answerText":"","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1500","course":"生物药剂学与药物动力学","type":"多选","chapter":"2. 口服药物的吸收","number":"sw-0105","title":"影响肺部药物吸收的因素有","options":{"A":"药物粒子在气道内的沉积过程","B":"生理因素","C":"药物的理化性质","D":"制剂因素","E":""},"answer":"ABCD","answerText":"","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1501","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 口服药物的吸收","number":"sw-0106","title":"简述促进扩散的特点,并与单纯扩散比较异同","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"同:均顺浓度梯度、不耗能。异:促进扩散有载体参与、速率快、有选择性、饱和性、部位特异性、竞争性抑制;单纯扩散无载体、无饱和、无竞争、无选择性","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1502","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 口服药物的吸收","number":"sw-0107","title":"简述主动转运的分类及特点","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"分原发性(ATP驱动泵)、继发性(协同转运)。特点:逆浓度梯度、耗能、需载体、饱和、竞争抑制、部位特异、受代谢抑制剂影响","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1503","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 口服药物的吸收","number":"sw-0108","title":"简述生理因素对药物吸收的影响","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"胃肠液pH;胃排空速率;肠内运行;食物;胃肠道代谢;胃肠血流;肝首过效应;肠肝循环;淋巴系统;疾病","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1504","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 口服药物的吸收","number":"sw-0109","title":"某药生物利用度仅5%,与食物同服翻倍,分析原因并提出改善措施","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"原因:溶解度低、渗透性差、存在部位特异性吸收、受胃肠环境影响。措施:制成可溶性盐、无定型、包合物、固体分散体;加吸收促进剂;延长胃肠滞留时间;抑制外排与代谢","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1505","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 口服药物的吸收","number":"sw-0110","title":"药物溶出速率对吸收有何意义?影响因素","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"溶出是难溶性药物吸收限速过程,决定起效快慢与药效强弱。影响因素:溶解度、粒子大小、多晶型、溶剂化物、溶出条件","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1506","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 口服药物的吸收","number":"sw-0111","title":"影响II类药物吸收的理化因素及改善方法","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"因素:溶解度、晶型、溶媒化物、粒径。方法:制成可溶性盐、适宜晶型、加表面活性剂、包合、微粉化、延长滞留、抑制外排与代谢。 ---","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1507","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 口服药物的吸收","number":"sw-0112","title":"简述BCS生物药剂学分类系统","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"BCS(生物药剂学分类系统)按药物的溶解度和肠壁渗透性分为四类:I类高溶解度高渗透性(吸收好,体内外相关性可能);II类低溶解度高渗透性(溶出为限速,可建立体内外相关);III类高溶解度低渗透性(渗透为限速);IV类低溶解度低渗透性(吸收差,问题最多)。","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","addedAt":1781947616077},{"id":"tr-1508","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 口服药物的吸收","number":"sw-0113","title":"促进药物口服吸收的方法","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"1增加药物溶出:减小粒径、制成无定型/盐/前药、固体分散体、包合物;2加入吸收促进剂;3制成微粒给药系统(微乳/脂质体/纳米粒);4抑制外排(P-gp抑制剂);5改善胃肠道滞留时间;6结构修饰提高脂溶性/渗透性。","mnemonic":"必背｜doubao历年｜历年高频考点·答案据教材整理","addedAt":1781947616077},{"id":"tr-1509","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 口服药物的吸收","number":"sw-0114","title":"影响型药物口服吸收的理化因素有哪些？如何改善该类药物的口服生物利用度？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"类药物是低溶解性／高渗透性的一类药物，因药物在胃肠道溶出缓慢而限制了药物的吸收。影响类药物吸收的理化因素有药物的溶解度、晶型、溶媒化物、粒子大小等。增加药物的溶解度和（或）加快药物的溶出速率均可有效地提高该类药物的口服吸收，主要方法有：①制成可溶性盐类；②选择合适的晶型和溶媒化物；③加入适量表面活性剂；④用亲水性包合材料制成包合物；⑤增加药物的表面积；⑥增加药物在胃肠道内的滞目时间；⑦抑制外排转运及药物肠壁代谢。","mnemonic":"重要｜生物药剂学-DY.doc","addedAt":1781947616077},{"id":"tr-1510","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 口服药物的吸收","number":"sw-0115","title":"大剂量顿服维生素B2、B6能否相应提高疗效？","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"简述其原因及正确的服用方法。不能。因为维生素B2、B6是水溶性的，不能在体内储存，一次大剂量顿服维生素B2、B6只有其中的一小部分被吸收，其余的排出体外。所以大剂量顿服维生素B2、B6不能相应提高疗效，反而是浪费。服用方法：维生素B6片，常规服法是，每次20毫克，每天3次；维生素B2片，口服，成人，一次1片，每次5mg，一日3次。饭后服用。为什么小肠是药物吸收的主要部位？①小肠是人体内最长的消化器官，全长达5-7米，为食物的充分消化提供了场所；②小肠粘膜形成许多环形皱褶和大量绒毛突入肠腔，每条绒毛的表面是一层柱状上皮细胞，柱状上皮细胞顶端的细胞膜又形成许多细小的突起，称微绒毛。小肠黏膜上的环状皱襞、小肠绒毛和每个小肠绒毛细胞游离面上的1000～3000根微绒毛，使小肠粘膜的表面积增加600倍，达到200平方米左右。小肠的巨大吸收面积有利于提高吸收效率；③小肠的内壁存在着多种消化腺细胞群，可","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1511","course":"生物药剂学与药物动力学","type":"简答记忆","chapter":"2. 口服药物的吸收","number":"sw-0116","title":"简述设计口服控释给药系统的目的及思路。目的：减少给药次数，避免夜间给药，增加病人用药的顺应性；血药浓度平稳，避免“峰谷”","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"简答题","answerText":"现象避免某些药物对胃肠道的刺激，有利于降低药物的毒副作用；增加药物治疗的稳定性；可减少用药总量，因此，可用最小剂量即可达到最大药效。思路：药物的选择（根据临床应用选择药物、根据药物理化特性和药动学特性选择药物）、给药间隔时间选择、剂量设计，安全性。","mnemonic":"重要｜生物药剂学和药物动力学(必须版).doc","addedAt":1781947616077},{"id":"tr-1512","course":"生物药剂学与药物动力学","type":"选择","chapter":"2. 口服药物的吸收","number":"sw-0117","title":"关于生物膜性质的描述错误的是","options":{"A":"流动性","B":"不对称性","C":"结晶性","D":"选择透过性","E":""},"answer":"C","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1513","course":"生物药剂学与药物动力学","type":"选择","chapter":"2. 口服药物的吸收","number":"sw-0118","title":"SGLT1转运葡萄糖通过生物膜的机制是","options":{"A":"膜孔转运","B":"单纯扩散","C":"促进扩散","D":"主动转运","E":""},"answer":"D","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1514","course":"生物药剂学与药物动力学","type":"选择","chapter":"2. 口服药物的吸收","number":"sw-0119","title":"红霉素的生物有效性可因下述哪种因素而明显增加","options":{"A":"缓释片","B":"肠溶衣","C":"薄膜包衣片","D":"增加药物粒度","E":""},"answer":"B","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1515","course":"生物药剂学与药物动力学","type":"选择","chapter":"2. 口服药物的吸收","number":"sw-0120","title":"下列哪项不属于药物外排转运体","options":{"A":"多药耐药蛋白","B":"多药耐药相关蛋白","C":"乳腺癌耐药蛋白","D":"胆酸转运体","E":""},"answer":"D","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1516","course":"生物药剂学与药物动力学","type":"选择","chapter":"2. 口服药物的吸收","number":"sw-0121","title":"以下哪条不是主动转运的特点","options":{"A":"逆浓度梯度","B":"无部位特异性","C":"需要能量","D":"需要载体参与","E":""},"answer":"B","answerText":"","mnemonic":"必背｜习题集","addedAt":1781947616077},{"id":"tr-1517","course":"生物药剂学与药物动力学","type":"选择","chapter":"2. 口服药物的吸收","number":"sw-0122","title":"胞饮作用的特点是","options":{"A":"有部位特异性","B":"需要载体","C":"不需要能量","D":"逆浓度梯度转运","E":""},"answer":"A","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1518","course":"生物药剂学与药物动力学","type":"选择","chapter":"2. 口服药物的吸收","number":"sw-0123","title":"下列哪种药物不是P-gp的底物","options":{"A":"环孢素A","B": -1560","course":"生物药剂学与药物动力学","type":"选择","chapter":"2. 口服药物的吸收","number":"sw-0165","title":"弱碱性药物奎宁的pKa=8.4，在小肠中(pH=7.0)解离型和未解离型的比为","options":{"A":"1","B":"25/1","C":"1/25","D":"14/1","E":"无法计算"},"answer":"B","answerText":"解离型:未解离型 = 25:1(约25/1)。弱碱性药物按Henderson-Hasselbalch:pKa−pH = lg([解离型]/[未解离型]),8.4−7.0=1.4,故比值=10^1.4≈25,即解离型/未解离型≈25/1。 【注:清单选项中对应「25/1」(部分答案B)。各校试卷原题选项A=25/1。】","mnemonic":"重要｜生物药剂-DY｜[133,134,139,142]","addedAt":1781947616077},{"id":"tr-1561","course":"生物药剂学与药物动力学","type":"判断","chapter":"3. 非口服给药途径","number":"sw-0166","title":"皮肤的水化对脂溶性药物的促渗作用较水溶性药物显著。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1562","course":"生物药剂学与药物动力学","type":"判断","chapter":"3. 非口服给药途径","number":"sw-0167","title":"栓剂引入直肠的深度越大,栓剂中药物不经肝脏的量亦越多。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1563","course":"生物药剂学与药物动力学","type":"判断","chapter":"3. 非口服给药途径","number":"sw-0168","title":"脂溶性较强的药物易通过生物膜吸收,但较易跨角膜吸收的药物必须兼具脂溶性和水溶性。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1564","course":"生物药剂学与药物动力学","type":"判断","chapter":"3. 非口服给药途径","number":"sw-0169","title":"吸入气雾剂微粒的粒径越小,越容易被吸收进入血液循环发挥全身治疗作用。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"错","answerText":"","mnemonic":"重要｜习题集","addedAt":1781947616077},{"id":"tr-1565","course":"生物药剂学与药物动力学","type":"判断","chapter":"3. 非口服给药途径","number":"sw-0170","title":"舌下给药的主要缺点是易受唾液冲洗作用影响,保留时间短。","options":{"A":"对","B":"错","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"了解｜习题集","addedAt":1781947616077},{"id":"tr-1566","course":"生物药剂学与药物动力学","type":"判断","chapter":"3. 非口服给药途径","number":"sw-0171","title":"药物经口腔黏膜吸收，通过黏膜下毛细血管汇总至颈内静脉，不经肝脏而直接进入心脏，可避开肝首过效应。","options":{"A":"","B":"","C":"","D":"","E":""},"answer":"对","answerText":"","mnemonic":"重要｜生物药剂学-DY.doc","a
