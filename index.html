        function StudySession({ 
            question, total, current, onNext, onPrev, onAnswer, onSubmitMulti, showAnswer, 
            selectedOption, selectedMultiOptions, isWrong, toggleWrong,
            globalShuffleOptions, globalShuffleQuestions, onToggleOptionShuffle, onToggleQuestionShuffle,
            studyMode
        }) {
            const touchStartX = useRef(null);
            const touchEndX = useRef(null);
            const minSwipeDistance = 50;
            const [showSettings, setShowSettings] = useState(false);

            const isMulti = question.type && (question.type.includes('多') || question.type.includes('Multi'));
            const isRecall = !!question.isRecall;

            const displayOptions = useMemo(() => {
                let opts = Object.entries(question.options).filter(([key, text]) => text).map(([key, text]) => ({ key, text }));
                if (globalShuffleOptions) opts = shuffleArray(opts);
                return opts;
            }, [question.id, globalShuffleOptions]); 

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target?.tagName)) return;

                    if (e.key === ' ') {
                        e.preventDefault();
                        e.stopPropagation();
                        if (showAnswer) onNext();
                        else onAnswer('SHOW');
                        return;
                    }

                    if (isRecall && !showAnswer && e.key === 'Enter') onAnswer('SHOW');
                    else if (e.key === 'ArrowRight') onNext();
                    else if (e.key === 'ArrowLeft') onPrev();
                    else if (!isRecall && ['A','B','C','D','E'].includes(e.key.toUpperCase())) onAnswer(e.key.toUpperCase());
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [onNext, onPrev, onAnswer, isRecall, showAnswer]);

            const handleTouchStart = (e) => { touchStartX.current = e.targetTouches[0].clientX; touchEndX.current = null; };
            const handleTouchMove = (e) => { touchEndX.current = e.targetTouches[0].clientX; };
            const handleTouchEnd = () => {
                if (!touchStartX.current || !touchEndX.current) return;
                const distance = touchStartX.current - touchEndX.current;
                if (distance > minSwipeDistance) onNext();
                if (distance < -minSwipeDistance) onPrev();
            };

            // 智能解析逻辑
            const getAnalysis = () => {
                if (isRecall) {
                    return (
                        <div className="mt-4 p-4 bg-teal-50 rounded-lg border border-teal-100 text-sm animate-fade-in">
                            <div className="flex items-center mb-2 font-bold text-teal-800">
                                <Icons.BrainCircuit className="h-4 w-4 mr-2" />
                                参考答案
                            </div>
                            <p className="text-gray-800 leading-relaxed whitespace-pre-wrap">{question.answerText}</p>
                            {question.mnemonic && (
                                <div className="mt-3 pt-3 border-t border-teal-200/50">
                                    <div className="flex items-start text-orange-700 font-bold mb-1">
                                        <Icons.Zap className="h-4 w-4 mr-1.5 mt-0.5 fill-current" />
                                        <span>速记点拨</span>
                                    </div>
                                    <p className="text-gray-800 bg-orange-50 p-2 rounded text-sm border border-orange-100 leading-relaxed font-medium">
                                        {question.mnemonic}
                                    </p>
                                </div>
                            )}
                        </div>
                    );
                }
                const correctOptionText = question.options[question.answer] || '';
                
                let mnemonic = question.mnemonic;

                // 简单的规则引擎
                if (!mnemonic && !isMulti && correctOptionText) {
                    const title = question.title;
                    if (/[A-Za-z]/.test(title) || /[A-Za-z]/.test(correctOptionText)) {
                        const enText = title.match(/[A-Za-z\s]+/)?.[0]?.trim() || correctOptionText.match(/[A-Za-z\s]+/)?.[0]?.trim();
                        const cnText = title.replace(/[A-Za-z\s\(\)（）]/g, '') || correctOptionText.replace(/[A-Za-z\s\(\)（）]/g, '');
                        if (enText && cnText && cnText.length > 2) {
                            mnemonic = `🔤 对应记忆：${enText} = ${cnText.substring(0, 10)}`;
                        }
                    }
                    else if (title.includes('作者') || title.includes('成书') || title.includes('年代')) {
                        const bookMatch = title.match(/《([^》]+)》/);
                        if (bookMatch) {
                            const tag = title.includes('作者') ? '作者' : '年代';
                            mnemonic = `📚 ${bookMatch[0]} ${tag}是：${correctOptionText}`;
                        }
                    }
                    else if (title.includes('载药') || title.includes('数量') || title.includes('多少')) {
                        const bookMatch = title.match(/《([^》]+)》/);
                        const subject = bookMatch ? bookMatch[0] : '该书';
                        mnemonic = `🔢 ${subject} 载药：${correctOptionText}`;
                    }
                    else if (title.includes('誉为') || title.includes('称作') || title.includes('别名')) {
                        mnemonic = `🏷️ ${correctOptionText} = ${title.replace(/.*誉为|.*称作|.*别名|[（()）]/g, '').trim().substring(0, 10)}...`;
                    }

                    if (!mnemonic) {
                        let cleanTitle = title
                            .replace(/（[^）]*）|(\([^)]*\))/g, '')
                            .replace(/下列|关于|描述|错误|正确|的是|属于|是指|主要|含义|被誉为|专著|著作/g, '')
                            .trim();
                        const quoteMatch = cleanTitle.match(/[“"']([^”"']{2,})[”"']/);
                        if (quoteMatch) {
                            mnemonic = `💡 关键词 “${quoteMatch[1]}” ➔ ${correctOptionText}`;
                        } else {
                            const bookMatch = cleanTitle.match(/《([^》]+)》/);
                            if (bookMatch) {
                                    mnemonic = `📖 书籍 ${bookMatch[0]} ➔ ${correctOptionText}`;
                            } else {
                                if (cleanTitle.length > 10) cleanTitle = cleanTitle.substring(0, 8) + '...';
                                if (cleanTitle && correctOptionText) {
                                    mnemonic = `⚡️ ${cleanTitle} ➔ ${correctOptionText}`;
                                }
                            }
                        }
                    }
                }

                const analysisText = isMulti 
                    ? `正确答案：${question.answer}。` 
                    : `"${correctOptionText}" 是符合题干描述的正确选项。`;

                return (
                    <div className="mt-4 p-4 bg-teal-50 rounded-lg border border-teal-100 text-sm animate-fade-in">
                        <div className="flex items-center mb-2 font-bold text-teal-800">
                            <Icons.BrainCircuit className="h-4 w-4 mr-2" />
                            智能解析
                        </div>
                        <p>
                            <span className="font-bold">正确答案是 {question.answer}。</span>
                        </p>
                        <p className="mt-1 text-gray-600 mb-3">{analysisText}</p>
                        
                        {(mnemonic) && (
                            <div className="mt-3 pt-3 border-t border-teal-200/50">
                                <div className="flex items-start text-orange-700 font-bold mb-1">
                                    <Icons.Zap className="h-4 w-4 mr-1.5 mt-0.5 fill-current" />
                                    <span>速记点拨</span>
                                </div>
                                <p className="text-gray-800 bg-orange-50 p-2 rounded text-sm border border-orange-100 leading-relaxed font-medium">
                                    {mnemonic}
                                </p>
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full outline-none relative" onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd} tabIndex="0">
                <div className="mb-4 flex justify-between items-center text-sm text-gray-500 select-none">
                    <div className="flex items-center space-x-2">
                        <span className="font-medium bg-gray-100 px-2 py-1 rounded text-xs truncate max-w-[120px]">{question.chapter}</span>
                        <span className="font-mono text-xs">{current}/{total}</span>
                    </div>
                    <div className="relative z-20 flex items-center space-x-2">
                        {studyMode === 'recite' && <span className="text-xs bg-orange-100 text-orange-700 px-2 py-1 rounded-full font-bold flex items-center"><Icons.BookOpen className="w-3 h-3 mr-1" /> 背题模式</span>}
                        <button onClick={() => setShowSettings(!showSettings)} className={`p-1.5 rounded-full transition ${showSettings ? 'bg-teal-100 text-teal-700' : 'hover:bg-gray-100'}`}><Icons.Settings className="h-4 w-4" /></button>
                        {showSettings && (
                            <div className="absolute right-0 top-8 bg-white shadow-xl border border-gray-100 rounded-xl p-3 w-48 animate-fade-in z-30">
                                <h4 className="text-xs font-bold text-gray-400 mb-2 uppercase">当前设置</h4>
                                <label className="flex items-center justify-between cursor-pointer py-2 hover:bg-gray-50 rounded px-1">
                                    <span className="text-sm">选项乱序</span>
                                    <div className="relative">
                                        <input type="checkbox" className="sr-only" checked={globalShuffleOptions} onChange={(e) => onToggleOptionShuffle(e.target.checked)} />
                                        <div className={`block w-8 h-5 rounded-full transition ${globalShuffleOptions ? 'bg-teal-500' : 'bg-gray-300'}`}></div>
                                        <div className={`absolute left-1 top-1 bg-white w-3 h-3 rounded-full transition transform ${globalShuffleOptions ? 'translate-x-3' : ''}`}></div>
                                    </div>
                                </label>
                                <label className="flex items-center justify-between cursor-pointer py-2 hover:bg-gray-50 rounded px-1">
                                    <span className="text-sm">题目乱序</span>
                                    <div className="relative">
                                        <input type="checkbox" className="sr-only" checked={globalShuffleQuestions} onChange={(e) => onToggleQuestionShuffle(e.target.checked)} />
                                        <div className={`block w-8 h-5 rounded-full transition ${globalShuffleQuestions ? 'bg-teal-500' : 'bg-gray-300'}`}></div>
                                        <div className={`absolute left-1 top-1 bg-white w-3 h-3 rounded-full transition transform ${globalShuffleQuestions ? 'translate-x-3' : ''}`}></div>
                                    </div>
                                </label>
                            </div>
                        )}
                    </div>
                </div>

                <div className="w-full bg-gray-200 h-1.5 rounded-full mb-6">
                    <div className="bg-teal-500 h-1.5 rounded-full transition-all duration-300" style={{ width: `${(current / total) * 100}%` }}></div>
                </div>

                <div className="bg-white rounded-2xl shadow-lg p-6 mb-6 min-h-[160px] flex flex-col justify-center relative overflow-hidden select-none">
                    <div className="absolute top-0 right-0 p-2">
                        <button onClick={() => toggleWrong(question.id)} className={`p-2 rounded-full transition ${isWrong ? 'text-red-500 bg-red-50' : 'text-gray-300 hover:text-gray-400'}`}>
                        {isWrong ? <Icons.AlertCircle className="fill-current" /> : <Icons.AlertCircle />}
                        </button>
                    </div>
                    <div className="flex items-center mb-3">
                        <span className={`inline-block text-xs px-2 py-1 rounded w-fit font-bold mr-2 ${isMulti ? 'bg-purple-100 text-purple-800' : 'bg-teal-100 text-teal-800'}`}>{question.type}</span>
                        {question.isPatch && <span className="inline-block text-xs px-2 py-1 rounded w-fit font-bold mr-2 bg-amber-100 text-amber-800" title="据课堂录音整理补充，非真题原题">🆕课堂强调</span>}
                        {isMulti && <span className="text-xs text-gray-400">（请选择多个选项）</span>}
                    </div>
                    <h2 className="text-xl font-medium leading-relaxed text-gray-800">{question.title}</h2>
                </div>

                <div className="space-y-3 flex-1 overflow-y-auto pb-20 select-none no-scrollbar">
                    {isRecall && !showAnswer && (
                        <button onClick={() => onAnswer('SHOW')} className="w-full py-4 rounded-xl font-bold flex items-center justify-center transition shadow-md bg-teal-600 text-white hover:bg-teal-700 active:scale-95">
                            <Icons.Eye className="w-5 h-5 mr-2" />显示答案
                        </button>
                    )}
                    {displayOptions.map((opt) => {
                        const { key, text } = opt;
                        let stateClass = "bg-white border-gray-200 text-gray-700 hover:bg-gray-50 active:bg-gray-100";
                        let iconText = key;
                        let iconClass = "text-gray-500 border-gray-300";

                        if (showAnswer) {
                            if (isMulti) {
                                const isCorrect = question.answer.includes(key); 
                                const isSelected = selectedMultiOptions.has(key); 
                                if (isCorrect) { stateClass = "bg-green-50 border-green-500 text-green-800"; iconClass = "text-green-600 border-green-600"; }
                                else if (isSelected && !isCorrect) { stateClass = "bg-red-50 border-red-500 text-red-800"; iconClass = "text-red-600 border-red-600"; }
                                else { stateClass = "bg-gray-50 border-gray-100 text-gray-400 opacity-60"; }
                            } else {
                                if (key === question.answer) { stateClass = "bg-green-50 border-green-500 text-green-800"; iconClass = "text-green-600 border-green-600"; }
                                else if (key === selectedOption && key !== question.answer) { stateClass = "bg-red-50 border-red-500 text-red-800"; iconClass = "text-red-600 border-red-600"; }
                                else { stateClass = "bg-gray-50 border-gray-100 text-gray-400 opacity-60"; }
                            }
                        } else {
                            if (isMulti && selectedMultiOptions.has(key)) { stateClass = "bg-purple-50 border-purple-500 text-purple-800 shadow-sm"; iconClass = "bg-purple-600 text-white border-purple-600"; }
                        }

                        return (
                            <button key={key} onClick={() => onAnswer(key)} disabled={showAnswer} className={`w-full text-left p-4 rounded-xl border-2 transition-all flex items-center ${stateClass}`}>
                                <span className={`w-6 h-6 rounded-full border flex items-center justify-center text-xs mr-3 font-bold transition-colors ${iconClass}`}>{iconText}</span>
                                <span className="flex-1 font-medium">{text}</span>
                            </button>
                        );
                    })}
                    {isMulti && !showAnswer && (
                        <button onClick={onSubmitMulti} disabled={selectedMultiOptions.size === 0} className={`w-full mt-4 py-3 rounded-xl font-bold flex items-center justify-center transition shadow-md ${selectedMultiOptions.size > 0 ? 'bg-purple-600 text-white hover:bg-purple-700 active:scale-95' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}>
                            <Icons.CheckSquare className="w-5 h-5 mr-2" />确认答案
                        </button>
                    )}
                    {showAnswer && getAnalysis()}
                </div>

                <div className="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 flex justify-between items-center z-40 lg:static lg:bg-transparent lg:border-none lg:p-0 lg:mt-4 select-none">
                    <button onClick={onPrev} disabled={current === 1} className={`flex items-center px-4 py-2 rounded-lg font-medium ${current === 1 ? 'text-gray-300' : 'text-teal-600 hover:bg-teal-50'}`}><Icons.ChevronLeft className="mr-1" /> 上一题</button>
                    <span className="text-xs text-gray-400 font-mono lg:hidden">左右滑动切换</span>
                    <button onClick={onNext} className="flex items-center px-6 py-2 bg-teal-600 text-white rounded-lg font-bold shadow-md hover:bg-teal-700 active:scale-95 transition">{current === total ? '完成' : '下一题'} <Icons.ChevronRight className="ml-1" /></button>
                </div>
                </div>
            );
        }

        function ManageView({ course, questions, onRequestDelete, onUpdateQuestion, editingQuestion, setEditingQuestion, onBack, onRequestFix }) {
            
            const EditForm = ({ q }) => {
                const [formData, setFormData] = useState({...q});
                const handleChange = (field, value) => { setFormData({...formData, [field]: value}); };
                const handleOptionChange = (key, value) => { setFormData({ ...formData, options: { ...formData.options, [key]: value } }); };

                return (
                    <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 animate-fade-in">
                        <div className="bg-white rounded-xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-6 shadow-2xl">
                            <h3 className="text-lg font-bold mb-4 flex items-center text-teal-700"><Icons.Edit className="h-5 w-5 mr-2" />编辑题目</h3>
                            <div className="space-y-4">
                                <div><label className="text-xs font-bold text-gray-500 uppercase">题干</label><textarea className="w-full border rounded-lg p-3 text-sm focus:ring-2 focus:ring-teal-500 outline-none" rows={3} value={formData.title} onChange={e => handleChange('title', e.target.value)} /></div>
                                <div><label className="text-xs font-bold text-gray-500 uppercase flex items-center"><Icons.Zap className="w-3 h-3 mr-1" /> 速记/解析 (可选)</label><input className="w-full border rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none" placeholder="输入助记口诀..." value={formData.mnemonic || ''} onChange={e => handleChange('mnemonic', e.target.value)} /></div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="text-xs font-bold text-gray-500 uppercase">章节</label><input className="w-full border rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none" value={formData.chapter} onChange={e => handleChange('chapter', e.target.value)} /></div>
                                    <div><label className="text-xs font-bold text-gray-500 uppercase">正确答案</label><input className="w-full border rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none" value={formData.answer} onChange={e => handleChange('answer', e.target.value.toUpperCase())} /></div>
                                </div>
                                <div className="bg-gray-50 p-3 rounded-lg space-y-2">
                                    <label className="text-xs font-bold text-gray-500 uppercase">选项内容</label>
                                    {Object.keys(formData.options).map(key => (
                                        <div key={key} className="flex items-center space-x-2"><span className="font-bold w-6 text-center bg-white border rounded shadow-sm">{key}</span><input className="flex-1 border rounded p-2 text-sm focus:ring-1 focus:ring-teal-500 outline-none" value={formData.options[key]} onChange={e => handleOptionChange(key, e.target.value)} /></div>
                                    ))}
                                </div>
                            </div>
                            <div className="flex justify-end space-x-3 mt-6 border-t pt-4">
                                <button onClick={() => setEditingQuestion(null)} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">取消</button>
                                <button onClick={() => onUpdateQuestion(formData)} className="px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 shadow font-bold">保存修改</button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="bg-white rounded-xl shadow-sm min-h-[50vh]">
                    <div className="p-4 border-b flex justify-between items-center sticky top-0 bg-white rounded-t-xl z-10 shadow-sm">
                        <div className="flex items-center"><button onClick={onBack} className="mr-2 p-2 hover:bg-gray-100 rounded-full transition"><Icons.ChevronLeft className="h-5 w-5" /></button><h2 className="text-xl font-bold text-gray-800">管理：{course}</h2></div>
                        <div className="flex items-center space-x-2"><button onClick={onRequestFix} className="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded border border-blue-100 hover:bg-blue-100">修复/刷新数据</button><div className="text-sm text-gray-500 bg-gray-100 px-2 py-1 rounded">共 {questions.length} 题</div></div>
                    </div>
                    <div className="divide-y divide-gray-100">
                        {questions.map((q, idx) => (
                            <div key={q.id || idx} className="flex items-start justify-between p-4 hover:bg-gray-50 transition group">
                                <div className="flex-1 pr-4">
                                    <div className="flex items-center mb-1 flex-wrap gap-1"><span className="text-xs bg-gray-200 text-gray-600 px-1.5 py-0.5 rounded font-mono w-8 text-center">{idx + 1}</span><span className="text-xs bg-teal-50 text-teal-700 px-1.5 py-0.5 rounded border border-teal-100">{q.chapter}</span>{q.examProb && <span className={`text-xs px-1.5 py-0.5 rounded border ${q.examProb==='必考'?'bg-rose-50 text-rose-700 border-rose-200':q.examProb==='常考'?'bg-amber-50 text-amber-700 border-amber-200':'bg-gray-100 text-gray-500 border-gray-200'}`}>{q.examProb==='必考'?'🔴必考':q.examProb==='常考'?'🟡常考':'⚪了解'}</span>}</div>
                                    <span className="text-sm text-gray-800 font-medium line-clamp-2 mt-1">{q.title}</span>
                                </div>
                                <div className="flex space-x-1 shrink-0 self-center">
                                    <button onClick={(e) => { e.stopPropagation(); setEditingQuestion(q); }} className="text-blue-500 hover:bg-blue-100 p-2 rounded-lg transition" title="编辑"><Icons.Edit className="h-5 w-5" /></button>
                                    <button onClick={(e) => { e.stopPropagation(); onRequestDelete(q.id); }} className="text-red-500 hover:bg-red-100 p-2 rounded-lg transition" title="删除"><Icons.Trash2 className="h-5 w-5" /></button>
                                </div>
                            </div>
                        ))}
                    </div>
                    {editingQuestion && <EditForm q={editingQuestion} />}
                </div>
            );
        }

        // --- 5b. 滚动模式组件 ---
        function ScrollStudy({ questions, course, chapter, wrongIds, toggleWrong, addWrong, onUpdateQuestion, onBack, onSwitchToCard, isRecite }) {
            const [filterType, setFilterType] = useState('全部');
            const [filterProb, setFilterProb] = useState('全部');
            const [expandedIds, setExpandedIds] = useState(() => isRecite ? new Set(questions.map(q => q.id)) : new Set());
            const [editingId, setEditingId] = useState(null);
            const [editData, setEditData] = useState(null);
            const [showAllAnswers, setShowAllAnswers] = useState(isRecite);
            const [sidebarOpen, setSidebarOpen] = useState(true);
            // 答题状态：{ qid: { selected: Set|string, answered: bool } }
            const [userAnswers, setUserAnswers] = useState({});

            // 浮出工具栏状态
            const tbRef = useRef(null);
            const [tbVisible, setTbVisible] = useState(false);
            const savedRangeRef = useRef(null);
            const selTimerRef = useRef(null);

            // 过滤题目
            const filtered = useMemo(() => {
                let qs = questions;
                if (filterType !== '全部') qs = qs.filter(q => q.type === filterType);
                if (filterProb !== '全部') {
                    if (filterProb === '仅必考') qs = qs.filter(q => q.examProb === '必考');
                    else if (filterProb === '必考+常考') qs = qs.filter(q => q.examProb === '必考' || q.examProb === '常考');
                }
                return qs;
            }, [questions, filterType, filterProb]);

            const types = useMemo(() => ['全部', ...new Set(questions.map(q => q.type).filter(Boolean))], [questions]);

            // 展开/收起答案
            const toggleExpand = (id) => {
                setExpandedIds(prev => { const n = new Set(prev); if (n.has(id)) n.delete(id); else n.add(id); return n; });
            };

            const toggleAll = () => {
                if (showAllAnswers) { setExpandedIds(new Set()); setShowAllAnswers(false); }
                else { setExpandedIds(new Set(filtered.map(q => q.id))); setShowAllAnswers(true); }
            };

            // === 答题交互 ===
            const handleScrollAnswer = (q, optionKey) => {
                const qid = q.id;
                const prev = userAnswers[qid];
                if (prev && prev.answered) return; // 已答过
                const isMulti = q.type && (q.type.includes('多') || q.type.includes('Multi'));
                if (isMulti) {
                    const sel = new Set(prev?.selected || []);
                    if (sel.has(optionKey)) sel.delete(optionKey); else sel.add(optionKey);
                    setUserAnswers(p => ({ ...p, [qid]: { selected: sel, answered: false } }));
                } else {
                    const isCorrect = optionKey === q.answer;
                    setUserAnswers(p => ({ ...p, [qid]: { selected: optionKey, answered: true } }));
                    setExpandedIds(p => { const n = new Set(p); n.add(qid); return n; });
                    if (!isCorrect && addWrong) addWrong(qid);
                }
            };
            const submitScrollMulti = (q) => {
                const qid = q.id;
                const prev = userAnswers[qid];
                if (!prev || prev.answered) return;
                const userAns = Array.from(prev.selected || []).sort().join('');
                const correctAns = q.answer.split('').sort().join('');
                setUserAnswers(p => ({ ...p, [qid]: { ...prev, answered: true } }));
                setExpandedIds(p => { const n = new Set(p); n.add(qid); return n; });
                if (userAns !== correctAns && addWrong) addWrong(qid);
            };

            // === 行内编辑 ===
            const startEdit = (q) => {
                setEditingId(q.id);
                setEditData({ ...q, options: { ...q.options } });
            };

            const saveEdit = () => {
                if (editData) { onUpdateQuestion(editData); setEditingId(null); setEditData(null); }
            };

            const cancelEdit = () => { setEditingId(null); setEditData(null); };

            // === 浮出格式工具栏 ===
            const showToolbar = (x, y) => {
                if (!tbRef.current) return;
                const tbH = 40;
                let top = y - tbH - 6;
                let left = x - 70;
                if (top < 4) top = y + 20;
                if (left < 4) left = 4;
                if (left + 160 > window.innerWidth) left = window.innerWidth - 164;
                tbRef.current.style.left = left + 'px';
                tbRef.current.style.top = top + 'px';
                tbRef.current.classList.add('visible');
                setTbVisible(true);
            };

            const hideToolbar = () => {
                if (tbRef.current) tbRef.current.classList.remove('visible');
                setTbVisible(false);
            };

            const saveRange = () => {
                const sel = window.getSelection();
                if (sel && sel.rangeCount > 0 && !sel.isCollapsed) savedRangeRef.current = sel.getRangeAt(0).cloneRange();
            };

            const restoreRange = () => {
                if (savedRangeRef.current) { const sel = window.getSelection(); if (sel) { sel.removeAllRanges(); sel.addRange(savedRangeRef.current); } }
            };

            const applyFmt = (cmd, val) => {
                restoreRange();
                document.execCommand(cmd, false, val || null);
                const sel = window.getSelection();
                if (sel && sel.rangeCount > 0 && !sel.isCollapsed) savedRangeRef.current = sel.getRangeAt(0).cloneRange();
            };

            const fmtBtnMouseDown = (e) => { e.preventDefault(); e.stopPropagation(); saveRange(); };

            // selectionchange 检测
            useEffect(() => {
                let timer = null;
                const handler = () => {
                    clearTimeout(timer);
                    timer = setTimeout(() => {
                        const sel = window.getSelection();
                        if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
                            const anchor = sel.anchorNode && sel.anchorNode.parentElement;
                            const editable = anchor && anchor.closest('[contenteditable="true"]');
                            if (!editable) { if (tbVisible) hideToolbar(); return; }
                            savedRangeRef.current = sel.getRangeAt(0).cloneRange();
                            const rect = savedRangeRef.current.getBoundingClientRect();
                            if (rect.width === 0 && rect.height === 0) { if (tbVisible) hideToolbar(); return; }
                            showToolbar(rect.left + rect.width / 2, rect.top);
                        } else { if (tbVisible) hideToolbar(); }
                    }, 150);
                };
                document.addEventListener('selectionchange', handler);
                document.addEventListener('mouseup', handler);
                return () => { document.removeEventListener('selectionchange', handler); document.removeEventListener('mouseup', handler); };
            }, [tbVisible]);

            // === 快捷键 ===
            useEffect(() => {
                const handleKey = (e) => {
                    if (editingId || ['INPUT', 'TEXTAREA'].includes(e.target?.tagName)) return;
                    // J/K 上下题
                    if (e.key === 'j' || e.key === 'ArrowDown') {
                        const cards = document.querySelectorAll('.scroll-q-card');
                        for (let i = 0; i < cards.length - 1; i++) {
                            const r = cards[i].getBoundingClientRect();
                            if (r.bottom > 80) { cards[i + 1].scrollIntoView({ behavior: 'smooth', block: 'center' }); break; }
                        }
                        e.preventDefault();
                    }
                    if (e.key === 'k' || e.key === 'ArrowUp') {
                        const cards = document.querySelectorAll('.scroll-q-card');
                        for (let i = cards.length - 1; i > 0; i--) {
                            const r = cards[i].getBoundingClientRect();
                            if (r.top < window.innerHeight - 80) { cards[i - 1].scrollIntoView({ behavior: 'smooth', block: 'center' }); break; }
                        }
                        e.preventDefault();
                    }
                    // E 展开/收起当前可见题
                    if (e.key === 'e') {
                        const cards = document.querySelectorAll('.scroll-q-card');
                        for (const c of cards) {
                            const r = c.getBoundingClientRect();
                            if (r.top >= 0 && r.top < window.innerHeight / 2) {
                                const id = c.dataset.qid;
                                toggleExpand(id);
                                break;
                            }
                        }
                        e.preventDefault();
                    }
                    // A 全部展开/收起
                    if (e.key === 'a') { toggleAll(); e.preventDefault(); }
                    // Escape 退出编辑
                    if (e.key === 'Escape') { if (editingId) cancelEdit(); }
                };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, [editingId, expandedIds]);

            return (
                <div className="scroll-layout">
                    {/* 浮出格式工具栏 */}
                    <div className="fmt-toolbar" ref={tbRef}>
                        <button type="button" className="fmt-btn" onMouseDown={fmtBtnMouseDown} onClick={() => applyFmt('bold')} title="加粗"><strong>B</strong></button>
                        <button type="button" className="fmt-btn fmt-blue" onMouseDown={fmtBtnMouseDown} onClick={() => applyFmt('foreColor', '#2563eb')} title="蓝色">A</button>
                        <button type="button" className="fmt-btn fmt-red" onMouseDown={fmtBtnMouseDown} onClick={() => applyFmt('foreColor', '#dc2626')} title="红色">A</button>
                        <button type="button" className="fmt-btn fmt-hl" onMouseDown={fmtBtnMouseDown} onClick={() => applyFmt('hiliteColor', '#fde047')} title="高亮"><span className="hl-t">A</span></button>
                    </div>

                    {/* 左侧固定筛选栏 */}
                    <div className={`scroll-sidebar no-scrollbar ${sidebarOpen ? '' : 'collapsed'}`}>
                        <div className="mb-3">
                            <div className="text-xs font-bold text-gray-400 mb-2 uppercase flex items-center"><Icons.Filter className="w-3 h-3 mr-1"/>题型</div>
                            {types.map(t => (
                                <button key={t} onClick={() => setFilterType(t)} className={`sidebar-filter-btn ${filterType === t ? 'active' : ''}`}>{t}{t !== '全部' && <span className="text-xs text-gray-400 ml-1">({questions.filter(q => q.type === t).length})</span>}</button>
                            ))}
                        </div>
                        <div className="mb-3">
                            <div className="text-xs font-bold text-gray-400 mb-2 uppercase flex items-center"><Icons.Filter className="w-3 h-3 mr-1"/>考概率</div>
                            {['全部', '仅必考', '必考+常考'].map(p => (
                                <button key={p} onClick={() => setFilterProb(p)} className={`sidebar-filter-btn ${filterProb === p ? 'active' : ''}`}>{p}</button>
                            ))}
                        </div>
                        <div className="border-t border-gray-100 pt-2 max-h-[40vh] overflow-y-auto no-scrollbar">
                            {filtered.map((q, i) => (
                                <div key={q.id} className={`sidebar-q-link ${wrongIds.has(q.id) ? 'wrong' : ''}`} onClick={() => { const el = document.getElementById('sq-' + q.id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }}>
                                    <span className="w-6 text-center font-mono text-xs bg-gray-100 rounded">{i + 1}</span>
                                    <span className="truncate flex-1">{q.title.substring(0, 20)}{q.title.length > 20 ? '...' : ''}</span>
                                </div>
                            ))}
                        </div>
                        <div className="mt-3 pt-3 border-t border-gray-100 text-xs text-gray-400 space-y-1">
                            <p><kbd className="bg-gray-100 px-1 rounded">J</kbd>/<kbd className="bg-gray-100 px-1 rounded">K</kbd> 上下题</p>
                            <p><kbd className="bg-gray-100 px-1 rounded">E</kbd> 展开答案</p>
                            <p><kbd className="bg-gray-100 px-1 rounded">A</kbd> 全部展开</p>
                        </div>
                    </div>

                    {/* 侧边栏收起/展开按钮 */}
                    <button className={`sidebar-toggle ${sidebarOpen ? '' : 'collapsed'}`} onClick={() => setSidebarOpen(o => !o)} title={sidebarOpen ? '收起侧边栏' : '展开侧边栏'}>
                        {sidebarOpen ? '◀' : '▶'}
                    </button>

                    {/* 主内容区 */}
                    <div className={`scroll-main ${sidebarOpen ? '' : 'full'}`}>
                        <div className="flex items-center justify-between mb-4 sticky top-16 bg-gray-50 z-30 py-3 -mx-5 px-5 border-b border-gray-100">
                            <div className="flex items-center gap-3">
                                <button onClick={onBack} className="flex items-center text-sm text-teal-600 hover:text-teal-800 bg-teal-50 px-3 py-1.5 rounded-full"><Icons.ArrowLeft className="w-4 h-4 mr-1"/>返回</button>
                                <button onClick={onSwitchToCard} className="text-sm text-gray-500 hover:text-gray-700 bg-gray-100 px-3 py-1.5 rounded-full flex items-center"><Icons.BookOpen className="w-3 h-3 mr-1"/>卡片模式</button>
                                <span className="text-sm text-gray-500">{course} · {chapter} · <strong>{filtered.length}</strong>题</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={toggleAll} className={`text-xs px-3 py-1.5 rounded-full border transition ${showAllAnswers ? 'bg-teal-50 border-teal-300 text-teal-700' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'}`}>{showAllAnswers ? '收起全部' : '展开全部'}</button>
                            </div>
                        </div>

                        {filtered.map((q, idx) => {
                            const isExpanded = expandedIds.has(q.id) || showAllAnswers;
                            const isEditing = editingId === q.id;
                            const isMulti = q.type && (q.type.includes('多') || q.type.includes('Multi'));
                            const isRecall = !!q.isRecall;

                            if (isEditing && editData) {
                                return (
                                    <div key={q.id} id={'sq-' + q.id} data-qid={q.id} className="scroll-q-card editing">
                                        <div className="flex items-center justify-between mb-3">
                                            <span className="text-xs bg-teal-100 text-teal-700 px-2 py-0.5 rounded font-bold">编辑模式</span>
                                            <div className="flex gap-2">
                                                <button onClick={cancelEdit} className="text-xs px-3 py-1 border border-gray-200 rounded-lg text-gray-500 hover:bg-gray-50">取消</button>
                                                <button onClick={saveEdit} className="text-xs px-3 py-1 bg-teal-600 text-white rounded-lg hover:bg-teal-700 font-bold">保存</button>
                                            </div>
                                        </div>
                                        <textarea className="w-full border border-teal-200 rounded-lg p-2 text-sm mb-2 focus:ring-2 focus:ring-teal-500 outline-none" rows={2} value={editData.title} onChange={e => setEditData({...editData, title: e.target.value})} />
                                        <div className="grid grid-cols-2 gap-2 mb-2">
                                            {Object.entries(editData.options).filter(([k,v]) => v || k <= 'D').map(([k, v]) => (
                                                <div key={k} className="flex items-center gap-1">
                                                    <span className="w-6 text-center font-bold text-xs bg-gray-100 rounded">{k}</span>
                                                    <input className="flex-1 border border-gray-200 rounded px-2 py-1 text-xs focus:ring-1 focus:ring-teal-500 outline-none" value={v || ''} onChange={e => setEditData({...editData, options: {...editData.options, [k]: e.target.value}})} />
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex gap-3">
                                            <div className="flex-1"><label className="text-xs text-gray-500">正确答案</label><input className="w-full border border-gray-200 rounded px-2 py-1 text-sm focus:ring-1 focus:ring-teal-500 outline-none" value={editData.answer} onChange={e => setEditData({...editData, answer: e.target.value.toUpperCase()})} /></div>
                                            <div className="flex-1"><label className="text-xs text-gray-500">章节</label><input className="w-full border border-gray-200 rounded px-2 py-1 text-sm focus:ring-1 focus:ring-teal-500 outline-none" value={editData.chapter} onChange={e => setEditData({...editData, chapter: e.target.value})} /></div>
                                            <div className="flex-1"><label className="text-xs text-gray-500">速记</label><input className="w-full border border-gray-200 rounded px-2 py-1 text-sm focus:ring-1 focus:ring-teal-500 outline-none" value={editData.mnemonic || ''} onChange={e => setEditData({...editData, mnemonic: e.target.value})} /></div>
                                        </div>
                                    </div>
                                );
                            }

                            return (
                                <div key={q.id} id={'sq-' + q.id} data-qid={q.id} className="scroll-q-card">
                                    <div className="flex items-start justify-between">
                                        <div className="flex items-center gap-2 mb-2">
                                            <span className="font-mono text-xs bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded">{idx + 1}</span>
                                            <span className={`text-xs px-2 py-0.5 rounded font-bold ${isMulti ? 'bg-purple-100 text-purple-700' : q.type === '判断' ? 'bg-amber-100 text-amber-700' : 'bg-teal-100 text-teal-700'}`}>{q.type}</span>
                                            {q.examProb && <span className={`text-xs px-1.5 py-0.5 rounded ${q.examProb==='必考'?'bg-rose-50 text-rose-600':q.examProb==='常考'?'bg-amber-50 text-amber-600':'text-gray-400'}`}>{q.examProb==='必考'?'必考':q.examProb==='常考'?'常考':'了解'}</span>}
                                            <span className="text-xs text-gray-400">{q.chapter}</span>
                                        </div>
                                        <div className="flex gap-1">
                                            <button onClick={() => toggleWrong(q.id)} className={`p-1 rounded transition ${wrongIds.has(q.id) ? 'text-red-500' : 'text-gray-300 hover:text-gray-400'}`}><Icons.AlertCircle className="w-4 h-4" /></button>
                                            <button onClick={() => startEdit(q)} className="p-1 text-gray-300 hover:text-teal-600 rounded transition" title="编辑"><Icons.Edit className="w-4 h-4" /></button>
                                        </div>
                                    </div>
                                    <h3 className="text-base font-medium text-gray-800 mb-3 leading-relaxed">{q.title}</h3>
                                    {/* 选项（可交互） */}
                                    {!isRecall && (() => {
                                        const ua = userAnswers[q.id];
                                        const answered = ua?.answered || false;
                                        const selected = ua?.selected;
                                        return (<>
                                            {Object.entries(q.options).filter(([k,v]) => v).map(([k, v]) => {
                                                let cls = 'bg-white border-gray-200 text-gray-700 hover:bg-gray-50 cursor-pointer';
                                                let iconCls = 'border-gray-300 text-gray-400';
                                                if (isMulti && !answered && selected && selected.has(k)) {
                                                    cls = 'bg-purple-50 border-purple-500 text-purple-800 shadow-sm cursor-pointer';
                                                    iconCls = 'bg-purple-600 text-white border-purple-600';
                                                }
                                                if (answered || (showAllAnswers && !ua)) {
                                                    const isCorr = q.answer.includes(k);
                                                    const isSel = isMulti ? (selected && selected.has(k)) : selected === k;
                                                    if (isCorr) { cls = 'bg-green-50 border-green-500 text-green-800'; iconCls = 'border-green-500 text-green-600'; }
                                                    else if (isSel) { cls = 'bg-red-50 border-red-500 text-red-800'; iconCls = 'border-red-500 text-red-600'; }
                                                    else { cls = 'bg-gray-50 border-gray-100 text-gray-400 opacity-60'; }
                                                }
                                                return (
                                                    <button key={k} onClick={() => handleScrollAnswer(q, k)} disabled={answered && !isMulti}
                                                        className={`w-full text-left p-2.5 rounded-lg border-2 transition-all flex items-center gap-2 mb-1.5 text-sm ${cls}`}>
                                                        <span className={`w-5 h-5 rounded-full border flex items-center justify-center text-xs font-bold flex-shrink-0 ${iconCls}`}>{k}</span>
                                                        <span className="flex-1">{v}</span>
                                                    </button>
                                                );
                                            })}
                                            {isMulti && !answered && (
                                                <button onClick={() => submitScrollMulti(q)} disabled={!selected || selected.size === 0}
                                                    className={`w-full mt-1 py-2 rounded-lg text-sm font-bold transition ${selected && selected.size > 0 ? 'bg-purple-600 text-white hover:bg-purple-700' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}>
                                                    确认答案
                                                </button>
                                            )}
                                        </>);
                                    })()}
                                    {isRecall && !isExpanded && (
                                        <button onClick={() => toggleExpand(q.id)} className="w-full py-3 rounded-lg font-bold flex items-center justify-center transition bg-teal-600 text-white hover:bg-teal-700 text-sm mb-2">
                                            <Icons.Eye className="w-4 h-4 mr-1"/>显示答案
                                        </button>
                                    )}
                                    {/* 答案区域 */}
                                    <div className={`q-answer-area ${isExpanded ? 'open' : ''}`}>
                                        <div className="p-3 bg-teal-50 rounded-lg border border-teal-100 text-sm">
                                            <div className="flex items-center mb-1 font-bold text-teal-800 text-xs"><Icons.BrainCircuit className="w-3 h-3 mr-1"/>正确答案: {q.answer}</div>
                                            {q.answerText && <p className="text-gray-700 whitespace-pre-wrap mt-1" dangerouslySetInnerHTML={{__html: q.answerText}} /> }
                                            {q.mnemonic && <div className="mt-2 pt-2 border-t border-teal-200/50"><span className="text-orange-600 font-bold text-xs flex items-center"><Icons.Zap className="w-3 h-3 mr-1"/>速记: </span><span className="text-gray-700 text-xs">{q.mnemonic}</span></div>}
                                        </div>
                                    </div>
                                    {/* 展开/收起按钮 */}
                                    {(!isRecall || isExpanded) && (
                                        <button onClick={() => toggleExpand(q.id)} className="mt-2 text-xs text-teal-600 hover:text-teal-800 flex items-center gap-1">
                                            {isExpanded ? '▲ 收起答案' : '▼ 显示答案'}
                                        </button>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // --- 6. 渲染根节点 ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
