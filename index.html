定质谱图中的分子离子峰,可精确得到化合物的分子量;分子式的确定可通过元素分析或质谱法进行。元素分析通过元素分析仪完成,通过测定给出化合物中除氧元素外的各组成元素的含量和比例, 并由此推算出化合物中各组成元素的含量,得出化合物的实验分子式,结合分子量确定化合物的确切分子式。质谱法测定分子式可采用同位素峰法和高分辨质谱法。","options":{},"answer":"简答题","mnemonic":" [合并自tr-453(sId1)]","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0948","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"5","title":"一次代谢产物与二次代谢产物的区别","answerText":"糖、蛋白质、脂质、核酸等对植物机体生命活动不可缺少的物质称为一次代谢产物;由一次代谢产物进一步代谢产生的如萜类、生物碱类等成分,因并非维持植物生命活动所必需,称为二次代谢产物。","options":{},"answer":"简答题","mnemonic":"必背｜星空历年真题","priority":"必背","isRecall":true,"sourceId":4,"addedAt":1780232235675,"suspect":false,"examProb":"必考"},{"id":"tr-0960","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"102","title":"六种柱层析的吸附剂与分离原理","answerText":"①硅胶柱:吸附剂硅胶,按分子极性由小到大分离,最常用。②氧化铝柱:吸附剂氧化铝,按极性由小到大分离,多用于碱性物质。③反相柱:反相硅胶,按极性由大到小分离。④凝胶柱:各类凝胶,按分子量大小分离。⑤聚酰胺柱:聚酰胺,按氢键强弱(吸附剂与物质间)分离。⑥大孔树脂柱:大孔树脂,按分子量大小分离。","options":{},"answer":"简答题","mnemonic":"必背｜星空历年真题","priority":"必背","isRecall":true,"sourceId":4,"addedAt":1780232269783,"suspect":false,"examProb":"必考"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"选择","title":"调节溶液的 pH 改变分子的存在状态影响溶解度而实现分离的方法有","options":{"A":"醇提水沉法","B":"铅盐沉淀法","C":"碱提酸沉法","D":"醇提丙酮沉法"},"answer":"C","chapter":"1. 总论","isRecall":false,"answerText":"","mnemonic":"汇集各章习题(sId6)","id":"tr-1000","number":"","priority":"重要","examProb":"了解"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"选择","title":"与水不分层的有机溶剂有:","options":{"A":"CHCl3","B":"丙酮","C":"Et2 O","D":"正丁醇"},"answer":"A","chapter":"1. 总论","isRecall":false,"answerText":"","mnemonic":"汇集各章习题(sId6)","id":"tr-1001","number":"","priority":"重要","examProb":"了解"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"选择","title":"聚酰胺层析原理是","options":{"A":"物理吸附","B":"氢键吸附","C":"分子筛效应","D":"化学吸附"},"answer":"B","chapter":"1. 总论","isRecall":false,"answerText":"","mnemonic":"汇集各章习题(sId6 er":"对","chapter":"1. 总论","isRecall":false,"answerText":"","mnemonic":"汇集各章习题(sId6)","id":"tr-1088","number":"","priority":"重要","examProb":"了解"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"判断","title":"双水相萃取法被广泛地应用在生物化学、细胞生物学和生物化工领域。()","options":{},"answer":"对","chapter":"1. 总论","isRecall":false,"answerText":"","mnemonic":"汇集各章习题(sId6)","id":"tr-1089","number":"","priority":"重要","examProb":"了解"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"判断","title":"欲提取原生苷,可在中药中加入一定量的碳酸钙。()","options":{},"answer":"对","chapter":"1. 总论","isRecall":false,"answerText":"","mnemonic":"汇集各章习题(sId6)","id":"tr-1093","number":"","priority":"重要","examProb":"了解"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"名词解释记忆","title":"高速逆流色谱技术","answerText":"它是依靠高速齿轮旋转产生的离心力使无载体支持的固定相稳定地保留在蛇形管中, 并使流动相单向、低速地通过固定相, 由于不同的物质在两相中具有不同的分配系数,其在柱中的移动速度也不一样, 从而实现样品的一种分离方法。","chapter":"1. 总论","isRecall":true,"options":{},"answer":"名词解释","mnemonic":"汇集各章习题(sId6)名词解释","id":"tr-1113","number":"","priority":"重要","examProb":"常考"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"名词解释记忆","title":"超临界流体萃取技术","answerText":"是指在临界温度和临界压力以上, 以接近临界点状态下的流体作为萃取溶剂,利用其在超临界状态下兼有液体和气体的双重性质选择性地溶解其他物质, 先将某一组分溶解, 然后通过控制温度和压力, 使临界流体变成普通气体, 被溶物会析出,从而从混合物中得以分离地技术。","chapter":"1. 总论","isRecall":true,"options":{},"answer":"名词解释","mnemonic":"汇集各章习题(sId6)名词解释","id":"tr-1114","number":"","priority":"重要","examProb":"常考"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"名词解释记忆","title":"超声波提取技术","answerText":"是指以超声波辐射压强产生的骚动效应、空化效应和热效应, 引起机械搅拌、加速扩散溶解的一种新型的利用外场介入的溶剂强化提取方法。","chapter":"1. 总论","isRecall":true,"options":{},"answer":"名词解释","mnemonic":"汇集各章习题(sId6)名词解释","id":"tr-1115","number":"","priority":"重要","examProb":"常考"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"名词解释记忆","title":"正相色谱","answerText":"流动相的极性是非极性的,而固定相的极性是极性的。","chapter":"1. 总论","isRecall":true,"options":{},"answer":"名词解释","mnemonic":"汇集各章习题(sId6)名词解释","id":"tr-1117","number":"","priority":"重要","examProb":"常考"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"名词解释记忆","title":"反相色谱","answerText":"固定相的极性小,而流动相的极性大。","chapter":"1. 总论","isRecall":true,"options":{},"answer":"名词解释","mnemonic":"汇集各章习题(sId6)名词解释","id":"tr-1118","number":"","priority":"重要","examProb":"常考"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"名词解释记忆","title":"超滤技术","answerText":"是指在常温下以一定压力和流量,利用不对称微孔结构和半透膜分离介质,以错流方怯进行过滤、使溶剂及小分子物质通过, 高分子物质和微粒子如蛋白质,水溶性高聚物、细菌等被膜阻流,从而达到分离的目的的一种分离技术。","chapter":"1. 总论","isRecall":true,"options":{},"answer":"名词解释","mnemonic":"汇集各章习题(sId6)名词解释","id":"tr-1119","number":"","priority":"重要","examProb":"常考"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"名词解释记忆","title":"化学位移","answerText":"1H 核因为周围化学环境的不同, 其外围电子云密度, 以及绕核旋转时产生的磁的屏蔽效应也就不同。在一定的外磁场作用下其回旋频率也不同, 因而需要相应频率的射频磁场才能发生共振而得到吸收信号。这些信号将会出现在不同的区域, 我们在实际应用当中以四甲基硅烷 TMS 为内标物, 将其化学位移定为 0 ,测定各质子共振频率与它的相对距离,这个相对值就是质子的化学位移值。","chapter":"1. 总论","isRecall":true,"options":{},"answer":"名词解释","mnemonic":"汇集各章习题(sId6)名词解释","id":"tr-1120","number":"","priority":"重要","examProb":"常考"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"名词解释记忆","title":"碱溶酸沉法","answerText":"利用某些具有一定酸性的亲脂性成分,在碱液中能够溶解, 加酸后又沉淀析出的性质,进行此类成分的提取和分离。","chapter":"1. 总论","isRecall":true,"options":{},"answer":"名词解释","mnemonic":"汇集各章习题(sId6)名词解释","id":"tr-1126","number":"","priority":"重要","examProb":"常考"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"填空记忆","title":"中药化学成分分子式的确定,目前最常用的是( )。","answerText":"高分辨质谱","chapter":"1. 总论","isRecall":true,"options":{},"answer":"填空题","mnemonic":"汇集各章习题(sId6)填空","id":"tr-1134","number":"","priority":"重要","examProb":"常考"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"填空记忆","title":"常用有机溶剂中 ( ) 极性最小, ( ) 极性最大。","answerText":"石油 胶体溶液","C":"悬浊液","D":"乳浊液"},"answer":"B","mnemonic":"来源:sId7 doubao历年试卷;(原卷无答案,据教材补)","priority":"重要","isRecall":false,"sourceId":7,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-1187","course":"天然药物化学","type":"选择","chapter":"1. 总论","number":"","title":"化合物在进行薄层层析时,常碰到两边斑点Rf值大,中间Rf值小,其原因是:","answerText":"","options":{"A":"点样量不一","B":"层析板铺得不均匀","C":"边缘效应","D":"层析缸底部不平整"},"answer":"C","mnemonic":"来源:sId7 doubao历年试卷;(原卷无答案,据教材补)","priority":"重要","isRecall":false,"sourceId":7,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-1188","course":"天然药物化学","type":"选择","chapter":"1. 总论","number":"","title":"氧化铝适于分离哪类成分:","answerText":"","options":{"A":"酸性成分","B":"苷类","C":"中性成分","D":"碱性成分"},"answer":"D","mnemonic":"来源:sId7 doubao历年试卷;(原卷无答案,据教材补)","priority":"重要","isRecall":false,"sourceId":7,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-1189","course":"天然药物化学","type":"选择","chapter":"1. 总论","number":"","title":"有效成分是指","answerText":"","options":{"A":"需要提取的成分","B":"含量高的化学成分","C":"具有某种生物活性或治疗作用的成分","D":"主要成分"},"answer":"C","mnemonic":"来源:sId7 doubao历年试卷;(原卷无答案,据教材补)","priority":"重要","isRecall":false,"sourceId":7,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-1190","course":"天然药物化学","type":"选择","chapter":"1. 总论","number":"","title":"与水不相混溶的极性有机溶剂是:","answerText":"","options":{"A":"EtOH","B":"MeOH","C":"Me2 CO","D":"n-BuOH"},"answer":"D","mnemonic":"来源:sId7 doubao历年试卷;(原卷无答案,据教材补)","priority":"重要","isRecall":false,"sourceId":7,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-1191","course":"天然药物化学","type":"选择","chapter":"1. 总论","number":"","title":"判断一个化合物是否为新化合物,主要依据:","answerText":"","options":{"A":"《中药大辞典》","B":"《中国药学文摘》","C":"《美国化学文摘》"},"answer":"C","mnemonic":"来源:sId7 doubao历年试卷;(原卷无答案,据教材补)","priority":"重要","isRecall":false,"sourceId":7,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-425","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"","title":"pH梯度萃取法","answerText":"是指在分离过程中,逐渐改变溶剂的pH酸碱度来萃取有效成分或去除杂质的方法","options":{},"answer":"名词解释","mnemonic":"必背｜doubao习题汇总","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168175378,"suspect":false,"examProb":"必考"},{"id":"tr-426","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"","title":"有效成分","answerText":"有效成分是指经药理和临床筛选具有生物活性的单体化合物,能用结构式表示,并具一定物理常数","options":{},"answer":"名词解释","mnemonic":"必背｜doubao习题汇总","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168175379,"suspect":false,"examProb":"必考"},{"id":"tr-427","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"","title":"盐析法","answerText":"在水提取液中加入无机盐(如氯化钠)达到一定浓度时,使水溶性较小的成分沉淀析出,而与水溶性较大的成分分离的方法","options":{},"answer":"名词解释","mnemonic":"必背｜doubao习题汇总","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168175380,"suspect":false,"examProb":"必考"},{"id":"tr-428","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"","title":"有效部位","answerText":"有效成分的群体物质","options":{},"answer":"名词解释","mnemonic":"了解｜doubao习题汇总","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175381,"suspect":false,"examProb":"常考"},{"id":"tr-429","course":"天然药物化学","type":"名词解释记忆","chapter":"1. 总论","number":"","title":"渗漉法","answerText":"将药材粗粉用适当溶剂湿润膨胀后(多用乙醇),装入渗漉筒中从上边添加溶剂,从下口收集流出液的方法","options":{},"answer":"名词解释","mnemonic":"了解｜doubao习题汇总","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175382,"suspect":false,"examProb":"常考"},{"id":"tr-443","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"","title":"天然药物有效成分提取方法有几种?采用这些方法提取的依据是什么?","answerText":"1溶剂提取法:利用溶剂把天然药物中所需要的成分溶解出来,而对其它成分不溶解或少溶解。2水蒸气蒸馏法:利用某些化学成分具有挥发性,能随水蒸气蒸馏而不被破坏的性质。3升华法:利用某些化合物具有升华的性质","options":{},"answer":"简答题","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175396,"suspect":false,"examProb":"常考"},{"id":"tr-444","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"","title":"常用溶剂的亲水性或亲脂性的强弱顺序如何排列?哪些与水混溶?哪些与水不混溶?","answerText":"石油醚>苯>氯仿>乙醚>乙酸乙酯>正丁醇>丙酮>乙醇>甲醇>水 与水互不相溶 与水相混溶","options":{},"answer":"简答题","mnemonic":"了解｜doubao习题汇总｜巧记:亲水性溶剂——甲乙丙丁(甲醇/乙醇/丙酮/正丁醇)｜(答案待补,以教材为准)","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175397,"suspect":false,"examProb":"常考"},{"id":"tr-445","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"","title":"溶剂分几类?溶剂极性与ε值关系?","answerText":"溶剂分为极性溶剂和非极性溶剂或亲水性溶剂和亲脂性溶剂两大类。常用介电常数(ε)表示物质的极性。一般ε值大,极性强,在水中溶解度大,为亲水性溶剂,如乙醇;ε值小,极性弱,在水中溶解度小或不溶,为亲脂性溶剂,如苯","options":{},"answer":"简答题","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175398,"suspect":false,"examProb":"常考"},{"id":"tr-446","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"","title":"溶剂提取的方法有哪些?它们都适合哪些溶剂的提取?","answerText":"1浸渍法:水或稀醇为溶剂。2渗漉法:稀乙醇或水为溶剂。3煎煮法:水为溶剂。4回流提取法:用有机溶剂提取。5连续回流提取法:用有机溶剂提取","options":{},"answer":"简答题","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175399,"suspect":false,"examProb":"常考"},{"id":"tr-447","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"","title":"两相溶剂萃取法是根据什么原理进行?在实际工作中如何选择溶剂?","answerText":"利用混合物中各成分在两相互不相溶的溶剂中分配系数不同而达到分离的目的。实际工作中,在水提取液中有效成分是亲脂的多选用亲脂性有机溶剂如苯、氯仿、乙醚等进行液-液萃取;若有效成分是偏于亲水性的则改用弱亲脂性溶剂如乙酸乙酯、正丁醇等,也可采用氯仿或乙醚加适量乙醇或甲醇的混合剂","options":{},"answer":"简答题","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175400,"suspect":false,"examProb":"常考"},{"id":"tr-448","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"","title":"萃取操作时要注意哪些问题?","answerText":"1水提取液的浓度最好在相对密度2之间。2溶剂与水提取液应保持一定量比例。第一次用量为水提取液1/2~1/3,以后用量为水提取液1/4~1/6。3一般萃取3~4次即可。4用氯仿萃取,应避免乳化。可采用旋转混合,改用氯仿:乙醚混合溶剂等。若已形成乳化,应采取破乳措施","options":{},"answer":"简答题","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175401,"suspect":false,"examProb":"常考"},{"id":"tr-449","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"","title":"萃取操作中若已发生乳化,应如何处理?","answerText":"轻度乳化可用一金属丝在乳层中搅动。 将乳化层抽滤。 将乳化层加热或冷冻。 分出乳化层更换新的溶剂。 加入食盐以饱和水溶液或滴入数滴戊醇增加其表面张力,使乳化层破坏","options":{},"answer":"简答题","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175402,"suspect":false,"examProb":"常考"},{"id":"tr-450","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"","title":"色谱法的基本原理是什么?","answerText":"利用混合物中各成分在不同的两相中吸附、分配及其亲和力的差异而达到相互分离的方法","options":{},"answer":"简答题","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175403,"suspect":false,"examProb":"常考"},{"id":"tr-451","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"","title":"凝胶色谱原理是什么?","answerText":"凝胶色谱相当于分子筛的作用。凝胶颗粒中有许多网眼,色谱过程中,小分子化合物可进入网眼;大分子化合物被阻滞在颗粒外,不能进入网孔,所受阻力小,移动速度快,随洗脱液先流出柱外;小分子进入凝胶颗粒内部,受阻力大,移动速度慢,后流出柱外","options":{},"answer":"简答题","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175404,"suspect":false,"examProb":"常考"},{"id":"tr-452","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"","title":"如何判断天然药物化学成分的纯度?","answerText":"判断天然药物化学成分的纯度可通过样品的外观如晶形以及熔点、溶程、比旋度、色泽等物理常数进行判断。纯的化合物外观和形态较为均一,通常有明确的熔点,熔程一般应小于2°C;更多的是采用薄层色谱或纸色谱方法,一般要求至少选择在三种溶剂系统中展开时样品均呈单一斑点,方可判断其为纯化合物","options":{},"answer":"简答题","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175405,"suspect":false,"examProb":"常考"},{"id":"tr-454","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"","title":"在研究天然药物化学成分结构中,IR光谱有何作用?","answerText":"IR光谱在天然药物化学成分结构研究中具有如下作用:测定分子中的基团;已知化合物的确证;未知成分化学结构的推测与确定;提供化合物分子的几何构型与立体构象的研究信息","options":{},"answer":"简答题","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175407,"suspect":false,"examProb":"常考"},{"id":"tr-455","course":"天然药物化学","type":"简答记忆","chapter":"1. 总论","number":"","title":"简述紫外光谱图的表示方法及用文字表示的方法和意义","answerText":"紫外光谱(UV)的表示方法有两种:①图示法:以波长λ(nm)为横坐标、吸光度A(或摩尔吸光系数ε、logε)为纵坐标作图,得到吸收曲线,曲线上的吸收峰位置即最大吸收波长λmax;②文字表示法:用 λmax(溶剂)nm(logε) 的形式记录,如 λmax(EtOH)nm:240(4.05),其中注明所用溶剂、最大吸收波长及对应的logε值。意义:λmax反映分子中生色团及助色团等共轭体系的结构特征,logε反映该跃迁的强弱,据此可推断化合物结构类型及共轭程度。","options":{},"answer":"简答题","mnemonic":"重要｜doubao习题汇总｜据教材补","priority":"重要","isRecall":true,"sourceId":1,"addedAt":1780168175408,"suspect":false,"examProb":"常考"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"选择","title":"纸层析属于分配层析, 固定相为:()","options":{"A":"纤维素","B":"展开剂中极性较小的溶液","C":"展开剂中极性较大的溶液","D":"水"},"answer":"D","chapter":"1. 总论","isRecall":false,"answerText":"","mnemonic":"汇集各章习题(sId6)","id":"tr-996","number":"","priority":"重要","examProb":"了解"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"选择","title":"比水重的亲脂性有机溶剂有:","options":{"A":"CHCl3","B":"苯","C":"Et2 O","D":"石油醚"},"answer":"A","chapter":"1. 总论","isRecall":false,"answerText":"","mnemonic":"汇集各章习题(sId6)","id":"tr-998","number":"","priority":"重要","examProb":"了解"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"选择","title":"利用溶剂较少提取有效成分较完全的方法是 :","options":{"A":"连续回流法","B":"加热回流法","C":"渗漉法","D":"浸渍法"},"answer":"A","chapter":"1. 总论","isRecall":false,"answerText":"","mnemonic":"汇集各章习题(sId6)","id":"tr-999","number":"","priority":"重要","examProb":"了解"},{"id":"tr-051","course":"天然药物化学","type":"选择","chapter":"2. 糖和苷","number":"1","title":"最难被酸水解的是","answerText":"","options":{"A":"氧苷","B":"氮苷","C":"硫苷","D":"碳苷","E":"氰苷"},"answer":"D","mnemonic":"了解｜doubao习题汇总","priority":"了解","isRecall":false,"sourceId":1,"addedAt":1780168175002,"suspect":false,"examProb":"了解"},{"id":"tr-052","course":"天然药物化学","type":"选择","chapter":"2. 糖和苷","number":"2","title":"提取苷类成分时,为抑制或破坏酶常加入一定量的","answerText":"","options":{"A":"硫酸","B":"酒石酸","C":"碳酸钙","D":"氢氧化钠","E":"碳酸钠"},"answer":"C","mnemonic":"了解｜doubao习题汇总｜(答案存疑,以教材为准)","priority":"了解","isRecall":false,"sourceId":1,"addedAt":1780168175003,"suspect":false,"examProb":"了解"},{"id":"tr-053","course":"天然药物化学","type":"选择","chapter":"2. 糖和苷","number":"3","title":"提取药材中的原生苷,除了采用沸水提取外,还可选用","answerText":"","options":{"A":"热乙醇 60%~","B":"氯仿","C":"乙醚","D":"冷水","E":"酸水"},"answer":"A","mnemonic":"了解｜doub 空题","mnemonic":"了解｜doubao习题汇总","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175429,"suspect":false,"examProb":"常考"},{"id":"tr-472","course":"天然药物化学","type":"简答记忆","chapter":"2. 糖和苷","number":"","title":"苷键具有什么性质,常用哪些方法裂解?","answerText":"苷键是苷类分子特有的化学键,具有缩醛性质,易被化学或生物方法裂解。苷键裂解常用的方法有酸、碱催化水解法、酶催化水解法、氧化开裂法等","options":{},"answer":"简答题","mnemonic":"了解｜doubao习题汇总","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175430,"suspect":false,"examProb":"常考"},{"id":"tr-473","course":"天然药物化学","type":"简答记忆","chapter":"2. 糖和苷","number":"","title":"苷类的酸催化水解与哪些因素有关?水解难易有什么规律?","answerText":"苷类的酸催化水解与苷键原子的碱度(即苷键原子上的电子云密度及其空间环境)有关,有利于苷键原子质子化就有利于水解。水解难易规律:①按苷键原子不同,水解易难顺序为 N-苷>O-苷>S-苷>C-苷;②呋喃糖苷较吡喃糖苷易水解,酮糖苷较醛糖苷易水解;③吡喃糖苷中,吡喃环C-5上取代基越大越难水解,速率顺序为 五碳糖苷>甲基五碳糖苷>六碳糖苷>七碳糖苷>糖醛酸苷(C-5为-COOH的糖醛酸苷最难水解);④氨基糖较羟基糖难水解,羟基糖又较去氧糖难水解,易难顺序为 2,6-二去氧糖苷>2-去氧糖苷>6-去氧糖苷>2-羟基糖苷>2-氨基糖苷。","options":{},"answer":"简答题","mnemonic":"了解｜doubao习题汇总｜据教材补","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175431,"suspect":false,"examProb":"常考"},{"id":"tr-738","course":"天然药物化学","type":"名词解释记忆","chapter":"2. 糖和苷","number":"","title":"端基碳","answerText":"单糖成环后形成了一个新的手性碳原子,这个新的手性碳原子就是端基碳","options":{},"answer":"名词解释","mnemonic":"重要｜WCY整理｜WCY补充","priority":"重要","isRecall":true,"sourceId":3,"addedAt":1780168175995,"suspect":false,"examProb":"常考"},{"id":"tr-0747","course":"天然药物化学","type":"选择","chapter":"3. 苯丙素类化合物","number":"8","title":"Gibb’s 反应的试剂为( )","answerText":"","options":{"A":"没食子酸硫酸试剂","B":"2 , 6-二氯(溴)苯醌氯亚胺","C":"4-氨基安替比林-铁氰化钾","D":"三氯化铁—铁氰化钾","E":"醋酐—浓硫酸"},"answer":"B","mnemonic":"重要｜习题汇总含答案","priority":"重要","isRecall":false,"sourceId":5,"addedAt":1780232091991,"suspect":false,"examProb":"了解"},{"id":"tr-0748","course":"天然药物化学","type":"选择","chapter":"3. 苯丙素类化合物","number":"10","title":"香豆素的 lHNMR 中化学位移 3.8~4.0 处出现单峰,说明结构中含有( )","answerText":"","options":{"A":"羟基","B":"甲基","C":"甲氧基","D":"羟甲基","E":"醛基"},"answer":"C","mnemonic":"重要｜习题汇总含答案","priority":"重要","isRecall":false,"sourceId":5,"adde ","priority":"必背","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"必考"},{"id":"tr-0874","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":2,"title":"蒽醌类化合物分哪几类,举例说明。\n蒽醌类、蒽酚类、蒽酮类、二蒽酮类。","answerText":"蒽醌类分为\n(1)羟基蒽醌类,又分为大黄素型,如大黄素,茜素型如茜草素。\n(2)蒽酚.蒽酮类:为蒽醌的还原产物,如柯亚素。\n(3)二蒽酮和二蒽醌类:如番泻苷类。","options":{},"answer":"简答题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0875","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":3,"title":"为什么β-OH 蒽醌比“-OH 蒽醌的酸性大。\n答: 因为β-OH 与羰基处于同一个共轭体系中,受羰基吸电子作用的影响,使羟基上氧的电子云密度降低,质子容易解离,酸性较强。而“-OH 处在羰基的邻位,因产生分子内氢键,质子不易解离,故酸性较弱。","answerText":"因为β-OH 与羰基处于同一个共轭体系中,受羰基吸电子作用的影响,使羟基上氧的电子云密度降低,质子容易解离,酸性较强。而“-OH 处在羰基的邻位,因产生分子内氢键,质子不易解离,故酸性较弱。","options":{},"answer":"简答题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0876","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":4,"title":"比较下列蒽醌的酸性强弱,并利用酸性的差异分离他们,写出流程。\nA. 1, 4, 7-三羟基蒽醌\nB. 1, 5-二 OH-3-COOH 蒽醌\nC. 1, 8-二 OH 蒽醌\nD. 1-CH3 蒽醌","answerText":"酸性强弱顺序: B>A>C>D\n混 合 物 碱水液(含有 A)\n乙醚液 5%Na2CO3\n乙醚层 5%NaOH","options":{},"answer":"简答题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0877","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":5,"title":"用显色反应区别下列各组成分:\n(1)大黄素与大黄素-8-葡萄糖苷\n(2)番泻苷 A 与大黄素苷\n(3)蒽醌与苯醌\n答:\n醌类化合物分为四种类型: 有苯醌,如 2, 6-二甲氧基对苯醌; 萘醌,如紫草素; 菲醌,如丹参醌Ⅰ; 蒽醌,如大黄酸。\n萘醌\n±%Ő《\n·圧Ő《\nŸìŐ《","answerText":"(1)将二成分分别用乙醇溶解,分别加 Molish 试剂,产生紫色环的为大黄素-8-葡萄糖苷,不反应的为大黄素。\n(2) 将二成分分别加 5%的氢氧化钠溶液,溶解后溶液显红色的是大黄素苷,溶解后溶液不变红色的为番泻苷 A。\n(3)将二成分分别用乙醇溶解,分别滴于硅胶板上加无色亚甲蓝试剂,在白色背景上与呈现蓝色斑点为苯醌,另一个无反应的是蒽醌。","options":{},"answer":"简答题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"必考"},{"id":"tr-0952","course":"天然药物化学","type":"填空记忆","chapter":"4. 醌类化合物","number":"9 :"常考"},{"id":"tr-523","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"","title":"蒽醌类化合物分哪几类,举例说明","answerText":"蒽醌类化合物分哪几类,举例说明","options":{},"answer":"简答题","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175487,"suspect":false,"examProb":"常考"},{"id":"tr-524","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"","title":"为什么β-OH醌比a-OH醌的酸性大","answerText":"为什么β-OH醌比a-OH醌的酸性大","options":{},"answer":"简答题","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175488,"suspect":false,"examProb":"常考"},{"id":"tr-525","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"","title":"比较下列醌的酸性强弱,并利用酸性的差异分离他们,写出流程。 A.1,4,7-三羟基蒽醌 B.1,5-二OH-3","answerText":"比较下列醌的酸性强弱,并利用酸性的差异分离他们,写出流程。 A.1,4,7-三羟基蒽醌 B.1,5-二OH-3-COOH蒽醌 C.1,8-二OH蒽醌 D.1-CH3蒽醌","options":{},"answer":"简答题","mnemonic":"重要｜doubao习题汇总","priority":"重要","isRecall":true,"sourceId":1,"addedAt":1780168175489,"suspect":false,"examProb":"常考"},{"id":"tr-526","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"","title":"用显色反应区别下列各组成分: (1)大黄素与大黄素-8-葡萄糖苷 (2)番泻苷A与大黄素苷 (3)蒽配与苯醌","answerText":"(1)大黄素 vs 大黄素-8-O-葡萄糖苷：醋酸镁反应均阳性(橙红);但游离大黄素能溶于乙醚并被5%碳酸氢钠萃取(显红),其葡萄糖苷因极性大、酸性弱不被碳酸氢钠萃取——可用碱梯度萃取/纸色谱Rf区别。(2)番泻苷A 属二蒽酮苷,加酸水解再氧化可显蒽醌反应;Bornträger(碱液显红)用于区别蒽醌类。关键:游离羟基蒽醌遇碱显红(Bornträger反应),苷与苷元用碳酸氢钠/碳酸钠/氢氧化钠pH梯度区别酸性强弱。","options":{},"answer":"简答题","mnemonic":"必背｜doubao习题汇总","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168175490,"suspect":false,"examProb":"必考"},{"id":"tr-527","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"","title":"醌类化合物分为四种类型:有苯醌,如2,6-二甲氧基对苯醌;萘醌,如紫草素;菲醌,如丹参醌I;蒽醌,如大黄酸","answerText":"醌类化合物分为四种类型:有苯醌,如2,6-二甲氧基对苯醌;萘醌,如紫草素;菲醌,如丹参醌I;蒽醌,如大黄酸","options":{},"answer":"简答题","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175491,"suspect":false,"examProb":"必考"},{"id":"tr-528","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"","title":"蒽醌类分为 (1)羟基醌类,又分为大黄素型,如大黄素,茜素型如茜草素。 (2)蒽酚.蒽酮类:为蒽醌的还原产物,","answerText":"蒽醌类分为 (1)羟基醌类,又分为大黄素型,如大黄素,茜素型如茜草素。 (2)蒽酚.蒽酮类:为蒽醌的还原产物,如柯亚素。 (3)二蒽酮和二蒽类:如番泻苷类","options":{},"answer":"简答题","mnemonic":"必背｜doubao习题汇总","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168175492,"suspect":false,"examProb":"必考"},{"id":"tr-529","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"","title":"答因为β-OH与羰基处于同一个共轭体系中,受羰基吸电子作用的影响,使羟基上氧的电子云密度降低,质子容易解离,酸","answerText":"答因为β-OH与羰基处于同一个共轭体系中,受羰基吸电子作用的影响,使羟基上氧的电子云密度降低,质子容易解离,酸性较强。而a-OH处在羰基的邻位,因产生分子内氢键,质子不易解离,故酸性较弱","options":{},"answer":"简答题","mnemonic":"了解｜doubao习题汇总","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175493,"suspect":false,"examProb":"常考"},{"id":"tr-530","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"","title":"答:酸性强弱顺序:B>A>C>D 乙醚液 5%NaHCO3→乙醚层 5%NaOH","answerText":"答:酸性强弱顺序:B>A>C>D 乙醚液 5%NaHCO3→乙醚层 5%NaOH","options":{},"answer":"简答题","mnemonic":"重要｜doubao习题汇总｜(答案待补,以教材为准)","priority":"重要","isRecall":true,"sourceId":1,"addedAt":1780168175494,"suspect":false,"examProb":"常考"},{"id":"tr-531","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"","title":"答: (1)将二成分分别用乙醇溶解,分别加Molish试剂,产生紫色环的为大黄素-8-葡萄糖苷,不反应的为大黄","answerText":"答: (1)将二成分分别用乙醇溶解,分别加Molish试剂,产生紫色环的为大黄素-8-葡萄糖苷,不反应的为大黄素。 (2)将二成分分别加5%的氢氧化钠溶液,溶解后溶液显红色的是大黄素苷,溶解后溶液不变红色的是潘泻苷A。 (3)将二成分分别用乙醇溶解,分别滴于硅胶板上加无色亚甲蓝试剂,在白色背景上与呈现蓝色斑点为苯醒,另一个无反应的是蒽醌","options":{},"answer":"简答题","mnemonic":"必背｜doubao习题汇总","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168175495,"suspect":false,"examProb":"必考"},{"id":"tr-532","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"","title":"某中药主要含有大黄酸、大黄素、大黄素甲醚,三种成分的氧苷试完成下列问题。 (1)如何鉴定药材中含有该类成分?","answerText":"某中药主要含有大黄酸、大黄素、大黄素甲醚,三种成分的氧苷试完成下列问题。 (1)如何鉴定药材中含有该类成分? (2)试设计从该中药中提取、分离三种苷元的流程","options":{},"answer":"简答题","mnemonic":"必背｜doubao习题汇总","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168175496,"suspect":false,"examProb":"必考"},{"id":"tr-533","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"","title":"某中药中含有下列成分,试提取并分离出其中的蒽醌类成分 (4)树胶 (5)蛋白质 (6)淀粉 (7)氨基酸","answerText":"某中药中含有下列成分,试提取并分离出其中的蒽醌类成分 (4)树胶 (5)蛋白质 (6)淀粉 (7)氨基酸","options":{},"answer":"简答题","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175497,"suspect":false,"examProb":"常考"},{"id":"tr-534","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"","title":"中药虎杖中含有大黄素、大黄酚、大黄素甲醚、大黄素-8-D-葡萄糖苷、大黄素甲醚-8-D-葡萄糖苷、白蒙芦醇、白","answerText":"中药虎杖中含有大黄素、大黄酚、大黄素甲醚、大黄素-8-D-葡萄糖苷、大黄素甲醚-8-D-葡萄糖苷、白蒙芦醇、白藜芦醇葡萄糖苷等成分,试设计从虎杖中提取分离游离醒的流程","options":{},"answer":"简答题","mnemonic":"必背｜doubao习题汇总","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168175498,"suspect":false,"examProb":"必考"},{"id":"tr-535","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"","title":"中药萱草根中含有大黄酸、大黄酚、决明意、决明意型甲醛、β谷笛醇等成分,试设计提取分离流程","answerText":"系统溶剂法+pH梯度萃取:①药材乙醇(或乙醚)提取得总蒽醌;②乙醚液依次用5%NaHCO₃→5%Na₂CO₃→1%NaOH→5%NaOH梯度萃取,按酸性强弱分离:大黄酸(含-COOH,酸性最强)入NaHCO₃层;含β-酚OH(如大黄素)入Na₂CO₃层;仅含α-酚OH者需NaOH;③β-谷甾醇为亲脂性甾醇,留乙醚层,经硅胶柱色谱分离。利用游离蒽醌酸性差异(COOH>2个β-OH>1个β-OH>α-OH)实现分离。","options":{},"answer":"简答题","mnemonic":"必背｜doubao习题汇总","priority":"必背","isRecall":true,"sourceId":1,"addedAt":1780168175499,"suspect":false,"examProb":"必考"},{"id":"tr-540","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"","title":"5%氢氧化钠水溶液呈深红色:示有羟基蒽醌类","answerText":"5%氢氧化钠水溶液呈深红色:示有羟基蒽醌类","options":{},"answer":"简答题","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175506,"suspect":false,"examProb":"常考"},{"id":"tr-541","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number":"","title":"a-萘酚-浓硫酸阴性:示有不是苷类物质","answerText":"a-萘酚-浓硫酸阴性:示有不是苷类物质","options":{},"answer":"简答题","mnemonic":"了解｜doubao习题汇总｜(答案待补,以教材为准)","priority":"了解","isRecall":true,"sourceId":1,"addedAt":1780168175507,"suspect":false,"examProb":"常考"},{"id":"tr-542","course":"天然药物化学","type":"简答记忆","chapter":"4. 醌类化合物","number": 强度取决于黄酮类化合物 , 以及溶剂与黄酮类化合物或与聚酰胺之间形成氢键缔合能力大小。常用 混合溶剂作为洗脱剂,不同类型黄酮类化合物在聚酰胺柱上先后流出顺序为: > > > 。","options":{},"answer":"填空题","mnemonic":" [合并自tr-573(sId1)]","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"必考"},{"id":"tr-0884","course":"天然药物化学","type":"填空记忆","chapter":"5. 黄酮类化合物","number":13,"title":"黄芩苷;抗菌消炎;邻三酚羟基;醌类;酶解;氧化。","answerText":"黄芩根中分离出黄酮类的主要有效成分是 具有 作用。黄芩素分子中具有 的结构,性质不稳定,易被氧化成 化合物而变绿色。因此在保存、炮制、提取时应注意防止 和 。","options":{},"answer":"填空题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0885","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":4,"title":"试述二氢黄酮.异黄酮.花色素水溶液性比黄酮大的原因。","answerText":"二氢黄酮(醇)由于 C 环被氢化成近似半椅式结构,破坏了分子的平面性,受\n吡喃环羰基立体结构的阻碍,平面性降低,水溶性增大;花色素虽为平面结构,但以离子形式存在,具有盐的通性,所以水溶性较大。","options":{},"answer":"简答题","mnemonic":" [合并自tr-589(sId1)]","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0886","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":7,"title":"根据下列流程,指出划线部分的作用,并回答相关问题\n槐花粗粉\n芸香苷结晶\n(1)流程中采用的提取方法与依据是什么?\n(2)提取液中加入 0.4%硼砂水的目的?\n(3)以石灰乳调 pH8~9 的目的?如果 pH>12 以上会造成什么结果?\n(4)酸化时加盐酸为什么控制 pH 在 4-5?如果 pH<2 以上会造成什么结果?\n(5)以热水或乙醇重结晶的依据?提取芸香苷还可以采用什么方法?","answerText":"(1)流程中采用的提取方法是:碱提取酸沉淀法依据:芸香苷显酸性可溶于碱水。\n(2)提取液中加入 0.4%硼砂水的目的:硼砂可以与邻二羟基络合,保护邻二羟基不被氧化。\n(3)以石灰乳调pH8~9 的目的: 芸香苷含有 7-OH, 4, -OH,碱性较强可以溶于pH8~9 的碱水中。如果 pH>12 以上,碱性太强,钙离子容易与羟基、羰基形成难溶于水的鳌合物,降低收率。\n(4)酸化时加盐酸为什么控制 pH 在4-5 足以是芸香苷析出沉淀,如果 pH<2 以上容易使芸香苷的醚键形成金羊盐,不易析出沉淀。\n(5) 以热水或乙醇重结晶的依据是:芸香苷在热水和热乙醇中溶解度较大,在冷水及冷乙醇中溶解度较小的原因。提取芸香苷还可以采用乙醇回流提取法。","options":{},"answer":"简答题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0949","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"6","title":"黄酮类化合物与金属盐试剂的显色反应","answerText":"①铝盐:常用1%三氯化铝或硝酸铝溶液,生成黄色络合物并有荧光,可用于定性及定量。②铅盐:常用1%中性醋酸铅及碱式醋酸铅水溶液,生成黄~红色沉淀,一般酚羟基化合物均可沉淀,用于鉴定、提取分离。③锆盐(ZrOCl₂):黄酮分子中有游离3-或5-羟基时生成黄色络合物,但加入枸橼酸后5-羟基黄酮酮颜色褪去、3-羟基黄酮酮颜色不变(锆-枸橼酸反应,可区分3-OH与5-OH)。④镁盐:常用醋酸镁甲醇溶液,二氢黄酮、二氢黄酮醇显天蓝色荧光,黄酮、黄酮醇及异黄酮显黄~橙黄~褐色。⑤锶盐:常用氯化锶的碱性甲醇溶液,用于鉴别具邻二酚羟基的化合物。","options":{},"answer":"简答题","mnemonic":"必背｜星空历年真题","priority":"必背","isRecall":true,"sourceId":4,"addedAt":1780232235676,"suspect":false,"examProb":"必考"},{"id":"tr-0961","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"103","title":"黄酮类化合物的化学检识(Mg-HCl等)与UV解析思路","answerText":"化学检识:Mg-HCl反应(盐酸-镁粉)阳性、FeCl₃反应阳性→含酚羟基的黄酮类;Molish反应阴性→不含糖;ZrOCl₂-枸橼酸呈黄色后褪色→有游离5-OH、无游离3-OH;SrCl₂阴性→不具邻位酚羟基。UV(加诊断试剂):带Ⅰ~328nm证实黄酮;NaOMe带Ⅰ红移~51nm示4'-OH;NaOAc带Ⅱ红移~12nm示游离7-OH;NaOAc/H₃BO₃带Ⅰ、Ⅱ无变化示无邻二酚羟基。综合可推得如5,7-二羟基-4'-OMe-黄酮。","options":{},"answer":"简答题","mnemonic":"必背｜星空历年真题","priority":"必背","isRecall":true,"sourceId":4,"addedAt":1780232269784,"suspect":false,"examProb":"必考"},{"id":"tr-0962","course":"天然药物化学","type":"简答记忆","chapter":"5. 黄酮类化合物","number":"104","title":"黄酮¹H-NMR解析(活泼氢与芳环质子)","answerText":"¹H-NMR:δ12.91(1H,s,OH)、10.85(1H,s,OH)示两个游离酚羟基;δ8.03(2H,d,J=8.8Hz)、7.10(2H,d,J=8.8Hz)为B环质子,B环为1,4-二取代;δ6.86(1H,s)、6.47(1H,d,J=1.8Hz)、6.19(1H,d,J=1.8Hz)为A环质子,J=1.8Hz示间位偶合。结合UV可定结构。","options":{},"answer":"简答题","mnemonic":"必背｜星空历年真题","priority":"必背","isRecall":true,"sourceId":4,"addedAt":1780232269785,"suspect":false,"examProb":"必考"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"选择","title":"黄酮类化合物的紫外光谱中,峰带 I 很强,而带酮很弱的化合物是","options":{"A":"查耳酮","B":"异黄酮","C":"黄酮醇","D":"黄酮"},"answer":"A","chapter":"5. 黄酮类化合物","isRecall":false,"answerText":"","mnemonic":"汇集各章习题(sId6)","id":"tr-1018","number":"","priority":"重要","examProb":"了解"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"选择","title":"在黄酮、黄酮醇的UV光谱中, 若“样品+AlCl3/HCl”的光谱等于“样品+MeOH”的光谱,则表明结构中:","options":{"A":"无3-OH或5-OH (或均被取代)","B":"有3-OH,无5-OH","C":"有3-OH或5-OH","D":"有5-OH,无3-OH"},"answer":"A","chapter":"5. 黄酮类化合物","isRecall":false,"answerText":"","mnemonic":"汇集各章习题(sId6);(原卷答案疑误,已据教材订正:原对→正A)","id":"tr-1019","nu 的薄层色谱法检识挥发油中各成分时, 为什么第一次展开所用的展开剂极性最好大于第二次展开所用的展开剂极性?","answerText":"单向二次展开先用极性稍强的展开剂进行第一次展层, 当展开剂展至薄层板的一半距离时停止, 立即挥去薄层板上的溶剂。此时挥发油中极性较大的成分被分离展开,再改换极性较小的展开剂作第二次展层,极性较小的成分则被展开到终端,从而可使极性小的成分更好地分离展开,达到在一块薄层板上实现极性大小不同的多种成分都得到较好分离的目的。","options":{},"answer":"简答题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0901","course":"天然药物化学","type":"简答记忆","chapter":"6. 萜类与挥发油","number":6,"title":"为什么可用相对密度小于 1.0 的挥发油测定器测定相对密度大于 1.0 的挥发油含量?","answerText":"测定相对密度大于 1.0 的挥发油,也可在相对密度小于 1.0 的测定器中进行。关键是在加热前,预先加入 1ml 二甲苯于测定器内, 然后再进行水蒸气蒸馏, 使蒸出的相对密度大于 1.0 的挥发油溶于二甲苯中。由于二甲苯的相对密度为0.8969,一般能使挥发油与二甲苯的混合溶液浮于水面.在计算挥发油的含量时,扣除加入二甲苯的体积即可。","options":{},"answer":"简答题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0947","course":"天然药物化学","type":"名词解释记忆","chapter":"6. 萜类与挥发油","number":"3","title":"萜类(定义)","answerText":"由甲戊二羟酸衍生,分子式符合(C₅H₈)n通式的衍生物。","options":{},"answer":"名词解释","mnemonic":"必背｜星空历年真题","priority":"必背","isRecall":true,"sourceId":4,"addedAt":1780232235673,"suspect":false,"examProb":"必考"},{"id":"tr-0953","course":"天然药物化学","type":"填空记忆","chapter":"6. 萜类与挥发油","number":"10","title":"青蒿素的意义","answerText":"青蒿素是从黄花蒿中分离的倍半萜过氧化物抗疟药,屠呦呦因此获诺贝尔生理学或医学奖(填空考点:青蒿素—诺贝尔)。","options":{},"answer":"填空题","mnemonic":"必背｜星空历年真题","priority":"必背","isRecall":true,"sourceId":4,"addedAt":1780232235680,"suspect":false,"examProb":"必考"},{"id":"tr-0957","course":"天然药物化学","type":"填空记忆","chapter":"6. 萜类与挥发油","number":"14","title":"紫杉醇","answerText":"紫杉醇是从红豆杉中分离的二萜类抗癌药(填空考点:紫杉醇—二萜—抗癌)。","options":{},"answer":"填空题","mnemonic":"必背｜星空历年真题","priority":"必背","isRecall":true,"sourceId":4,"addedAt":1780232235684,"suspect":false,"examProb":"必考"},{"id":"tr-0958","course":"天然药物化学","type":"简答记忆","chapter":"6. 萜类与挥发油","number":"100","title":"写出化合物结构类型及活性(紫杉醇/青蒿素/大黄素/小檗碱/齐墩果酸)","answerText":"化合物A=紫杉醇,二萜类(萜类),抗癌药;B=青蒿素,倍半萜类(萜类),抗疟药;C=大黄素,蒽醌类(醌类),抗肿瘤/抗菌/免疫抑制/利尿;D=小檗碱(黄连素),异喹啉类生物碱,抗菌消炎药;E=齐墩果酸,三萜类,抗肝炎药。","options":{},"answer":"简答题","mnemonic":"必背｜星空历年真题","priority":"必背","isRecall":true,"sourceId":4,"addedAt":1780232269781,"suspect":false,"examProb":"必考"},{"id":"tr-0959","course":"天然药物化学","type":"简答记忆","chapter":"6. 萜类与挥发油","number":"101","title":"生源的异戊二烯法则与经验的异戊二烯法则","answerText":"生源的异戊二烯法则:自然界存在的萜类化合物是经甲戊二羟酸(MVA)途径衍生的一类化合物。经验的异戊二烯法则:自然界的萜类由异戊二烯演变而来,是异戊二烯的聚合物或衍生物,并以是否符合异戊二烯法则作为判断是否为萜类化合物的一个重要原则。","options":{},"answer":"简答题","mnemonic":"必背｜星空历年真题","priority":"必背","isRecall":true,"sourceId":4,"addedAt":1780232269782,"suspect":false,"examProb":"必考"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"选择","title":"对于含挥发性成分的药材进行水提取时,应采取的方法是:","options":{"A":"回流提取法","B":"先进行水蒸气蒸馏再煎煮","C":"煎煮法","D":"溶剂提取法"},"answer":"B","chapter":"6. 萜类与挥发油","isRecall":false,"answerText":"","mnemonic":"汇集各章习题(sId6)","id":"tr-1007","number":"","priority":"重要","examProb":"了解"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"选择","title":"组成挥发油最主要的成分是","options":{"A":"脂肪族化合物","B":"芳香族化合物","C":"单萜、倍半萜及其含氧衍生物","D":"含硫化合物"},"answer":"B","chapter":"6. 萜类与挥发油","isRecall":false,"answerText":"","mnemonic":"汇集各章习题(sId6)","id":"tr-1041","number":"","priority":"重要","examProb":"了解"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"选择","title":"环烯醚萜类多以哪种形怯存在:","options":{"A":"酯","B":"游离","C":"苷","D":"萜源功能基"},"answer":"A","chapter":"6. 萜类与挥发油","isRecall":false,"answerText":"","mnemonic":"汇集各章习题(sId6)","id":"tr-1042","number":"","priority":"重要","examProb":"了解"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"选择","title":"下列中草药均含环烯醚萜成分,除哪种外","options":{"A":"玄参","B":"桅子","C":"地黄","D":"甘草"},"answer":"D","chapter":"6. 萜类与挥发油","isRecall":false,"answerText":"","mnemonic":"汇集各章习题(sId6)","id":"tr-1043","number":"","priority":"重要","examProb":"了解"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"选择","title":"中草药中地黄、玄参、栀子中的主要成分是","options":{"A":"黄酮类","B": ype":"名词解释记忆","chapter":"8. 甾体及其苷类","number":1,"title":"甾体皂苷","answerText":"甾体皂苷 (steroidal saponins): 是一类由螺甾烷类化合物衍生的寡糖苷。","options":{},"answer":"名词解释","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0914","course":"天然药物化学","type":"名词解释记忆","chapter":"8. 甾体及其苷类","number":2,"title":"次皂苷","answerText":"次皂苷:皂苷糖链部分水解产物或双糖链皂苷水解成单糖链皂苷均称为次皂苷。","options":{},"answer":"名词解释","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0915","course":"天然药物化学","type":"名词解释记忆","chapter":"8. 甾体及其苷类","number":3,"title":"中性皂苷","answerText":"中性皂苷:分子中无羧基的皂苷,常指甾体皂苷。","options":{},"answer":"名词解释","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0916","course":"天然药物化学","type":"名词解释记忆","chapter":"8. 甾体及其苷类","number":4,"title":"单糖链皂苷","answerText":"单糖链皂苷:皂苷元上连接一条糖链的皂苷。","options":{},"answer":"名词解释","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0917","course":"天然药物化学","type":"名词解释记忆","chapter":"8. 甾体及其苷类","number":5,"title":"双糖链皂苷","answerText":"双糖链皂苷:皂苷元上连接两条糖链的皂苷。","options":{},"answer":"名词解释","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0918","course":"天然药物化学","type":"名词解释记忆","chapter":"8. 甾体及其苷类","number":6,"title":"强心苷","answerText":"强心苷:是生物界中一类对心脏具有显著生物活性的甾体苷类化合物。","options":{},"answer":"名词解释","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0919","course":"天然药物化学","type":"名词解释记忆","chapter":"8. 甾体及其苷类","number":8,"title":"乙型强心苷元(海葱甾烯或蟾酥甾烯)","answerText":"乙型强心苷元(海葱甾烯或蟾酥甾烯): C17 位连接的是六元不饱和内酯(△ α(β), Y(δ)-δ-内酯)环称为海葱甾烯或蟾酥甾烯。由 24 个碳原子组成。","options":{},"answer":"名词解释","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0920","course":"天然药物化学","type":"填空记忆","chapter":"8. 甾体及其苷类","number":1,"title":"去乙酰毛花洋地黄苷丙是从 叶子中提取的,它的商品名是 。经过 解可以进一步获得临床上应用的狄高辛。","answerText":"毛花洋地黄,西地兰,酶。","options":{},"answer":"填空题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0921","course":"天然药物化学","type":"填空记忆","chapter":"8. 甾体及其苷类","number":2,"title":"甾体皂苷除了本身的药用价值外,其苷元可以作为 原料。","answerText":"合成激素类药物(或甾体类药物)。","options":{},"answer":"填空题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0922","course":"天然药物化学","type":"简答记忆","chapter":"8. 甾体及其苷类","number":1,"title":"如何用 IR 区分甾体皂苷中的 C25 的构型?","answerText":"螺甾烷醇型皂苷IR在**980、920、900、860 cm⁻¹**附近有四特征带(E/F环缩酮)。其中**920(B带)与900(A带)两峰相对强度**区分C25构型:**25R(异螺甾烷醇型)A<B**(900<920);**25S(螺甾烷醇型)A>B**(900>920)。","options":{},"answer":"简答题","mnemonic":" [答案据教材手写补全]","priority":"必背","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"必考"},{"id":"tr-0923","course":"天然药物化学","type":"简答记忆","chapter":"8. 甾体及其苷类","number":2,"title":"写出分离螺甾烷醇型皂苷与呋甾烷醇型皂苷的流程。","answerText":"利用呋甾烷醇型的**特异显色**与极性差异分离:①总皂苷正丁醇萃取后经**硅胶柱色谱**分离;②**Ehrlich试剂**(对二甲氨基苯甲醛)喷雾,**呋甾烷醇型显红色**(F环开链C22-OH),**螺甾烷醇型不显色**;③呋甾烷醇型极性大(多糖+C22-OH),色谱中Rf小,先洗下螺甾烷醇型,后洗呋甾烷醇型。","options":{},"answer":"简答题","mnemonic":" [答案据教材手写补全]","priority":"必背","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"必考"},{"id":"tr-0924","course":"天然药物化学","type":"简答记忆","chapter":"8. 甾体及其苷类","number":3,"title":"甾体皂苷的基本结构是什么?可分为几种类型,各自结构有何特征?","answerText":"甾体皂苷由**螺甾烷类化合物**与糖缩合而成,苷元为27个碳的螺甾烷醇衍生物(含A-F六环,E、F环以螺缩酮形式相连)。按C25构型及F环是否成环分四类:①**螺甾烷醇型**(25S,F环闭环);②**异螺甾烷醇型**(25R);③**呋甾烷醇型**(F环开链,C22-OH);④**变形螺甾烷醇型**。多数无C3-COOH,故多为中性皂苷;无强心苷的不饱和内酯环。","options":{},"answer":"简答题","mnemonic":" [答案据教材手写补全]","priority":"必背","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"必考"},{"id":"tr-0925","course":"天然药物化学","type":"简答记忆","chapter":"8. 甾体及其苷类","number":7,"title":"提取强心苷原生苷时应注意哪几方面因素?","answerText":"提取**原生苷**(一级苷)关键是**抑制酶解和酸碱水解**:①新鲜药材**及时干燥或冷冻**,迅速破坏共存水解酶;②可加**硫酸铵**等使酶失活;③**忌用酸、碱**及长时间加热(防苷键及内酯环水解);④多用**>70%乙醇**冷浸或渗漉;⑤铅盐沉淀除杂时条件温和。","options":{},"answer":"简答题","mnemonic":" [答案据教材手写补全]","priority":"必背","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"必考"},{"id":"tr-0926","course":"天然药物化学","type":"简答记忆","chapter":"8. 甾体及其苷类","number":8,"title":"命名下列化合物:\n洋地黄毒苷元 乌本苷元 海葱苷元","answerText":"(强心苷元命名题)依甲型/乙型判断:**洋地黄毒苷元**(digitoxigenin,甲型,C3β-OH、C14β-OH、C17接Δαβ-五元不饱和内酯);**乌本苷元**(ouabagenin,甲型,多羟基);**海葱苷元**(scillarenin,**乙型**,C17接六元双烯δ-内酯)。命名要点:标明甾核羟基位置与构型及内酯环类型(甲型五元单烯/乙型六元双烯)。","options":{},"answer":"简答题","mnemonic":" [答案据教材手写补全]","priority":"必背","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"必考"},{"id":"tr-0927","course":"天然药物化学","type":"简答记忆","chapter":"8. 甾体及其苷类","number":9,"title":"以反应式表示:由毛花洋地黄苷丙 (C)制备临床上应用的强心苷类药物西地兰和狄戈辛。","answerText":"毛花洋地黄苷丙(lanatoside C)经**碱性水解脱去C16乙酰基并脱末端葡萄糖**生成**西地兰**(去乙酰毛花苷,deslanoside);西地兰经**温和酸水解**调整糖链得**狄戈辛**(digoxin,狄戈辛元+3洋地黄毒糖)。要点:①脱乙酰(碱);②脱葡萄糖;③控制水解保留3去氧糖。","options":{},"answer":"简答题","mnemonic":" [答案据教材手写补全]","priority":"必背","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"必考"},{"id":"tr-0928","course":"天然药物化学","type":"简答记忆","chapter":"8. 甾体及其苷类","number":10,"title":"影响强心苷水溶性的因素有哪些?","answerText":"强心苷水溶性取决于**糖的数目和苷元上羟基的数目与位置**:①**糖基越多**水溶性越大;②苷元上**羟基越多**亲水性越强;③糖基为**羟基糖**(如葡萄糖)比**去氧糖**(如洋地黄毒糖)更亲水;④羟基若形成**分子内氢键**则水溶性下降。原生苷一般比次生苷、苷元更易溶于水。","options":{},"answer":"简答题","mnemonic":" [答案据教材手写补全]","priority":"必背","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"必考"},{"id":"tr-0950","course":"天然药物化学","type":"简答记忆","chapter":"8. 甾体及其苷类","number":"7","title":"强心苷的定义及甲型、乙型的区别","answerText":"强心苷是存在于植物中具有强心作用的甾体苷类化合物,由强心苷元和糖两部分构成。根据苷元C17位侧链不同分为:侧链为五元不饱和内酯环(Δαβ-γ-内酯)的甲型强心苷,和侧链为六元不饱和内酯环(Δαβ,γδ-δ-内酯)的乙型强心苷。","options":{ 碱碱性最强的是(a )","answerText":"","options":{"A":"莨菪碱","B":"东莨菪碱","C":"山莨菪碱","D":"N-去甲基莨菪碱","E":"樟柳碱"},"answer":"A","mnemonic":"重要｜习题汇总含答案","priority":"重要","isRecall":false,"sourceId":5,"addedAt":1780232092308,"suspect":false,"examProb":"了解"},{"id":"tr-0812","course":"天然药物化学","type":"选择","chapter":"9. 生物碱","number":"12","title":"生物碱的含义哪项是错误的( )","answerText":"","options":{"A":"自然界一类含氮有机物","B":"多具有杂环结构","C":"都显示碱性","D":"大多与酸成盐","E":"多具有生物活性"},"answer":"C","mnemonic":"重要｜习题汇总含答案","priority":"重要","isRecall":false,"sourceId":5,"addedAt":1780232092314,"suspect":false,"examProb":"了解"},{"id":"tr-0929","course":"天然药物化学","type":"名词解释记忆","chapter":"9. 生物碱","number":1,"title":"生物碱","answerText":"生物碱:是天然产的一类含氮有机化合物,大多数具有氮杂环结构,呈碱性并有较强的生物活性。","options":{},"answer":"名词解释","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0930","course":"天然药物化学","type":"名词解释记忆","chapter":"9. 生物碱","number":2,"title":"两性生物碱\n(一)单项","answerText":"两性生物碱:分子中有酚羟基和羧基等酸性基团的生物碱。","options":{},"answer":"名词解释","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0931","course":"天然药物化学","type":"填空记忆","chapter":"9. 生物碱","number":1,"title":"氮原子中孤对电子, pKa, pKa,强。","answerText":"氮原子中孤对电子, pKa , pKa,强。","options":{},"answer":"填空题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0932","course":"天然药物化学","type":"简答记忆","chapter":"9. 生物碱","number":1,"title":"从黄连中提取小檗碱的实验流程如下,根据流程回答下列问题。\n黄连粗粉\n盐酸黄连素\n(1)写出小檗碱的分子结构式。\n(2)指出划线部分操作的目的是什么?\n①用 0.5%H2SO 提取\n②超声处理 30min\n③盐酸调 pH2\n④加 6%食盐","answerText":"(1)小檗碱的结构式。\n(2)划线部分操作的目的是:\n①用 0.5%H2SO 提取是因为硫酸小檗碱的水溶性 (1 :30)较大,所以用硫酸水提取。\n②超声处理 30min,在于超声波的作用,使生物碱提取更完全。\n③盐酸调 pH2,因为盐酸小檗碱的水中溶解度 (1 :500)较小,容易析出沉淀。\n④加 6%食盐,通过盐析,使小檗碱更容易快速析出沉淀。","options":{},"answer":"简答题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0933","course":"天然药物化学","type":"简答记忆","chapter":"9. 生物碱","number":2,"title":"根据流程回答问题\n(1)写出以离子交换树脂法纯化生物碱酸水提取液的原理\n(2)酸水渗漉时渗漉液的 pH 变化情况如何?\n(3)划线部分的目的:","answerText":"根据流程回答问题\n(1)离子交换树脂法纯化生物碱酸水提取液的原理:\n交换原理: R-SO3-H++BH+ —→ R-SO3-BH+ + H+\n碱化原理: R-SO3-BH++ NH4OH —→ R-SO3-NH4++B+H2O\n(2)酸水渗漉时渗漉液的 pH 变化情况:\n开始渗漉时 pH4~5,继续渗漉有生物碱交换在树脂上,树脂柱流出液 pH1~2,当树脂交换饱和时,流出液 pH4~5。\n(3)划线部分的目的:\n①纯化水冲至澄明,抽滤,室温风干:如果树脂较湿,提取时石油醚不易穿透树脂表面的水化膜,影响提取效果。\n②洗脱至碘化铋钾试剂呈阴性。是说明生物碱提取完全,可以停止回流。","options":{},"answer":"简答题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0934","course":"天然药物化学","type":"简答记忆","chapter":"9. 生物碱","number":3,"title":"某豆科植物的种子, 经过石油醚充分脱脂后的乙醇提取液浓缩液中主要含有 A、B、C、D 四种成分以及水溶性杂质,将该提取液点样在 pH 缓冲纸色谱上,以水饱和的氯仿展开显色后,将每个成分的斑点连成线结果如下图。\n试回答下列问题;\n⑴A、B、C、D 分别属于哪一类成分?\nA B C D \nx比较 A、B 的 pKa 大小顺序\npKa: >","answerText":"试回答下列问题:\n⑴ A 、B 、C 、D 分别属于哪一类成分?\nA 弱碱 B 中强碱 C 酚性生物碱 D 酸性成分 \nx 比较 A 、B 的 pKa 大小顺序pKa: B > A","options":{},"answer":"简答题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0956","course":"天然药物化学","type":"填空记忆","chapter":"9. 生物碱","number":"13","title":"生物碱的存在形式","answerText":"生物碱在植物体内存在形式有:游离碱类、盐类、N-氧化物类;提取分离常利用其电子效应和空间效应。","options":{},"answer":"填空题","mnemonic":"必背｜星空历年真题","priority":"必背","isRecall":true,"sourceId":4,"addedAt":1780232235683,"suspect":false,"examProb":"必考"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"选择","title":"碱性最强的生物碱是","options":{"A":"季胺碱","B":"叔胺碱","C":"仲胺碱","D":"伯胺碱"},"answer":"A","chapter":"9. 生物碱","isRecall":false,"answerText":"","mnemonic":"汇集各章习题(sId6)","id":"tr-1056","number":"","priority":"重要","examProb":"了解"},{"course":"天然药物化学","sourceId":6,"addedAt":"2026-05-31","suspect":false,"type":"选择","title":"利用高效液相色谱法分离生物碱时,通常使用的流动相为","options":{"A":"弱酸性","B":"弱碱性","C":"中性","D":"强酸性"},"answer":"B","chapter":"9. 生物碱","isRecall":false,"answerText" :1780232092333,"suspect":false,"examProb":"了解"},{"id":"tr-0935","course":"天然药物化学","type":"名词解释记忆","chapter":"10. 其他","number":1,"title":"大环内酯类化合物","answerText":"大环内酯类化合物(macrolides) 是海洋生物中常见的一类具有抗肿瘤活性的化合物,结构中含有内酯环,环的大小差别较大,从十元环到六十元环都有。","options":{},"answer":"名词解释","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0936","course":"天然药物化学","type":"名词解释记忆","chapter":"10. 其他","number":2,"title":"乙酸原化合物","answerText":"乙酸原化合物(acetogenin)系指从乙酸乙酯或乙酰辅酶 A 生物合成的一类化合物。","options":{},"answer":"名词解释","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0937","course":"天然药物化学","type":"填空记忆","chapter":"10. 其他","number":1,"title":"海参中除了分离出多糖之外, 还分离出 ,作为阴离子表面活性剂作用于红血球,表现出 作用。","answerText":"皂苷,较强的溶血。","options":{},"answer":"填空题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0938","course":"天然药物化学","type":"填空记忆","chapter":"10. 其他","number":2,"title":"从海洋生物中分离得到的前列腺素类成分,通常含有 元素。一般都具有 活性。","answerText":"卤族,抗肿瘤","options":{},"answer":"填空题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0939","course":"天然药物化学","type":"填空记忆","chapter":"10. 其他","number":3,"title":"内酯环含有氧环的大环内酯类化合物除内酯环外,还可能含有 、 、 等。","answerText":"三元氧环,五元氧环,六元氧环。","options":{},"answer":"填空题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0940","course":"天然药物化学","type":"填空记忆","chapter":"10. 其他","number":4,"title":"酯环上超过一个酯键的大环内酯化合物,称为 。","answerText":"多聚内酯。","options":{},"answer":"填空题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0941","course":"天然药物化学","type":"填空记忆","chapter":"10. 其他","number":5,"title":"聚醚类化合物的特点是结构中含有多个以 为主的 环,醚环间 骈合,形成骈合后聚醚的同侧为 结构,氧原子 排列,形成一个梯子状结构,又称 。","answerText":"六元环,醚,反式,顺式,相间,聚醚梯。","options":{},"answer":"填空题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0942","course":"天然药物化学","type":"填空记忆","chapter":"10. 其他","number":6,"title":"乙酸原化合物系指从 或 生物合成的一类化合物, 根据结构特点分为以下不同的结构类型: 、 、 、 。","answerText":"乙酸乙酯,乙酰辅酶 A,直链化合物,环氧化合物,碳环化合物,其它类似乙酸原化合物。","options":{},"answer":"填空题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0943","course":"天然药物化学","type":"简答记忆","chapter":"10. 其他","number":1,"title":"目前研究发现的海洋天然产物中结构特殊、生理活性明显的化合物主要有哪几种类型?主要表现出什么生物活性?","answerText":"目前研究发现的海洋天然产物中结构特殊、生理活性明显的化合物主要有以下几种类型及活性:\n①大环内酯类化合物多具有抗肿瘤活性, 有的也可抗菌, 抗病毒。如从海绵 Thenonellswinhoei 中分离得到了具有广谱抗肿瘤活性和抗真菌活性的 swinholide A、B、C 等。②聚醚化合物, 是海洋生物中的一类毒性成分。可抗肿瘤, 作用于神经系统等。如从海绵 (Halichondrai okadai) 中分离得到的 halichondrin B 可抑制小鼠黑色素瘤细胞。③肽类化合物,具有多种生物活性,常见抗肿瘤,抗病毒等,有些已进入临床研究。如从芋螺属类软体动物中得到的芋螺毒素是一类具有神经药理活性的多肽, 具有镇痛、神经保护、抗惊厥、镇咳等作用, 应用潜力巨大, 目前已进入Ⅲ期临床研究。④\nC15 乙酸原化合物。⑤前列腺素类似物, 除表现前列腺素样活性外, 还表现出一定的抗肿瘤活性, 特别是一些含有卤素元素取代的化合物,如从八方珊瑚中分离得到的 punaglandin 作为抗肿瘤药临床研究有效。","options":{},"answer":"简答题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0944","course":"天然药物化学","type":"简答记忆","chapter":"10. 其他","number":2,"title":"已发现的海洋活性产物按活性分类主要有哪些?","answerText":"①海洋抗肿瘤物质。从海绵、海兔、软珊瑚等海洋生物中得到了很多具有抗肿瘤活性的大环内酯、聚醚和海洋多肽类物质。②神经作用物质。主要为海洋毒素,如海兔毒素、海参毒素、河豚毒素等可作用于离子通道,对神经系统起作用。③心血管作用物质。如岩沙海葵毒素、类水母毒素等具有降压、抗心率失常等作用。④抗 AID 海洋药物。⑤其它还有免疫抑制、抗结核等作用物质。","options":{},"answer":"简答题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-0945","course":"天然药物化学","type":"简答记忆","chapter":"10. 其他","number":3,"title":"简述聚醚类化合物的结构特点。\n\n第十一章 天然产物的研究开发","answerText":"聚醚类化合物的特点是结构中含有多个以六元环为主的醚环, 醚环间反式骈合, 形成骈合后聚醚的同侧为顺式结构,氧原子相间排列,形成一个梯子状结构,又称聚醚梯。常见聚醚梯类化合物多有无规则取代的甲基等, 一般极性低,为脂溶性毒素。另一类聚醚化合物, 同样含有高度氧化的碳链,但仅部分羟基形成醚环,多数羟基游离,与聚醚梯类化合物不同,属于水溶性聚醚。有的聚醚类化合物可以首尾相连形成大环内酯或局部形成大环。\n\n第十一章 参考答案","options":{},"answer":"简答题","mnemonic":"","priority":"重要","isRecall":true,"sourceId":5,"suspect":false,"addedAt":"2026-05-31","examProb":"常考"},{"id":"tr-412","course":"天然药物化学","type":"选择","chapter":"10. 其他","number":"1","title":"目前从海参中分离的生物活性成分是","answerText":"","options":{"A":"多糖","B":"萜类","C":"生物碱","D":"苷类","E":"挥发油"},"answer":"A","mnemonic":"了解｜doubao习题汇总","priority":"了解","isRecall":false,"sourceId":1,"addedAt":1780168175365,"suspect":false,"examProb":"了解"},{"id":"tr-414","course":"天然药物化学","type":"多选","chapter":"10. 其他","number":"1","title":"目前从海洋生物中获得的成分有","answerText":"","options":{"A":"前列腺素类","B":"聚醚类化合物","C":"肽类化合物","D":"大环内酯类","E":"C15 乙酸原化合物"},"answer":"ABCDE","mnemonic":"了解｜doubao习题汇总","priority":"了解","isRecall":false,"sourceId":1,"addedAt":1780168175367,"suspect":false,"examProb":"了解"},{"id":"tr-415","course":"天然药物化学","type":"多选","chapter":"10. 其他","number":"2","title":"大环内酯类化合物根据结构不同,根据结构类型不同可以分为","answerText":"","options":{"A":"前列腺素类","B":"简单大环内酯类","C":"内酯环含有氧环的大环内酯","D":"多聚内酯","E":"其他大环内酯类"},"answer":"BCDE","mnemonic":"了解｜doubao习题汇总","priority":"了解","isRecall":false,"sourceId":1,"addedAt":1780168175368,"suspect":false,"examProb":"了解"},{"id":"tr-0816","course":"天然药物化学","type":"选择","chapter":"11. 天然产物的研究开发","number":"2","title":"系统预试验的基本过程是( )","answerText":"","options":{"A":"47%","B":"57%","C":"67%","D":"77%","E":"87%"},"answer":"E","mnemonic":"重要｜习题汇总含答案 [答案据习题汇总答案键校正:B→E]","priority":"重要","isRecall":false,"sourceId":5,"addedAt":1780232092336,"suspect":false,"examProb":"了解"},{"id":"tr-0817","course":"天然药物化学","type":"多选","chapter":"11. 天然产物的研究开发","number":"1","title":"水提预试液可检查的成分有( )","answerText":"","options":{"A":"前列腺素类","B":"聚醚类化合物","C":"肽类化合物","D":"大环内酯类","E":"C15 乙酸原化合物"},"answer":"ABCDE","mnemonic":"重要｜习题汇总含答案 [答案据习题汇总答案键校正:BCD→ABCDE]","priority":"重要","isRecall":false,"sourceId":5,"addedAt":1780232092343,"suspect":false,"examProb":"了解"},{"id":"tr-0818","course":"天然药物化学","type":"多选","c
