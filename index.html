        // --- 4. 主应用组件 App ---

        const App = () => {
            const [questions, setQuestions] = useState([]);
            const [wrongQuestionIds, setWrongQuestionIds] = useState(new Set());
            const [view, setView] = useState('home'); 
            const [currentCourse, setCurrentCourse] = useState(null);
            const [currentChapter, setCurrentChapter] = useState(null);
            const [studyMode, setStudyMode] = useState('quiz'); // 'quiz' | 'recite'
            
            // 加载状态锁
            const [isLoaded, setIsLoaded] = useState(false);
            
            const [isShuffleQuestions, setIsShuffleQuestions] = useState(false);
            const [isShuffleOptions, setIsShuffleOptions] = useState(false);

            const [importText, setImportText] = useState('');
            const [importCourseName, setImportCourseName] = useState(DEFAULT_COURSE_NAME);
            
            const [renamingCourseName, setRenamingCourseName] = useState(null);
            
            const [studyQueue, setStudyQueue] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [showAnswer, setShowAnswer] = useState(false);
            
            const [selectedOption, setSelectedOption] = useState(null);
            const [selectedMultiOptions, setSelectedMultiOptions] = useState(new Set());
            
            const [editingQuestion, setEditingQuestion] = useState(null);

            const [modalConfig, setModalConfig] = useState({ isOpen: false, type: 'alert', title: '', message: '', onConfirm: () => {}, onCancel: () => {} });

            const showAlert = (title, message) => {
                setModalConfig({ isOpen: true, type: 'alert', title, message, onConfirm: () => setModalConfig(prev => ({ ...prev, isOpen: false })), onCancel: () => setModalConfig(prev => ({ ...prev, isOpen: false })) });
            };

            const showConfirm = (title, message, onConfirm, type = 'confirm') => {
                setModalConfig({ isOpen: true, type, title, message, onConfirm: () => { onConfirm(); setModalConfig(prev => ({ ...prev, isOpen: false })); }, onCancel: () => setModalConfig(prev => ({ ...prev, isOpen: false })) });
            };

            // 初始化加载
            useEffect(() => {
                try {
                    const savedQuestions = localStorage.getItem('med_quiz_questions');
                    const savedWrong = localStorage.getItem('med_quiz_wrong');
                    const savedSettings = localStorage.getItem('med_quiz_settings');
                    
                    let parsedQuestions = savedQuestions ? JSON.parse(savedQuestions) : [];
                    const defaultIds = new Set(DEFAULT_QUESTIONS.map(q => q.id));
                    // 自动补全ID，并移除已考完的药剂学题库和已内置的默认中医题。
                    parsedQuestions = parsedQuestions
                        .filter(q => q.course !== '药剂学' && !defaultIds.has(q.id))
                        .map(q => q.id ? q : { ...q, id: generateId() });
                    const seededQuestions = [...DEFAULT_QUESTIONS, ...parsedQuestions];
                    const validIds = new Set(seededQuestions.map(q => q.id));
                    setQuestions(seededQuestions);

                    if (savedWrong) {
                        const cleanedWrong = JSON.parse(savedWrong).filter(id => validIds.has(id));
                        setWrongQuestionIds(new Set(cleanedWrong));
                    }
                    
                    if (savedSettings) {
                        const settings = JSON.parse(savedSettings);
                        setIsShuffleQuestions(settings.shuffleQuestions || false);
                        setIsShuffleOptions(settings.shuffleOptions || false);
                    }
                    
                    setIsLoaded(true);
                } catch (e) {
                    console.error("加载缓存失败", e);
                    setQuestions(DEFAULT_QUESTIONS);
                    setWrongQuestionIds(new Set());
                    setIsLoaded(true);
                }
            }, []);

            // 持久化存储
            useEffect(() => {
                if (isLoaded) {
                    localStorage.setItem('med_quiz_questions', JSON.stringify(questions));
                }
            }, [questions, isLoaded]);

            useEffect(() => {
                if (isLoaded) {
                    localStorage.setItem('med_quiz_wrong', JSON.stringify([...wrongQuestionIds]));
                }
            }, [wrongQuestionIds, isLoaded]);

            useEffect(() => {
                if (isLoaded) {
                    localStorage.setItem('med_quiz_settings', JSON.stringify({ shuffleQuestions: isShuffleQuestions, shuffleOptions: isShuffleOptions }));
                }
            }, [isShuffleQuestions, isShuffleOptions, isLoaded]);

            // --- 核心逻辑 ---

            const parseCSV = (text, courseName) => {
                const lines = text.trim().split('\n');
                const newQuestions = [];
                const startIdx = lines[0].includes('题型') ? 1 : 0;

                for (let i = startIdx; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    // 简单的CSV解析
                    const cols = line.split(',').map(c => c.trim());
                    if (cols.length < 10) continue; 

                    newQuestions.push({
                        id: generateId(),
                        course: courseName,
                        type: cols[0]?.trim(), // 确保去掉首尾空格
                        chapter: cols[1],
                        number: cols[2],
                        title: cols[3],
                        options: {
                            A: cols[4].replace(/^A\./, ''),
                            B: cols[5].replace(/^B\./, ''),
                            C: cols[6].replace(/^C\./, ''),
                            D: cols[7].replace(/^D\./, ''),
                            E: cols[8].replace(/^E\./, '')
                        },
                        answer: cols[9].toUpperCase().replace(/[^A-E]/g, ''),
                        mnemonic: cols[10] || '', 
                        addedAt: Date.now()
                    });
                }
                return newQuestions;
            };

            const handleImport = () => {
                if (!importText || !importCourseName) { showAlert("提示", "请输入课程名称和题目数据"); return; }
                const parsedQs = parseCSV(importText, importCourseName);
                if (parsedQs.length === 0) { showAlert("导入失败", "未识别到有效题目，请检查格式"); return; }

                const existingSignatures = new Set(questions.map(q => `${q.course}-${q.chapter}-${q.title.trim()}`));
                const uniqueNewQs = parsedQs.filter(q => {
                    const signature = `${q.course}-${q.chapter}-${q.title.trim()}`;
                    if (existingSignatures.has(signature)) return false;
                    existingSignatures.add(signature);
                    return true;
                });

                if (uniqueNewQs.length > 0) {
                    setQuestions(prev => [...prev, ...uniqueNewQs]);
                    setImportText('');
                    showAlert("导入成功", `✅ 新增题目：${uniqueNewQs.length} 道\n🚫 跳过重复：${parsedQs.length - uniqueNewQs.length} 道`);
                    setView('home');
                } else {
                    showAlert("提示", "所有题目均已存在，未进行导入。");
                }
            };

            const handleRenameCourse = (newName) => {
                if (!newName || !newName.trim()) return;
                if (newName === renamingCourseName) { setRenamingCourseName(null); return; }
                setQuestions(prev => prev.map(q => q.course === renamingCourseName ? { ...q, course: newName } : q));
                setRenamingCourseName(null);
            };

            // 核心启动函数：增加 typeFilter 参数
            const startStudy = (course, chapter, mode = 'quiz', forceShuffleQuestions = isShuffleQuestions, typeFilter = '全部') => {
                let queue;
                if (chapter === '所有题目') queue = questions.filter(q => q.course === course);
                else queue = questions.filter(q => q.course === course && q.chapter === chapter);
                
                // 增加题型筛选逻辑
                if (typeFilter && typeFilter !== '全部') {
                    queue = queue.filter(q => q.type === typeFilter);
                }
                
                if (queue.length === 0) { 
                    const msg = typeFilter !== '全部' ? `该章节下没有【${typeFilter}】类型的题目` : "该章节没有题目";
                    showAlert("提示", msg); 
                    return; 
                }
                
                if (forceShuffleQuestions) queue = shuffleArray(queue);

                setStudyQueue(queue);
                setCurrentCourse(course);
                // 如果有题型筛选，标题带上题型
                setCurrentChapter(typeFilter !== '全部' ? `${chapter} (${typeFilter})` : chapter);
                setStudyMode(mode);
                setCurrentIndex(0);
                
                // 初始化第一个卡片状态
                setSelectedOption(null);
                setSelectedMultiOptions(new Set());
                // 如果是背题模式，默认显示答案
                setShowAnswer(mode === 'recite');
                
                setView('study');
            };

            const startWrongReview = (course) => {
                let queue = questions.filter(q => wrongQuestionIds.has(q.id));
                if (course) queue = queue.filter(q => q.course === course);
                
                if (queue.length === 0) { showAlert("提示", "该分类下暂无错题！"); return; }
                queue = shuffleArray(queue);

                setStudyQueue(queue);
                setCurrentCourse(course || '错题本');
                setCurrentChapter('复习模式');
                setStudyMode('quiz'); // 错题复习默认为刷题模式
                setCurrentIndex(0);
                
                setSelectedOption(null);
                setSelectedMultiOptions(new Set());
                setShowAnswer(false);

                setView('study');
            };

            const resetCardState = useCallback((targetMode) => {
                setShowAnswer(targetMode === 'recite');
                setSelectedOption(null);
                setSelectedMultiOptions(new Set());
            }, []);

            const handleAnswer = useCallback((optionKey) => {
                // 如果已经显示答案（包括背题模式），则不再处理答题逻辑（不记录对错）
                if (showAnswer) return;
                
                const currentQ = studyQueue[currentIndex];
                if (optionKey === 'SHOW' || currentQ.isRecall) {
                    setShowAnswer(true);
                    return;
                }
                const isMulti = currentQ.type && (currentQ.type.includes('多') || currentQ.type.includes('Multi'));
                if (isMulti) {
                    setSelectedMultiOptions(prev => {
                        const newSet = new Set(prev);
                        if (newSet.has(optionKey)) newSet.delete(optionKey); else newSet.add(optionKey);
                        return newSet;
                    });
                } else {
                    setSelectedOption(optionKey); 
                    setShowAnswer(true);
                    if (optionKey !== currentQ.answer) setWrongQuestionIds(prev => new Set(prev).add(currentQ.id));
                }
            }, [showAnswer, studyQueue, currentIndex]);

            const handleSubmitMulti = useCallback(() => {
                const currentQ = studyQueue[currentIndex];
                setShowAnswer(true);
                const userAns = Array.from(selectedMultiOptions).sort().join('');
                const correctAns = currentQ.answer.split('').sort().join('');
                if (userAns !== correctAns) setWrongQuestionIds(prev => new Set(prev).add(currentQ.id));
            }, [selectedMultiOptions, studyQueue, currentIndex]);

            const nextQuestion = useCallback(() => {
                if (currentIndex < studyQueue.length - 1) { 
                    setCurrentIndex(prev => prev + 1); 
                    resetCardState(studyMode); 
                } else { 
                    showConfirm("恭喜", "本章节题目已刷完！返回首页？", () => setView('home')); 
                }
            }, [currentIndex, studyQueue.length, studyMode, resetCardState]);

            const prevQuestion = useCallback(() => {
                if (currentIndex > 0) { 
                    setCurrentIndex(prev => prev - 1); 
                    resetCardState(studyMode); 
                }
            }, [currentIndex, studyMode, resetCardState]);

            const deleteCourse = (courseName) => {
                showConfirm("确认删除", `确定要删除《${courseName}》下的所有题目吗？`, () => setQuestions(prev => prev.filter(q => q.course !== courseName)), 'danger');
            };

            const requestFixData = () => {
                showConfirm("高级修复", "这将强制重置所有题目的 ID。\n\n解决无法删除的问题。", () => {
                    const fixedQuestions = questions.map(q => ({ ...q, id: generateId() }));
                    setQuestions(fixedQuestions);
                    localStorage.setItem('med_quiz_questions', JSON.stringify(fixedQuestions));
                    showAlert("修复完成", "所有题目已分配全新 ID。");
                }, 'danger');
            };

            const requestDeleteSingle = (id) => {
                if (!id) { showAlert("错误", "ID缺失"); return; }
                showConfirm("删除题目", "确定要删除吗？", () => setQuestions(prev => prev.filter(q => q.id !== id)), 'danger');
            };

            const handleQuestionShuffleChange = (newValue) => {
                showConfirm("设置变更", "更改【题目乱序】将重新开始本章节，是否继续？", () => {
                    setIsShuffleQuestions(newValue);
                    // 简单重启当前章节
                    const simpleChapterName = currentChapter.includes(' (') ? currentChapter.split(' (')[0] : currentChapter;
                    // 尝试从当前标题推断类型
                    let currentType = '全部';
                    if (currentChapter.includes('(')) {
                        const match = currentChapter.match(/\((.*?)\)/);
                        if (match) currentType = match[1];
                    }
                    startStudy(currentCourse, simpleChapterName, studyMode, newValue, currentType);
                });
            };

            const courses = [...new Set(questions.map(q => q.course))];

            return (
                <div className="min-h-screen pb-10">
                    <CustomModal {...modalConfig} />
                    <RenameModal isOpen={!!renamingCourseName} currentName={renamingCourseName || ''} onConfirm={handleRenameCourse} onCancel={() => setRenamingCourseName(null)} />

                    <div className="bg-teal-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center h-16">
                        <div className="flex items-center space-x-2 cursor-pointer" onClick={() => setView('home')}>
                            <Icons.BookOpen className="h-6 w-6" />
                            <h1 className="text-xl font-bold">天然药物化学刷题</h1>
                        </div>
                        <div className="flex space-x-4">
                            {view !== 'home' && <button onClick={() => setView('home')} className="flex items-center text-sm opacity-90 hover:opacity-100 bg-teal-700 px-3 py-1 rounded-full"><Icons.ArrowLeft className="h-4 w-4 mr-1" /> 返回</button>}
                        </div>
                    </div>

                    <div className="max-w-3xl mx-auto p-4">
                        
                        {view === 'home' && (
                        <div className="space-y-6 animate-fade-in">
                            {!isLoaded && <div className="text-center py-4 text-gray-500">正在加载题库...</div>}
                            
                            {isLoaded && (
                            <>
                                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                                    <div className="flex justify-between items-center mb-6">
                                        <div>
                                            <p className="text-gray-500 text-sm">总题库数量</p>
                                            <p className="text-3xl font-bold text-teal-600">{questions.length}</p>
                                        </div>
                                        <div>
                                            <p className="text-gray-500 text-sm">累计错题</p>
                                            <p className="text-3xl font-bold text-red-500">{wrongQuestionIds.size}</p>
                                        </div>
                                        <button onClick={() => setView('import')} className="bg-teal-600 text-white px-4 py-2 rounded-lg flex items-center shadow hover:bg-teal-700 transition">
                                            <Icons.Plus className="h-4 w-4 mr-1" /> 导入
                                        </button>
                                    </div>
                                    <div className="border-t pt-4 flex space-x-6">
                                        <label className="flex items-center cursor-pointer select-none">
                                            <div className="relative">
                                                <input type="checkbox" className="sr-only" checked={isShuffleQuestions} onChange={e => setIsShuffleQuestions(e.target.checked)} />
                                                <div className={`block w-10 h-6 rounded-full transition ${isShuffleQuestions ? 'bg-teal-500' : 'bg-gray-300'}`}></div>
                                                <div className={`dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition transform ${isShuffleQuestions ? 'translate-x-4' : ''}`}></div>
                                            </div>
                                            <div className="ml-3 text-sm font-medium text-gray-700 flex items-center"><Icons.Shuffle className="w-4 h-4 mr-1 text-gray-500" /> 题目乱序</div>
                                        </label>
                                        <label className="flex items-center cursor-pointer select-none">
                                            <div className="relative">
                                                <input type="checkbox" className="sr-only" checked={isShuffleOptions} onChange={e => setIsShuffleOptions(e.target.checked)} />
                                                <div className={`block w-10 h-6 rounded-full transition ${isShuffleOptions ? 'bg-teal-500' : 'bg-gray-300'}`}></div>
                                                <div className={`dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition transform ${isShuffleOptions ? 'translate-x-4' : ''}`}></div>
                                            </div>
                                            <div className="ml-3 text-sm font-medium text-gray-700 flex items-center"><Icons.ListOrdered className="w-4 h-4 mr-1 text-gray-500" /> 选项乱序</div>
                                        </label>
                                    </div>
                                </div>

                                {wrongQuestionIds.size > 0 && (
                                <div onClick={() => startWrongReview(null)} className="bg-red-50 border border-red-100 p-4 rounded-xl flex items-center justify-between cursor-pointer hover:bg-red-100 transition">
                                    <div className="flex items-center space-x-3">
                                    <Icons.AlertCircle className="text-red-500 h-6 w-6" />
                                    <div><h3 className="font-bold text-red-700">复习所有错题</h3><p className="text-xs text-red-500">攻克薄弱环节</p></div>
                                    </div>
                                    <Icons.ChevronRight className="text-red-400" />
                                </div>
                                )}

                                <h2 className="text-lg font-bold mt-8 mb-4 text-gray-700">我的题库</h2>
                                {courses.length === 0 ? (
                                <div className="text-center py-10 bg-white rounded-xl border border-dashed border-gray-300">
                                    <p className="text-gray-400">暂无题库，请点击上方导入</p>
                                    <p className="text-xs text-gray-400 mt-2">支持 CSV 格式批量导入</p>
                                </div>
                                ) : (
                                <div className="grid gap-4">
                                    {courses.map(course => (
                                    <CourseCard 
                                        key={course} 
                                        courseName={course} 
                                        questions={questions.filter(q => q.course === course)}
                                        onStart={startStudy}
                                        onDelete={() => deleteCourse(course)}
                                        onManage={() => { setCurrentCourse(course); setView('manage'); }}
                                        onRename={() => setRenamingCourseName(course)} 
                                    />
                                    ))}
                                </div>
                                )}
                            </>
                            )}
                        </div>
                        )}

                        {view === 'import' && (
                        <div className="bg-white p-6 rounded-xl shadow-sm space-y-4">
                            <h2 className="text-xl font-bold flex items-center"><Icons.Upload className="mr-2 text-teal-600" /> 批量导入题目</h2>
                            <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">所属课程/科目</label>
                            <input type="text" value={importCourseName} onChange={(e) => setImportCourseName(e.target.value)} className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none" placeholder="例如：中医药学概论" />
                            </div>
                            <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">CSV 数据 (支持第11列作为速记/解析)</label>
                            <textarea className="w-full h-64 border border-gray-300 rounded-lg p-2 font-mono text-xs focus:ring-2 focus:ring-teal-500 outline-none" placeholder={`格式：题型,章节,题号,题干,A,B,C,D,E,答案,速记口诀(可选)`} value={importText} onChange={(e) => setImportText(e.target.value)}></textarea>
                            <div className="flex justify-between mt-2">
                                <button onClick={() => setImportText(`单选,绪论,1,金元四家中寒凉派医家是？,刘完素,李杲,张从正,朱震亨,,A,寒凉派=刘完素\n单选,中药学基础,2,辛味的作用特点是？,补缓,散行,收敛,软坚,,B,辛能散行`)} className="text-xs text-teal-600 hover:underline">使用示例文本</button>
                            </div>
                            </div>
                            <div className="flex space-x-3 pt-4">
                            <button onClick={handleImport} className="flex-1 bg-teal-600 text-white py-2 rounded-lg font-bold hover:bg-teal-700 transition">确认导入</button>
                            <button onClick={() => setView('home')} className="px-4 py-2 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50">取消</button>
                            </div>
                        </div>
                        )}

                        {view === 'study' && studyQueue.length > 0 && (
                        <StudySession 
                            question={studyQueue[currentIndex]}
                            total={studyQueue.length}
                            current={currentIndex + 1}
                            onNext={nextQuestion}
                            onPrev={prevQuestion}
                            onAnswer={handleAnswer} 
                            onSubmitMulti={handleSubmitMulti}
                            showAnswer={showAnswer}
                            selectedOption={selectedOption}
                            selectedMultiOptions={selectedMultiOptions}
                            isWrong={wrongQuestionIds.has(studyQueue[currentIndex].id)}
                            toggleWrong={(id) => setWrongQuestionIds(prev => { const n = new Set(prev); if (n.has(id)) n.delete(id); else n.add(id); return n; })}
                            globalShuffleOptions={isShuffleOptions}
                            globalShuffleQuestions={isShuffleQuestions}
                            onToggleOptionShuffle={(val) => setIsShuffleOptions(val)}
                            onToggleQuestionShuffle={handleQuestionShuffleChange}
                            studyMode={studyMode}
                        />
                        )}

                        {view === 'manage' && (
                        <ManageView 
                            course={currentCourse}
                            questions={questions.filter(q => q.course === currentCourse)}
                            onRequestDelete={requestDeleteSingle}
                            onUpdateQuestion={(updatedQ) => {
                            setQuestions(prev => prev.map(q => q.id === updatedQ.id ? updatedQ : q));
                            setEditingQuestion(null);
                            }}
                            editingQuestion={editingQuestion}
                            setEditingQuestion={setEditingQuestion}
                            onBack={() => setView('home')}
                            onRequestFix={requestFixData}
                        />
                        )}

                    </div>
                </div>
            );
        }

        // --- 5. 子组件 ---

        function CourseCard({ courseName, questions, onStart, onDelete, onManage, onRename }) {
            const [expanded, setExpanded] = useState(false);
            // 新增：题型筛选状态
            const [selectedType, setSelectedType] = useState('全部');
            const [selectedProb, setSelectedProb] = useState('全部');
            
            // 动态获取该课程下的所有题型
            const types = useMemo(() => {
                const t = new Set(questions.map(q => q.type).filter(Boolean)); // 过滤掉空值
                return ['全部', ...Array.from(t).sort()];
            }, [questions]);

            // 根据选中的题型，预先过滤出题目
            const filteredQuestions = useMemo(() => {
                let _qs = (selectedType === '全部') ? questions : questions.filter(q => q.type === selectedType);
                if (selectedProb !== '全部') {
                    if (selectedProb === '仅必考') _qs = _qs.filter(q => q.examProb === '必考');
                    else if (selectedProb === '必考+常考') _qs = _qs.filter(q => q.examProb === '必考' || q.examProb === '常考');
                }
                return _qs;
            }, [questions, selectedType, selectedProb]);

            // 基于过滤后的题目生成章节列表
            // 这样如果某章节没有选定题型的题目，就不会显示在列表中，避免点进去是空的
            const chapters = useMemo(() => [...new Set(filteredQuestions.map(q => q.chapter))], [filteredQuestions]);

            return (
                <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden transition hover:shadow-md select-none">
                <div className="p-4 flex justify-between items-center bg-white">
                    <div className="flex-1 cursor-pointer" onClick={() => setExpanded(!expanded)}>
                    <div className="flex items-center group">
                        <h3 className="font-bold text-lg text-gray-800">{courseName}</h3>
                        <button onClick={(e) => { e.stopPropagation(); onRename(); }} className="ml-2 p-1.5 text-gray-300 hover:text-teal-600 hover:bg-teal-50 rounded-full transition opacity-0 group-hover:opacity-100" title="修改课程名称">
                            <Icons.PenLine className="w-4 h-4" />
                        </button>
                        <span className="ml-auto mr-3 text-xs bg-teal-100 text-teal-700 px-2 py-0.5 rounded-full">{questions.length} 题</span>
                    </div>
                    <p className="text-xs text-gray-400 mt-1">共 {new Set(questions.map(q => q.chapter)).size} 个章节</p>
                    </div>
                    <div className="flex items-center space-x-1">
                        <button onClick={(e) => { e.stopPropagation(); onManage(); }} className="p-3 text-gray-400 hover:text-teal-600 hover:bg-teal-50 rounded-full transition" title="管理题目"><Icons.Settings className="h-5 w-5" /></button>
                        <button onClick={(e) => { e.stopPropagation(); onDelete(); }} className="p-3 text-gray-400 hover:text-red-500 hover:red-50 rounded-full transition" title="删除题库"><Icons.Trash2 className="h-5 w-5" /></button>
                    </div>
                </div>
                {expanded && (
                    <div className="bg-gray-50 border-t border-gray-100 p-3 grid grid-cols-1 gap-2 animate-fade-in">
                    
                    {/* 新增：题型筛选条 */}
                    <div className="mb-2 flex items-center space-x-2 overflow-x-auto pb-2 no-scrollbar">
                        <span className="text-xs font-bold text-gray-400 flex-shrink-0 flex items-center"><Icons.Filter className="w-3 h-3 mr-1"/>题型:</span>
                        {types.map(t => (
                            <button 
                                key={t}
                                onClick={() => setSelectedType(t)}
                                className={`text-xs px-3 py-1 rounded-full whitespace-nowrap transition border ${
                                    selectedType === t 
                                    ? 'bg-teal-600 text-white border-teal-600 shadow-sm' 
                                    : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'
                                }`}
                            >
                                {t}
                            </button>
                        ))}
                    </div>
                    {/* 新增：考概率筛选条 */}
                    <div className="mb-2 flex items-center space-x-2 overflow-x-auto pb-2 no-scrollbar">
                        <span className="text-xs font-bold text-gray-400 flex-shrink-0 flex items-center"><Icons.Filter className="w-3 h-3 mr-1"/>考概率:</span>
                        {['全部','仅必考','必考+常考'].map(p => (
                            <button
                                key={p}
                                onClick={() => setSelectedProb(p)}
                                className={`text-xs px-3 py-1 rounded-full whitespace-nowrap transition border ${
                                    selectedProb === p
                                    ? 'bg-rose-600 text-white border-rose-600 shadow-sm'
                                    : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'
                                }`}
                            >
                                {p}
                            </button>
                        ))}
                    </div>

                    {/* 总复习按钮 - 显示筛选后的数量 */}
                    <div className="col-span-1 bg-teal-50 p-3 rounded-lg border border-teal-200 flex justify-between items-center group">
                        <div className="flex items-center text-teal-800 font-bold text-sm">
                            <Icons.Layers className="w-4 h-4 mr-2" />
                            <span>所有题目 ({filteredQuestions.length}题)</span>
                        </div>
                        <div className="flex space-x-2">
                            <button onClick={() => onStart(courseName, '所有题目', 'recite', undefined, selectedType)} className="text-xs px-3 py-1.5 bg-white text-teal-600 border border-teal-200 rounded-md hover:bg-teal-600 hover:text-white transition flex items-center">
                                <Icons.BookOpen className="w-3 h-3 mr-1"/> {selectedType === '全部' ? '背题' : `背题(${selectedType})`}
                            </button>
                            <button onClick={() => onStart(courseName, '所有题目', 'quiz', undefined, selectedType)} className="text-xs px-3 py-1.5 bg-teal-600 text-white rounded-md hover:bg-teal-700 shadow-sm transition flex items-center">
                                <Icons.PenLine className="w-3 h-3 mr-1"/> {selectedType === '全部' ? '刷题' : `刷题(${selectedType})`}
                            </button>
                        </div>
                    </div>
                    
                    {/* 章节列表 - 仅显示有当前题型的章节 */}
                    {chapters.length === 0 && (
                        <div className="text-center py-4 text-gray-400 text-sm">此筛选条件下没有章节</div>
                    )}
                    
                    {chapters.map(chapter => {
                        // 计算该章节下符合筛选的题目数
                        const count = filteredQuestions.filter(q => q.chapter === chapter).length;
                        return (
                            <div key={chapter} className="bg-white p-3 rounded-lg border border-gray-200 hover:border-teal-500 transition text-sm flex justify-between items-center">
                                <div className="flex items-center overflow-hidden mr-2">
                                    <span className="truncate font-medium text-gray-700">{chapter}</span>
                                    <span className="ml-2 text-xs text-gray-400 flex-shrink-0">({count})</span>
                                </div>
                                <div className="flex space-x-2 flex-shrink-0">
                                    <button onClick={() => onStart(courseName, chapter, 'recite', undefined, selectedType)} className="text-xs px-2 py-1.5 bg-gray-50 text-gray-600 border border-gray-200 rounded-md hover:bg-teal-50 hover:text-teal-600 hover:border-teal-200 transition flex items-center">
                                        <Icons.BookOpen className="w-3 h-3"/>
                                    </button>
                                    <button onClick={() => onStart(courseName, chapter, 'quiz', undefined, selectedType)} className="text-xs px-3 py-1.5 bg-white text-teal-600 border border-teal-200 rounded-md hover:bg-teal-600 hover:text-white transition flex items-center">
                                        <Icons.PenLine className="w-3 h-3 mr-1"/> {selectedType === '全部' ? '刷题' : selectedType}
                                    </button>
                                </div>
                            </div>
                        );
                    })}
                    </div>
                )}
                </div>
            );
        }

        function StudySession({ 
            question, total, current, onNext, onPrev, onAnswer, onSubmitMulti, showAnswer, 
            selectedOption, selectedMultiOptions, isWrong, toggleWrong,
            globalShuffleOptions, globalShuffleQuestions, onToggleOptionShuffle, onToggleQuestionShuffle,
            studyMode
        }) {
            const touchStartX = useRef(null);
            const touchEndX = useRef(null);
            const minSwipeDistance = 50;
            const [showSettings, setShowSettings] = useState(false);

            const isMulti = question.type && (question.type.includes('多') || question.type.includes('Multi'));
            const isRecall = !!question.isRecall;

            const displayOptions = useMemo(() => {
                let opts = Object.entries(question.options).filter(([key, text]) => text).map(([key, text]) => ({ key, text }));
                if (globalShuffleOptions) opts = shuffleArray(opts);
                return opts;
            }, [question.id, globalShuffleOptions]); 

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target?.tagName)) return;

                    if (e.key === ' ') {
                        e.preventDefault();
                        e.stopPropagation();
                        if (showAnswer) onNext();
                        else onAnswer('SHOW');
                        return;
                    }

                    if (isRecall && !showAnswer && e.key === 'Enter') onAnswer('SHOW');
                    else if (e.key === 'ArrowRight') onNext();
                    else if (e.key === 'ArrowLeft') onPrev();
                    else if (!isRecall && ['A','B','C','D','E'].includes(e.key.toUpperCase())) onAnswer(e.key.toUpperCase());
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [onNext, onPrev, onAnswer, isRecall, showAnswer]);

            const handleTouchStart = (e) => { touchStartX.current = e.targetTouches[0].clientX; touchEndX.current = null; };
            const handleTouchMove = (e) => { touchEndX.current = e.targetTouches[0].clientX; };
            const handleTouchEnd = () => {
                if (!touchStartX.current || !touchEndX.current) return;
                const distance = touchStartX.current - touchEndX.current;
                if (distance > minSwipeDistance) onNext();
                if (distance < -minSwipeDistance) onPrev();
            };

            // 智能解析逻辑
            const getAnalysis = () => {
                if (isRecall) {
                    return (
                        <div className="mt-4 p-4 bg-teal-50 rounded-lg border border-teal-100 text-sm animate-fade-in">
                            <div className="flex items-center mb-2 font-bold text-teal-800">
                                <Icons.BrainCircuit className="h-4 w-4 mr-2" />
                                参考答案
                            </div>
                            <p className="text-gray-800 leading-relaxed whitespace-pre-wrap">{question.answerText}</p>
                            {question.mnemonic && (
                                <div className="mt-3 pt-3 border-t border-teal-200/50">
                                    <div className="flex items-start text-orange-700 font-bold mb-1">
                                        <Icons.Zap className="h-4 w-4 mr-1.5 mt-0.5 fill-current" />
                                        <span>速记点拨</span>
                                    </div>
                                    <p className="text-gray-800 bg-orange-50 p-2 rounded text-sm border border-orange-100 leading-relaxed font-medium">
                                        {question.mnemonic}
                                    </p>
                                </div>
                            )}
                        </div>
                    );
                }
                const correctOptionText = question.options[question.answer] || '';
                
                let mnemonic = question.mnemonic;

                // 简单的规则引擎
                if (!mnemonic && !isMulti && correctOptionText) {
                    const title = question.title;
                    if (/[A-Za-z]/.test(title) || /[A-Za-z]/.test(correctOptionText)) {
                        const enText = title.match(/[A-Za-z\s]+/)?.[0]?.trim() || correctOptionText.match(/[A-Za-z\s]+/)?.[0]?.trim();
                        const cnText = title.replace(/[A-Za-z\s\(\)（）]/g, '') || correctOptionText.replace(/[A-Za-z\s\(\)（）]/g, '');
                        if (enText && cnText && cnText.length > 2) {
                            mnemonic = `🔤 对应记忆：${enText} = ${cnText.substring(0, 10)}`;
                        }
                    }
                    else if (title.includes('作者') || title.includes('成书') || title.includes('年代')) {
                        const bookMatch = title.match(/《([^》]+)》/);
                        if (bookMatch) {
                            const tag = title.includes('作者') ? '作者' : '年代';
                            mnemonic = `📚 ${bookMatch[0]} ${tag}是：${correctOptionText}`;
                        }
                    }
                    else if (title.includes('载药') || title.includes('数量') || title.includes('多少')) {
                        const bookMatch = title.match(/《([^》]+)》/);
                        const subject = bookMatch ? bookMatch[0] : '该书';
                        mnemonic = `🔢 ${subject} 载药：${correctOptionText}`;
                    }
                    else if (title.includes('誉为') || title.includes('称作') || title.includes('别名')) {
                        mnemonic = `🏷️ ${correctOptionText} = ${title.replace(/.*誉为|.*称作|.*别名|[（()）]/g, '').trim().substring(0, 10)}...`;
                    }

                    if (!mnemonic) {
                        let cleanTitle = title
                            .replace(/（[^）]*）|(\([^)]*\))/g, '')
                            .replace(/下列|关于|描述|错误|正确|的是|属于|是指|主要|含义|被誉为|专著|著作/g, '')
                            .trim();
                        const quoteMatch = cleanTitle.match(/[“"']([^”"']{2,})[”"']/);
                        if (quoteMatch) {
                            mnemonic = `💡 关键词 “${quoteMatch[1]}” ➔ ${correctOptionText}`;
                        } else {
                            const bookMatch = cleanTitle.match(/《([^》]+)》/);
                            if (bookMatch) {
                                    mnemonic = `📖 书籍 ${bookMatch[0]} ➔ ${correctOptionText}`;
                            } else {
                                if (cleanTitle.length > 10) cleanTitle = cleanTitle.substring(0, 8) + '...';
                                if (cleanTitle && correctOptionText) {
                                    mnemonic = `⚡️ ${cleanTitle} ➔ ${correctOptionText}`;
                                }
                            }
                        }
                    }
                }

                const analysisText = isMulti 
                    ? `正确答案：${question.answer}。` 
                    : `"${correctOptionText}" 是符合题干描述的正确选项。`;

                return (
                    <div className="mt-4 p-4 bg-teal-50 rounded-lg border border-teal-100 text-sm animate-fade-in">
                        <div className="flex items-center mb-2 font-bold text-teal-800">
                            <Icons.BrainCircuit className="h-4 w-4 mr-2" />
                            智能解析
                        </div>
                        <p>
                            <span className="font-bold">正确答案是 {question.answer}。</span>
                        </p>
                        <p className="mt-1 text-gray-600 mb-3">{analysisText}</p>
                        
                        {(mnemonic) && (
                            <div className="mt-3 pt-3 border-t border-teal-200/50">
                                <div className="flex items-start text-orange-700 font-bold mb-1">
                                    <Icons.Zap className="h-4 w-4 mr-1.5 mt-0.5 fill-current" />
                                    <span>速记点拨</span>
                                </div>
                                <p className="text-gray-800 bg-orange-50 p-2 rounded text-sm border border-orange-100 leading-relaxed font-medium">
                                    {mnemonic}
                                </p>
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full outline-none relative" onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd} tabIndex="0">
                <div className="mb-4 flex justify-between items-center text-sm text-gray-500 select-none">
                    <div className="flex items-center space-x-2">
                        <span className="font-medium bg-gray-100 px-2 py-1 rounded text-xs truncate max-w-[120px]">{question.chapter}</span>
                        <span className="font-mono text-xs">{current}/{total}</span>
                    </div>
                    <div className="relative z-20 flex items-center space-x-2">
                        {studyMode === 'recite' && <span className="text-xs bg-orange-100 text-orange-700 px-2 py-1 rounded-full font-bold flex items-center"><Icons.BookOpen className="w-3 h-3 mr-1" /> 背题模式</span>}
                        <button onClick={() => setShowSettings(!showSettings)} className={`p-1.5 rounded-full transition ${showSettings ? 'bg-teal-100 text-teal-700' : 'hover:bg-gray-100'}`}><Icons.Settings className="h-4 w-4" /></button>
                        {showSettings && (
                            <div className="absolute right-0 top-8 bg-white shadow-xl border border-gray-100 rounded-xl p-3 w-48 animate-fade-in z-30">
                                <h4 className="text-xs font-bold text-gray-400 mb-2 uppercase">当前设置</h4>
                                <label className="flex items-center justify-between cursor-pointer py-2 hover:bg-gray-50 rounded px-1">
                                    <span className="text-sm">选项乱序</span>
                                    <div className="relative">
                                        <input type="checkbox" className="sr-only" checked={globalShuffleOptions} onChange={(e) => onToggleOptionShuffle(e.target.checked)} />
                                        <div className={`block w-8 h-5 rounded-full transition ${globalShuffleOptions ? 'bg-teal-500' : 'bg-gray-300'}`}></div>
                                        <div className={`absolute left-1 top-1 bg-white w-3 h-3 rounded-full transition transform ${globalShuffleOptions ? 'translate-x-3' : ''}`}></div>
                                    </div>
                                </label>
                                <label className="flex items-center justify-between cursor-pointer py-2 hover:bg-gray-50 rounded px-1">
                                    <span className="text-sm">题目乱序</span>
                                    <div className="relative">
                                        <input type="checkbox" className="sr-only" checked={globalShuffleQuestions} onChange={(e) => onToggleQuestionShuffle(e.target.checked)} />
                                        <div className={`block w-8 h-5 rounded-full transition ${globalShuffleQuestions ? 'bg-teal-500' : 'bg-gray-300'}`}></div>
                                        <div className={`absolute left-1 top-1 bg-white w-3 h-3 rounded-full transition transform ${globalShuffleQuestions ? 'translate-x-3' : ''}`}></div>
                                    </div>
                                </label>
                            </div>
                        )}
                    </div>
                </div>

                <div className="w-full bg-gray-200 h-1.5 rounded-full mb-6">
                    <div className="bg-teal-500 h-1.5 rounded-full transition-all duration-300" style={{ width: `${(current / total) * 100}%` }}></div>
                </div>

                <div className="bg-white rounded-2xl shadow-lg p-6 mb-6 min-h-[160px] flex flex-col justify-center relative overflow-hidden select-none">
                    <div className="absolute top-0 right-0 p-2">
                        <button onClick={() => toggleWrong(question.id)} className={`p-2 rounded-full transition ${isWrong ? 'text-red-500 bg-red-50' : 'text-gray-300 hover:text-gray-400'}`}>
                        {isWrong ? <Icons.AlertCircle className="fill-current" /> : <Icons.AlertCircle />}
                        </button>
                    </div>
                    <div className="flex items-center mb-3">
                        <span className={`inline-block text-xs px-2 py-1 rounded w-fit font-bold mr-2 ${isMulti ? 'bg-purple-100 text-purple-800' : 'bg-teal-100 text-teal-800'}`}>{question.type}</span>
                        {question.isPatch && <span className="inline-block text-xs px-2 py-1 rounded w-fit font-bold mr-2 bg-amber-100 text-amber-800" title="据课堂录音整理补充，非真题原题">🆕课堂强调</span>}
                        {isMulti && <span className="text-xs text-gray-400">（请选择多个选项）</span>}
                    </div>
                    <h2 className="text-xl font-medium leading-relaxed text-gray-800">{question.title}</h2>
                </div>

                <div className="space-y-3 flex-1 overflow-y-auto pb-20 select-none no-scrollbar">
                    {isRecall && !showAnswer && (
                        <button onClick={() => onAnswer('SHOW')} className="w-full py-4 rounded-xl font-bold flex items-center justify-center transition shadow-md bg-teal-600 text-white hover:bg-teal-700 active:scale-95">
                            <Icons.Eye className="w-5 h-5 mr-2" />显示答案
                        </button>
                    )}
                    {displayOptions.map((opt) => {
                        const { key, text } = opt;
                        let stateClass = "bg-white border-gray-200 text-gray-700 hover:bg-gray-50 active:bg-gray-100";
                        let iconText = key;
                        let iconClass = "text-gray-500 border-gray-300";

                        if (showAnswer) {
                            if (isMulti) {
                                const isCorrect = question.answer.includes(key); 
                                const isSelected = selectedMultiOptions.has(key); 
                                if (isCorrect) { stateClass = "bg-green-50 border-green-500 text-green-800"; iconClass = "text-green-600 border-green-600"; }
                                else if (isSelected && !isCorrect) { stateClass = "bg-red-50 border-red-500 text-red-800"; iconClass = "text-red-600 border-red-600"; }
                                else { stateClass = "bg-gray-50 border-gray-100 text-gray-400 opacity-60"; }
                            } else {
                                if (key === question.answer) { stateClass = "bg-green-50 border-green-500 text-green-800"; iconClass = "text-green-600 border-green-600"; }
                                else if (key === selectedOption && key !== question.answer) { stateClass = "bg-red-50 border-red-500 text-red-800"; iconClass = "text-red-600 border-red-600"; }
                                else { stateClass = "bg-gray-50 border-gray-100 text-gray-400 opacity-60"; }
                            }
                        } else {
                            if (isMulti && selectedMultiOptions.has(key)) { stateClass = "bg-purple-50 border-purple-500 text-purple-800 shadow-sm"; iconClass = "bg-purple-600 text-white border-purple-600"; }
                        }

                        return (
                            <button key={key} onClick={() => onAnswer(key)} disabled={showAnswer} className={`w-full text-left p-4 rounded-xl border-2 transition-all flex items-center ${stateClass}`}>
                                <span className={`w-6 h-6 rounded-full border flex items-center justify-center text-xs mr-3 font-bold transition-colors ${iconClass}`}>{iconText}</span>
                                <span className="flex-1 font-medium">{text}</span>
                            </button>
                        );
                    })}
                    {isMulti && !showAnswer && (
                        <button onClick={onSubmitMulti} disabled={selectedMultiOptions.size === 0} className={`w-full mt-4 py-3 rounded-xl font-bold flex items-center justify-center transition shadow-md ${selectedMultiOptions.size > 0 ? 'bg-purple-600 text-white hover:bg-purple-700 active:scale-95' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}>
                            <Icons.CheckSquare className="w-5 h-5 mr-2" />确认答案
                        </button>
                    )}
                    {showAnswer && getAnalysis()}
                </div>

                <div className="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 flex justify-between items-center z-40 lg:static lg:bg-transparent lg:border-none lg:p-0 lg:mt-4 select-none">
                    <button onClick={onPrev} disabled={current === 1} className={`flex items-center px-4 py-2 rounded-lg font-medium ${current === 1 ? 'text-gray-300' : 'text-teal-600 hover:bg-teal-50'}`}><Icons.ChevronLeft className="mr-1" /> 上一题</button>
                    <span className="text-xs text-gray-400 font-mono lg:hidden">左右滑动切换</span>
                    <button onClick={onNext} className="flex items-center px-6 py-2 bg-teal-600 text-white rounded-lg font-bold shadow-md hover:bg-teal-700 active:scale-95 transition">{current === total ? '完成' : '下一题'} <Icons.ChevronRight className="ml-1" /></button>
                </div>
                </div>
            );
        }

        function ManageView({ course, questions, onRequestDelete, onUpdateQuestion, editingQuestion, setEditingQuestion, onBack, onRequestFix }) {
            
            const EditForm = ({ q }) => {
                const [formData, setFormData] = useState({...q});
                const handleChange = (field, value) => { setFormData({...formData, [field]: value}); };
                const handleOptionChange = (key, value) => { setFormData({ ...formData, options: { ...formData.options, [key]: value } }); };

                return (
                    <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 animate-fade-in">
                        <div className="bg-white rounded-xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-6 shadow-2xl">
                            <h3 className="text-lg font-bold mb-4 flex items-center text-teal-700"><Icons.Edit className="h-5 w-5 mr-2" />编辑题目</h3>
                            <div className="space-y-4">
                                <div><label className="text-xs font-bold text-gray-500 uppercase">题干</label><textarea className="w-full border rounded-lg p-3 text-sm focus:ring-2 focus:ring-teal-500 outline-none" rows={3} value={formData.title} onChange={e => handleChange('title', e.target.value)} /></div>
                                <div><label className="text-xs font-bold text-gray-500 uppercase flex items-center"><Icons.Zap className="w-3 h-3 mr-1" /> 速记/解析 (可选)</label><input className="w-full border rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none" placeholder="输入助记口诀..." value={formData.mnemonic || ''} onChange={e => handleChange('mnemonic', e.target.value)} /></div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div><label className="text-xs font-bold text-gray-500 uppercase">章节</label><input className="w-full border rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none" value={formData.chapter} onChange={e => handleChange('chapter', e.target.value)} /></div>
                                    <div><label className="text-xs font-bold text-gray-500 uppercase">正确答案</label><input className="w-full border rounded-lg p-2 focus:ring-2 focus:ring-teal-500 outline-none" value={formData.answer} onChange={e => handleChange('answer', e.target.value.toUpperCase())} /></div>
                                </div>
                                <div className="bg-gray-50 p-3 rounded-lg space-y-2">
                                    <label className="text-xs font-bold text-gray-500 uppercase">选项内容</label>
                                    {Object.keys(formData.options).map(key => (
                                        <div key={key} className="flex items-center space-x-2"><span className="font-bold w-6 text-center bg-white border rounded shadow-sm">{key}</span><input className="flex-1 border rounded p-2 text-sm focus:ring-1 focus:ring-teal-500 outline-none" value={formData.options[key]} onChange={e => handleOptionChange(key, e.target.value)} /></div>
                                    ))}
                                </div>
                            </div>
                            <div className="flex justify-end space-x-3 mt-6 border-t pt-4">
                                <button onClick={() => setEditingQuestion(null)} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">取消</button>
                                <button onClick={() => onUpdateQuestion(formData)} className="px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 shadow font-bold">保存修改</button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="bg-white rounded-xl shadow-sm min-h-[50vh]">
                    <div className="p-4 border-b flex justify-between items-center sticky top-0 bg-white rounded-t-xl z-10 shadow-sm">
                        <div className="flex items-center"><button onClick={onBack} className="mr-2 p-2 hover:bg-gray-100 rounded-full transition"><Icons.ChevronLeft className="h-5 w-5" /></button><h2 className="text-xl font-bold text-gray-800">管理：{course}</h2></div>
                        <div className="flex items-center space-x-2"><button onClick={onRequestFix} className="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded border border-blue-100 hover:bg-blue-100">修复/刷新数据</button><div className="text-sm text-gray-500 bg-gray-100 px-2 py-1 rounded">共 {questions.length} 题</div></div>
                    </div>
                    <div className="divide-y divide-gray-100">
                        {questions.map((q, idx) => (
                            <div key={q.id || idx} className="flex items-start justify-between p-4 hover:bg-gray-50 transition group">
                                <div className="flex-1 pr-4">
                                    <div className="flex items-center mb-1 flex-wrap gap-1"><span className="text-xs bg-gray-200 text-gray-600 px-1.5 py-0.5 rounded font-mono w-8 text-center">{idx + 1}</span><span className="text-xs bg-teal-50 text-teal-700 px-1.5 py-0.5 rounded border border-teal-100">{q.chapter}</span>{q.examProb && <span className={`text-xs px-1.5 py-0.5 rounded border ${q.examProb==='必考'?'bg-rose-50 text-rose-700 border-rose-200':q.examProb==='常考'?'bg-amber-50 text-amber-700 border-amber-200':'bg-gray-100 text-gray-500 border-gray-200'}`}>{q.examProb==='必考'?'🔴必考':q.examProb==='常考'?'🟡常考':'⚪了解'}</span>}</div>
                                    <span className="text-sm text-gray-800 font-medium line-clamp-2 mt-1">{q.title}</span>
                                </div>
                                <div className="flex space-x-1 shrink-0 self-center">
                                    <button onClick={(e) => { e.stopPropagation(); setEditingQuestion(q); }} className="text-blue-500 hover:bg-blue-100 p-2 rounded-lg transition" title="编辑"><Icons.Edit className="h-5 w-5" /></button>
                                    <button onClick={(e) => { e.stopPropagation(); onRequestDelete(q.id); }} className="text-red-500 hover:bg-red-100 p-2 rounded-lg transition" title="删除"><Icons.Trash2 className="h-5 w-5" /></button>
                                </div>
                            </div>
                        ))}
                    </div>
                    {editingQuestion && <EditForm q={editingQuestion} />}
                </div>
            );
        }

        // --- 6. 渲染根节点 ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
